مكنًا عقلًا لا عادةً؛ وغلوّ: ما كان مستحيلًا عقلًا وعادةً. وأجودها التبليغ ثم الإغراق."},{"q":"عرّف التنكيت","a":"أن يقصد المتكلم شيئًا بالذكر دون غيره مما يسدّ مسدّه، لنكتة فيه ترجّح مجيئه","e":"فهو اختيار مقصود للفظة بعينها من بين نظائرها لسبب بلاغي دقيق. وبه يُعرف فضل الصياغة، إذ ليس كل ما صحّ وضعُه في الموضع يصلح له."},{"q":"«بالله يا ظبيات القاع قلن لنا ... ليلايَ منكنّ أم ليلى من البشرِ» — المحسّن","a":"تجاهل العارف","e":"لأن الشاعر يعلم يقينًا أن محبوبته من البشر، لكنه ساق المعلوم مساق المجهول. والغرض البلاغي إظهار شدة الوله والمبالغة في وصف جمالها."},{"q":"مقولة: «أفضّل احترام العالم ولو بغير عطف، على عطف العالم إذا كان بغير احترام» — المحسّن","a":"العكس والتبديل","e":"لأنه قدّم جزءًا من الكلام ثم عكسه فأخّر ما قدّم وقدّم ما أخّر. وفائدته إبراز التقابل بين الحالين وترجيح إحداهما بصورة محكمة موجزة."},{"q":"ما «ما لا يستحيل بالانعكاس»؟","a":"العبارة التي تُقرأ طردًا وعكسًا على صورة واحدة","e":"ويُسمى المقلوب أو المستوي. ومنه في التنزيل تراكيب قصيرة تُقرأ من الجهتين بحروفها نفسها، ومنه في الشعر بيتٌ يُعاد ترتيب شطريه فلا يختل لفظه."},{"q":"نوع الجناس بين «كفّيه» و«فكّيه»","a":"جناس قلب","e":"لأن اللفظين اتفقا في نوع الحروف وعددها واختلفا في الترتيب فقط. وهو من الجناس الناقص، وسُمّي قلبًا لانقلاب ترتيب الحروف."},{"q":"نوع الجناس بين «مَذهَب» و«مُذهَب»","a":"جناس ناقص محرَّف","e":"لأن اللفظين اتفقا في الحروف وعددها وترتيبها واختلفا في الهيئة أي في الحركات. وسُمّي محرَّفًا لأن التحريف وقع في الضبط لا في الحروف."},{"q":"عرّف التصريع","a":"اتفاق نهاية الشطر الأول مع نهاية الشطر الثاني في البيت الأول","e":"وهو من محسنات المطالع، يؤذن السامع بقافية القصيدة وبحرها من أول بيت. ويكثر في مطالع القصائد ولا يُلتزم في سائر الأبيات."},{"q":"عرّف السجع المطرَّف","a":"ما اختلفت فيه الفاصلتان وزنًا واتفقتا رويًّا","e":"فالتوافق في الحرف الأخير حاصل، والاختلاف في عدد الحروف وهيئتها. وهو أدنى أنواع السجع رتبةً لأن التوافق فيه جزئي."},{"q":"عرّف السجع المرصَّع","a":"أن تُقابَل كل لفظة من الفقرة الأولى بلفظة من الثانية في الوزن والروي","e":"فتتفق ألفاظ الفقرتين كلها في الوزن والقافية لا الأخيرة وحدها. وهو أعلى أنواع السجع صنعةً وأشدّها كلفةً."},{"q":"عرّف السجع المتوازي","a":"أن تتفق الكلمة الأخيرة من الفقرتين في الوزن والروي دون سائر الكلمات","e":"فهو وسط بين المطرَّف والمرصَّع. وسُمّي متوازيًا لتوازي الفاصلتين في البناء الصوتي مع تحرر باقي الألفاظ."},{"q":"الفواصل القرآنية تساوي…","a":"السجع في النثر","e":"من حيث التوافق الصوتي في أواخر الآيات. غير أن جمهور العلماء آثروا تسميتها «فواصل» لا سجعًا تنزيهًا للقرآن عن مشابهة صنعة الكهّان والمتكلفين."},{"q":"«سريعٌ إلى ابن العمّ يلطم وجهه ... وليس إلى داعي الندى بسريعِ» — المحسّن","a":"ردّ العجز على الصدر","e":"لأن لفظة «سريع» تكررت في صدر البيت وفي عجزه. وبلاغته هنا أنه أحكم المفارقة: سرعة في الشر وبطء في الخير، فأدّى التكرار معنى التهكم."},{"q":"«وقبرُ حربٍ بمكانٍ قفرِ ... وليس قربَ قبرِ حربٍ قبرُ» — العيب البلاغي","a":"تنافر الحروف","e":"لتكرار القاف والباء والراء مع تقارب المخارج، فثقُل البيت على اللسان وعسُر النطق به. وهو من عيوب فصاحة الكلمة والكلام معًا."},{"q":"«سأطلب بُعد الدار عنكم لتقربوا ... وتسكب عيناي الدموع لتجمدا» — العيب","a":"تعقيد معنوي","e":"لأن الشاعر كنّى عن البكاء بسكب الدموع وعن انقطاعه بالجمود، فخفيت لوازم المعنى على السامع. والتعقيد المعنوي خفاءُ الانتقال من المعنى الأول إلى المقصود."},{"q":"«الحمد لله العليّ الأجلَل» — ما الشاهد؟","a":"«الأجلَل» مخالفة للقياس الصرفي","e":"لأن القياس فيه الإدغام فيقال «الأجَلّ»، لكن الراجز فكّ الإدغام للضرورة. ومخالفة القياس الصرفي عيب من عيوب فصاحة الكلمة."},{"q":"«بأن ذا الكلب عمرًا خيرهم حسبًا» — ما الشاهد؟","a":"تقديم اللقب على الاسم","e":"فقد قدّم اللقب «ذا الكلب» على الاسم «عمرًا»، والأصل تأخير اللقب عن الاسم. وهذا جائز لكنه قليل، فعُدّ شاهدًا."},{"q":"«بالوارث الباعث الأمواتِ قد ضمنت ... إياهم الأرضُ» — الشاهد","a":"الإتيان بالضمير منفصلًا في موضع الاتصال","e":"فالأصل «قد ضمنتهم الأرض» بالضمير المتصل، لكنه فصله ضرورةً. والقاعدة أنه متى أمكن الاتصال امتنع الانفصال."},{"q":"«إذا الشمس كُوِّرت وإذا النجوم انكدرت» — المحسّن","a":"مراعاة نظير (ويصح: سجع)","e":"لأنه جمع بين أمور متناسبة غير متضادة من مشاهد الكون. ومن نظر إلى توافق الفاصلتين في الحرف الأخير عدّه سجعًا، والمدار على الخيارات المعروضة."},{"q":"«اذهب إلى فرعون إنه طغى» — الأسلوب","a":"استدراج","e":"لأن الخطاب سِيق بلين ورفقٍ ظاهرَين مع أن المراد الإنذار والوعيد. والاستدراج أن يُؤتى بالكلام على صورة المسالمة وباطنه الزجر."},{"q":"«أولئك على هدًى من ربهم» — الوجه البلاغي","a":"تمييز المسند إليه باسم الإشارة ليتقرر الحكم","e":"فالعدول عن الضمير إلى اسم الإشارة يفيد تمييز الموصوفين وتعيينهم كأنهم حاضرون مشاهَدون، فيتقرر الحكم في النفس ويقوى."},{"q":"«إن الذين ترونهم إخوانكم» — الغرض من الاسم الموصول","a":"التنبيه على خطأ المخاطب","e":"لأن الصلة «ترونهم إخوانكم» تضمنت أن ما يراه المخاطب أخوّةً ليس كذلك في الحقيقة. فاختيار الموصول هنا وسيلة لتصحيح تصوّر السامع."},{"q":"«النيل العذب هو الكوثر والجنة شاطئه الأخضر» — الوجه البلاغي","a":"تشبيه بليغ","e":"لأنه حذف الأداة ووجه الشبه معًا وجعل المشبه عين المشبه به ادّعاءً. وهذا أعلى مراتب التشبيه لما فيه من إيهام الاتحاد."},{"q":"«أعينيَّ جودا ولا تجمدا ... ألا تبكيان لصخر الندى» — الغرض الشعري","a":"الرثاء","e":"لأن الخنساء تخاطب عينيها طالبةً منهما البكاء على أخيها صخر. والنداء والأمر هنا خرجا إلى إظهار الحسرة، وهو أمارة غرض الرثاء."},{"q":"«دَعِ المكارمَ لا ترحلْ لبُغيتها ... واقعدْ فإنك أنت الطاعمُ الكاسي» — الغرض","a":"الهجاء والسخرية","e":"لأن ظاهر الأمر نصيحة وباطنه تحقير وتهكم، إذ جعله عاجزًا لا يُحسن إلا الأكل واللبس. وهذا من خروج الأمر عن أصله إلى التهكم."},{"q":"«وإني وإن كنتُ الأخيرَ زمانُه ... لآتٍ بما لم تستطعْه الأوائلُ» — الغرض","a":"الفخر","e":"لأن الشاعر يُثبت لنفسه سَبْقًا على المتقدمين مع تأخر زمانه. والبيت ينسب إلى أبي العلاء المعري، وفيه مقابلة بين الأخير والأوائل تزيد الفخر قوة."},{"q":"«وإن صخرًا لتأتمّ الهداةُ به ... كأنه عَلَمٌ في رأسه نارُ» — الغرض","a":"المدح والثناء","e":"لأنه أثبت للممدوح الهداية والاقتداء، وشبّهه بالجبل العالي الذي تُوقد عليه النار فيُهتدى به. والتشبيه هنا مرسل مجمل يخدم غرض المدح."},{"q":"«إن الرسول لنورٌ يُستضاء به ... مهنَّدٌ من سيوف الله مسلولُ» — الغرض","a":"المدح","e":"لأنه جمع له بين النور الهادي والسيف الناصر، فأثبت له كمال الهداية وكمال المنعة. والبيت من قصيدة كعب بن زهير المعروفة بالبُردة."},{"q":"«ونشرب إن وردنا الماءَ صَفوًا ... ويشربُ غيرُنا كَدِرًا وطينا» — الغرض","a":"الفخر","e":"لأن عمرو بن كلثوم يُثبت لقومه السَّبق والغلبة على الموارد، ويجعل لغيرهم الفضلة الكدرة. وفي البيت مقابلة بين الصفو والكَدَر تخدم الفخر."},{"q":"«في كل خَلقٍ خَلقَه مذمومةٌ ووراء كل محبَّبٍ مكروهُ» — اللون البديعي","a":"طباق","e":"لأنه جمع بين «محبَّب» و«مكروه» وهما ضدان. ولو نظرتَ إلى تقابل الجملتين كاملتين لصحّ أن تسميها مقابلة، والمدار على الخيارات."},{"q":"«يقولون لي: قدِّمْ دماءَك في الوغى ... قلتُ: دعوني آكلُ العيشَ بالجُبن» — اللون البديعي","a":"جناس (أو تورية في «الجبن»)","e":"فلفظ «الجبن» يحتمل الطعام المعروف ويحتمل ضد الشجاعة، والمراد البعيد هو الثاني — وهذه تورية. ومن نظر إلى تشابه اللفظ مع «العيش» بمعنى الخبز عدّه جناسًا."},{"q":"«هذا عسجدٌ أي ذهبٌ» — ما الغرض من «أي»؟","a":"التفسير","e":"لأن «أيْ» حرف تفسير يُؤتى به لبيان لفظ غامض بلفظ أوضح منه. و«عسجد» من الغريب، ففُسّر بـ«ذهب» وهو المألوف، وهذا يدفع عيب الغرابة."},{"q":"«نِعمَ العبادةُ الصلاةُ» — نوع الأسلوب","a":"مدح","e":"لأن «نِعم» فعل ماضٍ جامد وُضع لإنشاء المدح، و«الصلاة» هي المخصوص بالمدح. وهو من الإنشاء غير الطلبي لأنه لا يستدعي مطلوبًا."},{"q":"«الأخلاقُ نهضةُ الأمم، فالأخلاقَ الأخلاقَ» — نوع الأسلوب","a":"إغراء","e":"لأنه كرّر اسمًا منصوبًا يدل على أمر محمود ليحثّ المخاطب على ملازمته. والناصب فعل محذوف وجوبًا تقديره «الزَمْ». ولو كان الأمر مكروهًا لكان تحذيرًا."},{"q":"«وما ربك بظلّامٍ للعبيد» — نوع الأسلوب","a":"نفي مؤكَّد","e":"فالباء الزائدة في الخبر أكّدت النفي وقوّته، و«ظلّام» صيغة مبالغة نُفيت لتدل على انتفاء أصل الظلم من باب أولى. وهو خبر إنكاري لتعدد المؤكدات."},{"q":"«أعدلُ الناس إلا في معاملتي ... فيك الخصامُ وأنت الخصمُ والحكمُ» — اللون البياني","a":"تشبيه ضمني (مع المقابلة)","e":"فالشاعر لم يصرّح بأداة ولا بصورة تشبيه مباشرة، وإنما ألمح إلى حال الممدوح في بيت ثانٍ. وفي «الخصم والحكم» مقابلة تُبرز المفارقة."},{"q":"الحرف الناسخ «ليت» يفيد…","a":"التمني","e":"وهو طلب الأمر المحبوب الذي لا يُرجى وقوعه لاستحالته أو بُعده. ويقابله «لعلّ» للترجي وهو طلب المحبوب الممكن المتوقَّع."},{"q":"عرّف النُّتفة","a":"البيتان اللذان ينظمهما الشاعر","e":"فإذا زاد على بيتين إلى ستة سُمّي قطعة، وإذا بلغ سبعة فأكثر سُمّي قصيدة. وهذا من اصطلاحات تقسيم الشعر بحسب عدد الأبيات."}],"r":[{"t":"الفصاحة والبلاغة وعيوبهما","b":"\n<p><b>الفصاحة</b> وصف للّفظ: خلوصه من التنافر وغرابة الاستعمال ومخالفة القياس الصرفي.\nو<b>البلاغة</b> وصف للكلام والمتكلم: <b>مطابقة الكلام لمقتضى الحال مع فصاحته</b>.</p>\n<p><b>ولهذا قيل:</b> كلُّ بليغ فصيح، وليس كل فصيح بليغًا — وهي عبارة <b>صحيحة</b>؛\nلأن البلاغة تشترط الفصاحة وتزيد عليها مراعاةَ مقتضى الحال، فهي أخصّ منها.</p>\n<p><b>عيوب فصاحة الكلمة:</b></p>\n<ul>\n<li><b>تنافر الحروف:</b> ثقل الكلمة على اللسان لتقارب مخارج حروفها — وشاهده المشهور\nبيتٌ فيه تكرار القاف والباء والراء متقاربةً حتى عَسُر النطق: «وقبرُ حربٍ بمكانٍ قفرِ…».</li>\n<li><b>الغرابة:</b> أن تكون الكلمة وحشية غير مألوفة يحتاج فهمها إلى معجم.</li>\n<li><b>مخالفة القياس الصرفي:</b> أن تأتي الكلمة على غير ما تقتضيه قواعد التصريف —\nوشاهده «الأجلَل» في قول الراجز، والقياس «الأجَلّ» بالإدغام.</li>\n</ul>\n<p><b>عيوب فصاحة الكلام:</b> تنافر الكلمات مجتمعة، وضعف التأليف، والتعقيد اللفظي (سوء ترتيب الكلمات)،\nو<b>التعقيد المعنوي</b> (خفاء الانتقال من المعنى الأول إلى المقصود) — وشاهده بيتٌ كنّى فيه الشاعر\nعن البكاء بـ«تسكب عيناي الدموع» وعن عدمه بـ«لتجمدا»، فخفيت اللوازم على السامع.</p>\n"},{"t":"علوم البلاغة الثلاثة — حدودها","b":"\n<ul>\n<li><b>علم المعاني:</b> علم يُعرف به أحوال اللفظ العربي التي بها يطابق مقتضى الحال.\nمباحثه: الخبر والإنشاء، والقصر، والفصل والوصل، والإيجاز والإطناب والمساواة، والتقديم والتأخير،\nوالذكر والحذف، والتعريف والتنكير.</li>\n<li><b>علم البيان:</b> علم يُعرف به إيراد المعنى الواحد بطرق مختلفة في وضوح الدلالة عليه.\nمباحثه: التشبيه، والمجاز (المرسل والعقلي)، والاستعارة، والكناية.</li>\n<li><b>علم البديع:</b> علم يُعرف به وجوه تحسين الكلام بعد رعاية مطابقته لمقتضى الحال ووضوح دلالته.\nمباحثه: المحسنات المعنوية واللفظية.</li>\n</ul>\n"},{"t":"الخبر والإنشاء وأغراضهما","b":"\n<p><b>الخبر</b> ما يحتمل الصدق والكذب لذاته. و<b>أضربه ثلاثة</b> بحسب حال المخاطب:</p>\n<ol>\n<li><b>ابتدائي:</b> للخالي الذهن، فيُلقى بلا مؤكدات.</li>\n<li><b>طلبي:</b> للمتردد، فيُؤكَّد بمؤكد واحد.</li>\n<li><b>إنكاري:</b> للمنكر، فيُؤكَّد بمؤكدين فأكثر.</li>\n</ol>\n<p><b>أغراض الخبر البلاغية</b> التي يخرج إليها عن أصله: الفخر، والمدح، والتحسّر، والاسترحام،\nوإظهار الضعف، والتوبيخ، والتهديد، والحثّ على السعي.</p>\n<p><b>الإنشاء</b> ما لا يحتمل الصدق والكذب، وهو طلبي وغير طلبي.\n<b>الطلبي خمسة:</b> الأمر، والنهي، والاستفهام، والتمني، والنداء.\nو<b>غير الطلبي:</b> التعجب، والمدح والذم، والقسم، وأفعال الرجاء، وصيغ العقود.</p>\n<p><b>الأغراض البلاغية للأساليب الإنشائية:</b></p>\n<ul>\n<li><b>الأمر</b> يخرج إلى: الدعاء، والالتماس، والنصح، والإباحة، والتمني، والتعجيز،\nو<b>التهديد</b> — كما في أمرٍ قرآني سِيق مساق الوعيد لا الإذن.</li>\n<li><b>النهي</b> يخرج إلى: الدعاء، والالتماس، والتحقير، واليأس، والتهديد.</li>\n<li><b>الاستفهام</b> يخرج إلى: التقرير، والنفي، والإنكار، والتعجب، والتمني، والتشويق، والتهويل.\nو<b>التقرير</b> هو حمل المخاطب على الإقرار بأمر مستقر عنده، وعلامته أن يكون الجواب بالإثبات\nكما في «أليس الله بكافٍ عبده؟».</li>\n<li><b>النداء</b> يخرج إلى: التعجب، والتحسّر والأسى، والتحقير، والزجر، والتعظيم، والاستغاثة.</li>\n</ul>\n"},{"t":"القصر وطرقه","b":"\n<p><b>القصر</b> تخصيص شيء بشيء بطريق مخصوص، أي جعل أمرٍ مقصورًا على آخر.</p>\n<p><b>طرقه أربعة:</b> النفي والاستثناء، و«إنّما»، والعطف بـ«لا» و«بل» و«لكن»،\nوتقديم ما حقه التأخير.</p>\n<p><b>أقسامه باعتبار حال المخاطب ثلاثة:</b></p>\n<ul>\n<li><b>قصر إفراد:</b> إذا اعتقد المخاطب الشِّركة، فتردّ عليه بقصر الصفة على موصوف واحد.\nومثاله في التنزيل نفيُ الألوهية عن غير الله مع إثباتها له وحده — «لا إله إلا أنا».</li>\n<li><b>قصر قلب:</b> إذا اعتقد المخاطب العكس، فتقلب عليه حكمه.</li>\n<li><b>قصر تعيين:</b> إذا تردّد المخاطب بين أمرين فتعيّن له أحدهما.</li>\n</ul>\n"},{"t":"الإيجاز والإطناب والمساواة","b":"\n<p><b>المساواة</b> أن يكون اللفظ بقدر المعنى لا يزيد ولا ينقص.</p>\n<p><b>الإيجاز</b> نوعان: <b>إيجاز قِصَر</b> (تكثيف المعنى في لفظ قليل بلا حذف)،\nو<b>إيجاز حذف</b> (حذف كلمة أو جملة يدل عليها السياق).</p>\n<p><b>الإطناب</b> زيادة اللفظ على المعنى لفائدة، ومن أنواعه:</p>\n<ul>\n<li><b>ذكر الخاص بعد العام:</b> تنبيهًا على فضل الخاص.</li>\n<li><b>ذكر العام بعد الخاص:</b> إفادةً للشمول بعد الاهتمام بالخاص —\nكدعاء الاستغفار الذي بدأ بالنفس والوالدين ومَن دخل البيت ثم عمّ المؤمنين والمؤمنات.</li>\n<li><b>الإيضاح بعد الإبهام</b>، و<b>التكرار</b>، و<b>الاعتراض</b>، و<b>التذييل</b>، و<b>الاحتراس</b>.</li>\n</ul>\n"},{"t":"التشبيه: أركانه وأنواعه وأغراضه","b":"\n<p><b>أركان التشبيه أربعة:</b> المشبَّه، والمشبَّه به (وهما طرفاه)، وأداة التشبيه، ووجه الشبه.</p>\n<p><b>أنواعه باعتبار ذكر الأداة ووجه الشبه:</b></p>\n<table><tr><th>النوع</th><th>الأداة</th><th>وجه الشبه</th></tr>\n<tr><td><b>مُرسَل</b></td><td>مذكورة</td><td>—</td></tr>\n<tr><td><b>مؤكَّد</b></td><td><b>محذوفة</b></td><td>—</td></tr>\n<tr><td><b>مُجمَل</b></td><td>—</td><td><b>محذوف</b></td></tr>\n<tr><td><b>مُفصَّل</b></td><td>—</td><td>مذكور</td></tr>\n<tr><td><b>بليغ</b></td><td><b>محذوفة</b></td><td><b>محذوف</b></td></tr>\n</table>\n<p>فالتشبيه الذي اجتمعت فيه الأركان كلها هو <b>المرسل المفصَّل</b>، والذي حُذفت أداته هو <b>المؤكَّد</b>،\nوالذي حُذفت أداته ووجهه معًا هو <b>البليغ</b> وهو أعلى مراتب التشبيه لإيهامه اتحاد الطرفين.</p>\n<p><b>أنواع خاصة:</b></p>\n<ul>\n<li><b>التشبيه التمثيلي:</b> وجه الشبه فيه <b>صورة منتزعة من متعدد</b>، أي هيئة مركبة لا وصف مفرد.\nمثاله: تشبيه الكلمة الطيبة التي لا تنمو في النفس المريضة بالنخلة التي لا تنبت في الأرض السَّبِخة —\nفالوجه هيئة مركبة من ممتنعٍ ومحلٍّ غير قابل.</li>\n<li><b>التشبيه الضمني:</b> لا يوضع فيه المشبه والمشبه به في صورة التشبيه الصريح، بل يُلمحان من المعنى،\nويأتي غالبًا لإثبات أن الحكم ممكن. مثاله بيتُ المتنبي في أن فساد الحاسة يُفسد إدراك الطيب:\nفمن مرِض فمُه وجد الماء العذب مرًّا.</li>\n<li><b>التشبيه المقلوب:</b> أن يُجعل المشبه مشبهًا به ادّعاءً لأنه أقوى في وجه الشبه.</li>\n</ul>\n<p><b>أغراض التشبيه:</b> بيان حال المشبَّه، وبيان مقدار حاله، وتقرير حاله في النفس، وتزيينه أو تقبيحه،\nوبيان إمكانه. فإذا قيل «ثوبُ أحمدَ أبيضُ كاللبن» فالغرض <b>بيان مقدار حال المشبَّه</b>،\nلأن البياض ثابت معلوم، وإنما جاء التشبيه ليحدّد درجته ومقداره.</p>\n"},{"t":"المجاز المرسل والمجاز العقلي","b":"\n<p><b>المجاز المرسل</b> لفظ استُعمل في غير ما وُضع له لعلاقة <b>غير المشابهة</b> مع قرينة مانعة من إرادة\nالمعنى الأصلي. وعلاقاته:</p>\n<ul>\n<li><b>الجزئية:</b> ذكر الجزء وإرادة الكل — كذكر «الأصابع» وإرادة الأنامل أو أطرافها.</li>\n<li><b>الكلية:</b> ذكر الكل وإرادة الجزء.</li>\n<li><b>السببية</b> و<b>المسببية</b>.</li>\n<li><b>المحلية:</b> ذكر المحل وإرادة الحالّ فيه — كذكر مكانٍ وإرادة أهله.</li>\n<li><b>الحالّية:</b> ذكر الحالّ وإرادة المحل.</li>\n<li><b>اعتبار ما كان:</b> تسمية الشيء باسم ما كان عليه.</li>\n<li><b>اعتبار ما سيكون:</b> تسمية الشيء باسم ما سيؤول إليه — ومنه قول يوسف عليه السلام\nإنه يعصر خمرًا، والمعصور عنبٌ سيصير خمرًا.</li>\n</ul>\n<p><b>المجاز العقلي</b> إسناد الفعل أو ما في معناه إلى غير صاحبه الحقيقي لعلاقة مع قرينة.\nوعلاقاته: الفاعلية، والمفعولية، والزمانية، والمكانية، والمصدرية، والسببية.\nومن أشهر شواهده وصفُ المذموم بأنه «الطاعم الكاسي» — أي المَطعوم المَكسوّ،\nفأُسند اسم الفاعل إلى من هو مفعول في المعنى، فالعلاقة <b>المفعولية</b>.</p>\n"},{"t":"الاستعارة وأنواعها","b":"\n<p><b>الاستعارة</b> تشبيه حُذف أحد طرفيه، وهي مجاز علاقته <b>المشابهة</b>.</p>\n<ul>\n<li><b>تصريحية:</b> صُرّح فيها بلفظ <b>المشبَّه به</b> وحُذف المشبَّه.\nمثالها: إخراج الله المؤمنين «من الظلمات إلى النور» — صُرّح بالظلمات والنور،\nوأُريد الضلال والهدى. ومثالها في الشعر تسمية الدموع لؤلؤًا والخدود وردًا.</li>\n<li><b>مكنية:</b> حُذف فيها <b>المشبَّه به</b> ورُمز له بشيء من لوازمه.\nمثالها إسناد «الإصغاء» و«الآذان» إلى المجد — فقد شُبّه المجد بإنسان وحُذف المشبه به\nورُمز له بلازمه وهو الأذن والإصغاء. ومثالها إسناد الاشتعال إلى الرأس.</li>\n<li><b>تبعية:</b> ما جرت في الفعل أو المشتق أو الحرف لا في الاسم الجامد —\nكاستعمال «القذف» في إبطال الباطل بالحق، فالاستعارة في الفعل.</li>\n<li><b>أصلية:</b> ما جرت في اسم جامد.</li>\n<li><b>مرشَّحة:</b> ذُكر معها ما يلائم المشبَّه به. <b>مجرَّدة:</b> ذُكر معها ما يلائم المشبَّه.\n<b>مطلقة:</b> لم يُذكر معها ملائم لأحدهما.</li>\n</ul>\n"},{"t":"الكناية","b":"\n<p><b>الكناية</b> لفظ أُريد به لازم معناه مع جواز إرادة المعنى الأصلي — وهذا هو الفارق بينها وبين المجاز،\nإذ المجاز لا بد فيه من قرينة مانعة.</p>\n<p><b>أقسامها ثلاثة:</b></p>\n<ul>\n<li><b>كناية عن صفة:</b> كالنهي عن غَلّ اليد إلى العنق وعن بسطها كل البسط —\nفالأول كناية عن <b>البخل</b> والثاني عن الإسراف.</li>\n<li><b>كناية عن موصوف:</b> كالتعبير بـ«لغة الضاد» عن العربية.</li>\n<li><b>كناية عن نسبة:</b> كإثبات الصفة لما يتصل بالموصوف لا له مباشرةً.</li>\n</ul>\n<p><b>سرّ بلاغتها:</b> أنها تُعطي الحقيقةَ مصحوبةً بدليلها، فهي إثباتٌ للمعنى بذكر برهانه.</p>\n"},{"t":"المحسنات المعنوية","b":"\n<ul>\n<li><b>الطباق:</b> الجمع بين الشيء وضده في الكلام. وهو <b>طباق إيجاب</b> إذا اختلف اللفظان إثباتًا\n(الظلمات/النور، أشدّاء/رحماء)، و<b>طباق سلب</b> إذا جُمع بين فعلٍ مثبت ومنفيّ من لفظ واحد.</li>\n<li><b>المقابلة:</b> أن يُؤتى بمعنيين أو أكثر ثم بما يقابلهما على الترتيب — كمقابلة الضحك القليل\nبالبكاء الكثير.</li>\n<li><b>التورية:</b> لفظ له معنيان: <b>قريب ظاهر غير مراد</b>، و<b>بعيد خفيّ هو المراد</b>،\nولا بد من قرينة خفية تدل على البعيد وتُسمّى الإيهام. و<b>المجرَّدة</b> منها ما لم يُذكر فيه\nما يلائم القريب ولا البعيد.</li>\n<li><b>المشاكلة:</b> ذكر الشيء بلفظ غيره لوقوعه في صحبته تحقيقًا أو تقديرًا —\nكالتعبير عن جزاء النسيان بلفظ النسيان نفسه، وكالتعبير عن ردّ الجهل بلفظ الجهل في قول عمرو بن كلثوم.</li>\n<li><b>المبالغة:</b> ادّعاء بلوغ الوصف حدًّا مستبعَدًا أو مستحيلًا. وقسّمها السكاكي ثلاثة أقسام:\n<b>تبليغ</b> (ممكن عقلًا وعادةً)، <b>إغراق</b> (ممكن عقلًا لا عادةً)،\n<b>غلوّ</b> (مستحيل عقلًا وعادةً).</li>\n<li><b>التنكيت:</b> أن يقصد المتكلم شيئًا بالذكر دون غيره مما يسدّ مسدّه، لنكتة في المذكور ترجّح مجيئه.</li>\n<li><b>تجاهل العارف:</b> سَوقُ المعلوم مساقَ المجهول لغرض بلاغي كالتعجب أو التدلّه في الحب.</li>\n<li><b>مراعاة النظير:</b> الجمع بين أمور متناسبة غير متضادة.</li>\n<li><b>العكس والتبديل:</b> أن تُقدّم جزءًا من الكلام ثم تعكس فتُؤخّر ما قدّمت وتُقدّم ما أخّرت —\nنحو «عادات السادات سادات العادات».</li>\n<li><b>ما لا يستحيل بالانعكاس (المقلوب/المستوي):</b> عبارة تُقرأ طردًا وعكسًا على صورة واحدة.</li>\n<li><b>الاستدراج:</b> سَوق الكلام مساق اللين والرفق مع إرادة الزجر والوعيد.</li>\n</ul>\n"},{"t":"المحسنات اللفظية","b":"\n<ul>\n<li><b>الجناس:</b> تشابه اللفظين في النطق واختلافهما في المعنى.\n<b>تامّ:</b> اتفقا في نوع الحروف وعددها وهيئتها وترتيبها.\n<b>ناقص:</b> اختلفا في أحدها — ومنه <b>المحرَّف</b> الذي يختلف بالحركات فقط\nكـ«مَذهَب» و«مُذهَب»، و<b>جناس القلب</b> الذي يختلف بترتيب الحروف كـ«كفّيه» و«فكّيه».</li>\n<li><b>السجع:</b> توافق الفاصلتين في الحرف الأخير من النثر. وأنواعه:\n<b>مطرَّف</b> (اختلفت الفاصلتان وزنًا واتفقتا رويًّا)،\n<b>متوازٍ</b> (اتفقت الكلمتان الأخيرتان وزنًا ورويًّا دون سائر الكلمات)،\n<b>مرصَّع</b> (تقابلت كل لفظة من الفقرة الأولى بلفظة من الثانية في الوزن والروي).\nو<b>الفواصل القرآنية</b> تقابل السجعَ في النثر، غير أن العلماء آثروا تسميتها فواصل تنزيهًا للقرآن.</li>\n<li><b>التصريع:</b> اتفاق نهاية الشطر الأول مع نهاية الشطر الثاني في مطلع القصيدة.</li>\n<li><b>الترصيع:</b> أن تتوازن ألفاظ إحدى الفقرتين مع ما يقابلها من الأخرى وزنًا وقافيةً —\nومثاله الآية التي قابلت نعيم الأبرار بجحيم الفُجّار.</li>\n<li><b>ردّ العجز على الصدر:</b> أن تتكرر لفظة من أول البيت في آخره — كتكرار «سريع/بسريع».</li>\n</ul>\n"}]},{"c":"arud","n":"العروض والقافية","q":[{"q":"من مؤلف علم العروض؟","a":"الخليل بن أحمد الفراهيدي","e":"استخرج خمسة عشر بحرًا من استقراء كلام العرب، وزاد تلميذه الأخفش بحر المتدارك فصارت ستة عشر. وهو أيضًا واضع أول معجم عربي وهو «العين» المرتَّب على المخارج الصوتية."},{"q":"ما البيت الذي حُذف شطره بالكامل فصار شطرًا واحدًا؟","a":"البيت المشطور","e":"وهو من أشكال البيت الناقص، ويقع في بحور بعينها كالرجز والسريع. ويقابله المنهوك الذي حُذف ثلثاه وبقي ثلثه."},{"q":"ما البيت الذي يشترك شطراه في كلمة واحدة؟","a":"البيت المُدوَّر (المُدمَج)","e":"فتبدأ الكلمة في آخر الصدر وتتمّ في أول العجز، فلا يمكن الوقوف على نهاية الصدر. وسُمّي مدوَّرًا لأن الوزن يدور بين الشطرين بلا فاصل."},{"q":"عرّف الإكْفاء","a":"أن يُؤتى في أبيات القصيدة برويّ متجانس في المخرج مختلف في اللفظ","e":"كأن يجعل الرويّ حاءً في بيت وخاءً في آخر، أو سينًا وصادًا. وهو عيب لأن أذن السامع تنتظر حرفًا واحدًا يتكرر فتُفاجَأ بغيره وإن قرُب مخرجه."},{"q":"عرّف الإجازة","a":"الجمع بين رويّين مختلفين في المخرج","e":"كأن يجعل الرويّ دالًا في بيت ولامًا في آخر. وهي أشدّ قبحًا من الإكفاء لأن البُعد بين المخرجين أظهر وأنكى في السمع."},{"q":"عرّف الإقْواء","a":"تحريك المَجرى بحركتين مختلفتين غير متباعدتين","e":"أي أن تختلف حركة الرويّ بين الكسرة والضمة مثلًا. وسُمّي إقواءً من القُوّة بمعنى الاختلاف، وهو من أشهر عيوب القافية وقد وقع لفحول الشعراء."},{"q":"عرّف الإصراف","a":"الجمع بين حركتين مختلفتين متباعدتين في الرويّ","e":"كالفتحة مع الضمة أو الفتحة مع الكسرة. والفارق بينه وبين الإقواء أن الإقواء بين حركتين متقاربتين والإصراف بين متباعدتين."},{"q":"عرّف الإيطاء","a":"إعادة لفظة القافية بلفظها ومعناها","e":"فإن أُعيدت باختلاف المعنى جاز ولم يكن عيبًا، كلفظة تدل على الرجل مرة وعلى ناظر العين مرة. والعيب إنما هو في تكرار اللفظ والمعنى معًا."},{"q":"عرّف التضمين في القافية","a":"تعلّق معنى البيت بما بعده تعلّقًا لا يتمّ الكلام بدونه","e":"وهو قبيح إذا توقّف فهم البيت كله على تاليه، ومقبول إذا تمّ فيه بعض المعنى وجاء الثاني مفسِّرًا. وقد عِيب على النابغة تعليقُه لفظة من بيت على ما بعده."},{"q":"عرّف التصريع","a":"اتفاق عَروض البيت مع ضربه في الوزن والروي","e":"ويكون في مطلع القصيدة غالبًا. وفائدته إعلام السامع ببحر القصيدة وقافيتها من أول بيت، ولذلك عُدّ من محسنات المطالع."},{"q":"عرّف النُّتفة","a":"البيتان من الشعر","e":"وهي أقل من القطعة التي تكون من ثلاثة إلى ستة أبيات، والقصيدة ما بلغ سبعة فأكثر. وما قيل بيتًا واحدًا يُسمّى اليتيم."},{"q":"«أعينيَّ جودا ولا تجمدا» — الغرض الشعري","a":"الرثاء","e":"لأن الخنساء تستنهض عينيها للبكاء على أخيها صخر. وعلامة الرثاء أن الممدوح ميّت وأن الأسلوب مشحون بالحسرة والنداء المتفجّع."},{"q":"«دَعِ المكارمَ لا ترحلْ لبُغيتها» — الغرض الشعري","a":"الهجاء","e":"لأن ظاهره نصيحة وباطنه تحقير وتهكم بالممدوح؛ إذ حصره في الطعام واللباس ونفى عنه السعي للمجد. وهذا من الهجاء التهكمي وهو أمضّ من الصريح."},{"q":"«وإني وإن كنتُ الأخيرَ زمانُه» — الغرض الشعري","a":"الفخر","e":"لأنه يُثبت لنفسه الإتيان بما عجز عنه المتقدمون. والمقابلة بين «الأخير» و«الأوائل» قرينة واضحة على قصد التفاخر بالسبق."},{"q":"«إن الرسول لنورٌ يُستضاء به» — الغرض","a":"المدح","e":"لأنه أثبت للممدوح صفات الكمال: الهداية والنصرة والمنعة. والبيت من قصيدة البُردة لكعب بن زهير، والغرض الجامع لها المدح النبوي."},{"q":"«ونشرب إن وردنا الماء صفوًا» — الغرض","a":"الفخر","e":"لأن الشاعر يفاخر بقومه ويجعل لهم صفو الموارد ولغيرهم كدَرها. والمقابلة بين «صفوًا» و«كَدِرًا وطينا» تخدم غرض الفخر وتُبرزه."},{"q":"ما الفرق بين الزِّحاف والعِلّة؟","a":"الزحاف يلحق الحشو وغير لازم، والعلة تلحق العروض والضرب ولازمة","e":"فالزحاف تغيير عارض في ثواني الأسباب يجوز وقوعه في بيت دون بيت. والعلة تغيير في آخر الشطر، فإذا لزمت في بيت لزمت في القصيدة كلها."},{"q":"ما الفرق بين العَروض والضَّرب؟","a":"العَروض آخر تفعيلة في الصدر، والضَّرب آخر تفعيلة في العجز","e":"وما بينهما يُسمّى الحشو. ويتفقان في البيت المصرَّع، ويختلفان في سائر الأبيات غالبًا."},{"q":"ما القافية المطلقة والمقيَّدة؟","a":"المطلقة ما كان رويُّها متحركًا، والمقيَّدة ما كان رويُّها ساكنًا","e":"وسُمّيت مطلقة لإطلاق حركة الرويّ وما يتبعها من حرف وصل. والمقيَّدة مقيدة بالسكون فلا وصل بعدها."}],"r":[{"t":"علم العروض ومصطلحاته","b":"\n<p><b>واضع علم العروض:</b> <b>الخليل بن أحمد الفراهيدي</b> — وهو أيضًا واضع أول معجم عربي («العين»)\nوأستاذ سيبويه. واستخرج من كلام العرب خمسة عشر بحرًا، وزاد عليها تلميذه الأخفش بحر <b>المتدارك</b>\nفصارت ستة عشر.</p>\n<p><b>مصطلحات أساسية:</b></p>\n<ul>\n<li><b>البيت:</b> وحدة القصيدة، ويتكون من شطرين: <b>الصدر</b> و<b>العجز</b>.</li>\n<li><b>العَروض:</b> آخر تفعيلة في الصدر. و<b>الضَّرب:</b> آخر تفعيلة في العجز. و<b>الحَشو:</b> ما بينهما.</li>\n<li><b>التفعيلة:</b> وحدة الوزن، وأصولها عشر: فعولن، مفاعيلن، مفاعلتن، فاعلن، فاعلاتن،\nمستفعلن، متفاعلن، مفعولات، فاع لاتن، مستفع لن.</li>\n<li><b>الزِّحاف:</b> تغيير يلحق ثواني الأسباب في الحشو، وهو غير لازم.\nو<b>العِلّة:</b> تغيير يلحق العَروض والضرب، وهي لازمة.</li>\n</ul>\n<p><b>أشكال البيت بحسب تمامه:</b></p>\n<ul>\n<li><b>البيت التامّ:</b> ما استوفى تفعيلاته.</li>\n<li><b>البيت المشطور:</b> ما <b>حُذف شطره بالكامل</b> فصار شطرًا واحدًا بدل شطرين.</li>\n<li><b>البيت المنهوك:</b> ما حُذف ثلثاه وبقي ثلثه.</li>\n<li><b>البيت المُدوَّر (المُدمَج):</b> ما <b>اشترك شطراه في كلمة واحدة</b>، فتبدأ الكلمة في آخر الصدر\nوتتم في أول العجز.</li>\n<li><b>البيت المُصرَّع:</b> ما اتفقت عَروضه مع ضربه في الوزن والروي، ويكون في المطلع غالبًا.</li>\n<li><b>البيت اليتيم:</b> ما قيل منفردًا. و<b>النُّتفة:</b> بيتان. و<b>القطعة:</b> من ثلاثة إلى ستة.\nو<b>القصيدة:</b> سبعة فأكثر.</li>\n</ul>\n"},{"t":"القافية والرويّ","b":"\n<p><b>القافية</b> عند الخليل: من آخر حرف في البيت إلى أول ساكن يسبقه مع المتحرك الذي قبل الساكن.\nو<b>الرويّ</b> هو الحرف الذي تُبنى عليه القصيدة وتُنسب إليه، فيقال: قصيدة لاميّة أو ميميّة.</p>\n<p><b>حروف القافية:</b> الرويّ، والوصل، والخروج، والردف، والتأسيس، والدخيل.</p>\n<p><b>حركات القافية:</b> المَجرى (حركة الرويّ)، والنَّفاذ، والحَذو، والإشباع، والرَّسّ، والتوجيه.</p>\n<p><b>أنواع القافية بحسب حركة الرويّ:</b> <b>مُطلَقة</b> إذا كان الرويّ متحركًا،\nو<b>مُقيَّدة</b> إذا كان ساكنًا.</p>\n"},{"t":"عيوب القافية الستة","b":"\n<p>ستة عيوب تُنسب إلى الرويّ وحركته، يكثر السؤال عنها بالتعريف:</p>\n<table><tr><th>العيب</th><th>حدّه</th></tr>\n<tr><td><b>الإكْفاء</b></td><td>أن يُؤتى في أبيات القصيدة برويّ <b>متجانس في المخرج</b> مختلف في اللفظ،\nكالحاء والخاء، أو السين والصاد</td></tr>\n<tr><td><b>الإجازة</b></td><td>الجمع بين رويّين <b>مختلفين في المخرج</b> كليًّا، كالدال واللام، أو الباء والقاف</td></tr>\n<tr><td><b>الإقْواء</b></td><td>تحريك المَجرى (أي حركة الرويّ) بحركتين مختلفتين <b>غير متباعدتين</b>،\nكالكسرة والضمة</td></tr>\n<tr><td><b>الإصراف</b></td><td>الجمع بين حركتين <b>متباعدتين</b> في الرويّ، كالفتحة والضمة، أو الفتحة والكسرة</td></tr>\n<tr><td><b>الإيطاء</b></td><td>إعادة لفظة القافية بلفظها ومعناها، وإنما يجوز تكرارها باختلاف المعنى</td></tr>\n<tr><td><b>التضمين</b></td><td>تعلّق معنى البيت بالبيت الذي يليه تعلّقًا لا يتمّ الكلام بدونه، وهو قبيح؛\nويُقبل إذا تمّ فيه بعض المعنى</td></tr></table>\n<p><b>ضابط التفريق بين الإقواء والإصراف:</b> كلاهما اختلافٌ في حركة الرويّ،\nلكن الإقواء بين حركتين <b>متقاربتين</b> (الكسرة والضمة)، والإصراف بين حركتين <b>متباعدتين</b>\n(الفتحة مع الضمة أو مع الكسرة).</p>\n<p><b>وضابط التفريق بين الإكفاء والإجازة:</b> كلاهما اختلافٌ في حرف الرويّ،\nلكن الإكفاء يكون بين حرفين <b>متقاربي المخرج</b>، والإجازة بين حرفين <b>متباعدي المخرج</b>.</p>\n"},{"t":"الأغراض الشعرية","b":"\n<ul>\n<li><b>المدح:</b> تعداد محاسن الممدوح من كرم وشجاعة وعدل.</li>\n<li><b>الرثاء:</b> تعداد محاسن الميت مع إظهار الحزن والفجيعة.\nوعلامته الفارقة عن المدح أن المرثيّ ميّت وأن فيه نبرةَ حسرة.</li>\n<li><b>الهجاء:</b> تعداد مثالب المهجوّ، وقد يكون صريحًا أو تهكميًّا ساخرًا.</li>\n<li><b>الفخر:</b> تعداد مفاخر الشاعر أو قومه. وهو مدح وُجّه إلى الذات.</li>\n<li><b>الغزل:</b> ذكر المحبوبة ووصف جمالها، وهو عُذري عفيف وصريح حسّي.</li>\n<li><b>الوصف:</b> تصوير المرئيات والمشاهد، وهو أعمّ الأغراض وأدخلها في غيره.</li>\n<li><b>الحكمة:</b> خلاصة تجربة تُصاغ في بيت موجز سائر.</li>\n<li><b>الاعتذار:</b> غرض بَرَع فيه النابغة الذبياني.</li>\n<li><b>الزهد:</b> غرض نضج في العصر العباسي على يد أبي العتاهية.</li>\n</ul>\n"}]},{"c":"adab","n":"الأدب والنقد","q":[{"q":"صاحب «رسالة الغفران»","a":"أبو العلاء المعرّي","e":"وهي رسالة نثرية تخيّل فيها رحلةً إلى العالم الآخر يلقى فيها الشعراء واللغويين ويناقشهم. وتُعدّ من أبدع ما كُتب في الخيال الأدبي العربي."},{"q":"صاحب «البيان والتبيين» و«البخلاء»","a":"الجاحظ","e":"وهو أبو عثمان عمرو بن بحر، إمام النثر العربي في العصر العباسي. وطريقته الاستطراد والجمع بين الجدّ والهزل، وله أيضًا «الحيوان»."},{"q":"كتاب «الأدب الكبير» و«الأدب الصغير» لمن؟","a":"ابن المقفّع","e":"وهو عبد الله بن المقفّع، رائد النثر الفني المترجم عن الفارسية. وله «كليلة ودمنة» التي نقلها إلى العربية فصارت من عيون الأدب."},{"q":"كتاب «عيون الأخبار» و«الشعر والشعراء»","a":"ابن قتيبة","e":"وهو أبو محمد عبد الله بن مسلم الدِّينَوَري. و«الشعر والشعراء» من أقدم كتب تراجم الشعراء ونقدهم، وله فيه مقدمة نقدية نفيسة."},{"q":"كتاب «الأمالي» لمن؟","a":"أبو علي القالي البغدادي","e":"أملاه على طلابه بالأندلس، وهو مجموع من اللغة والأدب والأخبار والأشعار. وسُمّي أمالي لأنه كان يُملى على السامعين فيكتبونه."},{"q":"كتاب «الكامل في اللغة والأدب»","a":"المبرّد","e":"وهو أبو العباس محمد بن يزيد، إمام نحاة البصرة في عصره. والكتاب جامع بين النحو واللغة والأدب والأخبار."},{"q":"كتاب «العِقد الفريد» لمن؟","a":"ابن عبد ربه الأندلسي","e":"وهو موسوعة أدبية قسّمها مؤلفها على خمسة وعشرين كتابًا سمّى كل واحد باسم جوهرة. ويُعدّ من أشهر ما أُلّف بالأندلس في الأدب."},{"q":"كتاب «التوابع والزوابع»","a":"ابن شُهَيد الأندلسي","e":"وهي رسالة تخيّل فيها رحلة إلى وادي الجنّ يلقى فيها شياطين الشعراء والكتّاب. وهي سابقة لرسالة الغفران في الفكرة."},{"q":"كتاب «الصناعتين: الكتابة والشعر»","a":"أبو هلال العسكري","e":"وهو كتاب في البلاغة والنقد يجمع بين صناعتي النظم والنثر. وقد عُني فيه بأبواب الفصاحة والبديع وعيوب الكلام."},{"q":"صاحب كتاب «البديع»","a":"عبد الله بن المعتزّ","e":"وهو الخليفة العباسي الشاعر، وأول من أفرد البديع بالتأليف وحصر أبوابه الرئيسة في خمسة. وبكتابه استقلّ علم البديع عن سائر علوم البلاغة."},{"q":"كتاب «أسرار البلاغة» لمن؟","a":"عبد القاهر الجرجاني","e":"وهو واضع نظرية النظم، وله أيضًا «دلائل الإعجاز». و«أسرار البلاغة» مخصص لعلم البيان: التشبيه والمجاز والاستعارة."},{"q":"صاحب «طبقات فحول الشعراء»","a":"محمد بن سلّام الجُمَحي","e":"وهو أول من رتّب الشعراء طبقاتٍ على أساس نقدي، وقسّمهم عشر طبقات في الجاهلية ومثلها في الإسلام. وله مقدمة نفيسة في نقد الرواية وانتحال الشعر."},{"q":"صاحب كتاب «نقد الشعر»","a":"قُدامة بن جعفر","e":"وهو أول من حاول وضع حدٍّ منطقي للشعر ومقاييس لجودته. وقسّم عيوب الشعر ومحاسنه تقسيمًا منطقيًّا متأثرًا بالفلسفة اليونانية."},{"q":"صاحب كتاب «الأيام» وما نوعه؟","a":"طه حسين — وهو سيرة ذاتية","e":"رواه عن نفسه بضمير الغائب، وصوّر فيه طفولته في الريف ثم الأزهر ثم فرنسا. وهو من أشهر نصوص السيرة الذاتية في الأدب العربي الحديث."},{"q":"مؤلف رواية «سارة»","a":"عباس محمود العقاد","e":"وهي روايته الوحيدة، ويغلب عليها التحليل النفسي والفكري أكثر من الحدث. وهي أقرب إلى الدراسة منها إلى السرد القصصي."},{"q":"صاحب كتاب «الغِربال»","a":"ميخائيل نعيمة","e":"وهو كتاب نقدي من أدب المهجر، دعا فيه إلى التجديد وتحرير الأدب من القوالب الجامدة. وسُمّي غربالًا لأنه يغربل الأدب فيُبقي الجيّد."},{"q":"كتاب «العَبَرات»","a":"مصطفى لطفي المنفلوطي","e":"وهو مجموعة قصص ومقالات يغلب عليها الأسى والعاطفة الجيّاشة. وله أيضًا «النظرات»، وأسلوبه مشهور بالسجع الرقيق والنزعة الإصلاحية."},{"q":"أول رواية فنية حديثة في الأدب العربي ومؤلفها","a":"«زينب» لمحمد حسين هيكل","e":"نُشرت سنة ١٩١٤، وعُدّت أول رواية عربية مكتملة الفن من حيث الحبكة ورسم الشخصيات وتصوير البيئة المصرية. ونشرها مؤلفها أول الأمر باسم مستعار."},{"q":"أول أديب عربي حاز جائزة نوبل في الأدب","a":"نجيب محفوظ","e":"نالها سنة ١٩٨٨ عن مجمل أعماله الروائية. وهو صاحب «الثلاثية» و«زقاق المدق» و«أولاد حارتنا»، ويُعدّ رائد الرواية العربية الواقعية."},{"q":"أول من ألّف في فن المقامات","a":"بديع الزمان الهمَذاني","e":"ثم جاء الحريري فارتقى بالفن وبلغ به الذروة في «مقاماته». والمقامة حكاية قصيرة مسجوعة ذات بطل وراوٍ ثابتين."},{"q":"في أي عصر ظهر فن المقامات؟","a":"العصر العباسي","e":"في أواخره على يد بديع الزمان الهمذاني. وقد نشأ استجابةً لازدهار الصناعة اللفظية ورغبة الأدباء في استعراض ثروتهم اللغوية."},{"q":"في أي عصر ظهرت المقالة؟","a":"العصر الحديث","e":"لارتباطها بنشأة الصحافة والمطبعة. وهي فن نثري قصير يعالج موضوعًا واحدًا بأسلوب شخصي، وتنقسم إلى ذاتية وموضوعية."},{"q":"في أي عصر ظهرت الخمريات ناضجةً؟","a":"العصر العباسي","e":"على يد أبي نواس الذي جعلها فنًّا مستقلًّا له مقدماته وصوره. وقد كانت قبله مجرد مقدمة أو مقطوعة ضمن أغراض أخرى."},{"q":"في أي عصر ظهرت النقائض؟","a":"العصر الأموي","e":"وأقطابها جرير والفرزدق والأخطل. وهي قصائد يعارض فيها الشاعر خصمه في الوزن والقافية ويردّ عليه بالهجاء والفخر."},{"q":"في أي عصر شاع الوقوف على الأطلال؟","a":"العصر الجاهلي","e":"لارتباطه بحياة البداوة والترحال، فصار مقدمة تقليدية للقصيدة. واستمر بعد ذلك على سبيل المحاكاة والالتزام بعمود الشعر."},{"q":"الشعر العُذري ظهر في العصر…","a":"الأموي","e":"في بوادي الحجاز ونجد، ومن أعلامه جميل بثينة وقيس بن الملوَّح وكُثيّر عزة. وسُمّي عذريًّا نسبةً إلى بني عُذرة الذين اشتهروا بالحب العفيف."},{"q":"من أشهر شعراء صدر الإسلام","a":"حسان بن ثابت","e":"وهو شاعر الرسول صلى الله عليه وسلم الذي دافع عن الدعوة بشعره. وقد عاش جاهليةً وإسلامًا، فشعره جسر بين العصرين."},{"q":"الشاعر الذي اشتُهر بمدح الرسول صلى الله عليه وسلم في العصر الأموي","a":"الفرزدق (أو الكُمَيت بحسب الخيارات)","e":"فللفرزدق قصيدته المشهورة في مدح زين العابدين، وللكُميت «الهاشميات» في مدح آل البيت. أما شاعر الرسول في حياته فحسان بن ثابت."},{"q":"الشاعر العباسي الذي اشتُهر بالزهد","a":"أبو العتاهية","e":"تحوّل من الغزل واللهو إلى الزهد فجعله فنًّا قائمًا بذاته. وتميّز شعره بسهولة اللفظ وكثرة الحكمة والتذكير بالموت."},{"q":"من شعراء الصعاليك","a":"عروة بن الورد","e":"ويُلقَّب «عروة الصعاليك» لأنه كان يجمعهم ويُطعمهم. ومن الصعاليك أيضًا الشنفرى وتأبّط شرًّا والسُّليك بن السُّلَكة."},{"q":"من شعراء العصر المملوكي","a":"ابن الوردي","e":"صاحب «اللامية» المشهورة في الحكمة والنصح. وغلب على شعر عصره الإكثار من المحسنات البديعية والتصنيع اللفظي."},{"q":"مؤسس مدرسة المهجر","a":"جبران خليل جبران","e":"أسّس «الرابطة القلمية» في نيويورك مع ميخائيل نعيمة وإيليا أبو ماضي وغيرهم. ودعت المدرسة إلى التحرر من القيود الشكلية والتعبير عن الذات."},{"q":"مدرسة الإحياء والبعث رائدها…","a":"محمود سامي البارودي","e":"أعاد للشعر العربي جزالته ومتانته بمحاكاة الفحول القدامى. وتبعه شوقي وحافظ، واهتمت المدرسة بالقضايا الوطنية والسياسية."},{"q":"المدرسة التي اهتمت بالقضايا الوطنية","a":"الإحياء والبعث","e":"لأن شعراءها عاصروا الاحتلال ونهضة الوعي القومي، فجعلوا الشعر منبرًا للدفاع عن الوطن. وهذا ما يميّزها عن أبولّو والديوان ذواتَي النزعة الوجدانية."},{"q":"ينتمي الشاعر إبراهيم ناجي إلى مدرسة…","a":"أبولّو","e":"وهي مدرسة رومانسية وجدانية أسّسها أحمد زكي أبو شادي. وأشهر قصائد ناجي «الأطلال»، وفيها تتجلى النزعة الحزينة والموسيقى العذبة."},{"q":"ينتمي الشاعر إيليا أبو ماضي إلى مدرسة…","a":"المهجر","e":"وهو من أعلام الرابطة القلمية في أمريكا الشمالية. وأشهر قصائده «الطلاسم»، ويغلب على شعره التأمل الفلسفي والنزعة التفاؤلية."},{"q":"مدرسة «عبيد الشعر» نشطت بين شعراء العصر…","a":"الجاهلي والإسلامي","e":"وهي مدرسة التنقيح والتهذيب التي يحبس أصحابها القصيدة حولًا كاملًا قبل إذاعتها. ولذلك سُمّيت قصائدهم «الحوليات»، ومن أعلامها زهير بن أبي سلمى."},{"q":"يُعدّ زهير بن أبي سلمى من مدرسة…","a":"عبيد الشعر","e":"لأنه كان ينقّح قصيدته ويعيد النظر فيها حولًا كاملًا. وقد أثمر ذلك شعرًا محكم البناء كثير الحكمة، ولهذا فضّله عمر بن الخطاب رضي الله عنه."},{"q":"الشاعر الذي يفضّله عمر بن الخطاب رضي الله عنه","a":"زهير بن أبي سلمى","e":"لأنه كان لا يمدح الرجل إلا بما فيه، ولا يتبع حُوشيّ الكلام. فاجتمع في شعره صدق الوصف وعفّة اللفظ وكثرة الحكمة."},{"q":"الشاعر الذي يفضّله أبو بكر الصديق رضي الله عنه","a":"النابغة الذبياني","e":"لجودة سبكه وحسن ديباجته ورصانة أسلوبه. وكان النابغة حَكَمًا يُحتكم إليه في سوق عكاظ فتُضرب له قبة من أدم."},{"q":"الشاعر الذي يفضّله عليّ بن أبي طالب رضي الله عنه","a":"امرؤ القيس","e":"لأنه قال: إنه أسبقهم إلى الابتكار ولم يقل على مثال. وقد وُصف بأنه فتح للشعراء أبواب المعاني وابتدع ما تبعوه فيه."},{"q":"الشاعر الملقَّب بـ«أمير الشعراء»","a":"أحمد شوقي","e":"بويع بالإمارة في حفل كبير سنة ١٩٢٧. وهو رائد المسرح الشعري العربي، وله «مصرع كليوباترا» و«مجنون ليلى»."},{"q":"الشاعر الملقَّب بـ«شاعر النيل»","a":"حافظ إبراهيم","e":"لكثرة تغنّيه بمصر ونيلها وتصويره لهموم الشعب. وعُرف بأنه شاعر الاجتماعيات، في مقابل شوقي شاعر المناسبات الكبرى."},{"q":"الشاعر الملقَّب بـ«ديك الجنّ»","a":"عبد السلام بن رغبان","e":"شاعر عباسي من حمص، قيل لُقّب بذلك لخضرة عينيه. واشتُهر بقصة مأساوية قتل فيها محبوبته ثم رثاها."},{"q":"من هما «الطائيّان»؟","a":"أبو تمام والبحتري","e":"وسُمّيا بذلك لانتسابهما معًا إلى قبيلة طيّئ. وقد مثّلا مذهبين متقابلين: أبو تمام مذهب الصنعة والتعقيد، والبحتري مذهب السهولة وعمود الشعر."},{"q":"الشاعر الذي قتله شعره","a":"المتنبي","e":"فقد هجا ضبّة بن يزيد هجاءً مُقذعًا، فتعرّض له خاله فاتك الأسدي وقتله. ويُروى أنه همّ بالفرار فذُكّر ببيته في الفخر بالشجاعة فعاد فقُتل."},{"q":"الشاعر الذي قال: «الشعر نَكِدٌ بابه الشرّ»","a":"الأصمعي","e":"ومعنى العبارة أن الشعر يجود في أغراض الشر كالهجاء ويلين عن أغراض الخير. واستدل بأن من جوّد في الخير لان شعره كحسان حين دخل الإسلام."},{"q":"من مقاييس المفاضلة بين الشعراء عند ابن سلّام","a":"كثرة الشعر وجودته","e":"مع تعدد الأغراض وصحة الرواية والشهرة. ولم يجعل غموض المعنى مقياسًا، بل عدّه عيبًا؛ فالمعيار عنده الكمّ والكيف معًا."},{"q":"عرّف «الأدب» في العصر الجاهلي","a":"من المأدُبة، أي الطعام الذي يُدعى إليه الناس","e":"فـ«أدَب» بمعنى صنع مأدبة أو دعا إليها. ثم انتقل المعنى في الإسلام إلى التهذيب والتخلّق، ثم استقر في العصور المتأخرة على الفنون القولية."},{"q":"أكثر مجالات الأدب مناسبةً للنقد الأدبي","a":"النصوص الأدبية الصادقة","e":"لأن النقد يقيس صدق التجربة الشعورية وأصالة التعبير وجمال الصياغة. ولا مجال له في الكتابة العلمية التقريرية ولا في الأدب الموجَّه المصنوع."},{"q":"من ترجم «الإلياذة» إلى العربية؟","a":"سليمان البستاني","e":"نقلها شعرًا موزونًا مقفّى وقدّم لها بمقدمة ضافية في الأدب المقارن. وتُعدّ ترجمته من أعظم الأعمال الترجمية في النهضة العربية."},{"q":"ما «الإلياذة الإسلامية»؟","a":"ديوان «مجد الإسلام» لأحمد محرّم","e":"سُمّي كذلك لأنه حاكى فيه الملحمة اليونانية بنفَسٍ إسلامي، فصاغ السيرة النبوية شعرًا ملحميًّا. وهو من أبرز محاولات الملحمة في الشعر العربي الحديث."},{"q":"مؤلف «مصرع كليوباترا»","a":"أحمد شوقي","e":"وهي مسرحية شعرية تاريخية. وشوقي رائد المسرح الشعري العربي، وله أيضًا «مجنون ليلى» و«قمبيز» و«علي بك الكبير»."},{"q":"معلقة «عفتِ الديارُ محلُّها فمُقامُها» لمن؟","a":"لبيد بن ربيعة","e":"وهو من المخضرمين الذين أدركوا الجاهلية والإسلام، ويُروى أنه ترك الشعر بعد إسلامه. ومعلقته من أرقّ المعلقات في وصف الديار والظعائن."},{"q":"معلقة «ودِّعْ هُريرةَ إن الركبَ مرتحلُ» لمن؟","a":"الأعشى ميمون","e":"ويُلقَّب «صنّاجة العرب» لحسن موسيقى شعره. ومعلقته من المعلقات العشر في الروايات التي تتجاوز السبع."},{"q":"معلقة «يا دارَ ميّةَ بالعَلياءِ فالسَّنَدِ» لمن؟","a":"النابغة الذبياني","e":"وهو أحد حُكّام الشعر في سوق عكاظ. وقد اشتُهر باعتذارياته للنعمان بن المنذر وهي من أجود ما قيل في الاعتذار."},{"q":"معلقة «قفا نبكِ من ذكرى حبيبٍ ومنزلِ» لمن؟","a":"امرؤ القيس","e":"وهي أشهر المعلقات وأولها في أكثر الروايات. وقد وُصف بأنه سابق الشعراء إلى الوقوف على الأطلال والبكاء على الديار."},{"q":"معلقة «هل غادرَ الشعراءُ من مُتردَّمِ» لمن؟ وعلى أي بحر؟","a":"عنترة بن شداد — على البحر الكامل","e":"وتُلقَّب بالذهبية. ومطلعها تساؤل عن بقاء معنًى لم يسبق إليه الشعراء، وهو تصريح مبكر بهمّ الابتكار عند الشاعر."},{"q":"معلقة «ألا هُبِّي بصحنِكِ فاصبَحِينا» لمن؟","a":"عمرو بن كلثوم","e":"وهي معلقة قائمة على الفخر بقبيلة تغلب حتى قيل إنها ألهت بني تغلب عن المكارم. وفيها من المبالغة في الفخر ما صار مثلًا."},{"q":"معلقة «لِخَولةَ أطلالٌ ببُرقةِ ثَهمَدِ» لمن؟","a":"طرفة بن العبد","e":"وهو أصغر أصحاب المعلقات سنًّا، قُتل شابًّا. ومعلقته تجمع بين وصف الناقة وحكمة بالغة في قِصَر العمر ومصارع الأيام."},{"q":"معلقة «أمِن أمِّ أوفى دِمنةٌ لم تكلَّمِ» لمن؟","a":"زهير بن أبي سلمى","e":"وهي معلقة الحكمة والسلام، نظمها في مدح الساعيين في إصلاح حرب داحس والغبراء. وخاتمتها من أشهر أبواب الحكمة في الشعر الجاهلي."},{"q":"معلقة «آذَنَتْنا ببَينِها أسماءُ» لمن؟","a":"الحارث بن حِلِّزة","e":"وهو من قبيلة بكر، نظمها مفاخرًا ومحاجًّا أمام عمرو بن هند في مقابل معلقة عمرو بن كلثوم التغلبي. فهي معلقة خصومة وحِجاج."},{"q":"معلقة «أقفَرَ من أهلِه مَلحوبُ» لمن؟","a":"عبيد بن الأبرص","e":"وهو شاعر جاهلي قديم من بني أسد. ومعلقته تُعدّ من المعلقات العشر، وتمتاز بقِصَر تفعيلاتها واختلاف بنائها عن سائر المعلقات."},{"q":"مطلع «بانت سعادُ» لمن؟","a":"كعب بن زهير","e":"وهي قصيدة «البُردة» التي أنشدها بين يدي النبي صلى الله عليه وسلم معتذرًا فعفا عنه وكساه بُردته. وهي من أشهر قصائد الاعتذار والمدح النبوي."},{"q":"قُسّ بن ساعدة هو من أشهر…","a":"خطباء العرب","e":"وهو أسقف نجران، اشتُهر بخطبته في سوق عكاظ وبسجعه البليغ وحكمته. ويُضرب به المثل في الفصاحة فيقال: «أبلغ من قُسّ»."},{"q":"«الخلاء والعُمران» بينهما…","a":"تضاد","e":"فالخلاء هو المكان القفر الخالي، والعمران هو المأهول المبنيّ. والتضاد في اللفظين هو مبنى المحسّن البديعي المسمّى الطباق."},{"q":"من الشعراء السعوديين التقليديين","a":"محمد بن عثيمين","e":"وهو من شعراء الاتجاه الكلاسيكي المحافظ على عمود الشعر. أما غازي القصيبي وأحمد الصالح وسعد الحميدين فمن أصحاب الاتجاهات الحديثة."}],"r":[{"t":"المعلّقات العشر وشعراؤها","b":"\n<p>المعلقات قصائد جاهلية طوال بلغت الذروة في الجودة، وسُمّيت معلقات لأنها — في الرواية المشهورة —\nعُلّقت على أستار الكعبة، وقيل لأنها علِقت بالأذهان. وهي سبع في أشهر الروايات، وتُتمّ عشرًا\nبزيادة الأعشى والنابغة وعبيد بن الأبرص.</p>\n<table><tr><th>الشاعر</th><th>مفتاح المطلع</th></tr>\n<tr><td>امرؤ القيس</td><td>«قِفا نَبكِ من ذِكرى حبيبٍ ومنزلِ»</td></tr>\n<tr><td>طرفة بن العبد</td><td>«لِخَولةَ أطلالٌ ببُرقةِ ثَهمَدِ»</td></tr>\n<tr><td>زهير بن أبي سُلمى</td><td>«أمِن أمِّ أوفى دِمنةٌ لم تكلَّمِ»</td></tr>\n<tr><td>لبيد بن ربيعة</td><td>«عفتِ الديارُ مَحَلُّها فمُقامُها»</td></tr>\n<tr><td>عمرو بن كلثوم</td><td>«ألا هُبِّي بصَحنِكِ فاصبَحِينا»</td></tr>\n<tr><td>عنترة بن شداد</td><td>«هل غادرَ الشعراءُ من مُتردَّمِ»</td></tr>\n<tr><td>الحارث بن حِلِّزة</td><td>«آذَنَتْنا ببَينِها أسماءُ»</td></tr>\n<tr><td>الأعشى ميمون</td><td>«ودِّعْ هُريرةَ إنّ الرَّكبَ مُرتحِلُ»</td></tr>\n<tr><td>النابغة الذبياني</td><td>«يا دارَ ميّةَ بالعَلياءِ فالسَّنَدِ»</td></tr>\n<tr><td>عبيد بن الأبرص</td><td>«أقفَرَ من أهلِه مَلحوبُ»</td></tr></table>\n<p><b>ملاحظة:</b> معلقة عنترة تُلقَّب بـ«الذهبية» وهي على <b>البحر الكامل</b>.</p>\n"},{"t":"مدارس الشعر ومذاهبه","b":"\n<ul>\n<li><b>عبيد الشعر (الحَوليّات):</b> مدرسة نشأت في <b>العصر الجاهلي</b> واستمرت في صدر الإسلام،\nقوامها تنقيح القصيدة وتهذيبها وعرضها على النقاد قبل إذاعتها. وأشهر أعلامها\n<b>زهير بن أبي سلمى</b> و<b>الحُطيئة</b>.</li>\n<li><b>مدرسة الإحياء والبعث:</b> رائدها <b>محمود سامي البارودي</b>، ومن أعلامها شوقي وحافظ.\nعادت بالشعر إلى متانة الأسلوب القديم وجزالته، واهتمت بـ<b>القضايا الوطنية</b> والسياسية.</li>\n<li><b>مدرسة الديوان:</b> العقاد والمازني وعبد الرحمن شكري — دعت إلى الوحدة العضوية والذاتية.</li>\n<li><b>مدرسة أبولّو:</b> أحمد زكي أبو شادي وإبراهيم ناجي وعلي محمود طه — غلب عليها\nالرومانسية والنزعة الوجدانية.</li>\n<li><b>مدرسة المهجر:</b> أسّسها المهاجرون العرب في الأمريكتين، ومن أبرز أعلامها\n<b>جبران خليل جبران</b> و<b>ميخائيل نعيمة</b> و<b>إيليا أبو ماضي</b>.</li>\n</ul>\n"},{"t":"العصور الأدبية وخصائصها وفنونها","b":"\n<table><tr><th>العصر</th><th>من فنونه وظواهره</th></tr>\n<tr><td>الجاهلي</td><td>المعلقات، الوقوف على الأطلال، الصعاليك، الحكمة، الفخر والحماسة</td></tr>\n<tr><td>صدر الإسلام</td><td>شعر الدعوة والدفاع عنها، وأبرز شعرائه <b>حسان بن ثابت</b> شاعر الرسول</td></tr>\n<tr><td>الأموي</td><td><b>النقائض</b> (جرير والفرزدق والأخطل)، <b>الشعر العذري</b>، الشعر السياسي</td></tr>\n<tr><td>العباسي</td><td><b>الخمريات</b>، <b>الزهد</b> (أبو العتاهية)، <b>المقامات</b>، ازدهار النثر الفني</td></tr>\n<tr><td>الأندلسي</td><td>الموشحات، الأزجال، رثاء المدن، شعر الطبيعة</td></tr>\n<tr><td>المملوكي</td><td>كثرة البديع والتصنيع، ومن شعرائه <b>ابن الوردي</b></td></tr>\n<tr><td>الحديث</td><td><b>المقالة</b>، الرواية، القصة القصيرة، المسرح، الشعر الحر</td></tr></table>\n<p><b>فنّ المقامات:</b> ظهر في <b>العصر العباسي</b>، وأول من ابتكره <b>بديع الزمان الهمَذاني</b>،\nثم بلغ الذروة على يد <b>الحريري</b>. وهي حكايات قصيرة مسجوعة تدور حول بطل متسوّل أديب وراوٍ ثابت.</p>\n"},{"t":"ألقاب الشعراء والأدباء","b":"\n<table><tr><th>اللقب</th><th>صاحبه</th><th>سببه</th></tr>\n<tr><td>أمير الشعراء</td><td>أحمد شوقي</td><td>بويع بإمارة الشعر سنة ١٩٢٧</td></tr>\n<tr><td>شاعر النيل</td><td>حافظ إبراهيم</td><td>لتغنّيه بمصر ونيلها وشعبها</td></tr>\n<tr><td>شاعر القطرين</td><td>خليل مطران</td><td>لنشأته بين لبنان ومصر</td></tr>\n<tr><td>الطائيّان</td><td>أبو تمام والبحتري</td><td>لانتسابهما إلى قبيلة طيّئ</td></tr>\n<tr><td>ديك الجنّ</td><td>عبد السلام بن رغبان</td><td>قيل لخضرة عينيه</td></tr>\n<tr><td>المتنبي</td><td>أحمد بن الحسين</td><td>قيل لادّعائه النبوة في صباه، وقُتل بسبب شعره</td></tr>\n<tr><td>شاعر الرسول</td><td>حسان بن ثابت</td><td>لدفاعه عن الدعوة بشعره</td></tr></table>\n<p><b>تفضيلات الخلفاء المرويّة:</b> كان أبو بكر رضي الله عنه يُفضّل <b>النابغة الذبياني</b>،\nوعمر رضي الله عنه يُفضّل <b>زهير بن أبي سلمى</b> لعفّة شعره وحكمته،\nوعليّ رضي الله عنه يُفضّل <b>امرأ القيس</b> لسَبْقه وابتكاره.</p>\n"},{"t":"أمّهات كتب الأدب والنقد ومؤلفوها","b":"\n<table><tr><th>الكتاب</th><th>المؤلف</th></tr>\n<tr><td>البيان والتبيين — البخلاء — الحيوان</td><td>الجاحظ</td></tr>\n<tr><td>الشعر والشعراء — عيون الأخبار</td><td>ابن قتيبة</td></tr>\n<tr><td>طبقات فحول الشعراء</td><td>محمد بن سلّام الجُمَحي</td></tr>\n<tr><td>نقد الشعر</td><td>قُدامة بن جعفر</td></tr>\n<tr><td>الصناعتين: الكتابة والشعر</td><td>أبو هلال العسكري</td></tr>\n<tr><td>البديع</td><td>عبد الله بن المعتزّ</td></tr>\n<tr><td>أسرار البلاغة — دلائل الإعجاز</td><td>عبد القاهر الجرجاني</td></tr>\n<tr><td>الكامل في اللغة والأدب</td><td>المبرّد</td></tr>\n<tr><td>الأمالي</td><td>أبو علي القالي البغدادي</td></tr>\n<tr><td>العِقد الفريد</td><td>ابن عبد ربه الأندلسي</td></tr>\n<tr><td>رسالة الغفران — اللزوميات</td><td>أبو العلاء المعرّي</td></tr>\n<tr><td>رسالة التوابع والزوابع</td><td>ابن شُهَيد الأندلسي</td></tr>\n<tr><td>الأدب الكبير — الأدب الصغير — كليلة ودمنة (ترجمة)</td><td>ابن المقفّع</td></tr>\n<tr><td>الأيام (سيرة ذاتية)</td><td>طه حسين</td></tr>\n<tr><td>العَبَرات — النظرات</td><td>مصطفى لطفي المنفلوطي</td></tr>\n<tr><td>سارة (رواية)</td><td>عباس محمود العقاد</td></tr>\n<tr><td>الغِربال (نقد)</td><td>ميخائيل نعيمة</td></tr>\n<tr><td>زينب (أول رواية فنية حديثة)</td><td>محمد حسين هيكل</td></tr></table>\n<p><b>مقاييس المفاضلة عند ابن سلّام الجُمَحي:</b> اعتمد في «طبقات فحول الشعراء» على\n<b>كثرة الشعر وجودته</b> معًا، وعلى تعدد الأغراض، وعلى الشهرة والرواية الموثوقة — لا على غموض المعنى.</p>\n"},{"t":"الأدب العربي الحديث — أوائل وفنون","b":"\n<ul>\n<li><b>أول رواية فنية حديثة</b> في الأدب العربي: «زينب» لـ<b>محمد حسين هيكل</b>.</li>\n<li><b>أول أديب عربي نال جائزة نوبل في الآداب:</b> <b>نجيب محفوظ</b> سنة ١٩٨٨.</li>\n<li><b>مترجم «الإلياذة»</b> إلى العربية شعرًا: <b>سليمان البستاني</b>.</li>\n<li><b>«الإلياذة الإسلامية»</b> وصفٌ أُطلق على ديوان «مجد الإسلام» لـ<b>أحمد مُحرَّم</b>،\nلأنه حاكى فيه الملحمة اليونانية بنَفَسٍ إسلامي.</li>\n<li><b>مصرع كليوباترا</b> مسرحية شعرية لـ<b>أحمد شوقي</b>، وهو رائد المسرح الشعري العربي.</li>\n<li><b>المقالة</b> فنٌّ نثري ظهر في <b>العصر الحديث</b> مرتبطًا بنشأة الصحافة.</li>\n</ul>\n<p><b>فنون النثر وتعريفاتها — فرقٌ يتكرر السؤال عنه:</b></p>\n<ul>\n<li><b>الخطبة:</b> كلام يُقال في مواجهة الجمهور لإقناعهم واستمالتهم.</li>\n<li><b>الوصية:</b> توجيه لفرد أو جماعة قولًا أو كتابةً، غالبًا عند فراق أو موت.</li>\n<li><b>الحكمة:</b> قول موجز يعبّر عن خلاصة تجربة إنسانية.</li>\n<li><b>المثل:</b> عبارة موجزة قيلت في موقف ما ثم شاعت فتُضرب في كل ما يشبهه.</li>\n</ul>\n<p><b>التعبير الوظيفي والإبداعي:</b> الوظيفي ما يُقضى به حاجة عملية — التقرير، الرسالة، الإعلان،\nاللافتة، البرقية، التلخيص، المحضر، طلب التوظف. والإبداعي ما يُعبَّر به عن الوجدان —\n<b>كتابة القصة</b> والخاطرة والشعر. ويُشترط في الكتابة الإبداعية حسن الصياغة وجودة الأسلوب\nوسُموّ المعنى <b>جميعًا</b>.</p>\n"},{"t":"مصطلحات نقدية","b":"\n<ul>\n<li><b>معنى «الأدب» في الجاهلية:</b> كان مرتبطًا بـ<b>المأدُبة</b>، أي الطعام الذي يُدعى إليه الناس؛\nفـ«أدَبَ» بمعنى صنع مأدبة أو دعا إليها. ثم تطور المعنى إلى التهذيب ثم إلى الفنون القولية.</li>\n<li><b>عمود الشعر:</b> مجموعة الخصائص التي جعلها النقاد معيارًا لجودة القصيدة العربية الموروثة،\nوقد فصّلها المرزوقي في مقدمة شرح الحماسة.</li>\n<li><b>الصعاليك:</b> شعراء جاهليون خلعتهم قبائلهم أو انخلعوا عنها، غلب على شعرهم الفقر والثورة\nعلى أعراف القبيلة. ومن أشهرهم <b>عروة بن الورد</b> والشنفرى وتأبط شرًّا.</li>\n<li><b>النقائض:</b> فنّ أموي قائم على المعارضة الشعرية في الوزن والقافية مع الردّ والهجاء،\nوأقطابه جرير والفرزدق والأخطل.</li>\n<li><b>الشعر العذري:</b> شعر غزل عفيف ظهر في <b>العصر الأموي</b> في بادية الحجاز ونجد،\nيقوم على الوفاء لمحبوبة واحدة.</li>\n<li><b>أنسب مجالات النقد الأدبي:</b> النصوص الأدبية <b>الصادقة</b>، لأن النقد يقيس صدق التجربة\nوأصالة التعبير، ولا مجال له في الكتابة العلمية التقريرية.</li>\n</ul>\n"}]},{"c":"lugh","n":"الأصوات والمعاجم والدلالة","q":[{"q":"كم عدد حروف اللغة العربية؟","a":"ثمانية وعشرون","e":"هذا هو العدد المشهور لحروف الهجاء. وتصير تسعة وعشرين إذا عُدّت الهمزة حرفًا مستقلًّا عن الألف، وهو ما جرى عليه بعض من رتّب الترتيب الهجائي."},{"q":"حروف المدّ في اللغة العربية هي…","a":"الألف والواو والياء","e":"بشرط أن تكون ساكنة وأن تُجانس حركة ما قبلها: الألف بعد فتح، والواو بعد ضم، والياء بعد كسر. ومخرجها الجوف، ولذلك سُمّيت الحروف الجوفية أو الهوائية."},{"q":"ما حروف الحلق؟","a":"ستة: الهمزة والهاء (أقصى الحلق)، العين والحاء (وسطه)، الغين والخاء (أدناه)","e":"وقد جُمعت في قولهم: «أخي هاك علمًا حازه غير خاسر». ومعرفتها مهمة لأن الإظهار الحلقي في أحكام النون الساكنة معلَّق عليها."},{"q":"ما حروف القلقلة؟","a":"خمسة: ق ط ب ج د — مجموعة في «قُطْب جَدّ»","e":"والقلقلة اضطراب المخرج عند سكون الحرف حتى تُسمع له نبرة قوية. وسببها اجتماع صفتَي الشدة والجهر فيها، فلا يجري معها نَفَس ولا صوت."},{"q":"مخرج حرف الحاء","a":"الحلق (وسطه)","e":"فهو مع العين من وسط الحلق. وليس من اللسان ولا من الشفتين ولا من الحنك، وهذا ما يُستبعَد به سائر الخيارات."},{"q":"مخرج حرف الفاء","a":"شفوية أسنانية","e":"لأنه يخرج من باطن الشفة السفلى مع أطراف الثنايا العليا. فهو الحرف الوحيد الذي يجمع بين الشفة والسنّ في العربية."},{"q":"مخرج حرف القاف","a":"لَهَوي — من أقصى اللسان مع ما يحاذيه من الحنك","e":"وهو أعمق مخارج اللسان، يليه الكاف. وسُمّي لَهَويًّا لقربه من اللهاة."},{"q":"حرف الجيم من حروف…","a":"القلقلة (ومخرجه وسط اللسان)","e":"فهو مع الشين والياء غير المدية من وسط اللسان، ويُسمّى شجريًّا. وهو من حروف القلقلة الخمسة لاجتماع الشدة والجهر فيه."},{"q":"حرف الراء من حروف…","a":"التكرير","e":"وهو انفراد الراء بارتعاد طرف اللسان عند النطق بها ارتعادًا خفيفًا. والمطلوب في التجويد إخفاء هذا التكرير لا إظهاره."},{"q":"ما الحرف الذي ينفرد بصفة الاستطالة؟","a":"الضاد","e":"لامتداد الصوت من أول مخرجه إلى آخره على حافة اللسان مع الأضراس. ولانفراد العربية بهذا الحرف سُمّيت «لغة الضاد»."},{"q":"ما الحرف الذي ينفرد بصفة التفشّي؟","a":"الشين","e":"لانتشار الهواء في الفم عند النطق بها. وهي رخوة مهموسة مستفلة، وتفشّيها من أظهر صفاتها."},{"q":"حروف الصفير","a":"الصاد والزاي والسين","e":"ويظهر الصفير بقوة في الصاد ثم يضعف في الزاي ثم يزداد ضعفًا في السين على المشهور. وهي ثلاثتها من طرف اللسان مع الثنايا السفلى."},{"q":"ماذا يُطلق على اللغة العربية؟","a":"لغة الضاد","e":"لأن حرف الضاد يكاد ينفرد به العرب دون سائر الأمم، ولصفة الاستطالة التي لا توجد في غيره. وأما القول بأنها أصعب لغات العالم فوصف انطباعي لا اصطلاح."},{"q":"للكشف عن معنى «الإجلال» نرجع إلى مادة…","a":"جَلَّ (ج ل ل)","e":"لأننا نحذف الزوائد: أل والهمزة والألف، ثم نفكّ التضعيف فنصل إلى الأصل الثلاثي. ولا يصح الرجوع إلى «يجلّ» لأنه صيغة مضارع لا أصل مادة."},{"q":"«ألقت السفينة مراسيها على الشاطئ» — عبّر عنها بكلمة واحدة","a":"رَسَتْ","e":"لأن «رسا» فعل خاص بثبات السفينة وإرسائها، فيؤدي معنى الجملة كاملًا. أما «توقفت» و«وصلت» فأعمّ ولا يفيدان خصوصية إلقاء المراسي."},{"q":"ما معنى «صَهْ»؟","a":"اسكتْ","e":"وهي اسم فعل أمر مبني على السكون، فاعله ضمير مستتر وجوبًا تقديره «أنت». ونظائرها: مَهْ بمعنى انكفف، وآمين بمعنى استجب."},{"q":"على ماذا يُطلق «الضِّرغام»؟","a":"الأسد","e":"وهو من أسماء الأسد الكثيرة في العربية ومنها الليث والهِزَبر والغَضَنفَر والأسامة. وكثرة الأسماء للأسد من شواهد الترادف في العربية."},{"q":"«أفاض الشيخ في الحديث» — معنى «أفاض»","a":"أطال وأكثر","e":"من الفَيض وهو امتلاء الإناء حتى يسيل، فاستُعير لكثرة الكلام وبسطه. ولا يفيد اللفظ ذمًّا في أصله بل مجرد التوسع والإسهاب."},{"q":"«ولَغ في دمه» — معناها","a":"اغتابه ونال من عِرضه","e":"والأصل في «ولَغ» أن يشرب الكلب بطرف لسانه، فاستُعيرت للنيل من الأعراض على سبيل التقبيح. والسياق يدل عليها إذ ذُكرت بعد إظهار المودة في الحضور."},{"q":"معنى «شَجَن»","a":"همّ وحزن","e":"والشجن أيضًا الغصن المشتبك، ومنه قولهم «الحديث ذو شجون» أي يتشعب ويتداخل. والمعنى الغالب في الاستعمال هو الحزن والهمّ."},{"q":"مضاد «الوَسَن»","a":"الأَرَق","e":"لأن الوسن أول النوم والنعاس، وضدّه امتناع النوم وهو الأرق. ومنه قوله تعالى «لا تأخذه سِنةٌ ولا نوم»، والسِّنة من الوسن."},{"q":"معنى «يَحنث»","a":"يأثم ويُذنب","e":"والأصل فيه نقض اليمين، ومنه «الحِنث في اليمين». ثم توسع الاستعمال فأُطلق على الإثم عامةً."},{"q":"مرادف «فتَقَ»","a":"فتَحَ وشقَّ","e":"وضدّه «رتَقَ» بمعنى سدّ وأغلق. ومنه قوله تعالى في وصف السماوات والأرض بأنهما كانتا رتقًا ففُتقتا."},{"q":"مضاد «بالَغ»","a":"قلَّل","e":"لأن المبالغة زيادة وإفراط، وضدّها التقليل والتقصير. وأما «أحسن» و«بادر» فليستا من بابه في التقابل."},{"q":"مرادف «مُرهَق»","a":"مُتعَب","e":"من الإرهاق وهو تحميل ما لا يُطاق. و«مُرهَف» معناه رقيق حادّ، و«متوتر» حال نفسية، فلا يصلح أحدهما مرادفًا."},{"q":"مرادف «أريب»","a":"ذكيّ عاقل حاذق","e":"من الأَرَب وهو الحاجة والدهاء، ومنه «الأريب» للماهر في تدبير أمره. ويقاربه: لوذعيّ، ألمعيّ، فطِن."},{"q":"مرادف «صَلِف»","a":"متكبّر متعجرف","e":"من الصَّلَف وهو مجاوزة القدر في الادّعاء. ويقاربه: ذو كِبر، مغرور، متغطرس، متبجّح."},{"q":"مرادف «قَفْر»","a":"مكان خالٍ مهجور","e":"من القَفار وهي الأرض التي لا ماء فيها ولا نبات ولا أنيس. ومنه «أقفر» بمعنى خلا من أهله."},{"q":"مرادف «سامٍ»","a":"عالٍ رفيع جليل","e":"من السُّمُوّ وهو الارتفاع. ويُستعمل حسيًّا ومعنويًّا، فيقال: مكان سامٍ وخُلُق سامٍ."},{"q":"مرادف «زائف»","a":"مغشوش غير حقيقي","e":"والأصل في الزَّيف ردّ الدرهم لغشّه، ثم عُمّم على كل ما خالف الحقيقة. ومنه «زيّف الكلام» أي أظهر بطلانه."},{"q":"مرادف «نمطيّ»","a":"رتيب على وتيرة واحدة","e":"من النَّمَط وهو الضرب والنوع والطريقة. ويُستعمل حديثًا بمعنى الجمود على صورة مكررة بلا تجديد."},{"q":"مرادف «سرمديّ»","a":"دائم أبديّ لا ينقطع","e":"والسَّرمد دوام الزمان واتصاله. ومنه قوله تعالى في جعل الليل سرمدًا أي دائمًا لا نهار بعده."},{"q":"مرادف «قانع»","a":"راضٍ بما قُسم له","e":"من القناعة وهي الرضا بالكفاف. وتنبّه إلى أن «قَنِع» بالكسر معناها رضي، و«قَنَع» بالفتح معناها سأل وتذلل — وهما ضدّان."},{"q":"«الخلاء والعمران» بينهما…","a":"تضاد","e":"فالخلاء الأرض القفر الخالية، والعمران المكان المأهول المبنيّ. واجتماع المتضادين في الكلام هو مبنى الطباق في علم البديع."},{"q":"أقسام الكلمة في اللغة العربية ثلاثة: اسم، فعل، و…","a":"حرف","e":"وليست الصفة ولا الجملة قسمًا رابعًا؛ فالصفة اسم، والجملة تركيب من هذه الأقسام. وهذا الحصر الثلاثي متفق عليه عند النحاة."},{"q":"اللغة المستخدمة في وسائل الإعلام لوصف المسابقات والمباريات","a":"عامية دارجة / عربية ركيكة","e":"لأن البث الحيّ وسرعة الوصف يدفعان المعلّق إلى التبسيط، فتتسرب العامية وتضعف الصياغة. وهي ليست علمية دقيقة ولا أدبية راقية، والمعوّل على صيغة الخيارات."},{"q":"أفضل الطرق لتثبيت المترادفات في ذهن الطفل","a":"أن يضع الكلمات في سياقات مختلفة","e":"لأن المعنى في العربية يتحدد بالسياق لا بالحفظ المجرد، فالاستعمال المتنوع يرسّخ الفروق الدقيقة. أما السؤال المباشر عن المرادف أو المضاد فاختبار للحفظ لا تثبيت للمعنى."},{"q":"أفضل وسيلة لمعرفة أهم الكتب الحديثة بسرعة","a":"البحث في الشبكة (الإنترنت)","e":"لأن المطلوب في السؤال قيد السرعة والحداثة معًا، والمعاجم والفهارس الورقية لا تواكب الجديد. أما كتب التراث فمظنّة القديم لا الحديث."},{"q":"إذا أردت البحث عن المخطوطات والمعقوفات ترجع إلى…","a":"كتب التراث والفهارس المتخصصة","e":"لأن المخطوطات شأن تراثي توثيقي، ومظانّها فهارس المكتبات ودور الوثائق. ولا تُغني عنها الكتب المدرسية ولا المراجع العامة."}],"r":[{"t":"مخارج الحروف العربية","b":"\n<p>مخارج الحروف عند علماء التجويد <b>سبعة عشر مخرجًا</b> موزعة على خمسة مواضع عامة:\nالجوف، والحلق، واللسان، والشفتان، والخيشوم.</p>\n<table><tr><th>الموضع</th><th>الحروف</th></tr>\n<tr><td><b>الجوف</b></td><td>حروف المدّ الثلاثة: الألف والواو والياء الساكنات</td></tr>\n<tr><td><b>أقصى الحلق</b></td><td>الهمزة والهاء</td></tr>\n<tr><td><b>وسط الحلق</b></td><td>العين والحاء</td></tr>\n<tr><td><b>أدنى الحلق</b></td><td>الغين والخاء</td></tr>\n<tr><td><b>أقصى اللسان (لَهَوي)</b></td><td>القاف ثم الكاف</td></tr>\n<tr><td><b>وسط اللسان (شَجري)</b></td><td>الجيم والشين والياء غير المدّية</td></tr>\n<tr><td><b>حافة اللسان</b></td><td>الضاد (مع الأضراس)، واللام</td></tr>\n<tr><td><b>طرف اللسان</b></td><td>النون، والراء، والطاء والدال والتاء (نِطعية)، والصاد والزاي والسين (أسَلية)</td></tr>\n<tr><td><b>بين طرف اللسان وأطراف الثنايا (لِثَوي)</b></td><td>الظاء والذال والثاء</td></tr>\n<tr><td><b>الشفتان</b></td><td>الباء والميم والواو (شفوية)، والفاء (شفوية أسنانية)</td></tr>\n<tr><td><b>الخيشوم</b></td><td>الغُنّة</td></tr></table>\n<p><b>مفاتيح الأسئلة:</b> الحاء <b>حلقية</b> (وسط الحلق) · القاف <b>لَهَوية</b> (أقصى اللسان) ·\nالفاء <b>شفوية أسنانية</b> · الجيم <b>شجرية</b> (وسط اللسان) · حروف الحلق ستة:\nأقصاه (ء، هـ) ووسطه (ع، ح) وأدناه (غ، خ).</p>\n"},{"t":"صفات الحروف","b":"\n<table><tr><th>الصفة</th><th>معناها</th><th>حروفها</th></tr>\n<tr><td>الهمس</td><td>جريان النَّفَس لضعف الاعتماد على المخرج</td><td>مجموعة في: «فحثّه شخصٌ سكت»</td></tr>\n<tr><td>الجهر</td><td>انحباس النَّفَس لقوة الاعتماد</td><td>بقية الحروف</td></tr>\n<tr><td>الشدة</td><td>انحباس الصوت ثم انطلاقه بقوة</td><td>مجموعة في: «أجِدْ قَطٍ بكتْ»</td></tr>\n<tr><td>التوسط</td><td>بين الشدة والرخاوة</td><td>«لن عمر» (ل ن ع م ر)</td></tr>\n<tr><td>الرخاوة</td><td>جريان الصوت</td><td>بقية الحروف</td></tr>\n<tr><td>الاستعلاء</td><td>ارتفاع معظم اللسان إلى الحنك</td><td>«خُصَّ ضَغطٍ قِظ»</td></tr>\n<tr><td>الاستفال</td><td>انخفاض اللسان</td><td>بقية الحروف</td></tr>\n<tr><td>الإطباق</td><td>انطباق اللسان على الحنك الأعلى</td><td>الصاد والضاد والطاء والظاء</td></tr>\n<tr><td>القلقلة</td><td>اضطراب المخرج عند سكون الحرف حتى يُسمع له نبرة</td><td>«قطب جد» (ق ط ب ج د)</td></tr>\n<tr><td>الصفير</td><td>صوت زائد يشبه الصفير</td><td>الصاد ثم الزاي ثم السين</td></tr>\n<tr><td>التكرير</td><td>ارتعاد طرف اللسان</td><td>الراء وحدها</td></tr>\n<tr><td>التفشّي</td><td>انتشار الهواء في الفم</td><td>الشين وحدها</td></tr>\n<tr><td>الاستطالة</td><td>امتداد الصوت من أول المخرج إلى آخره</td><td>الضاد وحدها</td></tr>\n<tr><td>الانحراف</td><td>ميل الصوت عن مخرجه إلى غيره</td><td>اللام والراء</td></tr>\n<tr><td>اللين</td><td>خروج الصوت بسهولة وامتداد</td><td>الألف والواو والياء</td></tr></table>\n<p><b>عدد حروف الهجاء العربية ثمانية وعشرون</b> حرفًا، وتصير تسعة وعشرين بعدّ الهمزة مستقلةً عن الألف.\nو<b>حروف المدّ ثلاثة:</b> الألف والواو والياء الساكنات المجانِسة لحركة ما قبلها.</p>\n"},{"t":"المعاجم وطرق الكشف فيها","b":"\n<p><b>أنواع المعاجم بحسب الترتيب:</b></p>\n<ul>\n<li><b>معاجم المخارج الصوتية:</b> رتّبت المواد على مخارج الحروف من أقصى الحلق إلى الشفتين.\nرائدها «العين» للخليل بن أحمد.</li>\n<li><b>معاجم القافية (آخر الأصول):</b> يُنظر فيها إلى الحرف الأخير بابًا والأول فصلًا.\nومنها «الصحاح» للجوهري و«لسان العرب» لابن منظور و«القاموس المحيط» للفيروزآبادي.</li>\n<li><b>معاجم أوائل الأصول (الهجائي المعتاد):</b> يُنظر إلى الحرف الأول ثم ما يليه.\nومنها «أساس البلاغة» للزمخشري و«المعجم الوسيط».</li>\n</ul>\n<p><b>خطوات الكشف:</b> ردّ الكلمة إلى <b>مجردها الثلاثي</b> بحذف الزوائد،\nثم ردّ حرف العلة إلى أصله، ثم فكّ التضعيف.</p>\n<p><b>تطبيق:</b> للكشف عن «الإجلال» نحذف الزوائد (أل والهمزة والألف) فيبقى «ج ل ل»،\nثم نفكّ التضعيف فنرجع إلى مادة <b>«جَلَّ»</b>. فلا يصح البحث عنها في «يجلّ» لأنه مضارع\nولا في «أجلّ» لأنه مزيد.</p>\n"},{"t":"الترادف والتضاد والاشتراك اللفظي","b":"\n<ul>\n<li><b>الترادف:</b> تعدد الألفاظ واتحاد المعنى — أسد، ليث، ضِرغام، هِزَبر.</li>\n<li><b>التضاد:</b> دلالة اللفظ الواحد على معنيين متقابلين — «الجَون» للأبيض وللأسود.\nويُطلق التضاد أيضًا على تقابل لفظين في المعنى، كالخلاء والعُمران.</li>\n<li><b>الاشتراك اللفظي:</b> دلالة اللفظ الواحد على أكثر من معنى بلا تقابل — «العين» للباصرة\nوللجاسوس وللينبوع وللذهب.</li>\n</ul>\n<p><b>مفردات يتكرر السؤال عنها:</b></p>\n<table><tr><th>الكلمة</th><th>معناها</th></tr>\n<tr><td>صَهْ</td><td>اسم فعل أمر بمعنى: اسكتْ</td></tr>\n<tr><td>الضِّرغام</td><td>الأسد</td></tr>\n<tr><td>أفاض في الحديث</td><td>أطال وأكثر</td></tr>\n<tr><td>ولَغ في دمه</td><td>اغتابه ونال من عِرضه</td></tr>\n<tr><td>رست السفينة</td><td>ثبتت وألقت مراسيها</td></tr>\n<tr><td>شَجَن</td><td>همّ وحزن</td></tr>\n<tr><td>الوَسَن</td><td>النُّعاس وأول النوم — وضدّه الأرق</td></tr>\n<tr><td>يَحنث</td><td>يأثم ويُذنب (ومنه الحِنث في اليمين)</td></tr>\n<tr><td>فتَقَ</td><td>شقَّ وفتح — وضدّه رتَقَ</td></tr>\n<tr><td>بالَغ</td><td>أكثر وزاد — وضدّه قلّل</td></tr>\n<tr><td>أريب</td><td>ذكيّ عاقل حاذق</td></tr>\n<tr><td>صَلِف</td><td>متكبّر متعجرف ذو كِبر</td></tr>\n<tr><td>قَفْر</td><td>مكان خالٍ مهجور جَدب</td></tr>\n<tr><td>سامٍ</td><td>عالٍ رفيع جليل</td></tr>\n<tr><td>زائف</td><td>مغشوش غير حقيقي</td></tr>\n<tr><td>نمطيّ</td><td>رتيب على وتيرة واحدة</td></tr>\n<tr><td>سرمديّ</td><td>دائم أبديّ</td></tr>\n<tr><td>قانع</td><td>راضٍ بما قُسم له</td></tr>\n<tr><td>مُرهَق</td><td>متعَب</td></tr></table>\n"},{"t":"مستويات اللغة واستعمالاتها","b":"\n<p><b>مستويات الأداء اللغوي:</b> فصحى التراث، وفصحى العصر، واللغة الوسطى،\nوالعامية المثقفة، والعامية الدارجة.</p>\n<p><b>لغة الإعلام الرياضي:</b> الغالب عليها في وصف المباريات والمسابقات أنها ليست أدبية راقية\nولا علمية دقيقة، وإنما تميل إلى <b>التبسيط والركاكة وتسرّب العامية</b> لسرعة الأداء وضغط البثّ الحيّ.\nوهذا ما يُلتمس في خيارات هذا السؤال.</p>\n<p><b>لماذا سُمّيت العربية «لغة الضاد»؟</b> لأن <b>الضاد</b> حرف تكاد تنفرد به العربية بين اللغات،\nوله صفة <b>الاستطالة</b> التي لا توجد في غيره، فصار علامةً عليها.</p>\n"}]},{"c":"turq","n":"طرق التدريس","q":[{"q":"ما الطريقة التي تنتقل من الجزئي إلى الكلي ومحورها المتعلم؟","a":"الطريقة الاستقرائية","e":"لأنها تبدأ بالأمثلة الجزئية ثم توازن بينها حتى يستنبط المتعلم القاعدة الكلية بنفسه. ولذلك كان محورها المتعلم لا المعلم، وهذا أهم ما يميزها عن القياسية."},{"q":"ما عيوب الطريقة الاستقرائية؟","a":"البطء، وعدم ضمان وصول جميع الطلبة إلى الاستنتاج نفسه","e":"لأن الاستنباط يحتاج وقتًا طويلًا في العرض والموازنة. ولأن قدرات المتعلمين متفاوتة فقد يصل بعضهم إلى نتيجة ناقصة أو مغايرة."},{"q":"ما الطريقة التي تنتقل من الحكم على الكل إلى الحكم على الجزء؟","a":"الطريقة القياسية","e":"فهي تبدأ بعرض القاعدة الكلية ثم تنزل إلى الأمثلة الجزئية المنطبقة عليها. والمعلم فيها هو المحور لأنه يلقّن النتائج مباشرة."},{"q":"ما عيوب الطريقة القياسية؟","a":"إلغاء دور المتعلم، ومخالفة التدرج من الأسهل إلى الأصعب","e":"فهي تجعله أداة حفظ لا مشاركًا فاعلًا. وتبدأ بالقاعدة المجردة وهي الأصعب ثم تنزل إلى المثال المحسوس وهو الأسهل، فتعكس قانون التعلم الطبيعي."},{"q":"ما مزايا الطريقة القياسية؟","a":"السرعة وقلة الجهد","e":"فالمعلم يوصل فكرته في أقصر وقت ممكن، ولا تحتاج جهدًا كبيرًا منه ولا من المتعلم. ولذلك يفضّلها كثير من المدرسين في الفصول المزدحمة وضيق الوقت."},{"q":"ما الطريقة التي ترتكز على اختيار نصوص متصلة المعنى متكاملة الموضوع؟","a":"طريقة الأساليب المتصلة (النص المعدَّلة)","e":"فهي تستخرج الشواهد من نص واحد مترابط بدل أمثلة متفرقة. وبهذا تربط القاعدة بالتعبير الصحيح وتصل اللغة بالحياة اليومية."},{"q":"ما الفرق بين طريقة النص والطريقة الاستقرائية؟","a":"ترابط النص وتكامل معناه","e":"فكلتاهما تنتقل من الأمثلة إلى القاعدة، لكن نصوص طريقة النص متماسكة تؤدي معنًى كاملًا. أما أمثلة الاستقرائية فمتفرقة لا رابط بينها."},{"q":"ما عيوب طريقة الأساليب المتصلة؟","a":"صعوبة الحصول على نص متكامل، وتكلّف النصوص المصنوعة","e":"لأن جمع الشواهد المطلوبة في نص واحد مترابط أمر عسير. ولذلك يلجأ المؤلف إلى صناعة النص صناعةً، فيبدو متكلَّفًا بعيدًا عن السليقة."},{"q":"ما الطريقة التي تُعدّ أساس معظم طرق التدريس الحديثة؟","a":"طريقة الحوار والمناقشة","e":"لأنها تقوم على التفاعل والاتصال اللغوي داخل الصف. وتعلّم المتعلم احترام الرأي والرأي الآخر، وتنمّي مهارتي التحليل والمحاجّة."},{"q":"ما نوعا المناقشة؟","a":"الحرة والمضبوطة (الموجَّهة)","e":"فالحرة يُترك فيها مجال القول مفتوحًا ويُتوصَّل من خلالها إلى أهداف جديدة مبتكرة. والموجَّهة يوجّه فيها المعلم النقاش نحو قضية محددة سلفًا."},{"q":"ما غاية طريقة التسميع والحفظ؟","a":"قياس قدرة التلاميذ على تحصيل المادة والحكم عليهم","e":"وهي تصلح لتثبيت المحفوظات من القصائد والآيات والشواهد. ولا تصلح أساسًا لتدريس القواعد لأنها لا تنمّي الفهم ولا تورث مهارة التطبيق."},{"q":"أسلوب استفهام تستخدمه لتنمية التفكير لدى المتعلم","a":"لماذا؟ وكيف؟","e":"لأنهما سؤالان مفتوحان يطالبان بالتعليل وبيان الكيفية، فينقلان المتعلم من مستوى التذكر إلى مستوى التحليل. أما «هل» وأسئلة «متى وأين» فتقيس الاستدعاء وحده."},{"q":"أفضل طريقة لتثبيت المترادفات في ذهن الطفل","a":"وضع الكلمات في سياقات مختلفة","e":"لأن المعنى في العربية يتحدد بالسياق، فالاستعمال المتنوع يُظهر الفروق الدقيقة بين المترادفات. أما سؤاله عن الجمع أو المضاد فاختبار لمعلومة لا ترسيخ لمعنى."},{"q":"لتحسين الخط لدى الطلاب يُفضَّل…","a":"المِران وتقليد النماذج","e":"لأن التدريب وحده بلا نموذج صحيح يثبّت الخطأ ويرسّخه، والنموذج وحده بلا تدريب لا يُكسب مهارة. فالجمع بينهما هو السبيل، والخط مهارة مكتسبة لا موهبة فطرية."},{"q":"كتابة القصة من موضوعات التعبير…","a":"الإبداعي","e":"لأنها تعبير عن الوجدان والخيال بلغة موحية، وغايتها التأثير الفني. أما التعبير الوظيفي فيؤدي حاجة عملية كالرسالة والتقرير والإعلان والبرقية."},{"q":"كتابة الإعلان تندرج تحت…","a":"التعبير الوظيفي","e":"لأنه يؤدي وظيفة عملية محددة هي إبلاغ الناس بخبر أو سلعة. ومثله: اللافتة، والتقرير، والرسالة، والبرقية، والتلخيص، والتعليق، وطلب التوظّف."},{"q":"في الكتابة الإبداعية ينبغي توافر…","a":"حسن الصياغة وجودة الأسلوب وسموّ المعنى جميعًا","e":"لأن الإبداع لا يقوم بأحد هذه الأركان منفردًا؛ فالمعنى السامي بصياغة رديئة لا يصل، والصياغة الجميلة بمعنى تافه لا تُغني. فالشروط مجتمعة لا مفترقة."},{"q":"ما المقصود بالخطبة؟","a":"كلام يُقال في مواجهة الجمهور","e":"غايته الإقناع والاستمالة، ويعتمد على قوة الحجة وحسن الإلقاء وحضور البديهة. ويُشترط فيها مراعاة حال السامعين والمقام."},{"q":"ما المقصود بالوصية؟","a":"توجيه لفرد أو جماعة قولًا أو كتابةً","e":"غالبًا عند فراق أو قرب موت، وتتضمن نصحًا وإرشادًا. وتمتاز بنبرة الشفقة وقصد النفع المجرد."},{"q":"ما المقصود بالحكمة؟","a":"قول موجز يعبّر عن خلاصة تجربة","e":"تصدر عن ذي عقل وتجربة، ويُقصد بها التوجيه العام لا موقف بعينه. وبها يُعرف فضل التجربة الإنسانية المكثّفة في عبارة قصيرة."},{"q":"ما المقصود بالمثل؟","a":"عبارة موجزة قيلت في موقف ما ثم شاعت","e":"فيُضرب بها في كل موقف يشبه الأول. والفرق بينها وبين الحكمة أن للمثل مورِدًا ومضرِبًا، والحكمة لا مورد لها بل هي خلاصة تأمل."},{"q":"«كلام يُقال لإقناع المستمعين في جمل قصيرة» — هذا تعريف…","a":"الخطبة","e":"لأن الخطابة فنّ مواجهة الجمهور بقصد الإقناع والاستمالة. وتميل إلى الجمل القصيرة المؤثرة لأنها شفوية تُلقى ويُراد لها أن تعلق بالأذهان."},{"q":"اللغة العربية تُعتبر من أكثر اللغات تبعيةً للمنهج…","a":"التكاملي","e":"لأن فروعها — نحو وصرف وبلاغة وقراءة وتعبير وإملاء — متشابكة لا تُفهم منفردة. فالمنهج التكاملي يعالجها وحدةً واحدة تخدم مهارات اللغة الأربع."},{"q":"ما مهارات اللغة الأربع وترتيب اكتسابها؟","a":"الاستماع ثم التحدث ثم القراءة ثم الكتابة","e":"فالاستماع والقراءة مهارتا استقبال، والتحدث والكتابة مهارتا إنتاج. والترتيب طبيعي يحاكي اكتساب الطفل للغته الأم، وعليه تُبنى المناهج الحديثة."}],"r":[{"t":"الطريقة الاستقرائية (الاستنباطية)","b":"\n<p>تسير من <b>الجزئي إلى الكلي</b>، ومن الأمثلة إلى القاعدة. يعرض المعلم أمثلة متنوعة،\nويوجّه التلاميذ إلى ملاحظتها وموازنتها، حتى يستنبطوا القاعدة بأنفسهم، ثم تُطبَّق.</p>\n<p><b>خطواتها:</b> التمهيد ← عرض الأمثلة ← الموازنة والربط ← استنباط القاعدة ← التطبيق.</p>\n<p><b>مزاياها:</b> تجعل <b>المتعلم</b> محور العملية التعليمية، وتعتمد على الملاحظة والمشاهدة،\nوترسّخ المعلومة لأن المتعلم توصّل إليها بنفسه، وترتّب الحقائق في ذهنه، وتجعل المادة مشوّقة محبّبة.</p>\n<p><b>عيوبها:</b> لا تضمن وصول جميع الطلبة إلى الاستنتاج نفسه، وهي <b>بطيئة</b> تستهلك وقتًا طويلًا\nفي إيصال المعلومة.</p>\n"},{"t":"الطريقة القياسية","b":"\n<p>تسير من <b>الكلي إلى الجزئي</b>، ومن الحكم على الكل إلى الحكم على الجزء.\nيبدأ المعلم بعرض القاعدة مباشرةً، ثم يسوق الأمثلة التي تنطبق عليها، ثم يطلب التطبيق.</p>\n<p><b>مزاياها:</b> سريعة لا تحتاج وقتًا كبيرًا، ولا تتطلب جهدًا كبيرًا من المعلم ولا من المتعلم،\nومناسبة للقواعد المجردة والفصول كثيرة العدد.</p>\n<p><b>عيوبها:</b> تُلغي دور المتعلم في المشاركة الفعّالة وتجعله مجرد أداة للحفظ،\nوتخالف قوانين التعلم التي تقتضي التدرج من <b>الأسهل إلى الأصعب</b> لأنها تبدأ بالمجرد الصعب\n(القاعدة) ثم تنزل إلى المحسوس السهل (المثال).</p>\n<p><b>والمعلم فيها هو المحور</b>، بخلاف الاستقرائية التي محورها المتعلم — وهذا هو أهم فارق بينهما.</p>\n"},{"t":"طريقة الأساليب المتصلة (النص المعدَّلة)","b":"\n<p>تقوم على اختيار <b>نص متصل المعنى متكامل الموضوع</b> يُستخرج منه الشواهد النحوية،\nبدل الأمثلة المتفرقة غير المترابطة.</p>\n<p><b>وجه شبهها بالاستقرائية:</b> كلتاهما تنتقل من الأمثلة إلى القاعدة.\n<b>ووجه الفرق:</b> أن نصوص هذه الطريقة <b>مترابطة متماسكة تؤدي معنًى كاملًا</b>،\nبينما أمثلة الاستقرائية متفرقة لا رابط بينها.</p>\n<p><b>مزاياها:</b> تمزج القاعدة بالتعبير الصحيح فترسّخ اللغة، وتربط اللغة بالحياة اليومية،\nوتزيد تمرّس المتعلم بالمعاني لكثرة ما يتدرب عليه من سياقات.</p>\n<p><b>عيوبها:</b> صعوبة الحصول على نص متكامل المعنى يحوي كل الشواهد المطلوبة،\nوميل النصوص المصنوعة لهذا الغرض إلى <b>التكلّف والاصطناع</b>.</p>\n"},{"t":"طريقة الحوار والمناقشة","b":"\n<p>هي أساس معظم طرق التدريس الحديثة، لأنها تقوم على <b>التفاعل والاتصال اللغوي داخل الصف</b>،\nسواء بإجابات التلاميذ أو باستفساراتهم فيما بينهم أو مع معلمهم.</p>\n<p><b>مزاياها:</b> تخلق جوًّا من الحرية والمشاركة، وتعوّد المتعلم على احترام الرأي والرأي الآخر،\nوتنمّي مهارة التحليل وتحديد مواضع الاتفاق والاختلاف، وتدرّبه على مواجهة الجمهور.</p>\n<p><b>نوعاها:</b></p>\n<ul>\n<li><b>المناقشة الحرة:</b> يُترك فيها مجال القول مفتوحًا، ويُتوصَّل من خلالها إلى أهداف جديدة مبتكرة.</li>\n<li><b>المناقشة المضبوطة (الموجَّهة):</b> يوجّه فيها المعلم النقاش نحو قضية محددة سلفًا.</li>\n</ul>\n"},{"t":"طريقة التسميع والحفظ","b":"\n<p>تعتمد على إتقان المتعلم لحفظ موضوع معين، ويُلقَّن من خلالها حفظ القصائد والآيات\nوالقواعد والقوانين.</p>\n<p><b>غايتها الرئيسة:</b> قياس قدرة التلاميذ على تحصيل المادة والحكم عليهم بأسلوب التسميع.\nوفيها تعويدٌ للطالب على مواجهة الآخرين.</p>\n<p><b>موضعها الصحيح:</b> هي طريقة مساعدة لا أصلية؛ تصلح لما يُراد تثبيته نصًّا\nكالمحفوظات والشواهد، ولا تصلح أساسًا لتدريس القواعد لأنها لا تنمّي الفهم ولا التطبيق.</p>\n"},{"t":"أساليب الأسئلة الصفّية وتنمية التفكير","b":"\n<p>ليست الأسئلة سواءً في قيمتها التربوية:</p>\n<ul>\n<li><b>الأسئلة المغلقة</b> (هل؟ / ما جوابها نعم أو لا) تقيس الاستدعاء وحده ولا تنمّي التفكير.</li>\n<li><b>أسئلة التذكر</b> (متى؟ أين؟ مَن؟) تقف عند المستوى الأدنى من مستويات المعرفة.</li>\n<li><b>الأسئلة المفتوحة التحليلية</b> (<b>لماذا؟ وكيف؟</b>) هي التي تنمّي التفكير،\nلأنها تطالب المتعلم بالتعليل وبيان الكيفية، فتنقله من الحفظ إلى الفهم والتحليل.</li>\n</ul>\n<p><b>تنمية الثروة اللغوية:</b> أنجع وسيلة لتثبيت المترادفات هي <b>وضع الكلمة في سياقات متنوعة</b>،\nلأن المعنى يتحدد بالسياق، فيدرك المتعلم الفروق الدقيقة بين المترادفات التي لا يدركها بالحفظ المجرد.</p>\n<p><b>تحسين الخط:</b> الأنجع فيه <b>المِران وتقليد النماذج الجيدة</b> معًا؛\nفالمران وحده بلا نموذج يثبّت الخطأ، والنموذج بلا مران لا يُكسب مهارة.\nوليس الخط موهبة فطرية لا تُكتسب.</p>\n"},{"t":"التعبير: الوظيفي والإبداعي","b":"\n<p><b>التعبير الوظيفي:</b> ما يؤدي وظيفة عملية في الحياة، ولغته مباشرة محددة.\nومن موضوعاته: التقرير، والرسالة، والإعلان، واللافتة، والبرقية، والتلخيص، والتعليق،\nوالمحضر، وطلب التوظّف، والمناقشة، والمقابلة.</p>\n<p><b>التعبير الإبداعي:</b> ما يُعبَّر به عن المشاعر والأخيلة، ولغته موحية. ومن موضوعاته:\n<b>كتابة القصة</b>، والخاطرة، والمسرحية، ووصف المشاهد.</p>\n<p><b>شروط جودة الكتابة الإبداعية:</b> حُسن الصياغة، وجودة الأسلوب، وسُموّ المعنى —\nوهي مجتمعة لا مفترقة؛ فلا يكفي أحدها وحده.</p>\n"},{"t":"مهارات اللغة الأربع وترتيب تعليمها","b":"\n<p>مهارات اللغة أربع، تنقسم إلى مهارات استقبال ومهارات إنتاج:</p>\n<ul>\n<li><b>الاستماع</b> (استقبال شفوي) — وهو أول ما يكتسبه الطفل.</li>\n<li><b>التحدث</b> (إنتاج شفوي).</li>\n<li><b>القراءة</b> (استقبال كتابي).</li>\n<li><b>الكتابة</b> (إنتاج كتابي) — وهي آخرها وأصعبها.</li>\n</ul>\n<p>والترتيب الطبيعي في الاكتساب: استماع ← تحدث ← قراءة ← كتابة.\nوتُبنى مناهج تعليم اللغة الحديثة على هذا التدرج وعلى <b>التكامل</b> بين المهارات\nلا على فصلها فروعًا منعزلة.</p>\n"}]}],"f":[{"n":"360 سؤال في اللغة العربية","k":"بنك أسئلة عام","st":"تعذّرت قراءته — الملف لا يستجيب للتنزيل المباشر"},{"n":"أسئلة تخصص لغة عربية لمسابقة وزارة التربية والتعليم","k":"أسئلة الجهاز المركزي","st":"قُرئ كاملًا"},{"n":"الأسئلة التي وردت لتخصص اللغة العربية — مراجعة ما قبل الامتحان","k":"أسئلة وردت فعلًا","st":"قُرئ كاملًا"},{"n":"أساسيات في قواعد الإملاء (المرشد الإملائي)","k":"مرجع إملاء","st":"قُرئ كاملًا"},{"n":"اللغة العربية تخصص للجميع","k":"بنك أسئلة","st":"قُرئ"},{"n":"تسريبات الحسام — أحدث الأسئلة في تخصص اللغة العربية (3)","k":"بلاغة وعروض وأدب","st":"قُرئ"},{"n":"تسريبات الحسام في العربية (خاص بتخصص اللغة العربية)","k":"أسئلة تخصص","st":"تالف الترميز — نص مشوّش غير مقروء"},{"n":"تسريبات الحسام في اللغة العربية (خاص بالتخصص)","k":"أسئلة تخصص","st":"نسخة مكررة"},{"n":"تسريبات الحسام في اللغة العربية (عربي عام لجميع التخصصات)","k":"عربي عام","st":"نسخة مكررة"},{"n":"طرق تدريس اللغة العربية","k":"مرجع طرق تدريس","st":"قُرئ كاملًا"},{"n":"طرق تدريس اللغة العربية — 1","k":"مرجع طرق تدريس","st":"نسخة مكررة"},{"n":"مراجعة ما قبل الامتحان — أحدث أسئلة وردت بالفعل","k":"مراجعة","st":"تعذّر التنزيل"},{"n":"أسئلة معلم فصل","k":"تخصص آخر","st":"خارج تخصص اللغة العربية"},{"n":"أحدث أسئلة للحاسب الآلي — الجزء الثاني","k":"حاسب آلي","st":"خارج تخصص اللغة العربية"}]}</script>
<script>

var AR='٠١٢٣٤٥٦٧٨٩';

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

  .replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');}

var tabs=document.getElementById('tabs'), panels=document.getElementById('panels');

}

}

pf.innerHTML='<div class="lead"><b>ماذا في هذا التبويب؟</b> جردٌ لمحتويات مجلد '+
 '<a href="https://drive.google.com/drive/folders/1YvqHviSNCHqECMZ0aslM0tJ5_1oKYnn3" target="_blank" rel="noopener">«تخصص عربي»</a> المرتبط من صفحة المسابقة، '+
 'وبيانُ ما أمكن قراءته منها وما تعذّر. وقد استُخرجت كل الأسئلة والقواعد في التبويبات التالية '+
 'من الملفات المقروءة، وصيغت الحلول والشروح صياغةً أصليةً لا نقلًا حرفيًّا.</div>'+
 '<div class="g"><div><b>'+ad(D.f.length)+'</b><span>ملفًا في المجلد</span></div>'+
 '<div><b>'+ad(okc)+'</b><span>ملفًا قُرئ</span></div>'+
 '<div><b>'+ad(342)+'</b><span>سؤالًا محلولًا</span></div>'+
 '<div><b>'+ad(79)+'</b><span>قاعدة مشروحة</span></div></div>'+
 '<div class="card"><h3>فهرس ملفات المجلد</h3><div id="flist"></div></div>';
var fl=document.getElementById('flist');
D.f.forEach(function(f){
  var ok=/قُرئ/.test(f.st), bad=/تالف|تعذّر|تعذر/.test(f.st);
  var d=document.createElement('div'); d.className='fl';
  d.innerHTML='<span class="nm">'+esc(f.n)+'</span>'+
    '<span class="kd">'+esc(f.k)+'</span>'+
    '<span class="st'+(ok?' ok':'')+(bad?' bad':'')+'">'+esc(f.st)+'</span>';
  fl.appendChild(d);
});

/* ---------- تبويبات الفروع ---------- */
D.s.forEach(function(s){
  mkTab(s.c,s.n);
  var p=mkPanel(s.c);
  p.innerHTML=
   '<div class="toolbar">'+
   '<input type="search" id="q-'+s.c+'" placeholder="ابحث في '+esc(s.n)+'…">'+
   '<button class="btn on" data-v="all" id="va-'+s.c+'">الكل</button>'+
   '<button class="btn" data-v="rules" id="vr-'+s.c+'">القواعد ('+ad(s.r.length)+')</button>'+
   '<button class="btn" data-v="qs" id="vq-'+s.c+'">الأسئلة ('+ad(s.q.length)+')</button>'+
   '<span class="cnt" id="c-'+s.c+'"></span></div>'+
   '<div id="r-'+s.c+'"></div><div id="l-'+s.c+'"></div>'+
   '<div class="none" id="n-'+s.c+'" style="display:none">لا توجد نتائج مطابقة.</div>';

  var rbox=document.getElementById('r-'+s.c), lbox=document.getElementById('l-'+s.c);
  s.r.forEach(function(r){
    var c=document.createElement('div'); c.className='card rule';
    c.innerHTML='<h3>'+esc(r.t)+'</h3>'+r.b;
    c.setAttribute('data-k',norm(r.t+' '+r.b.replace(/<[^>]+>/g,' ')));
    rbox.appendChild(c);
  });
  s.q.forEach(function(q,i){
    var c=document.createElement('div'); c.className='q';
    c.innerHTML='<div class="num">سؤال '+ad(i+1)+'</div>'+
      '<div class="qt">'+esc(q.q)+'</div>'+
      '<div class="ans">'+esc(q.a)+'</div>'+
      '<div class="exp">'+esc(q.e)+'</div>';
    c.setAttribute('data-k',norm(q.q+' '+q.a+' '+q.e));
    lbox.appendChild(c);
  });

  var mode='all';
  function render(){
    var term=norm(document.getElementById('q-'+s.c).value.trim());
    var rs=rbox.querySelectorAll('.rule'), qq=lbox.querySelectorAll('.q');
    var nr=0,nq=0,k;
    for(k=0;k<rs.length;k++){
      var vis=(mode!=='qs')&&(!term||rs[k].getAttribute('data-k').indexOf(term)>=0);
      rs[k].style.display=vis?'':'none'; if(vis)nr++;
    }
    for(k=0;k<qq.length;k++){
      var v2=(mode!=='rules')&&(!term||qq[k].getAttribute('data-k').indexOf(term)>=0);
      qq[k].style.display=v2?'':'none'; if(v2)nq++;
    }
    document.getElementById('c-'+s.c).textContent='ظاهر: '+ad(nr)+' قاعدة · '+ad(nq)+' سؤال';
    document.getElementById('n-'+s.c).style.display=(nr+nq===0)?'':'none';
  }
  document.getElementById('q-'+s.c).addEventListener('input',render);
  ['va','vr','vq'].forEach(function(pre){
    var b=document.getElementById(pre+'-'+s.c);
    b.addEventListener('click',function(){
      mode=b.getAttribute('data-v');
      ['va','vr','vq'].forEach(function(o){
        document.getElementById(o+'-'+s.c).classList.toggle('on',o===pre);});
      render();
    });
  });
  render();
});

/* ---------- تبديل التبويبات ---------- */
var all=tabs.querySelectorAll('.tab');
for(var i=0;i<all.length;i++){
  all[i].addEventListener('click',function(){
    var id=this.getAttribute('data-tab'),j;
    for(j=0;j<all.length;j++) all[j].classList.toggle('on',all[j]===this);
    var ps=panels.querySelectorAll('.panel');
    for(j=0;j<ps.length;j++) ps[j].classList.toggle('on',ps[j].id==='p-'+id);
    window.scrollTo(0,0);
  });
}
all[0].classList.add('on');
document.getElementById('p-files').classList.add('on');
})();
</script>
