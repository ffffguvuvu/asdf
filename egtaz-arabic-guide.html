b> مقياس وُضع لبيان بنية الكلمة، أصله ثلاثة أحرف: <b>ف ع ل</b>.\nتُقابل فاءُ الميزان الحرفَ الأول من الكلمة، وعينُه الثاني، ولامُه الثالث، وما زاد عن الأصول\nيُذكر بلفظه في الميزان مع تكرار اللام في الرباعي والخماسي.</p>\n<p><b>الفعل المجرد:</b> ما كانت كل حروفه أصلية. ثلاثي (كتب، درس، فهم) أو رباعي (بعثر، دحرج، زلزل).</p>\n<p><b>الفعل المزيد:</b> ما زِيد على أصوله حرف أو أكثر. مزيد الثلاثي بحرف (أكرم، قاتل، كسّر)،\nوبحرفين (انطلق، اجتمع، تعلّم، احمرّ)، وبثلاثة (استخرج، اعشوشب).</p>\n<p><b>تطبيق:</b> في سؤال «اختر الفعل المزيد: بعثر / درس / أكرم / يقرأ» الجواب <b>أكرم</b>،\nلأنه على وزن «أفعَل» زِيدت همزته على الأصول الثلاثة «ك ر م». أما «بعثر» فرباعي مجرّد\nحروفه كلها أصلية، و«درس» ثلاثي مجرّد، و«يقرأ» مضارع الثلاثي وياؤه حرف مضارعة لا حرف زيادة بنائية.</p>\n<p><b>وزن «انعكاس»:</b> هو <b>انفِعال</b>، لأنه مصدر الفعل الخماسي «انعكسَ» على وزن «انفعلَ»،\nوالأصول «ع ك س» والزائد الهمزة والنون والألف. وليس «أفعال» لأن ذلك وزن جمع لا مصدر خماسي.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>أصل الميزان «ف ع ل»</b> لأن معظم تصاريف الكلام يدور على معنى الفعل، ولأن حروفها مُهموسة ومجهورة متنوّعة المخارج فتصلح للمقابلة.</li><li><b>عند الوزن تُقابل الزوائد بلفظها</b> لا بحروف الميزان: «استخرج» على «استفعل»، وتُكرَّر لام الميزان إن كُرِّر أصل: «قدَّم» على «فعَّل»، «جلبب» على «فعلل».</li><li><b>القلب المكاني</b> يُغيّر الوزن: «أيِس» من «يئس» وزنها «عَفِل» لتقدّم اللام على العين. وهذا من دقائق الباب.</li><li><b>الحذف يُقابله حذف في الميزان:</b> «قُلْ» وزنها «فُلْ» لحذف عينها، و«عِدْ» وزنها «عِلْ» لحذف فائها.</li><li><b>المجرد الثلاثي ثلاثة أبواب في الماضي وستة بالنظر إلى المضارع</b>، والمزيد الثلاثي على ثلاثة أوزان بحرف، وخمسة بحرفين، وأربعة بثلاثة.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الشافية لابن الحاجب وشروحها، والممتع في التصريف، وشذا العرف.</p></div>"},{"t":"جموع التكسير: جموع القلة وجموع الكثرة","b":"\n<p><b>جموع القلة</b> أربعة أوزان، تدل على ما بين الثلاثة والعشرة:\n<b>أَفعِلة</b> (أطعمة، أسئلة)، <b>أَفعُل</b> (أنفُس، أشهُر)، <b>أَفعال</b> (أقلام، أعباء)،\n<b>فِعلة</b> (فِتية، صِبية).</p>\n<p><b>جموع الكثرة</b> أوزانها كثيرة تزيد على عشرين، منها: فُعُل (كُتُب)، فُعَل (غُرَف)، فِعَل (قِطَع)،\nفُعّال (كُتّاب)، فِعال (جِبال)، فُعول (بُيوت)، فَعلى (جَرحى)، فُعَلاء (عُلَماء)، أفعِلاء (أصدقاء)،\nومنتهى الجموع: مَفاعِل ومَفاعيل (مساجد، مصابيح).</p>\n<p><b>الجمع الشاذ</b> ما خالف القياس المطّرد، ومنه <b>«مصائب»</b> جمع «مصيبة»؛\nفالقياس في «فعيلة» المعتلة العين أن تُجمع على «مَفاعِل» بلا همز «مصاوب»،\nلكن العرب همزتها فقالوا «مصائب» فجاءت على خلاف القياس.</p>\n<p><b>جموع مطلوبة بأعيانها:</b> عندليب ← <b>عنادل</b> · سفرجل ← <b>سفارِج</b> · فرزدق ← <b>فرازِد/فرازِق</b>\n· جدار ← <b>جُدْران</b> · غار ← <b>أغوار/غِيران</b> · كبرى ← <b>كُبَر/كُبْرَيات</b>\n· قاضٍ ← <b>قُضاة</b> (تكسير) و<b>قاضون</b> (جمع مذكر سالم).</p>\n<p><b>قاعدة جمع الرباعي والخماسي:</b> ما زاد على أربعة أحرف يُحذف منه عند الجمع ما يُردّه إلى أربعة،\nولذلك صار «عندليب» ← «عنادل» بحذف الياء والباء، و«سفرجل» ← «سفارج» بحذف اللام.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>أوزان القلة أربعة:</b> أفعُل، أفعال، أفعِلة، فِعلة. وما عداها من الكثرة. والقلة من ٣ إلى ١٠، والكثرة من ١١ فما فوق.</li><li><b>قد يُستعمل أحدهما موضع الآخر</b> عند أمن اللبس أو لعدم وجود الآخر؛ ﴿ثلاثةَ قروءٍ﴾ — «قروء» جمع كثرة استُعمل للقلة لعدم ورود جمع قلة لها. وجه الاستشهاد: نيابة جمع الكثرة عن القلة.</li><li><b>صيغة منتهى الجموع</b> من جموع الكثرة وهي ممنوعة من الصرف، وقد سبق ضابطها في باب الممنوع.</li><li><b>اسم الجمع واسم الجنس الجمعي:</b> اسم الجمع ما لا واحد له من لفظه (قوم، رهط، جيش)، واسم الجنس الجمعي ما يُفرَّق بينه وبين واحده بالتاء (تمر/تمرة، شجر/شجرة). وليسا جمعي تكسير.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الشافية وشروحها، وأوضح المسالك، والنحو الوافي.</p></div>"},{"t":"الاسم المقصور والمنقوص والممدود","b":"\n<ul>\n<li><b>المقصور:</b> اسم معرب آخره ألف لازمة — فتى، عصا، مستشفى. يُقدَّر عليه الإعراب كله.\nوعند جمعه جمع مذكر سالم تُحذف ألفه ويبقى ما قبلها مفتوحًا: مصطفى ← مصطفَوْن.</li>\n<li><b>المنقوص:</b> اسم معرب آخره ياء لازمة مكسور ما قبلها — القاضي، الداعي، الساعي.\nتُقدَّر عليه الضمة والكسرة وتظهر الفتحة. وعند جمعه جمع مذكر سالم <b>تُحذف ياؤه</b>\nويُضمّ ما قبلها في الرفع ويُكسر في النصب والجر: القاضي ← القاضُون / القاضِين.</li>\n<li><b>الممدود:</b> اسم معرب آخره همزة قبلها ألف زائدة — سماء، بناء، أصدقاء.</li>\n</ul>\n<p><b>تطبيق:</b> جمع «القاضي» جمعَ مذكر سالم هو <b>قاضون</b> في الرفع، و<b>قاضِين</b> في النصب والجر؛\nوله جمع تكسير هو <b>قُضاة</b>. وهذا هو مدار السؤال.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الحدود:</b> المقصور معرب آخره ألف لازمة، والمنقوص معرب آخره ياء لازمة مكسور ما قبلها، والممدود معرب آخره همزة بعد ألف زائدة. وقيد «معرب» يُخرج المبنيّات كـ«إذا» و«الذي».</li><li><b>تثنية المقصور:</b> تُردّ الألف إلى أصلها إن كانت ثالثة (فتى ← فتيان، عصا ← عصوان)، وتُقلب ياءً إن كانت رابعة فأكثر (مستشفى ← مستشفيان).</li><li><b>تثنية الممدود:</b> إن كانت الهمزة أصلية بقيت (قُرّاء ← قرّاءان)، وإن كانت للتأنيث قُلبت واوًا (صحراء ← صحراوان)، وإن كانت منقلبة أو للإلحاق جاز الوجهان (سماء ← سماءان/سماوان).</li><li><b>حذف ياء المنقوص:</b> تُحذف في حالتي الرفع والجرّ إذا كان نكرة غير مضاف ويُعوَّض عنها التنوين: «هذا قاضٍ» و«مررت بقاضٍ»، وتثبت في النصب «رأيت قاضيًا». ﴿ولكلِّ قومٍ هادٍ﴾ — وجه الاستشهاد: حذف ياء المنقوص النكرة مع تنوين العوض.</li><li><b>جمع المقصور جمع مذكر سالمًا</b> تُحذف ألفه ويُفتح ما قبل الواو والياء: «مصطفى ← مصطفَوْن، مصطفَيْن».</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الشافية وشروحها، وشذا العرف، وجامع الدروس العربية.</p></div>"},{"t":"التصغير وقواعده","b":"\n<p>للتصغير ثلاثة أوزان: <b>فُعَيْل</b> للثلاثي، و<b>فُعَيْعِل</b> للرباعي، و<b>فُعَيْعيل</b> لما قبل آخره حرف مدّ.</p>\n<p><b>قواعد عملية:</b> يُضمّ أول الاسم ويُفتح ثانيه وتُزاد ياء ساكنة ثالثة.\nوإذا كان في الكلمة حرف علة منقلب عن أصل <b>رُدّ إلى أصله</b> عند التصغير — وهذا مفتاح أكثر الأسئلة.</p>\n<table><tr><th>الكلمة</th><th>تصغيرها</th><th>التعليل</th></tr>\n<tr><td>ناب</td><td>نُيَيْب</td><td>أصل الألف ياء (أنياب) فرُدّت</td></tr>\n<tr><td>باب</td><td>بُوَيْب</td><td>أصل الألف واو (أبواب) فرُدّت</td></tr>\n<tr><td>قِيمة</td><td>قُوَيْمة</td><td>أصل الياء واو (من القَوْم/التقويم) فرُدّت</td></tr>\n<tr><td>دينار</td><td>دُنَيْنير</td><td>أصل الياء نون (دنانير) فرُدّت وهو على فُعَيعيل</td></tr>\n<tr><td>سفرجل</td><td>سُفَيْرِج</td><td>خماسي فيُحذف خامسه ويُصغَّر على فُعَيعِل</td></tr>\n<tr><td>آدم</td><td>أُوَيْدِم</td><td>المدّة أصلها همزتان، فرُدّت الثانية واوًا</td></tr>\n<tr><td>إبل</td><td>أُبَيْلة</td><td>اسم ثلاثي مؤنث تأنيثًا معنويًّا فتلحقه التاء</td></tr>\n</table>\n<p><b>فرقٌ يُسأل عنه:</b> النسب غير التصغير؛ فالنسب إلى «إبل» هو <b>إبِلِيّ</b>، وإلى «طيّ» هو <b>طَوَوِيّ</b>،\nبينما تصغير «طيّ» هو <b>طُوَيّ</b>.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>أوزانه ثلاثة:</b> فُعَيل للثلاثي، وفُعَيعِل للرباعي، وفُعَيعيل لما كان خامسه حرف لين.</li><li><b>فوائد التصغير خمس:</b> تقليل الحجم (كُتَيِّب)، وتقليل العدد (دُرَيهمات)، وتقريب الزمان أو المكان (قُبَيل المغرب، فُوَيق الدار)، والتحقير (شُوَيعر)، والتعظيم أو التحبّب (دُوَيهية، أُخَيّ).</li><li><b>ردّ الأصول عند التصغير:</b> يُردّ ما حُذف ويُردّ المقلوب إلى أصله: «باب ← بُوَيب» لأن أصلها الواو، و«عِدة ← وُعَيدة». وهذا يكشف أصول الكلمات.</li><li><b>تصغير الترخيم</b> هو حذف الزوائد ثم التصغير: «محمود ← حُمَيد»، «أسود ← سُوَيد».</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الشافية وشروحها، والممتع في التصريف، وشذا العرف.</p></div>"},{"t":"المشتقات السبعة","b":"\n<ol>\n<li><b>اسم الفاعل:</b> من الثلاثي على «فاعِل» (كاتب)، ومن غيره على وزن مضارعه بإبدال حرف المضارعة\nميمًا مضمومة وكسر ما قبل الآخر (مُجتهِد، مُستخرِج).</li>\n<li><b>اسم المفعول:</b> من الثلاثي على «مَفعول» (مكتوب)، ومن غيره كاسم الفاعل لكن بفتح ما قبل الآخر\n(مُستخرَج، مُكرَم).</li>\n<li><b>صيغ المبالغة:</b> خمس مشهورة — <b>فَعّال</b> (غفّار)، <b>مِفعال</b> (مِهذار)، <b>فَعول</b> (صَبور)،\n<b>فَعيل</b> (عليم)، <b>فَعِل</b> (حَذِر).</li>\n<li><b>الصفة المشبهة:</b> تدل على الثبوت والدوام — حسَن، كريم، أحمر، عطشان.</li>\n<li><b>اسم التفضيل:</b> على «أفعَل» ومؤنثه «فُعلى».</li>\n<li><b>اسما الزمان والمكان:</b> من الثلاثي على «مَفعَل» أو «مَفعِل»، ومن غيره على وزن اسم المفعول.</li>\n<li><b>اسم الآلة:</b> مِفعَل (مِبرَد)، مِفعال (مِفتاح)، مِفعَلة (مِكنَسة)، وجامدة كالسكين والقلم.</li>\n</ol>\n<p><b>ضبط «معرِض»:</b> في «زرتُ معرِض الكتاب» تُكسر الراء، لأنه <b>اسم مكان</b> من الفعل «عرَض يَعرِض»\nوهو مكسور العين في المضارع، وقاعدة اسم المكان من الثلاثي أن يأتي على «مَفعِل» إذا كان مضارعه\nمكسور العين. فيُقال: مَعرِض، مَجلِس، مَنزِل.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>عمل اسم الفاعل</b> مشروط: إن كان بـ«أل» عمل مطلقًا ماضيًا وحالًا ومستقبلًا؛ وإن كان مجرّدًا اشتُرط أن يكون للحال أو الاستقبال وأن يعتمد على نفي أو استفهام أو مبتدأ أو موصوف.</li><li><b>الفرق بين اسم الفاعل والصفة المشبهة:</b> اسم الفاعل يدلّ على الحدوث والتجدّد، والصفة المشبهة على الثبوت. و«طاهر القلب» غير «طهور».</li><li><b>صيغ المبالغة الخمس المشهورة:</b> فَعّال، مِفْعال، فَعُول، فَعِيل، فَعِل. وزِيد عليها: فُعَلة، وفِعِّيل، ومِفْعيل. وتعمل عمل اسم الفاعل بشروطه.</li><li><b>اسما الزمان والمكان</b> من الثلاثي على «مَفْعَل» إن كان مضارعه مضمومَ العين أو مفتوحها، وعلى «مَفْعِل» إن كان مكسور العين أو مثالًا واويًّا. ومن غير الثلاثي على زنة المضارع المجهول بميم مضمومة.</li><li><b>اسم الآلة</b> أوزانه المشهورة: مِفْعَل، مِفْعَلة، مِفْعال؛ وأُضيف إليها حديثًا: فَعّالة (غسّالة)، وفاعِلة (رافعة)، وفَعّال (جرّار).</li><li><b>اسم التفضيل</b> تقدّم بسطه في باب النحو؛ وهو داخل في المشتقات.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: شرح التسهيل، وشذا العرف، وشرح الأشموني، والنحو الوافي.</p></div>"},{"t":"المؤنث والمذكر وصيغة فَعلان","b":"\n<p>الوصف على وزن <b>«فَعْلان»</b> مؤنثه <b>«فَعْلى»</b> لا «فَعلانة»، وهو ممنوع من الصرف.\nفمؤنث <b>عطشان</b> هو <b>عطشى</b>، ومؤنث جوعان جَوْعى، وسكران سَكرى، وغضبان غَضبى.</p>\n<p>وأما الوصف على <b>«أفعَل»</b> فمؤنثه <b>«فَعلاء»</b>: أحمر/حمراء، أخضر/خضراء، أعرج/عرجاء —\nوهو ممنوع من الصرف أيضًا.</p>\n<p><b>علامات التأنيث ثلاث:</b> التاء المربوطة (فاطمة)، وألف التأنيث المقصورة (سلمى، ذكرى)،\nوألف التأنيث الممدودة (صحراء، حسناء).</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>علامات التأنيث ثلاث:</b> التاء المربوطة، وألف التأنيث المقصورة، وألف التأنيث الممدودة. والمؤنث المعنوي ما خلا منها ودلّ على مؤنث (هند، زينب).</li><li><b>«فَعلان» الذي مؤنثه «فَعلى»</b> ممنوع من الصرف إن كان وصفًا (عطشان/عطشى، غضبان/غضبى). فإن كان مؤنثه بالتاء صُرف (نَدمان/ندمانة).</li><li><b>المؤنث المجازي</b> يُعامل معاملة المؤنث في الضمير والإشارة والوصف وإن لم يكن له فرج حقيقي: «الشمس طالعة».</li><li><b>ما يستوي فيه المذكر والمؤنث:</b> ما كان على «فَعُول» بمعنى فاعل (صبور)، و«فَعِيل» بمعنى مفعول (جريح، قتيل)، و«مِفْعال» و«مِفْعيل» و«مِفْعَل». ﴿وما كانت أمُّكِ بغيًّا﴾ — وجه الاستشهاد: استواء المذكر والمؤنث في «فَعُول/فَعِيل» بابهما.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الشافية وشروحها، وأدب الكاتب لابن قتيبة، وجامع الدروس العربية.</p></div>"},{"t":"الإعلال والإبدال والإدغام","b":"\n<ul>\n<li><b>الإعلال:</b> تغيير يطرأ على حرف العلة بالقلب أو الحذف أو التسكين —\nقال (أصلها قَوَل)، يقوم/قُم، يَعِد (حُذفت الواو).</li>\n<li><b>الإبدال:</b> إحلال حرف مكان حرف — اصطبر (أصلها اصتبر، أُبدلت التاء طاءً).</li>\n<li><b>الإدغام:</b> إدخال حرف ساكن في متحرك من جنسه فيصيران حرفًا واحدًا مشدَّدًا — مدَّ، شدَّ.</li>\n<li><b>الإقلاب:</b> مصطلح تجويدي: قلب النون الساكنة أو التنوين ميمًا عند الباء — «أنبِئهم» تُنطق «أمبئهم».</li>\n</ul>\n<p><b>الحرف المشدَّد</b> هو حرفان من جنس واحد: <b>الأول ساكن والثاني متحرك، أُدغم الأول في الثاني\nفصارا حرفًا واحدًا مشدَّدًا</b>. وهذا هو التعريف الدقيق الذي يُسأل عنه.</p>\n<p><b>«ينبغي»</b> فيها <b>إقلاب</b>؛ لأن النون الساكنة جاء بعدها باء، فتُقلب النون ميمًا في النطق.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الإعلال ثلاثة أنواع:</b> بالقلب (قال، باع)، وبالحذف (قُلْ، عِدْ، يَعِد)، وبالتسكين (يقضي ← يقضْي ثم تُحذف الضمة استثقالًا).</li><li><b>الفرق بين الإعلال والإبدال:</b> الإعلال خاصّ بحروف العلة والهمزة، والإبدال أعمّ يشمل إبدال الحروف الصحيحة: «اصطبر» أصلها «اصتبر» أُبدلت التاء طاءً لمجاورة الصاد.</li><li><b>مواضع وجوب الإدغام</b> وامتناعه: يجب إذا سكن الأول وتحرّك الثاني في كلمة أو كلمتين، ويمتنع إذا كان الأول هاء سكت أو كان في وزن ملحق أو خيف لبس، وجاز في الفعل المجزوم: «لم يَفِرَّ/يَفْرِرْ».</li><li><b>الإعلال بالقلب ضوابطه:</b> تُقلب الواو والياء ألفًا إذا تحرّكتا وانفتح ما قبلهما ولم يكن بعدهما ما يمنع؛ وتُقلب الواو ياءً إذا سكنت وانكسر ما قبلها أو اجتمعت مع الياء وسُبقت إحداهما بالسكون.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: سرّ صناعة الإعراب لابن جني، والمنصف، والممتع في التصريف، وشذا العرف.</p></div>"},{"t":"تصريف الفعل وبناؤه للمجهول","b":"\n<p><b>بناء الماضي للمجهول:</b> يُضمّ أوله ويُكسر ما قبل آخره — كتب ← كُتِبَ، فَهِم ← فُهِمَ،\nاستخرج ← اسْتُخرِجَ، تعلّم ← تُعُلِّمَ (يُضمّ كل متحرك في أوله).</p>\n<p><b>بناء المضارع للمجهول:</b> يُضمّ أوله ويُفتح ما قبل آخره — يكتب ← يُكتَبُ، يستخرج ← يُستخرَجُ.</p>\n<p><b>الأجوف:</b> إذا بُني الماضي الأجوف للمجهول كُسر أوله وقُلبت ألفه ياءً — قال ← قِيلَ، باع ← بِيعَ.</p>\n<p><b>الأفعال الجامدة</b> هي التي لزمت صورة واحدة ولا يُشتق منها: ليس، عسى، نِعم، بئس، حبّذا،\nخلا وعدا وحاشا (في الاستثناء). وما عداها متصرف تامّ أو ناقص.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>ما لا يُبنى للمجهول:</b> اللازم إلا بواسطة (ظرف أو جار ومجرور أو مصدر)، والأفعال الجامدة (نِعم، بئس، عسى، ليس)، وأفعال الاستثناء والمقاربة، وكان وأخواتها.</li><li><b>الأجوف عند البناء للمجهول</b> فيه ثلاث لغات مشهورة: الكسر الخالص «قِيل»، والإشمام، والضمّ الخالص «قُول». والقراءات السبع وردت بالأُوليين.</li><li><b>المثال والناقص:</b> «وُعِد» بردّ الواو، و«رُمِي» و«دُعِي» بقلب الألف ياءً وكسر ما قبلها.</li><li><b>ما قبل آخر الفعل يُكسر في الماضي ويُفتح في المضارع</b>، وما بُدئ بتاء زائدة يُضمّ أوّله وثانيه: «تُعُلِّم»؛ وما بُدئ بهمزة وصل يُضمّ أوّله وثالثه: «اُستُخرِج».</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الشافية وشروحها، وشذا العرف، والقراءات وتوجيهها.</p></div>"}]},{"c":"imla","n":"الإملاء والرسم","q":[{"q":"«القرآن الكريم ثلاثون جزئًا» — ما الخطأ الإملائي؟","a":"الصواب: جزءًا","e":"الهمزة في «جزء» متطرفة وقبلها زاي ساكنة، والهمزة المتطرفة بعد ساكن تُرسم مفردة على السطر. ولمّا نُوّنت بالنصب ولم تسبقها ألفٌ وجبت زيادة ألف التنوين فصارت «جزءًا». وكتابتها «جزئًا» خطأ لأن النبرة إنما تُستعمل إذا كان ما قبل الهمزة مكسورًا أو ياءً ساكنة.","d":["أمر الخماسي","معلمو المدرسة","سما، سعى"]},{"q":"غادرت الطائرة ........ (الضبط الصحيح رسمًا)","a":"مساءً","e":"الهمزة متطرفة بعد ألف مدّ، فتُرسم مفردة على السطر. والقاعدة أن الألف إذا سبقت الهمزة منعت زيادة ألف التنوين بعدها كراهية توالي ألفين؛ فنكتب: مساءً، نداءً، لواءً، اكتفاءً. وما يُكتب «مساءًا» أو «مساءاً» خطأ شائع لا وجه له في الرسم.","d":["متطرفة","مسألة","شاطئ"]},{"q":"أيّ الجمل فيها خطأ إملائي: أكرم ضيفك / احترم جارك / تجنب إغتياب الناس / استغفر ربك؟","a":"«تجنب إغتياب الناس» — والصواب: اغتياب","e":"«اغتياب» مصدر الفعل الخماسي «اغتابَ»، ومصدر الخماسي همزته همزة وصل تُرسم ألفًا عارية بلا علامة همزة. ودليلها أنك إذا وصلتها بما قبلها سقطت من النطق: «وَاغتياب». فكتابتها بهمزة القطع «إغتياب» خطأ.","d":["أكرم ضيفك","احترم جارك","تجنب إغتياب الناس"]},{"q":"الهمزة في «اعتنِ بصحتك» همزة وصل لأنها في كلمة…","a":"أمر الخماسي","e":"«اعتنِ» أمر من «اعتنى يعتني» وهو فعل خماسي، وماضي الخماسي والسداسي وأمرهما ومصدرهما كلها همزتها وصل. وامتحنها بالواو: «واعتنِ» فتسقط الهمزة نطقًا، وهذا دليل الوصل القاطع.","d":["معلمو المدرسة","الصواب: جزءًا","سما، سعى"]},{"q":"اختر الكلمة التي همزتها همزة وصل: استعمال / أحسن / إعطاء / العلم","a":"استعمال (و«العلم» وصل أيضًا لأنها أل التعريف)","e":"«استعمال» مصدر سداسي فهمزته وصل. و«أحسن» ماضٍ رباعي و«إعطاء» مصدر رباعي، وكلاهما قطع. وإذا وردت «العلم» في الخيارات فهمزتها وصل كذلك لأنها همزة «أل» التعريفية، وهي من مواضع الوصل المتفق عليها.","d":["استعمال","أحسن","إعطاء"]},{"q":"كُتبت الهمزة على واو في «تفاؤل» لأنها جاءت…","a":"مضمومة بعد سكون صحيح (ألف ساكنة)","e":"نطبّق قاعدة الأقوى: الهمزة مضمومة وما قبلها ساكن. والضمة أقوى من السكون، ويناسب الضمةَ الواوُ، فكُتبت على واو. ومثلها: تضاؤل، تشاؤم، تثاؤب.","d":["لأنها جاءت في اسم مفرد مؤنث","إذا وقع بعدهما «ما» أو «لا»","متطرفة وما قبلها ساكن"]},{"q":"كُتبت الهمزة على واو في «مؤمن» لأنها جاءت…","a":"ساكنة بعد ضم","e":"الهمزة في «مُؤمِن» ساكنة والميم قبلها مضمومة. والسكون أضعف الحركات، فتغلب الضمةُ ويُكتب على ما يناسبها وهو الواو. والقياس نفسه في: يُؤمن، مُؤتمر، يُؤدّي.","d":["الطلاب يقرؤون الدرس","معلمو المدرسة","سما، سعى"]},{"q":"الهمزة المكتوبة في كلمة «طارئ» نوعها…","a":"متطرفة","e":"لأنها وقعت في آخر الكلمة. وكُتبت على ياء لأن ما قبلها مكسور (الراء)، والهمزة المتطرفة تُكتب على حرف من جنس حركة ما قبلها. فإذا نُوّنت صارت «طارئًا» لأن ما قبلها متحرك.","d":["شاطئ","دعا","شمسية"]},{"q":"ترسم همزة «بَدءًا» على السطر في «حمدتُ الله بدءًا وانتهاءً» لأنها…","a":"متطرفة وما قبلها ساكن","e":"الدال قبل الهمزة ساكنة، والهمزة المتطرفة بعد الساكن تُرسم مفردة على السطر. ثم زِيدت ألف التنوين لأن الساكن قبلها حرف صحيح لا ألف. ولاحظ الفرق: «انتهاءً» بلا ألف لأن قبل همزتها ألف مدّ.","d":["استعمال (و«العلم» وصل أيضًا لأنها أل التعريف)","لأنها جاءت في اسم مفرد مؤنث","حذف شيء من العبارة"]},{"q":"أجبتُ عن جميع المسائل إلا ........ واحدة","a":"مسألة","e":"الهمزة متوسطة مفتوحة بعد سين ساكنة. والفتحة أقوى من السكون، ويناسبها الألف، فتُكتب «مسألة». وكتابتها «مسئلة» أو «مسؤلة» خطأ. وتنبّه إلى أن «مساءلة» كلمة أخرى معناها المحاسبة والاستجواب.","d":["شمسية","شاطئ","رُواة"]},{"q":"تسامرنا ساعةً على ........ البحر","a":"شاطئ","e":"اسم مجرور بـ«على» وعلامة جره الكسرة، والهمزة متطرفة وما قبلها مكسور (الطاء)، فتُكتب على ياء مناسِبةً لجنس الكسرة. ولو نصبته لقلت «شاطئًا»، ولو رفعته لقلت «شاطئٌ» على الياء أيضًا لأن العبرة بحركة ما قبل الهمزة لا بحركتها.","d":["مسألة","مساءً","دعا"]},{"q":"«... طالبُ العلم إلى المجد، و... إلى فعل الخير»","a":"سما، سعى","e":"«سما» من السُّمُوّ ومضارعه «يَسمو» فأصل ألفه واو فتُكتب قائمة. و«سعى» من السَّعْي ومضارعه «يَسعى» ومصدره «سعيًا» فأصل ألفه ياء فتُكتب مقصورة. وهذه هي طريقة الكشف عن أصل الألف اللينة في الأفعال.","d":["أمر الخماسي","الصواب: جزءًا","معلمو المدرسة"]},{"q":"رحم الله امرأً فعل الخير و........ إليه","a":"دعا","e":"من «الدعوة» ومضارعه «يَدعو»، فأصل الألف واو فتُرسم قائمة: دعا. وكتابتها «دعى» خطأ؛ أما «دُعِيَ» بالبناء للمجهول فشيء آخر تدل عليه الحركات.","d":["شاطئ","متطرفة","مسألة"]},{"q":"يُعدّ الإمام أحمد من أبرز ........ الحديث","a":"رُواة","e":"جمع «راوٍ» على «رُواة» وهو جمع تكسير على وزن «فُعَلة»، وتاؤه مربوطة لأنه جمع تكسير لا ينتهي بتاء أصلية. و«روات» بالتاء المفتوحة خطأ، و«راويي» ليس من أبنية الجمع المسموعة هنا.","d":["متطرفة","مسألة","مساءً"]},{"q":"تحذف همزة «ابن» إذا وقعت بين…","a":"علمين بينهما صفة الأبوة، متصلين بلا فاصل","e":"بشرط أن تكون مفردة واقعة صفةً لا خبرًا، وأن يكون الثاني أبًا للأول (أو لقبًا أو كنية)، ويُسكَّن ما قبلها ويُترك التنوين: محمدُ بنُ إسحاق. فإن كان الثاني جدًّا أثبتّ الهمزة: محمد ابن مالك.","d":["إذا دخلتا على «ما» أو «مَن»","«تجنب إغتياب الناس» — والصواب: اغتياب","إذا وقع بعدهما «ما» أو «لا»"]},{"q":"اختر الكتابة الصحيحة: معلمو المدرسة / معلموا المدرسة / معلمين المدرسة","a":"معلمو المدرسة","e":"«معلمو» جمع مذكر سالم مرفوع بالواو ومضاف، فحُذفت نونه للإضافة. والألف الفارقة إنما تُزاد بعد واو الجماعة في الأفعال لا بعد واو جمع المذكر السالم في الأسماء، فزيادتها هنا خطأ.","d":["معلموا المدرسة","معلمين المدرسة","الطلاب يقرؤون الدرس"]},{"q":"واحدة من الجمل الآتية صحيحة: الطلاب يقرأون / يقرءون / يقرؤون / يقرئون","a":"الطلاب يقرؤون الدرس","e":"أصل الفعل «يقرأ»، فلما اتصلت به واو الجماعة صارت الهمزة متوسطة مضمومة بما بعدها، وقبلها ساكن؛ والضمة أقوى فرُسمت على واو: «يقرؤون». وهذه مسألة اطّردت في نظائرها: يبدؤون، يملؤون، يهزؤون.","d":["الطلاب يقرأون","يقرءون","يقرؤون"]},{"q":"لحرف التاء شكلان؛ لماذا كُتبت التاء مربوطة في «فاطمة»؟","a":"لأنها جاءت في اسم مفرد مؤنث","e":"وهذا أول مواضع التاء المربوطة. وليس السبب مجرّد وقوعها في آخر الكلمة، بدليل أن «بنت» و«أخت» تاؤهما في الآخر وهي مفتوحة؛ ولا كونها من أصل الكلمة، لأن الأصلية تُكتب مفتوحة كما في «نبْت».","d":["«تجنب إغتياب الناس» — والصواب: اغتياب","استعمال (و«العلم» وصل أيضًا لأنها أل التعريف)","في فعل الأمر الذي بقي على حرف واحد"]},{"q":"ما نوع «أل» في كلمة «الصيف»؟","a":"شمسية","e":"لأن الصاد من الحروف الشمسية الأربعة عشر (ت ث د ذ ر ز س ش ص ض ط ظ ل ن). ودليلها أن اللام تُكتب ولا تُنطق، ويأتي الحرف بعدها مشدَّدًا: الصَّيف. والقمرية عكسها: تُكتب وتُنطق ويأتي ما بعدها متحركًا مخفّفًا.","d":["شاطئ","دعا","مسألة"]},{"q":"ما دلالة النقط (…) الموضوعة بعد جملة في وسط النص؟","a":"حذف شيء من العبارة","e":"علامة الحذف ثلاث نقط تُوضع مكان كلام أسقطه الناقل، وهي توجّه القارئ إلى أن النص غير تامّ وأن له أصلًا يُرجع إليه. وليست دليلًا على اختصار بليغ ولا على بداية فقرة جديدة.","d":["علمين بينهما صفة الأبوة، متصلين بلا فاصل","«تجنب إغتياب الناس» — والصواب: اغتياب","إذا وقع بعدهما «ما» أو «لا»"]},{"q":"جميع الجمل مشتملة على همزة قطع ما عدا…","a":"الكلمة التي همزتها «أل» التعريفية أو أمر الثلاثي","e":"الفيصل أن تضع واوًا قبل الكلمة: فإن سقطت الهمزة نطقًا فهي وصل. فـ«أعزّك» و«أدناني» و«أمير» همزاتها قطع، أما ما كان من «أل» أو من أمر الثلاثي (اكتبْ) أو من ماضي الخماسي والسداسي ومصدرهما فهمزته وصل.","d":["استعمال (و«العلم» وصل أيضًا لأنها أل التعريف)","إذا دخلتا على «ما» أو «مَن»","حذف شيء من العبارة"]},{"q":"متى تُحذف النون من «مِن» و«عن»؟","a":"إذا دخلتا على «ما» أو «مَن»","e":"فتُدغم النون فيما بعدها: مِن ما ← مِمّا، عن ما ← عمّا، مِن مَن ← مِمَّن، عن مَن ← عمَّن. وهذا إدغامٌ واجب في الرسم والنطق معًا، وفصلُها خلاف المشهور في الكتابة المعاصرة.","d":["متطرفة وما قبلها ساكن","«تجنب إغتياب الناس» — والصواب: اغتياب","لأنها جاءت في اسم مفرد مؤنث"]},{"q":"متى تُحذف النون من «إنْ» و«أنْ»؟","a":"إذا وقع بعدهما «ما» أو «لا»","e":"فتصير «إمّا» و«ألّا»، بشرط في «أنْ» أن تكون ناصبة للمضارع: «يسرّني ألّا تكذبَ». فإن لم تكن ناصبة وجب الفصل، كالمخففة من الثقيلة: «أشهد أن لا إله إلا الله».","d":["إذا دخلتا على «ما» أو «مَن»","حذف شيء من العبارة","في فعل الأمر الذي بقي على حرف واحد"]},{"q":"أين تُزاد هاء السكت وجوبًا؟","a":"في فعل الأمر الذي بقي على حرف واحد","e":"لأن الكلمة لا يُبتدأ بها ويُوقف عليها وهي حرف واحد، فزِيدت الهاء لحمل الصوت: قِ ← قِهْ، عِ ← عِهْ، رَ ← رَهْ. فإذا اتصل الأمر بضمير استغنى عنها: قِها، عِهم.","d":["مضمومة بعد سكون صحيح (ألف ساكنة)","للتفريق بينه وبين «عُمَر» الممنوع من الصرف","«تجنب إغتياب الناس» — والصواب: اغتياب"]},{"q":"لماذا زِيدت الواو في «عَمرو»؟","a":"للتفريق بينه وبين «عُمَر» الممنوع من الصرف","e":"وشرطها أن يكون علمًا غير مضاف إلى ضمير ولا مصغَّر ولا محلًّى بـ«أل» ولا منصوب منوَّن. فتقول: عمرو بن العاص (رفعًا)، ومررتُ بعمرٍو (جرًّا)، ومدحتُ عَمرًا (نصبًا بلا واو لأن ألف التنوين أغنت عن الفرق).","d":["استعمال (و«العلم» وصل أيضًا لأنها أل التعريف)","لأنها جاءت في اسم مفرد مؤنث","في فعل الأمر الذي بقي على حرف واحد"]}],"r":[{"t":"همزة الوصل وهمزة القطع — الفرق والضابط العملي","b":"\n<p><b>همزة الوصل</b> هي ألف تُنطق إذا ابتدأتَ بها الكلام، وتسقط من النطق إذا وصلتَ ما قبلها بها،\nولا تُكتب عليها علامة الهمزة أصلًا (تُرسم ألفًا عارية: <b>ا</b>). و<b>همزة القطع</b> تُنطق في الحالين:\nفي الابتداء وفي الوصل، وتُرسم بعلامة الهمزة فوق الألف (<b>أ</b>) إن كانت مفتوحة أو مضمومة،\nوتحتها (<b>إ</b>) إن كانت مكسورة.</p>\n<p><b>مواضع همزة الوصل محصورة، فاحفظها وما عداها قطع:</b></p>\n<ol>\n<li><b>الأسماء العشرة المسموعة:</b> اسم، است، ابن، ابنة، ابنُم، امرؤ، امرأة، اثنان، اثنتان، ايمُ الله (وايمن الله)،\nويلحق بها مثنّى هذه الأسماء.</li>\n<li><b>(أل) التعريفية بجميع أنواعها:</b> الرجل، العلم، الذي، التي.</li>\n<li><b>أمر الفعل الثلاثي:</b> اكتبْ، افهمْ، اجلسْ، اذهبْ.</li>\n<li><b>ماضي الخماسي والسداسي وأمرُهما ومصدرُهما:</b> انطلقَ / انطلقْ / انطلاقًا — استخرجَ / استخرجْ / استخراجًا.</li>\n</ol>\n<p><b>الحيلة العملية (طريقة الواو):</b> ضع واوًا أو فاءً قبل الكلمة ثم انطق. فإن اختفت الهمزة من النطق فهي وصل،\nوإن بقيت فهي قطع. قل: «واكتبْ» — سقطت، فهي وصل. وقل: «وأكرمَ» — بقيت، فهي قطع.</p>\n<p><b>تنبيه كثير الورود في الاختبارات:</b> «اعتنِ بصحتك» همزتها وصل لأن الفعل أمرٌ من الخماسي (اعتنى)،\nو«أحسنَ» همزتها قطع لأنه ماضٍ رباعي، و«إعطاء» قطع لأنه مصدر رباعي، و«استعمال» وصل لأنه مصدر سداسي.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>العلّة في همزة الوصل</b> أنها اجتُلبت للتوصّل إلى النطق بالساكن؛ فالعرب لا تبدأ بساكن ولا تقف على متحرّك. ولهذا تسقط في الدرج لزوال الحاجة إليها.</li><li><b>الاختبار العملي القاطع:</b> أدخل على الكلمة واوًا أو فاءً؛ فإن نطقت الهمزة فهي قطع (وأَكرمَ)، وإن سقطت فهي وصل (واستمعَ).</li><li><b>الأسماء العشرة ذوات همزة الوصل:</b> ابن، ابنة، ابنم، امرؤ، امرأة، اثنان، اثنتان، اسم، است، أيمن (في القسم). وما عداها فهمزته قطع.</li><li><b>حركة همزة الوصل:</b> تُكسر غالبًا، وتُضمّ في الأمر من الفعل المضموم العين «اُكتبْ»، وتُفتح في «أل» التعريفية و«أيمن».</li><li><b>همزة «ال» في الاستفهام:</b> إذا دخلت همزة الاستفهام على «ال» أُبدلت ألفًا مدّية: ﴿آلذَّكرينِ حرَّم﴾. وجه الاستشهاد: المدّ عوضًا عن همزة الوصل بعد همزة الاستفهام.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: أدب الكاتب لابن قتيبة، والإملاء والترقيم في الكتابة العربية، والمرجع في الإملاء.</p></div>"},{"t":"الهمزة المتطرفة — قاعدة واحدة تحكمها كلها","b":"\n<p>الهمزة المتطرفة هي التي تقع في <b>آخر</b> الكلمة. وحكمها لا ينظر إلى حركة الهمزة نفسها إطلاقًا،\nبل إلى <b>حركة الحرف الذي قبلها</b>:</p>\n<ul>\n<li>إن كان ما قبلها <b>ساكنًا</b> (حرفًا صحيحًا ساكنًا أو حرف مدّ) كُتبت <b>مفردة على السطر</b>:\nجزْء، ملْء، دفْء، شيْء، سماء، ضوء، بريء، قُروء.</li>\n<li>إن كان ما قبلها <b>متحركًا</b> كُتبت على حرف يناسب جنس تلك الحركة:\nبعد الفتح على ألف (قرَأ، نشَأ، ملجَأ)، وبعد الضم على واو (تهيُّؤ، لؤلُؤ، امرُؤ)،\nوبعد الكسر على ياء غير منقوطة (شاطِئ، قارِئ، مبتدِئ، متّكِئ).</li>\n</ul>\n<p><b>لهذا</b> نقول في الرفع: حضر امرُؤٌ (ضُمّت الراء فجاءت الهمزة على واو)،\nوفي النصب: رأيتُ امرَأً (فُتحت فجاءت على ألف)، وفي الجر: مررتُ بامرِئٍ (كُسرت فجاءت على ياء).\nوهذا هو سرّ كتابة «امرؤ القيس» بالواو.</p>\n<p><b>مسألة التنوين بالنصب على المتطرفة:</b> إذا نُوّنت الهمزة المتطرفة المسبوقة بألف\n<b>فلا تُزاد ألف بعدها</b>، لأن الألف السابقة تمنع: مساءً، نداءً، لواءً، اكتفاءً، شتاءً، جزاءً.\nأما إذا لم تسبقها ألف فتُزاد الألف وجوبًا: جزءًا، ضوءًا، بُرءًا، دفئًا، شيئًا.\nفـ«مساءً» صواب و«مساءًا/مساءاً» خطأ شائع.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>القاعدة:</b> يُنظر إلى حركة ما قبلها فقط لا إلى حركتها: فتحة ← ألف، ضمة ← واو، كسرة ← ياء (نبرة)، سكون ← على السطر.</li><li><b>إذا نُوّنت المتطرفة بالفتح</b> ففيها تفصيل: إن كانت على ألف لم تُزد ألف «ملجأً»، وإن كانت على السطر بعد ساكن غير الألف زِيدت «جزءًا»، وإن سُبقت بألف لم تُزد «ماءً».</li><li><b>الهمزة بعد ألف مدّية</b> تُكتب مفردة على السطر «سماء، بناء»؛ لأن الألف ساكنة ولا تُكتب الهمزة على ألف بعد ألف كراهة توالي المثلين.</li><li><b>إذا أُضيف الممدود إلى ضمير</b> تغيّر الرسم تبعًا للحركة: «جزاؤه، جزاءه، جزائه». وهذا أكثر ما يقع فيه الخطأ.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الإملاء والترقيم، وقواعد الإملاء لعبد السلام هارون، والمرجع في الإملاء.</p></div>"},{"t":"الهمزة المتوسطة — قاعدة الأقوى","b":"\n<p>القاعدة الحاكمة: <b>انظر إلى حركة الهمزة وحركة الحرف الذي قبلها، وخذ بالأقوى منهما، ثم اكتب الهمزة\nعلى ما يناسب الحركة الأقوى.</b> وترتيب الحركات في القوة: <b>الكسرة ← الضمة ← الفتحة ← السكون</b>.\nويناسب الكسرةَ الياءُ، والضمةَ الواوُ، والفتحةَ الألفُ، والسكونَ لا حرف له.</p>\n<table><tr><th>الأقوى</th><th>تُكتب على</th><th>أمثلة</th></tr>\n<tr><td>الكسرة</td><td>نَبِرة (ـئـ)</td><td>سُئِل، بِئر، سائِل، أسئِلة، رِئة، سيِّئة، طارِئة، فِئة</td></tr>\n<tr><td>الضمة</td><td>واو (ـؤـ)</td><td>مُؤمِن، يُؤَدّي، سُؤال، لُؤلُؤ، رُؤوس، تفاؤُل، تضاؤُل</td></tr>\n<tr><td>الفتحة</td><td>ألف (ـأـ)</td><td>سأَل، مسأَلة، يَأمُر، تَأدُّب، رَأس، نَشأَة</td></tr>\n<tr><td>السكون</td><td>—</td><td>لا يكون السكون أقوى أبدًا، فهو أضعف الأربعة</td></tr></table>\n<p><b>تطبيق:</b> «تفاؤُل»: الهمزة مضمومة وما قبلها ألف ساكنة؛ الضمة أقوى من السكون فكُتبت على واو.\n«مُؤمِن»: الهمزة ساكنة وما قبلها مضموم؛ الضمة أقوى فكُتبت على واو.\n«مَسؤول»: الهمزة مضمومة بعد ساكن صحيح وقبل واو مدّ، فرُسمت على واو ووُصل ما قبلها بما بعدها.</p>\n<p><b>الاستثناء المشهور:</b> إذا وقعت الهمزة <b>مفتوحة بعد ألف</b> كُتبت <b>مفردة على السطر</b>:\nتساءَل، تضاءَل، عباءَة، قراءَة، رداءَان. لأن كتابتها على ألف يؤدي إلى توالي ألفين.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>ترتيب قوّة الحركات:</b> الكسرة (ويناسبها الياء) ثم الضمة (ويناسبها الواو) ثم الفتحة (ويناسبها الألف) ثم السكون (ولا يناسبه شيء).</li><li><b>الموازنة بين حركة الهمزة وحركة ما قبلها</b>، وتُكتب على ما يناسب الأقوى. فـ«سُئل»: الهمزة مفتوحة وما قبلها مضموم، والأقوى الضم… لكن الكسرة في «سُئِل» أقوى فكُتبت على نبرة.</li><li><b>مواضع كتابتها مفردة على السطر:</b> إذا كانت مفتوحة بعد ألف ساكنة «قراءة، تساءل»، أو مفتوحة بعد واو ساكنة «مروءة»، لئلا تجتمع صورتان متماثلتان.</li><li><b>الهمزة المضمومة بعد ياء ساكنة</b> تُكتب على نبرة «مَجيئُه»، لأن الياء تُجاور النبرة.</li><li><b>تنبيه على «مسؤول» و«مسئول»:</b> الأشهر في المجامع «مسؤول» لأن الهمزة مضمومة بعد ساكن، والأقوى الضم، والواو تناسبه. وكلا الرسمين مستعمل.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: قواعد الإملاء لعبد السلام هارون، والإملاء والترقيم، وقرارات مجمع اللغة العربية.</p></div>"},{"t":"التاء المربوطة والتاء المفتوحة والهاء","b":"\n<p><b>الميزان الصوتي:</b> قف على الكلمة بالسكون. فإن نطقتها <b>هاءً</b> فهي <b>تاء مربوطة (ة)</b>،\nوإن بقيت <b>تاءً</b> فهي <b>تاء مفتوحة (ت)</b>. قل: «فاطمه» — نطقتها هاءً، إذن مربوطة.\nوقل: «بنتْ» — بقيت تاءً، إذن مفتوحة.</p>\n<p><b>مواضع المربوطة:</b> آخر الاسم المفرد المؤنث (زهرة، فاطمة، شجرة) — آخر جمع التكسير الذي لا ينتهي بتاء\nأصلية مفتوحة (قضاة، عُباقِرة، أساتذة) — صفة المذكر للمبالغة (علّامة، رحّالة، نسّابة) — وكلمة «ثَمّة»\nالظرفية بمعنى «هناك» تمييزًا لها عن «ثُمّت» حرف العطف.</p>\n<p><b>مواضع المفتوحة:</b> إذا كانت أصلية من بنية الاسم الثلاثي ساكن الوسط (بنْت/بنات، أخْت، بيْت،\nنبْت/نبات) — إذا سبقها واو أو ياء ساكنة (عفريت، جبروت، ملكوت) — آخر جمع المؤنث السالم\n(زهرات، معلمات، كرات) — إذا لحقت الفعل فاعلًا أو علامةَ تأنيث (كتبْتُ، شربْتَ، قالتْ، ذهبتْ).</p>\n<p><b>لماذا تُكتب تاء «فاطمة» مربوطة؟</b> لأنها اسم عَلَم <b>مفرد مؤنث</b>، وهذا هو الموضع الأول من مواضع\nالمربوطة؛ وليس السبب مجرد وقوعها آخر الكلمة، لأن «بنت» تاؤها آخر الكلمة أيضًا وهي مفتوحة.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الفارق الصوتي:</b> المربوطة تُنطق هاءً في الوقف وتاءً في الوصل، والمفتوحة تُنطق تاءً في الحالين. فاختبرها بالوقف.</li><li><b>التاء المفتوحة واجبة</b> في: جمع المؤنث السالم (معلّمات)، وتاء الفعل أصلية كانت (بات) أو ضميرًا (كتبتُ) أو للتأنيث الساكنة (كتبَتْ)، وفي بعض الحروف (ليت، لات، ربّت).</li><li><b>الهاء الأصلية</b> لا نقطتين عليها وتُنطق هاءً في الوصل والوقف: «فقيه، وجه، شبه». والخطأ في «مياه» و«أفواه» شائع.</li><li><b>تاء «ثَمَّةَ» و«ثُمَّ»:</b> «ثَمَّةَ» بمعنى هناك تُكتب بالتاء المربوطة، و«ثُمَّ» العاطفة بلا تاء.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الإملاء والترقيم، وأدب الكاتب، والمرجع في الإملاء.</p></div>"},{"t":"الألف اللينة في آخر الأسماء والأفعال","b":"\n<p>الألف اللينة ألف ساكنة مفتوح ما قبلها، تُرسم إما <b>قائمة (ا)</b> وإما <b>مقصورة (ى)</b>.</p>\n<p><b>في الأفعال:</b> تُرسم قائمة إن كان أصلها واوًا، ومقصورة إن كان أصلها ياءً.\nو<b>طريقة الكشف</b> ثلاث: (1) هات المضارع — دنا/يَدنو (واو) فتُكتب «دنا»، هدى/يَهدي (ياء) فتُكتب «هدى».\n(2) هات المصدر — عفا/عفوًا، سعى/سعيًا. (3) أسندِ الفعل إلى ضمير رفع متحرك —\nعزا/عزَوْتُ (واو)، رمى/رمَيْتُ (ياء).</p>\n<p><b>في الأسماء:</b> الثلاثي يُردّ إلى أصله بالتثنية أو الجمع: عصا/عصَوان (واو) فتُكتب قائمة،\nفتى/فتَيان (ياء) فتُكتب مقصورة، نَدى/نَديان، ربا/ربوة.\nوما زاد على ثلاثة أحرف فألفه <b>مقصورة</b> مطلقًا: مستشفى، مصطفى، دعوى، نجوى، سلوى، كبرى.</p>\n<p><b>استثناءان مهمان:</b> (1) إن سُبقت الألف بياء كُتبت <b>قائمة</b> منعًا لتوالي الياءين: دنيا، سجايا، رزايا، خطايا —\nإلا عَلَم «يحيى» فيُكتب بالياء تمييزًا له عن الفعل «يحيا».\n(2) الأسماء الأعجمية غالبًا تُكتب بالألف القائمة: فرنسا، أمريكا، زكريا، موسيقا — وشذّ ما استقرّ بالياء:\nموسى، عيسى، كسرى، بخارى.</p>\n<p><b>تطبيق سؤال شائع:</b> «... طالبُ العلم إلى المجد، و... إلى فعل الخير» الصواب: <b>سما، سعى</b>؛\nلأن «سما» من السُّمُوّ (يَسمو) فأصلها واو، و«سعى» من السَّعْي (يَسعى) فأصلها ياء.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الضابط في الثلاثي:</b> يُردّ إلى أصله بالتثنية أو المضارعة؛ فإن كان أصله واوًا كُتب ألفًا (عصا/عصوان، دعا/يدعو)، وإن كان ياءً كُتب ياءً (فتى/فتيان، رمى/يرمي).</li><li><b>فوق الثلاثي تُكتب ياءً</b> دائمًا إلا إذا سُبقت بياء فتُكتب ألفًا منعًا من توالي الياءين: «دنيا، عليا، استحيا، يحيا». ومن هنا الفرق بين «يحيى» علمًا و«يحيا» فعلًا.</li><li><b>الحروف كلها ألفها قائمة</b> إلا أربعة: «إلى، على، حتى، بلى»، ويُزاد «أنّى» الاستفهامية. وضابط الحفظ: الحروف بالألف إلا هذه.</li><li><b>الأسماء الأعجمية والمبنيات ألفها قائمة</b>: «أوروبا، فرنسا، موسيقا، هنا، أنا، إذا، ما»، ويُستثنى من الأعجمية «موسى، عيسى، كسرى، بخارى» فبالياء لكثرة الاستعمال.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: قواعد الإملاء لعبد السلام هارون، والإملاء والترقيم، والمرجع في الإملاء.</p></div>"},{"t":"الألف الفارقة ومواضع زيادة الألف وحذفها","b":"\n<p><b>الألف الفارقة</b> ألف تُزاد بعد واو الجماعة في آخر الفعل للتفريق بينها وبين الواو الأصلية:\nكتبوا، اجتهدوا، لم يذهبوا. وتُحذف في أربعة مواضع:</p>\n<ul>\n<li>إذا كانت الواو <b>أصلية</b> من بنية الفعل: يدعو، يرجو، يَشكو، يَسمو — فلا ألف.</li>\n<li>إذا اتصل بالفعل <b>ضمير</b>: عاونوهم، ساعدوني، كرّموه.</li>\n<li>إذا كانت الواو <b>علامة رفع</b> في الأفعال الخمسة ثبتت نونها: المؤمنون يسعَوْن (النون مانعة).</li>\n<li>إذا كانت واو <b>جمع المذكر السالم</b> لا واو جماعة: معلمو المدرسة، مهندسو الشركة —\nولهذا فإن «معلموا المدرسة» خطأ شائع، والصواب <b>معلمو المدرسة</b>.</li>\n</ul>\n<p><b>زيادة الواو:</b> تُزاد في «أولى، أولاء، أولئك، أولو، أولات» للتفريق بينها وبين «إلى، إليك».\nوتُزاد في «عمرو» للتفريق بينه وبين «عمر» الممنوع من الصرف، بشرط أن يكون علمًا غير مضاف ولا مصغّر\nولا محلًّى بـ«أل» ولا منصوبًا منوّنًا؛ فتقول: عمرو بن العاص، ومدحتُ عَمرًا (بلا واو في النصب).</p>\n<p><b>حذف ألف (أل):</b> تُحذف ألف «أل» إذا سبقتها <b>لام الجر</b> فقط: الوالد ← للوالد، القلم ← للقلم.\nوإذا بدأ الاسم بلام حُذفت «أل» كلها: اللبن ← للبن، اللغة ← للغة. ولا تُحذف مع بقية حروف الجر:\nبالعقيدة، كالبنيان، فالمسلمون.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الألف الفارقة</b> تُزاد بعد واو الجماعة في الفعل للتفريق بينها وبين واو العطف أو واو جمع المذكر: «لم يكتبوا». ولا تُزاد بعد واو الأصلية «يدعو»، ولا بعد واو الجمع في الأسماء «معلّمو المدرسة».</li><li><b>تُحذف ألف «ابن»</b> إذا وقعت بين علمين وكانت نعتًا غير مبتدأ بها ولا منوّن ما قبلها: «محمد بن عبد الله». وتثبت أول السطر وفي خبر المبتدأ «محمدٌ ابنُ عبدِ الله».</li><li><b>مواضع حذف الألف المشهورة:</b> «الله، الرحمن، هذا، هذه، ذلك، أولئك، لكن، طه، ثلاثمائة». وهي سماعية لا قياسية.</li><li><b>«مائة» و«مئة»:</b> الرسم القديم «مائة» بألف زائدة فُرّق بها بينها وبين «منه» في الخط القديم، والمجامع أجازت «مئة». وكلاهما صواب.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الإملاء والترقيم، وقواعد الإملاء، ورسم المصحف ومباحثه.</p></div>"},{"t":"همزة ابن — متى تُحذف ومتى تثبت","b":"\n<p>الأصل <b>إثبات</b> همزة «ابن»، والحذف استثناء مشروط.</p>\n<p><b>تُحذف</b> إذا اجتمعت ثلاثة شروط معًا: أن تكون <b>مفردة</b> (لا مثناة ولا مجموعة)،\nوأن تقع <b>بين علمين</b> متصلين بلا فاصل، وأن تكون <b>صفةً</b> للأول لا خبرًا، والعلم الثاني أبٌ له\n(أو لقب أو كنية). مثل: محمد بن إسحاق، معاوية بن أبي سفيان.\nويجب في هذه الحال <b>تسكين الباء</b> وترك تنوين الاسم الذي قبلها.</p>\n<p><b>وتثبت</b> في خمسة مواضع: إذا وقعت <b>خبرًا</b> (محمدٌ ابنُ خالدٍ — أي: هو ابنه) —\nإذا لم يتقدمها <b>عَلَم</b> (كان ابن جنّي لغويًّا) — إذا وقعت في <b>أول السطر</b> أو آخره —\nإذا فُصل بينها وبين العلم بفاصل — إذا كان العلم الثاني <b>جدًّا</b> لا أبًا (محمد ابن مالك).</p>\n<p><b>الفرق الدقيق:</b> «زهيرٌ ابنُ خالدٍ» بالتنوين وإثبات الهمزة إخبارٌ بالنسب،\nو«زهيرُ بنُ خالدٍ» بلا تنوين وبحذف الهمزة وصفٌ وتعريف. وتُعامل «ابنة» معاملة «ابن» بالشروط نفسها،\nويجوز كتابتها «بنت» بالتاء المفتوحة: هند بنت خليل.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>شروط الحذف ثلاثة مجتمعة:</b> أن تقع بين علمين، وأن تكون نعتًا للأول، وألّا تكون أول السطر، وألّا يكون الأول منوّنًا.</li><li><b>تثبت الهمزة</b> إذا ثُنّيت «ابنا عمر»، أو جُمعت، أو وقعت خبرًا «خالدٌ ابنُ الوليد» بمعنى الإخبار، أو سُبقت بحرف نداء «يا ابن أخي»، أو لم يكن ما بعدها علمًا «ابن الخطاب».</li><li><b>«بنت»</b> تجري مجرى «ابن» في الحذف والإثبات على الأرجح: «فاطمة بنت محمد».</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الإملاء والترقيم، وقواعد الإملاء لعبد السلام هارون.</p></div>"},{"t":"اللام الشمسية واللام القمرية","b":"\n<p>«أل» التعريف لامها واحدة في الكتابة، مختلفة في النطق:</p>\n<ul>\n<li><b>القمرية:</b> <b>تُكتب وتُلفظ</b>، ويأتي الحرف بعدها متحركًا غير مشدَّد، وتكون اللام ساكنة.\nحروفها أربعة عشر مجموعة في قولك: <b>«ابغِ حجَّك وخَفْ عقيمَه»</b> (أ ب غ ح ج ك و خ ف ع ق ي م هـ).\nمثل: القمر، البيت، الكتاب، الملعب.</li>\n<li><b>الشمسية:</b> <b>تُكتب ولا تُلفظ</b>، ويأتي الحرف بعدها <b>مشدَّدًا</b> لإدغام اللام فيه.\nحروفها الأربعة عشر الباقية: ت ث د ذ ر ز س ش ص ض ط ظ ل ن.\nمثل: الشَّمس، الرَّجل، السَّجادة، الثَّعلب، النَّور، الصَّيف.</li>\n</ul>\n<p>وسُميت شمسية وقمرية لأن كلمة «الشمس» تمثل الأولى و«القمر» تمثل الثانية.\nوفي سؤال «الصيف» تكون اللام <b>شمسية</b> لأن الصاد من الحروف الشمسية والدليل تشديدها في النطق: الصَّيف.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الحروف القمرية أربعة عشر</b> يجمعها: «ابغِ حجَّك وخَفْ عقيمه». وما عداها شمسية.</li><li><b>الفارق كتابيّ لا نطقيّ فقط:</b> اللام الشمسية تُكتب ولا تُنطق ويُشدَّد ما بعدها، والقمرية تُكتب وتُنطق ساكنة.</li><li><b>فائدة تجويدية:</b> اللام الشمسية إدغامٌ متماثل أو متقارب، والقمرية إظهار. وهذا الباب أصله في علم التجويد ثم نُقل إلى الإملاء.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: سرّ صناعة الإعراب لابن جني، وكتب التجويد، والمرجع في الإملاء.</p></div>"},{"t":"الحروف التي تُكتب ولا تُلفظ والتي تُلفظ ولا تُكتب","b":"\n<p><b>تُكتب ولا تُلفظ:</b></p>\n<ul>\n<li>ألف «مائة» ومركّباتها: مائة، مائتان، ثلاثمائة… وتُحذف في الجمع: مئون، مئات.\nوقد أجاز المحدثون كتابتها «مئة» مطلقًا لزوال اللبس بالنقط.</li>\n<li>الألف الفارقة بعد واو الجماعة: كتبوا، ذهبوا.</li>\n<li>واو «أولئك، أولى، أولاء، أولو، أولات، عمرو».</li>\n<li>ألف «أنا» في الوصل.</li>\n</ul>\n<p><b>تُلفظ ولا تُكتب:</b></p>\n<ul>\n<li>ألف أسماء الإشارة بعد هاء التنبيه: هذا، هذه، هؤلاء (وتُكتب في: هاتان، ها هنا).</li>\n<li>ألف أسماء الإشارة مع لام البعد: ذلك، ذلكم، ذلكن.</li>\n<li>اللام الثانية في الموصول: الذي، التي، الذين (وتُكتب في المثنى: اللذان، اللتان، وفي: اللاتي، اللواتي).</li>\n<li>ألف: لكن، طه، إسحق، هرون، الرحمن، يس، السموات، ثلث.</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>تُكتب ولا تُلفظ:</b> ألف «أولئك» و«مائة»، وواو «عمرو» (فارقة بينها وبين «عمر»)، وألف التفريق بعد واو الجماعة، وألف «أنا» في الوصل.</li><li><b>تُلفظ ولا تُكتب:</b> ألف «هذا، هذه، ذلك، لكن، الرحمن، الله، طه»، وواو «داود» عند بعضهم.</li><li><b>واو «عمرو» تُحذف في النصب</b> «رأيت عمرًا» لأن التنوين فارق، وتثبت في الرفع والجر.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: أدب الكاتب، والإملاء والترقيم، وقواعد الإملاء.</p></div>"},{"t":"حذف النون وهاء السكت","b":"\n<p><b>حذف النون من «من» و«عن»:</b> إذا دخلتا على «ما» أو «مَن» أُدغمتا: مِن ما ← مِمّا،\nعن ما ← عمّا، مِن مَن ← مِمَّن، عن مَن ← عمَّن.</p>\n<p><b>حذف النون من «إنْ» و«أنْ»:</b> تُحذف إذا وقع بعدهما «ما» أو «لا»: إنْ ما ← إمّا،\nأنْ لا ← ألّا (بشرط أن تكون «أنْ» ناصبة للمضارع: يسرّني ألّا تكذبَ).\nفإن لم تكن ناصبة وجب الفصل: «أشهد أن لا إله إلا الله»، «علمتُ أن لا أحدَ بالدار».</p>\n<p><b>هاء السكت:</b> هاء ساكنة تُزاد لبيان الحركة أو لحمل الصوت، ومن مواضعها فعل الأمر الذي بقي\nعلى حرف واحد: وَقى ← قِ ← <b>قِهْ</b>، وعى ← عِ ← <b>عِهْ</b>، رأى ← رَ ← <b>رَهْ</b>.\nوتُحذف إذا اتصل الأمر بضمير: قِها، عِهم.\nومن مواضعها «ما» الاستفهامية إذا سُبقت بحرف جر فحُذفت ألفها: علامَ تجلس؟ إلامَ تذهب؟ حتّامَ تسهر؟\nفإذا وقفتَ عليها قلت: علامَهْ؟ إلامَهْ؟</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>نون التوكيد الخفيفة تُحذف</b> في الوقف وتُقلب ألفًا: ﴿لنسفعًا بالناصية﴾ رُسمت تنوينًا وتُقرأ ألفًا في الوقف. وجه الاستشهاد: رسم نون التوكيد الخفيفة تنوينًا.</li><li><b>هاء السكت</b> تُزاد للوقف على ما يحتاج إلى بيان الحركة: ﴿ماليَهْ﴾ ﴿سلطانيَهْ﴾ ﴿كتابيَهْ﴾، وتُزاد في «لمه» و«عمّه» و«فيمه» إذا وُقف عليها.</li><li><b>تُحذف نون «مِن» و«عن»</b> إدغامًا في مثل ﴿عمّ يتساءلون﴾ و﴿ممّا خطيئاتهم﴾، ويُرسم مدغمًا.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: سر صناعة الإعراب، وكتب الوقف والابتداء، والإملاء والترقيم.</p></div>"},{"t":"علامات الترقيم ووظائفها","b":"\n<table><tr><th>العلامة</th><th>موضعها</th><th>مثال</th></tr>\n<tr><td>الفاصلة (،)</td><td>بين الجمل القصيرة المتعاطفة وبعد المنادى، ووقفتها خفيفة</td><td>يا باغيَ الخير، أقبلْ.</td></tr>\n<tr><td>الفاصلة المنقوطة (؛)</td><td>بين جملتين إحداهما سبب للأخرى، أو بين جمل طويلة</td><td>اجتهدَ؛ فنجحَ.</td></tr>\n<tr><td>النقطة (.)</td><td>نهاية الجملة التامة المعنى</td><td>خيرُ الناس أنفعُهم للناس.</td></tr>\n<tr><td>النقطتان (:)</td><td>قبل القول المنقول أو التعداد أو التوضيح</td><td>قال الشاعر: …</td></tr>\n<tr><td>الاستفهام (؟)</td><td>بعد صيغة السؤال</td><td>ما مهنتُك؟</td></tr>\n<tr><td>التعجب (!)</td><td>بعد التعجب أو الفرح أو الحزن أو الدعاء</td><td>ما أجملَ الربيعَ!</td></tr>\n<tr><td>الحذف (…)</td><td>مكان كلام محذوف من النص</td><td>وقف في الساحة … ثم أنشد.</td></tr>\n<tr><td>التنصيص (« »)</td><td>يُحصر بينهما كلام منقول بنصّه</td><td>قال: «لا ضررَ ولا ضِرار».</td></tr>\n<tr><td>الشرطتان (— —)</td><td>حول الجملة الاعتراضية</td><td>إني — والحمد لله — بخير.</td></tr>\n<tr><td>المعكوفتان ([ ])</td><td>زيادة من الناقل ليست من النص</td><td>قال [أي الجاحظ]…</td></tr></table>\n<p><b>نقطة امتحانية:</b> النقط الثلاث في وسط النص تدل على <b>حذف شيء من العبارة</b>، لا على نهاية الفقرة\nولا على جودة العبارة.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الترقيم محدث في العربية</b> نقله أحمد زكي باشا عن المطبوعات الأوروبية مطلع القرن العشرين، ولم يكن معروفًا في المخطوط القديم، وإنما كانت العرب تعتمد على السياق وعلامات بسيطة كالدائرة.</li><li><b>الفرق بين النقطتين الرأسيتين والفاصلة:</b> النقطتان للتفسير والتفصيل وبعد القول، والفاصلة لفصل الجمل القصيرة المتعاطفة.</li><li><b>الفاصلة المنقوطة</b> تُوضع بين جملتين إحداهما سبب للأخرى: «أخفق في الامتحان؛ لأنه لم يذاكر».</li><li><b>علامة الحذف (ثلاث نقاط)</b> تدلّ على كلام محذوف، والقوسان المعقوفان [ ] لزيادة من المحقّق، والقوسان الهلاليان ( ) للجمل الاعتراضية والتفسير.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الإملاء والترقيم في الكتابة العربية، والترقيم وعلاماته لأحمد زكي باشا.</p></div>"},{"t":"أنواع ترتيب الحروف العربية","b":"\n<ul>\n<li><b>الترتيب الهجائي:</b> تسعة وعشرون حرفًا رتّبها نصر بن عاصم الليثي على أساس تشابه الأشكال\nوتجانس الرسم. فائدته تيسير تعلّم الحرف، وترتيب المعاجم الحديثة أبوابًا وفصولًا، وترتيب الأسماء في القوائم.</li>\n<li><b>الترتيب الأبجدي:</b> منسوب إلى السامِيّين، مجموع في: أبجد، هوّز، حطّي، كلمن، سعفص، قرشت،\nثم الروادف التي انفردت بها العربية: ثخذ، ضظغ. وفائدته استعماله رموزًا عدديةً (حساب الجُمَّل)\nوترتيب العبارات بدل الأرقام.</li>\n<li><b>الترتيب الصوتي (العَيني):</b> وضعه الخليل بن أحمد الفراهيدي لمعجم «العين»، وبناه على\n<b>مخارج الحروف</b> من أقصى الحلق إلى الشفتين. وفائدته إعانة الدارس على معرفة المخرج والنطق الصحيح،\nونفعه لعلماء التجويد.</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الترتيب الأبجدي</b> (أبجد هوّز حطّي كلمن سعفص قرشت ثخذ ضظغ) أقدم من الألفبائي، وهو المعتمد في حساب الجُمّل وفي ترقيم أجزاء الكتب القديمة.</li><li><b>الترتيب الألفبائي (الهجائي)</b> نسبه كثيرون إلى نصر بن عاصم الليثي ويحيى بن يعمر، ورُتّب على تشابه الصور لا على المخارج.</li><li><b>الترتيب الصوتي</b> هو ترتيب الخليل في «العين» من أقصى الحلق إلى الشفتين: ع ح هـ خ غ / ق ك / ج ش ض / ص س ز / ط د ت / ظ ذ ث / ر ل ن / ف ب م / و ا ي.</li><li><b>الترتيب الأبجدي له أصل سامي</b> مشترك بين العربية والعبرية والسريانية، وهو دليل على وحدة الأصل.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: المزهر للسيوطي، والعين للخليل ومقدمته، والصاحبي في فقه اللغة.</p></div>"}]},{"c":"bala","n":"البلاغة","q":[{"q":"عرّف البلاغة","a":"مطابقة الكلام لمقتضى الحال مع فصاحته","e":"فلا يكفي أن يكون اللفظ فصيحًا سليمًا، بل لا بد أن يوافق حال المخاطب ومقامه. ولهذا كان كل بليغ فصيحًا وليس كل فصيح بليغًا، لأن البلاغة تشترط الفصاحة وتزيد.","d":["مجاز مرسل علاقته اعتبار ما سيكون","ما حُذفت منه أداة التشبيه","التحسّر والأسى (مع الاستبطاء)"]},{"q":"عرّف علم المعاني","a":"علم يُعرف به أحوال اللفظ العربي التي بها يطابق مقتضى الحال","e":"ومباحثه الخبر والإنشاء والقصر والفصل والوصل والإيجاز والإطناب والتقديم والتأخير. فمداره على تأليف الجملة وما يعرض لها من أحوال تناسب المقام.","d":["أن تُقابَل كل لفظة من الفقرة الأولى بلفظة من الثانية في الوزن والروي","ادّعاء بلوغ الوصف حدًّا مستبعَدًا أو مستحيلًا — وقسّمها السكاكي","أن تتفق الكلمة الأخيرة من الفقرتين في الوزن والروي دون سائر الكلمات"]},{"q":"عرّف علم البيان","a":"علم يُعرف به إيراد المعنى الواحد بطرق مختلفة في وضوح الدلالة عليه","e":"فالمعنى واحد والطرق متعددة: تشبيه ومجاز واستعارة وكناية، وتتفاوت هذه الطرق في درجة الوضوح وقوة الأثر.","d":["أن يقصد المتكلم شيئًا بالذكر دون غيره مما يسدّ مسدّه، لنكتة فيه ترجّح مجيئه","المحرَّف يقع الاختلاف فيه في الحركات، والمصحَّف في النَّقْط مع اتفاق الرسم","أن تتفق الكلمة الأخيرة من الفقرتين في الوزن والروي دون سائر الكلمات"]},{"q":"عرّف علم البديع","a":"علم يُعرف به وجوه تحسين الكلام بعد مطابقته لمقتضى الحال ووضوح دلالته","e":"فهو علم تابع لا متبوع؛ لأن التحسين إنما يُلتفت إليه بعد سلامة التأليف ووضوح الدلالة، وإلا كان زخرفًا على بناء مائل.","d":["التمني بـ«ليت» لما لا يُرجى، والترجي بـ«لعلّ» و«عسى» لما يُرجى وقوعه","العبارة التي تُقرأ طردًا وعكسًا على صورة واحدة","ما لم يُذكر فيها ما يلائم المعنى القريب ولا المعنى البعيد"]},{"q":"«كل بليغ فصيح وليس كل فصيح بليغًا» — صح أم خطأ؟","a":"صح","e":"لأن الفصاحة شرط في البلاغة وجزء من حدّها، فكل بليغ لا بد أن يكون فصيحًا. وقد يكون الكلام فصيح الألفاظ لكنه لا يطابق مقتضى الحال فلا يكون بليغًا.","d":["التمني","الفخر","طباق"]},{"q":"كم أضرب الخبر؟","a":"ثلاثة","e":"ابتدائي لخالي الذهن بلا مؤكد، وطلبي للمتردد بمؤكد واحد، وإنكاري للمنكر بمؤكدين فأكثر. والمعوّل في اختيار الضرب على حال المخاطب لا على رغبة المتكلم.","d":["الفخر","استدراج","التهديد"]},{"q":"«فالخيلُ والليلُ والبيداءُ تعرفني» — الغرض البلاغي من الخبر","a":"الفخر","e":"فالمتنبي لم يقصد إفادة السامع بخبر يجهله، بل خرج الخبر عن أصله إلى غرض بلاغي هو التفاخر بشهرته وبسالته. وقرينة ذلك تعداد مظانّ الفروسية والكتابة معًا.","d":["التمني","الرثاء","مشاكلة"]},{"q":"«ألا ليت الشبابَ يعودُ يومًا» — الغرض البلاغي","a":"التمني","e":"لأن «ليت» موضوعة لطلب المحبوب المستحيل أو البعيد المنال، وعودة الشباب مستحيلة عادةً. ولو كان الأمر ممكنًا متوقعًا لاستُعملت «لعلّ» للترجي.","d":["مكنية","مشاكلة","الرثاء"]},{"q":"«ألا أيها الليل الطويل ألا انجلِ» — الغرض من النداء","a":"التحسّر والأسى (مع الاستبطاء)","e":"لأن المنادى هنا ليس عاقلًا يُطلب إقباله، فخرج النداء عن أصله إلى إظهار الشكوى واستطالة الليل. وهذا من أشهر مواضع خروج النداء عن معناه الحقيقي.","d":["مراعاة نظير (ويصح: سجع)","ذكر العام بعد الخاص","ذكر الشيء بلفظ غيره لوقوعه في صحبته"]},{"q":"«يا درّةً نُزعت من تاج والدها» — الغرض من النداء","a":"الأسى والتحسّر","e":"لأن المنادى ميّت لا يُرجى إقباله، فتعيّن أن يكون النداء لإظهار الحسرة ورثاء الفقيد. والاستعارة في تسميتها «درّة» تضاعف أثر الحزن.","d":["استعارة تبعية","تعقيد معنوي","قصر إفراد"]},{"q":"«يا لجمال النيل!» — النداء يفيد","a":"التعجب","e":"لأن المنادى معنًى لا يُنادى حقيقةً، فتعيّن خروج النداء إلى التعجب والإعجاب. وهذا أسلوب يُسمى نداء التعجب وتكثر فيه اللام المفتوحة.","d":["المدح","التمني","الفخر"]},{"q":"خرج الأمر في «قل تمتّعوا فإن مصيركم إلى النار» إلى معنى","a":"التهديد","e":"لأن سياق الآية وعيد لا إذن، والقرينة ختمها ببيان المصير إلى النار. فالأمر هنا صورة ظاهرها الإباحة وباطنها الزجر والإنذار.","d":["إغراء","الفخر","التفسير"]},{"q":"«أليس اللهُ بكافٍ عبدَه» — الأسلوب يفيد","a":"التقرير","e":"لأن الاستفهام خرج عن طلب الفهم إلى حمل المخاطب على الإقرار بأمر مستقرٍّ في نفسه. وعلامة الاستفهام التقريري أن الجواب يكون بالإثبات لا بالنفي.","d":["المدح","الفخر","التمني"]},{"q":"ما نوع القصر في «إنني أنا الله لا إله إلا أنا»؟","a":"قصر إفراد","e":"لأنه ردٌّ على من اعتقد الشِّركة في الألوهية، فقُصرت الألوهية على الله وحده وأُفرد بها. وطريقه النفي والاستثناء، وهو أقوى طرق القصر.","d":["طباق إيجاب","تعقيد معنوي","جناس قلب"]},{"q":"«ربِّ اغفر لي ولوالديَّ ولمن دخل بيتي مؤمنًا وللمؤمنين والمؤمنات» — نوع الإطناب","a":"ذكر العام بعد الخاص","e":"لأنه بدأ بالخاص (نفسه ووالديه ومن دخل بيته) ثم عمّم بذكر المؤمنين والمؤمنات. وفائدته الاهتمام بالخاص أولًا ثم إفادة الشمول والعموم ثانيًا.","d":["الجمع بين الشيء وضده في الكلام","مجاز مرسل علاقته المحلية","ردّ العجز على الصدر"]},{"q":"نوع التشبيه في: «النخلة لا تنبت في الأرض السبخة كالكلمة الطيبة لا تنمو في النفوس المريضة»","a":"تشبيه تمثيلي","e":"لأن وجه الشبه صورة منتزعة من متعدد: امتناعُ النماء لفساد المحلّ لا لنقص في النامي. وكل تشبيه كان وجهه هيئةً مركبة لا وصفًا مفردًا فهو تمثيلي.","d":["المدح والثناء","تشبيه ضمني","العكس والتبديل"]},{"q":"نوع التشبيه في: «ومن يكُ ذا فمٍ مُرٍّ مريضٍ ... يجد مرًّا به الماءَ الزلالا»","a":"تشبيه ضمني","e":"لأن الشاعر لم يصرّح بالمشبه والمشبه به في صورة التشبيه المعروفة، بل ألمح إليهما في سياق المعنى. وغرضه إثبات أن إنكار فضله راجع إلى فساد حاسّة المنكر لا إلى نقص فيه.","d":["التشبيه المرسل المفصَّل","السجع في النثر","استعارة تصريحية"]},{"q":"عرّف التشبيه المؤكَّد","a":"ما حُذفت منه أداة التشبيه","e":"ويقابله المرسل الذي ذُكرت أداته. وسُمّي مؤكدًا لأن حذف الأداة يُشعر بأن المشبه عين المشبه به ادّعاءً فيقوى التشبيه.","d":["بيان مقدار حال المشبَّه","ردّ العجز على الصدر","مراعاة نظير (ويصح: سجع)"]},{"q":"ما التشبيه الذي ذُكرت فيه الأركان كلها؟","a":"التشبيه المرسل المفصَّل","e":"لأن «المرسل» ما ذُكرت أداته، و«المفصَّل» ما ذُكر وجه شبهه؛ فإذا اجتمعا مع الطرفين تمّت الأركان الأربعة. وضدّه التشبيه البليغ الذي حُذفت أداته ووجهه معًا.","d":["العكس والتبديل","استعارة مكنية","تجاهل العارف"]},{"q":"غرض التشبيه في «ثوبُ أحمدَ أبيضُ كاللبن»","a":"بيان مقدار حال المشبَّه","e":"لأن بياض الثوب معلوم مقرَّر قبل التشبيه، فلم يأتِ التشبيه لبيان أصل الحال بل لتحديد درجته ومبلغه. ولو كان الوصف مجهولًا لكان الغرض بيان الحال.","d":["ما حُذفت منه أداة التشبيه","ذكر الشيء بلفظ غيره لوقوعه في صحبته","مراعاة نظير (ويصح: سجع)"]},{"q":"«يُخرجهم من الظلمات إلى النور» — الوجه البلاغي","a":"استعارة تصريحية","e":"لأنه صرّح بلفظ المشبه به «الظلمات والنور» وحذف المشبه وهو الضلال والهدى. والقرينة أن الكلام في الإيمان والكفر لا في الضوء الحسّي.","d":["تعقيد معنوي","جناس ناقص محرَّف","الأسى والتحسّر"]},{"q":"«اصغت آذانُ المجد إليك» — نوع الاستعارة","a":"مكنية","e":"لأنه شبّه المجد بإنسان له أذن يسمع بها، ثم حذف المشبه به ورمز له بلازم من لوازمه وهو «الآذان» و«الإصغاء». وكل تشخيص لمعنوي على هذا النحو فهو مكنية.","d":["التمني","الفخر","طباق"]},{"q":"«واشتعل الرأسُ شيبًا» — اللون البياني","a":"استعارة مكنية","e":"شبّه الشيب بالنار في انتشاره وسرعة أخذه، ثم حذف المشبه به ورمز له بلازمه وهو «الاشتعال». وتفيد الاستعارة هنا الشمول والسرعة معًا.","d":["تشبيه ضمني","الهجاء والسخرية","طباق إيجاب"]},{"q":"«بل نقذف بالحق على الباطل فيدمغه» — نوع الاستعارة","a":"استعارة تبعية","e":"لأنها جرت في الفعل «نقذف» لا في اسم جامد؛ فشُبّه إبطال الباطل بالحق برمي الجسم الثقيل على الشيء فيهشمه. والاستعارة إذا كانت في فعل أو مشتق أو حرف سُمّيت تبعية.","d":["المدح والثناء","تنافر الحروف","طباق إيجاب"]},{"q":"«إني أراني أعصر خمرًا» — اللون البياني","a":"مجاز مرسل علاقته اعتبار ما سيكون","e":"لأن المعصور عنبٌ لا خمر، وإنما سُمّي باسم ما سيؤول إليه. وهذا من علاقات المجاز المرسل المشهورة، وقرينته أن العصر لا يقع على الخمر.","d":["تمييز المسند إليه باسم الإشارة ليتقرر الحكم","مراعاة نظير (ويصح: سجع)","الجمع بين الشيء وضده في الكلام"]},{"q":"«يجعلون أصابعهم في آذانهم» — اللون البياني","a":"مجاز مرسل علاقته الجزئية","e":"لأن المُدخَل في الأذن أطراف الأصابع أو الأنامل لا الأصبع كلها، فذُكر الكل وأُريد الجزء — وهي علاقة الكلية؛ ومن عبّر بأن الأصابع جزء من الكفّ جعلها جزئية. والمدار على ما تُحدده الخيارات.","d":["مجاز عقلي علاقته المفعولية","«الأجلَل» مخالفة للقياس الصرفي","الجمع بين الشيء وضده في الكلام"]},{"q":"«نجوتُ وقد بلّ المرادي سيفه ... من ابن أبي شيخِ الأباطح طالبِ» — اللون البياني","a":"مجاز مرسل علاقته المحلية","e":"لأن «الأباطح» موضعٌ أُريد به أهله الساكنون فيه، فذُكر المحلّ وأُريد الحالّ. والقرينة أن السيادة إنما تكون للناس لا للبطحاء.","d":["بيان مقدار حال المشبَّه","ما حُذفت منه أداة التشبيه","مطابقة الكلام لمقتضى الحال مع فصاحته"]},{"q":"«ولا تجعل يدك مغلولة إلى عنقك» — اللون البياني","a":"كناية عن صفة البخل","e":"لأن غلّ اليد إلى العنق لازمه الامتناع عن العطاء، فأُريد اللازم. وتمام الآية نهيٌ عن بسط اليد كل البسط وهو كناية عن الإسراف، فاجتمع ذمّ الطرفين.","d":["ذكر العام بعد الخاص","مجاز مرسل علاقته الجزئية","الجمع بين الشيء وضده في الكلام"]},{"q":"«الطاعم الكاسي» في بيت الحطيئة — ما نوعه؟","a":"مجاز عقلي علاقته المفعولية","e":"لأنه أسند اسم الفاعل إلى من هو مفعول في المعنى: فالرجل مَطعوم مَكسوّ لا طاعم ولا كاسٍ. والغرض من ذلك تصوير عجزه وتهكّمه به.","d":["«الأجلَل» مخالفة للقياس الصرفي","مجاز مرسل علاقته الجزئية","مجاز مرسل علاقته المحلية"]},{"q":"«أشدّاء على الكفار رحماء بينهم» — نوع المحسّن","a":"طباق إيجاب","e":"لأنه جمع بين معنيين متضادين: الشدة والرحمة، وكلاهما مثبت. والطباق يُسمى سلبًا إذا جُمع بين فعل مثبت ومنفي من مادة واحدة.","d":["جناس ناقص محرَّف","المدح والثناء","استعارة مكنية"]},{"q":"«الظلمات والنور» — نوع المحسّن","a":"طباق","e":"لأنه جمع بين الشيء وضدّه. وهو طباق إيجاب لأن اللفظين مثبتان مختلفا المادة، ويزيد الكلام حسنًا لأن الضدّ يُظهر حُسنه الضدُّ.","d":["الرثاء","التمني","التعجب"]},{"q":"«فليضحكوا قليلًا وليبكوا كثيرًا» — نوع المحسّن","a":"مقابلة","e":"لأنه أتى بمعنيين (الضحك والقِلّة) ثم بما يقابلهما على الترتيب (البكاء والكثرة). والفرق بينها وبين الطباق أن الطباق بين لفظين والمقابلة بين أكثر على الترتيب.","d":["إغراء","التهديد","مكنية"]},{"q":"«إن الأبرار لفي نعيم وإن الفُجّار لفي جحيم» — نوع المحسّن","a":"ترصيع","e":"لأن ألفاظ الفقرة الأولى توازنت مع نظائرها في الفقرة الثانية وزنًا ورويًّا: الأبرار/الفجّار، نعيم/جحيم. وهو من المحسنات اللفظية التي تقوم على التوازن الصوتي.","d":["طباق","ثلاثة","التعجب"]},{"q":"عرّف المشاكلة","a":"ذكر الشيء بلفظ غيره لوقوعه في صحبته","e":"تحقيقًا أو تقديرًا. ومثالها التعبير عن جزاء النسيان بلفظ النسيان نفسه في قوله «نسوا الله فنسيهم»، فالثاني مجاز عن الترك جاء مشاكلًا للأول في اللفظ.","d":["ما حُذفت منه أداة التشبيه","ذكر العام بعد الخاص","مجاز مرسل علاقته اعتبار ما سيكون"]},{"q":"«ألا لا يجهلنْ أحدٌ علينا ... فنجهلَ فوق جهل الجاهلينا» — المحسّن البديعي","a":"مشاكلة","e":"لأن الجهل الثاني ليس سفهًا حقيقيًّا بل مجازاةٌ على السفه، فعبّر عنه بلفظ الأول لوقوعه في صحبته. وهذا هو جوهر المشاكلة: مطابقة اللفظ للفظ مع اختلاف المعنى.","d":["المدح","الفخر","ثلاثة"]},{"q":"عرّف التورية","a":"لفظ له معنيان: قريب ظاهر غير مراد، وبعيد خفيّ هو المراد","e":"ولا بد معها من قرينة خفية تُشير إلى البعيد وتسمى الإيهام. وسُمّيت تورية لأن المتكلم يستر المعنى المقصود خلف معنى أقرب إلى الذهن.","d":["علم يُعرف به وجوه تحسين الكلام بعد مطابقته لمقتضى الحال ووضوح دلالته","التمني بـ«ليت» لما لا يُرجى، والترجي بـ«لعلّ» و«عسى» لما يُرجى وقوعه","المحرَّف يقع الاختلاف فيه في الحركات، والمصحَّف في النَّقْط مع اتفاق الرسم"]},{"q":"ما التورية المجرَّدة؟","a":"ما لم يُذكر فيها ما يلائم المعنى القريب ولا المعنى البعيد","e":"فهي مجرّدة من اللوازم كلها. ويقابلها المرشَّحة التي يُذكر معها ما يلائم القريب، والمبيَّنة التي يُذكر معها ما يلائم البعيد.","d":["ادّعاء بلوغ الوصف حدًّا مستبعَدًا أو مستحيلًا — وقسّمها السكاكي","أن تتفق الكلمة الأخيرة من الفقرتين في الوزن والروي دون سائر الكلمات","علم يُعرف به إيراد المعنى الواحد بطرق مختلفة في وضوح الدلالة عليه"]},{"q":"عرّف الطباق","a":"الجمع بين الشيء وضده في الكلام","e":"وهو نوعان: طباق إيجاب إذا كان اللفظان مثبتين مختلفي المادة، وطباق سلب إذا جُمع بين فعل مثبت وآخر منفي من المادة نفسها.","d":["مراعاة نظير (ويصح: سجع)","«الأجلَل» مخالفة للقياس الصرفي","ذكر الشيء بلفظ غيره لوقوعه في صحبته"]},{"q":"عرّف المبالغة ومَن قسّمها؟","a":"ادّعاء بلوغ الوصف حدًّا مستبعَدًا أو مستحيلًا — وقسّمها السكاكي","e":"إلى تبليغ: ما كان ممكنًا عقلًا وعادةً؛ وإغراق: ما كان ممكنًا عقلًا لا عادةً؛ وغلوّ: ما كان مستحيلًا عقلًا وعادةً. وأجودها التبليغ ثم الإغراق.","d":["العبارة التي تُقرأ طردًا وعكسًا على صورة واحدة","علم يُعرف به وجوه تحسين الكلام بعد مطابقته لمقتضى الحال ووضوح دلالته","أن تُقابَل كل لفظة من الفقرة الأولى بلفظة من الثانية في الوزن والروي"]},{"q":"عرّف التنكيت","a":"أن يقصد المتكلم شيئًا بالذكر دون غيره مما يسدّ مسدّه، لنكتة فيه ترجّح مجيئه","e":"فهو اختيار مقصود للفظة بعينها من بين نظائرها لسبب بلاغي دقيق. وبه يُعرف فضل الصياغة، إذ ليس كل ما صحّ وضعُه في الموضع يصلح له.","d":["علم يُعرف به وجوه تحسين الكلام بعد مطابقته لمقتضى الحال ووضوح دلالته","المحرَّف يقع الاختلاف فيه في الحركات، والمصحَّف في النَّقْط مع اتفاق الرسم","ادّعاء بلوغ الوصف حدًّا مستبعَدًا أو مستحيلًا — وقسّمها السكاكي"]},{"q":"«بالله يا ظبيات القاع قلن لنا ... ليلايَ منكنّ أم ليلى من البشرِ» — المحسّن","a":"تجاهل العارف","e":"لأن الشاعر يعلم يقينًا أن محبوبته من البشر، لكنه ساق المعلوم مساق المجهول. والغرض البلاغي إظهار شدة الوله والمبالغة في وصف جمالها.","d":["السجع في النثر","تنافر الحروف","استعارة تبعية"]},{"q":"مقولة: «أفضّل احترام العالم ولو بغير عطف، على عطف العالم إذا كان بغير احترام» — المحسّن","a":"العكس والتبديل","e":"لأنه قدّم جزءًا من الكلام ثم عكسه فأخّر ما قدّم وقدّم ما أخّر. وفائدته إبراز التقابل بين الحالين وترجيح إحداهما بصورة محكمة موجزة.","d":["تشبيه تمثيلي","استعارة تبعية","جناس ناقص محرَّف"]},{"q":"ما «ما لا يستحيل بالانعكاس»؟","a":"العبارة التي تُقرأ طردًا وعكسًا على صورة واحدة","e":"ويُسمى المقلوب أو المستوي. ومنه في التنزيل تراكيب قصيرة تُقرأ من الجهتين بحروفها نفسها، ومنه في الشعر بيتٌ يُعاد ترتيب شطريه فلا يختل لفظه.","d":["علم يُعرف به أحوال اللفظ العربي التي بها يطابق مقتضى الحال","لفظ له معنيان: قريب ظاهر غير مراد، وبعيد خفيّ هو المراد","أن تتفق الكلمة الأخيرة من الفقرتين في الوزن والروي دون سائر الكلمات"]},{"q":"نوع الجناس بين «كفّيه» و«فكّيه»","a":"جناس قلب","e":"لأن اللفظين اتفقا في نوع الحروف وعددها واختلفا في الترتيب فقط. وهو من الجناس الناقص، وسُمّي قلبًا لانقلاب ترتيب الحروف.","d":["السجع في النثر","الأسى والتحسّر","الهجاء والسخرية"]},{"q":"نوع الجناس بين «مَذهَب» و«مُذهَب»","a":"جناس ناقص محرَّف","e":"لأن اللفظين اتفقا في الحروف وعددها وترتيبها واختلفا في الهيئة أي في الحركات. وسُمّي محرَّفًا لأن التحريف وقع في الضبط لا في الحروف.","d":["تشبيه ضمني","السجع في النثر","تشبيه تمثيلي"]},{"q":"ما الفرق بين الجناس المحرَّف والجناس المصحَّف؟","a":"المحرَّف يقع الاختلاف فيه في الحركات، والمصحَّف في النَّقْط مع اتفاق الرسم","e":"فمدار الأول على الضبط ومدار الثاني على الإعجام، وكلاهما من الجناس الناقص لأن الحروف متفقة والاختلاف عارض في الهيئة أو النقط.","d":["العبارة التي تُقرأ طردًا وعكسًا على صورة واحدة","ادّعاء بلوغ الوصف حدًّا مستبعَدًا أو مستحيلًا — وقسّمها السكاكي","أن يقصد المتكلم شيئًا بالذكر دون غيره مما يسدّ مسدّه، لنكتة فيه ترجّح مجيئه"]},{"q":"عرّف السجع المطرَّف","a":"ما اختلفت فيه الفاصلتان وزنًا واتفقتا رويًّا","e":"فالتوافق في الحرف الأخير حاصل، والاختلاف في عدد الحروف وهيئتها. وهو أدنى أنواع السجع رتبةً لأن التوافق فيه جزئي.","d":["مجاز مرسل علاقته المحلية","ما حُذفت منه أداة التشبيه","ذكر الشيء بلفظ غيره لوقوعه في صحبته"]},{"q":"عرّف السجع المرصَّع","a":"أن تُقابَل كل لفظة من الفقرة الأولى بلفظة من الثانية في الوزن والروي","e":"فتتفق ألفاظ الفقرتين كلها في الوزن والقافية لا الأخيرة وحدها. وهو أعلى أنواع السجع صنعةً وأشدّها كلفةً.","d":["أن يقصد المتكلم شيئًا بالذكر دون غيره مما يسدّ مسدّه، لنكتة فيه ترجّح مجيئه","علم يُعرف به إيراد المعنى الواحد بطرق مختلفة في وضوح الدلالة عليه","المحرَّف يقع الاختلاف فيه في الحركات، والمصحَّف في النَّقْط مع اتفاق الرسم"]},{"q":"عرّف السجع المتوازي","a":"أن تتفق الكلمة الأخيرة من الفقرتين في الوزن والروي دون سائر الكلمات","e":"فهو وسط بين المطرَّف والمرصَّع. وسُمّي متوازيًا لتوازي الفاصلتين في البناء الصوتي مع تحرر باقي الألفاظ.","d":["علم يُعرف به وجوه تحسين الكلام بعد مطابقته لمقتضى الحال ووضوح دلالته","المحرَّف يقع الاختلاف فيه في الحركات، والمصحَّف في النَّقْط مع اتفاق الرسم","ادّعاء بلوغ الوصف حدًّا مستبعَدًا أو مستحيلًا — وقسّمها السكاكي"]},{"q":"الفواصل القرآنية تساوي…","a":"السجع في النثر","e":"من حيث التوافق الصوتي في أواخر الآيات. غير أن جمهور العلماء آثروا تسميتها «فواصل» لا سجعًا تنزيهًا للقرآن عن مشابهة صنعة الكهّان والمتكلفين.","d":["استعارة تبعية","تشبيه ضمني","استعارة مكنية"]},{"q":"«سريعٌ إلى ابن العمّ يلطم وجهه ... وليس إلى داعي الندى بسريعِ» — المحسّن","a":"ردّ العجز على الصدر","e":"لأن لفظة «سريع» تكررت في صدر البيت وفي عجزه. وبلاغته هنا أنه أحكم المفارقة: سرعة في الشر وبطء في الخير، فأدّى التكرار معنى التهكم.","d":["التنبيه على خطأ المخاطب","مجاز مرسل علاقته اعتبار ما سيكون","ذكر العام بعد الخاص"]},{"q":"«وقبرُ حربٍ بمكانٍ قفرِ ... وليس قربَ قبرِ حربٍ قبرُ» — العيب البلاغي","a":"تنافر الحروف","e":"لتكرار القاف والباء والراء مع تقارب المخارج، فثقُل البيت على اللسان وعسُر النطق به. وهو من عيوب فصاحة الكلمة والكلام معًا.","d":["استعارة تصريحية","طباق إيجاب","استعارة تبعية"]},{"q":"«سأطلب بُعد الدار عنكم لتقربوا ... وتسكب عيناي الدموع لتجمدا» — العيب","a":"تعقيد معنوي","e":"لأن الشاعر كنّى عن البكاء بسكب الدموع وعن انقطاعه بالجمود، فخفيت لوازم المعنى على السامع. والتعقيد المعنوي خفاءُ الانتقال من المعنى الأول إلى المقصود.","d":["تجاهل العارف","المدح والثناء","نفي مؤكَّد"]},{"q":"«الحمد لله العليّ الأجلَل» — ما الشاهد؟","a":"«الأجلَل» مخالفة للقياس الصرفي","e":"لأن القياس فيه الإدغام فيقال «الأجَلّ»، لكن الراجز فكّ الإدغام للضرورة. ومخالفة القياس الصرفي عيب من عيوب فصاحة الكلمة.","d":["ذكر الشيء بلفظ غيره لوقوعه في صحبته","مجاز عقلي علاقته المفعولية","جناس (أو تورية في «الجبن»)"]},{"q":"«بأن ذا الكلب عمرًا خيرهم حسبًا» — ما الشاهد؟","a":"تقديم اللقب على الاسم","e":"فقد قدّم اللقب «ذا الكلب» على الاسم «عمرًا»، والأصل تأخير اللقب عن الاسم. وهذا جائز لكنه قليل، فعُدّ شاهدًا.","d":["الإتيان بالضمير منفصلًا في موضع الاتصال","تشبيه ضمني (مع المقابلة)","الجمع بين الشيء وضده في الكلام"]},{"q":"«بالوارث الباعث الأمواتِ قد ضمنت ... إياهم الأرضُ» — الشاهد","a":"الإتيان بالضمير منفصلًا في موضع الاتصال","e":"فالأصل «قد ضمنتهم الأرض» بالضمير المتصل، لكنه فصله ضرورةً. والقاعدة أنه متى أمكن الاتصال امتنع الانفصال.","d":["بيان مقدار حال المشبَّه","التنبيه على خطأ المخاطب","مجاز مرسل علاقته الجزئية"]},{"q":"«إذا الشمس كُوِّرت وإذا النجوم انكدرت» — المحسّن","a":"مراعاة نظير (ويصح: سجع)","e":"لأنه جمع بين أمور متناسبة غير متضادة من مشاهد الكون. ومن نظر إلى توافق الفاصلتين في الحرف الأخير عدّه سجعًا، والمدار على الخيارات المعروضة.","d":["ما حُذفت منه أداة التشبيه","مجاز مرسل علاقته اعتبار ما سيكون","مجاز مرسل علاقته المحلية"]},{"q":"«اذهب إلى فرعون إنه طغى» — الأسلوب","a":"استدراج","e":"لأن الخطاب سِيق بلين ورفقٍ ظاهرَين مع أن المراد الإنذار والوعيد. والاستدراج أن يُؤتى بالكلام على صورة المسالمة وباطنه الزجر.","d":["الفخر","مدح","مشاكلة"]},{"q":"«أولئك على هدًى من ربهم» — الوجه البلاغي","a":"تمييز المسند إليه باسم الإشارة ليتقرر الحكم","e":"فالعدول عن الضمير إلى اسم الإشارة يفيد تمييز الموصوفين وتعيينهم كأنهم حاضرون مشاهَدون، فيتقرر الحكم في النفس ويقوى.","d":["الجمع بين الشيء وضده في الكلام","جناس (أو تورية في «الجبن»)","التحسّر والأسى (مع الاستبطاء)"]},{"q":"«إن الذين ترونهم إخوانكم» — الغرض من الاسم الموصول","a":"التنبيه على خطأ المخاطب","e":"لأن الصلة «ترونهم إخوانكم» تضمنت أن ما يراه المخاطب أخوّةً ليس كذلك في الحقيقة. فاختيار الموصول هنا وسيلة لتصحيح تصوّر السامع.","d":["بيان مقدار حال المشبَّه","كناية عن صفة البخل","التحسّر والأسى (مع الاستبطاء)"]},{"q":"«النيل العذب هو الكوثر والجنة شاطئه الأخضر» — الوجه البلاغي","a":"تشبيه بليغ","e":"لأنه حذف الأداة ووجه الشبه معًا وجعل المشبه عين المشبه به ادّعاءً. وهذا أعلى مراتب التشبيه لما فيه من إيهام الاتحاد.","d":["الهجاء والسخرية","جناس ناقص محرَّف","تشبيه ضمني"]},{"q":"«أعينيَّ جودا ولا تجمدا ... ألا تبكيان لصخر الندى» — الغرض الشعري","a":"الرثاء","e":"لأن الخنساء تخاطب عينيها طالبةً منهما البكاء على أخيها صخر. والنداء والأمر هنا خرجا إلى إظهار الحسرة، وهو أمارة غرض الرثاء.","d":["إغراء","التعجب","المدح"]},{"q":"«دَعِ المكارمَ لا ترحلْ لبُغيتها ... واقعدْ فإنك أنت الطاعمُ الكاسي» — الغرض","a":"الهجاء والسخرية","e":"لأن ظاهر الأمر نصيحة وباطنه تحقير وتهكم، إذ جعله عاجزًا لا يُحسن إلا الأكل واللبس. وهذا من خروج الأمر عن أصله إلى التهكم.","d":["طباق إيجاب","قصر إفراد","استعارة تصريحية"]},{"q":"«وإني وإن كنتُ الأخيرَ زمانُه ... لآتٍ بما لم تستطعْه الأوائلُ» — الغرض","a":"الفخر","e":"لأن الشاعر يُثبت لنفسه سَبْقًا على المتقدمين مع تأخر زمانه. والبيت ينسب إلى أبي العلاء المعري، وفيه مقابلة بين الأخير والأوائل تزيد الفخر قوة.","d":["الرثاء","التعجب","طباق"]},{"q":"«وإن صخرًا لتأتمّ الهداةُ به ... كأنه عَلَمٌ في رأسه نارُ» — الغرض","a":"المدح والثناء","e":"لأنه أثبت للممدوح الهداية والاقتداء، وشبّهه بالجبل العالي الذي تُوقد عليه النار فيُهتدى به. والتشبيه هنا مرسل مجمل يخدم غرض المدح.","d":["استعارة مكنية","جناس ناقص محرَّف","العكس والتبديل"]},{"q":"«إن الرسول لنورٌ يُستضاء به ... مهنَّدٌ من سيوف الله مسلولُ» — الغرض","a":"المدح","e":"لأنه جمع له بين النور الهادي والسيف الناصر، فأثبت له كمال الهداية وكمال المنعة. والبيت من قصيدة كعب بن زهير المعروفة بالبُردة.","d":["طباق","الفخر","مكنية"]},{"q":"«ونشرب إن وردنا الماءَ صَفوًا ... ويشربُ غيرُنا كَدِرًا وطينا» — الغرض","a":"الفخر","e":"لأن عمرو بن كلثوم يُثبت لقومه السَّبق والغلبة على الموارد، ويجعل لغيرهم الفضلة الكدرة. وفي البيت مقابلة بين الصفو والكَدَر تخدم الفخر.","d":["الرثاء","مدح","ثلاثة"]},{"q":"«في كل خَلقٍ خَلقَه مذمومةٌ ووراء كل محبَّبٍ مكروهُ» — اللون البديعي","a":"طباق","e":"لأنه جمع بين «محبَّب» و«مكروه» وهما ضدان. ولو نظرتَ إلى تقابل الجملتين كاملتين لصحّ أن تسميها مقابلة، والمدار على الخيارات.","d":["الفخر","صح","الرثاء"]},{"q":"«يقولون لي: قدِّمْ دماءَك في الوغى ... قلتُ: دعوني آكلُ العيشَ بالجُبن» — اللون البديعي","a":"جناس (أو تورية في «الجبن»)","e":"فلفظ «الجبن» يحتمل الطعام المعروف ويحتمل ضد الشجاعة، والمراد البعيد هو الثاني — وهذه تورية. ومن نظر إلى تشابه اللفظ مع «العيش» بمعنى الخبز عدّه جناسًا.","d":["بيان مقدار حال المشبَّه","تقديم اللقب على الاسم","ذكر الشيء بلفظ غيره لوقوعه في صحبته"]},{"q":"«هذا عسجدٌ أي ذهبٌ» — ما الغرض من «أي»؟","a":"التفسير","e":"لأن «أيْ» حرف تفسير يُؤتى به لبيان لفظ غامض بلفظ أوضح منه. و«عسجد» من الغريب، ففُسّر بـ«ذهب» وهو المألوف، وهذا يدفع عيب الغرابة.","d":["التمني","إغراء","ترصيع"]},{"q":"«نِعمَ العبادةُ الصلاةُ» — نوع الأسلوب","a":"مدح","e":"لأن «نِعم» فعل ماضٍ جامد وُضع لإنشاء المدح، و«الصلاة» هي المخصوص بالمدح. وهو من الإنشاء غير الطلبي لأنه لا يستدعي مطلوبًا.","d":["التعجب","الفخر","التمني"]},{"q":"«الأخلاقُ نهضةُ الأمم، فالأخلاقَ الأخلاقَ» — نوع الأسلوب","a":"إغراء","e":"لأنه كرّر اسمًا منصوبًا يدل على أمر محمود ليحثّ المخاطب على ملازمته. والناصب فعل محذوف وجوبًا تقديره «الزَمْ». ولو كان الأمر مكروهًا لكان تحذيرًا.","d":["مقابلة","الفخر","التقرير"]},{"q":"«وما ربك بظلّامٍ للعبيد» — نوع الأسلوب","a":"نفي مؤكَّد","e":"فالباء الزائدة في الخبر أكّدت النفي وقوّته، و«ظلّام» صيغة مبالغة نُفيت لتدل على انتفاء أصل الظلم من باب أولى. وهو خبر إنكاري لتعدد المؤكدات.","d":["تجاهل العارف","تعقيد معنوي","السجع في النثر"]},{"q":"«أعدلُ الناس إلا في معاملتي ... فيك الخصامُ وأنت الخصمُ والحكمُ» — اللون البياني","a":"تشبيه ضمني (مع المقابلة)","e":"فالشاعر لم يصرّح بأداة ولا بصورة تشبيه مباشرة، وإنما ألمح إلى حال الممدوح في بيت ثانٍ. وفي «الخصم والحكم» مقابلة تُبرز المفارقة.","d":["بيان مقدار حال المشبَّه","مراعاة نظير (ويصح: سجع)","ما حُذفت منه أداة التشبيه"]},{"q":"الحرف الناسخ «ليت» يفيد…","a":"التمني","e":"وهو طلب الأمر المحبوب الذي لا يُرجى وقوعه لاستحالته أو بُعده. ويقابله «لعلّ» للترجي وهو طلب المحبوب الممكن المتوقَّع.","d":["استدراج","إغراء","مكنية"]},{"q":"ما الفرق بين الترجي والتمني في الأداة والمعنى؟","a":"التمني بـ«ليت» لما لا يُرجى، والترجي بـ«لعلّ» و«عسى» لما يُرجى وقوعه","e":"فالفارق راجع إلى إمكان المطلوب: إن كان مستحيلًا أو بعيدًا فهو تمنٍّ، وإن كان ممكنًا متوقَّعًا فهو ترجٍّ. وقد تُستعمل «ليت» في الممكن لإظهار عزّته على المتكلم.","d":["لفظ له معنيان: قريب ظاهر غير مراد، وبعيد خفيّ هو المراد","علم يُعرف به وجوه تحسين الكلام بعد مطابقته لمقتضى الحال ووضوح دلالته","أن تتفق الكلمة الأخيرة من الفقرتين في الوزن والروي دون سائر الكلمات"]}],"r":[{"t":"الفصاحة والبلاغة وعيوبهما","b":"\n<p><b>الفصاحة</b> وصف للّفظ: خلوصه من التنافر وغرابة الاستعمال ومخالفة القياس الصرفي.\nو<b>البلاغة</b> وصف للكلام والمتكلم: <b>مطابقة الكلام لمقتضى الحال مع فصاحته</b>.</p>\n<p><b>ولهذا قيل:</b> كلُّ بليغ فصيح، وليس كل فصيح بليغًا — وهي عبارة <b>صحيحة</b>؛\nلأن البلاغة تشترط الفصاحة وتزيد عليها مراعاةَ مقتضى الحال، فهي أخصّ منها.</p>\n<p><b>عيوب فصاحة الكلمة:</b></p>\n<ul>\n<li><b>تنافر الحروف:</b> ثقل الكلمة على اللسان لتقارب مخارج حروفها — وشاهده المشهور\nبيتٌ فيه تكرار القاف والباء والراء متقاربةً حتى عَسُر النطق: «وقبرُ حربٍ بمكانٍ قفرِ…».</li>\n<li><b>الغرابة:</b> أن تكون الكلمة وحشية غير مألوفة يحتاج فهمها إلى معجم.</li>\n<li><b>مخالفة القياس الصرفي:</b> أن تأتي الكلمة على غير ما تقتضيه قواعد التصريف —\nوشاهده «الأجلَل» في قول الراجز، والقياس «الأجَلّ» بالإدغام.</li>\n</ul>\n<p><b>عيوب فصاحة الكلام:</b> تنافر الكلمات مجتمعة، وضعف التأليف، والتعقيد اللفظي (سوء ترتيب الكلمات)،\nو<b>التعقيد المعنوي</b> (خفاء الانتقال من المعنى الأول إلى المقصود) — وشاهده بيتٌ كنّى فيه الشاعر\nعن البكاء بـ«تسكب عيناي الدموع» وعن عدمه بـ«لتجمدا»، فخفيت اللوازم على السامع.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الفصاحة وصف للّفظ والمتكلم والكلام، والبلاغة وصف للكلام والمتكلم فقط</b> — فلا يُقال «لفظ بليغ». وهذا فرق يُسأل عنه كثيرًا.</li><li><b>عيوب الكلمة المفردة ثلاثة:</b> تنافر الحروف (الهُعخُع)، والغرابة (تكأكأتم)، ومخالفة القياس الصرفي (الأجلل بفكّ الإدغام في غير موضعه).</li><li><b>عيوب الكلام ستة:</b> تنافر الكلمات مجتمعة، وضعف التأليف، والتعقيد اللفظي، والتعقيد المعنوي، وكثرة التكرار، وتتابع الإضافات.</li><li><b>التعقيد اللفظي</b> خلل في ترتيب الألفاظ يُعمي المراد كالفصل بين المتلازمين، و<b>التعقيد المعنوي</b> خلل في الانتقال من المعنى الأول إلى المراد كاستعارة بعيدة.</li><li><b>كلّ بليغ فصيح وليس كل فصيح بليغًا</b>؛ لأن البلاغة تزيد على الفصاحة بمطابقة مقتضى الحال.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: دلائل الإعجاز وأسرار البلاغة للجرجاني، ومفتاح العلوم للسكاكي، والتلخيص والإيضاح للقزويني.</p></div>"},{"t":"علوم البلاغة الثلاثة — حدودها","b":"\n<ul>\n<li><b>علم المعاني:</b> علم يُعرف به أحوال اللفظ العربي التي بها يطابق مقتضى الحال.\nمباحثه: الخبر والإنشاء، والقصر، والفصل والوصل، والإيجاز والإطناب والمساواة، والتقديم والتأخير،\nوالذكر والحذف، والتعريف والتنكير.</li>\n<li><b>علم البيان:</b> علم يُعرف به إيراد المعنى الواحد بطرق مختلفة في وضوح الدلالة عليه.\nمباحثه: التشبيه، والمجاز (المرسل والعقلي)، والاستعارة، والكناية.</li>\n<li><b>علم البديع:</b> علم يُعرف به وجوه تحسين الكلام بعد رعاية مطابقته لمقتضى الحال ووضوح دلالته.\nمباحثه: المحسنات المعنوية واللفظية.</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>المعاني</b> يبحث في مطابقة الكلام لمقتضى الحال، و<b>البيان</b> في إيراد المعنى الواحد بطرق مختلفة في وضوح الدلالة، و<b>البديع</b> في وجوه تحسين الكلام بعد رعاية المطابقة والوضوح.</li><li><b>أبواب المعاني ثمانية:</b> الخبر والإنشاء، وأحوال المسند إليه، وأحوال المسند، وأحوال متعلقات الفعل، والقصر، والفصل والوصل، والإيجاز والإطناب والمساواة.</li><li><b>أبواب البيان أربعة:</b> التشبيه، والمجاز (المرسل والعقلي)، والاستعارة، والكناية. وبعضهم يجعل الاستعارة قسمًا من المجاز اللغوي فتصير ثلاثة.</li><li><b>تسمية «البديع»</b> لأنه لم يُعرف قبل وضعه؛ وأول من أفرده بالتأليف ابن المعتز في كتابه، ثم توسّع فيه المتأخرون حتى عدّوا أبوابه بالعشرات.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: مفتاح العلوم، والتلخيص والإيضاح، والبديع لابن المعتز، والصناعتين لأبي هلال.</p></div>"},{"t":"الخبر والإنشاء وأغراضهما","b":"\n<p><b>الخبر</b> ما يحتمل الصدق والكذب لذاته. و<b>أضربه ثلاثة</b> بحسب حال المخاطب:</p>\n<ol>\n<li><b>ابتدائي:</b> للخالي الذهن، فيُلقى بلا مؤكدات.</li>\n<li><b>طلبي:</b> للمتردد، فيُؤكَّد بمؤكد واحد.</li>\n<li><b>إنكاري:</b> للمنكر، فيُؤكَّد بمؤكدين فأكثر.</li>\n</ol>\n<p><b>أغراض الخبر البلاغية</b> التي يخرج إليها عن أصله: الفخر، والمدح، والتحسّر، والاسترحام،\nوإظهار الضعف، والتوبيخ، والتهديد، والحثّ على السعي.</p>\n<p><b>الإنشاء</b> ما لا يحتمل الصدق والكذب، وهو طلبي وغير طلبي.\n<b>الطلبي خمسة:</b> الأمر، والنهي، والاستفهام، والتمني، والنداء.\nو<b>غير الطلبي:</b> التعجب، والمدح والذم، والقسم، وأفعال الرجاء، وصيغ العقود.</p>\n<p><b>الأغراض البلاغية للأساليب الإنشائية:</b></p>\n<ul>\n<li><b>الأمر</b> يخرج إلى: الدعاء، والالتماس، والنصح، والإباحة، والتمني، والتعجيز،\nو<b>التهديد</b> — كما في أمرٍ قرآني سِيق مساق الوعيد لا الإذن.</li>\n<li><b>النهي</b> يخرج إلى: الدعاء، والالتماس، والتحقير، واليأس، والتهديد.</li>\n<li><b>الاستفهام</b> يخرج إلى: التقرير، والنفي، والإنكار، والتعجب، والتمني، والتشويق، والتهويل.\nو<b>التقرير</b> هو حمل المخاطب على الإقرار بأمر مستقر عنده، وعلامته أن يكون الجواب بالإثبات\nكما في «أليس الله بكافٍ عبده؟».</li>\n<li><b>النداء</b> يخرج إلى: التعجب، والتحسّر والأسى، والتحقير، والزجر، والتعظيم، والاستغاثة.</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>حدّ الخبر</b> ما يحتمل الصدق والكذب لذاته، و<b>الإنشاء</b> ما لا يحتملهما. وقيد «لذاته» ليخرج خبر الله ورسوله فإنه صدق قطعًا لا لذات اللفظ بل للمخبِر.</li><li><b>أضرب الخبر ثلاثة</b> بحسب حال المخاطب: ابتدائي (خالي الذهن فلا يُؤكَّد)، وطلبي (متردّد فيُؤكَّد بمؤكّد واحد)، وإنكاري (منكِر فيُؤكَّد بأكثر). وإخراج الكلام على خلاف مقتضى الظاهر باب واسع.</li><li><b>الإنشاء قسمان:</b> طلبي (أمر، نهي، استفهام، تمنٍّ، نداء) وغير طلبي (التعجّب، المدح والذمّ، القسم، الرجاء، صيغ العقود).</li><li><b>فائدة الخبر ولازم فائدته:</b> فائدة الخبر إفادة المخاطب الحكم، ولازمها إفادته أن المتكلم عالم به. و﴿قالت إني وضعتُها أنثى﴾ خرج إلى لازم الفائدة والتحسّر.</li><li><b>خروج الأساليب عن أصلها</b> هو لبّ أسئلة البلاغة: الأمر للدعاء أو التهديد أو التعجيز أو الإباحة، والاستفهام للنفي أو التقرير أو التعجّب أو التوبيخ، والنداء للتحسّر أو الإغراء.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: دلائل الإعجاز، ومفتاح العلوم، والإيضاح للقزويني، وعلم المعاني وتطبيقاته.</p></div>"},{"t":"القصر وطرقه","b":"\n<p><b>القصر</b> تخصيص شيء بشيء بطريق مخصوص، أي جعل أمرٍ مقصورًا على آخر.</p>\n<p><b>طرقه أربعة:</b> النفي والاستثناء، و«إنّما»، والعطف بـ«لا» و«بل» و«لكن»،\nوتقديم ما حقه التأخير.</p>\n<p><b>أقسامه باعتبار حال المخاطب ثلاثة:</b></p>\n<ul>\n<li><b>قصر إفراد:</b> إذا اعتقد المخاطب الشِّركة، فتردّ عليه بقصر الصفة على موصوف واحد.\nومثاله في التنزيل نفيُ الألوهية عن غير الله مع إثباتها له وحده — «لا إله إلا أنا».</li>\n<li><b>قصر قلب:</b> إذا اعتقد المخاطب العكس، فتقلب عليه حكمه.</li>\n<li><b>قصر تعيين:</b> إذا تردّد المخاطب بين أمرين فتعيّن له أحدهما.</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>حدّ القصر:</b> تخصيص أمر بآخر بطريق مخصوص. وطرقه المشهورة أربعة: النفي والاستثناء، و«إنما»، والعطف بـ«لا» و«بل» و«لكن»، وتقديم ما حقه التأخير.</li><li><b>الفرق بين النفي والاستثناء و«إنما»:</b> الأول يُستعمل مع المنكِر لأن فيه تأكيدًا، والثاني مع من لا ينكر لأنه يدّعي وضوح الأمر حتى كأن المخاطب لا ينكره.</li><li><b>قصر الصفة على الموصوف وقصر الموصوف على الصفة:</b> «ما شاعرٌ إلا محمد» قصر صفة على موصوف، و«ما محمد إلا شاعر» قصر موصوف على صفة. وتمييزهما مدار كثير من الأسئلة.</li><li><b>القصر حقيقي وإضافي</b>، والإضافي ثلاثة: قصر إفراد (لمن اعتقد الشركة)، وقصر قلب (لمن اعتقد العكس)، وقصر تعيين (لمن تردّد).</li><li><b>تقديم المعمول يفيد القصر:</b> ﴿إياك نعبد وإياك نستعين﴾ — وجه الاستشهاد: تقديم المفعول «إياك» على عامله أفاد قصر العبادة عليه سبحانه.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: دلائل الإعجاز، ومفتاح العلوم، والإيضاح، والتلخيص.</p></div>"},{"t":"الإيجاز والإطناب والمساواة","b":"\n<p><b>المساواة</b> أن يكون اللفظ بقدر المعنى لا يزيد ولا ينقص.</p>\n<p><b>الإيجاز</b> نوعان: <b>إيجاز قِصَر</b> (تكثيف المعنى في لفظ قليل بلا حذف)،\nو<b>إيجاز حذف</b> (حذف كلمة أو جملة يدل عليها السياق).</p>\n<p><b>الإطناب</b> زيادة اللفظ على المعنى لفائدة، ومن أنواعه:</p>\n<ul>\n<li><b>ذكر الخاص بعد العام:</b> تنبيهًا على فضل الخاص.</li>\n<li><b>ذكر العام بعد الخاص:</b> إفادةً للشمول بعد الاهتمام بالخاص —\nكدعاء الاستغفار الذي بدأ بالنفس والوالدين ومَن دخل البيت ثم عمّ المؤمنين والمؤمنات.</li>\n<li><b>الإيضاح بعد الإبهام</b>، و<b>التكرار</b>، و<b>الاعتراض</b>، و<b>التذييل</b>، و<b>الاحتراس</b>.</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الإيجاز نوعان:</b> إيجاز قِصَر (تضمين معانٍ كثيرة في ألفاظ قليلة بلا حذف) كقوله ﴿ولكم في القصاص حياة﴾، وإيجاز حذف (بحذف كلمة أو جملة يدلّ عليها دليل).</li><li><b>الإطناب ليس حشوًا</b>؛ فالإطناب زيادة لفائدة، والحشو والتطويل زيادة لغير فائدة. والفرق بين الحشو والتطويل: الحشو يتعيّن الزائد فيه، والتطويل لا يتعيّن.</li><li><b>من أبواب الإطناب:</b> ذكر الخاص بعد العام، وذكر العام بعد الخاص، والإيضاح بعد الإبهام، والتكرار، والاعتراض، والتذييل، والتتميم، والاحتراس.</li><li><b>الاحتراس</b> أن يأتي بما يدفع توهّمًا: «فسقى ديارَكِ غيرَ مُفسِدها / صوبُ الربيعِ» — وجه الاستشهاد: «غير مفسدها» احتراس دفع توهّم أن السقيا تُفسد.</li><li><b>المساواة</b> أن يكون اللفظ بقدر المعنى لا يزيد ولا ينقص، وهي الأصل الذي يُقاس عليه الطرفان.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: أسرار البلاغة، والإيضاح للقزويني، والصناعتين، وعلم المعاني.</p></div>"},{"t":"التشبيه: أركانه وأنواعه وأغراضه","b":"\n<p><b>أركان التشبيه أربعة:</b> المشبَّه، والمشبَّه به (وهما طرفاه)، وأداة التشبيه، ووجه الشبه.</p>\n<p><b>أنواعه باعتبار ذكر الأداة ووجه الشبه:</b></p>\n<table><tr><th>النوع</th><th>الأداة</th><th>وجه الشبه</th></tr>\n<tr><td><b>مُرسَل</b></td><td>مذكورة</td><td>—</td></tr>\n<tr><td><b>مؤكَّد</b></td><td><b>محذوفة</b></td><td>—</td></tr>\n<tr><td><b>مُجمَل</b></td><td>—</td><td><b>محذوف</b></td></tr>\n<tr><td><b>مُفصَّل</b></td><td>—</td><td>مذكور</td></tr>\n<tr><td><b>بليغ</b></td><td><b>محذوفة</b></td><td><b>محذوف</b></td></tr>\n</table>\n<p>فالتشبيه الذي اجتمعت فيه الأركان كلها هو <b>المرسل المفصَّل</b>، والذي حُذفت أداته هو <b>المؤكَّد</b>،\nوالذي حُذفت أداته ووجهه معًا هو <b>البليغ</b> وهو أعلى مراتب التشبيه لإيهامه اتحاد الطرفين.</p>\n<p><b>أنواع خاصة:</b></p>\n<ul>\n<li><b>التشبيه التمثيلي:</b> وجه الشبه فيه <b>صورة منتزعة من متعدد</b>، أي هيئة مركبة لا وصف مفرد.\nمثاله: تشبيه الكلمة الطيبة التي لا تنمو في النفس المريضة بالنخلة التي لا تنبت في الأرض السَّبِخة —\nفالوجه هيئة مركبة من ممتنعٍ ومحلٍّ غير قابل.</li>\n<li><b>التشبيه الضمني:</b> لا يوضع فيه المشبه والمشبه به في صورة التشبيه الصريح، بل يُلمحان من المعنى،\nويأتي غالبًا لإثبات أن الحكم ممكن. مثاله بيتُ المتنبي في أن فساد الحاسة يُفسد إدراك الطيب:\nفمن مرِض فمُه وجد الماء العذب مرًّا.</li>\n<li><b>التشبيه المقلوب:</b> أن يُجعل المشبه مشبهًا به ادّعاءً لأنه أقوى في وجه الشبه.</li>\n</ul>\n<p><b>أغراض التشبيه:</b> بيان حال المشبَّه، وبيان مقدار حاله، وتقرير حاله في النفس، وتزيينه أو تقبيحه،\nوبيان إمكانه. فإذا قيل «ثوبُ أحمدَ أبيضُ كاللبن» فالغرض <b>بيان مقدار حال المشبَّه</b>،\nلأن البياض ثابت معلوم، وإنما جاء التشبيه ليحدّد درجته ومقداره.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الأركان أربعة:</b> المشبَّه والمشبَّه به (طرفاه)، وأداة التشبيه، ووجه الشبه. والركنان الأساسيان هما الطرفان، وما عداهما قد يُحذف.</li><li><b>التشبيه البليغ</b> ما حُذفت منه الأداة ووجه الشبه، وهو أعلى مراتب التشبيه لادّعاء أن المشبه عين المشبه به. ويأتي كثيرًا على صورة «مبتدأ وخبر» أو «مفعول مطلق» أو «إضافة».</li><li><b>التشبيه التمثيلي</b> ما كان وجه الشبه فيه منتزعًا من متعدّد؛ ﴿مثلُ الذين حُمِّلوا التوراةَ ثم لم يحملوها كمثلِ الحمارِ يحملُ أسفارًا﴾ — وجه الاستشهاد: الهيئة المنتزعة من حمل شيء نفيس دون الانتفاع به.</li><li><b>التشبيه الضمني</b> لا يُوضع فيه المشبه والمشبه به في صورة التشبيه الصريح، بل يُلمحان؛ وهو يفيد أن الحكم ممكن لا دعوى مجرّدة.</li><li><b>التشبيه المقلوب</b> أن يُجعل المشبه مشبهًا به ادّعاءً لأنه أتمّ في وجه الشبه؛ وهو من بديع الصنعة.</li><li><b>أغراض التشبيه</b> ترجع إلى: بيان الحال، أو بيان مقدار الحال، أو بيان إمكان الحال، أو تقرير حال المشبه، أو تزيينه أو تقبيحه.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: أسرار البلاغة للجرجاني، ومفتاح العلوم، والإيضاح، والصناعتين.</p></div>"},{"t":"المجاز المرسل والمجاز العقلي","b":"\n<p><b>المجاز المرسل</b> لفظ استُعمل في غير ما وُضع له لعلاقة <b>غير المشابهة</b> مع قرينة مانعة من إرادة\nالمعنى الأصلي. وعلاقاته:</p>\n<ul>\n<li><b>الجزئية:</b> ذكر الجزء وإرادة الكل — كذكر «الأصابع» وإرادة الأنامل أو أطرافها.</li>\n<li><b>الكلية:</b> ذكر الكل وإرادة الجزء.</li>\n<li><b>السببية</b> و<b>المسببية</b>.</li>\n<li><b>المحلية:</b> ذكر المحل وإرادة الحالّ فيه — كذكر مكانٍ وإرادة أهله.</li>\n<li><b>الحالّية:</b> ذكر الحالّ وإرادة المحل.</li>\n<li><b>اعتبار ما كان:</b> تسمية الشيء باسم ما كان عليه.</li>\n<li><b>اعتبار ما سيكون:</b> تسمية الشيء باسم ما سيؤول إليه — ومنه قول يوسف عليه السلام\nإنه يعصر خمرًا، والمعصور عنبٌ سيصير خمرًا.</li>\n</ul>\n<p><b>المجاز العقلي</b> إسناد الفعل أو ما في معناه إلى غير صاحبه الحقيقي لعلاقة مع قرينة.\nوعلاقاته: الفاعلية، والمفعولية، والزمانية، والمكانية، والمصدرية، والسببية.\nومن أشهر شواهده وصفُ المذموم بأنه «الطاعم الكاسي» — أي المَطعوم المَكسوّ،\nفأُسند اسم الفاعل إلى من هو مفعول في المعنى، فالعلاقة <b>المفعولية</b>.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الفرق الجوهري:</b> المجاز المرسل مجاز في <b>الكلمة</b> علاقته غير المشابهة، والمجاز العقلي مجاز في <b>الإسناد</b> لا في الكلمة؛ فألفاظه كلّها حقيقة والتجوّز في نسبة الفعل.</li><li><b>علاقات المجاز المرسل المشهورة:</b> الجزئية، والكلّية، والسببية، والمسبّبية، واعتبار ما كان، واعتبار ما سيكون، والمحلّية، والحالّية، والآلية.</li><li><b>تنبيه مهم على الكلّية:</b> في ﴿يجعلون أصابعهم في آذانهم﴾ ذُكر الكلّ «أصابعهم» وأُريد الجزء «الأنامل»، فالعلاقة <b>كلّية</b> لا جزئية. وكثير من الملخّصات تقلبها، فانتبه.</li><li><b>المجاز العقلي علاقاته:</b> الإسناد إلى الزمان ﴿فما ربحت تجارتهم﴾، أو المكان، أو السبب، أو المصدر، أو الآلة. وقرينته دائمًا <b>حالية أو عقلية</b> لا لفظية.</li><li><b>الحقيقة العقلية</b> إسناد الفعل إلى ما هو له عند المتكلم في الظاهر؛ وبها يُعرف ضدّها.</li></ol><p class=\"src\">مظانّ المس
