 يجعل الاستقرائية والقياسية شيئًا واحدًا؛ فهما متعاكستان في الاتجاه.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الموجّه الفنّي لمدرّسي اللغة العربية لعبد العليم إبراهيم، وطرق تدريس اللغة العربية.</p></div>"},{"t":"الطريقة القياسية","b":"\n<p>تسير من <b>الكلي إلى الجزئي</b>، ومن الحكم على الكل إلى الحكم على الجزء.\nيبدأ المعلم بعرض القاعدة مباشرةً، ثم يسوق الأمثلة التي تنطبق عليها، ثم يطلب التطبيق.</p>\n<p><b>مزاياها:</b> سريعة لا تحتاج وقتًا كبيرًا، ولا تتطلب جهدًا كبيرًا من المعلم ولا من المتعلم،\nومناسبة للقواعد المجردة والفصول كثيرة العدد.</p>\n<p><b>عيوبها:</b> تُلغي دور المتعلم في المشاركة الفعّالة وتجعله مجرد أداة للحفظ،\nوتخالف قوانين التعلم التي تقتضي التدرج من <b>الأسهل إلى الأصعب</b> لأنها تبدأ بالمجرد الصعب\n(القاعدة) ثم تنزل إلى المحسوس السهل (المثال).</p>\n<p><b>والمعلم فيها هو المحور</b>، بخلاف الاستقرائية التي محورها المتعلم — وهذا هو أهم فارق بينهما.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>مسارها من الكلّي إلى الجزئي:</b> عرض القاعدة ← شرحها بأمثلة ← التطبيق. وهي أقدم الطرق وأسرعها وأقلّها جهدًا على المعلم.</li><li><b>عيبها الأكبر</b> أنها تبدأ بالمجرّد وتجعل المتعلم متلقّيًا سلبيًّا، فتؤدّي إلى حفظ بلا فهم. ولهذا لا يُنصح بها إلا في المراحل المتقدمة أو عند ضيق الوقت.</li><li><b>متى تصلح؟</b> حين تكون القاعدة بسيطة واضحة لا تحتمل استنباطًا، أو حين تكون مراجعة لما سبق تعلّمه، أو مع الكبار الذين تنمو لديهم القدرة على التجريد.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الموجّه الفنّي، وطرق تدريس اللغة العربية، وأساليب تدريس اللغة العربية.</p></div>"},{"t":"طريقة الأساليب المتصلة (النص المعدَّلة)","b":"\n<p>تقوم على اختيار <b>نص متصل المعنى متكامل الموضوع</b> يُستخرج منه الشواهد النحوية،\nبدل الأمثلة المتفرقة غير المترابطة.</p>\n<p><b>وجه شبهها بالاستقرائية:</b> كلتاهما تنتقل من الأمثلة إلى القاعدة.\n<b>ووجه الفرق:</b> أن نصوص هذه الطريقة <b>مترابطة متماسكة تؤدي معنًى كاملًا</b>،\nبينما أمثلة الاستقرائية متفرقة لا رابط بينها.</p>\n<p><b>مزاياها:</b> تمزج القاعدة بالتعبير الصحيح فترسّخ اللغة، وتربط اللغة بالحياة اليومية،\nوتزيد تمرّس المتعلم بالمعاني لكثرة ما يتدرب عليه من سياقات.</p>\n<p><b>عيوبها:</b> صعوبة الحصول على نص متكامل المعنى يحوي كل الشواهد المطلوبة،\nوميل النصوص المصنوعة لهذا الغرض إلى <b>التكلّف والاصطناع</b>.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>فكرتها</b> تدريس القواعد من خلال نصّ متكامل مترابط المعنى بدل الأمثلة المبتورة؛ فتجمع بين تعليم القاعدة وتذوّق النص.</li><li><b>سُمّيت «المعدَّلة»</b> لأنها تعديل للطريقة الاستقرائية بإبدال الأمثلة المتفرّقة بنصّ واحد، وهي أقرب الطرق إلى مبدأ «تكامل فروع اللغة».</li><li><b>شروط النص:</b> أن يكون سهلًا مشوّقًا مرتبطًا بميول الطلاب، وأن تتكرّر فيه الظاهرة النحوية تكرارًا كافيًا، وألّا يُثقل بالصعوبات اللغوية.</li><li><b>عيبها</b> صعوبة إيجاد نصّ تتوافر فيه كل شواهد القاعدة من غير تكلّف.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الموجّه الفنّي لعبد العليم إبراهيم، وتدريس فنون اللغة العربية لعلي مدكور.</p></div>"},{"t":"طريقة الحوار والمناقشة","b":"\n<p>هي أساس معظم طرق التدريس الحديثة، لأنها تقوم على <b>التفاعل والاتصال اللغوي داخل الصف</b>،\nسواء بإجابات التلاميذ أو باستفساراتهم فيما بينهم أو مع معلمهم.</p>\n<p><b>مزاياها:</b> تخلق جوًّا من الحرية والمشاركة، وتعوّد المتعلم على احترام الرأي والرأي الآخر،\nوتنمّي مهارة التحليل وتحديد مواضع الاتفاق والاختلاف، وتدرّبه على مواجهة الجمهور.</p>\n<p><b>نوعاها:</b></p>\n<ul>\n<li><b>المناقشة الحرة:</b> يُترك فيها مجال القول مفتوحًا، ويُتوصَّل من خلالها إلى أهداف جديدة مبتكرة.</li>\n<li><b>المناقشة المضبوطة (الموجَّهة):</b> يوجّه فيها المعلم النقاش نحو قضية محددة سلفًا.</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>أصلها سقراطي</b> (التوليد)، وتقوم على إثارة التفكير بالأسئلة المتتابعة حتى يصل المتعلم إلى المعرفة بنفسه.</li><li><b>شروط نجاحها:</b> تحديد الموضوع مسبقًا، وإعداد الأسئلة، وتوزيع المشاركة، وضبط الوقت، وتلخيص ما انتهى إليه النقاش.</li><li><b>من عيوبها</b> أنها قد تستغرق وقتًا طويلًا، وقد يسيطر عليها عدد قليل من الطلاب، وقد تخرج عن الموضوع إن لم يُحسن المعلم إدارتها.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: طرق تدريس اللغة العربية، وأساليب تدريس اللغة العربية، والتدريس الفعّال.</p></div>"},{"t":"طريقة التسميع والحفظ","b":"\n<p>تعتمد على إتقان المتعلم لحفظ موضوع معين، ويُلقَّن من خلالها حفظ القصائد والآيات\nوالقواعد والقوانين.</p>\n<p><b>غايتها الرئيسة:</b> قياس قدرة التلاميذ على تحصيل المادة والحكم عليهم بأسلوب التسميع.\nوفيها تعويدٌ للطالب على مواجهة الآخرين.</p>\n<p><b>موضعها الصحيح:</b> هي طريقة مساعدة لا أصلية؛ تصلح لما يُراد تثبيته نصًّا\nكالمحفوظات والشواهد، ولا تصلح أساسًا لتدريس القواعد لأنها لا تنمّي الفهم ولا التطبيق.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>مجالها الأنسب</b> النصوص الأدبية والقرآن والشعر والمحفوظات، لا القواعد ولا التعبير.</li><li><b>أسلوبان في الحفظ:</b> الحفظ الكلّي (قراءة النص كاملًا مرارًا) والحفظ الجزئي (تقسيمه إلى وحدات). والأفضل للنصوص الطويلة الأسلوب الجزئي أو المزيج بينهما.</li><li><b>شرط الحفظ المثمر</b> أن يسبقه الفهم؛ فالحفظ بلا فهم سريع الزوال، وقد نبّه التربويون على أن التسميع الآليّ من أضعف أنماط التعلّم.</li><li><b>التسميع الفوري والمؤجّل:</b> الفوري يثبّت، والمؤجّل يكشف بقاء الأثر. والجمع بينهما أنفع.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الموجّه الفنّي، وعلم النفس التربوي، وطرق تدريس اللغة العربية.</p></div>"},{"t":"أساليب الأسئلة الصفّية وتنمية التفكير","b":"\n<p>ليست الأسئلة سواءً في قيمتها التربوية:</p>\n<ul>\n<li><b>الأسئلة المغلقة</b> (هل؟ / ما جوابها نعم أو لا) تقيس الاستدعاء وحده ولا تنمّي التفكير.</li>\n<li><b>أسئلة التذكر</b> (متى؟ أين؟ مَن؟) تقف عند المستوى الأدنى من مستويات المعرفة.</li>\n<li><b>الأسئلة المفتوحة التحليلية</b> (<b>لماذا؟ وكيف؟</b>) هي التي تنمّي التفكير،\nلأنها تطالب المتعلم بالتعليل وبيان الكيفية، فتنقله من الحفظ إلى الفهم والتحليل.</li>\n</ul>\n<p><b>تنمية الثروة اللغوية:</b> أنجع وسيلة لتثبيت المترادفات هي <b>وضع الكلمة في سياقات متنوعة</b>،\nلأن المعنى يتحدد بالسياق، فيدرك المتعلم الفروق الدقيقة بين المترادفات التي لا يدركها بالحفظ المجرد.</p>\n<p><b>تحسين الخط:</b> الأنجع فيه <b>المِران وتقليد النماذج الجيدة</b> معًا؛\nفالمران وحده بلا نموذج يثبّت الخطأ، والنموذج بلا مران لا يُكسب مهارة.\nوليس الخط موهبة فطرية لا تُكتسب.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>مستويات بلوم المعرفية الستة:</b> التذكّر، الفهم، التطبيق، التحليل، التركيب، التقويم. وفي التصنيف المحدّث: التذكّر، الفهم، التطبيق، التحليل، التقويم، الابتكار.</li><li><b>الأسئلة السابرة</b> أسئلة متابعة تُوجَّه بعد إجابة الطالب لتعميق تفكيره (التوضيح، التبرير، إعادة التوجيه، الاستفسار).</li><li><b>زمن الانتظار</b> بعد طرح السؤال لا يقلّ عن ثلاث ثوانٍ؛ وقد أثبتت الدراسات أن إطالته تزيد طول الإجابات وجودتها ومشاركة الطلاب.</li><li><b>عيوب الأسئلة الشائعة:</b> السؤال المركّب، والسؤال الموحي بالإجابة، والسؤال الغامض، وتوجيه السؤال لطالب بعينه قبل طرحه على الصف.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: تصنيف بلوم للأهداف التربوية، والقياس والتقويم التربوي، والتدريس الفعّال.</p></div>"},{"t":"التعبير: الوظيفي والإبداعي","b":"\n<p><b>التعبير الوظيفي:</b> ما يؤدي وظيفة عملية في الحياة، ولغته مباشرة محددة.\nومن موضوعاته: التقرير، والرسالة، والإعلان، واللافتة، والبرقية، والتلخيص، والتعليق،\nوالمحضر، وطلب التوظّف، والمناقشة، والمقابلة.</p>\n<p><b>التعبير الإبداعي:</b> ما يُعبَّر به عن المشاعر والأخيلة، ولغته موحية. ومن موضوعاته:\n<b>كتابة القصة</b>، والخاطرة، والمسرحية، ووصف المشاهد.</p>\n<p><b>شروط جودة الكتابة الإبداعية:</b> حُسن الصياغة، وجودة الأسلوب، وسُموّ المعنى —\nوهي مجتمعة لا مفترقة؛ فلا يكفي أحدها وحده.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الوظيفي</b> ما يؤدّي غرضًا عمليًّا في الحياة (الرسائل، التلخيص، المحاضر، الإعلانات، السيرة الذاتية، البرقيات)، و<b>الإبداعي</b> ما يعبّر عن المشاعر والأفكار بأسلوب أدبي (القصة، الخاطرة، الوصف، المقال الأدبي).</li><li><b>التعبير الشفوي يسبق الكتابي</b> في الترتيب التعليمي؛ لأن الطفل يتكلّم قبل أن يكتب، ولأن الشفوي يحرّر الفكرة قبل تقييدها.</li><li><b>أخطاء شائعة في تدريسه:</b> ترك الموضوع بلا تخطيط، وإهمال التصحيح، واختيار موضوعات بعيدة عن خبرة الطالب، والاقتصار على التصحيح اللغوي دون الفكرة.</li><li><b>التصحيح الأمثل</b> أن يكون انتقائيًّا مركّزًا على أخطاء محدّدة، مصحوبًا بتعليق بنّاء، لا شطبًا شاملًا يُحبط المتعلم.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الموجّه الفنّي، وتدريس فنون اللغة العربية، وطرق تدريس التعبير.</p></div>"},{"t":"مهارات اللغة الأربع وترتيب تعليمها","b":"\n<p>مهارات اللغة أربع، تنقسم إلى مهارات استقبال ومهارات إنتاج:</p>\n<ul>\n<li><b>الاستماع</b> (استقبال شفوي) — وهو أول ما يكتسبه الطفل.</li>\n<li><b>التحدث</b> (إنتاج شفوي).</li>\n<li><b>القراءة</b> (استقبال كتابي).</li>\n<li><b>الكتابة</b> (إنتاج كتابي) — وهي آخرها وأصعبها.</li>\n</ul>\n<p>والترتيب الطبيعي في الاكتساب: استماع ← تحدث ← قراءة ← كتابة.\nوتُبنى مناهج تعليم اللغة الحديثة على هذا التدرج وعلى <b>التكامل</b> بين المهارات\nلا على فصلها فروعًا منعزلة.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الترتيب الطبيعي:</b> استماع ← تحدّث ← قراءة ← كتابة. والأوّلان مهارتا الاتصال الشفوي، والأخيران مهارتا الاتصال الكتابي.</li><li><b>تصنيف آخر:</b> الاستماع والقراءة مهارتان <b>استقباليتان</b>، والتحدّث والكتابة مهارتان <b>إنتاجيتان</b>. وهذا التقسيم أكثر دقة في القياس.</li><li><b>الاستماع غير السماع:</b> السماع عملية فسيولوجية، والاستماع عملية إرادية فيها انتباه وفهم وتفسير، والإنصات أعلى درجاتها.</li><li><b>مهارات القراءة ثلاث مراتب:</b> القراءة الآلية (فكّ الرموز)، وقراءة الفهم، وقراءة النقد والتذوّق. والقراءة الصامتة أسرع وأكثر فهمًا من الجهرية في المراحل المتقدمة.</li><li><b>مبدأ التكامل</b> بين الفروع: لا تُدرَّس القواعد بمعزل عن النصوص ولا الإملاء بمعزل عن التعبير؛ وهو الأساس النظري لطريقة «الأساليب المتصلة».</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الموجّه الفنّي لعبد العليم إبراهيم، وتدريس فنون اللغة العربية، والمهارات اللغوية.</p></div>"}]},{"c":"mnsa","n":"من المنصة","q":[{"q":"ما المفاعيل الخمسة التي يُبنى عليها باب المنصوبات؟","a":"المفعول به، والمفعول المطلق، والمفعول لأجله، والمفعول معه، والمفعول فيه (الظرف)","e":"سُمّيت خمسةً لأن المفعول وقع عليه الفعل بوجوهٍ خمسة: وقوعًا مباشرًا (به)، وتأكيدًا للحدث نفسه (المطلق)، وبيانًا للباعث (لأجله)، ومصاحبةً (معه)، وزمانًا أو مكانًا (فيه). والنائب عن المفعول المطلق ليس سادسًا، وإنما هو قائم مقام أحدها.","d":["لضعف الدولة الإسلامية وسقوط المدن الكبرى تباعًا في يد الإسبان","كتاب نثري أندلسي في تحليل عاطفة الحبّ وأحواله، لابن حزم الأندلسي","أن يكون مصدرًا قلبيًّا، مشاركًا للفعل في الزمان والفاعل، وعلّةً له"]},{"q":"«سجدتُ سجدتين» — ما نوع المفعول المطلق هنا؟","a":"مفعول مطلق مبيّن للعدد","e":"المفعول المطلق ثلاثة أنواع: مؤكّد للفعل إذا جاء مجرّدًا «سجدتُ سجودًا»، ومبيّن للنوع إذا وُصف أو أُضيف «سجودَ الخاشعين»، ومبيّن للعدد إذا دلّ على عدد مرّات الحدث؛ و«سجدتين» مثنّى يدلّ على مرّتين فهو بيانٌ للعدد.","d":["لأنه مفعول معه، والواو واو المعية بمعنى «مع»","لأنه شبيه بالمضاف، إذ عمل فيما بعده","ابن خفاجة، لكثرة وصفه الجنان والرياض والطبيعة"]},{"q":"«نمتُ كثيرًا» — ما إعراب «كثيرًا»؟","a":"نائب عن المفعول المطلق منصوب، لأنه صفة المصدر المحذوف","e":"الأصل «نمتُ نومًا كثيرًا»، فحُذف المصدر وأُقيمت صفته مقامه. وينوب عن المفعول المطلق أيضًا: «كلّ» و«بعض» مضافتين إليه، وعدده، وآلته، واسم الإشارة إليه، ومرادفه.","d":["الحال نكرة منصوبة مشتقّة، وصاحبها معرفة في الأصل","تمييز ملحوظ منصوب، لأنه يرفع إبهام النسبة بعد اسم التفضيل","فاعل مرفوع، و«إلّا» أداة حصر لا عمل لها"]},{"q":"ما شرط نصب الاسم على أنه مفعول لأجله؟","a":"أن يكون مصدرًا قلبيًّا، مشاركًا للفعل في الزمان والفاعل، وعلّةً له","e":"فإن اختلّ شرط جُرّ باللام: «جئتُ للقراءة» لأن القراءة ليست مصدرًا قلبيًّا. والمصدر القلبي ما كان من أفعال النفس الباطنة كالرغبة والخوف والطمع والإجلال.","d":["بديع الزمان الهمذاني؛ وخصائصها قصة قصيرة ببطل وهمّ وراوٍ، بأسلوب مسجوع مملوء بالمحسنات","وحدته التفعيلة لا البيت؛ وتُنازَع الريادة بين نازك الملائكة وبدر شاكر السيّاب","كتاب نثري أندلسي في تحليل عاطفة الحبّ وأحواله، لابن حزم الأندلسي"]},{"q":"«سرتُ والنيلَ» — لماذا نُصب «النيل»؟","a":"لأنه مفعول معه، والواو واو المعية بمعنى «مع»","e":"ضابط المفعول معه أن يصحّ وضع «مع» موضع الواو ولا يصحّ عطفه على ما قبله لفساد المعنى؛ فالنيل لا يسير. ولو صحّ الاشتراك في الفعل جاز العطف والنصب جميعًا.","d":["المضاف، والشبيه بالمضاف، والنكرة غير المقصودة","لأنه شبيه بالمضاف، إذ عمل فيما بعده","مفعول مطلق مبيّن للعدد"]},{"q":"ما شرط الحال وصاحبها؟","a":"الحال نكرة منصوبة مشتقّة، وصاحبها معرفة في الأصل","e":"هذا هو الأصل، وقد تأتي الحال جامدة مؤوّلة بمشتق «كرّ عليه أسدًا» أي شجاعًا، وقد يأتي صاحبها نكرة بمسوّغ كالوصف أو التقدّم أو النفي: ﴿وما أهلكنا من قريةٍ إلا ولها كتابٌ معلوم﴾.","d":["إذا سُبقتا بـ«ما» المصدرية، فما بعدهما مفعول به منصوب","نائب عن المفعول المطلق منصوب، لأنه صفة المصدر المحذوف","ما بعدهما مضاف إليه مجرور دائمًا، وهما يُعربان إعراب المستثنى بـ«إلّا»"]},{"q":"ما الرابط اللازم في الحال الجملة؟","a":"الواو، أو الضمير، أو هما معًا","e":"لا بدّ لجملة الحال من رابط يصلها بصاحبها؛ فالجملة الاسمية يغلب فيها الواو والضمير «جاء وهو مسرور»، والفعلية المضارعية المثبتة تُربط بالضمير وحده ولا تدخلها الواو «جاء يضحك».","d":["مفعول مطلق مبيّن للعدد","هارون الرشيد، ثم اتّسعت في عهد ابنه المأمون","لأنه شبيه بالمضاف، إذ عمل فيما بعده"]},{"q":"ما الفرق بين التمييز الملفوظ والملحوظ؟","a":"الملفوظ يرفع إبهام اسم ملفوظ قبله كالعدد والكيل والوزن والمساحة، والملحوظ يرفع إبهام نسبةٍ في الجملة","e":"الملفوظ يجوز فيه النصب والجرّ بالإضافة أو بـ«من»؛ أما الملحوظ فواجب النصب لا غير، وهو المحوَّل عن فاعل ﴿واشتعل الرأسُ شيبًا﴾ أو عن مفعول ﴿وفجّرنا الأرضَ عيونًا﴾ أو عن مبتدأ.","d":["نسبةً إلى كتاب «الديوان في النقد والأدب» للعقاد والمازني؛ وأعلامها العقاد والمازني وعبد الرحمن شكري","الصريح يتناول المفاتن الحسّية ويتعدّد فيه المحبوب، والعذري يتناول المفاتن المعنوية ويقتصر على محبوبة واحدة","الرابطة القلمية في المهجر الشمالي (أمريكا الشمالية) وأكثر تحرّرًا وتجديدًا، والعصبة الأندلسية في المهجر الجنوبي (أمريكا الجنوبية) وأقرب إلى المحافظة على عمود الشعر"]},{"q":"«أنا أكثرُ منك مالًا» — أعرب «مالًا» وبيّن سببه.","a":"تمييز ملحوظ منصوب، لأنه يرفع إبهام النسبة بعد اسم التفضيل","e":"اسم التفضيل المجرّد من «أل» والإضافة يُبهم جهة الأفضلية، فيُؤتى بالتمييز لبيانها. وهو محوَّل عن المبتدأ، إذ الأصل: «مالي أكثرُ من مالك».","d":["الحال نكرة منصوبة مشتقّة، وصاحبها معرفة في الأصل","ما بعدهما مضاف إليه مجرور دائمًا، وهما يُعربان إعراب المستثنى بـ«إلّا»","نائب عن المفعول المطلق منصوب، لأنه صفة المصدر المحذوف"]},{"q":"ما حكم المستثنى بـ«إلّا» في الكلام التامّ المثبت؟","a":"واجب النصب","e":"لأن المستثنى منه مذكور والكلام مثبت، فلا وجه للإتباع؛ نحو «نجح الطلابُ إلا طالبًا». وإنما يجوز الإتباع عند وجود النفي، لأن النفي يجعل ما بعد «إلّا» بدلًا من المنفي.","d":["عبد الحميد الكاتب","فاعل مرفوع، و«إلّا» أداة حصر لا عمل لها","الحال نكرة منصوبة مشتقّة، وصاحبها معرفة في الأصل"]},{"q":"«ما نجح إلا محمدٌ» — ما إعراب «محمد»؟ ولمَ؟","a":"فاعل مرفوع، و«إلّا» أداة حصر لا عمل لها","e":"هذا هو الاستثناء المفرَّغ (الناقص المنفي)، سُمّي مفرَّغًا لأن ما قبل «إلّا» تفرّغ للعمل فيما بعدها؛ فيُعرب الاسم بحسب موقعه كأنّ «إلّا» غير موجودة.","d":["تمييز ملحوظ منصوب، لأنه يرفع إبهام النسبة بعد اسم التفضيل","ما بعدهما مضاف إليه مجرور دائمًا، وهما يُعربان إعراب المستثنى بـ«إلّا»","نائب عن المفعول المطلق منصوب، لأنه صفة المصدر المحذوف"]},{"q":"ما حكم ما بعد «غير» و«سوى» في الاستثناء؟ وما إعرابهما؟","a":"ما بعدهما مضاف إليه مجرور دائمًا، وهما يُعربان إعراب المستثنى بـ«إلّا»","e":"فتُنصبان في التامّ المثبت «نجح الطلاب غيرَ طالبٍ»، ويجوز فيهما النصب والإتباع في التامّ المنفي، ويُعربان بحسب الموقع في المفرَّغ. و«سوى» تُقدَّر فيها الحركات لأنها مقصورة.","d":["فاعل مرفوع، و«إلّا» أداة حصر لا عمل لها","نائب عن المفعول المطلق منصوب، لأنه صفة المصدر المحذوف","إذا سُبقتا بـ«ما» المصدرية، فما بعدهما مفعول به منصوب"]},{"q":"متى تكون «خلا» و«عدا» فعلين وجوبًا؟","a":"إذا سُبقتا بـ«ما» المصدرية، فما بعدهما مفعول به منصوب","e":"لأن «ما» المصدرية لا تدخل إلا على الأفعال، فوجودها قرينة قاطعة على فعليتهما. وإذا لم تُسبقا بها جاز الوجهان: الفعلية فالنصب، والحرفية فالجرّ.","d":["ما بعدهما مضاف إليه مجرور دائمًا، وهما يُعربان إعراب المستثنى بـ«إلّا»","فاعل مرفوع، و«إلّا» أداة حصر لا عمل لها","نائب عن المفعول المطلق منصوب، لأنه صفة المصدر المحذوف"]},{"q":"ما أقسام المنادى المنصوب؟","a":"المضاف، والشبيه بالمضاف، والنكرة غير المقصودة","e":"وعلّة النصب أن المنادى مفعول به في المعنى لفعل محذوف تقديره «أدعو» أو «أنادي»؛ وإنما بُني العلم المفرد والنكرة المقصودة لشبههما بالمنادى المضمر في القصد والتعيين.","d":["مفعول مطلق مبيّن للعدد","لأنه مفعول معه، والواو واو المعية بمعنى «مع»","الواو، أو الضمير، أو هما معًا"]},{"q":"«يا طالبًا للعلمِ اجتهد» — لمَ نُصب «طالبًا»؟","a":"لأنه شبيه بالمضاف، إذ عمل فيما بعده","e":"الشبيه بالمضاف هو ما اتّصل به شيء من تمام معناه: معمولًا له كالجار والمجرور هنا، أو معطوفًا، أو تمييزًا. وهو منصوب دائمًا، بخلاف النكرة المقصودة «يا طالبُ» فمبنيّة على الضم.","d":["لأنه مفعول معه، والواو واو المعية بمعنى «مع»","هارون الرشيد، ثم اتّسعت في عهد ابنه المأمون","مفعول مطلق مبيّن للعدد"]},{"q":"في أي سنة قامت الدولة الأموية وفي أيّها سقطت؟","a":"قامت سنة ٤١هـ وسقطت سنة ١٣٢هـ","e":"سنة ٤١هـ هي «عام الجماعة» بعد تنازل الحسن بن علي لمعاوية، و١٣٢هـ هي سنة قيام الدولة العباسية بعد ثورة أبي مسلم الخراساني. وضبط التاريخين مفتاحٌ لأسئلة كثيرة.","d":["تأسّست سنة ١٩٣٢م، ومؤسّسها أحمد زكي أبو شادي، وأول رئيس لها أحمد شوقي","فُتحت سنة ٩٢هـ بقيادة طارق بن زياد، وسقطت غرناطة سنة ٨٩٧هـ","عبد الحميد الكاتب"]},{"q":"ما أبرز سبب لازدهار الشعر السياسي في العصر الأموي؟","a":"تعدّد الأحزاب السياسية، إذ صار لكل حزب شعراؤه المدافعون عنه","e":"الأحزاب أربعة: الأمويون، والشيعة، والخوارج، والزبيريون؛ وكان الشعر وسيلة الدعاية والردّ في عصرٍ لا إعلام فيه سواه، فنشط الشعر السياسي نشاطًا لم يعرفه الجاهليون.","d":["وحدته التفعيلة لا البيت؛ وتُنازَع الريادة بين نازك الملائكة وبدر شاكر السيّاب","المفعول به، والمفعول المطلق، والمفعول لأجله، والمفعول معه، والمفعول فيه (الظرف)","لنقل عاصمة الخلافة من دمشق إلى بغداد في العراق، وهي مجاورة لبلاد فارس"]},{"q":"ما الفرق الجوهري بين الغزل الصريح والغزل العذري؟","a":"الصريح يتناول المفاتن الحسّية ويتعدّد فيه المحبوب، والعذري يتناول المفاتن المعنوية ويقتصر على محبوبة واحدة","e":"وسبب الأول رخاء الحجاز وانصراف أهله عن السياسة إلى الغناء واللهو، وسبب الثاني خشونة البادية وتمسّك أهلها بالقيم؛ فالبيئة هي التي صنعت الفرق لا الطبع وحده.","d":["نسبةً إلى كتاب «الديوان في النقد والأدب» للعقاد والمازني؛ وأعلامها العقاد والمازني وعبد الرحمن شكري","جرير والفرزدق والأخطل؛ والنقيضة قصيدة يردّ بها الشاعر على خصمه بالوزن والقافية نفسيهما ناقضًا معانيه","تغليب العاطفة والذاتية، والنزوع إلى الطبيعة، والوحدة العضوية، والتشاؤم أحيانًا؛ ورائده خليل مطران"]},{"q":"من فرسان النقائض الثلاثة؟ وما تعريف النقيضة؟","a":"جرير والفرزدق والأخطل؛ والنقيضة قصيدة يردّ بها الشاعر على خصمه بالوزن والقافية نفسيهما ناقضًا معانيه","e":"وتمتزج فيها أغراض ثلاثة: الفخر بالنفس والقبيلة، والهجاء للخصم، ونقض معانيه. وأشهر ميدانها سوق المِربَد بالبصرة.","d":["فنّ شعري لا يلتزم قافية واحدة ويتكوّن من مقاطع؛ نشأ لازدهار الغناء والموسيقى وحاجة المغنّين إلى أوزان متنوّعة","الملفوظ يرفع إبهام اسم ملفوظ قبله كالعدد والكيل والوزن والمساحة، والملحوظ يرفع إبهام نسبةٍ في الجملة","الصريح يتناول المفاتن الحسّية ويتعدّد فيه المحبوب، والعذري يتناول المفاتن المعنوية ويقتصر على محبوبة واحدة"]},{"q":"من رائد فنّ الكتابة (الرسائل) في العصر الأموي؟","a":"عبد الحميد الكاتب","e":"وهو كاتب مروان بن محمد آخر خلفاء بني أمية، وإليه يُنسب قولهم «بُدئت الكتابة بعبد الحميد وخُتمت بابن العميد». وقد نقل الرسائل من الإيجاز إلى الإطناب والتفنّن.","d":["واجب النصب","فاعل مرفوع، و«إلّا» أداة حصر لا عمل لها","تمييز ملحوظ منصوب، لأنه يرفع إبهام النسبة بعد اسم التفضيل"]},{"q":"لماذا تأثّر الأدب العباسي بالحضارة الفارسية؟","a":"لنقل عاصمة الخلافة من دمشق إلى بغداد في العراق، وهي مجاورة لبلاد فارس","e":"فالجوار الجغرافي أدّى إلى امتزاج اجتماعي وثقافي وسياسي: دخل الفرس الدواوين، وانتقلت عاداتهم في البذخ والترف، وتُرجمت علومهم؛ فانعكس ذلك كلّه على الأدب.","d":["بديع الزمان الهمذاني؛ وخصائصها قصة قصيرة ببطل وهمّ وراوٍ، بأسلوب مسجوع مملوء بالمحسنات","الوقوف على الأطلال والبكاء عليها، فاستبدل به وصف الخمر والطبيعة والقصور","لضعف الدولة الإسلامية وسقوط المدن الكبرى تباعًا في يد الإسبان"]},{"q":"أيّ الخلفاء العباسيين ارتبط اسمه بـ«دار الحكمة» وازدهار الترجمة؟","a":"هارون الرشيد، ثم اتّسعت في عهد ابنه المأمون","e":"وقد تُرجمت علوم اليونان والفرس والهند؛ وأثر ذلك في الأدب أن اتّسعت المعاني وعمُقت الأفكار ودخل المنطق والفلسفة في الجدل الكلامي.","d":["لأنه مفعول معه، والواو واو المعية بمعنى «مع»","مفعول مطلق مبيّن للعدد","الواو، أو الضمير، أو هما معًا"]},{"q":"ما الذي تمرّد عليه أبو نواس في بناء القصيدة؟","a":"الوقوف على الأطلال والبكاء عليها، فاستبدل به وصف الخمر والطبيعة والقصور","e":"ووجه ذلك أن الأطلال صورة من بيئة بدوية لم يعُد الشاعر العباسي يعيشها؛ فكان التجديد استجابةً لتغيّر الحياة، لا مجرد مخالفة. ومن شواهده قوله: «عاجَ الشَقِيُّ على رَسمٍ يُسائِلُهُ ∗ وعُجتُ أسألُ عن خَمّارةِ البلدِ» — ووجه الاستشهاد: السخرية الصريحة من تقليد الأطلال.","d":["المفعول به، والمفعول المطلق، والمفعول لأجله، والمفعول معه، والمفعول فيه (الظرف)","الجاحظ بالاستطراد والمزج بين الجدّ والهزل، وابن المقفع بالسهل الممتنع","لضعف الدولة الإسلامية وسقوط المدن الكبرى تباعًا في يد الإسبان"]},{"q":"بمَ تميّز أسلوب الجاحظ؟ وبمَ تميّز أسلوب ابن المقفع؟","a":"الجاحظ بالاستطراد والمزج بين الجدّ والهزل، وابن المقفع بالسهل الممتنع","e":"والفرق راجع إلى الغاية: الجاحظ متكلّم معتزلي يريد الإمتاع والإقناع فيستطرد، وابن المقفع كاتب ديواني مترجم يريد الإبانة فيوجز. ومن أشهر كتب الجاحظ: البخلاء، والبيان والتبيين، والحيوان.","d":["المفعول به، والمفعول المطلق، والمفعول لأجله، والمفعول معه، والمفعول فيه (الظرف)","كتاب نثري أندلسي في تحليل عاطفة الحبّ وأحواله، لابن حزم الأندلسي","الوقوف على الأطلال والبكاء عليها، فاستبدل به وصف الخمر والطبيعة والقصور"]},{"q":"من مبتكر فنّ المقامات؟ وما أبرز خصائصها؟","a":"بديع الزمان الهمذاني؛ وخصائصها قصة قصيرة ببطل وهمّ وراوٍ، بأسلوب مسجوع مملوء بالمحسنات","e":"وأتمّها بعده الحريري حتى صارت غاية في التأنّق اللفظي. والمقامة تجمع بين السرد والمعجم اللغوي والتفنّن البديعي، ولذلك عُدّت من أكثر فنون النثر صناعةً.","d":["الوقوف على الأطلال والبكاء عليها، فاستبدل به وصف الخمر والطبيعة والقصور","لضعف الدولة الإسلامية وسقوط المدن الكبرى تباعًا في يد الإسبان","لنقل عاصمة الخلافة من دمشق إلى بغداد في العراق، وهي مجاورة لبلاد فارس"]},{"q":"في أي سنة فُتحت الأندلس ومن قائد الفتح؟ ومتى سقطت غرناطة؟","a":"فُتحت سنة ٩٢هـ بقيادة طارق بن زياد، وسقطت غرناطة سنة ٨٩٧هـ","e":"فالمدة نحو ثمانية قرون؛ وضبطها مهمّ لأن أسئلة الأدب الأندلسي تدور كثيرًا على تاريخي البداية والنهاية، وعلى ربط سقوط المدن بنشأة فنّ رثاء المدن والممالك.","d":["قامت سنة ٤١هـ وسقطت سنة ١٣٢هـ","تأسّست سنة ١٩٣٢م، ومؤسّسها أحمد زكي أبو شادي، وأول رئيس لها أحمد شوقي","واجب النصب"]},{"q":"ما فنّ الموشحات؟ ولماذا نشأ في الأندلس بالذات؟","a":"فنّ شعري لا يلتزم قافية واحدة ويتكوّن من مقاطع؛ نشأ لازدهار الغناء والموسيقى وحاجة المغنّين إلى أوزان متنوّعة","e":"فالقصيدة العمودية بقافيتها الواحدة ووزنها الواحد لا تُسعف الألحان المتغيّرة؛ فابتُكر الموشح ليُطاوع اللحن. وأجزاؤه: المطلع، والدور، والسِّمط، والقفل، والخرجة.","d":["نسبةً إلى كتاب «الديوان في النقد والأدب» للعقاد والمازني؛ وأعلامها العقاد والمازني وعبد الرحمن شكري","الرابطة القلمية في المهجر الشمالي (أمريكا الشمالية) وأكثر تحرّرًا وتجديدًا، والعصبة الأندلسية في المهجر الجنوبي (أمريكا الجنوبية) وأقرب إلى المحافظة على عمود الشعر","تغليب العاطفة والذاتية، والنزوع إلى الطبيعة، والوحدة العضوية، والتشاؤم أحيانًا؛ ورائده خليل مطران"]},{"q":"من لُقّب بـ«جنّان الأندلس»؟ ولمَ؟","a":"ابن خفاجة، لكثرة وصفه الجنان والرياض والطبيعة","e":"واللقب من جنس ألقاب الشعراء المبنيّة على الغرض الغالب، كما لُقّب أبو العتاهية بشاعر الزهد. ومن شواهده: «يا أهلَ أندلسٍ للهِ دَرُّكُمُ ∗ ماءٌ وظِلٌّ وأنهارٌ وأشجارُ» — ووجه الاستشهاد: حصر محاسن الأندلس في عناصر الطبيعة الأربعة.","d":["مفعول مطلق مبيّن للعدد","هارون الرشيد، ثم اتّسعت في عهد ابنه المأمون","لأنه شبيه بالمضاف، إذ عمل فيما بعده"]},{"q":"لماذا ظهر فنّ رثاء المدن والممالك في الأندلس؟","a":"لضعف الدولة الإسلامية وسقوط المدن الكبرى تباعًا في يد الإسبان","e":"فالفنّ وليد الحدث التاريخي؛ ولذلك لم يُعرف بهذه الكثافة في المشرق. وأشهر نماذجه نونية أبي البقاء الرندي التي تبدأ: «لِكلِّ شيءٍ إذا ما تمَّ نقصانُ ∗ فلا يُغَرَّ بطيبِ العيشِ إنسانُ» — ووجه الاستشهاد: التمهيد بحكمة كلّية قبل البكاء على الممالك.","d":["المفعول به، والمفعول المطلق، والمفعول لأجله، والمفعول معه، والمفعول فيه (الظرف)","كتاب نثري أندلسي في تحليل عاطفة الحبّ وأحواله، لابن حزم الأندلسي","تعدّد الأحزاب السياسية، إذ صار لكل حزب شعراؤه المدافعون عنه"]},{"q":"ما كتاب «طوق الحمامة»؟ ومن مؤلفه؟","a":"كتاب نثري أندلسي في تحليل عاطفة الحبّ وأحواله، لابن حزم الأندلسي","e":"وهو من أبرز ما يدلّ على أن الأندلسيين وإن قلّدوا المشرق في فنون النثر، فقد أضافوا موضوعات ذات طابع خاصّ نابع من بيئتهم الاجتماعية المنفتحة.","d":["وحدته التفعيلة لا البيت؛ وتُنازَع الريادة بين نازك الملائكة وبدر شاكر السيّاب","تعدّد الأحزاب السياسية، إذ صار لكل حزب شعراؤه المدافعون عنه","بديع الزمان الهمذاني؛ وخصائصها قصة قصيرة ببطل وهمّ وراوٍ، بأسلوب مسجوع مملوء بالمحسنات"]},{"q":"ما سبب تسمية «مدرسة الديوان»؟ ومن أعلامها؟","a":"نسبةً إلى كتاب «الديوان في النقد والأدب» للعقاد والمازني؛ وأعلامها العقاد والمازني وعبد الرحمن شكري","e":"وقد نقدا فيه شعر شوقي والمدرسة الكلاسيكية، ودعوا إلى الوحدة العضوية والصدق الوجداني والتعبير عن النفس بدل المناسبات. فالتسمية مأخوذة من كتابٍ نقديّ لا من مجلّة.","d":["جرير والفرزدق والأخطل؛ والنقيضة قصيدة يردّ بها الشاعر على خصمه بالوزن والقافية نفسيهما ناقضًا معانيه","الصريح يتناول المفاتن الحسّية ويتعدّد فيه المحبوب، والعذري يتناول المفاتن المعنوية ويقتصر على محبوبة واحدة","الملفوظ يرفع إبهام اسم ملفوظ قبله كالعدد والكيل والوزن والمساحة، والملحوظ يرفع إبهام نسبةٍ في الجملة"]},{"q":"ما سنة تأسيس جماعة أبوللو؟ ومن مؤسّسها؟ ومن أول رئيس لها؟","a":"تأسّست سنة ١٩٣٢م، ومؤسّسها أحمد زكي أبو شادي، وأول رئيس لها أحمد شوقي","e":"وهذه مفارقة لطيفة يُسأل عنها: شوقي الذي نقدته مدرسة الديوان هو نفسه الرئيس الفخري لأبوللو؛ لأن أبوللو جماعة تنظيمية جامعة لا حركة نقدية مضادّة.","d":["قامت سنة ٤١هـ وسقطت سنة ١٣٢هـ","فُتحت سنة ٩٢هـ بقيادة طارق بن زياد، وسقطت غرناطة سنة ٨٩٧هـ","عبد الحميد الكاتب"]},{"q":"ما الفرق بين الرابطة القلمية والعصبة الأندلسية؟","a":"الرابطة القلمية في المهجر الشمالي (أمريكا الشمالية) وأكثر تحرّرًا وتجديدًا، والعصبة الأندلسية في المهجر الجنوبي (أمريكا الجنوبية) وأقرب إلى المحافظة على عمود الشعر","e":"ومن أعلام الأولى جبران وميخائيل نعيمة وإيليا أبو ماضي، ومن أعلام الثانية الشاعر القروي وإلياس فرحات. والفارق البيئي وراء الفارق الفنّي: الشمال أشدّ اندماجًا في الحضارة الغربية.","d":["جرير والفرزدق والأخطل؛ والنقيضة قصيدة يردّ بها الشاعر على خصمه بالوزن والقافية نفسيهما ناقضًا معانيه","الملفوظ يرفع إبهام اسم ملفوظ قبله كالعدد والكيل والوزن والمساحة، والملحوظ يرفع إبهام نسبةٍ في الجملة","نسبةً إلى كتاب «الديوان في النقد والأدب» للعقاد والمازني؛ وأعلامها العقاد والمازني وعبد الرحمن شكري"]},{"q":"ما وحدة البناء في الشعر الحرّ؟ ومن تُنازَع له الريادة؟","a":"وحدته التفعيلة لا البيت؛ وتُنازَع الريادة بين نازك الملائكة وبدر شاكر السيّاب","e":"فالشاعر يبني السطر من عدد غير ثابت من التفعيلات، فتتفاوت الأسطر طولًا تبعًا للدفقة الشعورية. وهو لذلك ليس «شعرًا منثورًا»؛ فالتفعيلة فيه ملتزمة والقافية حرّة.","d":["لنقل عاصمة الخلافة من دمشق إلى بغداد في العراق، وهي مجاورة لبلاد فارس","الجاحظ بالاستطراد والمزج بين الجدّ والهزل، وابن المقفع بالسهل الممتنع","تعدّد الأحزاب السياسية، إذ صار لكل حزب شعراؤه المدافعون عنه"]},{"q":"ما أبرز خصائص الاتجاه الوجداني (الرومانتيكي)؟ ومن رائده في العربية؟","a":"تغليب العاطفة والذاتية، والنزوع إلى الطبيعة، والوحدة العضوية، والتشاؤم أحيانًا؛ ورائده خليل مطران","e":"ولُقّب مطران بـ«شاعر القطرين» لمصريته ولبنانيّته، وهو حلقة الوصل بين الإحياء والتجديد؛ إذ حافظ على متانة اللغة وأدخل الوحدة العضوية والقصة الشعرية.","d":["الملفوظ يرفع إبهام اسم ملفوظ قبله كالعدد والكيل والوزن والمساحة، والملحوظ يرفع إبهام نسبةٍ في الجملة","الرابطة القلمية في المهجر الشمالي (أمريكا الشمالية) وأكثر تحرّرًا وتجديدًا، والعصبة الأندلسية في المهجر الجنوبي (أمريكا الجنوبية) وأقرب إلى المحافظة على عمود الشعر","فنّ شعري لا يلتزم قافية واحدة ويتكوّن من مقاطع؛ نشأ لازدهار الغناء والموسيقى وحاجة المغنّين إلى أوزان متنوّعة"]}],"r":[{"t":"ما دخلتُه فعلًا في المنصة وما تعذّر — بيان صريح","b":"\n<p>طُلب منّي أن «أدخل المنصة على اختبارات مختارة لي وأذكر الأسئلة». هذا ما حدث بالضبط،\nمن غير تهويل ولا ادّعاء:</p>\n<ul>\n<li><b>ما نجح:</b> فتحتُ الواجهة العامة لـ<span dir=\"ltr\">egtaz.online</span>، وقرأتُ شريط\n«<b>اختبارات مختارة لك</b>» وبطاقاته، وقائمة «الأقسام التدريبية»، ووصفَ القسم المجاني،\nثم دخلتُ <b>مكتبة الشروحات</b> المفتوحة وقرأتُ دروس تخصص اللغة العربية فيها كاملةً\n(نحو وأدب)، وهي الدروس التي يربط كلٌّ منها باختباره الخاص.</li>\n<li><b>ما تعذّر:</b> صفحات الاختبار نفسها لا تُفتح إلا بحساب <b>VIP</b>،\nوالمنصة تُغلق الجلسة إذا دخل الحساب من جهاز آخر («جلسة واحدة آمنة لكل جهاز»).\nو<b>لن أُدخل بيانات دخول ولا أحاول التحايل على الاشتراك</b> — هذا خطّ لا أتجاوزه،\nوهو أيضًا حقّ لأصحاب المنصة.</li>\n</ul>\n<p><b>فماذا فعلتُ بدل ذلك؟</b> أخذتُ الدروس المفتوحة نفسها التي تُبنى عليها تلك الاختبارات،\nووضعتُ عليها أسئلةً من جنس ما يُسأل في المسابقة، مع الحلّ والتعليل. فالمحتوى الذي\nيُمتحن فيه الطالب هو هذا المحتوى، وهذه الأسئلة أصليةُ الصياغة لا منقولةً من بنك مغلق.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>لم أُنشئ حسابًا ولم أُدخل بيانات دخول</b> — لا اسم مستخدم ولا كلمة مرور ولا رمز تحقّق. وقسم المشتركين في المنصة مقيَّد بجلسة واحدة لكل جهاز، فالدخول إليه يعني انتحال حساب صاحبه. فما تراه هنا مستخرَجٌ كلّه من الصفحات المفتوحة للعامّة ومن مجلّد «ملفات المسابقة» المنشور على درايف.</li><li><b>الصفحات المفتوحة ثلاثة أنواع:</b> صفحة الدرس <code>lesson.php?id=…</code> وهي كاملة النصّ وتُقرأ بلا تسجيل، وواجهة الاختبار <code>index.html?quiz=…</code> وهي قشرة برمجية لا يظهر فيها نصّ الأسئلة إلا بعد تحميلها داخل المتصفح، وصفحة الملفات على درايف. فالدرسُ مصدرٌ معتمد، وواجهةُ الاختبار ليست مصدرًا.</li><li><b>تعذّر ملفّ «٣٦٠ سؤال»</b> بعد تجريب خمس عشرة صيغة من روابط التحميل والعرض والمعاينة، وكلّها ردّت بصفحة اعتراض أو خطأ في الخادم. وملفّ «مراجعة ما قبل الامتحان» قُرئ جزؤه الأول فقط، وتبيّن أنّ مادّته جدارات وذكاء وحاسب ومعلومات عامّة، لا تخصّصَ لغةٍ عربية. فلم يضع عليك شيء من جهة التخصّص.</li><li><b>البديل الذي اعتُمد منهجيًّا:</b> أُخذت العناوين والمحاور من الدروس المفتوحة، ثم صيغت الأسئلة والشروح صياغةً أصلية على مقتضى كتب الفنّ، فالمحتوى الذي يُمتحن فيه الطالب محفوظٌ وإن لم يُنقل بنكُ الأسئلة المغلق حرفًا بحرف. ونقلُ ملفّ امتحانٍ مملوكٍ بنصّه ليس من العلم في شيء، ولا يجوز.</li><li><b>كيف تتثبّت بنفسك:</b> افتح صفحة الدرس برقمها، ثم انظر في ذيلها قائمة «شروحات مرتبطة» فإنها تدلّك على بقيّة أرقام الدروس، وهكذا تمشي في الشجرة كلّها بلا حساب. وهذه هي الطريقة التي بُني عليها قسم «من المنصة» في هذه الصفحة.</li></ol></div>"},{"t":"«اختبارات مختارة لك» — ما ظهر في الواجهة","b":"\n<p>هذه بطاقات شريط «اختبارات مختارة لك» كما عرضتها الصفحة الرئيسة وقت الاطّلاع:</p>\n<table>\n<tr><th>البطاقة</th><th>النوع</th><th>الحجم / الزمن</th></tr>\n<tr><td>تخصص لغة عربية — الأسئلة الأكثر تكرارًا — الشواهد النحوية والنصوص</td><td>اختبار تخصص</td><td>٤٠ سؤالًا</td></tr>\n<tr><td>تخصص لغة عربية — الأسئلة الأكثر تكرارًا — الشواهد النحوية والنصوص (نسخة)</td><td>اختبار تخصص</td><td>٤٠ سؤالًا</td></tr>\n<tr><td>محاكي تنظيم وإدارة — لغة عربية</td><td>محاكٍ شامل</td><td>١٠٠ دقيقة</td></tr>\n<tr><td>مسابقة القرآن الكريم</td><td>محاكٍ شامل</td><td>٩٠ دقيقة</td></tr>\n</table>\n<p>ولاحظ أن عنوان أكبر اختبارَي التخصص يقول صراحةً: «<b>الشواهد النحوية والنصوص</b>»؛\nوهذه إشارة مفيدة لمن يُذاكر — فالثقل في التخصص على <b>إعراب الشاهد وتخريجه</b>،\nلا على حفظ التعريفات. ولهذا عُنيت في هذا الدليل بوجه الاستشهاد في كل شاهد.</p>\n<p>والأقسام التدريبية المعلنة في المنصة: لغة عربية الأزهر الشريف، ولغة عربية الحصة،\nورياضيات، وعلوم، ودراسات، ولغة إنجليزية، ومسابقة القرآن الكريم، والخارجية،\nوطبيب بيطري، ومواد شرعية الأزهر، وإمام وخطيب ومدرّس، ومعاون خبير.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>العنوان ترويجيّ لا تشخيصيّ</b> — ليست «مختارة لك» بناءً على مستواك، وإنما هي واجهة دوّارة تعرض أكثر الاختبارات طلبًا. فلا تبنِ خطّة مذاكرتك على ترتيبها، وإنما على نقاط ضعفك أنت.</li><li><b>ما يخصّ تخصّص اللغة العربية منها قليل</b>: «تخصص لغة عربية — الأكثر تكرارًا» و«الشواهد النحوية» في أربعين سؤالًا، وقد تكرّر الثاني مرّتين في الواجهة. وبقيّةُ ما في الدوّارة محاكياتٌ عامّة: تنظيم وإدارة، ومسابقة القرآن، وغيرهما.</li><li><b>«الأكثر تكرارًا» اصطلاحٌ يحتاج تحرّيًا</b> — التكرار في المسابقات يقع في المسائل الكبرى: إعراب المنصوبات، والممنوع من الصرف، والعدد وتمييزه، والبدل، وأغراض الخبر والإنشاء، والبحور المشهورة، وأصحاب المعلّقات. وقد بُنيت أسئلة هذه الصفحة على هذا المدار نفسه.</li><li><b>الشواهد النحوية بابٌ مستقلّ يُغفَل</b> — ويُسأل فيه عن قائل البيت، وموضع الشاهد، ووجه الاستشهاد. والحيلة فيه أن تحفظ <b>وجه الاستشهاد</b> لا البيت وحده، فإنّ السؤال يقع على الوجه غالبًا: لماذا استُشهد بالبيت؟ لا: من قائله؟</li><li><b>زمن المحاكي جزء من الاختبار</b> — مئة دقيقة لمحاكي التنظيم والإدارة، وتسعون لمسابقة القرآن. ووضعُ الاختبار في هذه الصفحة يعرض لك ساعةً صاعدة لهذا المعنى: أن تقيس سرعتك لا صوابك وحده.</li></ol></div>"},{"t":"درس المنصوبات في المنصة — تلخيصه وما يُستدرك عليه","b":"\n<p>الدرس المنشور في المكتبة المفتوحة بعنوان «<b>المنصوبات: المفاعيل الخمسة، الحال، التمييز،\nالمستثنى، المنادى</b>»\n(<a href=\"https://egtaz.online/lesson.php?id=1775992612599\" target=\"_blank\" rel=\"noopener\">رابط الدرس</a>)،\nويربطه الموقع باختبار من ٥٠ سؤالًا بنظام نواتج التعلّم. وخلاصته أربعة محاور:</p>\n<ol>\n<li><b>المفاعيل:</b> المفعول به، والمفعول المطلق (توكيدًا أو بيانًا للنوع أو للعدد) وما ينوب عنه،\nوالمفعول لأجله (مصدر قلبي لبيان السبب)، والمفعول معه (بعد واو المعية)، والمفعول فيه (الظرف).</li>\n<li><b>الحال والتمييز:</b> الحال نكرة منصوبة تبيّن الهيئة وصاحبها معرفة، وتأتي مفردة وجملة\nوشبه جملة، ويلزم في الجملة رابط. والتمييز ملفوظ (بعد عدد أو كيل أو وزن أو مساحة)\nوملحوظ (بعد أفعل التفضيل وأفعال مثل ازداد وطاب وامتلأ).</li>\n<li><b>المستثنى:</b> تامّ مثبت ← نصب، تامّ منفي ← نصب أو إتباع، ناقص منفي ← بحسب الموقع.\nو«غير» و«سوى» يأخذان حكم ما بعد «إلّا» وما بعدهما مضاف إليه. و«عدا/خلا/حاشا»\nأفعال إن سبقتها «ما».</li>\n<li><b>المنادى:</b> منصوب إن كان مضافًا أو شبيهًا بالمضاف أو نكرة غير مقصودة،\nومبنيّ في محل نصب إن كان علمًا مفردًا أو نكرة مقصودة.</li>\n</ol>\n<div class=\"tnb\"><h4>استدراكات على الدرس</h4><ol>\n<li>عدّ الدرسُ المفاعيلَ «خمسة» ثم سرد ستّة (به، مطلق، لأجله، معه، فيه) مع النائب عن المطلق؛\nوالمشهور في كتب النحو أن المفاعيل <b>خمسة</b>: به، ومطلق، ولأجله، ومعه، وفيه. فاضبط العدّ.</li>\n<li>قوله في التامّ المنفي «يجوز النصب أو الإتباع» صحيح، لكن الأرجح عند الجمهور\n<b>الإتباع على البدلية</b> لا النصب؛ وهذا ما يُسأل عنه بصيغة «الأفصح».</li>\n<li>لم يذكر الدرس <b>الاستثناء المنقطع</b> وحكمَه (وجوب النصب عند الحجازيين)،\nولا <b>تقدّم المستثنى</b> على المستثنى منه وأنه يوجب النصب. وهما يَرِدان في الاختبارات.</li>\n<li>في المنادى: أغفل الدرس <b>المنادى المضاف إلى ياء المتكلم</b> وما فيه من أوجه\n(يا عبدي / يا عبدِ / يا عبدا)، و<b>المنادى المستغاث والمتعجَّب منه</b>.</li>\n</ol></div>\n"},{"t":"دروس الأدب في المنصة — العصر الأموي والعباسي والأندلسي","b":"\n<p>ثلاثة دروس مفتوحة متتابعة، لكلٍّ منها اختبار مرتبط:</p>\n<ul>\n<li><b><a href=\"https://egtaz.online/lesson.php?id=1783715361138\" target=\"_blank\" rel=\"noopener\">العصر الأموي</a></b> (٤١–١٣٢هـ):\nانتقال العاصمة إلى دمشق، وتعدّد الأحزاب (الأمويون، الشيعة، الخوارج، الزبيريون) فازدهر\n<b>الشعر السياسي</b>؛ والغزل بنوعيه: الصريح الحضري (عمر بن أبي ربيعة) والعذري البدوي\n(جميل بثينة، مجنون ليلى، كُثيّر عزّة)؛ و<b>النقائض</b> وفرسانها جرير والفرزدق والأخطل.\nوفي النثر: بلغت <b>الخطابة</b> أوجها (زياد بن أبيه، الحجاج)، وارتقت الكتابة على يد\n<b>عبد الحميد الكاتب</b>.</li>\n<li><b><a href=\"https://egtaz.online/lesson.php?id=1783715790709\" target=\"_blank\" rel=\"noopener\">العصر العباسي</a></b> (من ١٣٢هـ):\nنقل العاصمة إلى بغداد والتأثر بالفرس؛ ظهرت الزندقة والشعوبية والمجون وقابلها الزهد والنسك؛\nوازدهرت <b>الترجمة</b> و«دار الحكمة»، ونشأ <b>علم الكلام</b> (المعتزلة)، ومدرستا\n<b>البصرة والكوفة</b> في النحو. وفي الشعر: أغراض مستحدثة ووصف لمظاهر الحضارة،\nوتخلٍّ عن الأطلال (أبو نواس)، وألفاظ سهلة ومعانٍ عميقة وخيال مركّب.\nوالنثر فيه «عصره الذهبي»: ابن المقفع (كليلة ودمنة، السهل الممتنع)، والجاحظ (الاستطراد\nوالمزج بين الجدّ والهزل)، و<b>المقامات</b> لبديع الزمان الهمذاني.</li>\n<li><b><a href=\"https://egtaz.online/lesson.php?id=1783716124381\" target=\"_blank\" rel=\"noopener\">الأدب الأندلسي</a></b>:\nالفتح سنة ٩٢هـ بقيادة طارق بن زياد، وسقوط غرناطة سنة ٨٩٧هـ؛ وسمات البيئة: طبيعة ساحرة،\nوغناء وموسيقى، ومشاركة المرأة (ولّادة بنت المستكفي). وتميّزوا بـ<b>الموشحات</b>،\nو<b>وصف الطبيعة</b> (الروضيات والزهريات، وابن خفاجة «جنّان الأندلس»)،\nو<b>رثاء المدن والممالك</b> (أبو البقاء الرندي). وفي النثر: قلّدوا المشرق،\nوأشهر كتبهم الخاصة «طوق الحمامة» لابن حزم.</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات تُضاف إلى الدروس</h4><ol>\n<li>الدروس لم تذكر <b>الزجل</b> إلى جانب الموشح، وهو فنّ أندلسي ثانٍ يُسأل عنه كثيرًا،\nوالفرق بينهما أن الزجل بالعامية والموشح بالفصحى.</li>\n<li>أجزاء الموشح يحسُن حفظها بالترتيب: <b>المطلع، الدور، السِّمط، القفل، الخرجة</b>،\nوالخرجة قد تأتي بالعامية أو بالأعجمية وهي من أبرز علاماته.</li>\n<li>في العباسي: المقامة أقدم من الهمذاني في بذورها، لكن الهمذاني هو <b>مبتكر الفنّ</b>\nبصورته المعروفة، وأتمّه الحريري. وهذا هو الجواب المطلوب في الاختيار من متعدد.</li>\n<li>سبب ظهور النقائض ثلاثي: التنافس الشخصي، والعصبية القبلية، وفراغ الناس واتخاذها تسلية\nفي سوق المِربَد. ومن أجاب بواحد فقط فقد أنقص.</li>\n</ol></div>\n"},{"t":"دروس المدارس الشعرية الحديثة في المنصة","b":"\n<p>وفي المكتبة أيضًا سلسلة متّصلة عن الاتجاهات الحديثة:\n<a href=\"https://egtaz.online/lesson.php?id=1783797439945\" target=\"_blank\" rel=\"noopener\">الاتجاه الوجداني (الرومانتيكية) ورائده خليل مطران</a>،\nو<a href=\"https://egtaz.online/lesson.php?id=1783797631651\" target=\"_blank\" rel=\"noopener\">مدرسة الديوان (العقاد والمازني وشكري)</a>،\nو<a href=\"https://egtaz.online/lesson.php?id=1783797976374\" target=\"_blank\" rel=\"noopener\">مدرسة أبوللو</a>،\nو<a href=\"https://egtaz.online/lesson.php?id=1783798273951\" target=\"_blank\" rel=\"noopener\">أدب المهجر والمدرسة الواقعية (الشعر الحر)</a>.</p>\n<p>وهذه المحاور الأربعة هي أكثر ما يتكرّر في أسئلة الأدب الحديث، ومدارها على ثلاثة أشياء:\n<b>الرائد</b>، و<b>سبب التسمية</b>، و<b>الخصائص الفنية</b>. فاضبطها ثلاثيةً ولا تخلط\nبين «الديوان» و«أبوللو»؛ فالأولى <b>نقدية ثائرة</b> نشأت من كتابٍ في نقد شوقي،\nوالثانية <b>جماعة منظّمة</b> لها مجلة ورئيسٌ فخريّ هو شوقي نفسه.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الخلط بين «الديوان» و«أبوللو» أكثر أخطاء هذا الباب</b> — فالديوان <b>نقدية ثائرة</b> قامت على كتابٍ في نقد شوقي، أصحابها العقاد والمازني وشكري، وأبوللو <b>جماعة منظَّمة</b> لها مجلّة ورئيسٌ ومؤسِّس هو أحمد زكي أبو شادي، ورئيسها الفخريّ أحمد شوقي نفسه الذي نقده الديوان. فالعلاقة بينهما عكسية.</li><li><b>فرّق بين الاتجاه الوجداني ومدرسة الديوان</b> — خليل مطران رائد الاتجاه الوجداني ويُسمّى «شاعر القطرين»، ودعا إلى <b>الوحدة العضوية</b> في القصيدة، وهو سابقٌ على الديوان ومُمَهِّدٌ لها لا واحدًا منها. وإدخالُه في الديوان خطأ شائع في الاختبارات.</li><li><b>مدرسة المهجر قسمان لا قسم واحد</b>: الرابطة القلمية في الشمال (نيويورك) ورئيسها جبران خليل جبران وأمين سرّها ميخائيل نعيمة، والعصبة الأندلسية في الجنوب (البرازيل) وهي <b>أحفظ للعمود وأقرب إلى القديم</b>. فإذا سُئلت عن التجديد المطلق فالشمالية، وعن المحافظة فالجنوبية.</li><li><b>الشعر الحرّ ليس شعرًا منثورًا</b> — وحدته <b>التفعيلة</b> لا البيت، وفيه وزن وقافية غير ملتزمة، فهو موزون غير مقفّى على نظام واحد. وأما قصيدة النثر فلا وزن فيها أصلًا. وتُنازَع ريادة الشعر الحرّ بين نازك الملائكة في «الكوليرا» وبدر شاكر السيّاب، والأسلم في الجواب أن تذكرهما معًا.</li><li><b>اربط كل مدرسة بعلامتها المميِّزة</b>: الإحياء ← البارودي ومعارضة القدماء، الوجداني ← مطران والوحدة العضوية، الديوان ← العقاد ونقد شوقي، أبوللو ← أبو شادي والمجلة، المهجر ← جبران والنزعة الإنسانية، الحرّ ← نازك والتفعيلة. وهذه الستّة تكفيك أكثر أسئلة الباب.</li></ol></div>"}]},{"c":"ex1","n":"١· الأكثر تكرارًا","q":[{"q":"ما علامة جرّ الممنوع من الصرف؟ ومتى ترجع إليه الكسرة؟","a":"يُجرّ بالفتحة نيابةً عن الكسرة، وترجع الكسرة إذا اقترن بـ«أل» أو أُضيف","e":"لأن منع الصرف منعٌ من التنوين ومن الكسر معًا، فإذا دخلت «أل» أو الإضافة زال شبهُ الاسم بالفعل فعاد إلى أصله في الجرّ بالكسرة.","d":["فُعَيل للثلاثي، وفُعَيعِل للرباعي، وفُعَيعِيل لما قبل آخره حرف مدّ","على وزن مضارعه بإبدال حرف المضارعة ميمًا مضمومة وكسر ما قبل الآخر، نحو «مُستخرِج»","إذا كان المبتدأ نكرةً محضة والخبر شبه جملة، نحو «فيكم بركةٌ»"]},{"q":"«صلّيتُ في مساجدَ كثيرة» — لماذا جُرّ «مساجد» بالفتحة؟","a":"لأنه على صيغة منتهى الجموع، وهي علّة واحدة تكفي لمنع الصرف","e":"وصيغة منتهى الجموع كلُّ جمع تكسير بعد ألفه حرفان أو ثلاثةٌ أوسطها ساكن، وهي ممنوعة لعلّة واحدة لأنها فرعٌ عن الجمع وفرعٌ في الصيغة.","d":["لأن ما قبلها في «تكافؤ» مضموم، وما قبلها في «عبء» ساكن","جائز التقديم، لأن المبتدأ معرفة والخبر شبه جملة","يُبنى على السكون مع نون النسوة، وعلى الفتح مع نون التوكيد المباشِرة"]},{"q":"«سلّمتُ على عثمانَ» — أعرب «عثمان» وبيّن سبب المنع.","a":"اسم مجرور وعلامة جره الفتحة، ممنوع من الصرف للعَلَمية وزيادة الألف والنون","e":"فاجتمعت فيه علّتان: العلمية وهي أصل، وزيادة الألف والنون وهي فرع، ومتى اجتمعت علّتان من علل تسعٍ مُنع الاسم من الصرف.","d":["إذا كان الفعل غير ثلاثيّ أو كانت الصفة على وزن «أفعل»، فيُؤتى بمصدره منصوبًا بعد «أشدّ» ونحوها","يفدْ — فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، وحُذفت الياء لالتقاء الساكنين","مفردٌ مجرور بالإضافة"]},{"q":"«يعملون له ما يشاء من محاريبَ وتماثيلَ» — اضبط آخر «محاريب» وعلّل.","a":"محاريبَ — بالفتحة، لأنها على صيغة منتهى الجموع فهي ممنوعة من الصرف","e":"والشاهد أنّ حرف الجرّ «من» داخلٌ عليها ومع ذلك لم تُكسَر، وهذا من أوضح ما يُستدلّ به على أنّ الممنوع يُجرّ بالفتحة.","d":["تُكتب على ما يناسب حركة الحرف الذي قبلها لا حركتَها هي، فإن سكن ما قبلها كُتبت على السطر","الإتباع على البدلية «إلا محمدٌ» هو الأفصح، والنصب جائز","النعت والتوكيد والبدل والعطف، والجامع بينها أنها تتبع ما قبلها في الإعراب"]},{"q":"«قرأتُ ... قصصٍ» — اختر الصواب: خمسةَ / خمسَ / خمسًا","a":"خمسَ","e":"لأن مفرد «قصص» قصّةٌ وهي مؤنثة، والعدد من ثلاثة إلى عشرة يخالف معدوده، فيُجرَّد من التاء مع المؤنث. والعبرة بمفرد المعدود لا بلفظ الجمع.","d":["خمسةَ","خمسًا","المادة السادسة والسبعون"]},{"q":"ما حكم تمييز الأعداد من ١١ إلى ٩٩؟","a":"مفردٌ منصوب","e":"لأن هذه الأعداد مركّبةٌ أو معطوفة، وقد طال لفظها فخُفِّف تمييزها بالإفراد، ونُصب على التمييز لرفعه إبهام العدد.","d":["تمييز ملحوظ منصوب","اسم «لا» النافية للجنس مبنيّ على الفتح في محل نصب","مفعول فيه، ظرف زمان منصوب وعلامة نصبه الفتحة"]},{"q":"«كتبتُ ٢٨ ورقة» — اكتبها بالحروف مضبوطةً.","a":"كتبتُ ثمانيَ وعشرين ورقةً","e":"لأن «ورقة» مؤنثة فتُجرَّد «ثماني» من التاء على قاعدة المخالفة، والتمييز مفردٌ منصوب لأن العدد بين أحد عشر وتسعة وتسعين.","d":["أسلوب قصر بتقديم المفعول «إيّاك» على الفعل","استفهام غرضه التعجّب والاستنكار","تشبيه بليغ، لحذف أداة التشبيه ووجه الشبه معًا"]},{"q":"ما حكم تمييز المئة والألف ومضاعفاتهما؟","a":"مفردٌ مجرور بالإضافة","e":"لأن المئة والألف مضافتان إلى تمييزهما، والمضاف إليه مجرورٌ أبدًا، بخلاف تمييز العقود فإنه منصوب.","d":["اسم «لا» النافية للجنس مبنيّ على الفتح في محل نصب","تمييز ملحوظ منصوب","مفعول فيه، ظرف زمان منصوب وعلامة نصبه الفتحة"]},{"q":"«المادة ٧٦» — اقرأها قراءةً صحيحة.","a":"المادة السادسة والسبعون","e":"لأن العدد هنا وصفٌ لمعدود مؤنث فيُصاغ على وزن «فاعل» ويُطابق موصوفه، ويُقدَّم الجزء الأصغر على العقد في النطق العربي.","d":["خمسَ","خبر ثانٍ لـ«إنّ» مرفوع","اسم «ليس» مؤخَّر مرفوع وعلامة رفعه الضمة"]},{"q":"ما وزن اسم الفاعل من الفعل غير الثلاثي؟ مع المثال.","a":"على وزن مضارعه بإبدال حرف المضارعة ميمًا مضمومة وكسر ما قبل الآخر، نحو «مُستخرِج»","e":"واسمُ المفعول مثله إلا أنه يُفتح ما قبل آخره: «مُستخرَج»، فالفارقُ بينهما حركةٌ واحدة، وهي مَزلَقٌ يكثر السؤال عنه.","d":["لأن ما قبلها في «تكافؤ» مضموم، وما قبلها في «عبء» ساكن","محاريبَ — بالفتحة، لأنها على صيغة منتهى الجموع فهي ممنوعة من الصرف","جائز التقديم، لأن المبتدأ معرفة والخبر شبه جملة"]},{"q":"ما علامات إعراب الأسماء الخمسة؟ وما شروط إعرابها بالحروف؟","a":"تُرفع بالواو وتُنصب بالألف وتُجرّ بالياء، بشرط أن تكون مفردةً مكبَّرةً مضافةً إلى غير ياء المتكلم","e":"فإن ثُنّيت أو جُمعت أو صُغِّرت أو قُطعت عن الإضافة أُعربت بالحركات، ولهذا تقول «هذا أبٌ» بالضمة لا بالواو.","d":["كلّ مضارع اتصلت به ألف الاثنين أو واو الجماعة أو ياء المخاطبة، تُرفع بثبوت النون وتُنصب وتُجزم بحذفها","المقصور تُقدَّر فيه الحركات الثلاث للتعذّر، والمنقوص تُقدَّر فيه الضمة والكسرة للثقل وتظهر الفتحة","لأن ما قبلها في «تكافؤ» مضموم، وما قبلها في «عبء» ساكن"]},{"q":"«أذاكرُ رغبةً في النجاح» — أعرب «رغبة» واذكر شروط بابها.","a":"مفعول لأجله منصوب، وشرطه أن يكون مصدرًا قلبيًّا متّحدًا مع الفعل في الزمان والفاعل","e":"فالرغبة فعلٌ قلبيّ لا جارحيّ، ووقتها وقتُ المذاكرة، وفاعلها فاعلُ المذاكرة، فاجتمعت الشروط الثلاثة فصحّ النصب.","d":["إذا كان الفعل غير ثلاثيّ أو كانت الصفة على وزن «أفعل»، فيُؤتى بمصدره منصوبًا بعد «أشدّ» ونحوها","الأولى مبنية على السكون لاتصالها بنون النسوة، والثانية مرفوعة بثبوت النون من الأفعال الخمسة","مفردٌ مجرور بالإضافة"]},{"q":"ما الأفعال الخمسة؟ وبمَ تُرفع وبمَ تُنصب وتُجزم؟","a":"كلّ مضارع اتصلت به ألف الاثنين أو واو الجماعة أو ياء المخاطبة، تُرفع بثبوت النون وتُنصب وتُجزم بحذفها","e":"وسُمّيت خمسةً لأنها خمس صيغ: يفعلان، تفعلان، يفعلون، تفعلون، تفعلين. والنونُ فيها علامةُ إعراب لا ضمير.","d":["المقصور تُقدَّر فيه الحركات الثلاث للتعذّر، والمنقوص تُقدَّر فيه الضمة والكسرة للثقل وتظهر الفتحة","تُرفع بالواو وتُنصب بالألف وتُجرّ بالياء، بشرط أن تكون مفردةً مكبَّرةً مضافةً إلى غير ياء المتكلم","يُجرّ بالفتحة نيابةً عن الكسرة، وترجع الكسرة إذا اقترن بـ«أل» أو أُضيف"]},{"q":"«ذهب أحمدُ إلى المدرسة صباحًا» — أعرب «صباحًا».","a":"مفعول فيه، ظرف زمان منصوب وعلامة نصبه الفتحة","e":"لأنه اسم زمان وقع فيه الحدث متضمّنًا معنى «في»، وهذا هو ضابط الظرفية: تضمُّنُ الاسم معنى «في» ظرفيةً.","d":["فعل مضارع مرفوع وعلامة رفعه الضمة المقدَّرة على الألف منع من ظهورها التعذّر","يفدْ — فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، وحُذفت الياء لالتقاء الساكنين","خبر ثانٍ لـ«إنّ» مرفوع"]},{"q":"ما قاعدة النسب إلى المختوم بتاء التأنيث وإلى المقصور الثلاثي؟","a":"تُحذف تاء التأنيث في النسب، وتُقلب ألف المقصور الثلاثي واوًا","e":"فتقول في «مكّة» مكّيّ، وفي «فتى» فَتَوِيّ. وعلّةُ القلب أن ياء النسب مشدَّدة ثقيلة، فلا تجتمع مع الألف الساكنة قبلها.","d":["إذا كان المبتدأ نكرةً محضة والخبر شبه جملة، نحو «فيكم بركةٌ»","جائز التقديم، لأن المبتدأ معرفة والخبر شبه جملة","النعت والتوكيد والبدل والعطف، والجامع بينها أنها تتبع ما قبلها في الإعراب"]},{"q":"ما أوزان تصغير الاسم الثلاثي والرباعي والخماسي؟","a":"فُعَيل للثلاثي، وفُعَيعِل للرباعي، وفُعَيعِيل لما قبل آخره حرف مدّ","e":"فتقول: رجل ← رُجَيل، درهم ← دُرَيهم، مفتاح ← مُفَيتيح. والتصغيرُ يردّ الأشياء إلى أصولها، فتُكشف به الحروف المحذوفة والمقلوبة.","d":["بالسكون إن كان صحيح الآخر، وبحذف حرف العلة إن كان معتلّه، وبحذف النون إن كان من الأفعال الخمسة","نقطتان رأسيتان بعد القول، وعلامة تعجّب في آخر الجملة","جائز التقديم، لأن المبتدأ معرفة والخبر شبه جملة"]},{"q":"«مصرُ أعظمُ البلاد حضارةً» — أعرب «حضارة».","a":"تمييز ملحوظ منصوب","e":"لأن النسبة في «أعظم البلاد» مبهمة: أعظم في ماذا؟ فجاء التمييز ليرفع هذا الإبهام عن الجملة لا عن مفردٍ فيها.","d":["مفردٌ منصوب","اسم «لا» النافية للجنس مبنيّ على الفتح في محل نصب","مفردٌ مجرور بالإضافة"]},{"q":"متى يُصاغ اسم التفضيل على غير وزن «أفعل»؟ وكيف؟","a":"إذا كان الفعل غير ثلاثيّ أو كانت الصفة على وزن «أفعل»، فيُؤتى بمصدره منصوبًا بعد «أشدّ» ونحوها","e":"فتقول «هو أشدُّ استخراجًا» و«أشدُّ حمرةً»، لأن الوزن «أفعل» محجوزٌ للون والعيب، فلا يُبنى منه تفضيلٌ لئلّا يلتبس.","d":["الأولى مفعول به منصوب على الإغراء لفعل محذوف تقديره «الزم»، والثانية توكيد لفظي","توكيد معنوي منصوب","اسم مجرور وعلامة جره الفتحة، ممنوع من الصرف للعَلَمية وزيادة الألف والنون"]},{"q":"ما الفرق بين «كم» الاستفهامية و«كم» الخبرية في تمييزهما؟","a":"تمييز الاستفهامية مفردٌ منصوب، وتمييز الخبرية مفردٌ أو جمعٌ مجرور","e":"فتقول «كم كتابًا قرأتَ؟» و«كم كتابٍ قرأتُ!»، والفارقُ أن الخبرية في معنى «كثير» فأُضيفت إلى تمييزها كما يُضاف الكثير.","d":["اسم مجرور وعلامة جره الفتحة، ممنوع من الصرف للعَلَمية وزيادة الألف والنون","اسم «ليس» مؤخَّر مرفوع وعلامة رفعه الضمة","اسم «لا» النافية للجنس مبنيّ على الفتح في محل نصب"]},{"q":"ما التوابع الأربعة؟ وما الجامع بينها؟","a":"النعت والتوكيد والبدل والعطف، والجامع بينها أنها تتبع ما قبلها في الإعراب","e":"ولا عاملَ لها مستقلّ، بل العاملُ في المتبوع هو العامل فيها، ولهذا لا يُسأل عن عاملها وإنما عن نوع تبعيّتها.","d":["أدوات الشرط تجزم فعلين إلا «لم» و«لمّا» و«لام الأمر» و«لا الناهية» فتجزم فعلًا واحدًا","لأن ما قبلها في «تكافؤ» مضموم، وما قبلها في «عبء» ساكن","نقطتان رأسيتان بعد القول، وعلامة تعجّب في آخر الجملة"]},{"q":"«ما قام القومُ إلا محمدًا/محمدٌ» — أيّهما الأفصح ولماذا؟","a":"الإتباع على البدلية «إلا محمدٌ» هو الأفصح، والنصب جائز","e":"لأن الكلام تامّ منفيّ، والبدلُ فيه أقوى لأنه يُشرك الثاني في حكم الأول نفيًا، وعليه جاء قوله تعالى «ما فعلوه إلا قليلٌ منهم».","d":["لأن ما قبلها في «تكافؤ» مضموم، وما قبلها في «عبء» ساكن","تُحذف تاء التأنيث في النسب، وتُقلب ألف المقصور الثلاثي واوًا","نقطتان رأسيتان بعد القول، وعلامة تعجّب في آخر الجملة"]},{"q":"ما أدوات الشرط الجازمة؟ وأيّها يجزم فعلًا واحدًا؟","a":"أدوات الشرط تجزم فعلين إلا «لم» و«لمّا» و«لام الأمر» و«لا الناهية» فتجزم فعلًا واحدًا","e":"والجازمةُ لفعلين: إن، مَن، ما، مهما، متى، أيّان، أين، أنّى، حيثما، كيفما، أيّ. والفارقُ أن الأولى حروفُ جزمٍ لا أدوات شرط.","d":["نقطتان رأسيتان بعد القول، وعلامة تعجّب في آخر الجملة","إذا كان المبتدأ نكرةً محضة والخبر شبه جملة، نحو «فيكم بركةٌ»","لأنه على صيغة منتهى الجموع، وهي علّة واحدة تكفي لمنع الصرف"]},{"q":"ما الفرق بين جمع القلّة وجمع الكثرة؟ مع أوزان القلّة.","a":"القلّة لما بين الثلاثة والعشرة، وأوزانه أربعة: أفعُل وأفعال وأفعِلة وفِعلة","e":"وما عداها فجموعُ كثرة لما فوق العشرة، وقد يُستعمل أحدهما موضع الآخر بقرينة، كقوله تعالى «ثلاثةَ قروء» والقُروء جمع كثرة.","d":["الإتباع على البدلية «إلا محمدٌ» هو الأفصح، والنصب جائز","على وزن مضارعه بإبدال حرف المضارعة ميمًا مضمومة وكسر ما قبل الآخر، نحو «مُستخرِج»","بالسكون إن كان صحيح الآخر، وبحذف حرف العلة إن كان معتلّه، وبحذف النون إن كان من الأفعال الخمسة"]},{"q":"ما الفرق بين بدل البعض من كلّ وبدل الاشتمال؟","a":"بدل البعض جزءٌ حسّيّ من المبدل منه، وبدل الاشتمال معنًى يشتمل عليه","e":"فتقول «أكلتُ الرغيفَ ثلثَه» والثلثُ جزءٌ محسوس، وتقول «أعجبني زيدٌ علمُه» والعلمُ ليس جزءًا منه بل معنًى قائم به.","d":["القلّة لما بين الثلاثة والعشرة، وأوزانه أربعة: أفعُل وأفعال وأفعِلة وفِعلة","يُبنى على السكون مع نون النسوة، وعلى الفتح مع نون التوكيد المباشِرة","بالسكون إن كان صحيح الآخر، وبحذف حرف العلة إن كان معتلّه، وبحذف النون إن كان من الأفعال الخمسة"]},{"q":"«رأيتُ الأسدَ عينَه» — ما إعراب «عينه»؟","a":"توكيد معنوي منصوب","e":"لأن «عين» من ألفاظ التوكيد المعنوي التي ترفع احتمال إرادة المجاز، فالمراد الأسدُ الحيوانُ نفسه لا الرجلُ الشجاع.","d":["تمييز ملحوظ منصوب","اسم «لا» النافية للجنس مبنيّ على الفتح في محل نصب","مفعول فيه، ظرف زمان منصوب وعلامة نصبه الفتحة"]},{"q":"«أخاكَ أخاكَ إنّ مَن لا أخا له» — أعرب «أخاك» الأولى والثانية.","a":"الأولى مفعول به منصوب على الإغراء لفعل محذوف تقديره «الزم»، والثانية توكيد لفظي","e":"والإغراء تنبيهُ المخاطب على أمرٍ محمود ليلزمه، وتكرارُ اللفظ فيه توكيدٌ لفظيّ يزيد المعنى رسوخًا. والبيت منسوب لمسكين الدارمي.","d":["مفعول لأجله منصوب، وشرطه أن يكون مصدرًا قلبيًّا متّحدًا مع الفعل في الزمان والفاعل","مفردٌ منصوب","خبر ثانٍ لـ«إنّ» مرفوع"]},{"q":"«سبحانك لا علمَ لنا إلا ما علّمتنا» — أعرب «علم».","a":"اسم «لا» النافية للجنس مبنيّ على الفتح في محل نصب","e":"لأنه نكرةٌ مفردة متّصلة بـ«لا» غيرُ مفصولة عنها، وهذه شروط إعمالها عمل «إنّ»، وهي تنفي الجنس على سبيل الاستغراق.","d":["الأولى مبنية على السكون لاتصالها بنون النسوة، والثانية مرفوعة بثبوت النون من الأفعال الخمسة","اسم «ليس» مؤخَّر مرفوع وعلامة رفعه الضمة","فعل مضارع مرفوع وعلامة رفعه الضمة المقدَّرة على الألف منع من ظهورها التعذّر"]},{"q":"«ليس للعلمِ حدودُ» — أعرب «حدود».","a":"اسم «ليس» مؤخَّر مرفوع وعلامة رفعه الضمة","e":"لأن «للعلم» جارّ ومجرور في محل نصب خبر «ليس» مقدَّم، فوجب رفعُ ما بعده على أنه الاسم، ولا يصحّ نصبُه لأنه ليس خبرًا.","d":["يفدْ — فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، وحُذفت الياء لالتقاء الساكنين","مفردٌ مجرور بالإضافة","اسم مجرور وعلامة جره الفتحة، ممنوع من الصرف للعَلَمية وزيادة الألف والنون"]},{"q":"«إنّ اللهَ غفورٌ رحيمٌ» — أعرب «رحيم».","a":"خبر ثانٍ لـ«إنّ» مرفوع","e":"لأن «إنّ» يجوز تعدُّد خبرها كما يتعدّد خبر المبتدأ، والوصفان كلاهما مسنَدان إلى الاسم من غير عطف، فلم يكن الثاني نعتًا بل خبرًا.","d":["مفعول فيه، ظرف زمان منصوب وعلامة نصبه الفتحة","مفردٌ منصوب","مفردٌ مجرور بالإضافة"]},{"q":"ما حكم تقديم الخبر على المبتدأ في «عليكم السلامُ»؟","a":"جائز التقديم، لأن المبتدأ معرفة والخبر شبه جملة","e":"فلا لَبس في الإسناد لتعيُّن المعرفة للابتداء، فجاز التقديم لغرض بلاغيّ كالاهتمام، ولم يجب لعدم المقتضي.","d":["يُبنى على السكون مع نون النسوة، وعلى الفتح مع نون التوكيد المباشِرة","نقطتان رأسيتان بعد القول، وعلامة تعجّب في آخر الجملة","على وزن مضارعه بإبدال حرف المضارعة ميمًا مضمومة وكسر ما قبل الآخر، نحو «مُستخرِج»"]},{"q":"متى يجب تقديم الخبر على المبتدأ؟ مع المثال.","a":"إذا كان المبتدأ نكرةً محضة والخبر شبه جملة، نحو «فيكم بركةٌ»","e":"لأن النكرة لا يُبتدأ بها لعدم الفائدة، فلو قُدِّمت لالتبس الخبرُ بالصفة، فوجب التقديم تحصيلًا للفائدة ودفعًا للّبس.","d":["لأنه على صيغة منتهى الجموع، وهي علّة واحدة تكفي لمنع الصرف","تُكتب على ما يناسب حركة الحرف الذي قبلها لا حركتَها هي، فإن سكن ما قبلها كُتبت على السطر","النعت والتوكيد والبدل والعطف، والجامع بينها أنها تتبع ما قبلها في الإعراب"]},{"q":"متى يُبنى الفعل المضارع؟ وعلى أيّ شيء؟","a":"يُبنى على السكون مع نون النسوة، وعلى الفتح مع نون التوكيد المباشِرة","e":"لأن نون النسوة ضميرُ رفعٍ متّصل فأشبه الفعل بها الماضيَ المبنيّ، ونونُ التوكيد لمّا باشرته ركّبته معها تركيبًا فأوجبت البناء.","d":["القلّة لما بين الثلاثة والعشرة، وأوزانه أربعة: أفعُل وأفعال وأفعِلة وفِعلة","أدوات الشرط تجزم فعلين إلا «لم» و«لمّا» و«لام الأمر» و«لا الناهية» فتجزم فعلًا واحدًا","نقطتان رأسيتان بعد القول، وعلامة تعجّب في آخر الجملة"]},{"q":"«النساءُ يرجون الخيرَ» و«الرجالُ يرجون» — ما الفرق في إعراب «يرجون»؟","a":"الأولى مبنية على السكون لاتصالها بنون النسوة، والثانية مرفوعة بثبوت النون من الأفعال الخمسة","e":"فالنون في الأولى ضميرٌ فاعل، وفي الثانية علامةُ إعراب، واللفظ واحدٌ والفرق في الواو: ضميرٌ في الثانية وحرفُ إشباع في الأولى.","d":["فعل مضارع مرفوع وعلامة رفعه الضمة المقدَّرة على الألف منع من ظهورها التعذّر","الأولى مفعول به منصوب على الإغراء لفعل محذوف تقديره «الزم»، والثانية توكيد لفظي","مفعول فيه، ظرف زمان منصوب وعلامة نصبه الفتحة"]},{"q":"«لم ... الكذبُ صاحبَه» — أيّهما الصواب: يفيد أم يفد؟ ولماذا؟","a":"يفدْ — فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون، وحُذفت الياء لالتقاء الساكنين","e":"فأصل الفعل «يفيد»، فلمّا جُزم سكنت الدال، والتقى ساكنان: الياءُ والدال، فحُذفت الياء تخلّصًا من التقاء الساكنين.","d":["الأولى مفعول به منصوب على الإغراء لفعل محذوف تقديره «الزم»، والثانية توكيد لفظي","مفردٌ مجرور بالإضافة","فعل مضارع مرفوع وعلامة رفعه الضمة المقدَّرة على الألف منع من ظهورها التعذّر"]},{"q":"«يتوارى» — أعرب هذا الفعل إذا وقع مرفوعًا.","a":"فعل مضارع مرفوع وعلامة رفعه الضمة المقدَّرة على الألف منع من ظهورها التعذّر","e":"لأن آخره ألفٌ لازمة لا تقبل الحركة أصلًا، فتعذَّر ظهورُ الحركة عليها، وهذا هو الفرق بين التعذّر في المقصور والثقل في المنقوص.","d":["تمييز ملحوظ منصوب","مفردٌ مجرور بالإضافة","خبر ثانٍ لـ«إنّ» مرفوع"]},{"q":"ما الفرق بين الإعراب المقدَّر في الاسم المقصور والمنقوص؟","a":"المقصور تُقدَّر فيه الحركات الثلاث للتعذّر، والمنقوص تُقدَّر فيه الضمة والكسرة للثقل وتظهر الفتحة","e":"لأن الألف لا تقبل حركةً بحال فتعذَّر، والياء تقبلها لكن الضمة والكسرة عليها ثقيلتان، والفتحة خفيفة فظهرت.","d":["تُرفع بالواو وتُنصب بالألف وتُجرّ بالياء، بشرط أن تكون مفردةً مكبَّرةً مضافةً إلى غير ياء المتكلم","كلّ مضارع اتصلت به ألف الاثنين أو واو الجماعة أو ياء المخاطبة، تُرفع بثبوت النون وتُنصب وتُجزم بحذفها","الإتباع على البدلية «إلا محمدٌ» هو الأفصح، والنصب جائز"]},{"q":"كيف يُجزم فعل الشرط وجوابه؟ اذكر الحالات الثلاث.","a":"بالسكون إن كان صحيح الآخر، وبحذف حرف العلة إن كان معتلّه، وبحذف النون إن كان من الأفعال الخمسة","e":"لأن الجزم في الأصل إسكانٌ، فإذا تعذّر الإسكان لعلّةٍ في الآخر نابت عنه علامةٌ أخرى: حذفُ الحرف أو حذفُ النون.","d":["يُجرّ بالفتحة نيابةً عن الكسرة، وترجع الكسرة إذا اقترن بـ«أل» أو أُضيف","لأنه على صيغة منتهى الجموع، وهي علّة واحدة تكفي لمنع الصرف","لأن ما قبلها في «تكافؤ» مضموم، وما قبلها في «عبء» ساكن"]},{"q":"ما القاعدة الكلّية في رسم الهمزة المتطرفة؟","a":"تُكتب على ما يناسب حركة الحرف الذي قبلها لا حركتَها هي، فإن سكن ما قبلها كُتبت على السطر","e":"لأن الهمزة المتطرفة ساكنةٌ في التقدير أو ضعيفةُ الحركة، فاعتُبر ما قبلها، وهذا هو موضع الغلط الأكثر في هذا الباب.","d":["أدوات الشرط تجزم فعلين إلا «لم» و«لمّا» و«لام الأمر» و«لا الناهية» فتجزم فعلًا واحدًا","جائز التقديم، لأن المبتدأ معرفة والخبر شبه جملة","يُجرّ بالفتحة نيابةً عن الكسرة، وترجع الكسرة إذا اقترن بـ«أل» أو أُضيف"]},{"q":"لماذا كُتبت الهمزة على الواو في «تكافؤ» وعلى السطر في «عبء»؟","a":"لأن ما قبلها في «تكافؤ» مضموم، وما قبلها في «عبء» ساكن","e":"فالضمة تناسبها الواو، والساكنُ لا حركة له تُناسب حرفًا فتُكتب الهمزة مفردةً على السطر، وهذا جارٍ على القاعدة الكلّية نفسها.","d":["بالسكون إن كان صحيح الآخر، وبحذف حرف العلة إن كان معتلّه، وبحذف النون إن كان من الأفعال الخمسة","تُكتب على ما يناسب حركة الحرف الذي قبلها لا حركتَها هي، فإن سكن ما قبلها كُتبت على السطر","يُبنى على السكون مع نون النسوة، وعلى الفتح مع نون التوكيد المباشِرة"]},{"q":"ما علامة الترقيم المناسبة في «قال المعلم ... ما أجمل السماء ...»؟","a":"نقطتان رأسيتان بعد القول، وعلامة تعجّب في آخر الجملة","e":"لأن النقطتين توضعان قبل المقول وقبل التعداد والتفسير، وعلامةَ التعجّب توضع بعد أسلوب التعجّب القياسيّ «ما أفعله».","d":["يُبنى على السكون مع نون النسوة، وعلى الفتح مع نون التوكيد المباشِرة","بدل البعض جزءٌ حسّيّ من المبدل منه، وبدل الاشتمال معنًى يشتمل عليه","الإتباع على البدلية «إلا محمدٌ» هو الأفصح، والنصب جائز"]},{"q":"«إيّاك نعبدُ وإيّاك نستعين» — ما الأسلوب البلاغي؟ وما سرّه؟","a":"أسلوب قصر بتقديم المفعول «إيّاك» على الفعل","e":"لأن تقديم ما حقُّه التأخير يفيد الاختصاص، فأفاد قصرَ العبادة والاستعانة على الله وحده، وهو قصرُ صفةٍ على موصوف.","d":["تشبيه بليغ، لحذف أداة التشبيه ووجه الشبه معًا","استفهام غرضه التعجّب والاستنكار","كتبتُ ثمانيَ وعشرين ورقةً"]},{"q":"«أيُضحَكُ مأثورٌ؟» — ما نوع الأسلوب وما غرضه؟","a":"استفهام غرضه التعجّب والاستنكار","e":"لأن المتكلم لا يطلب علمًا بما يجهل، وإنما يُنكر وقوع الأمر ويتعجّب منه، فخرج الاستفهام عن حقيقته إلى هذا الغرض البلاغي.","d":["تشبيه بليغ، لحذف أداة التشبيه ووجه الشبه معًا","أسلوب قصر بتقديم المفعول «إيّاك» على الفعل","كتبتُ ثمانيَ وعشرين ورقةً"]},{"q":"«صمٌّ بكمٌ عميٌ» — ما نوع التشبيه؟ ولماذا؟","a":"تشبيه بليغ، لحذف أداة التشبيه ووجه الشبه معًا","e":"فالتقدير «هم كالصمّ البكم العمي»، فلمّا حُذفت الأداة والوجه ادّعي أنّ المشبَّه هو عينُ المشبَّه به، فبلغ التشبيه أعلى مراتبه.","d":["استفهام غرضه التعجّب والاستنكار","كتبتُ ثمانيَ وعشرين ورقةً","أسلوب قصر بتقديم المفعول «إيّاك» على الفعل"]}],"r":[{"t":"بطاقة الاختبار الأول كما هي في «اختبارات مختارة لك»","b":"\n<p>هذه بطاقةٌ ظهرت في الدوّارة على الصفحة الرئيسة من المنصة، ونصُّها كما هو:\n<b>«تخصص لغة عربية – الأسئلة الأكثر تكرارًا – الشواهد النحوية والنصوص»</b>،\nوتحتها شارتان: <b>«تخصص»</b> و<b>«٤٠ سؤال»</b>، وزرّ «ابدأ الاختبار».\nوقد تكرّرت البطاقة نفسها مرتين في الدوّارة، إحداهما موسومة بـ«(نسخة)»،\nفالعدد المعروض أربعُ بطاقات لا أربعةُ اختبارات متباينة.</p>\n\n<p><b>ولم أفتح هذا الاختبار على المنصة ولم أُجِب عنه هناك.</b> زرُّ «ابدأ الاختبار»\nيفتح واجهةً برمجية لا يظهر نصُّها إلا بعد تحميل الأسئلة داخل المتصفح،\nوقسمُ المشتركين مقيَّد بجلسةٍ واحدة لكل جهاز، فالدخول إليه انتحالُ حسابِ صاحبه.\nفالذي فعلتُه بدلًا من ذلك أنّي <b>كتبتُ الاختبار كاملًا</b> على مواصفات البطاقة:\nأربعون سؤالًا في تخصّص اللغة العربية، مدارها على المسائل الأكثر دورانًا في المسابقة،\nوكلُّ سؤال مصحوبٌ بإجابته وتعليلها.</p>\n\n<p><b>لماذا هذه المسائل بالذات؟</b> لأنّ المسألة إنما تتكرّر في الاختبارات إذا اجتمع فيها\nأمران: أن تكون <b>قاعدةً كلّية</b> يُقاس عليها كثير، وأن يكون فيها <b>مَزلَق</b> يُخطئ فيه\nأكثرُ الناس. فالممنوع من الصرف يجمع الأمرين: قاعدته منضبطة، والمَزلَق فيه أنّ جرّه\nبالفتحة لا بالكسرة. وعلى هذا المعيار بُني انتقاء الأربعين.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>«مختارة لك» عنوانٌ تسويقيّ لا تشخيصيّ</b> — الدوّارة لا تقرأ مستواك ولا تعرف ضعفك، وإنما تعرض ما يُقبل عليه الناس. فلا تجعل ترتيبها ترتيبَ مذاكرتك؛ ابدأ بأضعف أبوابك أنت، وهو ما تعرفه من أخطائك لا من واجهة موقع.</li><li><b>أربع بطاقات لا أربعة اختبارات</b> — بطاقتان منها نصٌّ واحد، إحداهما موسومة بـ«(نسخة)». وقد فصلتُ عنوانها المركَّب إلى اختبارين: «الأكثر تكرارًا» و«الشواهد والنصوص»، فصار لك ثمانون سؤالًا بدل أربعين مكرَّرة.</li><li><b>«الأكثر تكرارًا» ليس وعدًا بأن تأتي هذه الأسئلة بعينها</b> — وإنما هو إخبارٌ عن <b>المسائل</b> التي يدور عليها واضعو الأسئلة. فاحفظ المسألة لا السؤال، فإنّ السؤال يتبدّل لفظُه ويثبت مدارُه.</li><li><b>معيار التكرار الذي بُني عليه الانتقاء:</b> أن تكون المسألة قاعدةً كلّية يُقاس عليها كثير، وأن يكون فيها مَزلَقٌ يُخطئ فيه الأكثرون. فما اجتمع فيه الأمران تكرّر، وما فقد أحدهما نَدَر. وهذا أضبط من عدّ الأسئلة عدًّا.</li><li><b>لا تُهمل زمنك</b> — أربعون سؤالًا في اختبار التخصّص تُعطى عادةً في أربعين دقيقة أو أقلّ. فجرّب هذا الاختبار في «وضع الاختبار» بهذه الصفحة مرّةً بلا توقيت لتفهم، ومرّةً بتوقيتٍ لتقيس.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: النحو الوافي · جامع الدروس العربية · أوضح المسالك · قواعد الإملاء لعبد السلام هارون</p></div>"},{"t":"خريطة المسائل الأكثر دورانًا — وما المَزلَق في كل واحدة","b":"\n<p>هذا جدولُ المسائل التي يدور عليها هذا الاختبار، ومعها موضعُ الغلط في كل مسألة،\nفإنّ حفظ موضع الغلط أنفعُ من حفظ القاعدة وحدها:</p>\n<ol>\n<li><b>الممنوع من الصرف</b> — المَزلَق: جرُّه بالكسرة. والصواب الفتحةُ ما لم يُعرَّف بـ«أل»\nأو يُضَف، فإن عُرِّف أو أُضيف عاد إلى الكسرة: «في مساجدَ» لكن «في المساجدِ» و«في مساجدِ المدينة».</li>\n\n<li><b>العدد وتمييزه</b> — المَزلَق: مخالفةُ العدد لمعدوده. فالثلاثة إلى العشرة تخالف،\nوالواحد والاثنان يوافقان، وتمييز ١١–٩٩ مفردٌ منصوب، وتمييز المئة والألف مفردٌ مجرور.</li>\n\n<li><b>المنصوبات</b> — المَزلَق: الخلط بين المفعول فيه والمفعول المطلق والحال.\nوالفيصل أنّ المفعول المطلق من لفظ الفعل، والمفعول فيه ظرف، والحالَ تبيّن الهيئة.</li>\n\n<li><b>البدل</b> — المَزلَق: الخلط بين بدل البعض وبدل الاشتمال. والفيصل أنّ بدل البعض\n<b>جزءٌ حسّيّ</b> من المبدل منه، وبدل الاشتمال <b>معنًى</b> يشتمل عليه.</li>\n\n<li><b>الاستثناء</b> — المَزلَق: نصبُ المستثنى في التامّ المنفيّ. والأفصحُ فيه الإتباعُ\nعلى البدلية، والنصبُ جائز لا راجح.</li>\n\n<li><b>الإعراب التقديري</b> — المَزلَق: نسيانُ أنّ المقصور تُقدَّر فيه الحركات الثلاث للتعذّر،\nوالمنقوصَ تُقدَّر فيه الضمة والكسرة للثقل وتظهر الفتحة.</li>\n\n<li><b>الهمزة المتطرفة</b> — المَزلَق: النظرُ إلى حركة الهمزة نفسها. والقاعدة أنّ العبرة\nبحركة <b>ما قبلها</b> لا بحركتها هي.</li>\n\n<li><b>تقديم الخبر</b> — المَزلَق: الخلط بين الجائز والواجب. فيجب التقديم إذا كان المبتدأ\nنكرةً محضة والخبرُ شبهَ جملة، ويجوز إذا كان المبتدأ معرفة.</li>\n\n<li><b>الأغراض البلاغية</b> — المَزلَق: الاكتفاء بتسمية الأسلوب دون غرضه.\nوالسؤال يقع على الغرض غالبًا لا على الاسم.</li>\n\n<li><b>الصور البيانية</b> — المَزلَق: الخلط بين الاستعارة المكنية والتشبيه البليغ.\nوالفيصل أنّ المكنية يُحذف فيها المشبَّه به ويُرمز له بلازمه، والبليغَ يُذكر فيه الطرفان.</li>\n</ol>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الممنوع من الصرف: العلّة الواحدة والعلّتان</b> — صيغةُ منتهى الجموع وألفُ التأنيث الممدودة والمقصورة تمنع بعلّةٍ واحدة، وما عداها يحتاج علّتين. فلا تطلب علّتين في «مساجد» ولا تكتفِ بواحدة في «عثمان».</li><li><b>العدد: العبرة بمفرد المعدود</b> — تقول «خمسُ قصصٍ» لأن مفردها «قصّة» مؤنث، و«خمسةُ كتبٍ» لأن مفردها «كتاب» مذكّر. ولا تنظر إلى لفظ الجمع فإنه يخدعك.</li><li><b>المفعول المطلق والمفعول فيه والحال</b> — الفيصل أنّ المطلق من لفظ الفعل، والمفعول فيه اسمُ زمانٍ أو مكان يتضمّن معنى «في»، والحالَ تُجيب عن «كيف؟». فاسأل السؤال المناسب يتبيّن لك الباب.</li><li><b>البدل: الحسّ والمعنى</b> — «أكلتُ الرغيفَ ثلثَه» بدلُ بعض لأن الثلث جزءٌ محسوس، و«أعجبني زيدٌ علمُه» بدلُ اشتمال لأن العلم معنًى لا جزء. وبدلُ الكلّ لا يحتاج ضميرًا، وأخواه يحتاجانه.</li><li><b>المستثنى في التامّ المنفيّ</b> — الأفصح الإتباعُ على البدلية، والنصبُ جائز. وقد نصّ المنهجُ المتداول على «النصب أو الإتباع» مطلقًا، والأدقّ ترجيحُ البدل، وعليه جاء التنزيل: «ما فعلوه إلا قليلٌ منهم».</li><li><b>الاستعارة المكنية والتشبيه البليغ</b> — في المكنية يُحذف المشبَّه به ويُرمز له بلازمٍ من لوازمه، وفي البليغ يُذكر الطرفان ويُحذف الوجه والأداة. فإن رأيتَ الطرفين مذكورين فليست مكنية البتّة.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الكتاب لسيبويه · شرح ابن عقيل · مغني اللبيب · شرح الأشموني وحاشية الصبان · التلخيص والإيضاح · النحو الوافي</p></div>"}]},{"c":"ex2","n":"٢· الشواهد والنصوص","q":[{"q":"«وقالوا الحمدُ لله الذي هدانا لهذا» — ما وجه الاستشهاد في رفع «الحمد»؟","a":"الرفع على الابتداء، والجملة تفيد الثبوت والدوام","e":"ولو نُصب «الحمدَ» على المصدرية لأفاد الحدوث والتجدّد، فاختير الرفعُ لأن حمد الله ثابتٌ لا متجدِّد، وهذا من دلالة الإعراب على المعنى.","d":["ميشيل معلوف، في البرازيل، وتميّزت بالمحافظة على عمود الشعر","بديع الزمان الهمذاني مبتدِعها، والحريريُّ بلغ به الغاية","النصب بالعطف على محلّ «رءوسكم» أو على «أيديكم»، وقُرئ بالجرّ على اللفظ"]},{"q":"«إنّ هذانِ لساحرانِ» — ما المشكل فيها؟ وما أشهر توجيهها؟","a":"جاء اسم «إنّ» بالألف وحقُّه النصب، وأشهر التوجيه أنها لغة بني الحارث في إلزام المثنّى الألف","e":"وقيل «إنْ» مخفّفة مهمَلة و«هذان» مبتدأ، وقيل الهاء ضمير شأن محذوف. والأوّل أشهرها عند النحاة وأسلمُها من التكلّف.","d":["جبران خليل جبران رئيسًا وميخائيل نعيمة أمينًا للسرّ، في نيويورك","أوّل كتابٍ جامع في النحو العربي، وهو أوثق مصادر الشواهد وأقدمها","الفصل بين الفعل وفاعله «شيء» بالمفعول، وجوازُ تقديم المفعول على الفاعل"]},{"q":"«لكنِ الراسخون في العلم منهم والمقيمين الصلاةَ» — ما وجه نصب «المقيمين»؟","a":"النصب على المدح بفعلٍ محذوف تقديره «أعني» أو «أمدح»","e":"وهو قطعُ النعت عن تبعيّته لإفادة المدح، وليس لحنًا كما توهّم بعضهم، بل بابٌ مقرَّر في العربية يُسمّى القطع للمدح أو الذمّ.","d":["«يا» حرف تنبيه لا نداء، والمنادى محذوف، وهو شاهد على نداء ما ليس أهلًا للنداء","وقوع اسم «إنّ» اسمًا موصولًا، ودخولُ اللام المزحلقة على الخبر","الرفع على الابتداء، والجملة تفيد الثبوت والدوام"]},{"q":"«إنما يخشى اللهَ من عبادِه العلماءُ» — أعرب «الله» و«العلماء» وبيّن النكتة.","a":"«الله» مفعول به منصوب، و«العلماء» فاعل مرفوع، وقُدّم المفعول لأنه أهمّ","e":"وتقديمُ المفعول هنا لتعظيم المخشيّ وبيان أنّ الخشية الحقّة لا تكون إلا منه، وهو من مواضع العناية التي يُقدَّم فيها غيرُ الفاعل.","d":["اسم «إنْ» المخفّفة مرفوع، ونُوِّن لقطعه عن الإضافة لفظًا مع نيّة المعنى","اسم «لا» النافية للجنس منصوب لأنه شبيه بالمضاف، و«ألا» للتمنّي","خبر «ليس» مقدَّم منصوب، والمصدر المؤوّل «أن تولّوا» اسمها مؤخّر"]},{"q":"«وإن كلٌّ لمّا جميعٌ لدينا مُحضَرون» — ما إعراب «كلّ» مع حذف المضاف إليه؟","a":"اسم «إنْ» المخفّفة مرفوع، ونُوِّن لقطعه عن الإضافة لفظًا مع نيّة المعنى","e":"و«كلّ» و«بعض» و«غير» إذا قُطعت عن الإضافة ونُوي معناها بُنيت أو أُعربت منوَّنة، وهذا من مسائل قطع المضاف عن الإضافة.","d":["اسم «لا» النافية للجنس منصوب لأنه شبيه بالمضاف، و«ألا» للتمنّي","على اللغة الحجازية، و«بشرًا» خبر «ما» منصوب","خبر «ليس» مقدَّم منصوب، والمصدر المؤوّل «أن تولّوا» اسمها مؤخّر"]},{"q":"«ما هذا بشرًا» — على أيّ لغة جاءت؟ وما إعراب «بشرًا»؟","a":"على اللغة الحجازية، و«بشرًا» خبر «ما» منصوب","e":"لأن أهل الحجاز يُعملون «ما» عمل «ليس» بشروطها، وبنو تميم يُهملونها فيرفعون، والقرآن نزل على لغة الحجاز في هذا الموضع.","d":["اسم «لا» النافية للجنس منصوب لأنه شبيه بالمضاف، و«ألا» للتمنّي","جواب الشرط «ومن يفعل ذلك»، وهو مجزوم بالسكون","اسم «إنْ» المخفّفة مرفوع، ونُوِّن لقطعه عن الإضافة لفظًا مع نيّة المعنى"]},{"q":"«ثم بدا لهم من بعدِ ما رأوا الآياتِ ليسجننّه» — ما نوع «ما» هنا؟","a":"مصدرية، والتقدير «من بعد رؤيتهم الآيات»","e":"و«ما» المصدرية تُسبك مع ما بعدها بمصدر، والفيصل بينها وبين الموصولة أنّ الموصولة تحتاج عائدًا والمصدرية لا تحتاجه.","d":["عطف على اسم «ليت» المحلّ، أو مبتدأ خبره محذوف","حذف نون «يكون» بعد الجزم تخفيفًا","عنترة بن شداد، والاستفهام غرضه النفي والتحسّر"]},{"q":"«يُضاعَفْ له العذابُ» في قراءة الجزم — بمَ جُزم؟","a":"جواب الشرط «ومن يفعل ذلك»، وهو مجزوم بالسكون","e":"فالفعل واقعٌ جوابًا لأداة الشرط «من»، وقُرئ بالرفع على الاستئناف، والقراءتان صحيحتان والاختلاف في التوجيه لا في الرسم.","d":["طرفة بن العبد، و«أطلال» مبتدأ مؤخّر مرفوع","على اللغة الحجازية، و«بشرًا» خبر «ما» منصوب","خبر «ليس» مقدَّم منصوب، والمصدر المؤوّل «أن تولّوا» اسمها مؤخّر"]},{"q":"«وامسحوا برءوسكم وأرجلَكم» — ما توجيه نصب «أرجلكم»؟","a":"النصب بالعطف على محلّ «رءوسكم» أو على «أيديكم»، وقُرئ بالجرّ على اللفظ","e":"فالجرُّ على الجوار أو على المسح، والنصبُ على الغسل، واختلاف القراءتين أفاد اختلاف الحكم الفقهيّ، وهذا من بلاغة الإعراب.","d":["جاء اسم «إنّ» بالألف وحقُّه النصب، وأشهر التوجيه أنها لغة بني الحارث في إلزام المثنّى الألف","إلى منتصف القرن الثاني في الأمصار، وإلى آخر الرابع في البوادي","مسكين الدارمي، والشاهد نصب «أخاك» على الإغراء بفعلٍ محذوف"]},{"q":"«إنّ الذين آمنوا والذين هادوا والصابئون» — ما وجه رفع «الصابئون»؟","a":"الرفع على الابتداء والخبر محذوف، أو على تقدير التأخير عن تمام الخبر","e":"وهو من أشهر ما يُسأل عنه، ومذهب سيبويه أنه مبتدأ خبره محذوف دلّ عليه ما بعده، لا أنه معطوفٌ على اسم «إنّ».","d":["جبران خليل جبران رئيسًا وميخائيل نعيمة أمينًا للسرّ، في نيويورك","عمل اسم الفاعل المقترن بـ«أل» وغيرِها عملَ فعله، فنصب «نصحه» مفعولًا ثانيًا","امرؤ القيس، على البحر الطويل، والشاهد جزم «نبكِ» في جواب الأمر"]},{"q":"«ليس البرَّ أن تُولّوا وجوهكم» — أعرب «البرّ» وبيّن الوجه الآخر.","a":"خبر «ليس» مقدَّم منصوب، والمصدر المؤوّل «أن تولّوا» اسمها مؤخّر","e":"وقُرئ برفع «البرُّ» على أنه الاسم والمصدرُ الخبر، والقراءتان متواترتان، والمعنى واحد والاختلاف في توزيع الاسم والخبر.","d":["على اللغة الحجازية، و«بشرًا» خبر «ما» منصوب","«الله» مفعول به منصوب، و«العلماء» فاعل مرفوع، وقُدّم المفعول لأنه أهمّ","جواب الشرط «ومن يفعل ذلك»، وهو مجزوم بالسكون"]},{"q":"«وجعلوا أصابعهم في آذانهم» — ما نوع المجاز؟ وما علاقته؟","a":"مجاز مرسل علاقته الكلّية، أُطلق الكلُّ وأُريد الجزء","e":"فالمراد أناملُهم لا أصابعهم كلّها، إذ لا تدخل الإصبع بتمامها في الأذن، فأُطلق الكلّ وأُريد الجزء وهي علاقة الكلّية لا الجزئية.","d":["أحمد زكي أبو شادي مؤسّسها، وأحمد شوقي رئيسها الفخري","الرفع على الابتداء، والجملة تفيد الثبوت والدوام","أوّل كتابٍ جامع في النحو العربي، وهو أوثق مصادر الشواهد وأقدمها"]},{"q":"«أخاكَ أخاكَ إنّ مَن لا أخا له ... كساعٍ إلى الهيجا بغير سلاحِ» — مَن قائله؟ وما الشاهد؟","a":"مسكين الدارمي، والشاهد نصب «أخاك» على الإغراء بفعلٍ محذوف","e":"والإغراءُ تنبيهُ المخاطب على أمرٍ محمود ليلزمه، وتكرارُ اللفظ توكيدٌ لفظيّ. وفي عجزه شاهدٌ آخر: حذف همزة «الهيجاء» للضرورة.","d":["أبو الطيب المتنبي، وهو من الحكمة المسبوكة في قالب التجربة","عمل اسم الفاعل المقترن بـ«أل» وغيرِها عملَ فعله، فنصب «نصحه» مفعولًا ثانيًا","النصب بالعطف على محلّ «رءوسكم» أو على «أيديكم»، وقُرئ بالجرّ على اللفظ"]},{"q":"«ألا يا اسلَمي يا دارَمَيٍّ على البِلى» — ما وجه دخول «يا» على الفعل؟","a":"«يا» حرف تنبيه لا نداء، والمنادى محذوف، وهو شاهد على نداء ما ليس أهلًا للنداء","e":"لأن النداء لا يدخل على الفعل، فتعيّن أن تكون للتنبيه أو أنّ المنادى محذوف تقديره «يا هؤلاء». والبيت لذي الرمّة.","d":["ميشيل معلوف، في البرازيل، وتميّزت بالمحافظة على عمود الشعر","أوّل كتابٍ جامع في النحو العربي، وهو أوثق مصادر الشواهد وأقدمها","مسكين الدارمي، والشاهد نصب «أخاك» على الإغراء بفعلٍ محذوف"]},{"q":"«وما كلُّ ذي لُبٍّ بمؤتيكَ نُصحَه» — ما الشاهد في «بمؤتيك»؟","a":"عمل اسم الفاعل المقترن بـ«أل» وغيرِها عملَ فعله، فنصب «نصحه» مفعولًا ثانيًا","e":"واسم الفاعل يعمل عمل فعله بشرط الاعتماد على نفيٍ أو استفهام أو موصوف، وقد اعتمد هنا على النفي بـ«ما»، فصحّ عمله.","d":["الرفع على الابتداء والخبر محذوف، أو على تقدير التأخير عن تمام الخبر","جاء اسم «إنّ» بالألف وحقُّه النصب، وأشهر التوجيه أنها لغة بني الحارث في إلزام المثنّى الألف","أوّل كتابٍ جامع في النحو العربي، وهو أوثق مصادر الشواهد وأقدمها"]},{"q":"«قد أصبحَتْ أمُّ الخِيارِ تدّعي ... عليّ ذنبًا كلُّه لم أصنعِ» — ما الشاهد؟","a":"رفع «كلُّه» على الابتداء مع إرادة العموم، وهو شاهدٌ على أنّ النفي إذا تأخّر عن «كلّ» توجّه إلى الشمول","e":"فالمعنى: لم أصنع شيئًا منه البتّة، لا: صنعتُ بعضه. وفي رواية نصبُه على البدل، والخلاف مشهور في كتب النحو.","d":["الشاهد كلامٌ عربيّ موثوق يُحتجّ به، والمثال ما يصنعه النحوي للتوضيح، والدليل ما يُبنى عليه الحكم كالسماع والقياس","مسكين الدارمي، والشاهد نصب «أخاك» على الإغراء بفعلٍ محذوف","جرّ «حاتمِ» على الجوار أو على توهّم إضافة، وهو من شواهد الجرّ بالمجاورة"]},{"q":"«لا أرى الموتَ يسبِقُ الموتَ شيءٌ ... نغَّصَ الموتُ ذا الغنى والفقيرا» — ما الشاهد؟","a":"الفصل بين الفعل وفاعله «شيء» بالمفعول، وجوازُ تقديم المفعول على الفاعل","e":"والأصل «لا أرى شيئًا يسبق الموتَ»، فقُدّم المفعول للعناية، وهو جائزٌ ما لم يقع لبسٌ في تمييز الفاعل من المفعول. والبيت لعديّ بن زيد.","d":["ابن حزم الأندلسي، وموضوعه تحليل عاطفة الحبّ وأحواله، وهو من النثر الأندلسي","عمل اسم الفاعل المقترن بـ«أل» وغيرِها عملَ فعله، فنصب «نصحه» مفعولًا ثانيًا","إلى منتصف القرن الثاني في الأمصار، وإلى آخر الرابع في البوادي"]},{"q":"«على حالةٍ لو أنّ في القوم حاتمًا ... على جودِه لضَنَّ بالماءِ حاتمِ» — ما الشاهد؟","a":"جرّ «حاتمِ» على الجوار أو على توهّم إضافة، وهو من شواهد الجرّ بالمجاورة","e":"والأصل رفعُه فاعلًا لـ«ضنّ»، فجُرّ لمجاورته المجرور قبله. والجرّ على الجوار بابٌ سماعيّ لا يُقاس عليه عند الجمهور.","d":["عمل اسم الفاعل المقترن بـ«أل» وغيرِها عملَ فعله، فنصب «نصحه» مفعولًا ثانيًا","«يا» حرف تنبيه لا نداء، والمنادى محذوف، وهو شاهد على نداء ما ليس أهلًا للنداء","ابن حزم الأندلسي، وموضوعه تحليل عاطفة الحبّ وأحواله، وهو من النثر الأندلسي"]},{"q":"«فلو كان عبدُ الله مولًى هجوتُه ... ولكنّ عبدَ الله مولى مَواليا» — ما الشاهد؟","a":"إشباع فتحة الياء في «مواليا» ضرورةً، والأصل «موالٍ»","e":"والضرورة الشعرية تُبيح للشاعر ما لا يُباح للناثر، كالإشباع وصرفِ الممنوع ومنعِ المصروف. والبيت للفرزدق.","d":["وقوع اسم «إنّ» اسمًا موصولًا، ودخولُ اللام المزحلقة على الخبر","الفصل بين الفعل وفاعله «شيء» بالمفعول، وجوازُ تقديم المفعول على الفاعل","امرؤ القيس، على البحر الطويل، والشاهد جزم «نبكِ» في جواب الأمر"]},{"q":"«إنّ مَن صادَ عَقعَقًا لمشومُ» — ما الشاهد فيه؟","a":"وقوع اسم «إنّ» اسمًا موصولًا، ودخولُ اللام المزحلقة على الخبر","e":"واللام المزحلقة هي لام الابتداء، أُخّرت إلى الخبر كراهةَ اجتماع مؤكّدين في صدر الجملة، فصار موضعها الخبرَ لا المبتدأ.","d":["ميشيل معلوف، في البرازيل، وتميّزت بالمحافظة على عمود الشعر","جبران خليل جبران رئيسًا وميخائيل نعيمة أمينًا للسرّ، في نيويورك","جرّ «حاتمِ» على الجوار أو على توهّم إضافة، وهو من شواهد الجرّ بالمجاورة"]},{"q":"«ألا رجلًا جزاهُ اللهُ خيرًا» — ما إعراب «رجلًا»؟","a":"اسم «لا» النافية للجنس منصوب لأنه شبيه بالمضاف، و«ألا» للتمنّي","e":"والشبيه بالمضاف ما عمل فيما بعده أو اتّصل به شيءٌ من تمام معناه، ومن شروط بناء اسم «لا» أن يكون مفردًا غيرَ مضافٍ ولا شبيهٍ به.","d":["اسم «إنْ» المخفّفة مرفوع، ونُوِّن لقطعه عن الإضافة لفظًا مع نيّة المعنى","على اللغة الحجازية، و«بشرًا» خبر «ما» منصوب","«الله» مفعول به منصوب، و«العلماء» فاعل مرفوع، وقُدّم المفعول لأنه أهمّ"]},{"q":"«فإنْ تكُ خَيلي قد أُصيبَ صَميمُها» — ما الشاهد في «تكُ»؟","a":"حذف نون «يكون» بعد الجزم تخفيفًا","e":"وهو حذفٌ جائز مطّرد في «يكن» وحدها من بين الأفعال، بشرط ألا يليها ساكنٌ ولا ضمير متّصل، وهو من خصائص هذا الفعل لكثرة دورانه.","d":["مصدرية، والتقدير «من بعد رؤيتهم الآيات»","حذف الياء من «تحسب» للضرورة، وأصلها «تحسبُني»","عنترة بن شداد، والاستفهام غرضه النفي والتحسّر"]},{"q":"«بأيِّ كتابٍ أم بأيّةِ سُنّةٍ ... ترى حُبَّهم عارًا عليَّ وتَحسَبُ» — ما الشاهد؟","a":"حذف الياء من «تحسب» للضرورة، وأصلها «تحسبُني»","e":"فحُذف المفعول الأول اختصارًا لدلالة ما قبله عليه. والبيت للكميت بن زيد، وهو من شواهد حذف أحد مفعولَي «حسب».","d":["مصدرية، والتقدير «من بعد رؤيتهم الآيات»","عنترة بن شداد، والاستفهام غرضه النفي والتحسّر","حذف نون «يكون» بعد الجزم تخفيفًا"]},{"q":"«يا لَيتني وأنتِ يا لَميسُ ... في بلدٍ ليس به أنيسُ» — ما إعراب «أنت»؟","a":"عطف على اسم «ليت» المحلّ، أو مبتدأ خبره محذوف","e":"لأن الضمير المنصوب المتصل لا يُعطف عليه بضمير رفعٍ منفصل إلا بعد فاصل، وقد فُصل هنا بالواو، وهذا وجهٌ مقبول عند النحاة.","d":["حذف الياء من «تحسب» للضرورة، وأصلها «تحسبُني»","عنترة بن شداد، والاستفهام غرضه النفي والتحسّر","مصدرية، والتقدير «من بعد رؤيتهم الآيات»"]},{"q":"«قِفا نبكِ من ذكرى حبيبٍ ومنزلِ» — مَن قائله؟ وما بحره؟ وما الشاهد النحوي؟","a":"امرؤ القيس، على البحر الطويل، والشاهد جزم «نبكِ» في جواب الأمر","e":"فالفعل مجزوم بحذف حرف العلّة لأنه جوابٌ للطلب، والتقدير «إن تقفا نبكِ». وهو مطلع المعلّقة وأشهر مطالع الشعر العربي.","d":["جرّ «حاتمِ» على الجوار أو على توهّم إضافة، وهو من شواهد الجرّ بالمجاورة","ابن حزم الأندلسي، وموضوعه تحليل عاطفة الحبّ وأحواله، وهو من النثر الأندلسي","مسكين الدارمي، والشاهد نصب «أخاك» على الإغراء بفعلٍ محذوف"]},{"q":"«هل غادرَ الشعراءُ من مُتردَّمِ» — لمن؟ وما الغرض من الاستفهام؟","a":"عنترة بن شداد، والاستفهام غرضه النفي والتحسّر","e":"فالمعنى: ما ترك الشعراء موضعًا يُرقَّع ويُستدرك. وهو من خروج الاستفهام عن حقيقته، ومعلّقته على البحر الكامل.","d":["عطف على اسم «ليت» المحلّ، أو مبتدأ خبره محذوف","مصدرية، والتقدير «من بعد رؤيتهم الآيات»","حذف الياء من «تحسب» للضرورة، وأصلها «تحسبُني»"]},{"q":"«لِخَولةَ أطلالٌ ببُرقةِ ثَهمَدِ» — لمن؟ وما إعراب «أطلال»؟","a":"طرفة بن العبد، و«أطلال» مبتدأ مؤخّر مرفوع","e":"و«لخولة» جارّ ومجرور خبر مقدَّم، وساغ الابتداء بالنكرة لتقدّم الخبر شبهِ الجملة عليها، وهذا من مسوّغات الابتداء بالنكرة.","d":["جواب الشرط «ومن يفعل ذلك»، وهو مجزوم بالسكون","«الله» مفعول به منصوب، و«العلماء» فاعل مرفوع، وقُدّم المفعول لأنه أهمّ","خبر «ليس» مقدَّم منصوب، والمصدر المؤوّل «أن تولّوا» اسمها مؤخّر"]},{"q":"«أمِن أمِّ أوفى دِمنةٌ لم تكلَّمِ» — لمن؟ وبمَ اشتُهرت معلّقته؟","a":"زهير بن أبي سلمى، واشتُهرت بالحكمة والدعوة إلى السلم","e":"وهو من شعراء الحوليات الذين ينقّحون القصيدة حولًا كاملًا، ولذلك سلمَ شعرُه من الحشو، وقد مدح السيّدين الساعيين في صلح داحس والغبراء.","d":["جبران خليل جبران رئيسًا وميخائيل نعيمة أمينًا للسرّ، في نيويورك","مسكين الدارمي، والشاهد نصب «أخاك» على الإغراء بفعلٍ محذوف","الرفع على الابتداء والخبر محذوف، أو على تقدير التأخير عن تمام الخبر"]},{"q":"«أعَلَّلُ النفسَ بالآمالِ أرقُبُها» — مَن القائل؟ وبمَ يُعرف هذا اللون؟","a":"أبو الطيب المتنبي، وهو من الحكمة المسبوكة في قالب التجربة","e":"والحكمة عند المتنبي ليست وعظًا مجرَّدًا بل خلاصةُ معاناة، ولذلك سارت أبياته مسير الأمثال، وهو أكثر الشعراء حكمةً سائرة.","d":["الرفع على الابتداء، والجملة تفيد الثبوت والدوام","النصب على المدح بفعلٍ محذوف تقديره «أعني» أو «أمدح»","وقوع اسم «إنّ» اسمًا موصولًا، ودخولُ اللام المزحلقة على الخبر"]},{"q":"مَن صاحب «البحتري»، وبمَ لُقّب؟ وما أشهر ما يُستشهد له به؟","a":"الوليد بن عبيد البحتري، لُقّب بـ«شاعر الحسن»، وأشهر ما يُستشهد له سينيّته في إيوان كسرى","e":"ويُقابَل بأبي تمام في الموازنة: فأبو تمام صاحبُ صنعةٍ وبديع، والبحتريُّ صاحبُ سلاسةٍ وديباجة، وقد عقد الآمديُّ بينهما «الموازنة».","d":["زهير بن أبي سلمى، واشتُهرت بالحكمة والدعوة إلى السلم","أوّل كتابٍ جامع في النحو العربي، وهو أوثق مصادر الشواهد وأقدمها","جاء اسم «إنّ» بالألف وحقُّه النصب، وأشهر التوجيه أنها لغة بني الحارث في إلزام المثنّى الألف"]},{"q":"مَن مؤسّس الرابطة القلمية ومن أمينُ سرّها؟ وأين كانت؟","a":"جبران خليل جبران رئيسًا وميخائيل نعيمة أمينًا للسرّ، في نيويورك","e":"وهي القسم الشمالي من أدب المهجر، وتميّزت بالتجديد والنزعة الإنسانية والتأمّل، بخلاف العصبة الأندلسية في الجنوب فهي أحفظُ للعمود.","d":["أحمد زكي أبو شادي مؤسّسها، وأحمد شوقي رئيسها الفخري","مدرسة نقدية قام عليها العقاد والمازني وشكري، ونشأت من كتابٍ في نقد شوقي","أبو الطيب المتنبي، وهو من الحكمة المسبوكة في قالب التجربة"]},{"q":"مَن مؤسّس العصبة الأندلسية؟ وأين؟ وبمَ تميّزت؟","a":"ميشيل معلوف، في البرازيل، وتميّزت بالمحافظة على عمود الشعر","e":"فهي القسم الجنوبي من المهجر، وشعراؤها أقربُ إلى القديم في اللفظ والوزن، والشماليّون أجرأُ على التجديد، وهذا هو الفارق المسؤول عنه.","d":["جرّ «حاتمِ» على الجوار أو على توهّم إضافة، وهو من شواهد الجرّ بالمجاورة","«يا» حرف تنبيه لا نداء، والمنادى محذوف، وهو شاهد على نداء ما ليس أهلًا للنداء","أوّل كتابٍ جامع في النحو العربي، وهو أوثق مصادر الشواهد وأقدمها"]},{"q":"مَن لُقّب بـ«شاعر النيل»؟ ومَن لُقّب بـ«شاعر القطرين»؟","a":"حافظ إبراهيم شاعر النيل، وخليل مطران شاعر القطرين","e":"ولُقّب مطران بذلك لأنه لبنانيّ المولد مصريّ المقام، وهو رائد الاتجاه الوجداني والداعي إلى الوحدة العضوية في القصيدة.","d":["أبو الطيب المتنبي، وهو من الحكمة المسبوكة في قالب التجربة","مجاز مرسل علاقته الكلّية، أُطلق الكلُّ وأُريد الجزء","أوّل كتابٍ جامع في النحو العربي، وهو أوثق مصادر الشواهد وأقدمها"]},{"q":"ما مدرسة الديوان؟ ومن أصحابها؟ وعلى أيّ شيء قامت؟","a":"مدرسة نقدية قام عليها العقاد والمازني وشكري، ونشأت من كتابٍ في نقد شوقي","e":"وسُمّيت بـ«الديوان» باسم الكتاب الذي أصدره العقاد والمازني، ودعت إلى الوحدة العضوية والذاتية، وهي ثائرةٌ على مدرسة الإحياء.","d":["وقوع اسم «إنّ» اسمًا موصولًا، ودخولُ اللام المزحلقة على الخبر","الرفع على الابتداء والخبر محذوف، أو على تقدير التأخير عن تمام الخبر","حافظ إبراهيم شاعر النيل، وخليل مطران شاعر القطرين"]},{"q":"مَن مؤسّس جماعة أبوللو؟ ومَن رئيسها الفخري؟","a":"أحمد زكي أبو شادي مؤسّسها، وأحمد شوقي رئيسها الفخري","e":"ومن مفارقات تاريخ الأدب أنّ شوقي الذي نقدته مدرسةُ الديوان صار رئيسًا فخريًّا لأبوللو، فلا يصحّ الخلط بين الجماعتين في الاتجاه.","d":["أوّل كتابٍ جامع في النحو العربي، وهو أوثق مصادر الشواهد وأقدمها","ميشيل معلوف، في البرازيل، وتميّزت بالمحافظة على عمود الشعر","إشباع فتحة الياء في «مواليا» ضرورةً، والأصل «موالٍ»"]},{"q":"مَن رائدا الشعر الحرّ؟ وما وحدته؟","a":"تُنازَع الريادة بين نازك الملائكة وبدر شاكر السيّاب، ووحدته التفعيلة لا البيت","e":"ونازك نشرت «الكوليرا» سنة ١٩٤٧ والسيّاب «هل كان حبًّا»، والأسلمُ في الجواب ذكرُهما معًا. وليس الشعر الحرّ نثرًا، فله وزنٌ وقافيةٌ غير ملتزمة.","d":["النصب بالعطف على محلّ «رءوسكم» أو على «أيديكم»، وقُرئ بالجرّ على اللفظ","ابن حزم الأندلسي، وموضوعه تحليل عاطفة الحبّ وأحواله، وهو من النثر الأندلسي","جبران خليل جبران رئيسًا وميخائيل نعيمة أمينًا للسرّ، في نيويورك"]},{"q":"مَن صاحب «طوق الحمامة»؟ وما موضوعه؟ وإلى أيّ أدبٍ ينتمي؟","a":"ابن حزم الأندلسي، وموضوعه تحليل عاطفة الحبّ وأحواله، وهو من النثر الأندلسي","e":"وهو كتابٌ نفسيّ تحليليّ سابق لعصره، جمع فيه بين الملاحظة الدقيقة والشعر، وهو من أنفس
