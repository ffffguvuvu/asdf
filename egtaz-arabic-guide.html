<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ملفات المسابقة — تخصص لغة عربية: حلّ الأسئلة وشرح القواعد ووضع الاختبار</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#17202e;--mut:#5d6b84;--pri:#1d5fa8;--pri2:#e8f0fb;
--ok:#0f7a4d;--ok2:#e4f5ec;--wr:#b3261e;--wr2:#fdeceb;--line:#dfe5f0;--acc:#8b5cf6}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Tahoma",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.95}
header{background:linear-gradient(135deg,#123a6b,#1d5fa8 55%,#2a7fd4);color:#fff;padding:26px 18px 20px}
.wrap{max-width:1120px;margin:0 auto;padding:0 14px}
h1{margin:0 0 6px;font-size:1.5rem;font-weight:800}
.sub{opacity:.93;font-size:.93rem;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:4px 11px;border-radius:999px;font-size:.82rem}
nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;
box-shadow:0 2px 10px rgba(16,30,60,.07)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 14px;max-width:1120px;margin:0 auto;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#fbfcfe;color:var(--mut);padding:7px 15px;
border-radius:9px;cursor:pointer;font-size:.9rem;font-family:inherit;white-space:nowrap;font-weight:600}
.tab:hover{background:var(--pri2);color:var(--pri)}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tab.xm{background:#f3ecff;color:#6b36d6;border-color:#dccdfa}
.tab.xm.on{background:#6b36d6;color:#fff;border-color:#6b36d6}
main{padding:18px 0 60px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px 19px;margin:0 0 14px;
box-shadow:0 1px 3px rgba(16,30,60,.05)}
.card h3{margin:0 0 10px;font-size:1.08rem;color:var(--pri);font-weight:800;border-bottom:2px solid var(--pri2);padding-bottom:7px}
.card p{margin:.55em 0}
.card ul,.card ol{margin:.5em 0;padding-inline-start:1.5em}
.card li{margin:.3em 0}
table{width:100%;border-collapse:collapse;margin:.8em 0;font-size:.9rem}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:right;vertical-align:top}
th{background:var(--pri2);color:var(--pri);font-weight:700}
tr:nth-child(even) td{background:#fafbfe}
.tnb{margin-top:13px;background:#fff8ee;border:1px solid #f6d8a8;border-right:4px solid #dd8c16;
border-radius:10px;padding:11px 15px}
.tnb h4{margin:0 0 5px;font-size:.94rem;color:#9a5b06;font-weight:800}
.tnb ol{margin:.3em 0;padding-inline-start:1.35em}
.tnb li{margin:.4em 0;font-size:.93rem;line-height:1.85}
.tnb .src{margin:.7em 0 0;font-size:.82rem;color:#8a6a3a;border-top:1px dashed #ecd3a8;padding-top:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
input[type=search],select{font-family:inherit;font-size:.92rem;padding:8px 12px;border:1px solid var(--line);
border-radius:9px;background:#fff;color:var(--ink)}
input[type=search]{flex:1;min-width:190px}
.btn{font-family:inherit;font-size:.88rem;padding:8px 14px;border:1px solid var(--line);background:#fff;
border-radius:9px;cursor:pointer;color:var(--mut);font-weight:600}
.btn:hover{background:var(--pri2);color:var(--pri);border-color:var(--pri)}
.btn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.go{background:#6b36d6;color:#fff;border-color:#6b36d6}
.btn.go:hover{background:#5a2bb8;color:#fff}
.cnt{color:var(--mut);font-size:.86rem}
.q{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:11px;
padding:14px 17px;margin-bottom:11px}
.q .num{color:var(--acc);font-weight:800;font-size:.8rem;letter-spacing:.4px}
.qt{font-weight:700;margin:5px 0 9px;font-size:1rem}
.ans{background:var(--ok2);border:1px solid #bfe6d2;border-radius:8px;padding:8px 12px;margin-bottom:8px;
color:var(--ok);font-weight:700;font-size:.95rem}
.ans::before{content:"الإجابة: ";font-weight:800;opacity:.75}
.exp{color:#36425a;font-size:.93rem;background:#f8f9fc;border-radius:8px;padding:9px 12px;border:1px dashed var(--line)}
.exp::before{content:"الشرح — ";font-weight:800;color:var(--pri)}
.none{text-align:center;color:var(--mut);padding:34px;background:var(--card);border-radius:12px;border:1px dashed var(--line)}
.lead{background:#fffaf0;border:1px solid #f0e0bd;border-radius:11px;padding:13px 17px;margin-bottom:15px;font-size:.93rem}
.lead b{color:#92610b}
.fl{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border:1px solid var(--line);
border-radius:10px;padding:10px 13px;margin-bottom:8px;background:var(--card);flex-wrap:wrap}
.fl .nm{font-weight:700;font-size:.93rem;flex:1;min-width:220px}
.fl .kd{font-size:.8rem;color:var(--pri);background:var(--pri2);padding:2px 9px;border-radius:999px}
.fl .st{font-size:.8rem;color:var(--mut)}
.ok{color:var(--ok)!important;font-weight:700}
.bad{color:var(--wr)!important}
a{color:var(--pri)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.g div{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center}
.g b{display:block;font-size:1.45rem;color:var(--pri);font-weight:800}
.g span{font-size:.81rem;color:var(--mut)}
mark{background:#fff3a3;padding:0 2px;border-radius:3px}
/* ---- وضع الاختبار ---- */
.exbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
background:#2b1a52;color:#fff;border-radius:11px;padding:10px 16px;margin-bottom:14px;
position:sticky;top:53px;z-index:30}
.exbar .pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);
padding:3px 12px;border-radius:999px;font-size:.85rem;font-weight:700}
.exq{background:var(--card);border:1px solid var(--line);border-right:4px solid #6b36d6;border-radius:11px;
padding:14px 17px;margin-bottom:11px}
.exq .num{color:#6b36d6;font-weight:800;font-size:.8rem}
.opt{display:block;border:1px solid var(--line);border-radius:9px;padding:9px 13px;margin:7px 0;
cursor:pointer;background:#fff;font-size:.95rem;transition:background .12s}
.opt:hover{background:#f3ecff}
.opt input{margin-inline-end:9px;vertical-align:middle}
.opt.sel{border-color:#6b36d6;background:#f3ecff}
.opt.good{border-color:#0f7a4d;background:var(--ok2);font-weight:700}
.opt.bad{border-color:var(--wr);background:var(--wr2)}
.verdict{font-weight:800;font-size:.88rem;margin:8px 0 4px}
.verdict.y{color:var(--ok)}.verdict.n{color:var(--wr)}
.score{background:linear-gradient(135deg,#2b1a52,#6b36d6);color:#fff;border-radius:13px;
padding:20px;margin-bottom:16px;text-align:center}
.score .pc{font-size:2.6rem;font-weight:800;display:block;line-height:1.2}
.score .gr{font-size:1.05rem;font-weight:700;opacity:.95}
.score .dt{font-size:.88rem;opacity:.85;margin-top:6px}
@media print{nav,.toolbar,.exbar,header .chips{display:none}.panel{display:block!important}
.card,.q,.exq{break-inside:avoid;box-shadow:none}body{background:#fff}}
</style>
</head>

<script id="DATA" type="application/json">{"s":[{"c":"nahw","n":"النحو","q":[{"q":"«هؤلاء الرجال يعملون بصمت» — حوّلها إلى جملة فعلية","a":"يعملُ هؤلاء الرجالُ بصمتٍ","e":"عند التحويل إلى الجملة الفعلية يُقدَّم الفعل ويجب إفراده مع الفاعل الظاهر على اللغة الفصيحة المشهورة، فلا يُلحق به علامة جمع. و«يعملون هؤلاء الرجال» ضعيف لأنه على لغة أكلوني البراغيث، و«يعملوا» خطأ لحذف النون بلا ناصب ولا جازم.","d":["ذهب الفلاحون إلى الحقل","إن هاتين المعلمتين مجتهدتان","اسم يُذكر لبيان سبب وقوع الفعل"]},{"q":"اتصلتُ ...... صديقي هاتفيًّا — ما حرف الجر الصحيح؟","a":"الباء: اتصلتُ بصديقي","e":"الفعل «اتصل» يتعدى بالباء سماعًا؛ وهذا باب تعدية الأفعال بحروف بعينها لا يُقاس عليه بل يُحفظ. وقولهم «اتصلت على فلان» من الأخطاء الشائعة، و«اتصلت لفلان» أبعد.","d":["اسم الإشارة والضمير","اثنتا عشرةَ","قرأتُ خمسَ قصصٍ"]},{"q":"استعان الرجلُ ...... صديقه","a":"الباء: استعان بصديقه","e":"لأن «استعان» من الأفعال التي تتعدى بالباء الدالة على الاستعانة، كما تقول: كتبتُ بالقلم. والباء هنا حرف جر أصلي ومجرورها متعلق بالفعل.","d":["ساعد أمَّها فاطمةُ","الثامنةَ عشرةَ","أربعةَ عشرَ"]},{"q":"خذ الكتابَ ...... المجلةَ — أكمل بحرف يفيد التخيير","a":"أو","e":"«أو» بعد الطلب تفيد التخيير إذا جاز الجمع بين الأمرين، والإباحة إن لم يُمنع الجمع. أما «أم» فللاستفهام المعادل، و«الواو» لمطلق الجمع فلا تخيير فيها، و«ثم» للترتيب مع التراخي.","d":["إذا","تلميذًا","الألف"]},{"q":"خرج الرئيسُ ...... موكبه — أكمل بحرف جر يفيد المصاحبة","a":"في","e":"«في» تخرج عن الظرفية إلى المصاحبة والملابسة، أي: خرج مصحوبًا بموكبه ومحاطًا به. والمعنى على الظرفية المجازية: كأن الموكب ظرف أحاط به.","d":["نكرتين","إذا","طالبًا"]},{"q":"كم ...... في المدرسة؟ — ضع التمييز المناسب","a":"طالبًا","e":"لأن «كم» هنا استفهامية، وتمييزها مفرد منصوب. ولو كانت خبرية بمعنى التكثير لكان تمييزها مفردًا أو جمعًا مجرورًا، كقولك: «كم مالٍ أنفقتُ!».","d":["في","أو","المبتدأ"]},{"q":"اختر التمييز المناسب لـ«كم» في: كم عندي ......!","a":"مالٍ (مجرور)","e":"لأن «كم» هنا خبرية تفيد الإخبار بالكثرة لا الاستفهام، وتمييزها يُجرّ بالإضافة. والفارق بين الخبرية والاستفهامية أن الخبرية لا يُستفهم بها ولا تحتاج جوابًا.","d":["تمييز منصوب محوَّل عن فاعل","خبر مرفوع بالضمة","اسم مجرور وعلامة جره الفتحة لأنه ممنوع من الصرف"]},{"q":"نجحت ...... طالبة","a":"اثنتا عشرةَ","e":"لأن العددين 11 و12 يوافق جزآهما المعدود في التذكير والتأنيث، والمعدود «طالبة» مؤنث فيؤنَّث الجزآن. و«اثنتا» مرفوعة بالألف لأنها ملحقة بالمثنى، وهي هنا فاعل.","d":["بدل اشتمال","ثلاث حالات","ساعد أمَّها فاطمةُ"]},{"q":"«تزوّج وعمره 16 عامًا» — القراءة الصحيحة للعدد","a":"ستةَ عشرَ","e":"المعدود «عامًا» مذكر. وفي العدد المركب من 13 إلى 19 يخالف الجزءُ الأول المعدودَ ويوافقه الجزء الثاني؛ فلمّا كان المعدود مذكرًا لحقت التاءُ الجزءَ الأول (ستة) وتجرّد منها الثاني (عشر).","d":["نون النسوة","قرأتُ خمسَ قصصٍ","الثامنةَ عشرةَ"]},{"q":"«أكرمت المدرسة 14 معلمًا» — القراءة الصحيحة","a":"أربعةَ عشرَ","e":"للقاعدة نفسها: المعدود «معلمًا» مذكر، فيخالفه الجزء الأول فيُؤتى به بالتاء «أربعة»، ويوافقه الجزء الثاني فيتجرد «عشر». والعدد المركب مبني على فتح الجزأين في محل نصب مفعول به.","d":["المركزان الأعليان","نون النسوة","ستةَ عشرَ"]},{"q":"«ذاع صيته منذ السنة 18 من عمره» — القراءة الصحيحة","a":"الثامنةَ عشرةَ","e":"لأنه عدد ترتيبي واقع صفةً لـ«السنة» وهي مؤنثة، وفي العدد الترتيبي المركب يوافق الجزآن الموصوفَ في التأنيث والتذكير؛ فيُقال للمؤنث: الثامنة عشرة، وللمذكر: الثامن عشر.","d":["المركزان الأعليان","اثنتا عشرةَ","بدل إضراب (البَداء)"]},{"q":"اختر الصحيح: قرأتُ خمسة قصص / خمس قصص / خمس قصة","a":"قرأتُ خمسَ قصصٍ","e":"مفرد «قصص» هو «قصة» وهو مؤنث، والعدد من 3 إلى 9 يخالف المعدود، فيتجرد من التاء مع المؤنث: خمسَ. وتمييزه جمع مجرور بالإضافة: قصصٍ.","d":["قرأتُ خمسة قصص","خمس قصص","خمس قصة"]},{"q":"علامة إعراب المثنى هي…","a":"الألف رفعًا، والياء نصبًا وجرًّا","e":"فالمثنى يُعرب بالحروف نيابة عن الحركات. وليس الصواب «الألف في الأحوال كلها» لأن ذلك خاص بالمبني أو بلغة من يلزم المثنى الألف، وهي لغة قليلة لا يُقاس عليها في الاختبار.","d":["بدل مطابق (كل من كل)","عند الإضافة، حذفًا واجبًا","اسم يُذكر لبيان سبب وقوع الفعل"]},{"q":"«إن الحسنات يُذهبن السيئات» — ما حركة «الحسنات»؟","a":"الكسرة","e":"لأن «الحسنات» اسم «إنّ» منصوب، وهو جمع مؤنث سالم يُنصب بالكسرة نيابة عن الفتحة. وهذه إحدى علامات الإعراب الفرعية التي يكثر السؤال عنها.","d":["نكرتين","صحيحة","في"]},{"q":"«هذا أليمٌ» — ما إعراب «أليم»؟","a":"خبر مرفوع (أو بدل مرفوع بحسب السياق)","e":"إن كانت «أليم» مخبَرًا بها عن اسم الإشارة فهي خبر مرفوع بالضمة. وإن سبقها معرفةٌ هي المقصودة بالحكم وجاءت «أليم» تابعة لها مقصودةً بالنسبة أُعربت بدلًا مرفوعًا — والمعوّل على سياق الخيارات.","d":["مفعول به منصوب","اسم مجرور وعلامة جره الفتحة لأنه ممنوع من الصرف","تأتيَ — منصوبة"]},{"q":"«الدينُ النصيحةُ» — ما إعراب «النصيحة»؟","a":"خبر مرفوع بالضمة","e":"«الدين» مبتدأ و«النصيحة» خبره، والجملة اسمية تفيد الحصر بتعريف الجزأين، أي: الدينُ كلُّه منحصر في النصيحة. وتعريف المسند والمسند إليه من طرق القصر عند البلاغيين.","d":["تمييز منصوب محوَّل عن فاعل","اسم مجرور","تأتيَ — منصوبة"]},{"q":"«بِعتُ السلعةَ» — ما إعراب «السلعة»؟","a":"مفعول به منصوب","e":"لأن الفعل مبني للمعلوم وفاعله تاء المتكلم. ولو بُني للمجهول لقلت «بِيعت السلعةُ» فتكون «السلعة» نائب فاعل مرفوعًا — وهذا هو موضع الخلط في الخيارات.","d":["مالٍ (مجرور)","تأتيَ — منصوبة","شراءِ (مضاف إليه مجرور)"]},{"q":"«كيف كنتَ؟» — ما إعراب «كيف»؟","a":"خبر كان مقدَّم، مبني على الفتح في محل نصب","e":"لأن «كان» ناسخ يرفع الاسم وينصب الخبر، واسمها هنا تاء المخاطب. و«كيف» اسم استفهام له الصدارة فوجب تقديمه، وهو مبني فيُعرب بالمحل.","d":["خبر مرفوع بالضمة","اسم مجرور وعلامة جره الفتحة لأنه ممنوع من الصرف","شراءِ (مضاف إليه مجرور)"]},{"q":"«أصبح بيننا متكاسلون» — ما نوع الخبر؟","a":"شبه جملة (ظرف) مقدَّم","e":"«بيننا» ظرف مكان في محل نصب خبر «أصبح» مقدَّم، و«متكاسلون» اسمها مؤخر مرفوع بالواو. وقُدِّم الخبر لأن الاسم نكرة، فلو تأخر الخبر لابتدئ بنكرة بلا مسوّغ.","d":["أن يدخل على الجملة الاسمية","بدل بعض من كل","يعملُ هؤلاء الرجالُ بصمتٍ"]},{"q":"«أليس اللهُ بكافٍ عبدَه» — ما إعراب «عبده»؟","a":"مفعول به لاسم الفاعل «كافٍ»","e":"لأن اسم الفاعل إذا اعتمد على نفي أو استفهام عمِل عمل فعله فرفع فاعلًا ونصب مفعولًا. وهنا اعتمد على همزة الاستفهام الداخلة على «ليس»، فنصب «عبده» مفعولًا به.","d":["بدل بعض من كل","عند الإضافة، حذفًا واجبًا","الألف رفعًا، والياء نصبًا وجرًّا"]},{"q":"ما حكم تقديم الخبر في «فيكم بركةٌ»؟","a":"واجب التقديم","e":"لأن الخبر شبه جملة والمبتدأ نكرة غير مختصة. فلو أخّرتَ الخبر لابتدأتَ بالنكرة من غير مسوّغ، وهو ممتنع؛ فوجب التقديم ليحصل المسوّغ ويستقيم المعنى.","d":["ثلاث حالات","ساعد أمَّها فاطمةُ","واجب النصب"]},{"q":"معمولا «لا» النافية للجنس يكونان…","a":"نكرتين","e":"وهذا شرط إعمالها عمل «إنّ»؛ فإن جاء اسمها معرفة بطل عملها ووجب تكرارها، كقولك: «لا محمدٌ في الدار ولا عليٌّ». ويُشترط أيضًا ألّا يُفصل بينها وبين اسمها وألّا تُسبق بحرف جر.","d":["لمّا","المبتدأ","حفظ"]},{"q":"«اتقوا الله في الضعيفين: المرأةِ واليتيم» — ما نوع البدل؟","a":"بدل بعض من كل","e":"لأن «المرأة واليتيم» جزء مما يشمله لفظ «الضعيفين» وبيان له. وهو تابع يتبع المبدل منه في الجر، والمقصود بالحكم هو البدل لا المبدل منه.","d":["عند الإضافة، حذفًا واجبًا","الألف رفعًا، والياء نصبًا وجرًّا","أن يدخل على الجملة الاسمية"]},{"q":"«أكلتُ الرغيفَ ثُلثَه» — نوع البدل؟","a":"بدل بعض من كل","e":"لأن الثلث جزء حقيقي من الرغيف، ولا بد في هذا النوع من ضمير يربط البدل بالمبدل منه وهو الهاء في «ثلثه». ولو قلت «أكلت الرغيف كله» لكان توكيدًا لا بدلًا.","d":["شبه جملة (ظرف) مقدَّم","عند الإضافة، حذفًا واجبًا","فاعل أو بدل (أو مبتدأ مؤخر)"]},{"q":"«أعجبني الرجلُ خُلُقُه» — نوع البدل؟","a":"بدل اشتمال","e":"لأن الخلق ليس جزءًا من ذات الرجل، لكنه معنى يشتمل عليه الرجل ويتعلق به. وهذا هو الفارق بينه وبين بدل البعض الذي يكون جزءًا حقيقيًّا محسوسًا.","d":["جائز الرفع والنصب","ساعد أمَّها فاطمةُ","اثنتا عشرةَ"]},{"q":"«ذلك الكتابُ لا ريب فيه» — نوع البدل؟","a":"بدل مطابق (كل من كل)","e":"لأن «الكتاب» مساوٍ لاسم الإشارة «ذلك» في المعنى والمصداق، فلا هو جزء منه ولا معنى مشتمل عليه. ويُسمى أيضًا بدل كل من كل.","d":["اسم يُذكر لبيان سبب وقوع الفعل","قالت العرب (ويصح: قال)","أن يدخل على الجملة الاسمية"]},{"q":"«أكلتُ خبزًا لحمًا» — نوع البدل؟","a":"بدل إضراب (البَداء)","e":"وهو أن يذكر المتكلم شيئًا ثم يُعرض عنه إلى غيره قاصدًا الثاني. وهو قسيم بدل الغلط الذي يقع عن سهو، والفرق أن الإضراب مقصود والغلط غير مقصود.","d":["قرأتُ خمسَ قصصٍ","مَن قام بالفعل","الباء: استعان بصديقه"]},{"q":"«صليتُ في مساجدَ أثرية» — أعرب «مساجد»","a":"اسم مجرور وعلامة جره الفتحة لأنه ممنوع من الصرف","e":"«مساجد» على صيغة منتهى الجموع، وهي كل جمع تكسير بعد ألفه حرفان أو ثلاثة أوسطها ساكن؛ وهذه علة واحدة كافية للمنع من الصرف. ولو دخلت عليه «أل» أو أُضيف لعاد إلى الجر بالكسرة.","d":["تأتيَ — منصوبة","مالٍ (مجرور)","شراءِ (مضاف إليه مجرور)"]},{"q":"«مَن يتقِ الله ...... بالجنة»","a":"يَفُزْ","e":"«مَن» أداة شرط جازمة تجزم فعلين: فعل الشرط «يتقِ» وهو مجزوم بحذف حرف العلة، وجواب الشرط «يَفُزْ» وهو مجزوم بالسكون. ورفعُه أو نصبُه خطأ لوجود الجازم.","d":["تلميذًا","المبتدأ","أو"]},{"q":"كلّ ما يلي أدوات جازمة لفعلين ما عدا…","a":"إذا","e":"لأن «إذا» ظرف لما يُستقبل من الزمان متضمن معنى الشرط، وهي غير جازمة في فصيح الكلام، وإنما يُجزم بها في الشعر ضرورةً. أما إنْ ومَن ومهما ومتى وأين وكيفما وأيّ فجوازم لفعلين.","d":["المبتدأ","حفظ","صحيحة"]},{"q":"من أدوات الشرط التي تجزم فعلًا واحدًا: إن / من / أيّ / لمّا","a":"لمّا","e":"لأن «لمّا» الجازمة تدخل على المضارع فتجزمه وتقلب زمنه إلى الماضي المنفي المتصل بالحال، نحو «لمّا يأتِ». أما «إن» و«مَن» و«أيّ» فجوازم لفعلين: شرط وجواب.","d":["إن","من","أيّ"]},{"q":"الفعل المضارع يُبنى على السكون عندما يتصل بـ…","a":"نون النسوة","e":"فتقول: «الطالباتُ يَكتبْنَ»، والفعل مبني على السكون في محل رفع. وهذا أحد موضعَي بناء المضارع، والآخر البناء على الفتح مع نون التوكيد المباشرة.","d":["ثلاث حالات","جائز الرفع والنصب","المفعول لأجله"]},{"q":"الفعل المضارع يُبنى على الفتح عندما يتصل بـ…","a":"نون التوكيد","e":"ثقيلةً كانت أو خفيفة، بشرط اتصالها بالفعل مباشرةً: «واللهِ لأجتهدَنَّ». فإن فُصل بينهما بألف اثنين أو واو جماعة أو ياء مخاطبة لم يُبنَ الفعل وبقي معربًا.","d":["أربعةَ عشرَ","قرأتُ خمسَ قصصٍ","اثنتا عشرةَ"]},{"q":"إذا جاء بعد «إذنْ» فعل مضارع يكون…","a":"واجب النصب","e":"بشروط ثلاثة: أن تتصدر «إذن» الكلام، وأن يكون الفعل مستقبلًا، وأن لا يُفصل بينهما بفاصل. فإن اختلّ شرط بطل النصب ووجب الرفع.","d":["ساعد أمَّها فاطمةُ","بدل اشتمال","اثنتا عشرةَ"]},{"q":"إذا سُبقت «إذن» بحرف عطف فالمضارع بعدها…","a":"جائز الرفع والنصب","e":"لأن العطف أخرجها عن صدارة الكلام، فضعُف عملها؛ فمن نظر إلى أصلها نصب، ومن نظر إلى زوال الصدارة رفع. والوجهان مسموعان.","d":["أربعةَ عشرَ","بدل اشتمال","الباء: استعان بصديقه"]},{"q":"«لا تنهَ عن خُلقٍ وتأتيَ مثلَه» — اضبط «تأتي» وعلّل","a":"تأتيَ — منصوبة","e":"فعل مضارع منصوب بـ«أن» مضمرة وجوبًا بعد واو المعية المسبوقة بنهي، وعلامة نصبه الفتحة الظاهرة. والمعنى على الجمع بين الأمرين، أي: لا يجتمع منك نهيٌ عن خُلق وإتيانٌ بمثله. والبيت ينسب لأبي الأسود الدؤلي.","d":["خبر كان مقدَّم، مبني على الفتح في محل نصب","اسم مجرور","اسم مجرور وعلامة جره الفتحة لأنه ممنوع من الصرف"]},{"q":"من أنواع المعرفة: اختر اثنين من (اسم الفاعل، جمع المذكر السالم، اسم الإشارة، الضمير)","a":"اسم الإشارة والضمير","e":"لأن المعارف سبع: الضمير والعلم واسم الإشارة والموصول والمعرَّف بأل والمضاف إلى معرفة والمنادى المقصود. أما اسم الفاعل وجمع المذكر السالم فنكرتان في الأصل ولا يتعرفان إلا بأل أو بالإضافة.","d":["جائز الرفع والنصب","واجب التقديم","الباء: استعان بصديقه"]},{"q":"من أنواع المعارف: الضمير — العلم — اسم الإشارة. هل العبارة صحيحة؟","a":"صحيحة","e":"وهي ثلاثة من المعارف السبع. ولا يصح عدّ «الحال» ولا «التمييز» ولا «المضاف إلى نكرة» ولا «الممنوع من الصرف» من المعارف، لأن الحال والتمييز نكرتان، والمضاف إلى نكرة يبقى نكرة، والمنع من الصرف وصف إعرابي لا تعريفي.","d":["تلميذًا","بالضمة","يَفُزْ"]},{"q":"«كان» فعل ناسخ ويُشترط فيه…","a":"أن يدخل على الجملة الاسمية","e":"فيرفع المبتدأ اسمًا له وينصب الخبر خبرًا لها. و«كان» متصرفة تصرفًا تامًّا بخلاف «ليس» و«ما دام» فجامدتان، فلا يصح جعل التصرف التام شرطًا في عمل الباب كله.","d":["يعملُ هؤلاء الرجالُ بصمتٍ","بدل مطابق (كل من كل)","مفعول به لاسم الفاعل «كافٍ»"]},{"q":"أيّ الأفعال التالية متصرف: بئس / حفظ / ليس / ما خلا؟","a":"حفظ","e":"لأن له ماضيًا ومضارعًا وأمرًا: حفِظ يحفَظ احفَظْ. أما «بئس» و«ليس» و«ما خلا» فأفعال جامدة لزمت صورة واحدة ولا يُشتق منها.","d":["بئس","ليس","ما خلا"]},{"q":"أيّ الأفعال التالية جامد: أكل / نعم / ذهب / أصبح؟","a":"نِعم","e":"لأنه فعل ماضٍ جامد للمدح لا مضارع له ولا أمر. و«أصبح» وإن كان ناسخًا فهو متصرف، و«أكل» و«ذهب» تامّان متصرفان.","d":["أكل","ذهب","أصبح"]},{"q":"إعراب ما بعد اسم التفضيل إذا كان معرفة","a":"مضاف إليه مجرور","e":"نحو «أبي أكرمُ الناسِ»، لأن اسم التفضيل أُضيف إلى معرفة فاكتسب التعريف. أما إذا كان ما بعده نكرة منصوبة بتنوين الفتح فهو تمييز، نحو «العاملُ أعلى قدرًا».","d":["مالٍ (مجرور)","اسم مجرور","تمييز منصوب محوَّل عن فاعل"]},{"q":"«واشتعل الرأسُ شَيبًا» — أعرب «شيبًا»","a":"تمييز منصوب محوَّل عن فاعل","e":"لأن الأصل «اشتعل شيبُ الرأسِ»، فحُوِّل الفاعل إلى تمييز وأُسند الفعل إلى «الرأس». وفائدة التحويل إفادة الشمول: أن البياض عمّ الرأس كله، وهو أبلغ من الإسناد الأصلي.","d":["خبر مرفوع (أو بدل مرفوع بحسب السياق)","اسم مجرور وعلامة جره الفتحة لأنه ممنوع من الصرف","اسم مجرور"]},{"q":"«يتعاقبون فيكم ملائكةٌ» — وضّح الشاهد وأعرب «ملائكة»","a":"الشاهد لغة «أكلوني البراغيث»؛ و«ملائكة» فاعل أو بدل أو مبتدأ مؤخر","e":"الشاهد اتصال واو الجماعة بالفعل مع ذكر الفاعل اسمًا ظاهرًا بعده، وهي لغة طيّئ وأزد شنوءة. وتخريج الجمهور أن «ملائكة» بدل من الواو أو مبتدأ مؤخر، وعلى تلك اللغة تكون فاعلًا والواو حرف دال على الجمع.","d":["جائز التأنيث (مع الفاعل الظاهر المؤنث المجازي)","يعملُ هؤلاء الرجالُ بصمتٍ","بدل مطابق (كل من كل)"]},{"q":"«يلومونني في اشتراء النخيل أهلي» — أعرب «أهلي»","a":"فاعل أو بدل (أو مبتدأ مؤخر)","e":"للعلة نفسها: لحقت الفعل واو الجماعة ثم ذُكر الفاعل الظاهر. فمن حمله على لغة «أكلوني البراغيث» أعربه فاعلًا، ومن حمله على الفصيح المشهور أعربه بدلًا من الواو أو مبتدأ مؤخرًا.","d":["شبه جملة (ظرف) مقدَّم","اسم يُذكر لبيان سبب وقوع الفعل","أن يدخل على الجملة الاسمية"]},{"q":"«دخل التلاميذ خلا ......»","a":"تلميذًا","e":"لأن «خلا» إذا لم تُسبق بـ«ما» جاز أن تكون فعلًا ماضيًا فينتصب ما بعدها مفعولًا به، وأن تكون حرف جر فيُجرّ. والمختار في الاختبارات النصب، وهو واجب لو سُبقت بـ«ما» المصدرية.","d":["إذا","لمّا","الكسرة"]},{"q":"أيّ الجمل صحيحة: ذهب الفلاحون / ذهب الفلاحين / ذهبوا الفلاحون؟","a":"ذهب الفلاحون إلى الحقل","e":"«الفلاحون» فاعل مرفوع بالواو لأنه جمع مذكر سالم. ونصبه بالياء خطأ لأنه ليس في موضع نصب أو جر، و«ذهبوا الفلاحون» على لغة قليلة لا يُقاس عليها في الاختبار.","d":["ذهب الفلاحون","ذهب الفلاحين","ذهبوا الفلاحون"]},{"q":"أيّ العبارات صحيحة: المركزان الأعليان / الأعلوان / الأعلى / الأعلتان؟","a":"المركزان الأعليان","e":"لأن «الأعلى» اسم مقصور آخره ألف، وعند تثنيته تُردّ الألف إلى أصلها الياء فيقال «الأعلَيان». ويجب أن ينعت المثنى بمثنى مطابق له في الإعراب والتعريف.","d":["الأعلوان","الأعلى","الأعلتان"]},{"q":"اختر الصحيح: إن هاتين المعلمتين مجتهدتان","a":"إن هاتين المعلمتين مجتهدتان","e":"«هاتين» اسم إشارة مبني في محل نصب اسم «إنّ»، و«المعلمتين» بدل أو نعت منصوب بالياء لأنه مثنى، و«مجتهدتان» خبر «إنّ» مرفوع بالألف. فاجتمع في الجملة نصب الاسم ورفع الخبر على الأصل.","d":["يعملُ هؤلاء الرجالُ بصمتٍ","فاعل أو بدل (أو مبتدأ مؤخر)","بدل بعض من كل"]},{"q":"«رُبّ بعيدٍ أنفعُ من قريب» — ما الفعل المناسب قبل «العرب»؟","a":"قالت العرب (ويصح: قال)","e":"لأن «العرب» اسم جمع يجوز في فعله التذكير والتأنيث؛ فالتأنيث باعتبار الجماعة والقبيلة، والتذكير باعتبار الجمع. فإن كانت الخيارات تجمع بين الوجهين فالجواب جوازهما معًا.","d":["الألف رفعًا، والياء نصبًا وجرًّا","بدل مطابق (كل من كل)","إن هاتين المعلمتين مجتهدتان"]},{"q":"المثنى اسم دلّ على اثنين؛ وعلامة رفعه…","a":"الألف","e":"ويُنصب ويُجرّ بالياء المفتوح ما قبلها المكسور ما بعدها. ونونه مكسورة دائمًا، وتُحذف عند الإضافة: كتابا اللغة، صاحبا عليٍّ.","d":["يَفُزْ","صحيحة","لمّا"]},{"q":"ما الذي يأتي بعد حرف الجر؟","a":"اسم مجرور","e":"لأن حرف الجر لا يدخل إلا على الأسماء، فيجرّها ويتعلق بالفعل أو بما يشبهه قبله. ولا يدخل حرف الجر على فعل إطلاقًا؛ وما ظاهره ذلك فمؤوَّل بمصدر، نحو «عجبتُ من أن تقومَ».","d":["تأتيَ — منصوبة","خبر كان مقدَّم، مبني على الفتح في محل نصب","مضاف إليه مجرور"]},{"q":"الفاعل هو…","a":"مَن قام بالفعل","e":"وهو اسم مرفوع تقدّمه فعل مبني للمعلوم. أما مَن وقع عليه الفعل فهو المفعول به، والحدث نفسه هو المصدر — وهذه هي الخيارات المضلِّلة في هذا السؤال.","d":["جائز الرفع والنصب","نون النسوة","بدل إضراب (البَداء)"]},{"q":"بم يُرفع الفعل المضارع؟","a":"بالضمة","e":"إذا كان صحيح الآخر ولم يسبقه ناصب ولا جازم. فإن كان من الأفعال الخمسة رُفع بثبوت النون، وإن كان معتل الآخر رُفع بضمة مقدَّرة منع من ظهورها التعذر أو الثقل.","d":["الكسرة","الألف","يَفُزْ"]},{"q":"عدد حالات رفع الفعل المضارع","a":"ثلاث حالات","e":"الرفع بالضمة الظاهرة في الصحيح الآخر، والرفع بالضمة المقدَّرة في المعتل الآخر، والرفع بثبوت النون في الأفعال الخمسة. وجامعها أنه يُرفع لتجرده من الناصب والجازم.","d":["واجب التقديم","الثامنةَ عشرةَ","قرأتُ خمسَ قصصٍ"]},{"q":"عدد حالات المُسنَد","a":"سبع","e":"وهي: الخبر، والفعل التام، واسم الفعل، والمبتدأ الوصف المستغني بمرفوعه عن الخبر، وأخبار النواسخ، والمصدر النائب عن فعله. وهذه كلها مواضع يُحكم فيها بشيء على شيء.","d":["حفظ","إذا","تلميذًا"]},{"q":"أيّ مما يلي من المرفوعات: المبتدأ / المفعول به / المفعول لأجله / المنادى؟","a":"المبتدأ","e":"لأن المبتدأ أصل المرفوعات في الجملة الاسمية. والمفعول به والمفعول لأجله والمنادى كلها منصوبات، والمضاف إليه مجرور.","d":["المفعول به","المفعول لأجله","المنادى"]},{"q":"أيّ مما يلي من المنصوبات: الفاعل / المفعول لأجله / المضاف إليه؟","a":"المفعول لأجله","e":"لأنه مصدر قلبي يُذكر لبيان سبب وقوع الفعل ويُنصب، نحو «قمتُ إجلالًا للمعلم». والفاعل مرفوع والمضاف إليه مجرور.","d":["الفاعل","المضاف إليه","نون التوكيد"]},{"q":"عرّف المفعول لأجله","a":"اسم يُذكر لبيان سبب وقوع الفعل","e":"وهو مصدر قلبي منصوب يشارك الفعلَ في الزمان والفاعل، نحو «سافرتُ طلبًا للعلم». ويفارق المفعول المطلق الذي هو مصدر من لفظ الفعل لتوكيده أو بيان نوعه أو عدده.","d":["بدل بعض من كل","يعملُ هؤلاء الرجالُ بصمتٍ","شبه جملة (ظرف) مقدَّم"]},{"q":"«قطفتُ الوردةَ» — الفعل في الجملة من حيث التأنيث","a":"جائز التأنيث (مع الفاعل الظاهر المؤنث المجازي)","e":"فـ«الوردة» مؤنث مجازيّ، والتأنيث مع المؤنث المجازي جائز لا واجب؛ تقول: طلع الشمسُ وطلعت الشمسُ. وإنما يجب التأنيث مع المؤنث الحقيقي المتصل بالفعل.","d":["الشاهد لغة «أكلوني البراغيث»؛ و«ملائكة» فاعل أو بدل أو مبتدأ مؤخر","فاعل أو بدل (أو مبتدأ مؤخر)","الألف رفعًا، والياء نصبًا وجرًّا"]},{"q":"أيّ الجمل خاطئة: فاطمة ساعدتها أمها / ساعدت فاطمةُ أمَّها / ساعد أمَّها فاطمةُ؟","a":"ساعد أمَّها فاطمةُ","e":"لأن الضمير في «أمها» يعود على «فاطمة» وهي متأخرة لفظًا ورتبةً، وعود الضمير على متأخر من الوجهين ممتنع. والصواب تقديم الفاعل أو جعل الاسم مبتدأ.","d":["فاطمة ساعدتها أمها","ساعدت فاطمةُ أمَّها","جائز الرفع والنصب"]},{"q":"اختر: فاز / فازت بالجائزة سيدةٌ من مصر","a":"الوجهان صحيحان","e":"لأن الفاعل المؤنث الحقيقي فُصل عن فعله بالجار والمجرور «بالجائزة»، والفصل يُجوِّز ترك التأنيث. فإن اتصل الفاعل بفعله وجب التأنيث: «فازت سيدةٌ بالجائزة».","d":["أربعةَ عشرَ","المفعول لأجله","واجب التقديم"]},{"q":"أين تُحذف نون المثنى ونون جمع المذكر السالم؟","a":"عند الإضافة، حذفًا واجبًا","e":"نحو: سافر والدا عليٍّ، وجاء عالِمو المدينة. ولا تُزاد ألف بعد الواو عند الحذف. ونون المثنى مكسورة ونون الجمع مفتوحة في كل الأحوال الإعرابية.","d":["بدل بعض من كل","إن هاتين المعلمتين مجتهدتان","ذهب الفلاحون إلى الحقل"]},{"q":"أعرب «عشر» في «اثنا عشر»","a":"اسم مبني على الفتح لا محل له من الإعراب","e":"لأنه وقع موقع نون المثنى المحذوفة، والنون حرف لا محل له. أما «اثنا» فتُعرب إعراب المثنى بالألف رفعًا وبالياء نصبًا وجرًّا.","d":["خبر مرفوع بالضمة","مفعول به منصوب","مالٍ (مجرور)"]},{"q":"«عند شراء الكتاب» — اختر الرسم الصحيح: شراؤك / شراءك / شراءِ","a":"شراءِ (مضاف إليه مجرور)","e":"لأن «عند» ظرف يُضاف، فيُجرّ الاسم بعده بالإضافة. والهمزة متطرفة بعد ألف فتُرسم مفردة على السطر، والكسرة علامة الجر لا تغيّر صورة الهمزة.","d":["شراؤك","شراءك","شراءِ"]}],"r":[{"t":"أقسام الكلمة وعلامات كل قسم","b":"\n<p>الكلمة في العربية ثلاثة أقسام لا رابع لها: <b>اسم</b> و<b>فعل</b> و<b>حرف</b>. و«الصفة» و«الظرف» و«العدد»\nكلها أسماء، فلا تُعدّ أقسامًا مستقلة — وهذا موضع خطأ كثير في الاختيارات.</p>\n<ul>\n<li><b>علامات الاسم:</b> الجرّ، والتنوين، ودخول «أل»، والنداء، والإسناد إليه. ويكفي في إثبات الاسمية علامة واحدة.</li>\n<li><b>علامات الفعل:</b> «قد»، والسين وسوف، وتاء التأنيث الساكنة، وتاء الفاعل، ونون التوكيد، وياء المخاطبة.</li>\n<li><b>علامة الحرف:</b> أن لا تصلح له علامة اسم ولا علامة فعل — فهو يُعرف بالسلب.</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>لماذا كانت الأقسام ثلاثة لا أكثر؟</b> لأن اللفظ إمّا أن يدلّ على معنى في نفسه أو لا؛ فإن لم يدلّ على معنى في نفسه فهو <b>الحرف</b>، وإن دلّ فإمّا أن يقترن بزمان محصّل فهو <b>الفعل</b>، أو لا يقترن فهو <b>الاسم</b>. وهذه قسمة عقلية حاصرة، ولذلك لم يصحّ عند الجمهور عدّ «الظرف» أو «الصفة» أو «الخالفة» قسمًا رابعًا، وإنما هي أنواع داخلة تحت الاسم.</li><li><b>العلامة دليل لا حدّ.</b> فرقٌ بين تعريف الاسم وبين علاماته؛ العلامة أمارةٌ يُستدلّ بها عند الاشتباه، ولذلك يكفي في إثبات الاسمية <b>علامة واحدة</b> ولا يُشترط اجتماعها. ولو اشتُرط الاجتماع لخرجت الأعلام الممنوعة من الصرف عن الاسمية؛ إذ لا تُنوّن ولا تدخلها «أل».</li><li><b>التنوين ليس علامة اسم على إطلاقه.</b> إنما العلامة <b>تنوين التمكين</b> (تنوين الأمكن) نحو «رجلٌ»؛ أما التنوين اللاحق للأفعال في مثل «ليكوننْ» و«لنسفعًا» فهو <b>نون التوكيد الخفيفة</b> لا تنوين، وتنوين الترنّم اللاحق للقوافي شيء آخر. وهذا موضع تخليط كثير في الاختبارات.</li><li><b>«أل» لا تدخل على الفعل أصلًا</b>، وما ورد من نحو قول الشاعر: «ما أنتَ بالحَكَمِ الـتُرضى حكومتُه» فـ«الـ» فيه موصولة بمعنى «الذي» داخلة على الجملة، وهو ضرورة لا يُقاس عليها. وجه الاستشهاد: دخولُ «أل» على المضارع في الضرورة، وهو شاذّ عند البصريين.</li><li><b>الاسم المتمكّن وغير المتمكّن.</b> الأسماء ثلاث طبقات: <b>متمكّن أمكن</b> (معرب منوّن) كـ«رجل»، و<b>متمكّن غير أمكن</b> (معرب غير منوّن) كـ«أحمد»، و<b>غير متمكّن</b> (مبني) كـ«هؤلاء». وبناء الاسم إنما جاء لشبهه بالحرف: شبهًا وضعيًّا أو معنويًّا أو استعماليًّا أو افتقاريًّا.</li><li><b>علامة الفعل الفارقة بين أنواعه:</b> الماضي تلحقه <b>تاء التأنيث الساكنة</b>، والمضارع يقبل <b>«لم»</b> و<b>السين وسوف</b>، والأمر يقبل <b>ياء المخاطبة مع دلالة الطلب</b>. وبهذا الأخير يُفرَّق بين فعل الأمر واسم الفعل: «نزالِ» اسم فعل لأنها لا تقبل ياء المخاطبة، و«انزلْ» فعل أمر لأنها تقبلها.</li><li><b>الحرف لا علامة له إثباتًا</b>، وإنما يُعرف بالسلب: ما لا يقبل علامة اسم ولا علامة فعل. وهذا من مواضع التعريف بالعدم في الصناعة النحوية.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الكتاب لسيبويه، والمقتضب للمبرد، والأصول في النحو لابن السراج، وشرح الكافية للرضي، وأوضح المسالك ومغني اللبيب لابن هشام، والهمع للسيوطي.</p></div>"},{"t":"المرفوعات والمنصوبات والمجرورات — الجرد الكامل","b":"\n<p><b>المرفوعات سبعة:</b> الفاعل، ونائب الفاعل، والمبتدأ، والخبر، واسم كان وأخواتها،\nوخبر إنّ وأخواتها، والتوابع للمرفوع (النعت والعطف والتوكيد والبدل).</p>\n<p><b>المنصوبات:</b> المفعول به، والمفعول المطلق، والمفعول لأجله، والمفعول فيه (الظرف)، والمفعول معه،\nوالحال، والتمييز، والمستثنى، والمنادى، واسم إنّ، وخبر كان، والتوابع للمنصوب.</p>\n<p><b>المجرورات ثلاثة:</b> المجرور بالحرف، والمضاف إليه، والتابع للمجرور.</p>\n<p><b>المُسنَد</b> سبعة مواضع كذلك: الخبر، والفعل التام، واسم الفعل، والمبتدأ الوصف المستغني بمرفوعه،\nوأخبار النواسخ، والمصدر النائب عن فعله. و<b>المسند إليه</b> هو ما أُسند إليه ذلك.</p>\n<p><b>مفاتيح التمييز في الأسئلة:</b> المفعول لأجله <b>مصدر قلبي</b> يُذكر لبيان سبب وقوع الفعل\n(قمتُ <b>إجلالًا</b> للمعلم)، والمفعول المطلق <b>مصدر من لفظ الفعل</b> لتوكيده أو بيان نوعه أو عدده\n(انطلق <b>انطلاقًا</b>)، والتمييز اسم نكرة يرفع إبهامَ ما قبله (اشتعل الرأس <b>شيبًا</b>).</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>ضابط الحصر:</b> المرفوعات عُمَدٌ في الغالب (الفاعل، نائبه، المبتدأ، الخبر، اسم كان، خبر إنّ)، والمنصوبات فَضَلات في الغالب (المفاعيل، الحال، التمييز)، والمجرورات لا تكون إلا بسبب خارجي: <b>حرف جرّ</b> أو <b>إضافة</b> أو <b>تبعية</b>. فمن سُئل: «ما الذي يجرّ الاسم؟» فالجواب ثلاثة لا رابع لها.</li><li><b>الفاعل أصل المرفوعات عند الجمهور</b> لأن عامله فعلٌ حقيقي، وذهب قوم إلى أن المبتدأ هو الأصل لتقدّمه ولأن عامله معنويّ. وثمرة الخلاف تظهر في ترتيب الأبواب لا في الحكم.</li><li><b>التوابع تدخل في الأقسام الثلاثة</b> لأنها تتبع ما قبلها رفعًا ونصبًا وجرًّا؛ فلا يصحّ أن يُقال «النعت مرفوع» على الإطلاق، بل «تابعٌ للمنعوت». والتوابع خمسة: النعت، والعطف بنوعيه (البيان والنسق)، والتوكيد، والبدل.</li><li><b>تنبيه على المجزومات:</b> الجزم خاصّ بالفعل المضارع، كما أن الجرّ خاصّ بالاسم؛ فلا اسم مجزوم ولا فعل مجرور. وقولهم في العوامل «رفع ونصب وجرّ وجزم» إنما هو جمع بين بابي الاسم والفعل.</li><li><b>خبر «كان» منصوب لا مجزوم ولا مجرور</b>، واسمها مرفوع؛ والعكس في «إنّ». وضابط الحفظ: الناسخ الفعلي يرفع الأول وينصب الثاني، والناسخ الحرفي ينصب الأول ويرفع الثاني.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: شرح المفصل لابن يعيش، وشرح التسهيل لابن مالك، وشرح ابن عقيل، والنحو الوافي.</p></div>"},{"t":"علامات الإعراب الأصلية والفرعية","b":"\n<table><tr><th>النوع</th><th>رفع</th><th>نصب</th><th>جر/جزم</th></tr>\n<tr><td>الاسم المفرد وجمع التكسير</td><td>ضمة</td><td>فتحة</td><td>كسرة</td></tr>\n<tr><td>جمع المؤنث السالم</td><td>ضمة</td><td><b>كسرة</b></td><td>كسرة</td></tr>\n<tr><td>المثنى</td><td><b>ألف</b></td><td><b>ياء</b></td><td><b>ياء</b></td></tr>\n<tr><td>جمع المذكر السالم</td><td><b>واو</b></td><td><b>ياء</b></td><td><b>ياء</b></td></tr>\n<tr><td>الأسماء الخمسة</td><td><b>واو</b></td><td><b>ألف</b></td><td><b>ياء</b></td></tr>\n<tr><td>الممنوع من الصرف</td><td>ضمة</td><td>فتحة</td><td><b>فتحة</b></td></tr>\n<tr><td>الأفعال الخمسة</td><td><b>ثبوت النون</b></td><td>حذف النون</td><td>حذف النون</td></tr>\n<tr><td>المضارع المعتل الآخر</td><td>ضمة مقدرة</td><td>فتحة ظاهرة (في الواوي واليائي)</td><td><b>حذف حرف العلة</b></td></tr></table>\n<p><b>تنبيه على سؤال متكرر:</b> علامة إعراب المثنى <b>الألف رفعًا والياء نصبًا وجرًّا</b>، لا الألف في الأحوال كلها.\nوجمع المؤنث السالم يُنصب بالكسرة نيابة عن الفتحة؛ ولهذا كانت الحركة في «إن الحسنات يُذهبن السيئات»\nعلى «الحسنات» <b>الكسرة</b> وهي اسم «إنّ» منصوب.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الأصل والفرع:</b> الأصلية أربع: الضمة للرفع، والفتحة للنصب، والكسرة للجرّ، والسكون للجزم. وما عداها فروعٌ نابت عنها لعلّة؛ والنيابة إمّا بحرف (الألف، الواو، الياء، ثبوت النون) أو بحركة (الكسرة نيابة عن الفتحة، والفتحة نيابة عن الكسرة) أو بالحذف (حذف النون، حذف حرف العلة).</li><li><b>جمع المؤنث السالم يُنصب بالكسرة</b> حملًا على الجرّ؛ وعلّة ذلك أن فتحه يؤدي إلى اجتماع ألفٍ وفتحة تثقل. و«مسلماتٍ» في النصب والجرّ سواء في اللفظ، ولا يُفرَّق بينهما إلا بالموقع.</li><li><b>الممنوع من الصرف يُجرّ بالفتحة</b> إلا إذا أُضيف أو دخلته «أل» فيعود إلى الكسرة: ﴿في أحسنِ تقويم﴾ جُرّ بالكسرة مع أن «أحسن» على وزن أفعل، لأنه مضاف. وهذه من ألزم المسائل للاختبار.</li><li><b>الأسماء الخمسة شروطها ستة:</b> أن تكون مكبّرة، مفردة، مضافة، وإضافتها إلى غير ياء المتكلم، وأن تكون «فو» خالية من الميم، و«ذو» بمعنى صاحب. فإن اختلّ شرط أُعربت بالحركات: «هذا أبٌ» بالضمة، و«رأيت أبي» بالفتحة المقدّرة.</li><li><b>المقصور يُقدَّر فيه الإعراب كلّه للتعذّر</b>، والمنقوص تُقدَّر فيه الضمة والكسرة للثقل وتظهر الفتحة لخفّتها: «جاء القاضي» ضمة مقدّرة، «رأيت القاضيَ» فتحة ظاهرة، «مررت بالقاضي» كسرة مقدّرة. وهذا الفرق هو مدار كثير من أسئلة الإعراب.</li><li><b>المضاف إلى ياء المتكلم</b> تُقدَّر فيه الحركات كلّها لاشتغال المحل بحركة المناسبة: «كتابي» مرفوعة أو منصوبة أو مجرورة بحركة مقدّرة.</li><li><b>المضارع المعتلّ الآخر يُجزم بحذف حرف العلة</b>، ويُرفع بضمة مقدّرة ويُنصب بفتحة ظاهرة إن كان بالواو أو الياء، ومقدّرة إن كان بالألف: «لن يسعى» فتحة مقدّرة، «لن يدعوَ» فتحة ظاهرة.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الألفية وشرح ابن عقيل، وقطر الندى وشذور الذهب لابن هشام، وحاشية الصبان على الأشموني.</p></div>"},{"t":"كان وأخواتها — الأفعال الناسخة","b":"\n<p>تدخل على الجملة الاسمية فترفع المبتدأ ويسمى <b>اسمها</b>، وتنصب الخبر ويسمى <b>خبرها</b>.</p>\n<p><b>أقسامها:</b> (1) ما يعمل بلا شرط: كان، أمسى، أصبح، أضحى، ظلّ، بات، صار، ليس.\n(2) ما يشترط أن يسبقه نفي أو شبهه: زال، برِح، فتِئ، انفكّ. (3) ما يشترط أن يسبقه «ما» المصدرية\nالظرفية: دام.</p>\n<p><b>من حيث التصرّف:</b> «كان» وأخواتها متصرفة تصرفًا تامًّا إلا <b>«ليس»</b> فجامدة لا ماضيَ لها ولا أمر،\nو«ما دام» جامدة كذلك. وهذا هو مدار سؤال «أيُّ الأفعال جامد؟» — فالجواب «ليس» و«بئس» و«نِعم» و«عسى»\nو«ما خلا»، والمتصرف مثل «حفظ» و«أكل» و«ذهب».</p>\n<p><b>خبر كان</b> يكون مفردًا وجملة وشبه جملة. وفي «كيف كنتَ؟» تُعرب «كيف» <b>خبر كان مقدَّمًا\nمبنيًّا على الفتح في محل نصب</b>، لأن أسماء الاستفهام لها الصدارة. وفي «أصبح بيننا متكاسلون»\nالخبر <b>شبه جملة</b> مقدَّم، و«متكاسلون» اسم أصبح مؤخر.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>التصرّف وعدمه:</b> من «كان» وأخواتها ما هو تامّ التصرف (كان، أصبح، أمسى، أضحى، ظلّ، بات، صار)، ومنها ناقص التصرّف يأتي منه الماضي والمضارع فقط (ما زال، ما برح، ما انفكّ، ما فتئ)، ومنها <b>جامد</b> لا يتصرّف أصلًا: <b>ليس</b> و<b>ما دام</b>. فالقول «كان وأخواتها كلها تامّة التصرف» خطأ.</li><li><b>«كان» قد تكون تامّة</b> بمعنى «وُجد» فترفع فاعلًا ولا تنصب خبرًا: ﴿وإن كان ذو عُسرةٍ فنَظِرةٌ﴾ على قراءة الرفع. وجه الاستشهاد: «ذو» فاعل لـ«كان» التامّة لا اسمها.</li><li><b>«كان» الزائدة</b> تقع بين المتلازمين للتوكيد ولا عمل لها: «ما كان أحسنَ زيدًا». وأكثر ما تزاد بلفظ الماضي بين «ما» التعجبية وفعل التعجب.</li><li><b>شرط عمل «ما زال» وأخواتها</b> تقدّم النفي أو شبهه عليها؛ فإن تجرّدت عن النفي لم تعمل عمل كان. و«ما دام» شرطها أن تُسبق بـ«ما» المصدرية الظرفية.</li><li><b>تقديم خبر «ليس» عليها</b> فيه خلاف مشهور: منعه الكوفيون وجمهور البصريين أجازوه، واحتُجّ للجواز بقوله تعالى ﴿ألا يومَ يأتيهم ليس مصروفًا عنهم﴾ على أحد الأوجه.</li><li><b>حذف «كان» مع اسمها</b> كثير بعد «إنْ» و«لو»: «التمسْ ولو خاتمًا من حديد» أي: ولو كان الملتمَس خاتمًا. وهذا باب يُسأل عنه بصيغة «ما تقدير المحذوف؟».</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الكتاب لسيبويه، وشرح التسهيل، ومغني اللبيب، وشرح الأشموني، والنحو الوافي.</p></div>"},{"t":"إنّ وأخواتها — الحروف الناسخة","b":"\n<p>عملها عكس عمل كان: تدخل على الجملة الاسمية فتنصب المبتدأ ويصير <b>اسمها</b>، وترفع الخبر ويصير <b>خبرها</b>.</p>\n<ul>\n<li><b>إنّ وأنّ:</b> للتوكيد. وتُكسر «إنّ» في الابتداء وبعد القول، وتُفتح «أنّ» إذا صحّ تأويلها مع ما بعدها بمصدر.</li>\n<li><b>كأنّ:</b> للتشبيه.</li>\n<li><b>لكنّ:</b> للاستدراك، ولا تقع في صدر الكلام لأن الاستدراك يقتضي كلامًا سابقًا يُستدرك عليه؛\nتقول: «الجو بارد ولكنّ السماء صافية» دفعًا لفهمٍ خاطئ عند السامع.</li>\n<li><b>ليت:</b> للتمني، وهو طلب المستحيل أو البعيد المنال: «ألا ليت الشبابَ يعودُ يومًا».</li>\n<li><b>لعلّ:</b> للترجّي، وهو طلب الأمر المحبوب الممكن المتوقَّع: «لعلّ الله يأتي بالفرج».</li>\n</ul>\n<p><b>الفرق الحاسم بين التمني والترجي:</b> التمني لما لا يُرجى وقوعه، والترجي لما يُرجى ويمكن.</p>\n<p><b>مسألة الخبر الثاني:</b> في «إنّ الله غفورٌ رحيمٌ» تُعرب «غفور» خبر إنّ، و«رحيم» <b>خبرًا ثانيًا</b> مرفوعًا،\nلأن الناسخ يجوز تعدد خبره كما يتعدد خبر المبتدأ.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>سبب التسمية «مشبهة بالفعل»:</b> لأنها على وزن الفعل الماضي في لزوم الفتح آخرًا، ولأنها تعمل عمله، ولأن معانيها معاني أفعال (أكّدتُ، شبّهتُ، استدركتُ، تمنّيتُ، ترجّيتُ).</li><li><b>كسر همزة «إنّ» وفتحها ضابطه:</b> تُكسر حيث تقع موقع الجملة (ابتداءً، وبعد القول، وبعد القسم، وفي الصلة، وفي الحال)، وتُفتح حيث يصحّ أن يحلّ محلّها المصدر: «علمتُ أنك قادم» أي: علمت قدومك. وهذا من أكثر ما يُسأل عنه.</li><li><b>دخول اللام المزحلقة</b> على الخبر يختصّ بـ«إنّ» المكسورة دون أخواتها: «إنّ زيدًا لقائم». وسُمّيت مزحلقة لأنها زُحلقت عن الاسم إلى الخبر كراهة ابتداء الكلام بمؤكّدين.</li><li><b>إذا لحقت «ما» الكافّة</b> هذه الحروف بطل عملها ودخلت على الجمل الفعلية: «إنما يخشى اللهَ من عباده العلماءُ» — «العلماء» فاعل لا خبر. ويُستثنى <b>«ليت»</b> فيجوز فيها الإعمال والإهمال.</li><li><b>«لكنّ» للاستدراك وشرطه</b> تقدّم كلام مخالف؛ فلا يُقال «جاء زيد لكنّ عمرًا جاء»، بل لا بدّ من مخالفة بين الجملتين.</li><li><b>العطف على اسم «إنّ»:</b> يجوز رفع المعطوف بعد استيفاء الخبر: ﴿إنّ اللهَ بريءٌ من المشركين ورسولُه﴾ برفع «رسوله» على الابتداء أو العطف على محلّ اسم «إنّ». وجه الاستشهاد: جواز مراعاة المحلّ.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: المفصل للزمخشري وشرحه لابن يعيش، ومغني اللبيب، وهمع الهوامع، والدر المصون.</p></div>"},{"t":"لا النافية للجنس","b":"\n<p>تعمل عمل «إنّ» فتنصب الاسم وترفع الخبر، بشروط أربعة: أن يكون معمولاها <b>نكرتين</b>،\nوأن لا يفصل بينها وبين اسمها فاصل، وأن لا تُسبق بحرف جر، وأن تكون نافية للجنس على سبيل الاستغراق.</p>\n<p><b>حالات اسمها:</b> إن كان مضافًا أو شبيهًا بالمضاف فهو <b>منصوب</b> (لا طالبَ علمٍ مذمومٌ)،\nوإن كان مفردًا بُني على ما يُنصب به في محل نصب (لا رجلَ في الدار).</p>\n<p>وهذا هو مدار السؤال: «معمولا لا النافية للجنس» الجواب <b>نكرتان</b>.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>شروط عملها خمسة:</b> أن تكون نافية للجنس، وأن يكون اسمها وخبرها نكرتين، وألّا يفصل بينها وبين اسمها فاصل، وألّا تُسبق بحرف جرّ، وأن يكون النفي نصًّا على الاستغراق. فإن اختلّ شرط ألغي عملها ووجب التكرار غالبًا: «لا في الدار رجلٌ ولا امرأةٌ».</li><li><b>بناء اسمها ونصبه:</b> يُبنى على ما يُنصب به إن كان مفردًا (أي غير مضاف ولا شبيه بالمضاف): «لا رجلَ في الدار»؛ ويُنصب إن كان مضافًا «لا طالبَ علمٍ مذمومٌ» أو شبيهًا بالمضاف «لا طالعًا جبلًا حاضرٌ».</li><li><b>حذف الخبر</b> كثير إذا دلّ عليه دليل، وهو الغالب في الاستعمال المصري الشائع: «لا شكَّ» و«لا بأسَ» و«لا ريبَ» — الخبر محذوف تقديره «في ذلك» أو «موجود».</li><li><b>الفرق بينها وبين «لا» العاملة عمل ليس:</b> النافية للجنس تنفي الجنس كلّه نصًّا فيمتنع الاستدراك، والعاملة عمل ليس تنفي الواحد فيصحّ: «لا رجلٌ أفضلَ منك بل رجلان».</li><li><b>نعت اسم «لا» المبني</b> يجوز فيه ثلاثة أوجه: البناء على الفتح، والنصب، والرفع — إن كان مفردًا متّصلًا: «لا رجلَ ظريفَ/ظريفًا/ظريفٌ في الدار».</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: شرح الكافية للرضي، وأوضح المسالك، وشرح الأشموني وحاشية الصبان.</p></div>"},{"t":"الفاعل ونائب الفاعل","b":"\n<p><b>الفاعل</b> اسم مرفوع تقدّمه فعل مبني للمعلوم ودلّ على من فعل الفعل أو اتّصف به.\nو<b>نائب الفاعل</b> اسم مرفوع حلّ محل الفاعل بعد حذفه وبناء الفعل للمجهول.</p>\n<p><b>بناء الفعل للمجهول:</b> في الماضي يُضمّ أوله ويُكسر ما قبل آخره (كتب ← كُتِبَ، استخرج ← اسْتُخْرِجَ)،\nوفي المضارع يُضمّ أوله ويُفتح ما قبل آخره (يكتب ← يُكتَبُ).</p>\n<p><b>تنبيه:</b> نائب الفاعل هو <b>الذي حلّ محل الفاعل</b>، وليس بالضرورة آخر كلمة في الجملة.\nففي «أُعطِيَ الموظفُ مكافأةً» نائب الفاعل «الموظفُ» و«مكافأةً» مفعول به ثانٍ باقٍ على نصبه.\nوفي «بِعتُ السلعةَ» الفعل مبني للمعلوم و«السلعةَ» مفعول به؛ فإن قلت «بِيعت السلعةُ» صارت نائب فاعل.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الفاعل لا يتقدّم على فعله</b>؛ فإن تقدّم الاسم صار مبتدأ والفعل بعده خبرًا: «محمدٌ حضر» — «محمد» مبتدأ لا فاعل. وهذا ضابط قاطع يُفرّق به بين الجملة الاسمية والفعلية.</li><li><b>الفاعل قد يُجرّ لفظًا</b> بحرف جرّ زائد ويبقى مرفوعًا محلًّا: ﴿وكفى بالله شهيدًا﴾ — لفظ الجلالة فاعل مرفوع محلًّا مجرور لفظًا بالباء الزائدة. وجه الاستشهاد: زيادة الباء في الفاعل بعد «كفى».</li><li><b>الفاعل قد يكون مصدرًا مؤوّلًا:</b> «يسرّني أن تنجح» — المصدر المؤوّل «نجاحك» في محل رفع فاعل.</li><li><b>ما ينوب عن الفاعل أربعة</b> لا واحد: المفعول به، والجار والمجرور، والظرف المتصرّف المختصّ، والمصدر المختصّ. فيقال: «سِيرَ يومُ الجمعة» و«جُلس أمامَ الأمير» و«صِيم رمضانُ». وشرط الظرف والمصدر أن يكونا مختصّين لا مبهمين.</li><li><b>إذا وُجد مفعول به لم ينب غيره</b> عند جمهور البصريين؛ فلا يُقال «سِيرَ بزيدٍ الطريقُ» مع وجود المفعول.</li><li><b>«من قِبَل» خطأ شائع:</b> قولهم «فُتح الباب من قِبَل الوزير» جمعٌ بين المبني للمجهول وذكر الفاعل، وهو من أثر الترجمة؛ والصواب «فتح الوزيرُ البابَ» أو «فُتح البابُ» وحدها.</li><li><b>تغيير صيغة الفعل عند البناء للمجهول:</b> يُضمّ أوّله ويُكسر ما قبل آخره في الماضي، ويُضمّ أوّله ويُفتح ما قبل آخره في المضارع؛ فإن كان أجوف قُلب: «باع ← بِيع»، «قال ← قِيل».</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الكتاب لسيبويه، والمقتضب، وشرح التسهيل، وجامع الدروس العربية.</p></div>"},{"t":"الفعل المضارع — رفعه ونصبه وجزمه وبناؤه","b":"\n<p><b>يُرفع</b> المضارع إذا تجرّد من ناصب وجازم. وعلامة رفعه <b>الضمة</b> إن كان صحيح الآخر،\nو<b>ثبوت النون</b> في الأفعال الخمسة، و<b>ضمة مقدرة</b> في معتل الآخر.</p>\n<p><b>يُنصب</b> بأحد النواصب: أنْ، لن، كي، إذنْ، لام التعليل، ولام الجحود، وحتى، وفاء السببية،\nوواو المعية، وأو بمعنى «إلى أن» — والأربعة الأخيرة ينصب بعدها بـ«أن» مضمرة.</p>\n<p><b>يُجزم</b> بـ: لم، لمّا، لام الأمر، لا الناهية — وبأدوات الشرط الجازمة.</p>\n<p><b>ويُبنى</b> في موضعين فقط: على <b>السكون</b> إذا اتصلت به <b>نون النسوة</b> (الطالباتُ يَكتبْنَ)،\nوعلى <b>الفتح</b> إذا اتصلت به <b>نون التوكيد</b> مباشرةً (واللهِ لأجتهدَنَّ).</p>\n<p><b>حكم «إذنْ»:</b> ينتصب المضارع بعدها <b>وجوبًا</b> بثلاثة شروط: أن تكون في صدر الكلام،\nوأن يكون الفعل مستقبلًا، وأن لا يُفصل بينهما بفاصل. فإن سُبقت بحرف عطف كالواو جاز الوجهان:\nالرفع والنصب.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>المضارع معرب إلا في حالين:</b> يُبنى على السكون إذا اتصلت به <b>نون النسوة</b>: ﴿والوالداتُ يُرضِعْنَ﴾، ويُبنى على الفتح إذا اتصلت به <b>نون التوكيد</b> مباشرة: ﴿لَيُسجَنَنَّ﴾. وما عدا ذلك فمعرب.</li><li><b>إذا فُصل بينه وبين نون التوكيد فاصل</b> (ألف الاثنين أو واو الجماعة أو ياء المخاطبة) بقي معربًا: «هل تذهبانِّ؟» — الفعل مرفوع بثبوت النون، ونون التوكيد مشدّدة بعدها.</li><li><b>نواصب المضارع أربعة لا أكثر</b> تنصب بنفسها: <b>أنْ، لن، كي، إذن</b>. وما عداها (لام التعليل، لام الجحود، حتى، فاء السببية، واو المعية، أو بمعنى إلى/إلا) فالنصب فيه <b>بأنْ مضمرة</b>. وهذا سؤال متكرّر بصيغة «الناصب هنا…».</li><li><b>شروط عمل «إذن» ثلاثة:</b> التصدير، والاستقبال، وألّا يُفصل بينها وبين الفعل بغير القسم أو «لا». فإن تخلّف شرط أُهملت: «أنا إذن أكرمُك» بالرفع.</li><li><b>الجوازم قسمان:</b> ما يجزم فعلًا واحدًا (لم، لمّا، لام الأمر، لا الناهية)، وما يجزم فعلين (أدوات الشرط). والفرق بين «لم» و«لمّا»: «لمّا» تفيد استمرار النفي إلى زمن التكلم مع توقّع الحصول، ويجوز حذف مجزومها: «قاربتُ المدينةَ ولمّا» أي: ولمّا أدخلها.</li><li><b>«لا» الناهية و«لا» النافية</b> يُفرَّق بينهما بالمعنى والعمل: الناهية طلبية جازمة «لا تكذبْ»، والنافية خبرية لا تعمل «لا يكذبُ المؤمنُ». والخطأ في تسكين الفعل بعد النافية شائع.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الألفية وشروحها، ومغني اللبيب، وشرح الأشموني، والنحو الوافي.</p></div>"},{"t":"أدوات الشرط الجازمة وغير الجازمة","b":"\n<p><b>الجازمة لفعلين</b> (فعل الشرط وجوابه): إنْ، مَن، ما، مهما، متى، أيّان، أين، أنّى، حيثما، كيفما، أيّ، إذما.</p>\n<p><b>الجازمة لفعل واحد:</b> لم، لمّا، لام الأمر، لا الناهية.</p>\n<p><b>غير الجازمة:</b> إذا، لو، لولا، لوما، أمّا، كلّما، لمّا الحينية.\nوهذا هو جواب السؤال المتكرر: «كلّ ما يلي أدوات جازمة لفعلين ما عدا… → <b>إذا</b>»، لأنها ظرف لما يُستقبل\nمن الزمان متضمن معنى الشرط، وهي غير جازمة في الاستعمال الفصيح.</p>\n<p><b>تطبيق:</b> «مَن يتقِ الله ...... بالجنة» الجواب <b>يَفُزْ</b>، لأنه جواب الشرط مجزوم بالسكون،\nو«مَن» جزمت فعلين: «يتقِ» (مجزوم بحذف حرف العلة) و«يفزْ» (مجزوم بالسكون).</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الجازمة أحد عشر:</b> إنْ، إذما (حرفان)، ومَن، ما، مهما، متى، أيّان، أين، أنّى، حيثما، كيفما، أيّ (أسماء). وغير الجازمة: لو، لولا، لوما، أمّا، إذا، كلّما، لمّا الحينية.</li><li><b>«إذا» غير جازمة في الاختيار</b> وهي ظرف لما يُستقبل مضمّن معنى الشرط، وجزمها ضرورة شعرية. و«إنْ» للمشكوك فيه، و«إذا» للمقطوع بوقوعه؛ ولهذا قال تعالى ﴿إذا جاء نصرُ الله﴾ ولم يقل «إنْ».</li><li><b>اقتران جواب الشرط بالفاء واجب</b> في سبعة مواضع يجمعها قولهم: اسمية، طلبية، جامدة، بـ«ما» النافية، بـ«لن»، بـ«قد»، بـ«السين أو سوف». وضابطها: كلّ جواب لا يصلح أن يكون شرطًا.</li><li><b>«لولا» حرف امتناع لوجود</b> يليها مبتدأ خبره محذوف وجوبًا تقديره «موجود»: ﴿ولولا فضلُ اللهِ عليكم﴾. فمن أعرب ما بعدها فاعلًا فقد أخطأ.</li><li><b>جزم المضارع في جواب الطلب</b> على تقدير شرط: «ذاكرْ تنجحْ» أي: إن تذاكرْ تنجحْ. ويُشترط أن يكون الجواب مترتّبًا على الطلب؛ فلا يُقال «لا تدنُ من الأسد يأكلْك» بالجزم إلا على تأويل.</li><li><b>اجتماع الشرط والقسم:</b> إذا اجتمعا فالجواب للسابق منهما، وإن تقدّمهما ذو خبر فالجواب للشرط. وهذه قاعدة يكثر السؤال عنها في التخصص.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: مغني اللبيب، وشرح التسهيل، والهمع، والإنصاف في مسائل الخلاف.</p></div>"},{"t":"النصب بأن المضمرة بعد واو المعية وفاء السببية","b":"\n<p>إذا وقع المضارع بعد <b>واو المعية</b> أو <b>فاء السببية</b> مسبوقًا بنفي أو طلب (أمر، نهي، استفهام، تمنٍّ،\nعرض، تحضيض، ترجٍّ، دعاء)، نُصب بـ«أن» مضمرة <b>وجوبًا</b>.</p>\n<p><b>الشاهد المشهور:</b> «لا تنهَ عن خُلقٍ وتأتيَ مثلَه» — فـ«تأتيَ» مضارع منصوب بـ«أن» مضمرة وجوبًا\nبعد واو المعية، وعلامة نصبه الفتحة الظاهرة. والمعنى: لا يجتمع منك النهيُ والإتيانُ بالفعل نفسه.\nوالبيت يُنسب إلى أبي الأسود الدؤلي.</p>\n<p>ولو رُفعت «تأتي» لتغيّر المعنى إلى العطف على «تنهَ» المجزوم، أي: ولا تأتي مثله — وهو معنى آخر.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>شرط النصب بعد الفاء والواو</b> أن تُسبقا بنفي محض أو طلب محض. والطلب يشمل: الأمر، والنهي، والاستفهام، والتمنّي، والترجّي، والعرض، والتحضيض، والدعاء.</li><li><b>النفي المحض</b> يخرج منه النفي المنقوض بـ«إلّا»؛ فلا يُنصب في «ما تأتينا إلا وتحدّثنا» لأن النفي انتقض فصار إثباتًا.</li><li><b>فاء السببية تفيد السببية والمعية معًا</b>، وواو المعية تفيد المصاحبة فقط: «لا تأكلِ السمكَ وتشربَ اللبنَ» أي: لا تجمع بينهما؛ فلو رُفع «تشربُ» صار نهيًا عن كلٍّ على حدة، ولو جُزم صار نهيًا مستأنفًا. فتغيّر الحركة يغيّر المعنى كلّه.</li><li><b>لام الجحود</b> هي اللام المسبوقة بـ«كان» منفية: ﴿وما كان اللهُ ليُعذّبهم﴾ — النصب بأن مضمرة وجوبًا بعدها. وجه الاستشهاد: لزوم إضمار «أن» بعد لام الجحود.</li><li><b>«حتى» الناصبة</b> تكون بمعنى «إلى أن» أو «كي»؛ فإن كان الفعل بعدها حالًا أو ماضي المعنى رُفع: «مرضَ حتى لا يرجونه» بالرفع لأن عدم الرجاء حاصل.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: مغني اللبيب، وشرح ابن عقيل، وحاشية الصبان، والدر المصون.</p></div>"},{"t":"الممنوع من الصرف","b":"\n<p>الممنوع من الصرف اسم لا يُنوَّن ويُجرّ <b>بالفتحة</b> نيابة عن الكسرة، إلا إذا أُضيف أو دخلته «أل»\nفيرجع إلى الجرّ بالكسرة.</p>\n<p><b>ما يُمنع لعلّة واحدة:</b> (1) صيغة منتهى الجموع: كل جمع تكسير بعد ألفه حرفان أو ثلاثة أوسطها ساكن\n— مساجد، مصابيح، قناديل. (2) المختوم بألف التأنيث المقصورة أو الممدودة — ذكرى، صحراء، أصدقاء.</p>\n<p><b>ما يُمنع لعلّتين:</b> العَلَم إذا كان أعجميًّا (إبراهيم) أو مؤنثًا (فاطمة) أو على وزن الفعل (أحمد، يزيد)\nأو معدولًا (عُمَر، زُحَل) أو مركبًا تركيبًا مزجيًّا (حضرموت) أو مختومًا بألف ونون زائدتين (عثمان).\nوالصفة إذا كانت على وزن «أفعل» (أحمر) أو «فَعلان» (عطشان) أو معدولة (مَثنى، ثُلاث، أُخَر).</p>\n<p><b>تطبيق:</b> «صليتُ في مساجدَ كثيرةٍ» — «مساجدَ» اسم مجرور وعلامة جره <b>الفتحة</b> لأنه ممنوع من الصرف\nعلى صيغة منتهى الجموع. ولو قلت «في المساجدِ» لجررتَه بالكسرة لدخول «أل».</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>العلّة في المنع</b> أن الاسم أشبه الفعل؛ ولمّا كان الفعل فرعًا عن الاسم، فإذا اجتمعت في الاسم علّتان من علل الفرعية مُنع ما يختصّ به الأصل وهو التنوين والجرّ بالكسرة.</li><li><b>العلل تسع</b> يجمعها قولهم: «عدلٌ ووصفٌ وتأنيثٌ ومعرفةٌ / وعُجمةٌ ثم جمعٌ ثم تركيبُ / والنون زائدةٌ من قبلها ألفٌ / ووزن فعلٍ وهذا القولُ تقريبُ». ولا بدّ من اجتماع علّتين، إلا في صيغة منتهى الجموع وألف التأنيث فإن كلًّا منهما يقوم مقام علّتين.</li><li><b>صيغة منتهى الجموع</b> هي كل جمع بعد ألف تكسيره حرفان (مساجد) أو ثلاثة أوسطها ساكن (مصابيح). وهي ممنوعة ولو كانت نكرة. ويُستثنى ما خُتم بتاء كـ«صيارفة» فإنه مصروف.</li><li><b>العلم المؤنث:</b> إن كان ثلاثيًّا ساكن الوسط أعجميًّا مُنع، وإن كان عربيًّا ساكن الوسط جاز الوجهان: «هندٌ» و«هندُ». وإن تحرّك وسطه كـ«سَقَر» مُنع.</li><li><b>العلم المختوم بألف ونون زائدتين</b> ممنوع: «عثمان، مروان». فإن كانت النون أصلية كـ«حسّان» من الحسّ صُرف، ومن الحُسن مُنع. وهذا موضع لطيف يُسأل عنه.</li><li><b>يُجرّ بالكسرة في حالين فقط:</b> إذا أُضيف، أو دخلته «أل». ﴿وأنتم عاكفون في المساجدِ﴾ بالكسرة لدخول «أل».</li><li><b>الممنوع يُصرف للضرورة الشعرية</b>، كقول الشاعر: «ويومَ دخلتُ الخِدرَ خِدرَ عُنَيزةٍ» بتنوين «عنيزة» وهو علم مؤنث. وجه الاستشهاد: صرف ما لا ينصرف في الشعر.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الكتاب لسيبويه، والألفية وشرح ابن عقيل، وشرح الأشموني، والهمع.</p></div>"},{"t":"أنواع المعرفة والنكرة","b":"\n<p><b>المعارف سبع</b> مرتبةً في التعريف: الضمير، ثم العَلَم، ثم اسم الإشارة، ثم الاسم الموصول،\nثم المُعرَّف بـ«أل»، ثم المضاف إلى معرفة، ثم المنادى المقصود بالنداء.</p>\n<p><b>النكرة</b> ما دلّ على شائع في جنسه ويقبل «أل» المؤثِّرة للتعريف.</p>\n<p><b>تنبيهات امتحانية:</b> «اسم الفاعل» و«جمع المذكر السالم» ليسا من المعارف بذاتهما — إنما يتعرفان بالإضافة\nأو بـ«أل». و«المضاف إلى نكرة» يبقى نكرة. و«التمييز» و«الحال» نكرتان وجوبًا في الأصل.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>المعارف سبع</b> مرتّبة من الأعرف إلى الأقلّ: الضمير، ثم العلم، ثم اسم الإشارة، ثم الموصول، ثم المعرّف بأل، ثم المضاف إلى معرفة، ثم المنادى المقصود. وفي ترتيب الضمير والعلم خلاف مشهور.</li><li><b>النكرة قد تفيد العموم</b> في سياق النفي والنهي والشرط والاستفهام: «ما جاء أحدٌ» تعمّ، بخلافها في الإثبات. وهذه قاعدة أصولية لغوية يُبنى عليها كثير من المعاني.</li><li><b>«أل» ثلاثة أنواع:</b> عهدية (ذكري أو ذهني أو حضوري)، وجنسية (لاستغراق الأفراد أو الخصائص أو لبيان الحقيقة)، وزائدة (لازمة كـ«اللات»، أو غير لازمة في الضرورة).</li><li><b>الاسم الموصول لا يتعرّف إلا بصلته</b>؛ فالصلة جزء منه لا يتمّ معناه إلا بها، ولا محلّ لها من الإعراب. ولا بدّ في الصلة من <b>عائد</b> يربطها بالموصول، وقد يُحذف إن كان مفعولًا: ﴿أهذا الذي بعث اللهُ رسولًا﴾.</li><li><b>العلم المنقول والمرتجل:</b> المنقول ما استُعمل قبل العلمية في معنى آخر (فضل، حسن)، والمرتجل ما وُضع من أول أمره علمًا (سعاد، أدد).</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: شرح الكافية للرضي، والمفصل وشرحه، وأوضح المسالك، والنحو الوافي.</p></div>"},{"t":"البدل وأنواعه الأربعة","b":"\n<p>البدل تابع مقصود بالحكم بلا واسطة، ويتبع المبدلَ منه في إعرابه. وأنواعه:</p>\n<ul>\n<li><b>بدل مطابق (كل من كل):</b> يطابق المبدل منه في المعنى — «ذلك الكتابُ لا ريب فيه»، «الكتاب» بدل مطابق.</li>\n<li><b>بدل بعض من كل:</b> جزء حقيقي من المبدل منه ولا بد فيه من ضمير يعود عليه —\n«أكلتُ الرغيفَ ثُلثَه»، «اتقوا الله في الضعيفين: المرأةِ واليتيم».</li>\n<li><b>بدل اشتمال:</b> ليس جزءًا منه لكنه معنى يشتمل عليه المبدل منه، ولا بد من ضمير —\n«أعجبني الرجلُ خُلُقُه»، «نفعني المعلمُ علمُه».</li>\n<li><b>بدل الإضراب (البَداء / الغلط):</b> أن تذكر شيئًا ثم تُعرض عنه إلى غيره — «أكلتُ خبزًا لحمًا».</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>البدل هو المقصود بالحكم</b>، والمبدل منه في نيّة الطرح؛ ولهذا قالوا: «البدل على نيّة تكرار العامل». وهذا هو الفارق الجوهري بينه وبين النعت وعطف البيان.</li><li><b>الأنواع أربعة لا ثلاثة:</b> بدل كلٍّ من كلّ (المطابق)، وبدل بعضٍ من كلّ، وبدل اشتمال، و<b>بدل الغلط/الإضراب/النسيان</b> (ويُسمّى البدل المباين). وكثير من المختصرات تُسقط الرابع.</li><li><b>بدل البعض وبدل الاشتمال لا بدّ فيهما من ضمير</b> يربطهما بالمبدل منه، ملفوظًا أو مقدّرًا: «أكلتُ الرغيفَ ثلثَه»، «أعجبني زيدٌ علمُه». والفرق: بدل البعض جزء حسّيّ، وبدل الاشتمال معنى يشتمل عليه المبدل منه.</li><li><b>يصحّ إبدال النكرة من المعرفة والعكس</b>: ﴿لنسفعًا بالناصية ∗ ناصيةٍ كاذبة﴾ — أبدل النكرة الموصوفة من المعرفة. وجه الاستشهاد: جواز بدل النكرة الموصوفة من المعرفة.</li><li><b>الفرق بين البدل وعطف البيان:</b> عطف البيان كالنعت في أنه موضِّح لا مقصود بالحكم، والبدل مقصود. ومن الفروق أن البدل يصحّ حلوله محلّ المبدل منه، وعطف البيان جامد لا يصلح للنعت.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: شرح التسهيل، وأوضح المسالك، وشرح ابن عقيل، وهمع الهوامع.</p></div>"},{"t":"العدد وتمييزه","b":"\n<p><b>القاعدة الكبرى:</b> العددان 1 و2 يوافقان المعدود في التذكير والتأنيث.\nوالأعداد من 3 إلى 9 <b>تخالف</b> المعدود. والعدد 10 مفردًا يخالف، ومركّبًا يوافق.\nوالعقود وما بينها (20–90) بلفظ واحد لا تتغير.</p>\n<p><b>في الأعداد المركبة (11–19):</b> الجزء الأول من 13 إلى 19 يخالف المعدود، والجزء الثاني (عشر/عشرة) يوافقه.\nأما 11 و12 فجزآهما يوافقان المعدود.</p>\n<p><b>تطبيقات محسومة:</b></p>\n<ul>\n<li>«تزوّج وعمره 16 عامًا» ← <b>ستةَ عشرَ</b>؛ لأن المعدود «عامًا» مذكر، فالجزء الأول يخالفه بالتاء،\nوالجزء الثاني يوافقه بالتذكير.</li>\n<li>«أكرمت المدرسة 14 معلمًا» ← <b>أربعةَ عشرَ</b>، للعلّة نفسها.</li>\n<li>«نجحت ...... طالبة» ← <b>اثنتا عشرةَ</b>؛ لأن المعدود مؤنث والجزآن يوافقانه، وهي مرفوعة بالألف\nلأنها ملحقة بالمثنى.</li>\n<li>«منذ السنة 18 من عمره» ← <b>الثامنةَ عشرةَ</b>؛ لأنه عدد ترتيبي وصف لـ«السنة» وهي مؤنثة،\nفيؤنَّث الجزآن.</li>\n<li>«قرأتُ ...... قصصٍ» ← <b>خمسَ قصصٍ</b>؛ لأن مفرد «قصص» هو «قصة» وهو مؤنث،\nفيخالفه العدد بالتجرد من التاء، وتمييزه جمع مجرور بالإضافة.</li>\n</ul>\n<p><b>تمييز «كم»:</b> الاستفهامية تمييزها <b>مفرد منصوب</b> — «كم طالبًا في المدرسة؟».\nوالخبرية تمييزها <b>مفرد أو جمع مجرور</b> — «كم مالٍ عندي!».</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>قاعدة المخالفة:</b> من ٣ إلى ١٠ يخالف العدد معدودَه تذكيرًا وتأنيثًا؛ ومن ١١ إلى ١٩ يوافقه إلا «اثنا عشر» فيوافق في الجزأين. والعبرة في التذكير والتأنيث بـ<b>مفرد المعدود</b> لا بلفظ الجمع.</li><li><b>تمييز الأعداد:</b> من ٣ إلى ١٠ جمع مجرور بالإضافة، ومن ١١ إلى ٩٩ مفرد منصوب، و١٠٠ و١٠٠٠ ومضاعفاتهما مفرد مجرور بالإضافة. ﴿تسعةَ عشرَ﴾ — «عشر» جزء العدد لا تمييز.</li><li><b>ألفاظ العقود</b> (عشرون إلى تسعين) لا تتغيّر بتذكير ولا تأنيث، وتُعرب إعراب جمع المذكر السالم.</li><li><b>«أحد عشر» و«اثنا عشر»:</b> الأول مبني على فتح الجزأين، والثاني يُعرب جزؤه الأول إعراب المثنى ويُبنى جزؤه الثاني. فيقال: «جاء اثنا عشرَ طالبًا» و«رأيت اثنَيْ عشرَ طالبًا».</li><li><b>كناية العدد «كم»:</b> الاستفهامية تمييزها مفرد منصوب، والخبرية تمييزها مفرد أو جمع مجرور: «كم كتابًا قرأت؟» و«كم كتابٍ قرأتُ!». وهذا فرق دقيق كثير الورود.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: شرح الأشموني، والنحو الوافي، وجامع الدروس العربية.</p></div>"},{"t":"الاستثناء","b":"\n<p>أدواته: إلّا، غير، سوى، خلا، عدا، حاشا، ليس، لا يكون.</p>\n<p><b>مع «إلّا»:</b> إن كان الكلام تامًّا موجبًا وجب نصب المستثنى (حضر الطلابُ إلا طالبًا).\nوإن كان تامًّا منفيًّا جاز النصب والبدل (ما حضر الطلابُ إلا طالبٌ/طالبًا).\nوإن كان ناقصًا منفيًّا أُعرب المستثنى حسب موقعه وسُمّي استثناءً مفرَّغًا (ما حضر إلا طالبٌ).</p>\n<p><b>مع «خلا، عدا، حاشا»:</b> إن سُبقت بـ«ما» المصدرية فهي <b>أفعال</b> وما بعدها <b>مفعول به منصوب</b> وجوبًا.\nوإن لم تُسبق جاز وجهان: أن تكون أفعالًا فينتصب ما بعدها، أو حروف جرّ فيُجرّ.\nولهذا كان الجواب في «دخل التلاميذ خلا ......» هو <b>تلميذًا</b> على اعتبارها فعلًا، وهو الوجه المختار في الاختبارات.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الصور الثلاث:</b> تامّ مثبت ← وجوب النصب؛ تامّ منفي ← جواز النصب والإتباع على البدلية والإتباع أرجح؛ ناقص (مفرّغ) منفي ← يُعرب حسب موقعه و«إلا» أداة حصر لا عمل لها.</li><li><b>«غير» و«سوى»</b> يُعربان إعراب المستثنى بـ«إلا» في الأحوال الثلاث، وما بعدهما مضاف إليه دائمًا. و«سوى» تُقدَّر فيها الحركات لأنها مقصورة.</li><li><b>«خلا» و«عدا» و«حاشا»:</b> إن سُبقن بـ«ما» المصدرية فهنّ أفعال وما بعدهنّ مفعول به وجوبًا. وإن لم يُسبقن جاز الوجهان: أفعالًا فما بعدها مفعول به، أو حروف جرّ فما بعدها مجرور. و«حاشا» الأكثر فيها الحرفية.</li><li><b>الاستثناء المنقطع</b> ما كان المستثنى من غير جنس المستثنى منه: ﴿ما لهم به من علمٍ إلا اتّباعَ الظنّ﴾ — وحكمه وجوب النصب عند الحجازيين، والإتباع جائز عند تميم. وجه الاستشهاد: نصب المستثنى المنقطع.</li><li><b>تقدّم المستثنى على المستثنى منه</b> يوجب النصب مطلقًا: «ما نجح إلا محمدًا الطلابُ».</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الكتاب لسيبويه، والإنصاف، ومغني اللبيب، وشرح ابن عقيل.</p></div>"},{"t":"التمييز","b":"\n<p>التمييز اسم نكرة منصوب يرفع إبهام ما قبله. وهو نوعان:</p>\n<ul>\n<li><b>تمييز ذات (ملفوظ):</b> يبيّن المقصود من عدد أو وزن أو كيل أو مساحة — «اشتريتُ رطلًا زيتًا».</li>\n<li><b>تمييز نسبة (ملحوظ):</b> يبيّن المقصود من جملة، وهو إما <b>محوَّل عن فاعل</b> أو <b>عن مفعول</b>\nأو <b>عن مبتدأ</b> أو غير محوَّل.</li>\n</ul>\n<p><b>الشاهد الذهبي:</b> «واشتعل الرأسُ شَيبًا» — «شيبًا» تمييز منصوب <b>محوَّل عن فاعل</b>،\nوأصل التركيب «اشتعل شيبُ الرأسِ». وفائدة التحويل الدلالة على الشمول والعموم: أن الشيب عمّ الرأس كله.\nوهذه الآية تُسأل من وجهين: من جهة النحو فهي تمييز محوَّل عن فاعل، ومن جهة البلاغة فهي\n<b>استعارة تصريحية/مكنية</b> بحسب التقدير — شبّه انتشار الشيب باشتعال النار.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>التمييز نكرة منصوبة جامدة</b> بمعنى «مِن»، وهذا يفرّقه عن الحال فإن الحال مشتقّة بمعنى «في» غالبًا. ومن ضوابط التفرقة: التمييز يصحّ جعله فاعلًا في المعنى: «طاب زيدٌ نفسًا» ← طابت نفسُ زيد.</li><li><b>تمييز الملفوظ (الذات)</b> يأتي بعد العدد والكيل والوزن والمساحة، ويجوز فيه النصب والجرّ بالإضافة أو بـ«من»: «عندي رطلٌ زيتًا/زيتٍ/من زيتٍ».</li><li><b>تمييز الملحوظ (النسبة)</b> منصوب وجوبًا ولا يجوز جرّه، وهو المحوَّل عن فاعل أو مفعول أو مبتدأ: ﴿واشتعل الرأسُ شيبًا﴾ محوّل عن فاعل. وجه الاستشهاد: نصب التمييز المحوّل عن الفاعل.</li><li><b>تمييز «كم» و«كأيّن» و«كذا»</b> له أحكام خاصة تقدّمت في باب العدد.</li><li><b>تمييز اسم التفضيل</b> منصوب: «أنا أكثرُ منك مالًا»؛ فإن أُضيف اسم التفضيل لم يحتج إلى تمييز.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: شرح التسهيل، وأوضح المسالك، والنحو الوافي.</p></div>"},{"t":"اسم التفضيل وإعراب ما بعده","b":"\n<p>اسم التفضيل على وزن «أفعَل» ومؤنثه «فُعلى»، ويُصاغ من الثلاثي التام المتصرف المثبت القابل للتفاوت\nالذي ليس الوصف منه على «أفعَل فعلاء».</p>\n<p><b>إعراب ما بعده:</b></p>\n<ul>\n<li>إن كان <b>معرفة</b> فهو <b>مضاف إليه مجرور</b> — «أبي أكرمُ الناسِ».</li>\n<li>إن كان <b>نكرة منصوبة</b> بتنوين الفتح فهو <b>تمييز</b> — «العاملُ المجتهدُ أعلى قدرًا من غيره».</li>\n</ul>\n<p>وإذا جُرّد من «أل» والإضافة لزم الإفراد والتذكير ووجب الإتيان بـ«مِن» الجارّة للمفضَّل عليه.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>شروط صوغه ثمانية:</b> أن يكون من فعل ثلاثي، تامّ، متصرّف، مثبت، مبني للمعلوم، قابل للتفاوت، ليس الوصف منه على «أفعل فعلاء»، وأن يكون معلوم الوقوع. فإن اختلّ شرط تُوصّل إليه بمصدره منصوبًا بعد «أشدّ» أو «أكثر»: «هو أشدُّ حُمرةً».</li><li><b>أحواله الأربعة:</b> مجرّد من «أل» والإضافة ← يلزم الإفراد والتذكير ويُؤتى بعده بـ«من»؛ مقترن بـ«أل» ← يطابق؛ مضاف إلى نكرة ← يلزم الإفراد؛ مضاف إلى معرفة ← يجوز المطابقة وعدمها.</li><li><b>«خير» و«شرّ»</b> اسما تفضيل حُذفت همزتهما لكثرة الاستعمال، وأصلهما «أخير» و«أشرّ». ولذلك لا يُقال «أخير» إلا في الضرورة.</li><li><b>قد يأتي اسم التفضيل مجرّدًا من معنى التفضيل</b> فيكون بمعنى اسم الفاعل أو الصفة المشبهة: ﴿وهو أهونُ عليه﴾ أي: هيّن.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: شرح الكافية، وشرح الأشموني، والنحو الوافي.</p></div>"},{"t":"لغة «أكلوني البراغيث» — شاهد يتكرر","b":"\n<p>الأصل في العربية أن الفعل يُفرَد مع الفاعل الظاهر مثنى كان أو جمعًا: «قام الرجلان»، «قام الرجال».\nلكنّ لبعض العرب (طيّئ وأزد شنوءة) لغةً يلحقون فيها الفعلَ علامةَ تثنية أو جمع تدل على الفاعل،\nثم يذكرون الفاعل الظاهر بعده، وتُسمّى <b>لغة «أكلوني البراغيث»</b> أو <b>لغة «يتعاقبون فيكم ملائكة»</b>.</p>\n<p><b>الشواهد المسؤول عنها:</b></p>\n<ul>\n<li>«يتعاقبون فيكم ملائكةٌ» — الشاهد اتصال واو الجماعة بالفعل مع ذكر الفاعل الظاهر بعده.\nوتُعرب «ملائكة» على ثلاثة أوجه بحسب الخيارات: <b>فاعل</b> (على هذه اللغة)،\nأو <b>بدل</b> من الواو، أو <b>مبتدأ مؤخر</b> والجملة قبله خبر.</li>\n<li>«يلومونني في اشتراءِ النخيـ ـلِ أهلي فكلُّهمُ يَعذِلُ» — الشاهد «يلومونني … أهلي»، وتُعرب «أهلي»\nفاعلًا أو بدلًا أو مبتدأ مؤخرًا على الأوجه نفسها.</li>\n<li>«رأينَ الغوانيَ الشيبَ لاح بعارضي» — «الغواني» على الأوجه الثلاثة أيضًا.</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>حقيقة اللغة:</b> هي لحاق علامة التثنية والجمع بالفعل مع ظهور الفاعل بعده، فتكون العلامة حرف دلالة لا ضميرًا. وهي لغة طيّئ وأزد شنوءة، وتسمّى أيضًا «لغة يتعاقبون فيكم ملائكة».</li><li><b>مشهور الفصيح</b> تجريد الفعل من العلامة مع الفاعل الظاهر: «قام الرجال» لا «قاموا الرجال». ولهذا يُعدّ «يعملون هؤلاء الرجال» ضعيفًا في الاختبار.</li><li><b>الشاهد الحديثي:</b> «يتعاقبون فيكم ملائكةٌ بالليل وملائكةٌ بالنهار» — وجه الاستشهاد: لحاق واو الجماعة بالفعل مع ذكر الفاعل الظاهر «ملائكة» مرفوعًا.</li><li><b>توجيه آخر:</b> خرّجها بعضهم على أن الضمير فاعل وما بعده بدل أو خبر مبتدأ محذوف، فرارًا من إثبات اللغة. والأول أظهر.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الكتاب لسيبويه، والخصائص لابن جني، وشرح ابن عقيل، والهمع.</p></div>"},{"t":"تقديم الخبر على المبتدأ — واجب وجائز","b":"\n<p><b>يجب تقديم الخبر</b> في أربعة مواضع:</p>\n<ol>\n<li>إذا كان الخبر شبه جملة والمبتدأ نكرة غير مختصّة — «فيكم بركةٌ»، «في الدار رجلٌ».</li>\n<li>إذا كان في المبتدأ ضمير يعود على بعض الخبر — «في الدار صاحبُها».</li>\n<li>إذا كان الخبر من أسماء الصدارة كأسماء الاستفهام — «أين الكتابُ؟»، «كيف حالُك؟».</li>\n<li>إذا اقترن المبتدأ بـ«إلّا» أو «إنّما» — «ما في الدار إلا زيدٌ».</li>\n</ol>\n<p>ولهذا كان حكم تقديم الخبر في «فيكم بركةٌ» <b>واجبًا</b>، لأن المبتدأ نكرة والخبر شبه جملة،\nولو أخّرته لابتدأتَ بنكرة بلا مسوّغ.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>يجب تقديم الخبر</b> في أربعة مواضع: إذا كان المبتدأ نكرة محضة والخبر شبه جملة («في الدار رجلٌ»)، وإذا اتّصل بالمبتدأ ضمير يعود على الخبر («في الدارِ صاحبُها»)، وإذا كان الخبر له الصدارة كأسماء الاستفهام («أين الكتابُ؟»)، وإذا حُصر المبتدأ بـ«إلا» أو «إنما».</li><li><b>يجب تأخير الخبر</b> إذا خيف اللبس («صديقي زميلي»)، أو كان المبتدأ له الصدارة، أو اقترن الخبر بـ«إلا»، أو كان المبتدأ مقصورًا على الخبر.</li><li><b>مسوّغات الابتداء بالنكرة</b> كثيرة أشهرها: أن تُوصف، أو تُضاف، أو تتقدّم عليها شبه جملة، أو يسبقها نفي أو استفهام، أو تكون عامّة، أو للتعجّب، أو للدعاء. ﴿ولعبدٌ مؤمنٌ خيرٌ من مشرك﴾ — سوّغ الابتداء الوصف.</li><li><b>الخبر شبه الجملة</b> متعلّق بمحذوف تقديره «كائن» أو «استقرّ»؛ وهذا التقدير هو الجواب الصحيح لسؤال «ما نوع الخبر؟» حين يكون جارًّا ومجرورًا.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: المفصل وشرحه، وأوضح المسالك، وشرح ابن عقيل، والنحو الوافي.</p></div>"},{"t":"تأنيث الفعل مع الفاعل","b":"\n<p><b>يجب التأنيث</b> في موضعين: إذا كان الفاعل مؤنثًا حقيقيًّا متصلًا بالفعل غير مفصول (قامت هندُ)،\nوإذا كان ضميرًا مستترًا يعود على مؤنث (الشمسُ طلعتْ).</p>\n<p><b>ويجوز الوجهان</b> فيما عدا ذلك: إذا كان الفاعل مؤنثًا <b>مجازيَّ التأنيث</b> (طلع الشمسُ / طلعت الشمسُ)،\nأو حقيقيًّا <b>مفصولًا</b> عن فعله (حضر اليومَ فاطمةُ)، أو جمعَ تكسير، أو جمعَ مؤنث سالمًا.</p>\n<p><b>تطبيق:</b> «قطفتُ الوردةَ» — الفعل هنا لا شأن للتأنيث به لأن الفاعل ضمير المتكلم.\nأما «قطف/قطفت الوردةُ» فالتأنيث <b>جائز</b> لأن «الوردة» مؤنث مجازي.\nوفي «فاز/فازت بالجائزة سيدةٌ من مصر» يجوز الوجهان لوقوع الفصل بين الفعل والفاعل بالجار والمجرور.</p>\n<p><b>وجملة «ساعد أمَّها فاطمةُ»</b> صحيحة التركيب إعرابًا لكنها معيبة دلاليًّا بعود الضمير على متأخر لفظًا\nورتبةً، ولهذا تُعدّ خطأً في أسئلة الاختيار، والصواب «ساعدت فاطمةُ أمَّها» أو «فاطمةُ ساعدتها أمُّها».</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>يجب التأنيث</b> في موضعين: إذا كان الفاعل ضميرًا مستترًا أو بارزًا يعود على مؤنث «هندٌ قامتْ»، وإذا كان اسمًا ظاهرًا حقيقيَّ التأنيث غير مفصول عن فعله «قامت هندُ».</li><li><b>يجوز الوجهان</b> إذا كان الفاعل مجازيَّ التأنيث «طلعت الشمسُ/طلع الشمسُ»، أو حقيقيًّا مفصولًا «حضر اليومَ فاطمةُ»، أو جمع تكسير، أو جمع مذكر سالم عند بعضهم، أو كان الفاعل «نِعم وبئس».</li><li><b>الفاصل بـ«إلّا» يُرجّح الترك:</b> «ما قام إلا هندُ» — الأفصح ترك التاء؛ لأن التقدير «ما قام أحدٌ إلا هند».</li><li><b>جمع التكسير يُعامل معاملة المؤنث</b> جوازًا: ﴿وقال نسوةٌ في المدينة﴾ بالتذكير، و﴿قالتِ الأعرابُ﴾ بالتأنيث. وجه الاستشهاد: جواز الوجهين في جمع التكسير.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: شرح التسهيل، وشرح الأشموني، والدر المصون.</p></div>"},{"t":"المثنى وجمع المذكر السالم — نونهما وحذفها","b":"\n<p><b>نون المثنى مكسورة</b> أبدًا في أحواله الإعرابية: الوالدانِ، الوالدَينِ.\nو<b>نون جمع المذكر السالم مفتوحة</b> أبدًا: المعلمونَ، المعلمينَ. وقد نظم ابن مالك ذلك في الألفية.</p>\n<p><b>تُحذف النون وجوبًا عند الإضافة</b> في الاثنين: سافر والدا عليٍّ، جاء عالِمو المدينة، كرّمتُ عالِمي المدينة.\nولا تُزاد ألف بعد الواو عند الحذف.</p>\n<p><b>مسألة دقيقة:</b> إذا أُضيف المثنى أو الجمع إلى كلمة أولها ساكن (أل التعريف)\nحُذفت الألف أو الواو <b>في النطق لا في الكتابة</b> التقاءً للساكنين، ويقول النحاة إنه معرب\nبالحرف المقدَّر: جاء عالِمو المدينة (تُنطق: عالِمُ لْمدينة).</p>\n<p><b>«اثنا عشر»:</b> «اثنا» تُعرب إعراب المثنى بالألف رفعًا والياء نصبًا وجرًّا،\nو«عشر» اسم مبني على الفتح لا محل له من الإعراب لوقوعه موقع نون المثنى المحذوفة.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>نون المثنى مكسورة</b> ونون الجمع مفتوحة؛ والعلّة أن نون المثنى كُسرت على أصل التقاء الساكنين، وفُتحت نون الجمع فرقًا بينهما وطلبًا للخفّة بعد الواو.</li><li><b>تُحذف النون للإضافة</b> لا لغيرها: «معلّمو المدرسة»، «طالبا العلم». ومن أشهر أخطاء الكتابة إثباتها مع الإضافة.</li><li><b>الملحق بالمثنى:</b> اثنان واثنتان، وكلا وكلتا بشرط الإضافة إلى ضمير. فإن أُضيفتا إلى ظاهر أُعربتا بحركات مقدّرة: «جاء كلا الرجلين» بألف مقدّرة.</li><li><b>الملحق بجمع المذكر:</b> أولو، وعالَمون، وأهلون، وسنون وبابه، وعشرون إلى تسعين، وبنون، وأرَضون. وهي ملحقة لأنها لا تستوفي شروط الجمع السالم.</li><li><b>«سنين» وبابها</b> يجوز فيها لزوم الياء مع التنوين وإعرابها إعراب المفرد: «أقمت سنينًا» — وهي لغة فصيحة.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الألفية وشروحها، وأوضح المسالك، وجامع الدروس العربية.</p></div>"},{"t":"الجملة الاسمية والفعلية — التحويل بينهما","b":"\n<p>الجملة <b>الاسمية</b> ما بُدئت باسم، و<b>الفعلية</b> ما بُدئت بفعل. وعند التحويل من اسمية إلى فعلية\nيجب أن <b>يُفرَد الفعل</b> مع الفاعل الظاهر على اللغة الفصيحة المشهورة.</p>\n<p><b>تطبيق:</b> «هؤلاء الرجالُ يعملون بصمت» جملة اسمية، فإذا حوّلتها إلى فعلية قلت:\n<b>«يعملُ هؤلاء الرجالُ بصمتٍ»</b> — أُفرِد الفعل لأن الفاعل اسم ظاهر.\nو«يعملون هؤلاء الرجال» ضعيف لأنه على لغة «أكلوني البراغيث»، و«يعملوا» خطأ لأنه لا ناصب ولا جازم.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>العبرة بالصدارة:</b> الجملة فعلية إن بدأت بفعل، واسمية إن بدأت باسم. فإن تقدّم الظرف أو الجار والمجرور فالعبرة بما بعدهما؛ «في الدارِ رجلٌ» اسمية.</li><li><b>عند التحويل إلى الفعلية</b> يُقدَّم الفعل ويُفرَد مع الفاعل الظاهر: «الطلابُ يجتهدون» ← «يجتهدُ الطلابُ» لا «يجتهدون الطلاب».</li><li><b>عند التحويل إلى الاسمية</b> يُقدَّم الاسم ويُجعل الفعل خبرًا جملة فعلية فيه ضمير يعود على المبتدأ: «نجح الطلابُ» ← «الطلابُ نجحوا».</li><li><b>فائدة بلاغية:</b> الجملة الاسمية تفيد الثبوت والدوام، والفعلية تفيد التجدّد والحدوث. ولهذا قيل في ﴿والله يعلمُ وأنتم لا تعلمون﴾ ما قيل من فروق المعنى.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: دلائل الإعجاز للجرجاني، وأوضح المسالك، والنحو الوافي.</p></div>"},{"t":"حروف الجر ومعانيها","b":"\n<table><tr><th>الحرف</th><th>من معانيه</th><th>مثال</th></tr>\n<tr><td>مِن</td><td>ابتداء الغاية، التبعيض، بيان الجنس</td><td>سافرتُ من القاهرة</td></tr>\n<tr><td>إلى</td><td>انتهاء الغاية</td><td>سرتُ إلى البيت</td></tr>\n<tr><td>عن</td><td>المجاوزة والبُعد</td><td>رميتُ عن القوس</td></tr>\n<tr><td>على</td><td>الاستعلاء</td><td>جلس على الكرسي</td></tr>\n<tr><td>في</td><td>الظرفية والمصاحبة</td><td>خرج الرئيسُ في موكبه</td></tr>\n<tr><td>الباء</td><td>الإلصاق، الاستعانة، المصاحبة، السببية</td><td>كتبتُ بالقلم</td></tr>\n<tr><td>اللام</td><td>الملك والاختصاص والتعليل</td><td>الكتابُ لمحمدٍ</td></tr>\n</table>\n<p><b>حروف الجر اللازمة للأفعال (التعدية):</b> هذا باب يكثر فيه السؤال، ومداره السماع لا القياس:</p>\n<ul>\n<li>اتّصل <b>بـ</b> — «اتصلتُ بصديقي هاتفيًّا» (لا «على» ولا «لـ»).</li>\n<li>استعان <b>بـ</b> — «استعان الرجلُ بصديقه».</li>\n<li>رغِب <b>في</b> (أراد) ورغِب <b>عن</b> (كرِه) — والفرق بينهما بالحرف لا باللفظ.</li>\n<li>خرج <b>في</b> موكبه — للمصاحبة.</li>\n<li>خذ الكتابَ <b>أو</b> المجلةَ — «أو» هنا للتخيير، ولو قلت «أم» لكانت للاستفهام المعادل.</li>\n</ul>\n<p><b>قاعدة عامة:</b> يأتي بعد حرف الجر <b>اسم</b> مجرور دائمًا؛ ولا يدخل حرف الجر على فعل.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الحروف الزائدة</b> (مِن، الباء، الكاف، اللام، لعلّ، لولا في بعض اللغات) تجرّ لفظًا ولا تؤثّر في المحلّ؛ فما بعدها يُعرب بحسب موقعه مجرورًا لفظًا. ﴿ما جاءنا من بشيرٍ﴾ — «بشير» فاعل مرفوع محلًّا.</li><li><b>شرط زيادة «مِن»</b> عند جمهور البصريين: تقدّم نفي أو نهي أو استفهام بـ«هل»، وأن يكون مجرورها نكرة.</li><li><b>«رُبّ» حرف جرّ شبيه بالزائد</b> لا يتعلّق بشيء، ويلزم صدر الكلام، ومجروره نكرة. وقد تُحذف ويبقى عملها بعد الواو: «وليلٍ كموجِ البحرِ أرخى سُدولَه» — وجه الاستشهاد: الجرّ بـ«رُبّ» المحذوفة بعد واو رُبّ.</li><li><b>تضمين الحروف:</b> قد ينوب حرف عن حرف لتضمين الفعل معنى فعل آخر؛ ﴿عينًا يشربُ بها عبادُ الله﴾ — ضُمّن «يشرب» معنى «يروى» فعُدّي بالباء.</li><li><b>باء السببية وباء الاستعانة وباء القسم</b>، ولام التعليل ولام الملك ولام الاختصاص ولام التقوية — ومعرفة المعنى هي المطلوب في أسئلة «ما معنى الباء هنا؟».</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: مغني اللبيب لابن هشام، ورصف المباني، والجنى الداني، والنحو الوافي.</p></div>"},{"t":"الظرف والمضاف إليه بعده","b":"\n<p>الظروف المضافة إلى ما بعدها مثل: قبل، بعد، عند، لدى، ليلة، يوم، وقت، حين، ساعة —\nيُعرب الاسم الواقع بعدها <b>مضافًا إليه مجرورًا</b>.</p>\n<p><b>تطبيق على مسألة الرسم:</b> «عند شراءِ الكتاب من المكتبة» — تُكتب «شراء» بالهمزة على السطر\nوتُجرّ بالكسرة لأنها مضاف إليه بعد الظرف «عند»، فهي «شراءِ» لا «شراؤك» ولا «شراءَك».\nوالفيصل أن تنظر إلى الموقع الإعرابي ثم تختار صورة الهمزة بحسب حركة ما قبلها.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الظرف المتصرّف وغير المتصرّف:</b> المتصرّف ما يُستعمل ظرفًا وغير ظرف («يوم» و«مكان»)، وغير المتصرّف ما يلزم الظرفية («قطّ، عوضُ، إذا، أيّان») أو الظرفية والجرّ بـ«مِن» («عند، لدن، قبل، بعد»).</li><li><b>بناء «قبل» و«بعد»</b> على الضمّ إذا حُذف المضاف إليه ونُوي معناه: ﴿لله الأمرُ من قبلُ ومن بعدُ﴾. فإن نُوي اللفظ أو ذُكر المضاف إليه أُعربتا. وهذا من ألطف مسائل الباب وأكثرها في الامتحانات.</li><li><b>الظرف المبهم والمختصّ:</b> المبهم ما لا حدّ له («أمام، خلف، حين»)، والمختصّ ما له حدّ («يوم الجمعة، ميل»). وينوب عن الفاعل المختصّ دون المبهم.</li><li><b>الإضافة نوعان:</b> معنوية (محضة) تفيد التعريف أو التخصيص، ولفظية (غير محضة) وهي إضافة الوصف العامل إلى معموله «ضاربُ زيدٍ» ولا تفيد تعريفًا، ولهذا يجوز نعت النكرة بها.</li><li><b>المضاف يُحذف منه التنوين ونونا التثنية والجمع</b> وجوبًا؛ فلا يُقال «كتابٌ العلمِ» ولا «معلّمونَ المدرسةِ».</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: شرح الكافية للرضي، ومغني اللبيب، وشرح التسهيل، وجامع الدروس العربية.</p></div>"}]},{"c":"sarf","n":"الصرف والاشتقاق","q":[{"q":"ما جمع «عندليب»؟","a":"عنادل","e":"لأن ما زاد على أربعة أحرف يُردّ عند الجمع إلى الرباعي بحذف الزائد، فحُذفت الياء والباء وجُمع على «فعالل». وكذلك «سفرجل» تُجمع على «سفارج» و«فرزدق» على «فرازِد».","d":["نُيَيْب","عطشى","جُدْران"]},{"q":"ما مؤنث «عطشان»؟","a":"عطشى","e":"لأن الوصف على وزن «فَعْلان» يُؤنَّث على «فَعْلى» لا على «فَعلانة»، نحو: جوعان/جَوْعى، سكران/سَكرى. وهو لذلك ممنوع من الصرف لزيادة الألف والنون.","d":["أكرم","أُوَيْدِم","عِبء"]},{"q":"الجمع الصحيح لكلمة «جدار»","a":"جُدْران","e":"وهو جمع كثرة على وزن «فُعلان»، وهو وزن مطّرد في جمع ما كان على «فِعال» أو «فَعال» من الأسماء الجامدة. و«جُدُر» مسموع أيضًا لكن «جدران» هو المشهور.","d":["أكرم","قُوَيْمة","بُوَيْب"]},{"q":"اختر الوزن الصرفي الصحيح لكلمة «انعكاس»","a":"انفِعال","e":"لأنها مصدر الفعل الخماسي «انعكسَ» الذي وزنه «انفعلَ»، والأصول فيها «ع ك س» والزائد الهمزة والنون والألف. و«أفعال» وزن جمع لا مصدر، و«انفعلل» وزن مصدر الخماسي المضعّف.","d":["نُيَيْب","شيء","دُنَيْنير"]},{"q":"اختر الفعل المزيد: بعثر / درس / أكرم / يقرأ","a":"أكرم","e":"لأنه على وزن «أفعَل»، زِيدت الهمزة على الأصول الثلاثة «ك ر م» فأفادت التعدية. و«بعثر» رباعي مجرد، و«درس» ثلاثي مجرد، وياء «يقرأ» حرف مضارعة لا زيادة بنائية.","d":["بعثر","درس","يقرأ"]},{"q":"ينقسم الفعل إلى مجرد ومزيد؛ فما المجرد؟","a":"ما كانت حروفه كلها أصلية","e":"وهو نوعان: ثلاثي كـ«كتب ودرس»، ورباعي كـ«دحرج وبعثر». والمزيد ما زِيد على أصوله حرف فأكثر لإفادة معنى جديد كالتعدية أو المطاوعة أو الطلب.","d":["قاضُون (سالم) وقُضاة (تكسير)","مَعرِض — بكسر الراء","التصغير: أُبَيْلة — والنسب: إبِلِيّ"]},{"q":"كلمة «مصائب» جمع شاذ أم قياسي؟","a":"جمع شاذ","e":"لأن القياس في «فَعيلة» معتلة العين أن تُجمع على «مَفاعِل» من غير همز فيقال «مصاوب»، لكن العرب همزت الواو فقالت «مصائب»، فجاء الجمع على خلاف القياس المطّرد.","d":["سُفَيْرِج (أو سُفَيْرِل)","أغوار وغِيران","مَقالٍ / مَقاليت"]},{"q":"أوزان جموع القلة","a":"أَفعال، أَفعُل، أَفعِلة، فِعلة","e":"وهي تدل على العدد من ثلاثة إلى عشرة، نحو: أقلام، أنفُس، أسئلة، فِتية. وما عداها من أوزان جمع التكسير فهو من جموع الكثرة الدالة على ما فوق العشرة.","d":["يُضمّ أوله ويُكسر ما قبل آخره","فَعّال، مِفعال، فَعول، فَعيل، فَعِل","كسر ما قبل الآخر في الفاعل، وفتحه في المفعول"]},{"q":"جمع «كبرى»","a":"كُبَر وكُبْرَيات","e":"فـ«كبرى» مؤنث «أكبر»، وتُجمع جمع تكسير على «كُبَر»، وتُجمع جمع مؤنث سالمًا على «كُبرَيات» بردّ الألف المقصورة ياءً قبل علامة الجمع.","d":["جمع شاذ","مَقالٍ / مَقاليت","أغوار وغِيران"]},{"q":"جمع «القاضي»","a":"قاضُون (سالم) وقُضاة (تكسير)","e":"«القاضي» اسم منقوص، وعند جمعه جمع مذكر سالم تُحذف ياؤه ويُضمّ ما قبلها رفعًا: قاضون، ويُكسر نصبًا وجرًّا: قاضين. وله جمع تكسير مسموع هو «قُضاة» على وزن فُعَلة.","d":["يُضمّ أوله ويُكسر ما قبل آخره","كسر ما قبل الآخر في الفاعل، وفتحه في المفعول","التصغير: أُبَيْلة — والنسب: إبِلِيّ"]},{"q":"جمع «غار»","a":"أغوار وغِيران","e":"الأول جمع قلة على «أفعال»، والثاني جمع كثرة على «فِعلان». وأصل ألف «غار» واو بدليل «أغوار»، فرُدّت إلى أصلها عند الجمع.","d":["سُفَيْرِج (أو سُفَيْرِل)","جمع شاذ","مَقالٍ / مَقاليت"]},{"q":"مفرد «أعباء»","a":"عِبء","e":"لأن «أعباء» جمع قلة على وزن «أفعال»، ومفرده «عِبء» بكسر العين وسكون الباء ومعناه الحِمل والثِّقل. والهمزة فيه متطرفة بعد ساكن فتُرسم على السطر.","d":["جُدْران","بُوَيْب","إقلاب"]},{"q":"مفرد «أشياء»","a":"شيء","e":"و«أشياء» اسم جمع ممنوع من الصرف لأن فيه ألف تأنيث ممدودة في أصل وضعه عند الخليل. وهذا سبب منعه من الصرف مع كونه على صورة الجمع.","d":["عطشى","جُدْران","دُنَيْنير"]},{"q":"جمع «مقلاة»","a":"مَقالٍ / مَقاليت","e":"جمع «مِقلى» و«مِقلاة» على «مقالٍ» و«مقاليت»، وهو من صيغ منتهى الجموع الممنوعة من الصرف، فيُجرّ بالفتحة إذا تجرد من أل والإضافة.","d":["جمع شاذ","كُبَر وكُبْرَيات","أغوار وغِيران"]},{"q":"تصغير «ناب»","a":"نُيَيْب","e":"لأن أصل الألف في «ناب» ياء بدليل جمعه «أنياب»، وقاعدة التصغير ردُّ حرف العلة إلى أصله. فيصير على وزن «فُعَيْل» بضم الأول وفتح الثاني وزيادة ياء ساكنة.","d":["قُوَيْمة","جُدْران","أكرم"]},{"q":"تصغير «باب»","a":"بُوَيْب","e":"لأن أصل ألفه واو بدليل جمعه «أبواب» وتصريفه «بوّاب». فعند التصغير تُردّ الواو ويُصاغ على «فُعَيْل». ولاحظ الفرق بينه وبين «ناب» الذي أصله ياء.","d":["أُوَيْدِم","عنادل","شيء"]},{"q":"تصغير «قِيمة»","a":"قُوَيْمة","e":"لأن أصل الياء واو من مادة «ق و م» بدليل «التقويم» و«قوّمَ». وعند التصغير يُردّ الحرف إلى أصله، فتعود الواو وتبقى تاء التأنيث في آخره.","d":["عنادل","جُدْران","دُنَيْنير"]},{"q":"تصغير «دينار»","a":"دُنَيْنير","e":"لأن أصل الياء نون بدليل الجمع «دنانير»، فرُدّت النون عند التصغير. وهو على وزن «فُعَيعيل» لأنه رباعي ما قبل آخره حرف مدّ.","d":["جُدْران","أُوَيْدِم","عِبء"]},{"q":"تصغير «سفرجل»","a":"سُفَيْرِج (أو سُفَيْرِل)","e":"لأن الاسم خماسي، وقاعدة تصغير الخماسي حذفُ حرفه الخامس ليصير رباعيًّا، ثم يُصغَّر على «فُعَيعِل». ومن حذف الجيم قال «سفيرل».","d":["جمع شاذ","أغوار وغِيران","مَقالٍ / مَقاليت"]},{"q":"تصغير «آدم»","a":"أُوَيْدِم","e":"لأن المدّة في «آدم» أصلها همزتان: الأولى همزة القطع والثانية ساكنة. فعند التصغير تُقلب الثانية واوًا منعًا للالتقاء، ويُصاغ على «فُعَيْعِل».","d":["جُدْران","عطشى","انفِعال"]},{"q":"تصغير «إبل» ونسبها","a":"التصغير: أُبَيْلة — والنسب: إبِلِيّ","e":"أما التصغير فلحقته التاء لأنه اسم ثلاثي مؤنث تأنيثًا معنويًّا، والقاعدة أن الثلاثي المؤنث المجرد من التاء تُردّ إليه التاء عند التصغير. وأما النسب فعلى الأصل بزيادة ياء مشددة.","d":["فَعّال، مِفعال، فَعول، فَعيل، فَعِل","قاضُون (سالم) وقُضاة (تكسير)","أَفعال، أَفعُل، أَفعِلة، فِعلة"]},{"q":"ضبط الراء في «زرتُ معرض الكتاب»","a":"مَعرِض — بكسر الراء","e":"لأنه اسم مكان من الفعل «عرَض يَعرِض»، وقاعدة اسم المكان من الثلاثي مكسور العين في المضارع أن يأتي على وزن «مَفعِل». ونظائره: مجلِس، منزِل، مضرِب.","d":["فَعّال، مِفعال، فَعول، فَعيل، فَعِل","ما كانت حروفه كلها أصلية","أَفعال، أَفعُل، أَفعِلة، فِعلة"]},{"q":"الحرف المشدَّد في اللغة العربية هو…","a":"حرفان متماثلان: الأول ساكن والثاني متحرك، أُدغم الأول في الثاني","e":"فالتشديد علامة على الإدغام لا حرف مستقل. ولهذا يُحسب المشدَّد بحرفين في الوزن العروضي: الأول ساكن يُسكِّن المقطع والثاني متحرك يفتحه.","d":["فَعّال، مِفعال، فَعول، فَعيل، فَعِل","كسر ما قبل الآخر في الفاعل، وفتحه في المفعول","أَفعال، أَفعُل، أَفعِلة، فِعلة"]},{"q":"«ينبغي» فيها: إدغام / إقلاب / إظهار / إعلال؟","a":"إقلاب","e":"لأن النون الساكنة جاء بعدها حرف الباء، وحكمها حينئذ القلب ميمًا مخفاة مع الغنة. وهذا من أحكام النون الساكنة والتنوين في التجويد، وتسري على نطق الفصحى عمومًا.","d":["إدغام","إظهار","إعلال"]},{"q":"كيف نبني الفعل الماضي للمجهول؟","a":"يُضمّ أوله ويُكسر ما قبل آخره","e":"نحو: كتب ← كُتِبَ، واستخرج ← اسْتُخرِجَ. وفي الأجوف يُكسر أوله وتُقلب ألفه ياء: قال ← قِيلَ، باع ← بِيعَ. وفي المضارع يُضمّ أوله ويُفتح ما قبل آخره: يُكتَبُ.","d":["التصغير: أُبَيْلة — والنسب: إبِلِيّ","كسر ما قبل الآخر في الفاعل، وفتحه في المفعول","مَعرِض — بكسر الراء"]},{"q":"صيغ المبالغة المشهورة","a":"فَعّال، مِفعال، فَعول، فَعيل، فَعِل","e":"وهي أوزان تدل على كثرة وقوع الفعل من صاحبه، نحو: غفّار، مِهذار، صَبور، عليم، حَذِر. وتعمل عمل اسم الفاعل إذا اعتمدت على نفي أو استفهام أو موصوف.","d":["ما كانت حروفه كلها أصلية","قاضُون (سالم) وقُضاة (تكسير)","مَعرِض — بكسر الراء"]},{"q":"ما الفرق بين اسم الفاعل واسم المفعول في غير الثلاثي؟","a":"كسر ما قبل الآخر في الفاعل، وفتحه في المفعول","e":"فكلاهما يُصاغ على وزن المضارع بإبدال حرف المضارعة ميمًا مضمومة؛ والفارق الحركة: مُستخرِج (فاعل) ومُستخرَج (مفعول)، ومُكرِم ومُكرَم.","d":["قاضُون (سالم) وقُضاة (تكسير)","يُضمّ أوله ويُكسر ما قبل آخره","مَعرِض — بكسر الراء"]}],"r":[{"t":"المجرد والمزيد والميزان الصرفي","b":"\n<p><b>الميزان الصرفي</
