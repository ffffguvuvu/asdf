<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ملفات المسابقة — تخصص لغة عربية: حلّ الأسئلة وشرح القواعد</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#17202e;--mut:#5d6b84;--pri:#1d5fa8;--pri2:#e8f0fb;
--ok:#0f7a4d;--ok2:#e4f5ec;--wr:#b3261e;--line:#dfe5f0;--acc:#8b5cf6}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Tahoma",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.95}
header{background:linear-gradient(135deg,#123a6b,#1d5fa8 55%,#2a7fd4);color:#fff;padding:26px 18px 20px}
.wrap{max-width:1120px;margin:0 auto;padding:0 14px}
h1{margin:0 0 6px;font-size:1.5rem;font-weight:800}
.sub{opacity:.93;font-size:.93rem;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:4px 11px;border-radius:999px;font-size:.82rem}
nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;
box-shadow:0 2px 10px rgba(16,30,60,.07)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 14px;max-width:1120px;margin:0 auto;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#fbfcfe;color:var(--mut);padding:7px 15px;
border-radius:9px;cursor:pointer;font-size:.9rem;font-family:inherit;white-space:nowrap;font-weight:600}
.tab:hover{background:var(--pri2);color:var(--pri)}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{padding:18px 0 60px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px 19px;margin:0 0 14px;
box-shadow:0 1px 3px rgba(16,30,60,.05)}
.card h3{margin:0 0 10px;font-size:1.08rem;color:var(--pri);font-weight:800;border-bottom:2px solid var(--pri2);padding-bottom:7px}
.card p{margin:.55em 0}
.card ul,.card ol{margin:.5em 0;padding-inline-start:1.5em}
.card li{margin:.3em 0}
table{width:100%;border-collapse:collapse;margin:.8em 0;font-size:.9rem}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:right;vertical-align:top}
th{background:var(--pri2);color:var(--pri);font-weight:700}
tr:nth-child(even) td{background:#fafbfe}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
input[type=search],select{font-family:inherit;font-size:.92rem;padding:8px 12px;border:1px solid var(--line);
border-radius:9px;background:#fff;color:var(--ink)}
input[type=search]{flex:1;min-width:190px}
.btn{font-family:inherit;font-size:.88rem;padding:8px 14px;border:1px solid var(--line);background:#fff;
border-radius:9px;cursor:pointer;color:var(--mut);font-weight:600}
.btn:hover{background:var(--pri2);color:var(--pri);border-color:var(--pri)}
.btn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.cnt{color:var(--mut);font-size:.86rem}
.q{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:11px;
padding:14px 17px;margin-bottom:11px}
.q .num{color:var(--acc);font-weight:800;font-size:.8rem;letter-spacing:.4px}
.qt{font-weight:700;margin:5px 0 9px;font-size:1rem}
.ans{background:var(--ok2);border:1px solid #bfe6d2;border-radius:8px;padding:8px 12px;margin-bottom:8px;
color:var(--ok);font-weight:700;font-size:.95rem}
.ans::before{content:"الإجابة: ";font-weight:800;opacity:.75}
.exp{color:#36425a;font-size:.93rem;background:#f8f9fc;border-radius:8px;padding:9px 12px;border:1px dashed var(--line)}
.exp::before{content:"الشرح — ";font-weight:800;color:var(--pri)}
.none{text-align:center;color:var(--mut);padding:34px;background:var(--card);border-radius:12px;border:1px dashed var(--line)}
.lead{background:#fffaf0;border:1px solid #f0e0bd;border-radius:11px;padding:13px 17px;margin-bottom:15px;font-size:.93rem}
.lead b{color:#92610b}
.fl{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border:1px solid var(--line);
border-radius:10px;padding:10px 13px;margin-bottom:8px;background:var(--card);flex-wrap:wrap}
.fl .nm{font-weight:700;font-size:.93rem;flex:1;min-width:220px}
.fl .kd{font-size:.8rem;color:var(--pri);background:var(--pri2);padding:2px 9px;border-radius:999px}
.fl .st{font-size:.8rem;color:var(--mut)}
.ok{color:var(--ok)!important;font-weight:700}
.bad{color:var(--wr)!important}
a{color:var(--pri)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.g div{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center}
.g b{display:block;font-size:1.45rem;color:var(--pri);font-weight:800}
.g span{font-size:.81rem;color:var(--mut)}
mark{background:#fff3a3;padding:0 2px;border-radius:3px}
@media print{nav,.toolbar,header .chips{display:none}.panel{display:block!important}
.card,.q{break-inside:avoid;box-shadow:none}body{background:#fff}}
</style>
</head>

<script id="DATA" type="application/json">{"s":[{"c":"nahw","n":"النحو","q":[{"q":"«هؤلاء الرجال يعملون بصمت» — حوّلها إلى جملة فعلية","a":"يعملُ هؤلاء الرجالُ بصمتٍ","e":"عند التحويل إلى الجملة الفعلية يُقدَّم الفعل ويجب إفراده مع الفاعل الظاهر على اللغة الفصيحة المشهورة، فلا يُلحق به علامة جمع. و«يعملون هؤلاء الرجال» ضعيف لأنه على لغة أكلوني البراغيث، و«يعملوا» خطأ لحذف النون بلا ناصب ولا جازم."},{"q":"اتصلتُ ...... صديقي هاتفيًّا — ما حرف الجر الصحيح؟","a":"الباء: اتصلتُ بصديقي","e":"الفعل «اتصل» يتعدى بالباء سماعًا؛ وهذا باب تعدية الأفعال بحروف بعينها لا يُقاس عليه بل يُحفظ. وقولهم «اتصلت على فلان» من الأخطاء الشائعة، و«اتصلت لفلان» أبعد."},{"q":"استعان الرجلُ ...... صديقه","a":"الباء: استعان بصديقه","e":"لأن «استعان» من الأفعال التي تتعدى بالباء الدالة على الاستعانة، كما تقول: كتبتُ بالقلم. والباء هنا حرف جر أصلي ومجرورها متعلق بالفعل."},{"q":"خذ الكتابَ ...... المجلةَ — أكمل بحرف يفيد التخيير","a":"أو","e":"«أو» بعد الطلب تفيد التخيير إذا جاز الجمع بين الأمرين، والإباحة إن لم يُمنع الجمع. أما «أم» فللاستفهام المعادل، و«الواو» لمطلق الجمع فلا تخيير فيها، و«ثم» للترتيب مع التراخي."},{"q":"خرج الرئيسُ ...... موكبه — أكمل بحرف جر يفيد المصاحبة","a":"في","e":"«في» تخرج عن الظرفية إلى المصاحبة والملابسة، أي: خرج مصحوبًا بموكبه ومحاطًا به. والمعنى على الظرفية المجازية: كأن الموكب ظرف أحاط به."},{"q":"كم ...... في المدرسة؟ — ضع التمييز المناسب","a":"طالبًا","e":"لأن «كم» هنا استفهامية، وتمييزها مفرد منصوب. ولو كانت خبرية بمعنى التكثير لكان تمييزها مفردًا أو جمعًا مجرورًا، كقولك: «كم مالٍ أنفقتُ!»."},{"q":"اختر التمييز المناسب لـ«كم» في: كم عندي ......!","a":"مالٍ (مجرور)","e":"لأن «كم» هنا خبرية تفيد الإخبار بالكثرة لا الاستفهام، وتمييزها يُجرّ بالإضافة. والفارق بين الخبرية والاستفهامية أن الخبرية لا يُستفهم بها ولا تحتاج جوابًا."},{"q":"نجحت ...... طالبة","a":"اثنتا عشرةَ","e":"لأن العددين 11 و12 يوافق جزآهما المعدود في التذكير والتأنيث، والمعدود «طالبة» مؤنث فيؤنَّث الجزآن. و«اثنتا» مرفوعة بالألف لأنها ملحقة بالمثنى، وهي هنا فاعل."},{"q":"«تزوّج وعمره 16 عامًا» — القراءة الصحيحة للعدد","a":"ستةَ عشرَ","e":"المعدود «عامًا» مذكر. وفي العدد المركب من 13 إلى 19 يخالف الجزءُ الأول المعدودَ ويوافقه الجزء الثاني؛ فلمّا كان المعدود مذكرًا لحقت التاءُ الجزءَ الأول (ستة) وتجرّد منها الثاني (عشر)."},{"q":"«أكرمت المدرسة 14 معلمًا» — القراءة الصحيحة","a":"أربعةَ عشرَ","e":"للقاعدة نفسها: المعدود «معلمًا» مذكر، فيخالفه الجزء الأول فيُؤتى به بالتاء «أربعة»، ويوافقه الجزء الثاني فيتجرد «عشر». والعدد المركب مبني على فتح الجزأين في محل نصب مفعول به."},{"q":"«ذاع صيته منذ السنة 18 من عمره» — القراءة الصحيحة","a":"الثامنةَ عشرةَ","e":"لأنه عدد ترتيبي واقع صفةً لـ«السنة» وهي مؤنثة، وفي العدد الترتيبي المركب يوافق الجزآن الموصوفَ في التأنيث والتذكير؛ فيُقال للمؤنث: الثامنة عشرة، وللمذكر: الثامن عشر."},{"q":"اختر الصحيح: قرأتُ خمسة قصص / خمس قصص / خمس قصة","a":"قرأتُ خمسَ قصصٍ","e":"مفرد «قصص» هو «قصة» وهو مؤنث، والعدد من 3 إلى 9 يخالف المعدود، فيتجرد من التاء مع المؤنث: خمسَ. وتمييزه جمع مجرور بالإضافة: قصصٍ."},{"q":"علامة إعراب المثنى هي…","a":"الألف رفعًا، والياء نصبًا وجرًّا","e":"فالمثنى يُعرب بالحروف نيابة عن الحركات. وليس الصواب «الألف في الأحوال كلها» لأن ذلك خاص بالمبني أو بلغة من يلزم المثنى الألف، وهي لغة قليلة لا يُقاس عليها في الاختبار."},{"q":"«إن الحسنات يُذهبن السيئات» — ما حركة «الحسنات»؟","a":"الكسرة","e":"لأن «الحسنات» اسم «إنّ» منصوب، وهو جمع مؤنث سالم يُنصب بالكسرة نيابة عن الفتحة. وهذه إحدى علامات الإعراب الفرعية التي يكثر السؤال عنها."},{"q":"«هذا أليمٌ» — ما إعراب «أليم»؟","a":"خبر مرفوع (أو بدل مرفوع بحسب السياق)","e":"إن كانت «أليم» مخبَرًا بها عن اسم الإشارة فهي خبر مرفوع بالضمة. وإن سبقها معرفةٌ هي المقصودة بالحكم وجاءت «أليم» تابعة لها مقصودةً بالنسبة أُعربت بدلًا مرفوعًا — والمعوّل على سياق الخيارات."},{"q":"«الدينُ النصيحةُ» — ما إعراب «النصيحة»؟","a":"خبر مرفوع بالضمة","e":"«الدين» مبتدأ و«النصيحة» خبره، والجملة اسمية تفيد الحصر بتعريف الجزأين، أي: الدينُ كلُّه منحصر في النصيحة. وتعريف المسند والمسند إليه من طرق القصر عند البلاغيين."},{"q":"«بِعتُ السلعةَ» — ما إعراب «السلعة»؟","a":"مفعول به منصوب","e":"لأن الفعل مبني للمعلوم وفاعله تاء المتكلم. ولو بُني للمجهول لقلت «بِيعت السلعةُ» فتكون «السلعة» نائب فاعل مرفوعًا — وهذا هو موضع الخلط في الخيارات."},{"q":"«كيف كنتَ؟» — ما إعراب «كيف»؟","a":"خبر كان مقدَّم، مبني على الفتح في محل نصب","e":"لأن «كان» ناسخ يرفع الاسم وينصب الخبر، واسمها هنا تاء المخاطب. و«كيف» اسم استفهام له الصدارة فوجب تقديمه، وهو مبني فيُعرب بالمحل."},{"q":"«أصبح بيننا متكاسلون» — ما نوع الخبر؟","a":"شبه جملة (ظرف) مقدَّم","e":"«بيننا» ظرف مكان في محل نصب خبر «أصبح» مقدَّم، و«متكاسلون» اسمها مؤخر مرفوع بالواو. وقُدِّم الخبر لأن الاسم نكرة، فلو تأخر الخبر لابتدئ بنكرة بلا مسوّغ."},{"q":"«أليس اللهُ بكافٍ عبدَه» — ما إعراب «عبده»؟","a":"مفعول به لاسم الفاعل «كافٍ»","e":"لأن اسم الفاعل إذا اعتمد على نفي أو استفهام عمِل عمل فعله فرفع فاعلًا ونصب مفعولًا. وهنا اعتمد على همزة الاستفهام الداخلة على «ليس»، فنصب «عبده» مفعولًا به."},{"q":"ما حكم تقديم الخبر في «فيكم بركةٌ»؟","a":"واجب التقديم","e":"لأن الخبر شبه جملة والمبتدأ نكرة غير مختصة. فلو أخّرتَ الخبر لابتدأتَ بالنكرة من غير مسوّغ، وهو ممتنع؛ فوجب التقديم ليحصل المسوّغ ويستقيم المعنى."},{"q":"معمولا «لا» النافية للجنس يكونان…","a":"نكرتين","e":"وهذا شرط إعمالها عمل «إنّ»؛ فإن جاء اسمها معرفة بطل عملها ووجب تكرارها، كقولك: «لا محمدٌ في الدار ولا عليٌّ». ويُشترط أيضًا ألّا يُفصل بينها وبين اسمها وألّا تُسبق بحرف جر."},{"q":"«اتقوا الله في الضعيفين: المرأةِ واليتيم» — ما نوع البدل؟","a":"بدل بعض من كل","e":"لأن «المرأة واليتيم» جزء مما يشمله لفظ «الضعيفين» وبيان له. وهو تابع يتبع المبدل منه في الجر، والمقصود بالحكم هو البدل لا المبدل منه."},{"q":"«أكلتُ الرغيفَ ثُلثَه» — نوع البدل؟","a":"بدل بعض من كل","e":"لأن الثلث جزء حقيقي من الرغيف، ولا بد في هذا النوع من ضمير يربط البدل بالمبدل منه وهو الهاء في «ثلثه». ولو قلت «أكلت الرغيف كله» لكان توكيدًا لا بدلًا."},{"q":"«أعجبني الرجلُ خُلُقُه» — نوع البدل؟","a":"بدل اشتمال","e":"لأن الخلق ليس جزءًا من ذات الرجل، لكنه معنى يشتمل عليه الرجل ويتعلق به. وهذا هو الفارق بينه وبين بدل البعض الذي يكون جزءًا حقيقيًّا محسوسًا."},{"q":"«ذلك الكتابُ لا ريب فيه» — نوع البدل؟","a":"بدل مطابق (كل من كل)","e":"لأن «الكتاب» مساوٍ لاسم الإشارة «ذلك» في المعنى والمصداق، فلا هو جزء منه ولا معنى مشتمل عليه. ويُسمى أيضًا بدل كل من كل."},{"q":"«أكلتُ خبزًا لحمًا» — نوع البدل؟","a":"بدل إضراب (البَداء)","e":"وهو أن يذكر المتكلم شيئًا ثم يُعرض عنه إلى غيره قاصدًا الثاني. وهو قسيم بدل الغلط الذي يقع عن سهو، والفرق أن الإضراب مقصود والغلط غير مقصود."},{"q":"«صليتُ في مساجدَ أثرية» — أعرب «مساجد»","a":"اسم مجرور وعلامة جره الفتحة لأنه ممنوع من الصرف","e":"«مساجد» على صيغة منتهى الجموع، وهي كل جمع تكسير بعد ألفه حرفان أو ثلاثة أوسطها ساكن؛ وهذه علة واحدة كافية للمنع من الصرف. ولو دخلت عليه «أل» أو أُضيف لعاد إلى الجر بالكسرة."},{"q":"«مَن يتقِ الله ...... بالجنة»","a":"يَفُزْ","e":"«مَن» أداة شرط جازمة تجزم فعلين: فعل الشرط «يتقِ» وهو مجزوم بحذف حرف العلة، وجواب الشرط «يَفُزْ» وهو مجزوم بالسكون. ورفعُه أو نصبُه خطأ لوجود الجازم."},{"q":"كلّ ما يلي أدوات جازمة لفعلين ما عدا…","a":"إذا","e":"لأن «إذا» ظرف لما يُستقبل من الزمان متضمن معنى الشرط، وهي غير جازمة في فصيح الكلام، وإنما يُجزم بها في الشعر ضرورةً. أما إنْ ومَن ومهما ومتى وأين وكيفما وأيّ فجوازم لفعلين."},{"q":"من أدوات الشرط التي تجزم فعلًا واحدًا: إن / من / أيّ / لمّا","a":"لمّا","e":"لأن «لمّا» الجازمة تدخل على المضارع فتجزمه وتقلب زمنه إلى الماضي المنفي المتصل بالحال، نحو «لمّا يأتِ». أما «إن» و«مَن» و«أيّ» فجوازم لفعلين: شرط وجواب."},{"q":"الفعل المضارع يُبنى على السكون عندما يتصل بـ…","a":"نون النسوة","e":"فتقول: «الطالباتُ يَكتبْنَ»، والفعل مبني على السكون في محل رفع. وهذا أحد موضعَي بناء المضارع، والآخر البناء على الفتح مع نون التوكيد المباشرة."},{"q":"الفعل المضارع يُبنى على الفتح عندما يتصل بـ…","a":"نون التوكيد","e":"ثقيلةً كانت أو خفيفة، بشرط اتصالها بالفعل مباشرةً: «واللهِ لأجتهدَنَّ». فإن فُصل بينهما بألف اثنين أو واو جماعة أو ياء مخاطبة لم يُبنَ الفعل وبقي معربًا."},{"q":"إذا جاء بعد «إذنْ» فعل مضارع يكون…","a":"واجب النصب","e":"بشروط ثلاثة: أن تتصدر «إذن» الكلام، وأن يكون الفعل مستقبلًا، وأن لا يُفصل بينهما بفاصل. فإن اختلّ شرط بطل النصب ووجب الرفع."},{"q":"إذا سُبقت «إذن» بحرف عطف فالمضارع بعدها…","a":"جائز الرفع والنصب","e":"لأن العطف أخرجها عن صدارة الكلام، فضعُف عملها؛ فمن نظر إلى أصلها نصب، ومن نظر إلى زوال الصدارة رفع. والوجهان مسموعان."},{"q":"«لا تنهَ عن خُلقٍ وتأتيَ مثلَه» — اضبط «تأتي» وعلّل","a":"تأتيَ — منصوبة","e":"فعل مضارع منصوب بـ«أن» مضمرة وجوبًا بعد واو المعية المسبوقة بنهي، وعلامة نصبه الفتحة الظاهرة. والمعنى على الجمع بين الأمرين، أي: لا يجتمع منك نهيٌ عن خُلق وإتيانٌ بمثله. والبيت ينسب لأبي الأسود الدؤلي."},{"q":"من أنواع المعرفة: اختر اثنين من (اسم الفاعل، جمع المذكر السالم، اسم الإشارة، الضمير)","a":"اسم الإشارة والضمير","e":"لأن المعارف سبع: الضمير والعلم واسم الإشارة والموصول والمعرَّف بأل والمضاف إلى معرفة والمنادى المقصود. أما اسم الفاعل وجمع المذكر السالم فنكرتان في الأصل ولا يتعرفان إلا بأل أو بالإضافة."},{"q":"من أنواع المعارف: الضمير — العلم — اسم الإشارة. هل العبارة صحيحة؟","a":"صحيحة","e":"وهي ثلاثة من المعارف السبع. ولا يصح عدّ «الحال» ولا «التمييز» ولا «المضاف إلى نكرة» ولا «الممنوع من الصرف» من المعارف، لأن الحال والتمييز نكرتان، والمضاف إلى نكرة يبقى نكرة، والمنع من الصرف وصف إعرابي لا تعريفي."},{"q":"«كان» فعل ناسخ ويُشترط فيه…","a":"أن يدخل على الجملة الاسمية","e":"فيرفع المبتدأ اسمًا له وينصب الخبر خبرًا لها. و«كان» متصرفة تصرفًا تامًّا بخلاف «ليس» و«ما دام» فجامدتان، فلا يصح جعل التصرف التام شرطًا في عمل الباب كله."},{"q":"أيّ الأفعال التالية متصرف: بئس / حفظ / ليس / ما خلا؟","a":"حفظ","e":"لأن له ماضيًا ومضارعًا وأمرًا: حفِظ يحفَظ احفَظْ. أما «بئس» و«ليس» و«ما خلا» فأفعال جامدة لزمت صورة واحدة ولا يُشتق منها."},{"q":"أيّ الأفعال التالية جامد: أكل / نعم / ذهب / أصبح؟","a":"نِعم","e":"لأنه فعل ماضٍ جامد للمدح لا مضارع له ولا أمر. و«أصبح» وإن كان ناسخًا فهو متصرف، و«أكل» و«ذهب» تامّان متصرفان."},{"q":"إعراب ما بعد اسم التفضيل إذا كان معرفة","a":"مضاف إليه مجرور","e":"نحو «أبي أكرمُ الناسِ»، لأن اسم التفضيل أُضيف إلى معرفة فاكتسب التعريف. أما إذا كان ما بعده نكرة منصوبة بتنوين الفتح فهو تمييز، نحو «العاملُ أعلى قدرًا»."},{"q":"«واشتعل الرأسُ شَيبًا» — أعرب «شيبًا»","a":"تمييز منصوب محوَّل عن فاعل","e":"لأن الأصل «اشتعل شيبُ الرأسِ»، فحُوِّل الفاعل إلى تمييز وأُسند الفعل إلى «الرأس». وفائدة التحويل إفادة الشمول: أن البياض عمّ الرأس كله، وهو أبلغ من الإسناد الأصلي."},{"q":"«يتعاقبون فيكم ملائكةٌ» — وضّح الشاهد وأعرب «ملائكة»","a":"الشاهد لغة «أكلوني البراغيث»؛ و«ملائكة» فاعل أو بدل أو مبتدأ مؤخر","e":"الشاهد اتصال واو الجماعة بالفعل مع ذكر الفاعل اسمًا ظاهرًا بعده، وهي لغة طيّئ وأزد شنوءة. وتخريج الجمهور أن «ملائكة» بدل من الواو أو مبتدأ مؤخر، وعلى تلك اللغة تكون فاعلًا والواو حرف دال على الجمع."},{"q":"«يلومونني في اشتراء النخيل أهلي» — أعرب «أهلي»","a":"فاعل أو بدل (أو مبتدأ مؤخر)","e":"للعلة نفسها: لحقت الفعل واو الجماعة ثم ذُكر الفاعل الظاهر. فمن حمله على لغة «أكلوني البراغيث» أعربه فاعلًا، ومن حمله على الفصيح المشهور أعربه بدلًا من الواو أو مبتدأ مؤخرًا."},{"q":"«دخل التلاميذ خلا ......»","a":"تلميذًا","e":"لأن «خلا» إذا لم تُسبق بـ«ما» جاز أن تكون فعلًا ماضيًا فينتصب ما بعدها مفعولًا به، وأن تكون حرف جر فيُجرّ. والمختار في الاختبارات النصب، وهو واجب لو سُبقت بـ«ما» المصدرية."},{"q":"أيّ الجمل صحيحة: ذهب الفلاحون / ذهب الفلاحين / ذهبوا الفلاحون؟","a":"ذهب الفلاحون إلى الحقل","e":"«الفلاحون» فاعل مرفوع بالواو لأنه جمع مذكر سالم. ونصبه بالياء خطأ لأنه ليس في موضع نصب أو جر، و«ذهبوا الفلاحون» على لغة قليلة لا يُقاس عليها في الاختبار."},{"q":"أيّ العبارات صحيحة: المركزان الأعليان / الأعلوان / الأعلى / الأعلتان؟","a":"المركزان الأعليان","e":"لأن «الأعلى» اسم مقصور آخره ألف، وعند تثنيته تُردّ الألف إلى أصلها الياء فيقال «الأعلَيان». ويجب أن ينعت المثنى بمثنى مطابق له في الإعراب والتعريف."},{"q":"اختر الصحيح: إن هاتين المعلمتين مجتهدتان","a":"إن هاتين المعلمتين مجتهدتان","e":"«هاتين» اسم إشارة مبني في محل نصب اسم «إنّ»، و«المعلمتين» بدل أو نعت منصوب بالياء لأنه مثنى، و«مجتهدتان» خبر «إنّ» مرفوع بالألف. فاجتمع في الجملة نصب الاسم ورفع الخبر على الأصل."},{"q":"«رُبّ بعيدٍ أنفعُ من قريب» — ما الفعل المناسب قبل «العرب»؟","a":"قالت العرب (ويصح: قال)","e":"لأن «العرب» اسم جمع يجوز في فعله التذكير والتأنيث؛ فالتأنيث باعتبار الجماعة والقبيلة، والتذكير باعتبار الجمع. فإن كانت الخيارات تجمع بين الوجهين فالجواب جوازهما معًا."},{"q":"المثنى اسم دلّ على اثنين؛ وعلامة رفعه…","a":"الألف","e":"ويُنصب ويُجرّ بالياء المفتوح ما قبلها المكسور ما بعدها. ونونه مكسورة دائمًا، وتُحذف عند الإضافة: كتابا اللغة، صاحبا عليٍّ."},{"q":"ما الذي يأتي بعد حرف الجر؟","a":"اسم مجرور","e":"لأن حرف الجر لا يدخل إلا على الأسماء، فيجرّها ويتعلق بالفعل أو بما يشبهه قبله. ولا يدخل حرف الجر على فعل إطلاقًا؛ وما ظاهره ذلك فمؤوَّل بمصدر، نحو «عجبتُ من أن تقومَ»."},{"q":"الفاعل هو…","a":"مَن قام بالفعل","e":"وهو اسم مرفوع تقدّمه فعل مبني للمعلوم. أما مَن وقع عليه الفعل فهو المفعول به، والحدث نفسه هو المصدر — وهذه هي الخيارات المضلِّلة في هذا السؤال."},{"q":"بم يُرفع الفعل المضارع؟","a":"بالضمة","e":"إذا كان صحيح الآخر ولم يسبقه ناصب ولا جازم. فإن كان من الأفعال الخمسة رُفع بثبوت النون، وإن كان معتل الآخر رُفع بضمة مقدَّرة منع من ظهورها التعذر أو الثقل."},{"q":"عدد حالات رفع الفعل المضارع","a":"ثلاث حالات","e":"الرفع بالضمة الظاهرة في الصحيح الآخر، والرفع بالضمة المقدَّرة في المعتل الآخر، والرفع بثبوت النون في الأفعال الخمسة. وجامعها أنه يُرفع لتجرده من الناصب والجازم."},{"q":"عدد حالات المُسنَد","a":"سبع","e":"وهي: الخبر، والفعل التام، واسم الفعل، والمبتدأ الوصف المستغني بمرفوعه عن الخبر، وأخبار النواسخ، والمصدر النائب عن فعله. وهذه كلها مواضع يُحكم فيها بشيء على شيء."},{"q":"أيّ مما يلي من المرفوعات: المبتدأ / المفعول به / المفعول لأجله / المنادى؟","a":"المبتدأ","e":"لأن المبتدأ أصل المرفوعات في الجملة الاسمية. والمفعول به والمفعول لأجله والمنادى كلها منصوبات، والمضاف إليه مجرور."},{"q":"أيّ مما يلي من المنصوبات: الفاعل / المفعول لأجله / المضاف إليه؟","a":"المفعول لأجله","e":"لأنه مصدر قلبي يُذكر لبيان سبب وقوع الفعل ويُنصب، نحو «قمتُ إجلالًا للمعلم». والفاعل مرفوع والمضاف إليه مجرور."},{"q":"عرّف المفعول لأجله","a":"اسم يُذكر لبيان سبب وقوع الفعل","e":"وهو مصدر قلبي منصوب يشارك الفعلَ في الزمان والفاعل، نحو «سافرتُ طلبًا للعلم». ويفارق المفعول المطلق الذي هو مصدر من لفظ الفعل لتوكيده أو بيان نوعه أو عدده."},{"q":"«قطفتُ الوردةَ» — الفعل في الجملة من حيث التأنيث","a":"جائز التأنيث (مع الفاعل الظاهر المؤنث المجازي)","e":"فـ«الوردة» مؤنث مجازيّ، والتأنيث مع المؤنث المجازي جائز لا واجب؛ تقول: طلع الشمسُ وطلعت الشمسُ. وإنما يجب التأنيث مع المؤنث الحقيقي المتصل بالفعل."},{"q":"أيّ الجمل خاطئة: فاطمة ساعدتها أمها / ساعدت فاطمةُ أمَّها / ساعد أمَّها فاطمةُ؟","a":"ساعد أمَّها فاطمةُ","e":"لأن الضمير في «أمها» يعود على «فاطمة» وهي متأخرة لفظًا ورتبةً، وعود الضمير على متأخر من الوجهين ممتنع. والصواب تقديم الفاعل أو جعل الاسم مبتدأ."},{"q":"اختر: فاز / فازت بالجائزة سيدةٌ من مصر","a":"الوجهان صحيحان","e":"لأن الفاعل المؤنث الحقيقي فُصل عن فعله بالجار والمجرور «بالجائزة»، والفصل يُجوِّز ترك التأنيث. فإن اتصل الفاعل بفعله وجب التأنيث: «فازت سيدةٌ بالجائزة»."},{"q":"أين تُحذف نون المثنى ونون جمع المذكر السالم؟","a":"عند الإضافة، حذفًا واجبًا","e":"نحو: سافر والدا عليٍّ، وجاء عالِمو المدينة. ولا تُزاد ألف بعد الواو عند الحذف. ونون المثنى مكسورة ونون الجمع مفتوحة في كل الأحوال الإعرابية."},{"q":"أعرب «عشر» في «اثنا عشر»","a":"اسم مبني على الفتح لا محل له من الإعراب","e":"لأنه وقع موقع نون المثنى المحذوفة، والنون حرف لا محل له. أما «اثنا» فتُعرب إعراب المثنى بالألف رفعًا وبالياء نصبًا وجرًّا."},{"q":"«عند شراء الكتاب» — اختر الرسم الصحيح: شراؤك / شراءك / شراءِ","a":"شراءِ (مضاف إليه مجرور)","e":"لأن «عند» ظرف يُضاف، فيُجرّ الاسم بعده بالإضافة. والهمزة متطرفة بعد ألف فتُرسم مفردة على السطر، والكسرة علامة الجر لا تغيّر صورة الهمزة."}],"r":[{"t":"أقسام الكلمة وعلامات كل قسم","b":"\n<p>الكلمة في العربية ثلاثة أقسام لا رابع لها: <b>اسم</b> و<b>فعل</b> و<b>حرف</b>. و«الصفة» و«الظرف» و«العدد»\nكلها أسماء، فلا تُعدّ أقسامًا مستقلة — وهذا موضع خطأ كثير في الاختيارات.</p>\n<ul>\n<li><b>علامات الاسم:</b> الجرّ، والتنوين، ودخول «أل»، والنداء، والإسناد إليه. ويكفي في إثبات الاسمية علامة واحدة.</li>\n<li><b>علامات الفعل:</b> «قد»، والسين وسوف، وتاء التأنيث الساكنة، وتاء الفاعل، ونون التوكيد، وياء المخاطبة.</li>\n<li><b>علامة الحرف:</b> أن لا تصلح له علامة اسم ولا علامة فعل — فهو يُعرف بالسلب.</li>\n</ul>\n"},{"t":"المرفوعات والمنصوبات والمجرورات — الجرد الكامل","b":"\n<p><b>المرفوعات سبعة:</b> الفاعل، ونائب الفاعل، والمبتدأ، والخبر، واسم كان وأخواتها،\nوخبر إنّ وأخواتها، والتوابع للمرفوع (النعت والعطف والتوكيد والبدل).</p>\n<p><b>المنصوبات:</b> المفعول به، والمفعول المطلق، والمفعول لأجله، والمفعول فيه (الظرف)، والمفعول معه،\nوالحال، والتمييز، والمستثنى، والمنادى، واسم إنّ، وخبر كان، والتوابع للمنصوب.</p>\n<p><b>المجرورات ثلاثة:</b> المجرور بالحرف، والمضاف إليه، والتابع للمجرور.</p>\n<p><b>المُسنَد</b> سبعة مواضع كذلك: الخبر، والفعل التام، واسم الفعل، والمبتدأ الوصف المستغني بمرفوعه،\nوأخبار النواسخ، والمصدر النائب عن فعله. و<b>المسند إليه</b> هو ما أُسند إليه ذلك.</p>\n<p><b>مفاتيح التمييز في الأسئلة:</b> المفعول لأجله <b>مصدر قلبي</b> يُذكر لبيان سبب وقوع الفعل\n(قمتُ <b>إجلالًا</b> للمعلم)، والمفعول المطلق <b>مصدر من لفظ الفعل</b> لتوكيده أو بيان نوعه أو عدده\n(انطلق <b>انطلاقًا</b>)، والتمييز اسم نكرة يرفع إبهامَ ما قبله (اشتعل الرأس <b>شيبًا</b>).</p>\n"},{"t":"علامات الإعراب الأصلية والفرعية","b":"\n<table><tr><th>النوع</th><th>رفع</th><th>نصب</th><th>جر/جزم</th></tr>\n<tr><td>الاسم المفرد وجمع التكسير</td><td>ضمة</td><td>فتحة</td><td>كسرة</td></tr>\n<tr><td>جمع المؤنث السالم</td><td>ضمة</td><td><b>كسرة</b></td><td>كسرة</td></tr>\n<tr><td>المثنى</td><td><b>ألف</b></td><td><b>ياء</b></td><td><b>ياء</b></td></tr>\n<tr><td>جمع المذكر السالم</td><td><b>واو</b></td><td><b>ياء</b></td><td><b>ياء</b></td></tr>\n<tr><td>الأسماء الخمسة</td><td><b>واو</b></td><td><b>ألف</b></td><td><b>ياء</b></td></tr>\n<tr><td>الممنوع من الصرف</td><td>ضمة</td><td>فتحة</td><td><b>فتحة</b></td></tr>\n<tr><td>الأفعال الخمسة</td><td><b>ثبوت النون</b></td><td>حذف النون</td><td>حذف النون</td></tr>\n<tr><td>المضارع المعتل الآخر</td><td>ضمة مقدرة</td><td>فتحة ظاهرة (في الواوي واليائي)</td><td><b>حذف حرف العلة</b></td></tr></table>\n<p><b>تنبيه على سؤال متكرر:</b> علامة إعراب المثنى <b>الألف رفعًا والياء نصبًا وجرًّا</b>، لا الألف في الأحوال كلها.\nوجمع المؤنث السالم يُنصب بالكسرة نيابة عن الفتحة؛ ولهذا كانت الحركة في «إن الحسنات يُذهبن السيئات»\nعلى «الحسنات» <b>الكسرة</b> وهي اسم «إنّ» منصوب.</p>\n"},{"t":"كان وأخواتها — الأفعال الناسخة","b":"\n<p>تدخل على الجملة الاسمية فترفع المبتدأ ويسمى <b>اسمها</b>، وتنصب الخبر ويسمى <b>خبرها</b>.</p>\n<p><b>أقسامها:</b> (1) ما يعمل بلا شرط: كان، أمسى، أصبح، أضحى، ظلّ، بات، صار، ليس.\n(2) ما يشترط أن يسبقه نفي أو شبهه: زال، برِح، فتِئ، انفكّ. (3) ما يشترط أن يسبقه «ما» المصدرية\nالظرفية: دام.</p>\n<p><b>من حيث التصرّف:</b> «كان» وأخواتها متصرفة تصرفًا تامًّا إلا <b>«ليس»</b> فجامدة لا ماضيَ لها ولا أمر،\nو«ما دام» جامدة كذلك. وهذا هو مدار سؤال «أيُّ الأفعال جامد؟» — فالجواب «ليس» و«بئس» و«نِعم» و«عسى»\nو«ما خلا»، والمتصرف مثل «حفظ» و«أكل» و«ذهب».</p>\n<p><b>خبر كان</b> يكون مفردًا وجملة وشبه جملة. وفي «كيف كنتَ؟» تُعرب «كيف» <b>خبر كان مقدَّمًا\nمبنيًّا على الفتح في محل نصب</b>، لأن أسماء الاستفهام لها الصدارة. وفي «أصبح بيننا متكاسلون»\nالخبر <b>شبه جملة</b> مقدَّم، و«متكاسلون» اسم أصبح مؤخر.</p>\n"},{"t":"إنّ وأخواتها — الحروف الناسخة","b":"\n<p>عملها عكس عمل كان: تدخل على الجملة الاسمية فتنصب المبتدأ ويصير <b>اسمها</b>، وترفع الخبر ويصير <b>خبرها</b>.</p>\n<ul>\n<li><b>إنّ وأنّ:</b> للتوكيد. وتُكسر «إنّ» في الابتداء وبعد القول، وتُفتح «أنّ» إذا صحّ تأويلها مع ما بعدها بمصدر.</li>\n<li><b>كأنّ:</b> للتشبيه.</li>\n<li><b>لكنّ:</b> للاستدراك، ولا تقع في صدر الكلام لأن الاستدراك يقتضي كلامًا سابقًا يُستدرك عليه؛\nتقول: «الجو بارد ولكنّ السماء صافية» دفعًا لفهمٍ خاطئ عند السامع.</li>\n<li><b>ليت:</b> للتمني، وهو طلب المستحيل أو البعيد المنال: «ألا ليت الشبابَ يعودُ يومًا».</li>\n<li><b>لعلّ:</b> للترجّي، وهو طلب الأمر المحبوب الممكن المتوقَّع: «لعلّ الله يأتي بالفرج».</li>\n</ul>\n<p><b>الفرق الحاسم بين التمني والترجي:</b> التمني لما لا يُرجى وقوعه، والترجي لما يُرجى ويمكن.</p>\n<p><b>مسألة الخبر الثاني:</b> في «إنّ الله غفورٌ رحيمٌ» تُعرب «غفور» خبر إنّ، و«رحيم» <b>خبرًا ثانيًا</b> مرفوعًا،\nلأن الناسخ يجوز تعدد خبره كما يتعدد خبر المبتدأ.</p>\n"},{"t":"لا النافية للجنس","b":"\n<p>تعمل عمل «إنّ» فتنصب الاسم وترفع الخبر، بشروط أربعة: أن يكون معمولاها <b>نكرتين</b>،\nوأن لا يفصل بينها وبين اسمها فاصل، وأن لا تُسبق بحرف جر، وأن تكون نافية للجنس على سبيل الاستغراق.</p>\n<p><b>حالات اسمها:</b> إن كان مضافًا أو شبيهًا بالمضاف فهو <b>منصوب</b> (لا طالبَ علمٍ مذمومٌ)،\nوإن كان مفردًا بُني على ما يُنصب به في محل نصب (لا رجلَ في الدار).</p>\n<p>وهذا هو مدار السؤال: «معمولا لا النافية للجنس» الجواب <b>نكرتان</b>.</p>\n"},{"t":"الفاعل ونائب الفاعل","b":"\n<p><b>الفاعل</b> اسم مرفوع تقدّمه فعل مبني للمعلوم ودلّ على من فعل الفعل أو اتّصف به.\nو<b>نائب الفاعل</b> اسم مرفوع حلّ محل الفاعل بعد حذفه وبناء الفعل للمجهول.</p>\n<p><b>بناء الفعل للمجهول:</b> في الماضي يُضمّ أوله ويُكسر ما قبل آخره (كتب ← كُتِبَ، استخرج ← اسْتُخْرِجَ)،\nوفي المضارع يُضمّ أوله ويُفتح ما قبل آخره (يكتب ← يُكتَبُ).</p>\n<p><b>تنبيه:</b> نائب الفاعل هو <b>الذي حلّ محل الفاعل</b>، وليس بالضرورة آخر كلمة في الجملة.\nففي «أُعطِيَ الموظفُ مكافأةً» نائب الفاعل «الموظفُ» و«مكافأةً» مفعول به ثانٍ باقٍ على نصبه.\nوفي «بِعتُ السلعةَ» الفعل مبني للمعلوم و«السلعةَ» مفعول به؛ فإن قلت «بِيعت السلعةُ» صارت نائب فاعل.</p>\n"},{"t":"الفعل المضارع — رفعه ونصبه وجزمه وبناؤه","b":"\n<p><b>يُرفع</b> المضارع إذا تجرّد من ناصب وجازم. وعلامة رفعه <b>الضمة</b> إن كان صحيح الآخر،\nو<b>ثبوت النون</b> في الأفعال الخمسة، و<b>ضمة مقدرة</b> في معتل الآخر.</p>\n<p><b>يُنصب</b> بأحد النواصب: أنْ، لن، كي، إذنْ، لام التعليل، ولام الجحود، وحتى، وفاء السببية،\nوواو المعية، وأو بمعنى «إلى أن» — والأربعة الأخيرة ينصب بعدها بـ«أن» مضمرة.</p>\n<p><b>يُجزم</b> بـ: لم، لمّا، لام الأمر، لا الناهية — وبأدوات الشرط الجازمة.</p>\n<p><b>ويُبنى</b> في موضعين فقط: على <b>السكون</b> إذا اتصلت به <b>نون النسوة</b> (الطالباتُ يَكتبْنَ)،\nوعلى <b>الفتح</b> إذا اتصلت به <b>نون التوكيد</b> مباشرةً (واللهِ لأجتهدَنَّ).</p>\n<p><b>حكم «إذنْ»:</b> ينتصب المضارع بعدها <b>وجوبًا</b> بثلاثة شروط: أن تكون في صدر الكلام،\nوأن يكون الفعل مستقبلًا، وأن لا يُفصل بينهما بفاصل. فإن سُبقت بحرف عطف كالواو جاز الوجهان:\nالرفع والنصب.</p>\n"},{"t":"أدوات الشرط الجازمة وغير الجازمة","b":"\n<p><b>الجازمة لفعلين</b> (فعل الشرط وجوابه): إنْ، مَن، ما، مهما، متى، أيّان، أين، أنّى، حيثما، كيفما، أيّ، إذما.</p>\n<p><b>الجازمة لفعل واحد:</b> لم، لمّا، لام الأمر، لا الناهية.</p>\n<p><b>غير الجازمة:</b> إذا، لو، لولا، لوما، أمّا، كلّما، لمّا الحينية.\nوهذا هو جواب السؤال المتكرر: «كلّ ما يلي أدوات جازمة لفعلين ما عدا… → <b>إذا</b>»، لأنها ظرف لما يُستقبل\nمن الزمان متضمن معنى الشرط، وهي غير جازمة في الاستعمال الفصيح.</p>\n<p><b>تطبيق:</b> «مَن يتقِ الله ...... بالجنة» الجواب <b>يَفُزْ</b>، لأنه جواب الشرط مجزوم بالسكون،\nو«مَن» جزمت فعلين: «يتقِ» (مجزوم بحذف حرف العلة) و«يفزْ» (مجزوم بالسكون).</p>\n"},{"t":"النصب بأن المضمرة بعد واو المعية وفاء السببية","b":"\n<p>إذا وقع المضارع بعد <b>واو المعية</b> أو <b>فاء السببية</b> مسبوقًا بنفي أو طلب (أمر، نهي، استفهام، تمنٍّ،\nعرض، تحضيض، ترجٍّ، دعاء)، نُصب بـ«أن» مضمرة <b>وجوبًا</b>.</p>\n<p><b>الشاهد المشهور:</b> «لا تنهَ عن خُلقٍ وتأتيَ مثلَه» — فـ«تأتيَ» مضارع منصوب بـ«أن» مضمرة وجوبًا\nبعد واو المعية، وعلامة نصبه الفتحة الظاهرة. والمعنى: لا يجتمع منك النهيُ والإتيانُ بالفعل نفسه.\nوالبيت يُنسب إلى أبي الأسود الدؤلي.</p>\n<p>ولو رُفعت «تأتي» لتغيّر المعنى إلى العطف على «تنهَ» المجزوم، أي: ولا تأتي مثله — وهو معنى آخر.</p>\n"},{"t":"الممنوع من الصرف","b":"\n<p>الممنوع من الصرف اسم لا يُنوَّن ويُجرّ <b>بالفتحة</b> نيابة عن الكسرة، إلا إذا أُضيف أو دخلته «أل»\nفيرجع إلى الجرّ بالكسرة.</p>\n<p><b>ما يُمنع لعلّة واحدة:</b> (1) صيغة منتهى الجموع: كل جمع تكسير بعد ألفه حرفان أو ثلاثة أوسطها ساكن\n— مساجد، مصابيح، قناديل. (2) المختوم بألف التأنيث المقصورة أو الممدودة — ذكرى، صحراء، أصدقاء.</p>\n<p><b>ما يُمنع لعلّتين:</b> العَلَم إذا كان أعجميًّا (إبراهيم) أو مؤنثًا (فاطمة) أو على وزن الفعل (أحمد، يزيد)\nأو معدولًا (عُمَر، زُحَل) أو مركبًا تركيبًا مزجيًّا (حضرموت) أو مختومًا بألف ونون زائدتين (عثمان).\nوالصفة إذا كانت على وزن «أفعل» (أحمر) أو «فَعلان» (عطشان) أو معدولة (مَثنى، ثُلاث، أُخَر).</p>\n<p><b>تطبيق:</b> «صليتُ في مساجدَ كثيرةٍ» — «مساجدَ» اسم مجرور وعلامة جره <b>الفتحة</b> لأنه ممنوع من الصرف\nعلى صيغة منتهى الجموع. ولو قلت «في المساجدِ» لجررتَه بالكسرة لدخول «أل».</p>\n"},{"t":"أنواع المعرفة والنكرة","b":"\n<p><b>المعارف سبع</b> مرتبةً في التعريف: الضمير، ثم العَلَم، ثم اسم الإشارة، ثم الاسم الموصول،\nثم المُعرَّف بـ«أل»، ثم المضاف إلى معرفة، ثم المنادى المقصود بالنداء.</p>\n<p><b>النكرة</b> ما دلّ على شائع في جنسه ويقبل «أل» المؤثِّرة للتعريف.</p>\n<p><b>تنبيهات امتحانية:</b> «اسم الفاعل» و«جمع المذكر السالم» ليسا من المعارف بذاتهما — إنما يتعرفان بالإضافة\nأو بـ«أل». و«المضاف إلى نكرة» يبقى نكرة. و«التمييز» و«الحال» نكرتان وجوبًا في الأصل.</p>\n"},{"t":"البدل وأنواعه الأربعة","b":"\n<p>البدل تابع مقصود بالحكم بلا واسطة، ويتبع المبدلَ منه في إعرابه. وأنواعه:</p>\n<ul>\n<li><b>بدل مطابق (كل من كل):</b> يطابق المبدل منه في المعنى — «ذلك الكتابُ لا ريب فيه»، «الكتاب» بدل مطابق.</li>\n<li><b>بدل بعض من كل:</b> جزء حقيقي من المبدل منه ولا بد فيه من ضمير يعود عليه —\n«أكلتُ الرغيفَ ثُلثَه»، «اتقوا الله في الضعيفين: المرأةِ واليتيم».</li>\n<li><b>بدل اشتمال:</b> ليس جزءًا منه لكنه معنى يشتمل عليه المبدل منه، ولا بد من ضمير —\n«أعجبني الرجلُ خُلُقُه»، «نفعني المعلمُ علمُه».</li>\n<li><b>بدل الإضراب (البَداء / الغلط):</b> أن تذكر شيئًا ثم تُعرض عنه إلى غيره — «أكلتُ خبزًا لحمًا».</li>\n</ul>\n"},{"t":"العدد وتمييزه","b":"\n<p><b>القاعدة الكبرى:</b> العددان 1 و2 يوافقان المعدود في التذكير والتأنيث.\nوالأعداد من 3 إلى 9 <b>تخالف</b> المعدود. والعدد 10 مفردًا يخالف، ومركّبًا يوافق.\nوالعقود وما بينها (20–90) بلفظ واحد لا تتغير.</p>\n<p><b>في الأعداد المركبة (11–19):</b> الجزء الأول من 13 إلى 19 يخالف المعدود، والجزء الثاني (عشر/عشرة) يوافقه.\nأما 11 و12 فجزآهما يوافقان المعدود.</p>\n<p><b>تطبيقات محسومة:</b></p>\n<ul>\n<li>«تزوّج وعمره 16 عامًا» ← <b>ستةَ عشرَ</b>؛ لأن المعدود «عامًا» مذكر، فالجزء الأول يخالفه بالتاء،\nوالجزء الثاني يوافقه بالتذكير.</li>\n<li>«أكرمت المدرسة 14 معلمًا» ← <b>أربعةَ عشرَ</b>، للعلّة نفسها.</li>\n<li>«نجحت ...... طالبة» ← <b>اثنتا عشرةَ</b>؛ لأن المعدود مؤنث والجزآن يوافقانه، وهي مرفوعة بالألف\nلأنها ملحقة بالمثنى.</li>\n<li>«منذ السنة 18 من عمره» ← <b>الثامنةَ عشرةَ</b>؛ لأنه عدد ترتيبي وصف لـ«السنة» وهي مؤنثة،\nفيؤنَّث الجزآن.</li>\n<li>«قرأتُ ...... قصصٍ» ← <b>خمسَ قصصٍ</b>؛ لأن مفرد «قصص» هو «قصة» وهو مؤنث،\nفيخالفه العدد بالتجرد من التاء، وتمييزه جمع مجرور بالإضافة.</li>\n</ul>\n<p><b>تمييز «كم»:</b> الاستفهامية تمييزها <b>مفرد منصوب</b> — «كم طالبًا في المدرسة؟».\nوالخبرية تمييزها <b>مفرد أو جمع مجرور</b> — «كم مالٍ عندي!».</p>\n"},{"t":"الاستثناء","b":"\n<p>أدواته: إلّا، غير، سوى، خلا، عدا، حاشا، ليس، لا يكون.</p>\n<p><b>مع «إلّا»:</b> إن كان الكلام تامًّا موجبًا وجب نصب المستثنى (حضر الطلابُ إلا طالبًا).\nوإن كان تامًّا منفيًّا جاز النصب والبدل (ما حضر الطلابُ إلا طالبٌ/طالبًا).\nوإن كان ناقصًا منفيًّا أُعرب المستثنى حسب موقعه وسُمّي استثناءً مفرَّغًا (ما حضر إلا طالبٌ).</p>\n<p><b>مع «خلا، عدا، حاشا»:</b> إن سُبقت بـ«ما» المصدرية فهي <b>أفعال</b> وما بعدها <b>مفعول به منصوب</b> وجوبًا.\nوإن لم تُسبق جاز وجهان: أن تكون أفعالًا فينتصب ما بعدها، أو حروف جرّ فيُجرّ.\nولهذا كان الجواب في «دخل التلاميذ خلا ......» هو <b>تلميذًا</b> على اعتبارها فعلًا، وهو الوجه المختار في الاختبارات.</p>\n"},{"t":"التمييز","b":"\n<p>التمييز اسم نكرة منصوب يرفع إبهام ما قبله. وهو نوعان:</p>\n<ul>\n<li><b>تمييز ذات (ملفوظ):</b> يبيّن المقصود من عدد أو وزن أو كيل أو مساحة — «اشتريتُ رطلًا زيتًا».</li>\n<li><b>تمييز نسبة (ملحوظ):</b> يبيّن المقصود من جملة، وهو إما <b>محوَّل عن فاعل</b> أو <b>عن مفعول</b>\nأو <b>عن مبتدأ</b> أو غير محوَّل.</li>\n</ul>\n<p><b>الشاهد الذهبي:</b> «واشتعل الرأسُ شَيبًا» — «شيبًا» تمييز منصوب <b>محوَّل عن فاعل</b>،\nوأصل التركيب «اشتعل شيبُ الرأسِ». وفائدة التحويل الدلالة على الشمول والعموم: أن الشيب عمّ الرأس كله.\nوهذه الآية تُسأل من وجهين: من جهة النحو فهي تمييز محوَّل عن فاعل، ومن جهة البلاغة فهي\n<b>استعارة تصريحية/مكنية</b> بحسب التقدير — شبّه انتشار الشيب باشتعال النار.</p>\n"},{"t":"اسم التفضيل وإعراب ما بعده","b":"\n<p>اسم التفضيل على وزن «أفعَل» ومؤنثه «فُعلى»، ويُصاغ من الثلاثي التام المتصرف المثبت القابل للتفاوت\nالذي ليس الوصف منه على «أفعَل فعلاء».</p>\n<p><b>إعراب ما بعده:</b></p>\n<ul>\n<li>إن كان <b>معرفة</b> فهو <b>مضاف إليه مجرور</b> — «أبي أكرمُ الناسِ».</li>\n<li>إن كان <b>نكرة منصوبة</b> بتنوين الفتح فهو <b>تمييز</b> — «العاملُ المجتهدُ أعلى قدرًا من غيره».</li>\n</ul>\n<p>وإذا جُرّد من «أل» والإضافة لزم الإفراد والتذكير ووجب الإتيان بـ«مِن» الجارّة للمفضَّل عليه.</p>\n"},{"t":"لغة «أكلوني البراغيث» — شاهد يتكرر","b":"\n<p>الأصل في العربية أن الفعل يُفرَد مع الفاعل الظاهر مثنى كان أو جمعًا: «قام الرجلان»، «قام الرجال».\nلكنّ لبعض العرب (طيّئ وأزد شنوءة) لغةً يلحقون فيها الفعلَ علامةَ تثنية أو جمع تدل على الفاعل،\nثم يذكرون الفاعل الظاهر بعده، وتُسمّى <b>لغة «أكلوني البراغيث»</b> أو <b>لغة «يتعاقبون فيكم ملائكة»</b>.</p>\n<p><b>الشواهد المسؤول عنها:</b></p>\n<ul>\n<li>«يتعاقبون فيكم ملائكةٌ» — الشاهد اتصال واو الجماعة بالفعل مع ذكر الفاعل الظاهر بعده.\nوتُعرب «ملائكة» على ثلاثة أوجه بحسب الخيارات: <b>فاعل</b> (على هذه اللغة)،\nأو <b>بدل</b> من الواو، أو <b>مبتدأ مؤخر</b> والجملة قبله خبر.</li>\n<li>«يلومونني في اشتراءِ النخيـ ـلِ أهلي فكلُّهمُ يَعذِلُ» — الشاهد «يلومونني … أهلي»، وتُعرب «أهلي»\nفاعلًا أو بدلًا أو مبتدأ مؤخرًا على الأوجه نفسها.</li>\n<li>«رأينَ الغوانيَ الشيبَ لاح بعارضي» — «الغواني» على الأوجه الثلاثة أيضًا.</li>\n</ul>\n"},{"t":"تقديم الخبر على المبتدأ — واجب وجائز","b":"\n<p><b>يجب تقديم الخبر</b> في أربعة مواضع:</p>\n<ol>\n<li>إذا كان الخبر شبه جملة والمبتدأ نكرة غير مختصّة — «فيكم بركةٌ»، «في الدار رجلٌ».</li>\n<li>إذا كان في المبتدأ ضمير يعود على بعض الخبر — «في الدار صاحبُها».</li>\n<li>إذا كان الخبر من أسماء الصدارة كأسماء الاستفهام — «أين الكتابُ؟»، «كيف حالُك؟».</li>\n<li>إذا اقترن المبتدأ بـ«إلّا» أو «إنّما» — «ما في الدار إلا زيدٌ».</li>\n</ol>\n<p>ولهذا كان حكم تقديم الخبر في «فيكم بركةٌ» <b>واجبًا</b>، لأن المبتدأ نكرة والخبر شبه جملة،\nولو أخّرته لابتدأتَ بنكرة بلا مسوّغ.</p>\n"},{"t":"تأنيث الفعل مع الفاعل","b":"\n<p><b>يجب التأنيث</b> في موضعين: إذا كان الفاعل مؤنثًا حقيقيًّا متصلًا بالفعل غير مفصول (قامت هندُ)،\nوإذا كان ضميرًا مستترًا يعود على مؤنث (الشمسُ طلعتْ).</p>\n<p><b>ويجوز الوجهان</b> فيما عدا ذلك: إذا كان الفاعل مؤنثًا <b>مجازيَّ التأنيث</b> (طلع الشمسُ / طلعت الشمسُ)،\nأو حقيقيًّا <b>مفصولًا</b> عن فعله (حضر اليومَ فاطمةُ)، أو جمعَ تكسير، أو جمعَ مؤنث سالمًا.</p>\n<p><b>تطبيق:</b> «قطفتُ الوردةَ» — الفعل هنا لا شأن للتأنيث به لأن الفاعل ضمير المتكلم.\nأما «قطف/قطفت الوردةُ» فالتأنيث <b>جائز</b> لأن «الوردة» مؤنث مجازي.\nوفي «فاز/فازت بالجائزة سيدةٌ من مصر» يجوز الوجهان لوقوع الفصل بين الفعل والفاعل بالجار والمجرور.</p>\n<p><b>وجملة «ساعد أمَّها فاطمةُ»</b> صحيحة التركيب إعرابًا لكنها معيبة دلاليًّا بعود الضمير على متأخر لفظًا\nورتبةً، ولهذا تُعدّ خطأً في أسئلة الاختيار، والصواب «ساعدت فاطمةُ أمَّها» أو «فاطمةُ ساعدتها أمُّها».</p>\n"},{"t":"المثنى وجمع المذكر السالم — نونهما وحذفها","b":"\n<p><b>نون المثنى مكسورة</b> أبدًا في أحواله الإعرابية: الوالدانِ، الوالدَينِ.\nو<b>نون جمع المذكر السالم مفتوحة</b> أبدًا: المعلمونَ، المعلمينَ. وقد نظم ابن مالك ذلك في الألفية.</p>\n<p><b>تُحذف النون وجوبًا عند الإضافة</b> في الاثنين: سافر والدا عليٍّ، جاء عالِمو المدينة، كرّمتُ عالِمي المدينة.\nولا تُزاد ألف بعد الواو عند الحذف.</p>\n<p><b>مسألة دقيقة:</b> إذا أُضيف المثنى أو الجمع إلى كلمة أولها ساكن (أل التعريف)\nحُذفت الألف أو الواو <b>في النطق لا في الكتابة</b> التقاءً للساكنين، ويقول النحاة إنه معرب\nبالحرف المقدَّر: جاء عالِمو المدينة (تُنطق: عالِمُ لْمدينة).</p>\n<p><b>«اثنا عشر»:</b> «اثنا» تُعرب إعراب المثنى بالألف رفعًا والياء نصبًا وجرًّا،\nو«عشر» اسم مبني على الفتح لا محل له من الإعراب لوقوعه موقع نون المثنى المحذوفة.</p>\n"},{"t":"الجملة الاسمية والفعلية — التحويل بينهما","b":"\n<p>الجملة <b>الاسمية</b> ما بُدئت باسم، و<b>الفعلية</b> ما بُدئت بفعل. وعند التحويل من اسمية إلى فعلية\nيجب أن <b>يُفرَد الفعل</b> مع الفاعل الظاهر على اللغة الفصيحة المشهورة.</p>\n<p><b>تطبيق:</b> «هؤلاء الرجالُ يعملون بصمت» جملة اسمية، فإذا حوّلتها إلى فعلية قلت:\n<b>«يعملُ هؤلاء الرجالُ بصمتٍ»</b> — أُفرِد الفعل لأن الفاعل اسم ظاهر.\nو«يعملون هؤلاء الرجال» ضعيف لأنه على لغة «أكلوني البراغيث»، و«يعملوا» خطأ لأنه لا ناصب ولا جازم.</p>\n"},{"t":"حروف الجر ومعانيها","b":"\n<table><tr><th>الحرف</th><th>من معانيه</th><th>مثال</th></tr>\n<tr><td>مِن</td><td>ابتداء الغاية، التبعيض، بيان الجنس</td><td>سافرتُ من القاهرة</td></tr>\n<tr><td>إلى</td><td>انتهاء الغاية</td><td>سرتُ إلى البيت</td></tr>\n<tr><td>عن</td><td>المجاوزة والبُعد</td><td>رميتُ عن القوس</td></tr>\n<tr><td>على</td><td>الاستعلاء</td><td>جلس على الكرسي</td></tr>\n<tr><td>في</td><td>الظرفية والمصاحبة</td><td>خرج الرئيسُ في موكبه</td></tr>\n<tr><td>الباء</td><td>الإلصاق، الاستعانة، المصاحبة، السببية</td><td>كتبتُ بالقلم</td></tr>\n<tr><td>اللام</td><td>الملك والاختصاص والتعليل</td><td>الكتابُ لمحمدٍ</td></tr>\n</table>\n<p><b>حروف الجر اللازمة للأفعال (التعدية):</b> هذا باب يكثر فيه السؤال، ومداره السماع لا القياس:</p>\n<ul>\n<li>اتّصل <b>بـ</b> — «اتصلتُ بصديقي هاتفيًّا» (لا «على» ولا «لـ»).</li>\n<li>استعان <b>بـ</b> — «استعان الرجلُ بصديقه».</li>\n<li>رغِب <b>في</b> (أراد) ورغِب <b>عن</b> (كرِه) — والفرق بينهما بالحرف لا باللفظ.</li>\n<li>خرج <b>في</b> موكبه — للمصاحبة.</li>\n<li>خذ الكتابَ <b>أو</b> المجلةَ — «أو» هنا للتخيير، ولو قلت «أم» لكانت للاستفهام المعادل.</li>\n</ul>\n<p><b>قاعدة عامة:</b> يأتي بعد حرف الجر <b>اسم</b> مجرور دائمًا؛ ولا يدخل حرف الجر على فعل.</p>\n"},{"t":"الظرف والمضاف إليه بعده","b":"\n<p>الظروف المضافة إلى ما بعدها مثل: قبل، بعد، عند، لدى، ليلة، يوم، وقت، حين، ساعة —\nيُعرب الاسم الواقع بعدها <b>مضافًا إليه مجرورًا</b>.</p>\n<p><b>تطبيق على مسألة الرسم:</b> «عند شراءِ الكتاب من المكتبة» — تُكتب «شراء» بالهمزة على السطر\nوتُجرّ بالكسرة لأنها مضاف إليه بعد الظرف «عند»، فهي «شراءِ» لا «شراؤك» ولا «شراءَك».\nوالفيصل أن تنظر إلى الموقع الإعرابي ثم تختار صورة الهمزة بحسب حركة ما قبلها.</p>\n"}]},{"c":"sarf","n":"الصرف والاشتقاق","q":[{"q":"ما جمع «عندليب»؟","a":"عنادل","e":"لأن ما زاد على أربعة أحرف يُردّ عند الجمع إلى الرباعي بحذف الزائد، فحُذفت الياء والباء وجُمع على «فعالل». وكذلك «سفرجل» تُجمع على «سفارج» و«فرزدق» على «فرازِد»."},{"q":"ما مؤنث «عطشان»؟","a":"عطشى","e":"لأن الوصف على وزن «فَعْلان» يُؤنَّث على «فَعْلى» لا على «فَعلانة»، نحو: جوعان/جَوْعى، سكران/سَكرى. وهو لذلك ممنوع من الصرف لزيادة الألف والنون."},{"q":"الجمع الصحيح لكلمة «جدار»","a":"جُدْران","e":"وهو جمع كثرة على وزن «فُعلان»، وهو وزن مطّرد في جمع ما كان على «فِعال» أو «فَعال» من الأسماء الجامدة. و«جُدُر» مسموع أيضًا لكن «جدران» هو المشهور."},{"q":"اختر الوزن الصرفي الصحيح لكلمة «انعكاس»","a":"انفِعال","e":"لأنها مصدر الفعل الخماسي «انعكسَ» الذي وزنه «انفعلَ»، والأصول فيها «ع ك س» والزائد الهمزة والنون والألف. و«أفعال» وزن جمع لا مصدر، و«انفعلل» وزن مصدر الخماسي المضعّف."},{"q":"اختر الفعل المزيد: بعثر / درس / أكرم / يقرأ","a":"أكرم","e":"لأنه على وزن «أفعَل»، زِيدت الهمزة على الأصول الثلاثة «ك ر م» فأفادت التعدية. و«بعثر» رباعي مجرد، و«درس» ثلاثي مجرد، وياء «يقرأ» حرف مضارعة لا زيادة بنائية."},{"q":"ينقسم الفعل إلى مجرد ومزيد؛ فما المجرد؟","a":"ما كانت حروفه كلها أصلية","e":"وهو نوعان: ثلاثي كـ«كتب ودرس»، ورباعي كـ«دحرج وبعثر». والمزيد ما زِيد على أصوله حرف فأكثر لإفادة معنى جديد كالتعدية أو المطاوعة أو الطلب."},{"q":"كلمة «مصائب» جمع شاذ أم قياسي؟","a":"جمع شاذ","e":"لأن القياس في «فَعيلة» معتلة العين أن تُجمع على «مَفاعِل» من غير همز فيقال «مصاوب»، لكن العرب همزت الواو فقالت «مصائب»، فجاء الجمع على خلاف القياس المطّرد."},{"q":"أوزان جموع القلة","a":"أَفعال، أَفعُل، أَفعِلة، فِعلة","e":"وهي تدل على العدد من ثلاثة إلى عشرة، نحو: أقلام، أنفُس، أسئلة، فِتية. وما عداها من أوزان جمع التكسير فهو من جموع الكثرة الدالة على ما فوق العشرة."},{"q":"جمع «كبرى»","a":"كُبَر وكُبْرَيات","e":"فـ«كبرى» مؤنث «أكبر»، وتُجمع جمع تكسير على «كُبَر»، وتُجمع جمع مؤنث سالمًا على «كُبرَيات» بردّ الألف المقصورة ياءً قبل علامة الجمع."},{"q":"جمع «القاضي»","a":"قاضُون (سالم) وقُضاة (تكسير)","e":"«القاضي» اسم منقوص، وعند جمعه جمع مذكر سالم تُحذف ياؤه ويُضمّ ما قبلها رفعًا: قاضون، ويُكسر نصبًا وجرًّا: قاضين. وله جمع تكسير مسموع هو «قُضاة» على وزن فُعَلة."},{"q":"جمع «غار»","a":"أغوار وغِيران","e":"الأول جمع قلة على «أفعال»، والثاني جمع كثرة على «فِعلان». وأصل ألف «غار» واو بدليل «أغوار»، فرُدّت إلى أصلها عند الجمع."},{"q":"مفرد «أعباء»","a":"عِبء","e":"لأن «أعباء» جمع قلة على وزن «أفعال»، ومفرده «عِبء» بكسر العين وسكون الباء ومعناه الحِمل والثِّقل. والهمزة فيه متطرفة بعد ساكن فتُرسم على السطر."},{"q":"مفرد «أشياء»","a":"شيء","e":"و«أشياء» اسم جمع ممنوع من الصرف لأن فيه ألف تأنيث ممدودة في أصل وضعه عند الخليل. وهذا سبب منعه من الصرف مع كونه على صورة الجمع."},{"q":"جمع «مقلاة»","a":"مَقالٍ / مَقاليت","e":"جمع «مِقلى» و«مِقلاة» على «مقالٍ» و«مقاليت»، وهو من صيغ منتهى الجموع الممنوعة من الصرف، فيُجرّ بالفتحة إذا تجرد من أل والإضافة."},{"q":"تصغير «ناب»","a":"نُيَيْب","e":"لأن أصل الألف في «ناب» ياء بدليل جمعه «أنياب»، وقاعدة التصغير ردُّ حرف العلة إلى أصله. فيصير على وزن «فُعَيْل» بضم الأول وفتح الثاني وزيادة ياء ساكنة."},{"q":"تصغير «باب»","a":"بُوَيْب","e":"لأن أصل ألفه واو بدليل جمعه «أبواب» وتصريفه «بوّاب». فعند التصغير تُردّ الواو ويُصاغ على «فُعَيْل». ولاحظ الفرق بينه وبين «ناب» الذي أصله ياء."},{"q":"تصغير «قِيمة»","a":"قُوَيْمة","e":"لأن أصل الياء واو من مادة «ق و م» بدليل «التقويم» و«قوّمَ». وعند التصغير يُردّ الحرف إلى أصله، فتعود الواو وتبقى تاء التأنيث في آخره."},{"q":"تصغير «دينار»","a":"دُنَيْنير","e":"لأن أصل الياء نون بدليل الجمع «دنانير»، فرُدّت النون عند التصغير. وهو على وزن «فُعَيعيل» لأنه رباعي ما قبل آخره حرف مدّ."},{"q":"تصغير «سفرجل»","a":"سُفَيْرِج (أو سُفَيْرِل)","e":"لأن الاسم خماسي، وقاعدة تصغير الخماسي حذفُ حرفه الخامس ليصير رباعيًّا، ثم يُصغَّر على «فُعَيعِل». ومن حذف الجيم قال «سفيرل»."},{"q":"تصغير «آدم»","a":"أُوَيْدِم","e":"لأن المدّة في «آدم» أصلها همزتان: الأولى همزة القطع والثانية ساكنة. فعند التصغير تُقلب الثانية واوًا منعًا للالتقاء، ويُصاغ على «فُعَيْعِل»."},{"q":"تصغير «إبل» ونسبها","a":"التصغير: أُبَيْلة — والنسب: إبِلِيّ","e":"أما التصغير فلحقته التاء لأنه اسم ثلاثي مؤنث تأنيثًا معنويًّا، والقاعدة أن الثلاثي المؤنث المجرد من التاء تُردّ إليه التاء عند التصغير. وأما النسب فعلى الأصل بزيادة ياء مشددة."},{"q":"ضبط الراء في «زرتُ معرض الكتاب»","a":"مَعرِض — بكسر الراء","e":"لأنه اسم مكان من الفعل «عرَض يَعرِض»، وقاعدة اسم المكان من الثلاثي مكسور العين في المضارع أن يأتي على وزن «مَفعِل». ونظائره: مجلِس، منزِل، مضرِب."},{"q":"الحرف المشدَّد في اللغة العربية هو…","a":"حرفان متماثلان: الأول ساكن والثاني متحرك، أُدغم الأول في الثاني","e":"فالتشديد علامة على الإدغام لا حرف مستقل. ولهذا يُحسب المشدَّد بحرفين في الوزن العروضي: الأول ساكن يُسكِّن المقطع والثاني متحرك يفتحه."},{"q":"«ينبغي» فيها: إدغام / إقلاب / إظهار / إعلال؟","a":"إقلاب","e":"لأن النون الساكنة جاء بعدها حرف الباء، وحكمها حينئذ القلب ميمًا مخفاة مع الغنة. وهذا من أحكام النون الساكنة والتنوين في التجويد، وتسري على نطق الفصحى عمومًا."},{"q":"كيف نبني الفعل الماضي للمجهول؟","a":"يُضمّ أوله ويُكسر ما قبل آخره","e":"نحو: كتب ← كُتِبَ، واستخرج ← اسْتُخرِجَ. وفي الأجوف يُكسر أوله وتُقلب ألفه ياء: قال ← قِيلَ، باع ← بِيعَ. وفي المضارع يُضمّ أوله ويُفتح ما قبل آخره: يُكتَبُ."},{"q":"صيغ المبالغة المشهورة","a":"فَعّال، مِفعال، فَعول، فَعيل، فَعِل","e":"وهي أوزان تدل على كثرة وقوع الفعل من صاحبه، نحو: غفّار، مِهذار، صَبور، عليم، حَذِر. وتعمل عمل اسم الفاعل إذا اعتمدت على نفي أو استفهام أو موصوف."},{"q":"ما الفرق بين اسم الفاعل واسم المفعول في غير الثلاثي؟","a":"كسر ما قبل الآخر في الفاعل، وفتحه في المفعول","e":"فكلاهما يُصاغ على وزن المضارع بإبدال حرف المضارعة ميمًا مضمومة؛ والفارق الحركة: مُستخرِج (فاعل) ومُستخرَج (مفعول)، ومُكرِم ومُكرَم."}],"r":[{"t":"المجرد والمزيد والميزان الصرفي","b":"\n<p><b>الميزان الصرفي</b> مقياس وُضع لبيان بنية الكلمة، أصله ثلاثة أحرف: <b>ف ع ل</b>.\nتُقابل فاءُ الميزان الحرفَ الأول من الكلمة، وعينُه الثاني، ولامُه الثالث، وما زاد عن الأصول\nيُذكر بلفظه في الميزان مع تكرار اللام في الرباعي والخماسي.</p>\n<p><b>الفعل المجرد:</b> ما كانت كل حروفه أصلية. ثلاثي (كتب، درس، فهم) أو رباعي (بعثر، دحرج، زلزل).</p>\n<p><b>الفعل المزيد:</b> ما زِيد على أصوله حرف أو أكثر. مزيد الثلاثي بحرف (أكرم، قاتل، كسّر)،\nوبحرفين (انطلق، اجتمع، تعلّم، احمرّ)، وبثلاثة (استخرج، اعشوشب).</p>\n<p><b>تطبيق:</b> في سؤال «اختر الفعل المزيد: بعثر / درس / أكرم / يقرأ» الجواب <b>أكرم</b>،\nلأنه على وزن «أفعَل» زِيدت همزته على الأصول الثلاثة «ك ر م». أما «بعثر» فرباعي مجرّد\nحروفه كلها أصلية، و«درس» ثلاثي مجرّد، و«يقرأ» مضارع الثلاثي وياؤه حرف مضارعة لا حرف زيادة بنائية.</p>\n<p><b>وزن «انعكاس»:</b> هو <b>انفِعال</b>، لأنه مصدر الفعل الخماسي «انعكسَ» على وزن «انفعلَ»،\nوالأصول «ع ك س» والزائد الهمزة والنون والألف. وليس «أفعال» لأن ذلك وزن جمع لا مصدر خماسي.</p>\n"},{"t":"جموع التكسير: جموع القلة وجموع الكثرة","b":"\n<p><b>جموع القلة</b> أربعة أوزان، تدل على ما بين الثلاثة والعشرة:\n<b>أَفعِلة</b> (أطعمة، أسئلة)، <b>أَفعُل</b> (أنفُس، أشهُر)، <b>أَفعال</b> (أقلام، أعباء)،\n<b>فِعلة</b> (فِتية، صِبية).</p>\n<p><b>جموع الكثرة</b> أوزانها كثيرة تزيد على عشرين، منها: فُعُل (كُتُب)، فُعَل (غُرَف)، فِعَل (قِطَع)،\nفُعّال (كُتّاب)، فِعال (جِبال)، فُعول (بُيوت)، فَعلى (جَرحى)، فُعَلاء (عُلَماء)، أفعِلاء (أصدقاء)،\nومنتهى الجموع: مَفاعِل ومَفاعيل (مساجد، مصابيح).</p>\n<p><b>الجمع الشاذ</b> ما خالف القياس المطّرد، ومنه <b>«مصائب»</b> جمع «مصيبة»؛\nفالقياس في «فعيلة» المعتلة العين أن تُجمع على «مَفاعِل» بلا همز «مصاوب»،\nلكن العرب همزتها فقالوا «مصائب» فجاءت على خلاف القياس.</p>\n<p><b>جموع مطلوبة بأعيانها:</b> عندليب ← <b>عنادل</b> · سفرجل ← <b>سفارِج</b> · فرزدق ← <b>فرازِد/فرازِق</b>\n· جدار ← <b>جُدْران</b> · غار ← <b>أغوار/غِيران</b> · كبرى ← <b>كُبَر/كُبْرَيات</b>\n· قاضٍ ← <b>قُضاة</b> (تكسير) و<b>قاضون</b> (جمع مذكر سالم).</p>\n<p><b>قاعدة جمع الرباعي والخماسي:</b> ما زاد على أربعة أحرف يُحذف منه عند الجمع ما يُردّه إلى أربعة،\nولذلك صار «عندليب» ← «عنادل» بحذف الياء والباء، و«سفرجل» ← «سفارج» بحذف اللام.</p>\n"},{"t":"الاسم المقصور والمنقوص والممدود","b":"\n<ul>\n<li><b>المقصور:</b> اسم معرب آخره ألف لازمة — فتى، عصا، مستشفى. يُقدَّر عليه الإعراب كله.\nوعند جمعه جمع مذكر سالم تُحذف ألفه ويبقى ما قبلها مفتوحًا: مصطفى ← مصطفَوْن.</li>\n<li><b>المنقوص:</b> اسم معرب آخره ياء لازمة مكسور ما قبلها — القاضي، الداعي، الساعي.\nتُقدَّر عليه الضمة والكسرة وتظهر الفتحة. وعند جمعه جمع مذكر سالم <b>تُحذف ياؤه</b>\nويُضمّ ما قبلها في الرفع ويُكسر في النصب والجر: القاضي ← القاضُون / القاضِين.</li>\n<li><b>الممدود:</b> اسم معرب آخره همزة قبلها ألف زائدة — سماء، بناء، أصدقاء.</li>\n</ul>\n<p><b>تطبيق:</b> جمع «القاضي» جمعَ مذكر سالم هو <b>قاضون</b> في الرفع، و<b>قاضِين</b> في النصب والجر؛\nوله جمع تكسير هو <b>قُضاة</b>. وهذا هو مدار السؤال.</p>\n"},{"t":"التصغير وقواعده","b":"\n<p>للتصغير ثلاثة أوزان: <b>فُعَيْل</b> للثلاثي، و<b>فُعَيْعِل</b> للرباعي، و<b>فُعَيْعيل</b> لما قبل آخره حرف مدّ.</p>\n<p><b>قواعد عملية:</b> يُضمّ أول الاسم ويُفتح ثانيه وتُزاد ياء ساكنة ثالثة.\nوإذا كان في الكلمة حرف علة منقلب عن أصل <b>رُدّ إلى أصله</b> عند التصغير — وهذا مفتاح أكثر الأسئلة.</p>\n<table><tr><th>الكلمة</th><th>تصغيرها</th><th>التعليل</th></tr>\n<tr><td>ناب</td><td>نُيَيْب</td><td>أصل الألف ياء (أنياب) فرُدّت</td></tr>\n<tr><td>باب</td><td>بُوَيْب</td><td>أصل الألف واو (أبواب) فرُدّت</td></tr>\n<tr><td>قِيمة</td><td>قُوَيْمة</td><td>أصل الياء واو (من القَوْم/التقويم) فرُدّت</td></tr>\n<tr><td>دينار</td><td>دُنَيْنير</td><td>أصل الياء نون (دنانير) فرُدّت وهو على فُعَيعيل</td></tr>\n<tr><td>سفرجل</td><td>سُفَيْرِج</td><td>خماسي فيُحذف خامسه ويُصغَّر على فُعَيعِل</td></tr>\n<tr><td>آدم</td><td>أُوَيْدِم</td><td>المدّة أصلها همزتان، فرُدّت الثانية واوًا</td></tr>\n<tr><td>إبل</td><td>أُبَيْلة</td><td>اسم ثلاثي مؤنث تأنيثًا معنويًّا فتلحقه التاء</td></tr>\n</table>\n<p><b>فرقٌ يُسأل عنه:</b> النسب غير التصغير؛ فالنسب إلى «إبل» هو <b>إبِلِيّ</b>، وإلى «طيّ» هو <b>طَوَوِيّ</b>،\nبينما تصغير «طيّ» هو <b>طُوَيّ</b>.</p>\n"},{"t":"المشتقات السبعة","b":"\n<ol>\n<li><b>اسم الفاعل:</b> من الثلاثي على «فاعِل» (كاتب)، ومن غيره على وزن مضارعه بإبدال حرف المضارعة\nميمًا مضمومة وكسر ما قبل الآخر (مُجتهِد، مُستخرِج).</li>\n<li><b>اسم المفعول:</b> من الثلاثي على «مَفعول» (مكتوب)، ومن غيره كاسم الفاعل لكن بفتح ما قبل الآخر\n(مُستخرَج، مُكرَم).</li>\n<li><b>صيغ المبالغة:</b> خمس مشهورة — <b>فَعّال</b> (غفّار)، <b>مِفعال</b> (مِهذار)، <b>فَعول</b> (صَبور)،\n<b>فَعيل</b> (عليم)، <b>فَعِل</b> (حَذِر).</li>\n<li><b>الصفة المشبهة:</b> تدل على الثبوت والدوام — حسَن، كريم، أحمر، عطشان.</li>\n<li><b>اسم التفضيل:</b> على «أفعَل» ومؤنثه «فُعلى».</li>\n<li><b>اسما الزمان والمكان:</b> من الثلاثي على «مَفعَل» أو «مَفعِل»، ومن غيره على وزن اسم المفعول.</li>\n<li><b>اسم الآلة:</b> مِفعَل (مِبرَد)، مِفعال (مِفتاح)، مِفعَلة (مِكنَسة)، وجامدة كالسكين والقلم.</li>\n</ol>\n<p><b>ضبط «معرِض»:</b> في «زرتُ معرِض الكتاب» تُكسر الراء، لأنه <b>اسم مكان</b> من الفعل «عرَض يَعرِض»\nوهو مكسور العين في المضارع، وقاعدة اسم المكان من الثلاثي أن يأتي على «مَفعِل» إذا كان مضارعه\nمكسور العين. فيُقال: مَعرِض، مَجلِس، مَنزِل.</p>\n"},{"t":"المؤنث والمذكر وصيغة فَعلان","b":"\n<p>الوصف على وزن <b>«فَعْلان»</b> مؤنثه <b>«فَعْلى»</b> لا «فَعلانة»، وهو ممنوع من الصرف.\nفمؤنث <b>عطشان</b> هو <b>عطشى</b>، ومؤنث جوعان جَوْعى، وسكران سَكرى، وغضبان غَضبى.</p>\n<p>وأما الوصف على <b>«أفعَل»</b> فمؤنثه <b>«فَعلاء»</b>: أحمر/حمراء، أخضر/خضراء، أعرج/عرجاء —\nوهو ممنوع من الصرف أيضًا.</p>\n<p><b>علامات التأنيث ثلاث:</b> التاء المربوطة (فاطمة)، وألف التأنيث المقصورة (سلمى، ذكرى)،\nوألف التأنيث الممدودة (صحراء، حسناء).</p>\n"},{"t":"الإعلال والإبدال والإدغام","b":"\n<ul>\n<li><b>الإعلال:</b> تغيير يطرأ على حرف العلة بالقلب أو الحذف أو التسكين —\nقال (أصلها قَوَل)، يقوم/قُم، يَعِد (حُذفت الواو).</li>\n<li><b>الإبدال:</b> إحلال حرف مكان حرف — اصطبر (أصلها اصتبر، أُبدلت التاء طاءً).</li>\n<li><b>الإدغام:</b> إدخال حرف ساكن في متحرك من جنسه فيصيران حرفًا واحدًا مشدَّدًا — مدَّ، شدَّ.</li>\n<li><b>الإقلاب:</b> مصطلح تجويدي: قلب النون الساكنة أو التنوين ميمًا عند الباء — «أنبِئهم» تُنطق «أمبئهم».</li>\n</ul>\n<p><b>الحرف المشدَّد</b> هو حرفان من جنس واحد: <b>الأول ساكن والثاني متحرك، أُدغم الأول في الثاني\nفصارا حرفًا واحدًا مشدَّدًا</b>. وهذا هو التعريف الدقيق الذي يُسأل عنه.</p>\n<p><b>«ينبغي»</b> فيها <b>إقلاب</b>؛ لأن النون الساكنة جاء بعدها باء، فتُقلب النون ميمًا في النطق.</p>\n"},{"t":"تصريف الفعل وبناؤه للمجهول","b":"\n<p><b>بناء الماضي للمجهول:</b> يُضمّ أوله ويُكسر ما قبل آخره — كتب ← كُتِبَ، فَهِم ← فُهِمَ،\nاستخرج ← اسْتُخرِجَ، تعلّم ← تُعُلِّمَ (يُضمّ كل متحرك في أوله).</p>\n<p><b>بناء المضارع للمجهول:</b> يُضمّ أوله ويُفتح ما قبل آخره — يكتب ← يُكتَبُ، يستخرج ← يُستخرَجُ.</p>\n<p><b>الأجوف:</b> إذا بُني الماضي الأجوف للمجهول كُسر أوله وقُلبت ألفه ياءً — قال ← قِيلَ، باع ← بِيعَ.</p>\n<p><b>الأفعال الجامدة</b> هي التي لزمت صورة واحدة ولا يُشتق منها: ليس، عسى، نِعم، بئس، حبّذا،\nخلا وعدا وحاشا (في الاستثناء). وما عداها متصرف تامّ أو ناقص.</p>\n"}]},{"c":"imla","n":"الإملاء والرسم","q":[{"q":"«القرآن الكريم ثلاثون جزئًا» — ما الخطأ الإملائي؟","a":"الصواب: جزءًا","e":"الهمزة في «جزء» متطرفة وقبلها زاي ساكنة، والهمزة المتطرفة بعد ساكن تُرسم مفردة على السطر. ولمّا نُوّنت بالنصب ولم تسبقها ألفٌ وجبت زيادة ألف التنوين فصارت «جزءًا». وكتابتها «جزئًا» خطأ لأن النبرة إنما تُستعمل إذا كان ما قبل الهمزة مكسورًا أو ياءً ساكنة."},{"q":"غادرت الطائرة ........ (الضبط الصحيح رسمًا)","a":"مساءً","e":"الهمزة متطرفة بعد ألف مدّ، فتُرسم مفردة على السطر. والقاعدة أن الألف إذا سبقت الهمزة منعت زيادة ألف التنوين بعدها كراهية توالي ألفين؛ فنكتب: مساءً، نداءً، لواءً، اكتفاءً. وما يُكتب «مساءًا» أو «مساءاً» خطأ شائع لا وجه له في الرسم."},{"q":"أيّ الجمل فيها خطأ إملائي: أكرم ضيفك / احترم جارك / تجنب إغتياب الناس / استغفر ربك؟","a":"«تجنب إغتياب الناس» — والصواب: اغتياب","e":"«اغتياب» مصدر الفعل الخماسي «اغتابَ»، ومصدر الخماسي همزته همزة وصل تُرسم ألفًا عارية بلا علامة همزة. ودليلها أنك إذا وصلتها بما قبلها سقطت من النطق: «وَاغتياب». فكتابتها بهمزة القطع «إغتياب» خطأ."},{"q":"الهمزة في «اعتنِ بصحتك» همزة وصل لأنها في كلمة…","a":"أمر الخماسي","e":"«اعتنِ» أمر من «اعتنى يعتني» وهو فعل خماسي، وماضي الخماسي والسداسي وأمرهما ومصدرهما كلها همزتها وصل. وامتحنها بالواو: «واعتنِ» فتسقط الهمزة نطقًا، وهذا دليل الوصل القاطع."},{"q":"اختر الكلمة التي همزتها همزة وصل: استعمال / أحسن / إعطاء / العلم","a":"استعمال (و«العلم» وصل أيضًا لأنها أل التعريف)","e":"«استعمال» مصدر سداسي فهمزته وصل. و«أحسن» ماضٍ رباعي و«إعطاء» مصدر رباعي، وكلاهما قطع. وإذا وردت «العلم» في الخيارات فهمزتها وصل كذلك لأنها همزة «أل» التعريفية، وهي من مواضع الوصل المتفق عليها."},{"q":"كُتبت الهمزة على واو في «تفاؤل» لأنها جاءت…","a":"مضمومة بعد سكون صحيح (ألف ساكنة)","e":"نطبّق قاعدة الأقوى: الهمزة مضمومة وما قبلها ساكن. والضمة أقوى من السكون، ويناسب الضمةَ الواوُ، فكُتبت على واو. ومثلها: تضاؤل، تشاؤم، تثاؤب."},{"q":"كُتبت الهمزة على واو في «مؤمن» لأنها جاءت…","a":"ساكنة بعد ضم","e":"الهمزة في «مُؤمِن» ساكنة والميم قبلها مضمومة. والسكون أضعف الحركات، فتغلب الضمةُ ويُكتب على ما يناسبها وهو الواو. والقياس نفسه في: يُؤمن، مُؤتمر، يُؤدّي."},{"q":"الهمزة المكتوبة في كلمة «طارئ» نوعها…","a":"متطرفة","e":"لأنها وقعت في آخر الكلمة. وكُتبت على ياء لأن ما قبلها مكسور (الراء)، والهمزة المتطرفة تُكتب على حرف من جنس حركة ما قبلها. فإذا نُوّنت صارت «طارئًا» لأن ما قبلها متحرك."},{"q":"ترسم همزة «بَدءًا» على السطر في «حمدتُ الله بدءًا وانتهاءً» لأنها…","a":"متطرفة وما قبلها ساكن","e":"الدال قبل الهمزة ساكنة، والهمزة المتطرفة بعد الساكن تُرسم مفردة على السطر. ثم زِيدت ألف التنوين لأن الساكن قبلها حرف صحيح لا ألف. ولاحظ الفرق: «انتهاءً» بلا ألف لأن قبل همزتها ألف مدّ."},{"q":"أجبتُ عن جميع المسائل إلا ........ واحدة","a":"مسألة","e":"الهمزة متوسطة مفتوحة بعد سين ساكنة. والفتحة أقوى من السكون، ويناسبها الألف، فتُكتب «مسألة». وكتابتها «مسئلة» أو «مسؤلة» خطأ. وتنبّه إلى أن «مساءلة» كلمة أخرى معناها المحاسبة والاستجواب."},{"q":"تسامرنا ساعةً على ........ البحر","a":"شاطئ","e":"اسم مجرور بـ«على» وعلامة جره الكسرة، والهمزة متطرفة وما قبلها مكسور (الطاء)، فتُكتب على ياء مناسِبةً لجنس الكسرة. ولو نصبته لقلت «شاطئًا»، ولو رفعته لقلت «شاطئٌ» على الياء أيضًا لأن العبرة بحركة ما قبل الهمزة لا بحركتها."},{"q":"«... طالبُ العلم إلى المجد، و... إلى فعل الخير»","a":"سما، سعى","e":"«سما» من السُّمُوّ ومضارعه «يَسمو» فأصل ألفه واو فتُكتب قائمة. و«سعى» من السَّعْي ومضارعه «يَسعى» ومصدره «سعيًا» فأصل ألفه ياء فتُكتب مقصورة. وهذه هي طريقة الكشف عن أصل الألف اللينة في الأفعال."},{"q":"رحم الله امرأً فعل الخير و........ إليه","a":"دعا","e":"من «الدعوة» ومضارعه «يَدعو»، فأصل الألف واو فتُرسم قائمة: دعا. وكتابتها «دعى» خطأ؛ أما «دُعِيَ» بالبناء للمجهول فشيء آخر تدل عليه الحركات."},{"q":"يُعدّ الإمام أحمد من أبرز ........ الحديث","a":"رُواة","e":"جمع «راوٍ» على «رُواة» وهو جمع تكسير على وزن «فُعَلة»، وتاؤه مربوطة لأنه جمع تكسير لا ينتهي بتاء أصلية. و«روات» بالتاء المفتوحة خطأ، و«راويي» ليس من أبنية الجمع المسموعة هنا."},{"q":"تحذف همزة «ابن» إذا وقعت بين…","a":"علمين بينهما صفة الأبوة، متصلين بلا فاصل","e":"بشرط أن تكون مفردة واقعة صفةً لا خبرًا، وأن يكون الثاني أبًا للأول (أو لقبًا أو كنية)، ويُسكَّن ما قبلها ويُترك التنوين: محمدُ بنُ إسحاق. فإن كان الثاني جدًّا أثبتّ الهمزة: محمد ابن مالك."},{"q":"اختر الكتابة الصحيحة: معلمو المدرسة / معلموا المدرسة / معلمين المدرسة","a":"معلمو المدرسة","e":"«معلمو» جمع مذكر سالم مرفوع بالواو ومضاف، فحُذفت نونه للإضافة. والألف الفارقة إنما تُزاد بعد واو الجماعة في الأفعال لا بعد واو جمع المذكر السالم في الأسماء، فزيادتها هنا خطأ."},{"q":"واحدة من الجمل الآتية صحيحة: الطلاب يقرأون / يقرءون / يقرؤون / يقرئون","a":"الطلاب يقرؤون الدرس","e":"أصل الفعل «يقرأ»، فلما اتصلت به واو الجماعة صارت الهمزة متوسطة مضمومة بما بعدها، وقبلها ساكن؛ والضمة أقوى فرُسمت على واو: «يقرؤون». وهذه مسألة اطّردت في نظائرها: يبدؤون، يملؤون، يهزؤون."},{"q":"لحرف التاء شكلان؛ لماذا كُتبت التاء مربوطة في «فاطمة»؟","a":"لأنها جاءت في اسم مفرد مؤنث","e":"وهذا أول مواضع التاء المربوطة. وليس السبب مجرّد وقوعها في آخر الكلمة، بدليل أن «بنت» و«أخت» تاؤهما في الآخر وهي مفتوحة؛ ولا كونها من أصل الكلمة، لأن الأصلية تُكتب مفتوحة كما في «نبْت»."},{"q":"ما نوع «أل» في كلمة «الصيف»؟","a":"شمسية","e":"لأن الصاد من الحروف الشمسية الأربعة عشر (ت ث د ذ ر ز س ش ص ض ط ظ ل ن). ودليلها أن اللام تُكتب ولا تُنطق، ويأتي الحرف بعدها مشدَّدًا: الصَّيف. والقمرية عكسها: تُكتب وتُنطق ويأتي ما بعدها متحركًا مخفّفًا."},{"q":"ما دلالة النقط (…) الموضوعة بعد جملة في وسط النص؟","a":"حذف شيء من العبارة","e":"علامة الحذف ثلاث نقط تُوضع مكان كلام أسقطه الناقل، وهي توجّه القارئ إلى أن النص غير تامّ وأن له أصلًا يُرجع إليه. وليست دليلًا على اختصار بليغ ولا على بداية فقرة جديدة."},{"q":"جميع الجمل مشتملة على همزة قطع ما عدا…","a":"الكلمة التي همزتها «أل» التعريفية أو أمر الثلاثي","e":"الفيصل أن تضع واوًا قبل الكلمة: فإن سقطت الهمزة نطقًا فهي وصل. فـ«أعزّك» و«أدناني» و«أمير» همزاتها قطع، أما ما كان من «أل» أو من أمر الثلاثي (اكتبْ) أو من ماضي الخماسي والسداسي ومصدرهما فهمزته وصل."},{"q":"متى تُحذف النون من «مِن» و«عن»؟","a":"إذا دخلتا على «ما» أو «مَن»","e":"فتُدغم النون فيما بعدها: مِن ما ← مِمّا، عن ما ← عمّا، مِن مَن ← مِمَّن، عن مَن ← عمَّن. وهذا إدغامٌ واجب في الرسم والنطق معًا، وفصلُها خلاف المشهور في الكتابة المعاصرة."},{"q":"متى تُحذف النون من «إنْ» و«أنْ»؟","a":"إذا وقع بعدهما «ما» أو «لا»","e":"فتصير «إمّا» و«ألّا»، بشرط في «أنْ» أن تكون ناصبة للمضارع: «يسرّني ألّا تكذبَ». فإن لم تكن ناصبة وجب الفصل، كالمخففة من الثقيلة: «أشهد أن لا إله إلا الله»."},{"q":"أين تُزاد هاء السكت وجوبًا؟","a":"في فعل الأمر الذي بقي على حرف واحد","e":"لأن الكلمة لا يُبتدأ بها ويُوقف عليها وهي حرف واحد، فزِيدت الهاء لحمل الصوت: قِ ← قِهْ، عِ ← عِهْ، رَ ← رَهْ. فإذا اتصل الأمر بضمير استغنى عنها: قِها، عِهم."},{"q":"لماذا زِيدت الواو في «عَمرو»؟","a":"للتفريق بينه وبين «عُمَر» الممنوع من الصرف","e":"وشرطها أن يكون علمًا غير مضاف إلى ضمير ولا مصغَّر ولا محلًّى بـ«أل» ولا منصوب منوَّن. فتقول: عمرو بن العاص (رفعًا)، ومررتُ بعمرٍو (جرًّا)، ومدحتُ عَمرًا (نصبًا بلا واو لأن ألف التنوين أغنت عن الفرق)."}],"r":[{"t":"همزة الوصل وهمزة القطع — الفرق والضابط العملي","b":"\n<p><b>همزة الوصل</b> هي ألف تُنطق إذا ابتدأتَ بها الكلام، وتسقط من النطق إذا وصلتَ ما قبلها بها،\nولا تُكتب عليها علامة الهمزة أصلًا (تُرسم ألفًا عارية: <b>ا</b>). و<b>همزة القطع</b> تُنطق في الحالين:\nفي الابتداء وفي الوصل، وتُرسم بعلامة الهمزة فوق الألف (<b>أ</b>) إن كانت مفتوحة أو مضمومة،\nوتحتها (<b>إ</b>) إن كانت مكسورة.</p>\n<p><b>مواضع همزة الوصل محصورة، فاحفظها وما عداها قطع:</b></p>\n<ol>\n<li><b>الأسماء العشرة المسموعة:</b> اسم، است، ابن، ابنة، ابنُم، امرؤ، امرأة، اثنان، اثنتان، ايمُ الله (وايمن الله)،\nويلحق بها مثنّى هذه الأسماء.</li>\n<li><b>(أل) التعريفية بجميع أنواعها:</b> الرجل، العلم، الذي، التي.</li>\n<li><b>أمر الفعل الثلاثي:</b> اكتبْ، افهمْ، اجلسْ، اذهبْ.</li>\n<li><b>ماضي الخماسي والسداسي وأمرُهما ومصدرُهما:</b> انطلقَ / انطلقْ / انطلاقًا — استخرجَ / استخرجْ / استخراجًا.</li>\n</ol>\n<p><b>الحيلة العملية (طريقة الواو):</b> ضع واوًا أو فاءً قبل الكلمة ثم انطق. فإن اختفت الهمزة من النطق فهي وصل،\nوإن بقيت فهي قطع. قل: «واكتبْ» — سقطت، فهي وصل. وقل: «وأكرمَ» — بقيت، فهي قطع.</p>\n<p><b>تنبيه كثير الورود في الاختبارات:</b> «اعتنِ بصحتك» همزتها وصل لأن الفعل أمرٌ من الخماسي (اعتنى)،\nو«أحسنَ» همزتها قطع لأنه ماضٍ رباعي، و«إعطاء» قطع لأنه مصدر رباعي، و«استعمال» وصل لأنه مصدر سداسي.</p>\n"},{"t":"الهمزة المتطرفة — قاعدة واحدة تحكمها كلها","b":"\n<p>الهمزة المتطرفة هي التي تقع في <b>آخر</b> الكلمة. وحكمها لا ينظر إلى حركة الهمزة نفسها إطلاقًا،\nبل إلى <b>حركة الحرف الذي قبلها</b>:</p>\n<ul>\n<li>إن كان ما قبلها <b>ساكنًا</b> (حرفًا صحيحًا ساكنًا أو حرف مدّ) كُتبت <b>مفردة على السطر</b>:\nجزْء، ملْء، دفْء، شيْء، سماء، ضوء، بريء، قُروء.</li>\n<li>إن كان ما قبلها <b>متحركًا</b> كُتبت على حرف يناسب جنس تلك الحركة:\nبعد الفتح على ألف (قرَأ، نشَأ، ملجَأ)، وبعد الضم على واو (تهيُّؤ، لؤلُؤ، امرُؤ)،\nوبعد الكسر على ياء غير منقوطة (شاطِئ، قارِئ، مبتدِئ، متّكِئ).</li>\n</ul>\n<p><b>لهذا</b> نقول في الرفع: حضر امرُؤٌ (ضُمّت الراء فجاءت الهمزة على واو)،\nوفي النصب: رأيتُ امرَأً (فُتحت فجاءت على ألف)، وفي الجر: مررتُ بامرِئٍ (كُسرت فجاءت على ياء).\nوهذا هو سرّ كتابة «امرؤ القيس» بالواو.</p>\n<p><b>مسألة التنوين بالنصب على المتطرفة:</b> إذا نُوّنت الهمزة المتطرفة المسبوقة بألف\n<b>فلا تُزاد ألف بعدها</b>، لأن الألف السابقة تمنع: مساءً، نداءً، لواءً، اكتفاءً، شتاءً، جزاءً.\nأما إذا لم تسبقها ألف فتُزاد الألف وجوبًا: جزءًا، ضوءًا، بُرءًا، دفئًا، شيئًا.\nفـ«مساءً» صواب و«مساءًا/مساءاً» خطأ شائع.</p>\n"},{"t":"الهمزة المتوسطة — قاعدة الأقوى","b":"\n<p>القاعدة الحاكمة: <b>انظر إلى حركة الهمزة وحركة الحرف الذي قبلها، وخذ بالأقوى منهما، ثم اكتب الهمزة\nعلى ما يناسب الحركة الأقوى.</b> وترتيب الحركات في القوة: <b>الكسرة ← الضمة ← الفتحة ← السكون</b>.\nويناسب الكسرةَ الياءُ، والضمةَ الواوُ، والفتحةَ الألفُ، والسكونَ لا حرف له.</p>\n<table><tr><th>الأقوى</th><th>تُكتب على</th><th>أمثلة</th></tr>\n<tr><td>الكسرة</td><td>نَبِرة (ـئـ)</td><td>سُئِل، بِئر، سائِل، أسئِلة، رِئة، سيِّئة، طارِئة، فِئة</td></tr>\n<tr><td>الضمة</td><td>واو (ـؤـ)</td><td>مُؤمِن، يُؤَدّي، سُؤال، لُؤلُؤ، رُؤوس، تفاؤُل، تضاؤُل</td></tr>\n<tr><td>الفتحة</td><td>ألف (ـأـ)</td><td>سأَل، مسأَلة، يَأمُر، تَأدُّب، رَأس، نَشأَة</td></tr>\n<tr><td>السكون</td><td>—</td><td>لا يكون السكون أقوى أبدًا، فهو أضعف الأربعة</td></tr></table>\n<p><b>تطبيق:</b> «تفاؤُل»: الهمزة مضمومة وما قبلها ألف ساكنة؛ الضمة أقوى من السكون فكُتبت على واو.\n«مُؤمِن»: الهمزة ساكنة وما قبلها مضموم؛ الضمة أقوى فكُتبت على واو.\n«مَسؤول»: الهمزة مضمومة بعد ساكن صحيح وقبل واو مدّ، فرُسمت على واو ووُصل ما قبلها بما بعدها.</p>\n<p><b>الاستثناء المشهور:</b> إذا وقعت الهمزة <b>مفتوحة بعد ألف</b> كُتبت <b>مفردة على السطر</b>:\nتساءَل، تضاءَل، عباءَة، قراءَة، رداءَان. لأن كتابتها على ألف يؤدي إلى توالي ألفين.</p>\n"},{"t":"التاء المربوطة والتاء المفتوحة والهاء","b":"\n<p><b>الميزان الصوتي:</b> قف على الكلمة بالسكون. فإن نطقتها <b>هاءً</b> فهي <b>تاء مربوطة (ة)</b>،\nوإن بقيت <b>تاءً</b> فهي <b>تاء مفتوحة (ت)</b>. قل: «فاطمه» — نطقتها هاءً، إذن مربوطة.\nوقل: «بنتْ» — بقيت تاءً، إذن مفتوحة.</p>\n<p><b>مواضع المربوطة:</b> آخر الاسم المفرد المؤنث (زهرة، فاطمة، شجرة) — آخر جمع التكسير الذي لا ينتهي بتاء\nأصلية مفتوحة (قضاة، عُباقِرة، أساتذة) — صفة المذكر للمبالغة (علّامة، رحّالة، نسّابة) — وكلمة «ثَمّة»\nالظرفية بمعنى «هناك» تمييزًا لها عن «ثُمّت» حرف العطف.</p>\n<p><b>مواضع المفتوحة:</b> إذا كانت أصلية من بنية الاسم الثلاثي ساكن الوسط (بنْت/بنات، أخْت، بيْت،\nنبْت/نبات) — إذا سبقها واو أو ياء ساكنة (عفريت، جبروت، ملكوت) — آخر جمع المؤنث السالم\n(زهرات، معلمات، كرات) — إذا لحقت الفعل فاعلًا أو علامةَ تأنيث (كتبْتُ، شربْتَ، قالتْ، ذهبتْ).</p>\n<p><b>لماذا تُكتب تاء «فاطمة» مربوطة؟</b> لأنها اسم عَلَم <b>مفرد مؤنث</b>، وهذا هو الموضع الأول من مواضع\nالمربوطة؛ وليس السبب مجرد وقوعها آخر الكلمة، لأن «بنت» تاؤها آخر الكلمة أيضًا وهي مفتوحة.</p>\n"},{"t":"الألف اللينة في آخر الأسماء والأفعال","b":"\n<p>الألف اللينة ألف ساكنة مفتوح ما قبلها، تُرسم إما <b>قائمة (ا)</b> وإما <b>مقصورة (ى)</b>.</p>\n<p><b>في الأفعال:</b> تُرسم قائمة إن كان أصلها واوًا، ومقصورة إن كان أصلها ياءً.\nو<b>طريقة الكشف</b> ثلاث: (1) هات المضارع — دنا/يَدنو (واو) فتُكتب «دنا»، هدى/يَهدي (ياء) فتُكتب «هدى».\n(2) هات المصدر — عفا/عفوًا، سعى/سعيًا. (3) أسندِ الفعل إلى ضمير رفع متحرك —\nعزا/عزَوْتُ (واو)، رمى/رمَيْتُ (ياء).</p>\n<p><b>في الأسماء:</b> الثلاثي يُردّ إلى أصله بالتثنية أو الجمع: عصا/عصَوان (واو) فتُكتب قائمة،\nفتى/فتَيان (ياء) فتُكتب مقصورة، نَدى/نَديان، ربا/ربوة.\nوما زاد على ثلاثة أحرف فألفه <b>مقصورة</b> مطلقًا: مستشفى، مصطفى، دعوى، نجوى، سلوى، كبرى.</p>\n<p><b>استثناءان مهمان:</b> (1) إن سُبقت الألف بياء كُتبت <b>قائمة</b> منعًا لتوالي الياءين: دنيا، سجايا، رزايا، خطايا —\nإلا عَلَم «يحيى» فيُكتب بالياء تمييزًا له عن الفعل «يحيا».\n(2) الأسماء الأعجمية غالبًا تُكتب بالألف القائمة: فرنسا، أمريكا، زكريا، موسيقا — وشذّ ما استقرّ بالياء:\nموسى، عيسى، كسرى، بخارى.</p>\n<p><b>تطبيق سؤال شائع:</b> «... طالبُ العلم إلى المجد، و... إلى فعل الخير» الصواب: <b>سما، سعى</b>؛\nلأن «سما» من السُّمُوّ (يَسمو) فأصلها واو، و«سعى» من السَّعْي (يَسعى) فأصلها ياء.</p>\n"},{"t":"الألف الفارقة ومواضع زيادة الألف وحذفها","b":"\n<p><b>الألف الفارقة</b> ألف تُزاد بعد واو الجماعة في آخر الفعل للتفريق بينها وبين الواو الأصلية:\nكتبوا، اجتهدوا، لم يذهبوا. وتُحذف في أربعة مواضع:</p>\n<ul>\n<li>إذا كانت الواو <b>أصلية</b> من بنية الفعل: يدعو، يرجو، يَشكو، يَسمو — فلا ألف.</li>\n<li>إذا اتصل بالفعل <b>ضمير</b>: عاونوهم، ساعدوني، كرّموه.</li>\n<li>إذا كانت الواو <b>علامة رفع</b> في الأفعال الخمسة ثبتت نونها: المؤمنون يسعَوْن (النون مانعة).</li>\n<li>إذا كانت واو <b>جمع المذكر السالم</b> لا واو جماعة: معلمو المدرسة، مهندسو الشركة —\nولهذا فإن «معلموا المدرسة» خطأ شائع، والصواب <b>معلمو المدرسة</b>.</li>\n</ul>\n<p><b>زيادة الواو:</b> تُزاد في «أولى، أولاء، أولئك، أولو، أولات» للتفريق بينها وبين «إلى، إليك».\nوتُزاد في «عمرو» للتفريق بينه وبين «عمر» الممنوع من الصرف، بشرط أن يكون علمًا غير مضاف ولا مصغّر\nولا محلًّى بـ«أل» ولا منصوبًا منوّنًا؛ فتقول: عمرو بن العاص، ومدحتُ عَمرًا (بلا واو في النصب).</p>\n<p><b>حذف ألف (أل):</b> تُحذف ألف «أل» إذا سبقتها <b>لام الجر</b> فقط: الوالد ← للوالد، القلم ← للقلم.\nوإذا بدأ الاسم بلام حُذفت «أل» كلها: اللبن ← للبن، اللغة ← للغة. ولا تُحذف مع بقية حروف الجر:\nبالعقيدة، كالبنيان، فالمسلمون.</p>\n"},{"t":"همزة ابن — متى تُحذف ومتى تثبت","b":"\n<p>الأصل <b>إثبات</b> همزة «ابن»، والحذف استثناء مشروط.</p>\n<p><b>تُحذف</b> إذا اجتمعت ثلاثة شروط معًا: أن تكون <b>مفردة</b> (لا مثناة ولا مجموعة)،\nوأن تقع <b>بين علمين</b> متصلين بلا فاصل، وأن تكون <b>صفةً</b> للأول لا خبرًا، والعلم الثاني أبٌ له\n(أو لقب أو كنية). مثل: محمد بن إسحاق، معاوية بن أبي سفيان.\nويجب في هذه الحال <b>تسكين الباء</b> وترك تنوين الاسم الذي قبلها.</p>\n<p><b>وتثبت</b> في خمسة مواضع: إذا وقعت <b>خبرًا</b> (محمدٌ ابنُ خالدٍ — أي: هو ابنه) —\nإذا لم يتقدمها <b>عَلَم</b> (كان ابن جنّي لغويًّا) — إذا وقعت في <b>أول السطر</b> أو آخره —\nإذا فُصل بينها وبين العلم بفاصل — إذا كان العلم الثاني <b>جدًّا</b> لا أبًا (محمد ابن مالك).</p>\n<p><b>الفرق الدقيق:</b> «زهيرٌ ابنُ خالدٍ» بالتنوين وإثبات الهمزة إخبارٌ بالنسب،\nو«زهيرُ بنُ خالدٍ» بلا تنوين وبحذف الهمزة وصفٌ وتعريف. وتُعامل «ابنة» معاملة «ابن» بالشروط نفسها،\nويجوز كتابتها «بنت» بالتاء المفتوحة: هند بنت خليل.</p>\n"},{"t":"اللام الشمسية واللام القمرية","b":"\n<p>«أل» التعريف لامها واحدة في الكتابة، مختلفة في النطق:</p>\n<ul>\n<li><b>القمرية:</b> <b>تُكتب وتُلفظ</b>، ويأتي الحرف بعدها متحركًا غير مشدَّد، وتكون اللام ساكنة.\nحروفها أربعة عشر مجموعة في قولك: <b>«ابغِ حجَّك وخَفْ عقيمَه»</b> (أ ب غ ح ج ك و خ ف ع ق ي م هـ).\nمثل: القمر، البيت، الكتاب، الملعب.</li>\n<li><b>الشمسية:</b> <b>تُكتب ولا تُلفظ</b>، ويأتي الحرف بعدها <b>مشدَّدًا</b> لإدغام اللام فيه.\nحروفها الأربعة عشر الباقية: ت ث د ذ ر ز س ش ص ض ط ظ ل ن.\nمثل: الشَّمس، الرَّجل، السَّجادة، الثَّعلب، النَّور، الصَّيف.</li>\n</ul>\n<p>وسُميت شمسية وقمرية لأن كلمة «الشمس» تمثل الأولى و«القمر» تمثل الثانية.\nوفي سؤال «الصيف» تكون اللام <b>شمسية</b> لأن الصاد من الحروف الشمسية والدليل تشديدها في النطق: الصَّيف.</p>\n"},{"t":"الحروف التي تُكتب ولا تُلفظ والتي تُلفظ ولا تُكتب","b":"\n<p><b>تُكتب ولا تُلفظ:</b></p>\n<ul>\n<li>ألف «مائة» ومركّباتها: مائة، مائتان، ثلاثمائة… وتُحذف في الجمع: مئون، مئات.\nوقد أجاز المحدثون كتابتها «مئة» مطلقًا لزوال اللبس بالنقط.</li>\n<li>الألف الفارقة بعد واو الجماعة: كتبوا، ذهبوا.</li>\n<li>واو «أولئك، أولى، أولاء، أولو، أولات، عمرو».</li>\n<li>ألف «أنا» في الوصل.</li>\n</ul>\n<p><b>تُلفظ ولا تُكتب:</b></p>\n<ul>\n<li>ألف أسماء الإشارة بعد هاء التنبيه: هذا، هذه، هؤلاء (وتُكتب في: هاتان، ها هنا).</li>\n<li>ألف أسماء الإشارة مع لام البعد: ذلك، ذلكم، ذلكن.</li>\n<li>اللام الثانية في الموصول: الذي، التي، الذين (وتُكتب في المثنى: اللذان، اللتان، وفي: اللاتي، اللواتي).</li>\n<li>ألف: لكن، طه، إسحق، هرون، الرحمن، يس، السموات، ثلث.</li>\n</ul>\n"},{"t":"حذف النون وهاء السكت","b":"\n<p><b>حذف النون من «من» و«عن»:</b> إذا دخلتا على «ما» أو «مَن» أُدغمتا: مِن ما ← مِمّا،\nعن ما ← عمّا، مِن مَن ← مِمَّن، عن مَن ← عمَّن.</p>\n<p><b>حذف النون من «إنْ» و«أنْ»:</b> تُحذف إذا وقع بعدهما «ما» أو «لا»: إنْ ما ← إمّا،\nأنْ لا ← ألّا (بشرط أن تكون «أنْ» ناصبة للمضارع: يسرّني ألّا تكذبَ).\nفإن لم تكن ناصبة وجب الفصل: «أشهد أن لا إله إلا الله»، «علمتُ أن لا أحدَ بالدار».</p>\n<p><b>هاء السكت:</b> هاء ساكنة تُزاد لبيان الحركة أو لحمل الصوت، ومن مواضعها فعل الأمر الذي بقي\nعلى حرف واحد: وَقى ← قِ ← <b>قِهْ</b>، وعى ← عِ ← <b>عِهْ</b>، رأى ← رَ ← <b>رَهْ</b>.\nوتُحذف إذا اتصل الأمر بضمير: قِها، عِهم.\nومن مواضعها «ما» الاستفهامية إذا سُبقت بحرف جر فحُذفت ألفها: علامَ تجلس؟ إلامَ تذهب؟ حتّامَ تسهر؟\nفإذا وقفتَ عليها قلت: علامَهْ؟ إلامَهْ؟</p>\n"},{"t":"علامات الترقيم ووظائفها","b":"\n<table><tr><th>العلامة</th><th>موضعها</th><th>مثال</th></tr>\n<tr><td>الفاصلة (،)</td><td>بين الجمل القصيرة المتعاطفة وبعد المنادى، ووقفتها خفيفة</td><td>يا باغيَ الخير، أقبلْ.</td></tr>\n<tr><td>الفاصلة المنقوطة (؛)</td><td>بين جملتين إحداهما سبب للأخرى، أو بين جمل طويلة</td><td>اجتهدَ؛ فنجحَ.</td></tr>\n<tr><td>النقطة (.)</td><td>نهاية الجملة التامة المعنى</td><td>خيرُ الناس أنفعُهم للناس.</td></tr>\n<tr><td>النقطتان (:)</td><td>قبل القول المنقول أو التعداد أو التوضيح</td><td>قال الشاعر: …</td></tr>\n<tr><td>الاستفهام (؟)</td><td>بعد صيغة السؤال</td><td>ما مهنتُك؟</td></tr>\n<tr><td>التعجب (!)</td><td>بعد التعجب أو الفرح أو الحزن أو الدعاء</td><td>ما أجملَ الربيعَ!</td></tr>\n<tr><td>الحذف (…)</td><td>مكان كلام محذوف من النص</td><td>وقف في الساحة … ثم أنشد.</td></tr>\n<tr><td>التنصيص (« »)</td><td>يُحصر بينهما كلام منقول بنصّه</td><td>قال: «لا ضررَ ولا ضِرار».</td></tr>\n<tr><td>الشرطتان (— —)</td><td>حول الجملة الاعتراضية</td><td>إني — والحمد لله — بخير.</td></tr>\n<tr><td>المعكوفتان ([ ])</td><td>زيادة من الناقل ليست من النص</td><td>قال [أي الجاحظ]…</td></tr></table>\n<p><b>نقطة امتحانية:</b> النقط الثلاث في وسط النص تدل على <b>حذف شيء من العبارة</b>، لا على نهاية الفقرة\nولا على جودة العبارة.</p>\n"},{"t":"أنواع ترتيب الحروف العربية","b":"\n<ul>\n<li><b>الترتيب الهجائي:</b> تسعة وعشرون حرفًا رتّبها نصر بن عاصم الليثي على أساس تشابه الأشكال\nوتجانس الرسم. فائدته تيسير تعلّم الحرف، وترتيب المعاجم الحديثة أبوابًا وفصولًا، وترتيب الأسماء في القوائم.</li>\n<li><b>الترتيب الأبجدي:</b> منسوب إلى السامِيّين، مجموع في: أبجد، هوّز، حطّي، كلمن، سعفص، قرشت،\nثم الروادف التي انفردت بها العربية: ثخذ، ضظغ. وفائدته استعماله رموزًا عدديةً (حساب الجُمَّل)\nوترتيب العبارات بدل الأرقام.</li>\n<li><b>الترتيب الصوتي (العَيني):</b> وضعه الخليل بن أحمد الفراهيدي لمعجم «العين»، وبناه على\n<b>مخارج الحروف</b> من أقصى الحلق إلى الشفتين. وفائدته إعانة الدارس على معرفة المخرج والنطق الصحيح،\nونفعه لعلماء التجويد.</li>\n</ul>\n"}]},{"c":"bala","n":"البلاغة","q":[{"q":"عرّف البلاغة","a":"مطابقة الكلام لمقتضى الحال مع فصاحته","e":"فلا يكفي أن يكون اللفظ فصيحًا سليمًا، بل لا بد أن يوافق حال المخاطب ومقامه. ولهذا كان كل بليغ فصيحًا وليس كل فصيح بليغًا، لأن البلاغة تشترط الفصاحة وتزيد."},{"q":"عرّف علم المعاني","a":"علم يُعرف به أحوال اللفظ العربي التي بها يطابق مقتضى الحال","e":"ومباحثه الخبر والإنشاء والقصر والفصل والوصل والإيجاز والإطناب والتقديم والتأخير. فمداره على تأليف الجملة وما يعرض لها من أحوال تناسب المقام."},{"q":"عرّف علم البيان","a":"علم يُعرف به إيراد المعنى الواحد بطرق مختلفة في وضوح الدلالة عليه","e":"فالمعنى واحد والطرق متعددة: تشبيه ومجاز واستعارة وكناية، وتتفاوت هذه الطرق في درجة الوضوح وقوة الأثر."},{"q":"عرّف علم البديع","a":"علم يُعرف به وجوه تحسين الكلام بعد مطابقته لمقتضى الحال ووضوح دلالته","e":"فهو علم تابع لا متبوع؛ لأن التحسين إنما يُلتفت إليه بعد سلامة التأليف ووضوح الدلالة، وإلا كان زخرفًا على بناء مائل."},{"q":"«كل بليغ فصيح وليس كل فصيح بليغًا» — صح أم خطأ؟","a":"صح","e":"لأن الفصاحة شرط في البلاغة وجزء من حدّها، فكل بليغ لا بد أن يكون فصيحًا. وقد يكون الكلام فصيح الألفاظ لكنه لا يطابق مقتضى الحال فلا يكون بليغًا."},{"q":"كم أضرب الخبر؟","a":"ثلاثة","e":"ابتدائي لخالي الذهن بلا مؤكد، وطلبي للمتردد بمؤكد واحد، وإنكاري للمنكر بمؤكدين فأكثر. والمعوّل في اختيار الضرب على حال المخاطب لا على رغبة المتكلم."},{"q":"«فالخيلُ والليلُ والبيداءُ تعرفني» — الغرض البلاغي من الخبر","a":"الفخر","e":"فالمتنبي لم يقصد إفادة السامع بخبر يجهله، بل خرج الخبر عن أصله إلى غرض بلاغي هو التفاخر بشهرته وبسالته. وقرينة ذلك تعداد مظانّ الفروسية والكتابة معًا."},{"q":"«ألا ليت الشبابَ يعودُ يومًا» — الغرض البلاغي","a":"التمني","e":"لأن «ليت» موضوعة لطلب المحبوب المستحيل أو البعيد المنال، وعودة الشباب مستحيلة عادةً. ولو كان الأمر ممكنًا متوقعًا لاستُعملت «لعلّ» للترجي."},{"q":"«ألا أيها الليل الطويل ألا انجلِ» — الغرض من النداء","a":"التحسّر والأسى (مع الاستبطاء)","e":"لأن المنادى هنا ليس عاقلًا يُطلب إقباله، فخرج النداء عن أصله إلى إظهار الشكوى واستطالة الليل. وهذا من أشهر مواضع خروج النداء عن معناه الحقيقي."},{"q":"«يا درّةً نُزعت من تاج والدها» — الغرض من النداء","a":"الأسى والتحسّر","e":"لأن المنادى ميّت لا يُرجى إقباله، فتعيّن أن يكون النداء لإظهار الحسرة ورثاء الفقيد. والاستعارة في تسميتها «درّة» تضاعف أثر الحزن."},{"q":"«يا لجمال النيل!» — النداء يفيد","a":"التعجب","e":"لأن المنادى معنًى لا يُنادى حقيقةً، فتعيّن خروج النداء إلى التعجب والإعجاب. وهذا أسلوب يُسمى نداء التعجب وتكثر فيه اللام المفتوحة."},{"q":"خرج الأمر في «قل تمتّعوا فإن مصيركم إلى النار» إلى معنى","a":"التهديد","e":"لأن سياق الآية وعيد لا إذن، والقرينة ختمها ببيان المصير إلى النار. فالأمر هنا صورة ظاهرها الإباحة وباطنها الزجر والإنذار."},{"q":"«أليس اللهُ بكافٍ عبدَه» — الأسلوب يفيد","a":"التقرير","e":"لأن الاستفهام خرج عن طلب الفهم إلى حمل المخاطب على الإقرار بأمر مستقرٍّ في نفسه. وعلامة الاستفهام التقريري أن الجواب يكون بالإثبات لا بالنفي."},{"q":"ما نوع القصر في «إنني أنا الله لا إله إلا أنا»؟","a":"قصر إفراد","e":"لأنه ردٌّ على من اعتقد الشِّركة في الألوهية، فقُصرت الألوهية على الله وحده وأُفرد بها. وطريقه النفي والاستثناء، وهو أقوى طرق القصر."},{"q":"«ربِّ اغفر لي ولوالديَّ ولمن دخل بيتي مؤمنًا وللمؤمنين والمؤمنات» — نوع الإطناب","a":"ذكر العام بعد الخاص","e":"لأنه بدأ بالخاص (نفسه ووالديه ومن دخل بيته) ثم عمّم بذكر المؤمنين والمؤمنات. وفائدته الاهتمام بالخاص أولًا ثم إفادة الشمول والعموم ثانيًا."},{"q":"نوع التشبيه في: «النخلة لا تنبت في الأرض السبخة كالكلمة الطيبة لا تنمو في النفوس المريضة»","a":"تشبيه تمثيلي","e":"لأن وجه الشبه صورة منتزعة من متعدد: امتناعُ النماء لفساد المحلّ لا لنقص في النامي. وكل تشبيه كان وجهه هيئةً مركبة لا وصفًا مفردًا فهو تمثيلي."},{"q":"نوع التشبيه في: «ومن يكُ ذا فمٍ مُرٍّ مريضٍ ... يجد مرًّا به الماءَ الزلالا»","a":"تشبيه ضمني","e":"لأن الشاعر لم يصرّح بالمشبه والمشبه به في صورة التشبيه المعروفة، بل ألمح إليهما في سياق المعنى. وغرضه إثبات أن إنكار فضله راجع إلى فساد حاسّة المنكر لا إلى نقص فيه."},{"q":"عرّف التشبيه المؤكَّد","a":"ما حُذفت منه أداة التشبيه","e":"ويقابله المرسل الذي ذُكرت أداته. وسُمّي مؤكدًا لأن حذف الأداة يُشعر بأن المشبه عين المشبه به ادّعاءً فيقوى التشبيه."},{"q":"ما التشبيه الذي ذُكرت فيه الأركان كلها؟","a":"التشبيه المرسل المفصَّل","e":"لأن «المرسل» ما ذُكرت أداته، و«المفصَّل» ما ذُكر وجه شبهه؛ فإذا اجتمعا مع الطرفين تمّت الأركان الأربعة. وضدّه التشبيه البليغ الذي حُذفت أداته ووجهه معًا."},{"q":"غرض التشبيه في «ثوبُ أحمدَ أبيضُ كاللبن»","a":"بيان مقدار حال المشبَّه","e":"لأن بياض الثوب معلوم مقرَّر قبل التشبيه، فلم يأتِ التشبيه لبيان أصل الحال بل لتحديد درجته ومبلغه. ولو كان الوصف مجهولًا لكان الغرض بيان الحال."},{"q":"«يُخرجهم من الظلمات إلى النور» — الوجه البلاغي","a":"استعارة تصريحية","e":"لأنه صرّح بلفظ المشبه به «الظلمات والنور» وحذف المشبه وهو الضلال والهدى. والقرينة أن الكلام في الإيمان والكفر لا في الضوء الحسّي."},{"q":"«اصغت آذانُ المجد إليك» — نوع الاستعارة","a":"مكنية","e":"لأنه شبّه المجد بإنسان له أذن يسمع بها، ثم حذف المشبه به ورمز له بلازم من لوازمه وهو «الآذان» و«الإصغاء». وكل تشخيص لمعنوي على هذا النحو فهو مكنية."},{"q":"«واشتعل الرأسُ شيبًا» — اللون البياني","a":"استعارة مكنية","e":"شبّه الشيب بالنار في انتشاره وسرعة أخذه، ثم حذف المشبه به ورمز له بلازمه وهو «الاشتعال». وتفيد الاستعارة هنا الشمول والسرعة معًا."},{"q":"«بل نقذف بالحق على الباطل فيدمغه» — نوع الاستعارة","a":"استعارة تبعية","e":"لأنها جرت في الفعل «نقذف» لا في اسم جامد؛ فشُبّه إبطال الباطل بالحق برمي الجسم الثقيل على الشيء فيهشمه. والاستعارة إذا كانت في فعل أو مشتق أو حرف سُمّيت تبعية."},{"q":"«إني أراني أعصر خمرًا» — اللون البياني","a":"مجاز مرسل علاقته اعتبار ما سيكون","e":"لأن المعصور عنبٌ لا خمر، وإنما سُمّي باسم ما سيؤول إليه. وهذا من علاقات المجاز المرسل المشهورة، وقرينته أن العصر لا يقع على الخمر."},{"q":"«يجعلون أصابعهم في آذانهم» — اللون البياني","a":"مجاز مرسل علاقته الجزئية","e":"لأن المُدخَل في الأذن أطراف الأصابع أو الأنامل لا الأصبع كلها، فذُكر الكل وأُريد الجزء — وهي علاقة الكلية؛ ومن عبّر بأن الأصابع جزء من الكفّ جعلها جزئية. والمدار على ما تُحدده الخيارات."},{"q":"«نجوتُ وقد بلّ المرادي سيفه ... من ابن أبي شيخِ الأباطح طالبِ» — اللون البياني","a":"مجاز مرسل علاقته المحلية","e":"لأن «الأباطح» موضعٌ أُريد به أهله الساكنون فيه، فذُكر المحلّ وأُريد الحالّ. والقرينة أن السيادة إنما تكون للناس لا للبطحاء."},{"q":"«ولا تجعل يدك مغلولة إلى عنقك» — اللون البياني","a":"كناية عن صفة البخل","e":"لأن غلّ اليد إلى العنق لازمه الامتناع عن العطاء، فأُريد اللازم. وتمام الآية نهيٌ عن بسط اليد كل البسط وهو كناية عن الإسراف، فاجتمع ذمّ الطرفين."},{"q":"«الطاعم الكاسي» في بيت الحطيئة — ما نوعه؟","a":"مجاز عقلي علاقته المفعولية","e":"لأنه أسند اسم الفاعل إلى من هو مفعول في المعنى: فالرجل مَطعوم مَكسوّ لا طاعم ولا كاسٍ. والغرض من ذلك تصوير عجزه وتهكّمه به."},{"q":"«أشدّاء على الكفار رحماء بينهم» — نوع المحسّن","a":"طباق إيجاب","e":"لأنه جمع بين معنيين متضادين: الشدة والرحمة، وكلاهما مثبت. والطباق يُسمى سلبًا إذا جُمع بين فعل مثبت ومنفي من مادة واحدة."},{"q":"«الظلمات والنور» — نوع المحسّن","a":"طباق","e":"لأنه جمع بين الشيء وضدّه. وهو طباق إيجاب لأن اللفظين مثبتان مختلفا المادة، ويزيد الكلام حسنًا لأن الضدّ يُظهر حُسنه الضدُّ."},{"q":"«فليضحكوا قليلًا وليبكوا كثيرًا» — نوع المحسّن","a":"مقابلة","e":"لأنه أتى بمعنيين (الضحك والقِلّة) ثم بما يقابلهما على الترتيب (البكاء والكثرة). والفرق بينها وبين الطباق أن الطباق بين لفظين والمقابلة بين أكثر على الترتيب."},{"q":"«إن الأبرار لفي نعيم وإن الفُجّار لفي جحيم» — نوع المحسّن","a":"ترصيع","e":"لأن ألفاظ الفقرة الأولى توازنت مع نظائرها في الفقرة الثانية وزنًا ورويًّا: الأبرار/الفجّار، نعيم/جحيم. وهو من المحسنات اللفظية التي تقوم على التوازن الصوتي."},{"q":"عرّف المشاكلة","a":"ذكر الشيء بلفظ غيره لوقوعه في صحبته","e":"تحقيقًا أو تقديرًا. ومثالها التعبير عن جزاء النسيان بلفظ النسيان نفسه في قوله «نسوا الله فنسيهم»، فالثاني مجاز عن الترك جاء مشاكلًا للأول في اللفظ."},{"q":"«ألا لا يجهلنْ أحدٌ علينا ... فنجهلَ فوق جهل الجاهلينا» — المحسّن البديعي","a":"مشاكلة","e":"لأن الجهل الثاني ليس سفهًا حقيقيًّا بل مجازاةٌ على السفه، فعبّر عنه بلفظ الأول لوقوعه في صحبته. وهذا هو جوهر المشاكلة: مطابقة اللفظ للفظ مع اختلاف المعنى."},{"q":"عرّف التورية","a":"لفظ له معنيان: قريب ظاهر غير مراد، وبعيد خفيّ هو المراد","e":"ولا بد معها من قرينة خفية تُشير إلى البعيد وتسمى الإيهام. وسُمّيت تورية لأن المتكلم يستر المعنى المقصود خلف معنى أقرب إلى الذهن."},{"q":"ما التورية المجرَّدة؟","a":"ما لم يُذكر فيها ما يلائم المعنى القريب ولا المعنى البعيد","e":"فهي مجرّدة من اللوازم كلها. ويقابلها المرشَّحة التي يُذكر معها ما يلائم القريب، والمبيَّنة التي يُذكر معها ما يلائم البعيد."},{"q":"عرّف الطباق","a":"الجمع بين الشيء وضده في الكلام","e":"وهو نوعان: طباق إيجاب إذا كان اللفظان مثبتين مختلفي المادة، وطباق سلب إذا جُمع بين فعل مثبت وآخر منفي من المادة نفسها."},{"q":"عرّف المبالغة ومَن قسّمها؟","a":"ادّعاء بلوغ الوصف حدًّا مستبعَدًا أو مستحيلًا — وقسّمها السكاكي","e":"إلى تبليغ: ما كان ممكنًا عقلًا وعادةً؛ وإغراق: ما كان م
