ما كُتب في بابه في التراث العربي.","d":["الوليد بن عبيد البحتري، لُقّب بـ«شاعر الحسن»، وأشهر ما يُستشهد له سينيّته في إيوان كسرى","مجاز مرسل علاقته الكلّية، أُطلق الكلُّ وأُريد الجزء","أوّل كتابٍ جامع في النحو العربي، وهو أوثق مصادر الشواهد وأقدمها"]},{"q":"مَن مبتدِعُ فنّ المقامة؟ ومَن بلغ به الغاية؟","a":"بديع الزمان الهمذاني مبتدِعها، والحريريُّ بلغ به الغاية","e":"والمقامة حكايةٌ قصيرة مسجوعة لها راوٍ وبطلٌ متكدٍّ، وهي أقربُ ما في التراث إلى القصّة القصيرة، وغلب عليها التأنّق اللفظي.","d":["امرؤ القيس، على البحر الطويل، والشاهد جزم «نبكِ» في جواب الأمر","مسكين الدارمي، والشاهد نصب «أخاك» على الإغراء بفعلٍ محذوف","مجاز مرسل علاقته الكلّية، أُطلق الكلُّ وأُريد الجزء"]},{"q":"«الكتاب» لسيبويه — بمَ يُعرف؟ وما منزلته في الشواهد؟","a":"أوّل كتابٍ جامع في النحو العربي، وهو أوثق مصادر الشواهد وأقدمها","e":"وسُمّي «قرآن النحو» لجلالته، وفيه قرابة ألفٍ ومئة بيتٍ من الشواهد، كثيرٌ منها لا يُعرف قائله، وعليه مدارُ النحو البصري.","d":["إلى منتصف القرن الثاني في الأمصار، وإلى آخر الرابع في البوادي","الرفع على الابتداء والخبر محذوف، أو على تقدير التأخير عن تمام الخبر","مدرسة نقدية قام عليها العقاد والمازني وشكري، ونشأت من كتابٍ في نقد شوقي"]},{"q":"ما الفرق بين الشاهد والمثال والدليل عند النحاة؟","a":"الشاهد كلامٌ عربيّ موثوق يُحتجّ به، والمثال ما يصنعه النحوي للتوضيح، والدليل ما يُبنى عليه الحكم كالسماع والقياس","e":"فالمثالُ لا يُثبت قاعدة لأنه من صنع الشارح، والشاهدُ يُثبتها لأنه من كلام من يُحتجّ بعربيّته، وهذا فرقٌ منهجيٌّ يُسأل عنه.","d":["رفع «كلُّه» على الابتداء مع إرادة العموم، وهو شاهدٌ على أنّ النفي إذا تأخّر عن «كلّ» توجّه إلى الشمول","النصب بالعطف على محلّ «رءوسكم» أو على «أيديكم»، وقُرئ بالجرّ على اللفظ","إشباع فتحة الياء في «مواليا» ضرورةً، والأصل «موالٍ»"]},{"q":"إلى متى يُحتجّ بكلام العرب؟ ولماذا حُدّ هذا الحدّ؟","a":"إلى منتصف القرن الثاني في الأمصار، وإلى آخر الرابع في البوادي","e":"لأن اللسان فسد في الأمصار بالاختلاط ودخول العجمة، وبقي في البوادي سليمًا زمنًا أطول، فحُدّ زمنُ الاحتجاج بحسب سلامة اللسان.","d":["بديع الزمان الهمذاني مبتدِعها، والحريريُّ بلغ به الغاية","أوّل كتابٍ جامع في النحو العربي، وهو أوثق مصادر الشواهد وأقدمها","امرؤ القيس، على البحر الطويل، والشاهد جزم «نبكِ» في جواب الأمر"]}],"r":[{"t":"بطاقة الاختبار الثاني — ولماذا أُفرد الشواهد بباب","b":"\n<p>البطاقة الثانية في الدوّارة هي نفسُ الأولى نصًّا، وعليها وسمُ «(نسخة)»،\nوشارتاها: <b>«اختبارات التخصص»</b> و<b>«٤٠ سؤال»</b>. ولمّا كان عنوانها يجمع شيئين —\n«الأسئلة الأكثر تكرارًا» و«الشواهد النحوية والنصوص» — جعلتُ الأولَ اختبارًا\nوالثانيَ اختبارًا، فصارا أربعين وأربعين، وهو أنفع من تكرار البطاقة كما هي.</p>\n\n<p><b>ولمَ كان بابُ الشواهد مَظِنّةَ السقوط؟</b> لأن الطالب يحفظ القاعدة مجرَّدةً\nثم يُسأل عن بيتٍ فلا يعرف موضعه منها. والشاهد في اصطلاح النحاة:\n<b>ما يُستدلّ به على ثبوت قاعدةٍ في لغة العرب</b>، وشرطُه أن يكون قرآنًا أو قراءةً\nأو حديثًا أو كلامًا لعربيٍّ موثوقٍ بعربيّته. وقد حدّ النحاة زمنَ الاحتجاج\nبسنة ١٥٠ للهجرة في الأمصار وبعدها بقليلٍ في البوادي، فما جاء بعد ذلك\nلا يُحتجّ به وإن حَسُن.</p>\n\n<p><b>السؤال في الامتحان يقع على ثلاثة أوجه:</b> مَن القائل؟ وأين موضع الشاهد؟\nوما وجهُ الاستشهاد؟ والثالثُ أهمُّها وأكثرُها دورانًا، وهو الذي يُفرِّق بين\nمن حفظ البيت ومن فهمه. فاحفظ <b>وجه الاستشهاد</b> قبل أن تحفظ القائل.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الشاهد غير المثال</b> — الشاهد كلامٌ عربيّ موثوق يُحتجّ به على إثبات قاعدة، والمثال ما يصنعه النحويّ للإيضاح. فالمثال لا يُثبت حكمًا لأنه من صنع الشارح، والشاهد يُثبته لأنه من كلام من تُقبل عربيّته.</li><li><b>زمن الاحتجاج محدود</b> — إلى منتصف القرن الثاني في الأمصار، وإلى آخر الرابع في البوادي. وعلّةُ التحديد فسادُ اللسان بالاختلاط، لا تفضيلُ زمنٍ على زمن. ولهذا لا يُحتجّ بشعر المتنبي في النحو وإن كان حجّةً في البلاغة.</li><li><b>وجه الاستشهاد أهمّ من القائل</b> — السؤال في الامتحان يقع على «لماذا استُشهد بالبيت؟» أكثرَ مما يقع على «من قائله؟». فإن ضاق وقتك فاحفظ الوجه ودع الاسم.</li><li><b>مَوضع الشاهد هو موضع المخالفة</b> — لا يُستشهد على المطّرد، وإنما على ما خالف الظاهر: مرفوعٌ في موضع نصب، أو مجرورٌ بلا حرف جرّ، أو محذوفٌ عائدُه. فابحث في البيت عن الشاذّ تجد الشاهد.</li><li><b>تعدُّد الأوجه ليس عيبًا</b> — كثيرٌ من الشواهد فيه وجهان أو ثلاثة عند النحاة. فاذكر الوجه المشهور الذي بُني عليه السؤال، وأشِر إلى الآخر إن اتّسع المقام؛ فالإشارة إليه دليلُ تمكُّن لا تردُّد.</li><li><b>كلُّ ما في هذا الباب ملكٌ عامّ</b> — القرآن وشعرُ المتقدّمين، وقد نُسب كلُّ بيتٍ إلى قائله. ولم يُنقل شيءٌ من بنوك الأسئلة المغلقة، فالصياغة والتعليل أصليّان.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الكتاب لسيبويه · خزانة الأدب للبغدادي · شرح شواهد المغني للسيوطي · الإنصاف في مسائل الخلاف · الدر المصون</p></div>"},{"t":"كيف تُجيب عن سؤال الشاهد في ثلاث خطوات","b":"\n<ol>\n<li><b>عيِّن الكلمة المشكِلة</b> في البيت — وهي غالبًا كلمةٌ خالفت ظاهرَ القاعدة:\nاسمٌ مرفوع في موضع نصب، أو مجرورٌ بلا حرف جرّ، أو فعلٌ مجزوم بلا جازم ظاهر.\nفالمخالفةُ هي مَوضع الشاهد دائمًا، إذ لا يُستشهد على الموافق المطّرد.</li>\n\n<li><b>سمِّ الحكم</b> — أي قل: هذا جرٌّ على الجوار، أو نصبٌ على نزع الخافض،\nأو رفعٌ على الابتداء، أو حذفٌ للعائد. والتسمية نصفُ الجواب.</li>\n\n<li><b>علِّل</b> — وهذا تمامُ الجواب: لماذا جاز هذا؟ وما الذي سوَّغه؟\nفإن قيل «لمَ نُصب؟» فلا تقل «لأنه منصوب»، بل اذكر العامل أو الضرورة أو اللغة.</li>\n</ol>\n\n<p><b>تنبيهٌ منهجيّ:</b> كثيرٌ من الشواهد وردت فيها أوجهٌ متعدّدة عند النحاة،\nفإذا سُئلت فاذكر الوجه المشهور الذي بُني عليه السؤال، ولا يضرُّك أن تُشير\nإلى الوجه الآخر، فإنّ الإشارة إليه دليلُ تمكُّن لا تردُّد.\nوجميع الشواهد المذكورة هنا من القرآن ومن شعر المتقدّمين، وهي ملكٌ عامّ،\nوقد نُسب كلُّ بيتٍ إلى قائله.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>لا تُعلِّل الحكم بالحكم</b> — إذا سُئلت «لمَ نُصب؟» فلا تقل «لأنه منصوب» ولا «لأنه مفعول». بل اذكر <b>العامل</b>: نصبه كذا، أو نُصب على الاختصاص، أو على نزع الخافض. والتعليل بالحكم نفسه أشهرُ أخطاء الطلاب.</li><li><b>فرّق بين الضرورة واللغة</b> — ما خالف القياس في الشعر قد يكون ضرورةً خاصّة بالشاعر، وقد يكون لغةً لقبيلة. فصرفُ الممنوع ضرورة، وإلزامُ المثنّى الألفَ لغةُ بني الحارث. والخلطُ بينهما يُفسد الجواب.</li><li><b>الجرّ على الجوار سماعيّ</b> — كما في «جُحرِ ضبٍّ خربٍ»، فلا يُقاس عليه عند الجمهور. فإن سُئلت عنه فسمِّه ولا تجعله قاعدةً مطّردة.</li><li><b>احذر توجيه الآية بما يُفسد المعنى</b> — الإعراب خادمٌ للمعنى لا حاكمٌ عليه، وقد ردّ النحاة وجوهًا صناعيةً صحيحة لأنها تُفضي إلى معنًى لا يليق بالتنزيل. وهذه قاعدةٌ كبرى في إعراب القرآن.</li><li><b>اربط الشاهد بالقاعدة لا بالبيت</b> — فبيتُ «أخاك أخاك» ليس محفوظًا لذاته، بل لأنه بابُ الإغراء والتوكيد اللفظي. فإذا نسيتَ البيت وحفظتَ البابَ أجبتَ، وإذا حفظتَ البيت ونسيتَ البابَ لم تُجب.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: خزانة الأدب · شرح شواهد المغني · الخصائص لابن جني · ضرائر الشعر لابن عصفور · الدر المصون</p></div>"}]},{"c":"ex3","n":"٣· محاكي تنظيم وإدارة","q":[{"q":"ما علامات إعراب الاسم المفرد؟","a":"يُرفع بالضمة ويُنصب بالفتحة ويُجرّ بالكسرة","e":"وهذه هي العلامات الأصلية، وسُمّيت أصليةً لأنها الأكثرُ دورانًا ولأن غيرها نائبٌ عنها عند تعذّرها في المثنى والجموع.","d":["في «المعلّم» قمرية، وفي «الطالب» شمسية","واسعُ الخُلُق، نشيطٌ إلى فعل المعروف","لأنها متطرفة وما قبلها ساكن"]},{"q":"بمَ يُرفع جمع المذكر السالم؟ وبمَ يُنصب ويُجرّ؟","a":"يُرفع بالواو، ويُنصب ويُجرّ بالياء","e":"لأن الحروف نابت عن الحركات في هذا الجمع، والواوُ من جنس الضمة والياءُ من جنس الكسرة، فالنيابة جاءت على مناسبةٍ صوتية.","d":["مساجد — لأنها على صيغة منتهى الجموع","في «المعلّم» قمرية، وفي «الطالب» شمسية","السكون، وحُذفت ألفه الأصلية لالتقاء الساكنين"]},{"q":"بمَ يُنصب جمع المؤنث السالم؟ ولماذا؟","a":"يُنصب بالكسرة نيابةً عن الفتحة","e":"حملًا له على جمع المذكر السالم في مخالفة الأصل، وكراهةَ اجتماع الألف والتاء مع الفتحة، فحُمل النصب على الجرّ في هذا الباب.","d":["في «المعلّم» قمرية، وفي «الطالب» شمسية","مساجد — لأنها على صيغة منتهى الجموع","الفعلية: فعل وفاعل. والاسمية: مبتدأ وخبر"]},{"q":"بمَ يُرفع المثنى؟ وبمَ يُنصب ويُجرّ؟","a":"يُرفع بالألف، ويُنصب ويُجرّ بالياء","e":"والألفُ نابت عن الضمة والياءُ عن الفتحة والكسرة، فاكتفى المثنّى بعلامتين عن ثلاث، وهذا من تخفيف العربية في الفروع.","d":["العذراء المنقطعة عن الرجال","في «المعلّم» قمرية، وفي «الطالب» شمسية","عُوفِيَ — وهو ماضٍ مبنيّ للمجهول"]},{"q":"«الطالبان مجتهدان» — أعرب الكلمتين.","a":"الطالبان مبتدأ مرفوع بالألف لأنه مثنى، ومجتهدان خبر مرفوع بالألف لأنه مثنى","e":"فالعلامة واحدة في المبتدأ والخبر لاتّفاقهما في الرفع والتثنية، وهذا يكشف أنّ العلامة تابعةٌ للصيغة لا للموقع.","d":["المهندسون ماهرون — لأن الأولى مبتدأ والثانية خبر، وكلاهما مرفوع بالواو","مفردٌ منصوب","متران — نائب فاعل مرفوع وعلامة رفعه الألف لأنه مثنى"]},{"q":"«المهندسون ماهرون» أم «المهندسين ماهرين»؟ ولماذا؟","a":"المهندسون ماهرون — لأن الأولى مبتدأ والثانية خبر، وكلاهما مرفوع بالواو","e":"والخطأ الشائع أن تُستعمل الياء في موضع الرفع لأنها أخفُّ على اللسان، وهو لحنٌ ظاهر يُسأل عنه كثيرًا في هذا المحور.","d":["متران — نائب فاعل مرفوع وعلامة رفعه الألف لأنه مثنى","مفردٌ منصوب","الطالبان مبتدأ مرفوع بالألف لأنه مثنى، ومجتهدان خبر مرفوع بالألف لأنه مثنى"]},{"q":"«بِيعَ ... قماشٍ» — أيّهما الصواب: متران أم مترين؟","a":"متران — نائب فاعل مرفوع وعلامة رفعه الألف لأنه مثنى","e":"لأن الفعل مبنيّ للمجهول فما بعده نائبُ فاعل، وحقُّه الرفع، فتعيّنت الألف لأنه مثنّى، بخلاف «اشتريتُ مترين» فإنه مفعول به.","d":["فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه السكون","المهندسون ماهرون — لأن الأولى مبتدأ والثانية خبر، وكلاهما مرفوع بالواو","الطالبان مبتدأ مرفوع بالألف لأنه مثنى، ومجتهدان خبر مرفوع بالألف لأنه مثنى"]},{"q":"ما الفرق بين النون في «يعملون» والنون في «يعملن»؟","a":"الأولى علامة رفعٍ للأفعال الخمسة، والثانية ضمير فاعل مبنيّ","e":"فالأولى حرفٌ يزول بالنصب والجزم، والثانية اسمٌ لا يزول لأنه الفاعل نفسه، والفعل معها مبنيّ على السكون لا معرب.","d":["ترفع المبتدأ ويُسمّى اسمها، وتنصب الخبر ويُسمّى خبرها","«مُقِيت» بالضمّ: المقتدر. و«مَقِيت» بالفتح: البغيض","تعمل عمل «إنّ»، وشرطها أن يكون اسمها نكرةً متّصلًا بها غيرَ مفصول"]},{"q":"ما العمل الذي تقوم به «كان وأخواتها»؟","a":"ترفع المبتدأ ويُسمّى اسمها، وتنصب الخبر ويُسمّى خبرها","e":"لأنها أفعال ناقصة لا تدلّ على حدث، فاحتاجت إلى اسمٍ وخبر تتمُّ بهما الفائدة، وعملُها عكسُ عمل الحروف الناسخة.","d":["«اتقِ» ألف وصل لأنه أمر من خماسيّ، و«أتقِن» همزة قطع لأنه أمر من رباعيّ","كلّ جمع تكسير بعد ألفه حرفان أو ثلاثةٌ أوسطها ساكن، ومُنعت لأنها فرعٌ في الجمع وفي الصيغة","الشائن: القبيح المُخجِل. والماجن: الهازل القليل الحياء"]},{"q":"ما العمل الذي تقوم به «إنّ وأخواتها»؟","a":"تنصب المبتدأ ويُسمّى اسمها، وترفع الخبر ويُسمّى خبرها","e":"وهي حروفٌ مشبَّهة بالفعل لأنها على ثلاثة أحرف فأكثر ومبنيّة على الفتح وتدلّ على معنى الفعل، فأُعطيت عملًا شبيهًا بعمله مقلوبًا.","d":["القانع: الراضي بما قُسم له. والدامس: الشديد الظلام","لأنها همزة متوسطة مفتوحة وما قبلها مضموم، والضمة أقوى من الفتحة","«اتقِ» ألف وصل لأنه أمر من خماسيّ، و«أتقِن» همزة قطع لأنه أمر من رباعيّ"]},{"q":"ما الفرق بين «إنّ» المكسورة و«أنْ» الناصبة؟","a":"المكسورة حرف ناسخ يدخل على الجملة الاسمية، و«أنْ» حرف مصدري ونصب يدخل على الفعل المضارع","e":"فالأولى تعمل في الأسماء والثانية في الأفعال، والثانيةُ تُسبك مع ما بعدها بمصدر، نحو «يسرّني أن تنجح» أي «نجاحُك».","d":["الشائن: القبيح المُخجِل. والماجن: الهازل القليل الحياء","القانع: الراضي بما قُسم له. والدامس: الشديد الظلام","لأنه تمييز للعدد المعطوف، وحكمه الإفراد والنصب"]},{"q":"ما الذي تعمله «لا» النافية للجنس؟ وما شروط إعمالها؟","a":"تعمل عمل «إنّ»، وشرطها أن يكون اسمها نكرةً متّصلًا بها غيرَ مفصول","e":"وسُمّيت نافيةً للجنس لأنها تستغرق النفيَ في جميع أفراد الجنس، فلا تحتمل الإثبات في بعضها، بخلاف «لا» العاملة عمل «ليس».","d":["القانع: الراضي بما قُسم له. والدامس: الشديد الظلام","كلّ جمع تكسير بعد ألفه حرفان أو ثلاثةٌ أوسطها ساكن، ومُنعت لأنها فرعٌ في الجمع وفي الصيغة","لأنه تمييز للعدد المعطوف، وحكمه الإفراد والنصب"]},{"q":"«لعلّ الله يُحدِث بعد ذلك أمرًا» — ما نوع خبر «لعلّ»؟","a":"جملة فعلية","e":"لأن الخبر جاء فعلًا مع فاعله، والخبرُ يأتي مفردًا وجملةً اسمية وفعلية وشبهَ جملة، والعبرةُ بما يسدّ مسدَّ الإخبار.","d":["علامة التعجّب","جائز التقديم","تضادّ (طباق)"]},{"q":"«السعادة هي العملُ على تقبُّل الآخرين» — ما نوع الخبر؟","a":"جملة اسمية","e":"لأن «هي العمل» مبتدأ وخبر، وقد وقعت الجملة كلُّها خبرًا عن «السعادة»، والرابطُ هو الضمير «هي» العائد على المبتدأ.","d":["جملة فعلية","النقطتان الرأسيتان","جائز التقديم"]},{"q":"ما أركان الجملة الفعلية؟ وما أركان الاسمية؟","a":"الفعلية: فعل وفاعل. والاسمية: مبتدأ وخبر","e":"والفاعلُ عمدةٌ لا يُحذف، وكذلك المبتدأ والخبر، وما عداهما فضلاتٌ يصحّ الكلام بدونها وإن فات بها بعضُ المعنى.","d":["لأنها متطرفة وما قبلها ساكن","أعزّة أُباة، أصحاب عزّةٍ وأنفة","يُرفع بالضمة ويُنصب بالفتحة ويُجرّ بالكسرة"]},{"q":"«ممنوعٌ التدخينُ» — ما حكم تقديم الخبر هنا؟","a":"جائز التقديم","e":"لأن المبتدأ «التدخين» معرفة والخبر «ممنوع» نكرة، فلا يقع لبسٌ في تمييز أحدهما من الآخر، والتقديمُ لغرض الاهتمام.","d":["تضادّ (طباق)","جملة اسمية","متكبّر متعجرف"]},{"q":"متى يُبنى الفعل المضارع على السكون؟","a":"إذا اتصلت به نون النسوة، نحو «الطالباتُ يكتبْنَ»","e":"لأن نون النسوة ضميرُ رفعٍ متّصل، والفعل مع ضمير الرفع المتصل يُشبه الماضيَ فيُبنى، وهذا أحد موضعَي بناء المضارع.","d":["الإجلال: التعظيم والتبجيل. و«يحنث»: يُخلِف وعدَه وينقض يمينه","«اتقِ» ألف وصل لأنه أمر من خماسيّ، و«أتقِن» همزة قطع لأنه أمر من رباعيّ","لأنها همزة متوسطة مفتوحة وما قبلها مضموم، والضمة أقوى من الفتحة"]},{"q":"متى يُبنى الفعل المضارع على الفتح؟","a":"إذا اتصلت به نون التوكيد مباشرةً، نحو «واللهِ لأفعلنَّ الخير»","e":"لأن نون التوكيد ركّبت نفسها مع الفعل تركيبًا صار به كالكلمة الواحدة، فأشبه المبنيَّ فبُني على الفتح لخفّتها.","d":["المكسورة حرف ناسخ يدخل على الجملة الاسمية، و«أنْ» حرف مصدري ونصب يدخل على الفعل المضارع","لأنه تمييز للعدد المعطوف، وحكمه الإفراد والنصب","إذا اتصلت به نون النسوة، نحو «الطالباتُ يكتبْنَ»"]},{"q":"ما أدوات نصب الفعل المضارع؟","a":"أنْ، لن، كي، إذن، ولام التعليل","e":"وما عداها فالنصبُ فيه بـ«أن» مضمرةً وجوبًا أو جوازًا، كلام الجحود وفاءِ السببية وواوِ المعية وحتّى، فليست ناصبةً بنفسها.","d":["السكون، وحُذفت ألفه الأصلية لالتقاء الساكنين","يُرفع بالواو، ويُنصب ويُجرّ بالياء","دائمٌ أبديّ لا ينقطع"]},{"q":"«لا تُهمِلْ واجباتِك» — أعرب «تهمل».","a":"فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه السكون","e":"والفرق بين «لا» الناهية والنافية أنّ الناهية تجزم وتطلب الكفّ، والنافيةَ لا تعمل وإنما تُخبر بانتفاء الفعل.","d":["المهندسون ماهرون — لأن الأولى مبتدأ والثانية خبر، وكلاهما مرفوع بالواو","الطالبان مبتدأ مرفوع بالألف لأنه مثنى، ومجتهدان خبر مرفوع بالألف لأنه مثنى","مفردٌ منصوب"]},{"q":"«لم يَنَلْ» — ما علامة جزم «ينل»؟ ولماذا؟","a":"السكون، وحُذفت ألفه الأصلية لالتقاء الساكنين","e":"فأصله «ينال»، فلمّا جُزم سكنت اللام فالتقى ساكنان: الألف واللام، فحُذفت الألف، وهذا غير علامة الجزم نفسها.","d":["الشرطتان، لأن الجملة بينهما اعتراضية","أنْ، لن، كي، إذن، ولام التعليل","كذّابٌ مبالغ في الكذب"]},{"q":"ما الفعل من «مُعافى»؟ وما وزنه؟","a":"عُوفِيَ — وهو ماضٍ مبنيّ للمجهول","e":"و«معافى» اسم مفعولٍ من الفعل الرباعيّ «عافى»، واسمُ المفعول من غير الثلاثي يُصاغ على وزن مضارعه بإبدال حرف المضارعة ميمًا مضمومة وفتح ما قبل الآخر.","d":["في «المعلّم» قمرية، وفي «الطالب» شمسية","الشرطتان، لأن الجملة بينهما اعتراضية","يُنصب بالكسرة نيابةً عن الفتحة"]},{"q":"ما الأمر من الفعل «وَقى»؟","a":"قِ","e":"لأن الأمر يُبنى على ما يُجزم به مضارعُه، ومضارعه «يَقي» يُجزم بحذف الياء، ثم تُحذف الواو لوقوعها بين ياء وكسرة، فلم يبقَ إلا القاف.","d":["عِبئًا","ترادف","تسعٌ وسبعون طالبةً"]},{"q":"ما صيغة منتهى الجموع؟ ولماذا مُنعت من الصرف؟","a":"كلّ جمع تكسير بعد ألفه حرفان أو ثلاثةٌ أوسطها ساكن، ومُنعت لأنها فرعٌ في الجمع وفي الصيغة","e":"مثل مساجد ومدارس ومفاتيح ومحاريب وأساور، واجتماعُ الفرعيّتين فيها جعلها تُشبه الفعل فمُنعت التنوينَ والجرّ بالكسرة.","d":["المكسورة حرف ناسخ يدخل على الجملة الاسمية، و«أنْ» حرف مصدري ونصب يدخل على الفعل المضارع","إذا اتصلت به نون النسوة، نحو «الطالباتُ يكتبْنَ»","الإجلال: التعظيم والتبجيل. و«يحنث»: يُخلِف وعدَه وينقض يمينه"]},{"q":"اختر الممنوع من الصرف: مساجد / كتاب / قلم. ولماذا؟","a":"مساجد — لأنها على صيغة منتهى الجموع","e":"وباقي الكلمات أسماء ثلاثية مصروفة لا علّة فيها، والعلّةُ هنا واحدةٌ كافية لأن صيغة منتهى الجموع تقوم مقام علّتين.","d":["مساجد","كتاب","قلم. ولماذا"]},{"q":"ما تمييز العدد ٢٨؟","a":"مفردٌ منصوب","e":"لأنه من الأعداد المعطوفة الواقعة بين أحد عشر وتسعة وتسعين، وكلُّها تمييزها مفردٌ منصوب، بخلاف المئة فتمييزها مفردٌ مجرور.","d":["متران — نائب فاعل مرفوع وعلامة رفعه الألف لأنه مثنى","فعل مضارع مجزوم بـ«لا» الناهية وعلامة جزمه السكون","متكبّر متعجرف"]},{"q":"«خمسة وعشرون غوّاصًا» — لماذا نُصب «غوّاصًا» ولم يُجمع؟","a":"لأنه تمييز للعدد المعطوف، وحكمه الإفراد والنصب","e":"والخطأ الشائع جمعُه قياسًا على المعنى، والعربيةُ لا تنظر هنا إلى المعنى بل إلى الصناعة، فالعدد الكثير تمييزُه مفرد.","d":["كلّ جمع تكسير بعد ألفه حرفان أو ثلاثةٌ أوسطها ساكن، ومُنعت لأنها فرعٌ في الجمع وفي الصيغة","لأنها أمرٌ من فعلٍ ثلاثيّ، وأمرُ الثلاثي همزتُه وصل","ترفع المبتدأ ويُسمّى اسمها، وتنصب الخبر ويُسمّى خبرها"]},{"q":"«٧٩ طالبة» — اكتبها بالحروف.","a":"تسعٌ وسبعون طالبةً","e":"فتُجرَّد «تسع» من التاء لأن المعدود مؤنث، ويبقى لفظ العقد «سبعون» على حاله لأنه لا يتأثّر بتذكير المعدود ولا تأنيثه.","d":["النقطتان الرأسيتان","جائز التقديم","فاسدٌ متغيّرُ الرائحة"]},{"q":"لماذا رُسمت الهمزة على الواو في «فؤاد»؟","a":"لأنها همزة متوسطة مفتوحة وما قبلها مضموم، والضمة أقوى من الفتحة","e":"فيُنظر في المتوسطة إلى أقوى الحركتين: حركتِها وحركةِ ما قبلها، وترتيبُ القوّة: الكسرة ثم الضمة ثم الفتحة ثم السكون.","d":["إذا اتصلت به نون التوكيد مباشرةً، نحو «واللهِ لأفعلنَّ الخير»","لأنها أمرٌ من فعلٍ ثلاثيّ، وأمرُ الثلاثي همزتُه وصل","إذا اتصلت به نون النسوة، نحو «الطالباتُ يكتبْنَ»"]},{"q":"في أيّ حالةٍ لا تُكتب الهمزة المتوسطة على الألف؟","a":"إذا كانت مضمومة وما قبلها مفتوح، فتُكتب على الواو","e":"لأن الضمة أقوى من الفتحة فتغلبها، وأما إذا كانت مفتوحةً وما قبلها مفتوح أو ساكن، أو ساكنةً وما قبلها مفتوح، فتُكتب على الألف.","d":["لأنها همزة متوسطة مفتوحة وما قبلها مضموم، والضمة أقوى من الفتحة","كلّ جمع تكسير بعد ألفه حرفان أو ثلاثةٌ أوسطها ساكن، ومُنعت لأنها فرعٌ في الجمع وفي الصيغة","القانع: الراضي بما قُسم له. والدامس: الشديد الظلام"]},{"q":"لماذا كُتبت همزة «عبء» على السطر؟","a":"لأنها متطرفة وما قبلها ساكن","e":"والساكن لا حركة له تُناسب حرفًا من حروف العلّة، فبقيت الهمزة مفردةً على السطر، وهذا هو الضابط في «جزء، دفء، بطء».","d":["ألف وصل، لأنها من الأسماء العشرة المسموعة","في «المعلّم» قمرية، وفي «الطالب» شمسية","يُرفع بالألف، ويُنصب ويُجرّ بالياء"]},{"q":"كيف يُنوَّن «عبء» في حالة النصب؟","a":"عِبئًا","e":"لأن التنوين حرَّك ما قبل الهمزة بالفتح فصارت متوسّطةً حكمًا، والمتوسطةُ المفتوحة بعد ساكنٍ صحيح تُكتب على نبرةٍ إذا أمكن الوصل.","d":["القلم","ترادف","قِ"]},{"q":"«ايم الله» — همزة قطع أم ألف وصل؟","a":"ألف وصل، لأنها من الأسماء العشرة المسموعة","e":"وهي: ابن، ابنة، اسم، است، امرؤ، امرأة، اثنان، اثنتان، ايمُ الله، ايمُنُ الله. وما عداها من الأسماء فهمزتُه قطع.","d":["عاقلٌ جيّد الرأي، محكمُ العقل","أنْ، لن، كي، إذن، ولام التعليل","عُوفِيَ — وهو ماضٍ مبنيّ للمجهول"]},{"q":"«اقرأ» — لماذا بُدئت بألف وصل؟","a":"لأنها أمرٌ من فعلٍ ثلاثيّ، وأمرُ الثلاثي همزتُه وصل","e":"وضابطُ ألف الوصل في الأفعال: أمرُ الثلاثي، وماضي الخماسي والسداسي وأمرُهما ومصدرُهما. وما عداه فهمزةُ قطع.","d":["كلّ جمع تكسير بعد ألفه حرفان أو ثلاثةٌ أوسطها ساكن، ومُنعت لأنها فرعٌ في الجمع وفي الصيغة","إذا اتصلت به نون النسوة، نحو «الطالباتُ يكتبْنَ»","الشائن: القبيح المُخجِل. والماجن: الهازل القليل الحياء"]},{"q":"«اتقِ الله وأَتقِن عملك» — ما نوع الهمزة في كلٍّ منهما؟","a":"«اتقِ» ألف وصل لأنه أمر من خماسيّ، و«أتقِن» همزة قطع لأنه أمر من رباعيّ","e":"فالخماسيُّ «اتّقى» همزتُه وصل، والرباعيُّ «أتقن» همزتُه قطع، والفارقُ عددُ حروف الماضي لا صورةُ الأمر.","d":["كلّ جمع تكسير بعد ألفه حرفان أو ثلاثةٌ أوسطها ساكن، ومُنعت لأنها فرعٌ في الجمع وفي الصيغة","الشائن: القبيح المُخجِل. والماجن: الهازل القليل الحياء","لأنها همزة متوسطة مفتوحة وما قبلها مضموم، والضمة أقوى من الفتحة"]},{"q":"ما علامة الترقيم المناسبة بعد «قال المعلم»؟","a":"النقطتان الرأسيتان","e":"لأنهما تُوضعان قبل القول المحكيّ وقبل التفصيل بعد الإجمال وقبل التعداد، فهما علامةُ ما يأتي بعدهما مفسِّرًا لما قبلهما.","d":["جملة فعلية","تضادّ (طباق)","متكبّر متعجرف"]},{"q":"«محمد أخي ... وفّقه الله ... متفوّقٌ في دراسته» — ما العلامة المناسبة؟","a":"الشرطتان، لأن الجملة بينهما اعتراضية","e":"والشرطة تُوضع في أول الجملة الاعتراضية وآخرها لتفصلها عمّا قبلها وبعدها، فتبقى الجملة الأصلية متّصلةَ المعنى.","d":["واسعُ الخُلُق، نشيطٌ إلى فعل المعروف","لأنها متطرفة وما قبلها ساكن","عاقلٌ جيّد الرأي، محكمُ العقل"]},{"q":"«ما أجملَ السماء» — ما علامة الترقيم؟ ولماذا؟","a":"علامة التعجّب","e":"لأن الأسلوب تعجّبٌ قياسيّ على وزن «ما أفعلَه»، وعلامةُ التعجّب تُوضع بعد التعجّب والدعاء والإغراء والتحذير والمدح والذمّ.","d":["تسعٌ وسبعون طالبةً","متكبّر متعجرف","تضادّ (طباق)"]},{"q":"ما نوع اللام في «المعلّم» وفي «الطالب»؟","a":"في «المعلّم» قمرية، وفي «الطالب» شمسية","e":"لأن الميم من الحروف القمرية فتُنطق اللام ظاهرةً، والطاءُ من الشمسية فتُدغم فيها اللام وتُشدَّد، والميزانُ النطقُ لا الرسم.","d":["السكون، وحُذفت ألفه الأصلية لالتقاء الساكنين","عاقلٌ جيّد الرأي، محكمُ العقل","ألف وصل، لأنها من الأسماء العشرة المسموعة"]},{"q":"ما معنى «شُمّ العرانين»؟","a":"أعزّة أُباة، أصحاب عزّةٍ وأنفة","e":"والعِرنين أصلُ الأنف، والشَّمَمُ ارتفاعُه، فكُنّي بارتفاع الأنف عن العزّة والإباء، وهي كنايةٌ عن صفةٍ جرت مجرى المثل.","d":["مساجد — لأنها على صيغة منتهى الجموع","العذراء المنقطعة عن الرجال","كذّابٌ مبالغ في الكذب"]},{"q":"ما معنى «البتول»؟","a":"العذراء المنقطعة عن الرجال","e":"وأصل البَتْل القطعُ، ومنه «تبتَّل إليه تبتيلًا» أي انقطع للعبادة، فالوصفُ راجعٌ إلى معنى الانقطاع في مادّة اللفظ.","d":["يُرفع بالألف، ويُنصب ويُجرّ بالياء","دائمٌ أبديّ لا ينقطع","يُرفع بالضمة ويُنصب بالفتحة ويُجرّ بالكسرة"]},{"q":"ما معنى «حصيف»؟","a":"عاقلٌ جيّد الرأي، محكمُ العقل","e":"وأصله من إحصاف الأمر أي إحكامه، فالحصيفُ من أُحكم عقلُه فلا يتسرّب إليه الخلل، وهذا أدقُّ من ترجمته بـ«ذكي».","d":["يُنصب بالكسرة نيابةً عن الفتحة","كذّابٌ مبالغ في الكذب","يُرفع بالضمة ويُنصب بالفتحة ويُجرّ بالكسرة"]},{"q":"ما معنى «سرمديّ»؟","a":"دائمٌ أبديّ لا ينقطع","e":"والسَّرمد في اللغة دوامُ الزمان المتّصل الذي لا يتخلّله ليلٌ ولا نهار، فهو أبلغُ من «دائم» لأنه ينفي الانقطاع أصلًا.","d":["في «المعلّم» قمرية، وفي «الطالب» شمسية","يُرفع بالألف، ويُنصب ويُجرّ بالياء","الشرطتان، لأن الجملة بينهما اعتراضية"]},{"q":"ما الفرق بين «مُقِيت» و«مَقِيت»؟","a":"«مُقِيت» بالضمّ: المقتدر. و«مَقِيت» بالفتح: البغيض","e":"فالأولى من القوت أي الحفظ والاقتدار، ومنه «وكان الله على كل شيء مُقِيتًا». والثانية من المقت وهو البغض الشديد.","d":["إذا كانت مضمومة وما قبلها مفتوح، فتُكتب على الواو","تنصب المبتدأ ويُسمّى اسمها، وترفع الخبر ويُسمّى خبرها","كلّ جمع تكسير بعد ألفه حرفان أو ثلاثةٌ أوسطها ساكن، ومُنعت لأنها فرعٌ في الجمع وفي الصيغة"]},{"q":"ما معنى «أفّاك»؟","a":"كذّابٌ مبالغ في الكذب","e":"و«أفّاك» صيغةُ مبالغة على وزن «فَعّال» من الإفك وهو أسوأُ الكذب، فدلّت الصيغةُ على كثرة الوقوع فيه لا على مجرّد وقوعه.","d":["أنْ، لن، كي، إذن، ولام التعليل","مساجد — لأنها على صيغة منتهى الجموع","عاقلٌ جيّد الرأي، محكمُ العقل"]},{"q":"ما معنى «اليراع»؟","a":"القلم","e":"وأصل اليَراع القصبُ الأجوف، ولمّا كانت الأقلام تُتّخذ منه سُمّي القلم باسمه، وهذه علاقةُ المادّة في المجاز المرسل.","d":["عِبئًا","ترادف","علامة التعجّب"]},{"q":"ما معنى «أريحيّ»؟","a":"واسعُ الخُلُق، نشيطٌ إلى فعل المعروف","e":"وأصله من الارتياح وهو خفّةُ النفس إلى الخير، فالأريحيُّ من تهتزّ نفسُه للمعروف طربًا، وهو أبلغ من «كريم» لأنه يصف الطبع.","d":["العذراء المنقطعة عن الرجال","يُرفع بالألف، ويُنصب ويُجرّ بالياء","أعزّة أُباة، أصحاب عزّةٍ وأنفة"]},{"q":"ما معنى «صَلِف»؟","a":"متكبّر متعجرف","e":"والصَّلَف في أصل اللغة ادّعاءُ المرء فوق ما عنده، فهو أخصُّ من مطلق الكِبر لأنه كبرٌ مبنيّ على دعوى باطلة.","d":["جملة فعلية","جملة اسمية","علامة التعجّب"]},{"q":"ما معنى «زَنِخ»؟","a":"فاسدٌ متغيّرُ الرائحة","e":"ويُستعمل أصلًا في الدهن والسَّمن إذا تغيّر طعمُه وريحُه بطول المكث، ثم توسّع فيه فأُطلق على كل فاسدٍ منتن.","d":["تضادّ (طباق)","جملة اسمية","متكبّر متعجرف"]},{"q":"ما معنى «قانع»؟ وما معنى «دامس»؟","a":"القانع: الراضي بما قُسم له. والدامس: الشديد الظلام","e":"والقناعةُ رضًا بالموجود لا طلبٌ للمفقود، والدَّمْسُ في اللغة التغطيةُ والستر، فسُمّي الظلام الشديد دامسًا لأنه يستر ما تحته.","d":["المكسورة حرف ناسخ يدخل على الجملة الاسمية، و«أنْ» حرف مصدري ونصب يدخل على الفعل المضارع","إذا كانت مضمومة وما قبلها مفتوح، فتُكتب على الواو","تعمل عمل «إنّ»، وشرطها أن يكون اسمها نكرةً متّصلًا بها غيرَ مفصول"]},{"q":"ما معنى «شائن» وما معنى «ماجن»؟","a":"الشائن: القبيح المُخجِل. والماجن: الهازل القليل الحياء","e":"فالشَّيْنُ ضدُّ الزَّيْن، والمجونُ أن يستهتر المرء فلا يُبالي بما قال ولا بما قيل فيه، فالأول وصفٌ للفعل والثاني للطبع.","d":["لأنها همزة متوسطة مفتوحة وما قبلها مضموم، والضمة أقوى من الفتحة","إذا اتصلت به نون التوكيد مباشرةً، نحو «واللهِ لأفعلنَّ الخير»","«مُقِيت» بالضمّ: المقتدر. و«مَقِيت» بالفتح: البغيض"]},{"q":"ما مرادف «إجلال»؟ وما مرادف «يَحنَث»؟","a":"الإجلال: التعظيم والتبجيل. و«يحنث»: يُخلِف وعدَه وينقض يمينه","e":"والحِنْثُ في الأصل نقضُ اليمين، ومنه «التحنُّث» وهو التعبُّد لأن المتعبّد يتجنّب الحِنْث، فاللفظان من أصلٍ واحد والمعنى متقابل.","d":["القانع: الراضي بما قُسم له. والدامس: الشديد الظلام","تعمل عمل «إنّ»، وشرطها أن يكون اسمها نكرةً متّصلًا بها غيرَ مفصول","لأنها همزة متوسطة مفتوحة وما قبلها مضموم، والضمة أقوى من الفتحة"]},{"q":"ما العلاقة بين «ليث» و«ضرغام» و«أسد»؟","a":"ترادف","e":"لأنها ألفاظٌ مختلفة لمعنًى واحد، والترادفُ من أدلّة سعة العربية، وقد أنكره بعضُ اللغويين وزعم أن لكل لفظٍ ظلًّا دلاليًّا يخصّه.","d":["قِ","عِبئًا","القلم"]},{"q":"ما العلاقة بين «حرب» و«سلام»؟","a":"تضادّ (طباق)","e":"لأن اللفظين متقابلان في المعنى، وإذا اجتمعا في الكلام سُمّي طباقًا، وهو من المحسّنات المعنوية لأنه يُبرز المعنى بضدّه.","d":["جملة فعلية","تسعٌ وسبعون طالبةً","فاسدٌ متغيّرُ الرائحة"]}],"r":[{"t":"جردُ ملفّ «عربي عام لجميع التخصصات» — ما فيه بالضبط","b":"\n<p>هذا الملفّ كان موسومًا عندي من قبلُ بـ«نسخة مكرّرة»، وكان ذلك <b>خطأً مني</b>.\nأُعيدت المحاولة بصيغة <code>export=view</code> ففُتح كاملًا في أربعة أجزاء،\nفإذا هو <b>تسعٌ وعشرون صفحة</b> فيها قريبٌ من مئتي سؤال، وليس نسخةً من شيء.\nوقد صُحِّح وصفُه في لوحة الملفات.</p>\n\n<p><b>عنوانه الداخلي:</b> «تسريبات محور اللغة العربية (عربي عام جميع التخصصات)\n— أسئلة وردت بالفعل»، وصاحبُه يُعرِّف نفسه بـ«Mr / HOSSAM»، ويقول إن العمل\nصدقةٌ جارية على روح أبيه. وهو مقسوم على مرحلتين: <b>«تسريبات المرحلة الخامسة»</b>\nو<b>«تسريبات المرحلة الرابعة»</b>، وبينهما فصلٌ عنوانه\n<b>«أهمّ الموضوعات التي وردت في اختبارات التنظيم والإدارة»</b>.</p>\n\n<p><b>وهذه قائمة الموضوعات كما عدّها صاحبُ الملفّ نفسه</b>، وهي أنفعُ ما فيه\nلأنها خريطةُ الاختبار لا أسئلتَه: الجملة الاسمية والفعلية، المفرد وعلامات إعرابه،\nالمثنّى، أنواع الجموع الثلاثة، البدل، التوكيد، لا النافية للجنس،\nكان وأخواتها، إنّ وأخواتها، الفعل المضارع، الممنوع من الصرف، التمييز،\nالمدّ والممدود، حالات تقديم الخبر، التاء المربوطة والهاء، همزة القطع وألف الوصل،\nأدوات نصب المضارع، التنوين، المفاعيل الخمسة، حروف الجرّ، الهمزة المتطرفة والمتوسطة،\nالفاعل، علامات الإعراب الأصلية والفرعية، علامات الترقيم، رفع المضارع وجزمه،\nالمضاف إليه، الأفعال الخمسة، الأسماء الخمسة، أسماء الإشارة، حروف المدّ،\nالفعل الماضي، اللام الشمسية والقمرية، المنادى، أسلوب الشرط، مواضع الهمزة،\nتمييز المئة ومضاعفاتها، التوكيد المعنوي، جمع القلّة.</p>\n\n<p><b>وأنواع الأسئلة فيه خمسة</b> كما نصّ عليها: أعرب الكلمة بحسب موقعها،\nاختر الضبط الصحيح، اختر الجملة الصحيحة، اختر الجملة الخاطئة، وأسئلة المعاني.\n<b>وأغلب الملفّ معانٍ ومفردات</b> — قرابةُ نصفه — وهذا وجهٌ مهمّ:\nمحورُ اللغة العربية في مسابقة التنظيم والإدارة ليس نحوًا خالصًا،\nبل نصفُه ثروةٌ لفظية. والأسئلة هنا <b>معادةُ الصياغة ومعلَّلةٌ بتعليلٍ أصليّ</b>،\nلأن نقل ملفٍّ مملوكٍ بنصّه ليس من العلم في شيء.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>تصحيحٌ لخطإٍ سابق مني</b> — كنتُ وسمتُ هذا الملفّ بـ«نسخة مكرّرة» اعتمادًا على تشابه العنوان، ثم فُتح بصيغة <code>export=view</code> فإذا هو ملفٌّ مستقلّ في تسعٍ وعشرين صفحة. والعبرة: تشابُهُ العناوين ليس دليلًا على تشابُه المضمون.</li><li><b>هذا الملفّ «عربي عام» لا «تخصّص»</b> — فمادّتُه محور اللغة العربية في مسابقة التنظيم والإدارة، وهو مطلوبٌ من جميع التخصّصات. فإن كنتَ تخصُّص لغةٍ عربية فهو لك مراجعةٌ سريعة لا مادّةٌ أصلية، ومادّتُك الأصلية في أبواب النحو والبلاغة والأدب من هذه الصفحة.</li><li><b>نصفُ الملفّ معانٍ ومفردات</b> — وهذا كشفٌ مهمّ: محورُ اللغة العربية في التنظيم والإدارة ليس نحوًا خالصًا. فمن ذاكر النحو وحده سقط في نصف الأسئلة. خصِّص للثروة اللفظية وقتًا يوازي ما تُخصّصه للإعراب.</li><li><b>خريطة الموضوعات التي عدّها صاحب الملفّ أنفعُ من أسئلته</b> — لأنها تدلّك على حدود المطلوب، فلا تتوسّع فيما لا يُسأل عنه ولا تُهمل ما يُسأل. وقد نُقلت القائمة كاملةً في متن البطاقة.</li><li><b>لم يُنقل من الملفّ نصٌّ حرفيّ</b> — الأسئلة هنا معادةُ الصياغة، والتعليلُ أصليٌّ مبنيّ على كتب الفنّ. وملفُّ صاحبه له، وإنما المنقول <b>المسائل</b>، والمسائلُ علمٌ لا يُملَك.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: جامع الدروس العربية · النحو الوافي · قواعد الإملاء لعبد السلام هارون · المزهر للسيوطي · أدب الكاتب لابن قتيبة</p></div>"},{"t":"القاعدة التي يدور عليها ثُلث الملفّ: الهمزة المتطرفة","b":"\n<p>إذا عددتَ أسئلة الملفّ وجدتَ سؤال الهمزة المتطرفة مكرَّرًا فيه أكثر من\nعشر مرّات بألفاظ مختلفة: «لماذا رُسمت الهمزة في تكافؤ؟» «في خطأ؟» «في شاطئ؟»\n«في عبء؟» «في يجرؤ؟». وكلُّها سؤالٌ واحد، فإذا ضبطتَ قاعدتَه كفاك عن عشرة أسئلة.</p>\n\n<p><b>القاعدة:</b> الهمزة المتطرفة تُكتب على ما يناسب <b>حركة ما قبلها</b>،\nولا يُنظر إلى حركتها هي البتّة. فإن كان ما قبلها مضمومًا كُتبت على الواو:\n«تكافؤ، تباطؤ، يجرؤ». وإن كان مفتوحًا فعلى الألف: «خطأ، نبأ، قرأ».\nوإن كان مكسورًا فعلى الياء: «شاطئ، قارئ، مبادئ». وإن كان <b>ساكنًا</b>\nفلا حركة له تُناسب حرفًا، فتُكتب مفردةً على السطر: «عبء، دفء، جزء».</p>\n\n<p><b>وأمّا المتوسطة</b> فتُكتب على حرفٍ يناسب <b>أقوى الحركتين</b>:\nحركتِها وحركةِ ما قبلها. وترتيب القوّة: الكسرة ثم الضمة ثم الفتحة ثم السكون.\nولهذا كُتبت همزة «فؤاد» على الواو: فهي مفتوحة وما قبلها مضموم،\nوالضمةُ أقوى من الفتحة. وكُتبت «فئة» على الياء لأن الكسرة أقوى من الفتحة.\n<b>والمَزلَق هنا</b> أن يسأل الممتحِن: «في أيّ الحالات لا تُكتب الهمزة على الألف؟»\nفالجواب: إذا كانت مضمومة وما قبلها مفتوح، لأن الضمة تغلب الفتحة فتُكتب على الواو.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>المَزلَق الأكبر: النظر إلى حركة الهمزة نفسها</b> — في المتطرفة لا يُنظر إليها البتّة، بل إلى حركة ما قبلها وحدها. فـ«يجرؤُ» الهمزة مضمومة وما قبلها مضموم فكُتبت على الواو، و«عبءٌ» الهمزة مرفوعة وما قبلها ساكن فكُتبت على السطر.</li><li><b>التنوين يُغيِّر الحكم</b> — «عبء» تُكتب على السطر، فإذا نُوّنت نصبًا صارت «عِبئًا» على نبرة، لأن التنوين حرَّك ما قبلها فصارت في حكم المتوسّطة. وهذا من ألطف ما يُسأل عنه في هذا الباب.</li><li><b>ترتيب قوّة الحركات في المتوسطة:</b> الكسرة ثم الضمة ثم الفتحة ثم السكون. ويناسب الكسرةَ الياءُ، والضمةَ الواوُ، والفتحةَ الألفُ. فاحفظ الترتيب تستغنِ عن حفظ عشرات الفروع.</li><li><b>السؤال المقلوب</b> — قد يسأل الممتحِن: «في أيّ حالةٍ لا تُكتب الهمزة على الألف؟» والجواب: إذا كانت مضمومة وما قبلها مفتوح، لأن الضمة تغلب الفتحة فتُكتب على الواو. فتدرَّب على صيغة النفي كما تتدرّب على صيغة الإثبات.</li><li><b>الأسماء العشرة ذواتُ ألف الوصل:</b> ابن، ابنة، اسم، است، امرؤ، امرأة، اثنان، اثنتان، ايمُ الله، ايمُنُ الله. وما عداها من الأسماء فهمزتُه قطع. وفي الأفعال: أمرُ الثلاثي، وماضي الخماسي والسداسي وأمرُهما ومصدرُهما.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: قواعد الإملاء لعبد السلام هارون · أدب الكاتب لابن قتيبة · المرشد الإملائي · الموجّه الفني لعبد العليم إبراهيم</p></div>"},{"t":"المعاني والمفردات — نصفُ الملفّ، وكيف تُحفظ","b":"\n<p>أكثرُ ما في هذا الملفّ أسئلةُ معانٍ: «ما معنى حصيف؟ سرمديّ؟ أفّاك؟ اليراع؟».\nوهي أسهلُ ما يُنسى وأسرعُ ما يُكتسب إن أُحسن ترتيبُها. وطريقتُها أن تُجمع\n<b>في حقولٍ دلالية</b> لا في قائمةٍ هجائية، فإن الذهن يحفظ المتشابهات معًا.</p>\n\n<ol>\n<li><b>حقل العقل والرأي:</b> حصيف وأريب ولبيب وفطِن — كلُّها في معنى العاقل\nالجيّد الرأي، والفرقُ بينها في الدرجة لا في الأصل.</li>\n\n<li><b>حقل الكِبر:</b> صَلِف ومتغطرس ومتعجرف — والصَّلَف أصله ادّعاء ما ليس فيك،\nوهو أخصُّ من مطلق الكبر.</li>\n\n<li><b>حقل الفساد:</b> زَنِخ ومتعفّن ودَنِس ومتهتّك — فالزَّنَخ فسادُ الدهن خاصّةً\nوتغيُّر ريحه، والتهتُّكُ فسادُ الخُلُق لا فسادُ العين.</li>\n\n<li><b>حقل الدوام:</b> سرمديّ وأبديّ وخالد — والسرمد في أصل اللغة دوامُ الزمان\nالذي لا ينقطع ليلًا ولا نهارًا.</li>\n\n<li><b>حقل الكرم:</b> سخيّ وجواد وأريحيّ — والأريحيُّ من يرتاح للمعروف\nويهتزّ له نشاطًا، فهو أبلغ من الجواد لأنه يصف النفس لا الفعل.</li>\n</ol>\n\n<p><b>وتنبيهٌ يتكرّر في الملف:</b> «مُقِيت» بضمّ الميم معناه <b>المقتدر</b>،\nو«مَقِيت» بفتحها معناه <b>البغيض</b>. فالضبطُ هنا يقلب المعنى رأسًا على عقب،\nوهو من أخبث ما يُسأل عنه لأنه يعتمد على حركةٍ واحدة.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الضبط يقلب المعنى</b> — «مُقِيت» بالضمّ: المقتدر، و«مَقِيت» بالفتح: البغيض. و«حَوْليّ» ما أتى عليه حول، و«حُوَلة» الشديد التصرّف. فإذا رأيتَ السؤال مضبوطًا فالضبطُ هو مفتاح الجواب لا زينتَه.</li><li><b>احفظ الأصل تحفظ الفروع</b> — «زَنِخ» أصلُه فسادُ الدهن وتغيُّرُ ريحه، فمن حفظ هذا الأصل لم يخلط بينه وبين «دَنِس» الذي أصله الوسخ الظاهر. والرجوع إلى المادّة اللغوية أثبتُ من حفظ الترجمة.</li><li><b>الترادف التامّ نادر</b> — «أسد» و«ليث» و«ضرغام» مترادفة في الجملة، لكن لكلٍّ ظلٌّ يخصُّه: الليثُ أشدُّها، والضرغامُ أضخمُها. وقد أنكر ابن فارس وثعلب الترادفَ التامّ وجعلوا الفروق مقصودة.</li><li><b>جمع التكسير بابُ سماعٍ لا قياس</b> — «غار» تُجمع على «أغوار» و«غِيران»، و«مقلة» على «مُقَل» و«مَقَلات»، و«كبرى» على «كُبَر» و«كُبريات». فلا تتكلّف له قياسًا، واحفظه كما نُقل.</li><li><b>فرّق بين المضادّ والمقابل</b> — مضادُّ «دنا» هو «ابتعد»، ومضادُّ «أقدم» هو «أحدث». والتضادُّ يكون في المعنى لا في الصيغة، فقد يتّفق اللفظان صيغةً ويتضادّان معنًى.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: المزهر في علوم اللغة للسيوطي · الصاحبي لابن فارس · فقه اللغة للثعالبي · لسان العرب · أدب الكاتب</p></div>"}]},{"c":"ex4","n":"٤· محاكي القرآن","q":[{"q":"«الحمدُ لله ربِّ العالمين» — أعرب «ربّ» وبيّن الوجه الآخر.","a":"نعت لـ«الله» مجرور، ويجوز قطعُه إلى النصب على المدح أو الرفع على أنه خبر لمبتدأ محذوف","e":"فالجرُّ على الإتباع هو الظاهر، والقطعُ يُفيد قصدَ المدح استقلالًا، وهذا من مواضع القطع التي تكثر في النعوت الجارية على اسم الله.","d":["في محل رفع مبتدأ، والتقدير «وصيامُكم خيرٌ لكم»","ضمير منفصل مبنيّ في محل نصب مفعول به مقدَّم، وتقديمُه يفيد الاختصاص","خبر ثانٍ أو حال، مرفوع بضمةٍ مقدَّرة على الألف للتعذّر"]},{"q":"«إيّاك نعبدُ» — أعرب «إيّاك» وبيّن سرّ التقديم.","a":"ضمير منفصل مبنيّ في محل نصب مفعول به مقدَّم، وتقديمُه يفيد الاختصاص","e":"لأن تقديم ما حقُّه التأخير يفيد القصر، فأفاد قصرَ العبادة على الله وحده، وهو أبلغُ من «نعبدك» لأنه يتضمّن نفيَ العبادة عن غيره.","d":["نعت لـ«الله» مجرور، ويجوز قطعُه إلى النصب على المدح أو الرفع على أنه خبر لمبتدأ محذوف","خبر «ما» الحجازية مجرور لفظًا منصوب محلًّا، والباء زائدة للتوكيد","خبر ثانٍ أو حال، مرفوع بضمةٍ مقدَّرة على الألف للتعذّر"]},{"q":"«غيرِ المغضوبِ عليهم» — أعرب «غير».","a":"نعت لـ«الذين» مجرور، أو بدل منه","e":"وساغ وصفُ المعرفة بـ«غير» وهي شديدةُ الإبهام لأنها اكتسبت تعريفًا من إضافتها إلى معرفة، وهذا من مسائل تعريف «غير».","d":["ضمير منفصل مبنيّ في محل نصب مفعول به مقدَّم، وتقديمُه يفيد الاختصاص","خبر ثانٍ أو حال، مرفوع بضمةٍ مقدَّرة على الألف للتعذّر","خبر «ما» الحجازية مجرور لفظًا منصوب محلًّا، والباء زائدة للتوكيد"]},{"q":"«هدًى للمتّقين» — أعرب «هدًى».","a":"خبر ثانٍ أو حال، مرفوع بضمةٍ مقدَّرة على الألف للتعذّر","e":"ولو جُعل حالًا لكان من «الكتاب»، والمختار الخبريةُ لأن المقام مقامُ إخبار لا تقييدِ هيئة، والإعرابُ تابعٌ لمقتضى المعنى.","d":["في محل رفع مبتدأ، والتقدير «وصيامُكم خيرٌ لكم»","نعت لـ«الله» مجرور، ويجوز قطعُه إلى النصب على المدح أو الرفع على أنه خبر لمبتدأ محذوف","تقديم الجار والمجرور الخبرِ على المبتدأ لإفادة الاختصاص"]},{"q":"«وامرأتُه حمّالةَ الحطبِ» — ما وجه نصب «حمّالة»؟","a":"النصب على الذمّ بفعلٍ محذوف تقديره «أذمّ»","e":"وقُرئ بالرفع على أنها خبرٌ أو نعت، والنصبُ على الذمّ نظيرُ النصب على المدح، وكلاهما من القطع عن التبعية لإفادة المعنى.","d":["اجتماعُ أمورٍ متناسبة غير متضادّة في الكلام","للتعليل، أي: كي تشكروا","الدعيّ الملصَق بالقوم وليس منهم"]},{"q":"«فلمّا رأينه أكبرنه وقطّعن أيديهنّ» — ما إعراب «أكبرنه»؟","a":"فعل ماضٍ مبنيّ على السكون لاتصاله بنون النسوة، والنون فاعل، والهاء مفعول","e":"والماضي يُبنى على السكون مع ضمير الرفع المتحرّك، لا على الفتح، لأن توالي أربع حركاتٍ فيما هو كالكلمة الواحدة مستثقَل.","d":["الفاصلة آخر كلمةٍ في الآية، وهي تابعةٌ للمعنى، والسجعُ يُتكلَّف فيه اللفظ","لأن مداره على تمام المعنى وتعلُّق أجزاء الكلام بعضها ببعض","إيجازٌ بديع جمع فيه المشهد كلَّه في ألفاظٍ قليلة بنداءٍ وأمرٍ للجماد"]},{"q":"«وأن تصوموا خيرٌ لكم» — أعرب المصدر المؤوّل.","a":"في محل رفع مبتدأ، والتقدير «وصيامُكم خيرٌ لكم»","e":"لأن «أن» المصدرية مع صلتها تُسبك بمصدرٍ يقع موقع الاسم المفرد، فيُعرب بحسب موقعه من الجملة رفعًا ونصبًا وجرًّا.","d":["ضمير منفصل مبنيّ في محل نصب مفعول به مقدَّم، وتقديمُه يفيد الاختصاص","نعت لـ«الذين» مجرور، أو بدل منه","نعت لـ«الله» مجرور، ويجوز قطعُه إلى النصب على المدح أو الرفع على أنه خبر لمبتدأ محذوف"]},{"q":"«وما ربُّك بغافلٍ عمّا تعملون» — ما إعراب «بغافل»؟ وما فائدة الباء؟","a":"خبر «ما» الحجازية مجرور لفظًا منصوب محلًّا، والباء زائدة للتوكيد","e":"وزيادةُ الباء في خبر النفي تؤكّد انتفاءَ المعنى وتنصُّ عليه، فهي ليست حشوًا بل أداةُ تقوية، وهذا من دقائق الزيادة في القرآن.","d":["خبر ثانٍ أو حال، مرفوع بضمةٍ مقدَّرة على الألف للتعذّر","تقديم الجار والمجرور الخبرِ على المبتدأ لإفادة الاختصاص","نعت لـ«الذين» مجرور، أو بدل منه"]},{"q":"«ثم بعثناكم من بعد موتكم لعلّكم تشكرون» — ما معنى «لعلّ» هنا؟","a":"للتعليل، أي: كي تشكروا","e":"لأن الترجّي على حقيقته مستحيلٌ في حقّ الله لاستلزامه الجهلَ بالعاقبة، فتُحمل «لعلّ» في مثله على التعليل أو على الترجّي بالنسبة إلى المخاطَب.","d":["التعظيم والتنويع، أي حياةٌ عظيمة من نوعٍ خاصّ","الدعيّ الملصَق بالقوم وليس منهم","المرعى والكلأ الذي ترعاه الدوابّ"]},{"q":"«فويلٌ للمصلّين الذين هم عن صلاتهم ساهون» — لماذا قال «عن» ولم يقل «في»؟","a":"لأن «عن» تفيد الغفلة عن الصلاة وتركَها، و«في» تفيد السهوَ داخلها وهو معفوّ عنه","e":"فتبدّل الحرف يُبدّل الحكم كلَّه، والذمُّ إنما وقع على من يسهو عن الصلاة حتى يُخرجها عن وقتها، لا على من يسهو في أثنائها.","d":["القلب يُستعمل للعضو ولمحلّ الإدراك عامّةً، والفؤاد يغلب فيه معنى التوقُّد والتحرُّق","الفاصلة آخر كلمةٍ في الآية، وهي تابعةٌ للمعنى، والسجعُ يُتكلَّف فيه اللفظ","لأن مداره على تمام المعنى وتعلُّق أجزاء الكلام بعضها ببعض"]},{"q":"ما معنى «أبًّا» في قوله «وفاكهةً وأبًّا»؟","a":"المرعى والكلأ الذي ترعاه الدوابّ","e":"والمناسبة ظاهرة: ذكر ما يأكله الناس «فاكهة» ثم ما تأكله أنعامهم «أبًّا»، فاللفظُ غريبٌ والمعنى مستقيمٌ مع السياق.","d":["اجتماعُ أمورٍ متناسبة غير متضادّة في الكلام","حجرًا أملسَ أجردَ لا شيء عليه","الدعيّ الملصَق بالقوم وليس منهم"]},{"q":"ما معنى «زنيم» في قوله «عُتُلٍّ بعد ذلك زنيمٍ»؟","a":"الدعيّ الملصَق بالقوم وليس منهم","e":"وأصله من الزَّنَمة وهي الهَنَةُ المعلَّقة في عنق الشاة، فشُبّه الدعيُّ بها لأنه معلَّقٌ بالقوم لا أصل له فيهم.","d":["التعظيم والتنويع، أي حياةٌ عظيمة من نوعٍ خاصّ","المرعى والكلأ الذي ترعاه الدوابّ","«ما» تنفي الحالَ غالبًا، و«لا» تنفي الاستقبال"]},{"q":"ما معنى «صَلدًا» في قوله «فتركه صَلدًا»؟","a":"حجرًا أملسَ أجردَ لا شيء عليه","e":"والصَّلْدُ في اللغة الصلبُ الأملس، والتصويرُ هنا بليغ: فالترابُ على الصفوان يذهب بالمطر ويبقى الحجرُ عاريًا، مثلًا لبطلان العمل بالرياء.","d":["للتعليل، أي: كي تشكروا","جماعاتٍ متفرّقة، جماعةً بعد جماعة","المرعى والكلأ الذي ترعاه الدوابّ"]},{"q":"ما معنى «ثُبات» في قوله «فانفِروا ثُباتٍ»؟","a":"جماعاتٍ متفرّقة، جماعةً بعد جماعة","e":"ومفردها «ثُبَة»، وهي من الكلمات التي حُذفت لامُها وجُمعت جمعَ المؤنث السالم، ومقابلُها في الآية «أو انفروا جميعًا».","d":["حجرًا أملسَ أجردَ لا شيء عليه","المرعى والكلأ الذي ترعاه الدوابّ","اجتماعُ أمورٍ متناسبة غير متضادّة في الكلام"]},{"q":"ما معنى «حَصيدًا» في قوله «فجعلناها حصيدًا»؟","a":"محصودةً كالزرع المقطوع","e":"و«حصيد» فعيلٌ بمعنى مفعول، ولذلك استوى فيه المذكر والمؤنث فلم يُقل «حصيدة»، وهذه قاعدةٌ صرفية تُسأل في هذا الباب.","d":["التعظيم بنون العظمة","تامّ، وحسن، وقبيح","استفهام إنكاريّ توبيخيّ"]},{"q":"ما الفرق بين «الفؤاد» و«القلب» في الاستعمال القرآني؟","a":"القلب يُستعمل للعضو ولمحلّ الإدراك عامّةً، والفؤاد يغلب فيه معنى التوقُّد والتحرُّق","e":"وأصل الفأد في اللغة الشيُّ والإحراق، فالفؤاد قلبٌ متوقِّد، ولذلك جاء في مقام الاضطراب «وأصبح فؤادُ أمّ موسى فارغًا».","d":["فعل ماضٍ مبنيّ على السكون لاتصاله بنون النسوة، والنون فاعل، والهاء مفعول","إيجازٌ بديع جمع فيه المشهد كلَّه في ألفاظٍ قليلة بنداءٍ وأمرٍ للجماد","لا يجوز القياس عليه، والمتّبع في غير المصحف هو الرسم الإملائي القياسي"]},{"q":"لماذا كُتبت «الصلوة» و«الزكوة» بالواو في المصحف؟","a":"لأنها كُتبت على لغة من يُفخِّم الألف فيُميلها نحو الواو، وهو من الرسم العثماني المتّبَع","e":"والرسمُ العثماني سنّةٌ لا يُقاس عليها، فيُكتب القرآن به ولا يُكتب به غيرُه، وهذا إجماعُ المحقّقين من أهل الرسم.","d":["الفاصلة آخر كلمةٍ في الآية، وهي تابعةٌ للمعنى، والسجعُ يُتكلَّف فيه اللفظ","أثبت الحياة في القصاص وهو قتل، فجمع بين المتقابلين في عبارةٍ موجزة","لأن مداره على تمام المعنى وتعلُّق أجزاء الكلام بعضها ببعض"]},{"q":"ما حكم الكتابة بالرسم العثماني في غير المصحف؟","a":"لا يجوز القياس عليه، والمتّبع في غير المصحف هو الرسم الإملائي القياسي","e":"لأن الرسم العثماني توقيفيٌّ في موضعه مبنيٌّ على روايةٍ، والكتابةُ المعاصرة مبنيّةٌ على قواعد مطّردة، فالخلطُ بينهما خطأ.","d":["إيجازٌ بديع جمع فيه المشهد كلَّه في ألفاظٍ قليلة بنداءٍ وأمرٍ للجماد","القلب يُستعمل للعضو ولمحلّ الإدراك عامّةً، والفؤاد يغلب فيه معنى التوقُّد والتحرُّق","لأن مداره على تمام المعنى وتعلُّق أجزاء الكلام بعضها ببعض"]},{"q":"ما أقسام الوقف عند ابن الأنباري؟","a":"تامّ، وحسن، وقبيح","e":"فالتامُّ ما تمّ المعنى عنده ولم يتعلّق بما بعده لفظًا ولا معنًى، والحسنُ ما تمّ معناه وتعلّق بما بعده، والقبيحُ ما لم يتمّ به معنًى.","d":["التعظيم بنون العظمة","استفهام إنكاريّ توبيخيّ","محصودةً كالزرع المقطوع"]},{"q":"لماذا يُعدّ علم الوقف والابتداء علمًا لغويًّا؟","a":"لأن مداره على تمام المعنى وتعلُّق أجزاء الكلام بعضها ببعض","e":"فلا يُعرف موضعُ الوقف إلا بمعرفة الإعراب والإسناد والفصل والوصل، ولذلك اشترطوا في المُقرئ أن يكون عالمًا بالنحو.","d":["القلب يُستعمل للعضو ولمحلّ الإدراك عامّةً، والفؤاد يغلب فيه معنى التوقُّد والتحرُّق","إيجازٌ بديع جمع فيه المشهد كلَّه في ألفاظٍ قليلة بنداءٍ وأمرٍ للجماد","الفاصلة آخر كلمةٍ في الآية، وهي تابعةٌ للمعنى، والسجعُ يُتكلَّف فيه اللفظ"]},{"q":"ما المقصود بـ«الوقف اللازم»؟ ولمَ سُمّي كذلك؟","a":"ما يُفضي وصلُه إلى معنًى فاسدٍ أو موهم، فلزم الوقفُ عنده","e":"وليس اللزومُ هنا حكمًا شرعيًّا بالتأثيم، بل هو لزومٌ صناعيّ لصيانة المعنى من الإيهام، وعلامته في المصحف الميمُ الصغيرة.","d":["لأن «عن» تفيد الغفلة عن الصلاة وتركَها، و«في» تفيد السهوَ داخلها وهو معفوّ عنه","لأنها كُتبت على لغة من يُفخِّم الألف فيُميلها نحو الواو، وهو من الرسم العثماني المتّبَع","لأن مداره على تمام المعنى وتعلُّق أجزاء الكلام بعضها ببعض"]},{"q":"ما الالتفات؟ وما مثاله في الفاتحة؟","a":"الانتقال من أسلوبٍ إلى آخر، ومثاله الانتقال من الغَيبة في «الحمد لله» إلى الخطاب في «إيّاك نعبد»","e":"وفائدتُه تجديدُ نشاط السامع والإيذانُ بتغيُّر الحال، فالعبدُ لمّا أثنى على ربّه بالغيبة قَرُب منه فخاطبه، وهذا من أسرار النظم.","d":["لأن مداره على تمام المعنى وتعلُّق أجزاء الكلام بعضها ببعض","إيجازٌ بديع جمع فيه المشهد كلَّه في ألفاظٍ قليلة بنداءٍ وأمرٍ للجماد","الفاصلة آخر كلمةٍ في الآية، وهي تابعةٌ للمعنى، والسجعُ يُتكلَّف فيه اللفظ"]},{"q":"ما الفاصلة القرآنية؟ وبمَ تختلف عن السجع؟","a":"الفاصلة آخر كلمةٍ في الآية، وهي تابعةٌ للمعنى، والسجعُ يُتكلَّف فيه اللفظ","e":"ولذلك امتنع جمهور العلماء من تسمية ما في القرآن سجعًا، لأن السجع صنعةٌ يُطلب فيها اللفظ أوّلًا، والقرآنُ المعنى فيه متبوعٌ لا تابع.","d":["لأن مداره على تمام المعنى وتعلُّق أجزاء الكلام بعضها ببعض","إيجازٌ بديع جمع فيه المشهد كلَّه في ألفاظٍ قليلة بنداءٍ وأمرٍ للجماد","ما يُفضي وصلُه إلى معنًى فاسدٍ أو موهم، فلزم الوقفُ عنده"]},{"q":"«ولكم في القِصاص حياةٌ» — ما وجه بلاغته؟","a":"أثبت الحياة في القصاص وهو قتل، فجمع بين المتقابلين في عبارةٍ موجزة","e":"والإيجازُ هنا بلغ الغاية: فالقصاص يردع الجاني فتُحقن دماءٌ كثيرة، فكان في القتل الواحد حياةٌ للجماعة، وهذا أبلغ من «القتل أنفى للقتل».","d":["ما يُفضي وصلُه إلى معنًى فاسدٍ أو موهم، فلزم الوقفُ عنده","إيجازٌ بديع جمع فيه المشهد كلَّه في ألفاظٍ قليلة بنداءٍ وأمرٍ للجماد","فعل ماضٍ مبنيّ على السكون لاتصاله بنون النسوة، والنون فاعل، والهاء مفعول"]},{"q":"ما فائدة تنكير «حياة» في «ولكم في القصاص حياةٌ»؟","a":"التعظيم والتنويع، أي حياةٌ عظيمة من نوعٍ خاصّ","e":"لأن التنكير يأتي للتعظيم كما يأتي للتحقير والإفراد، والقرينةُ هنا سياقُ الامتنان، فتعيّن حملُه على التعظيم.","d":["«ما» تنفي الحالَ غالبًا، و«لا» تنفي الاستقبال","المرعى والكلأ الذي ترعاه الدوابّ","اجتماعُ أمورٍ متناسبة غير متضادّة في الكلام"]},{"q":"«فلمّا جاء أمرُنا» — ما العدول في قوله «أمرنا» دون «أمري»؟","a":"التعظيم بنون العظمة","e":"ونونُ العظمة تدلّ على جلال المتكلم وكثرة جنوده وأسبابه، وتكثر في مقام إظهار القدرة والبطش، بخلاف مقام الرحمة والدعاء.","d":["استفهام إنكاريّ توبيخيّ","تامّ، وحسن، وقبيح","محصودةً كالزرع المقطوع"]},{"q":"ما المقصود بالتقديم للاهتمام في «لله ما في السماوات والأرض»؟","a":"تقديم الجار والمجرور الخبرِ على المبتدأ لإفادة الاختصاص","e":"فالمعنى: لله وحده لا لغيره، ولو أُخّر لصار إخبارًا مجرّدًا بلا حصر، فالتقديمُ أفاد معنًى زائدًا على أصل الإخبار.","d":["في محل رفع مبتدأ، والتقدير «وصيامُكم خيرٌ لكم»","خبر ثانٍ أو حال، مرفوع بضمةٍ مقدَّرة على الألف للتعذّر","خبر «ما» الحجازية مجرور لفظًا منصوب محلًّا، والباء زائدة للتوكيد"]},{"q":"ما الفرق بين «ما» النافية و«لا» النافية في الدلالة الزمنية؟","a":"«ما» تنفي الحالَ غالبًا، و«لا» تنفي الاستقبال","e":"ولهذا قال «ما كان محمدٌ أبا أحدٍ من رجالكم» بـ«ما» لنفي الواقع، وقال «لا يُكلِّف الله نفسًا إلا وسعها» بـ«لا» لنفي ما يُستقبل.","d":["التعظيم والتنويع، أي حياةٌ عظيمة من نوعٍ خاصّ","اجتماعُ أمورٍ متناسبة غير متضادّة في الكلام","المرعى والكلأ الذي ترعاه الدوابّ"]},{"q":"«أفلا يتدبّرون القرآن» — ما نوع الاستفهام وما غرضه؟","a":"استفهام إنكاريّ توبيخيّ","e":"لأن المقصود لومُهم على ترك التدبّر لا السؤالُ عن وقوعه، والهمزةُ دخلت على محذوفٍ تقديره «أغفلوا فلا يتدبّرون».","d":["محصودةً كالزرع المقطوع","تامّ، وحسن، وقبيح","التعظيم بنون العظمة"]},{"q":"ما وجه الإعجاز في قوله «وقيل يا أرضُ ابلعي ماءك ويا سماءُ أقلعي»؟","a":"إيجازٌ بديع جمع فيه المشهد كلَّه في ألفاظٍ قليلة بنداءٍ وأمرٍ للجماد","e":"فنُودي الجمادُ نداءَ العاقل إشعارًا بانقياده، ثم جاءت الأفعال متتابعةً بلا حرف عطفٍ في بعضها، فجرى الكلام مجرى المشهد المرئيّ.","d":["الفاصلة آخر كلمةٍ في الآية، وهي تابعةٌ للمعنى، والسجعُ يُتكلَّف فيه اللفظ","لا يجوز القياس عليه، والمتّبع في غير المصحف هو الرسم الإملائي القياسي","ما يُفضي وصلُه إلى معنًى فاسدٍ أو موهم، فلزم الوقفُ عنده"]},{"q":"ما المقصود بـ«مراعاة النظير» في فواصل السور؟","a":"اجتماعُ أمورٍ متناسبة غير متضادّة في الكلام","e":"وهو من المحسّنات المعنوية، ويكثر في القرآن حيث تُذكر الشمسُ والقمر، والليلُ والنهار، فتتآلف المعاني كما تتآلف الفواصل.","d":["الدعيّ الملصَق بالقوم وليس منهم","جماعاتٍ متفرّقة، جماعةً بعد جماعة","للتعليل، أي: كي تشكروا"]}],"r":[{"t":"بطاقتا المحاكيَين في الدوّارة — ومدار هذا الاختبار","b":"\n<p>البطاقتان الباقيتان في «اختبارات مختارة لك» محاكيان لا اختباران:</p>\n<ul>\n<li><b>«قرآن كريم»</b> — شارتاه: «محاكي شامل» و«مسابقة القرآن الكريم»،\nوالزمن <b>تسعون دقيقة</b>، وزرّه «ابدأ المحاكي».</li>\n<li><b>«…محاكي تنظيم وإدارة لغة عربية»</b> — شارتاه: «محاكي شامل»\nو«لغة عربية الأزهر الشريف»، والزمن <b>مئة دقيقة</b>.</li>\n</ul>\n\n<p>والمحاكي يختلف عن الاختبار في أمرين: <b>الزمن المحدود</b> و<b>شمول المحاور</b>.\nفمحاكي مسابقة القرآن لا يقتصر على اللغة، بل فيه حفظٌ وتجويدٌ وعلومُ قرآن\nومحاورُ تربوية وجداراتٌ عامّة. <b>وهذا الاختبار يتناول منه المحور اللغويّ وحده</b>،\nلأنه الذي يدخل في تخصّص اللغة العربية، وهو الذي أستطيع أن أكتبه كتابةً\nعلميةً موثوقة. أمّا محاكي الأزهر فمادّتُه اللغوية هي نفسُها مادّة\nالاختبار الثالث في هذه الصفحة، فلم أُكرِّرها.</p>\n\n<p><b>والزمن جزءٌ من الاختبار لا زينةٌ فيه:</b> تسعون دقيقة لمئة سؤالٍ تقريبًا\nتعني أقلَّ من دقيقةٍ للسؤال. فمن لم يتدرّب على السرعة سقط وهو يعرف الجواب.\nولهذا جُعل في «وضع الاختبار» بهذه الصفحة ساعةٌ صاعدة: لتقيس زمنك لا صوابك وحده.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>المحاكي غير الاختبار</b> — المحاكي موقوتٌ وشاملٌ لجميع المحاور، والاختبار مخصوصٌ بمحورٍ واحد وقد لا يكون موقوتًا. فالتدرّب على المحاكي تدرُّبٌ على إدارة الوقت بقدر ما هو تدرُّب على المادّة.</li><li><b>حسابُ الزمن قبل البدء</b> — تسعون دقيقة لمئة سؤال تعني أربعًا وخمسين ثانية للسؤال. فإذا جاوزتَ دقيقةً في سؤالٍ فاتركه وعُد إليه، فإنّ سؤالًا واحدًا لا يساوي ثلاثةً تضيع بسببه.</li><li><b>محاكي الأزهر مادّتُه اللغوية هي مادّة محور التنظيم والإدارة نفسها</b> — ولذلك لم أُفرده باختبار، واكتفيتُ بالاختبار الثالث. وزيادتُه عليه إنما هي في المواد الشرعية، وهي خارجة عن تخصّص اللغة العربية.</li><li><b>لا تُجب بالتخمين في المحاكيات الموقوتة ثم تمضِ</b> — بل ضع علامةً على ما خمّنتَه، فإنّ قيمة المحاكي في كشف ضعفك لا في رقم درجتك. ودرجةٌ صادقة أنفعُ من درجةٍ مزوَّقة بالحدس.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: —</p></div>"},{"t":"المحور اللغوي في مسابقة القرآن — أين يقع السؤال","b":"\n<p>الأسئلة اللغوية في مسابقات القرآن تدور على خمسة أبواب، وهي غير أبواب\nالنحو المجرَّد، فانتبه لها:</p>\n\n<ol>\n<li><b>إعراب الآيات</b> — ولا يُسأل فيه عن المطّرد، بل عن المواضع المشكِلة:\nنصبٌ على الاختصاص، أو رفعٌ على القطع، أو جرٌّ على الجوار، أو حالٌ من نكرة.</li>\n\n<li><b>غريب القرآن</b> — معاني الألفاظ التي هجرها الاستعمال:\n«أبًّا»، «حَصيدًا»، «ثُبات»، «زنيم»، «صلدًا». ومظانُّه «مفردات الراغب»\nو«تفسير غريب القرآن» لابن قتيبة.</li>\n\n<li><b>الرسم العثماني</b> — ومدارُه على مخالفة الرسم للنطق:\nالزيادة كـ«أولئك»، والحذف كـ«الرحمن»، والبدل كـ«الصلوة»،\nوالفصل والوصل كـ«أن لن» و«ألّا». والقاعدةُ أنّ الرسم العثمانيّ سنّةٌ متّبعة\nلا يُقاس عليه في الكتابة المعاصرة.</li>\n\n<li><b>الوقف والابتداء</b> — وهو علمٌ لغويّ في حقيقته، لأن مداره على تمام المعنى\nوتعلُّق الكلام بعضِه ببعض. وأقسامه عند ابن الأنباري: تامٌّ وحسنٌ وقبيح.</li>\n\n<li><b>البلاغة القرآنية</b> — الالتفات، والتقديم والتأخير، والفاصلة،\nوالتعريف والتنكير، والقصر. ومظانُّها «دلائل الإعجاز» و«الكشّاف» و«الدرّ المصون».</li>\n</ol>\n\n<p><b>وتنبيهٌ منهجيّ:</b> لا تُجب في إعراب الآية بما يُخالف المعنى المأثور.\nفالإعراب خادمٌ للمعنى لا حاكمٌ عليه، وقد ردّ النحاةُ وجوهًا صناعيةً صحيحة\nلأنها تُفضي إلى معنًى لا يليق. وهذه قاعدةٌ كبرى في إعراب القرآن.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الرسم العثماني سنّةٌ متّبعة لا قاعدةٌ يُقاس عليها</b> — يُكتب به المصحف ولا يُكتب به غيرُه. فمن كتب «الصلوة» في إنشائه فقد أخطأ، ومن كتبها «الصلاة» في المصحف فقد خالف الرسم. وهذا من أكثر ما يلتبس على الطلاب.</li><li><b>الوقف والابتداء علمٌ لغويّ</b> — مدارُه على تمام المعنى وتعلُّق الكلام، ولهذا اشترطوا في المُقرئ أن يكون عالمًا بالنحو. وأقسامه عند ابن الأنباري: تامٌّ وحسنٌ وقبيح، وزاد غيرُه الكافي.</li><li><b>«الوقف اللازم» لزومٌ صناعيّ لا شرعيّ</b> — سُمّي لازمًا لأن وصلَه يُفضي إلى معنًى موهِم، لا لأن تاركه آثم. وعلامته في المصحف الميمُ الصغيرة، ولا يُقال فيه إنّ وصلَه حرام.</li><li><b>«لعلّ» في القرآن لا تكون للترجّي على حقيقته</b> — لاستلزامه الجهلَ بالعاقبة، فتُحمل على التعليل، أو على الترجّي بالنسبة إلى المخاطَب لا إلى المتكلّم. وهذا توجيهٌ مقرَّر عند المفسّرين والنحاة.</li><li><b>الفاصلة ليست سجعًا</b> — امتنع الجمهور من تسمية ما في القرآن سجعًا، لأن السجع صنعةٌ يُطلب فيها اللفظ أوّلًا، والقرآنُ المعنى فيه متبوعٌ لا تابع. وأجازها الرمّانيُّ تسميةً، والخلافُ لفظيّ في حقيقته.</li><li><b>الإعراب خادمٌ للمعنى</b> — فلا تُوجِّه الآية بوجهٍ صناعيٍّ صحيح يُفضي إلى معنًى لا يليق. وقد ردّ النحاة وجوهًا لهذا السبب وحده، وهي قاعدةٌ كبرى في إعراب القرآن.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الدر المصون للسمين الحلبي · البرهان للزركشي · الإتقان للسيوطي · النشر لابن الجزري · مفردات الراغب · دلائل الإعجاز</p></div>"}]}],"f":[{"n":"360 سؤال في اللغة العربية","k":"بنك أسئلة عام","st":"تعذّر — جُرّبت ١٥ صيغة رابط فلم يستجب"},{"n":"أسئلة تخصص لغة عربية لمسابقة وزارة التربية والتعليم","k":"أسئلة الجهاز المركزي","st":"قُرئ كاملًا"},{"n":"الأسئلة التي وردت لتخصص اللغة العربية — نهائي","k":"أسئلة وردت فعلًا","st":"قُرئ كاملًا"},{"n":"أساسيات في قواعد الإملاء (المرشد الإملائي)","k":"مرجع إملاء","st":"قُرئ كاملًا"},{"n":"اللغة العربية تخصص للجميع","k":"بنك أسئلة","st":"قُرئ"},{"n":"تسريبات الحسام — أحدث الأسئلة في تخصص اللغة العربية (3)","k":"بلاغة وعروض وأدب","st":"قُرئ"},{"n":"تسريبات الحسام في العربية (خاص بتخصص اللغة العربية)","k":"أسئلة تخصص","st":"تعذّر — ١٠٠ صفحة بخطّ مشفَّر الترميز، جُرّبت أربع طرائق لفكّ الشفرة"},{"n":"تسريبات الحسام في اللغة العربية (خاص بالتخصص)","k":"أسئلة تخصص","st":"تعذّر — هو الملفّ السابق نفسه حرفًا بحرف، والعلّة واحدة"},{"n":"تسريبات الحسام في اللغة العربية (عربي عام لجميع التخصصات)","k":"عربي عام","st":"فُتح أخيرًا وقُرئ كاملًا — ٢٩ صفحة ≈ ٢٠٠ سؤال ← الاختبار الثالث"},{"n":"طرق تدريس اللغة العربية","k":"مرجع طرق تدريس","st":"قُرئ كاملًا"},{"n":"طرق تدريس اللغة العربية — 1","k":"مرجع طرق تدريس","st":"نسخة مكررة"},{"n":"مراجعة ما قبل الامتحان — أحدث أسئلة وردت بالفعل","k":"مراجعة","st":"قُرئ أخيرًا — جدارات وذكاء وحاسب ومعلومات عامة، لا تخصص"},{"n":"أسئلة معلم فصل","k":"تخصص آخر","st":"خارج تخصص اللغة العربية"},{"n":"أحدث أسئلة للحاسب الآلي — الجزء الثاني","k":"حاسب آلي","st":"خارج تخصص اللغة العربية"}]}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('DATA').textContent);
var AR='٠١٢٣٤٥٦٧٨٩';
function ad(n){return String(n).replace(/[0-9]/g,function(d){return AR[+d]});}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function norm(s){return s.replace(/[\u064B-\u0652\u0670]/g,'').replace(/[أإآ]/g,'ا')
  .replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');}

var tabs=document.getElementById('tabs'), panels=document.getElementById('panels');

function mkTab(id,label,cls){
  var b=document.createElement('button');
  b.className='tab'+(cls?' '+cls:''); b.setAttribute('data-tab',id); b.textContent=label;
  tabs.appendChild(b); return b;
}
function mkPanel(id){
  var d=document.createElement('section');
  d.className='panel'; d.id='p-'+id; panels.appendChild(d); return d;
}

/* ---------- تبويب الملفات ---------- */
mkTab('files','الملفات');
var pf=mkPanel('files');
var okc=0; D.f.forEach(function(f){ if(/قُرئ/.test(f.st)) okc++; });
pf.innerHTML='<div class="lead"><b>ماذا في هذا التبويب؟</b> جردٌ لمحتويات مجلد '+
 '<a href="https://drive.google.com/drive/folders/1YvqHviSNCHqECMZ0aslM0tJ5_1oKYnn3" target="_blank" rel="noopener">«تخصص عربي»</a> المرتبط من صفحة المسابقة، '+
 'وبيانُ ما أمكن قراءته منها وما تعذّر. وقد استُخرجت كل الأسئلة والقواعد في التبويبات التالية '+
 'من الملفات المقروءة، وصيغت الحلول والشروح صياغةً أصليةً لا نقلًا حرفيًّا.</div>'+
 '<div class="g"><div><b>'+ad(D.f.length)+'</b><span>ملفًا في المجلد</span></div>'+
 '<div><b>'+ad(okc)+'</b><span>ملفًا قُرئ</span></div>'+
 '<div><b>'+ad(546)+'</b><span>سؤالًا محلولًا</span></div>'+
 '<div><b>'+ad(93)+'</b><span>قاعدة مشروحة</span></div></div>'+
 '<div class="card"><h3>فهرس ملفات المجلد</h3><div id="flist"></div></div>';
var fl=document.getElementById('flist');
D.f.forEach(function(f){
  var ok=/قُرئ/.test(f.st), bad=/تالف|تعذّر|تعذر/.test(f.st);
  var d=document.createElement('div'); d.className='fl';
  d.innerHTML='<span class="nm">'+esc(f.n)+'</span>'+
    '<span class="kd">'+esc(f.k)+'</span>'+
    '<span class="st'+(ok?' ok':'')+(bad?' bad':'')+'">'+esc(f.st)+'</span>';
  fl.appendChild(d);
});

/* ---------- تبويب وضع الاختبار (يُملأ بعد بناء الفروع) ---------- */
mkTab('exam','وضع الاختبار','xm');
var px=mkPanel('exam');

/* ---------- تبويبات الفروع ---------- */
D.s.forEach(function(s){
  mkTab(s.c,s.n);
  var p=mkPanel(s.c);
  p.innerHTML=
   '<div class="toolbar">'+
   '<input type="search" id="q-'+s.c+'" placeholder="ابحث في '+esc(s.n)+'…">'+
   '<button class="btn on" data-v="all" id="va-'+s.c+'">الكل</button>'+
   '<button class="btn" data-v="rules" id="vr-'+s.c+'">القواعد ('+ad(s.r.length)+')</button>'+
   '<button class="btn" data-v="qs" id="vq-'+s.c+'">الأسئلة ('+ad(s.q.length)+')</button>'+
   '<span class="cnt" id="c-'+s.c+'"></span></div>'+
   '<div id="r-'+s.c+'"></div><div id="l-'+s.c+'"></div>'+
   '<div class="none" id="n-'+s.c+'" style="display:none">لا توجد نتائج مطابقة.</div>';

  var rbox=document.getElementById('r-'+s.c), lbox=document.getElementById('l-'+s.c);
  s.r.forEach(function(r){
    var c=document.createElement('div'); c.className='card rule';
    c.innerHTML='<h3>'+esc(r.t)+'</h3>'+r.b;
    c.setAttribute('data-k',norm(r.t+' '+r.b.replace(/<[^>]+>/g,' ')));
    rbox.appendChild(c);
  });
  s.q.forEach(function(q,i){
    var c=document.createElement('div'); c.className='q';
    c.innerHTML='<div class="num">سؤال '+ad(i+1)+'</div>'+
      '<div class="qt">'+esc(q.q)+'</div>'+
      '<div class="ans">'+esc(q.a)+'</div>'+
      '<div class="exp">'+esc(q.e)+'</div>';
    c.setAttribute('data-k',norm(q.q+' '+q.a+' '+q.e));
    lbox.appendChild(c);
  });

  var mode='all';
  function render(){
    var term=norm(document.getElementById('q-'+s.c).value.trim());
    var rs=rbox.querySelectorAll('.rule'), qq=lbox.querySelectorAll('.q');
    var nr=0,nq=0,k;
    for(k=0;k<rs.length;k++){
      var vis=(mode!=='qs')&&(!term||rs[k].getAttribute('data-k').indexOf(term)>=0);
      rs[k].style.display=vis?'':'none'; if(vis)nr++;
    }
    for(k=0;k<qq.length;k++){
      var v2=(mode!=='rules')&&(!term||qq[k].getAttribute('data-k').indexOf(term)>=0);
      qq[k].style.display=v2?'':'none'; if(v2)nq++;
    }
    document.getElementById('c-'+s.c).textContent='ظاهر: '+ad(nr)+' قاعدة · '+ad(nq)+' سؤال';
    document.getElementById('n-'+s.c).style.display=(nr+nq===0)?'':'none';
  }
  document.getElementById('q-'+s.c).addEventListener('input',render);
  ['va','vr','vq'].forEach(function(pre){
    var b=document.getElementById(pre+'-'+s.c);
    b.addEventListener('click',function(){
      mode=b.getAttribute('data-v');
      ['va','vr','vq'].forEach(function(o){
        document.getElementById(o+'-'+s.c).classList.toggle('on',o===pre);});
      render();
    });
  });
  render();
});

/* ================= وضع الاختبار ================= */
var POOL=[];
D.s.forEach(function(s){
  s.q.forEach(function(q){ if(q.d&&q.d.length===3) POOL.push({s:s.c,n:s.n,q:q.q,a:q.a,e:q.e,d:q.d}); });
});

var secOpts='<option value="*">كل الفروع ('+ad(POOL.length)+' سؤالًا)</option>';
D.s.forEach(function(s){
  var c=0; s.q.forEach(function(q){ if(q.d&&q.d.length===3) c++; });
  if(c>=5) secOpts+='<option value="'+s.c+'">'+esc(s.n)+' ('+ad(c)+')</option>';
});

px.innerHTML=
 '<div class="lead"><b>كيف يعمل وضع الاختبار؟</b> اختر الفرع وعدد الأسئلة ثم اضغط «ابدأ الاختبار». '+
 'تُسحب الأسئلة عشوائيًّا في كل مرة، وتُخلط البدائل الأربعة، ويعمل المؤقّت تلقائيًّا. '+
 'وعند التصحيح تُحتسب الدرجة والنسبة والتقدير، ويُعرض تحت كل سؤال وجهُ الصواب وسببه. '+
 'والبدائل مولَّدة من إجابات الفرع نفسه حتى تكون قريبةً مُلبِسة كما في الاختبار الحقيقي.</div>'+
 '<div class="toolbar">'+
 '<label class="cnt" for="ex-sec">الفرع:</label><select id="ex-sec">'+secOpts+'</select>'+
 '<label class="cnt" for="ex-n">عدد الأسئلة:</label>'+
 '<select id="ex-n"><option>10</option><option selected>20</option><option>30</option>'+
 '<option>50</option></select>'+
 '<button class="btn go" id="ex-go">ابدأ الاختبار</button>'+
 '<button class="btn" id="ex-again" style="display:none">اختبار جديد</button></div>'+
 '<div id="ex-live"></div>';

var live=document.getElementById('ex-live');
var exT0=0, exTimer=null, exItems=[], exDone=false;

function two(n){return (n<10?'0':'')+n;}
function tick(){
  var el=document.getElementById('ex-clock'); if(!el) return;
  var s=Math.floor((Date.now()-exT0)/1000);
  el.textContent=ad(two(Math.floor(s/60))+':'+two(s%60));
}
function shuffle(arr,rnd){
  var i,j,t;
  for(i=arr.length-1;i>0;i--){ j=Math.floor(rnd()*(i+1)); t=arr[i];arr[i]=arr[j];arr[j]=t; }
  return arr;
}
function answered(){
  return live.querySelectorAll('input[type=radio]:checked').length;
}
function refreshProg(){
  var el=document.getElementById('ex-prog');
  if(el) el.textContent='أجبتَ عن '+ad(answered())+' من '+ad(exItems.length);
}

function startExam(){
  var code=document.getElementById('ex-sec').value;
  var want=parseInt(document.getElementById('ex-n').value,10);
  var src=POOL.filter(function(p){ return code==='*'||p.s===code; });
  var seed=Date.now()%2147483647;
  var rnd=function(){ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
  var picked=shuffle(src.slice(),rnd).slice(0,Math.min(want,src.length));
  exItems=picked.map(function(p){
    var opts=shuffle([p.a].concat(p.d),rnd);
    return {p:p,opts:opts};
  });
  exDone=false;

  var h='<div class="exbar"><span class="pill" id="ex-clock">٠٠:٠٠</span>'+
    '<span class="pill" id="ex-prog">أجبتَ عن ٠ من '+ad(exItems.length)+'</span>'+
    '<button class="btn go" id="ex-submit">تصحيح الاختبار</button></div>';
  exItems.forEach(function(it,i){
    h+='<div class="exq" data-i="'+i+'"><div class="num">سؤال '+ad(i+1)+' — '+esc(it.p.n)+'</div>'+
       '<div class="qt">'+esc(it.p.q)+'</div>';
    it.opts.forEach(function(o,k){
      h+='<label class="opt" data-o="'+k+'"><input type="radio" name="ex'+i+'" value="'+k+'">'+
         esc(o)+'</label>';
    });
    h+='<div class="fb" style="display:none"></div></div>';
  });
  h+='<div style="text-align:center;margin:18px 0">'+
     '<button class="btn go" id="ex-submit2">تصحيح الاختبار</button></div>';
  live.innerHTML=h;
  document.getElementById('ex-again').style.display='';

  live.addEventListener('change',function(ev){
    var t=ev.target;
    if(!t||t.type!=='radio'||exDone) return;
    var box=t.closest('.exq');
    var ls=box.querySelectorAll('.opt');
    for(var k=0;k<ls.length;k++) ls[k].classList.remove('sel');
    t.closest('.opt').classList.add('sel');
    refreshProg();
  });
  document.getElementById('ex-submit').addEventListener('click',grade);
  document.getElementById('ex-submit2').addEventListener('click',grade);

  exT0=Date.now();
  if(exTimer) clearInterval(exTimer);
  exTimer=setInterval(tick,1000); tick();
  window.scrollTo(0,0);
}

function grade(){
  if(exDone) return;
  exDone=true;
  if(exTimer){ clearInterval(exTimer); exTimer=null; }
  var secs=Math.floor((Date.now()-exT0)/1000);
  var right=0, blank=0;
  exItems.forEach(function(it,i){
    var box=live.querySelector('.exq[data-i="'+i+'"]');
    var sel=box.querySelector('input[type=radio]:checked');
    var ls=box.querySelectorAll('.opt');
    var good=-1,k;
    for(k=0;k<it.opts.length;k++) if(it.opts[k]===it.p.a) good=k;
    for(k=0;k<ls.length;k++){
      ls[k].classList.remove('sel');
      var oi=parseInt(ls[k].getAttribute('data-o'),10);
      var inp=ls[k].querySelector('input'); if(inp) inp.disabled=true;
      if(oi===good) ls[k].classList.add('good');
      else if(sel&&parseInt(sel.value,10)===oi) ls[k].classList.add('bad');
    }
    var fb=box.querySelector('.fb');
    var hit=sel&&parseInt(sel.value,10)===good;
    if(hit) right++; if(!sel) blank++;
    fb.style.display='';
    fb.innerHTML='<div class="verdict '+(hit?'y':'n')+'">'+
      (hit?'إجابة صحيحة ✓':(sel?'إجابة خاطئة ✗':'لم تُجب ✗'))+'</div>'+
      '<div class="ans">'+esc(it.p.a)+'</div>'+
      '<div class="exp">'+esc(it.p.e)+'</div>';
  });
  var pc=exItems.length?Math.round(right*100/exItems.length):0;
  var gr = pc>=90?'ممتاز':(pc>=80?'جيد جدًّا':(pc>=70?'جيد':(pc>=60?'مقبول':'يحتاج مراجعة')));
  var sc=document.createElement('div');
  sc.className='score'; sc.id='ex-score';
  sc.innerHTML='<span class="pc">'+ad(pc)+'٪</span>'+
    '<div class="gr">'+gr+' — '+ad(right)+' من '+ad(exItems.length)+' إجابة صحيحة</div>'+
    '<div class="dt">الزمن: '+ad(two(Math.floor(secs/60))+':'+two(secs%60))+
    ' · غير مُجاب: '+ad(blank)+' · خطأ: '+ad(exItems.length-right-blank)+'</div>';
  live.insertBefore(sc,live.firstChild);
  window.scrollTo(0,0);
}

document.getElementById('ex-go').addEventListener('click',startExam);
document.getElementById('ex-again').addEventListener('click',startExam);

/* ---------- تبديل التبويبات ---------- */
var all=tabs.querySelectorAll('.tab');
for(var i=0;i<all.length;i++){
  all[i].addEventListener('click',function(){
    var id=this.getAttribute('data-tab'),j;
    for(j=0;j<all.length;j++) all[j].classList.toggle('on',all[j]===this);
    var ps=panels.querySelectorAll('.panel');
    for(j=0;j<ps.length;j++) ps[j].classList.toggle('on',ps[j].id==='p-'+id);
    window.scrollTo(0,0);
  });
}
all[0].classList.add('on');
document.getElementById('p-files').classList.add('on');
})();
</script>
</body>
</html>
