ألة ومواضع بسطها: أسرار البلاغة، ومفتاح العلوم، والإيضاح، والتلخيص.</p></div>"},{"t":"الاستعارة وأنواعها","b":"\n<p><b>الاستعارة</b> تشبيه حُذف أحد طرفيه، وهي مجاز علاقته <b>المشابهة</b>.</p>\n<ul>\n<li><b>تصريحية:</b> صُرّح فيها بلفظ <b>المشبَّه به</b> وحُذف المشبَّه.\nمثالها: إخراج الله المؤمنين «من الظلمات إلى النور» — صُرّح بالظلمات والنور،\nوأُريد الضلال والهدى. ومثالها في الشعر تسمية الدموع لؤلؤًا والخدود وردًا.</li>\n<li><b>مكنية:</b> حُذف فيها <b>المشبَّه به</b> ورُمز له بشيء من لوازمه.\nمثالها إسناد «الإصغاء» و«الآذان» إلى المجد — فقد شُبّه المجد بإنسان وحُذف المشبه به\nورُمز له بلازمه وهو الأذن والإصغاء. ومثالها إسناد الاشتعال إلى الرأس.</li>\n<li><b>تبعية:</b> ما جرت في الفعل أو المشتق أو الحرف لا في الاسم الجامد —\nكاستعمال «القذف» في إبطال الباطل بالحق، فالاستعارة في الفعل.</li>\n<li><b>أصلية:</b> ما جرت في اسم جامد.</li>\n<li><b>مرشَّحة:</b> ذُكر معها ما يلائم المشبَّه به. <b>مجرَّدة:</b> ذُكر معها ما يلائم المشبَّه.\n<b>مطلقة:</b> لم يُذكر معها ملائم لأحدهما.</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الاستعارة تشبيه حُذف أحد طرفيه</b>؛ فإن ذُكر المشبه به فهي <b>تصريحية</b>، وإن حُذف ورُمز إليه بشيء من لوازمه فهي <b>مكنية</b>.</li><li><b>القرينة في المكنية</b> تُسمّى «قرينة تخييلية» وهي اللازم المذكور؛ «وإذا المنيّةُ أنشبت أظفارها» — شُبّهت المنية بسبع، حُذف المشبه به ورُمز إليه بـ«أظفارها». وجه الاستشهاد: استعارة مكنية قرينتها إثبات الأظفار.</li><li><b>الاستعارة التبعية</b> ما جرت في الفعل أو المشتق أو الحرف، والأصلية ما جرت في اسم جامد. ﴿فأذاقها اللهُ لباسَ الجوعِ﴾ فيها أكثر من وجه.</li><li><b>المرشّحة والمجرّدة والمطلقة:</b> المرشّحة ما قُرنت بملائم المشبه به، والمجرّدة ما قُرنت بملائم المشبه، والمطلقة ما خلت منهما. والترشيح أبلغ لأنه إمعان في التناسي.</li><li><b>الفرق بين الاستعارة والمجاز المرسل:</b> علاقة الاستعارة <b>المشابهة</b> دائمًا، وعلاقة المرسل غيرها. فإذا صحّ تقدير «كأنّ» فهي استعارة.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: أسرار البلاغة، والمثل السائر لابن الأثير، والإيضاح، ومفتاح العلوم.</p></div>"},{"t":"الكناية","b":"\n<p><b>الكناية</b> لفظ أُريد به لازم معناه مع جواز إرادة المعنى الأصلي — وهذا هو الفارق بينها وبين المجاز،\nإذ المجاز لا بد فيه من قرينة مانعة.</p>\n<p><b>أقسامها ثلاثة:</b></p>\n<ul>\n<li><b>كناية عن صفة:</b> كالنهي عن غَلّ اليد إلى العنق وعن بسطها كل البسط —\nفالأول كناية عن <b>البخل</b> والثاني عن الإسراف.</li>\n<li><b>كناية عن موصوف:</b> كالتعبير بـ«لغة الضاد» عن العربية.</li>\n<li><b>كناية عن نسبة:</b> كإثبات الصفة لما يتصل بالموصوف لا له مباشرةً.</li>\n</ul>\n<p><b>سرّ بلاغتها:</b> أنها تُعطي الحقيقةَ مصحوبةً بدليلها، فهي إثباتٌ للمعنى بذكر برهانه.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>حدّها:</b> لفظ أُريد به لازم معناه مع جواز إرادة المعنى الأصلي. وبهذا القيد الأخير تفارق المجاز؛ فالمجاز لا تجوز فيه إرادة الأصل لوجود القرينة المانعة.</li><li><b>أقسامها ثلاثة:</b> كناية عن صفة («طويل النجاد» عن طول القامة)، وكناية عن موصوف («الناطق» عن الإنسان)، وكناية عن نسبة («المجد بين ثوبيه»).</li><li><b>سرّ بلاغتها</b> أنها تُعطي الحقيقة مصحوبة بدليلها؛ فهي دعوى مع بيّنة، ولذلك قالوا: الكناية أبلغ من التصريح.</li><li><b>التعريض</b> قريب منها وليس هو إيّاها: التعريض يُفهم من سياق الكلام لا من اللفظ، كقولك للمؤذي: «المسلم من سلم المسلمون من لسانه ويده».</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: دلائل الإعجاز، والإيضاح، والصناعتين، والمثل السائر.</p></div>"},{"t":"المحسنات المعنوية","b":"\n<ul>\n<li><b>الطباق:</b> الجمع بين الشيء وضده في الكلام. وهو <b>طباق إيجاب</b> إذا اختلف اللفظان إثباتًا\n(الظلمات/النور، أشدّاء/رحماء)، و<b>طباق سلب</b> إذا جُمع بين فعلٍ مثبت ومنفيّ من لفظ واحد.</li>\n<li><b>المقابلة:</b> أن يُؤتى بمعنيين أو أكثر ثم بما يقابلهما على الترتيب — كمقابلة الضحك القليل\nبالبكاء الكثير.</li>\n<li><b>التورية:</b> لفظ له معنيان: <b>قريب ظاهر غير مراد</b>، و<b>بعيد خفيّ هو المراد</b>،\nولا بد من قرينة خفية تدل على البعيد وتُسمّى الإيهام. و<b>المجرَّدة</b> منها ما لم يُذكر فيه\nما يلائم القريب ولا البعيد.</li>\n<li><b>المشاكلة:</b> ذكر الشيء بلفظ غيره لوقوعه في صحبته تحقيقًا أو تقديرًا —\nكالتعبير عن جزاء النسيان بلفظ النسيان نفسه، وكالتعبير عن ردّ الجهل بلفظ الجهل في قول عمرو بن كلثوم.</li>\n<li><b>المبالغة:</b> ادّعاء بلوغ الوصف حدًّا مستبعَدًا أو مستحيلًا. وقسّمها السكاكي ثلاثة أقسام:\n<b>تبليغ</b> (ممكن عقلًا وعادةً)، <b>إغراق</b> (ممكن عقلًا لا عادةً)،\n<b>غلوّ</b> (مستحيل عقلًا وعادةً).</li>\n<li><b>التنكيت:</b> أن يقصد المتكلم شيئًا بالذكر دون غيره مما يسدّ مسدّه، لنكتة في المذكور ترجّح مجيئه.</li>\n<li><b>تجاهل العارف:</b> سَوقُ المعلوم مساقَ المجهول لغرض بلاغي كالتعجب أو التدلّه في الحب.</li>\n<li><b>مراعاة النظير:</b> الجمع بين أمور متناسبة غير متضادة.</li>\n<li><b>العكس والتبديل:</b> أن تُقدّم جزءًا من الكلام ثم تعكس فتُؤخّر ما قدّمت وتُقدّم ما أخّرت —\nنحو «عادات السادات سادات العادات».</li>\n<li><b>ما لا يستحيل بالانعكاس (المقلوب/المستوي):</b> عبارة تُقرأ طردًا وعكسًا على صورة واحدة.</li>\n<li><b>الاستدراج:</b> سَوق الكلام مساق اللين والرفق مع إرادة الزجر والوعيد.</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الطباق نوعان:</b> طباق إيجاب (بين ضدّين مثبتين: ﴿وتحسبهم أيقاظًا وهم رقود﴾)، وطباق سلب (بين فعلين أحدهما مثبت والآخر منفي: ﴿قل هل يستوي الذين يعلمون والذين لا يعلمون﴾).</li><li><b>المقابلة</b> أن يُؤتى بمعنيين أو أكثر ثم بما يقابلها على الترتيب؛ ﴿فليضحكوا قليلًا وليبكوا كثيرًا﴾ — وجه الاستشهاد: مقابلة اثنين باثنين مرتّبين.</li><li><b>التورية</b> لفظ له معنيان: قريب ظاهر غير مراد، وبعيد خفيّ هو المراد. وهي من ألطف البديع وأكثره دلالة على حذق الشاعر.</li><li><b>حسن التعليل</b> أن يُنكر المتكلم علّة الشيء المعروفة ويأتي بعلّة أدبية طريفة.</li><li><b>تأكيد المدح بما يشبه الذمّ</b> وعكسه، و<b>أسلوب الحكيم</b>، و<b>المشاكلة</b>، و<b>اللفّ والنشر</b> — كلّها معنوية. واللف والنشر مرتّب ومشوّش.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: البديع لابن المعتز، والإيضاح، وخزانة الأدب لابن حجة، وحلية المحاضرة.</p></div>"},{"t":"المحسنات اللفظية","b":"\n<ul>\n<li><b>الجناس:</b> تشابه اللفظين في النطق واختلافهما في المعنى.\n<b>تامّ:</b> اتفقا في نوع الحروف وعددها وهيئتها وترتيبها.\n<b>ناقص:</b> اختلفا في أحدها — ومنه <b>المحرَّف</b> الذي يختلف بالحركات فقط\nكـ«مَذهَب» و«مُذهَب»، و<b>جناس القلب</b> الذي يختلف بترتيب الحروف كـ«كفّيه» و«فكّيه».</li>\n<li><b>السجع:</b> توافق الفاصلتين في الحرف الأخير من النثر. وأنواعه:\n<b>مطرَّف</b> (اختلفت الفاصلتان وزنًا واتفقتا رويًّا)،\n<b>متوازٍ</b> (اتفقت الكلمتان الأخيرتان وزنًا ورويًّا دون سائر الكلمات)،\n<b>مرصَّع</b> (تقابلت كل لفظة من الفقرة الأولى بلفظة من الثانية في الوزن والروي).\nو<b>الفواصل القرآنية</b> تقابل السجعَ في النثر، غير أن العلماء آثروا تسميتها فواصل تنزيهًا للقرآن.</li>\n<li><b>التصريع:</b> اتفاق نهاية الشطر الأول مع نهاية الشطر الثاني في مطلع القصيدة.</li>\n<li><b>الترصيع:</b> أن تتوازن ألفاظ إحدى الفقرتين مع ما يقابلها من الأخرى وزنًا وقافيةً —\nومثاله الآية التي قابلت نعيم الأبرار بجحيم الفُجّار.</li>\n<li><b>ردّ العجز على الصدر:</b> أن تتكرر لفظة من أول البيت في آخره — كتكرار «سريع/بسريع».</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الجناس نوعان:</b> تامّ (اتفاق اللفظين في نوع الحروف وعددها وهيئتها وترتيبها) وناقص (اختلافهما في واحد من الأربعة).</li><li><b>الجناس التام المشهور:</b> ﴿ويوم تقوم الساعةُ يُقسم المجرمون ما لبثوا غير ساعة﴾ — وجه الاستشهاد: «الساعة» الأولى للقيامة والثانية للزمن، واتفقتا لفظًا واختلفتا معنى.</li><li><b>السجع في النثر كالقافية في الشعر</b>، وأفضله ما تساوت فقراته. وقد عابه النقاد إذا تُكلِّف حتى أفسد المعنى.</li><li><b>الاقتباس والتضمين:</b> الاقتباس تضمين الكلام شيئًا من القرآن أو الحديث من غير إشارة إلى أنه منه، والتضمين أن يُضمَّن شعرًا لغيره.</li><li><b>ردّ العجز على الصدر</b> أن يُجعل أحد اللفظين المكرّرين في أول الكلام والآخر في آخره.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: البديع لابن المعتز، والصناعتين، والإيضاح، وخزانة الأدب.</p></div>"}]},{"c":"arud","n":"العروض والقافية","q":[{"q":"من مؤلف علم العروض؟","a":"الخليل بن أحمد الفراهيدي","e":"استخرج خمسة عشر بحرًا من استقراء كلام العرب، وزاد تلميذه الأخفش بحر المتدارك فصارت ستة عشر. وهو أيضًا واضع أول معجم عربي وهو «العين» المرتَّب على المخارج الصوتية.","d":["البيتان من الشعر","البيت المشطور","البيت المُدوَّر (المُدمَج)"]},{"q":"ما البيت الذي حُذف شطره بالكامل فصار شطرًا واحدًا؟","a":"البيت المشطور","e":"وهو من أشكال البيت الناقص، ويقع في بحور بعينها كالرجز والسريع. ويقابله المنهوك الذي حُذف ثلثاه وبقي ثلثه.","d":["البيتان من الشعر","البيت المُدوَّر (المُدمَج)","الفخر"]},{"q":"ما البيت الذي يشترك شطراه في كلمة واحدة؟","a":"البيت المُدوَّر (المُدمَج)","e":"فتبدأ الكلمة في آخر الصدر وتتمّ في أول العجز، فلا يمكن الوقوف على نهاية الصدر. وسُمّي مدوَّرًا لأن الوزن يدور بين الشطرين بلا فاصل.","d":["البيت المشطور","البيتان من الشعر","الهجاء"]},{"q":"عرّف الإكْفاء","a":"أن يُؤتى في أبيات القصيدة برويّ متجانس في المخرج مختلف في اللفظ","e":"كأن يجعل الرويّ حاءً في بيت وخاءً في آخر، أو سينًا وصادًا. وهو عيب لأن أذن السامع تنتظر حرفًا واحدًا يتكرر فتُفاجَأ بغيره وإن قرُب مخرجه.","d":["المطلقة ما كان رويُّها متحركًا، والمقيَّدة ما كان رويُّها ساكنًا","العَروض آخر تفعيلة في الصدر، والضَّرب آخر تفعيلة في العجز","الزحاف يلحق الحشو وغير لازم، والعلة تلحق العروض والضرب ولازمة"]},{"q":"عرّف الإجازة","a":"الجمع بين رويّين مختلفين في المخرج","e":"كأن يجعل الرويّ دالًا في بيت ولامًا في آخر. وهي أشدّ قبحًا من الإكفاء لأن البُعد بين المخرجين أظهر وأنكى في السمع.","d":["إعادة لفظة القافية بلفظها ومعناها","اتفاق عَروض البيت مع ضربه في الوزن والروي","الجمع بين حركتين مختلفتين متباعدتين في الرويّ"]},{"q":"عرّف الإقْواء","a":"تحريك المَجرى بحركتين مختلفتين غير متباعدتين","e":"أي أن تختلف حركة الرويّ بين الكسرة والضمة مثلًا. وسُمّي إقواءً من القُوّة بمعنى الاختلاف، وهو من أشهر عيوب القافية وقد وقع لفحول الشعراء.","d":["الجمع بين حركتين مختلفتين متباعدتين في الرويّ","إعادة لفظة القافية بلفظها ومعناها","اتفاق عَروض البيت مع ضربه في الوزن والروي"]},{"q":"عرّف الإصراف","a":"الجمع بين حركتين مختلفتين متباعدتين في الرويّ","e":"كالفتحة مع الضمة أو الفتحة مع الكسرة. والفارق بينه وبين الإقواء أن الإقواء بين حركتين متقاربتين والإصراف بين متباعدتين.","d":["الجمع بين رويّين مختلفين في المخرج","اتفاق عَروض البيت مع ضربه في الوزن والروي","إعادة لفظة القافية بلفظها ومعناها"]},{"q":"عرّف الإيطاء","a":"إعادة لفظة القافية بلفظها ومعناها","e":"فإن أُعيدت باختلاف المعنى جاز ولم يكن عيبًا، كلفظة تدل على الرجل مرة وعلى ناظر العين مرة. والعيب إنما هو في تكرار اللفظ والمعنى معًا.","d":["الجمع بين رويّين مختلفين في المخرج","اتفاق عَروض البيت مع ضربه في الوزن والروي","تحريك المَجرى بحركتين مختلفتين غير متباعدتين"]},{"q":"عرّف التضمين في القافية","a":"تعلّق معنى البيت بما بعده تعلّقًا لا يتمّ الكلام بدونه","e":"وهو قبيح إذا توقّف فهم البيت كله على تاليه، ومقبول إذا تمّ فيه بعض المعنى وجاء الثاني مفسِّرًا. وقد عِيب على النابغة تعليقُه لفظة من بيت على ما بعده.","d":["المطلقة ما كان رويُّها متحركًا، والمقيَّدة ما كان رويُّها ساكنًا","أن يُؤتى في أبيات القصيدة برويّ متجانس في المخرج مختلف في اللفظ","الزحاف يلحق الحشو وغير لازم، والعلة تلحق العروض والضرب ولازمة"]},{"q":"عرّف التصريع","a":"اتفاق عَروض البيت مع ضربه في الوزن والروي","e":"ويكون في مطلع القصيدة غالبًا. وفائدته إعلام السامع ببحر القصيدة وقافيتها من أول بيت، ولذلك عُدّ من محسنات المطالع.","d":["الجمع بين حركتين مختلفتين متباعدتين في الرويّ","الجمع بين رويّين مختلفين في المخرج","إعادة لفظة القافية بلفظها ومعناها"]},{"q":"عرّف النُّتفة","a":"البيتان من الشعر","e":"وهي أقل من القطعة التي تكون من ثلاثة إلى ستة أبيات، والقصيدة ما بلغ سبعة فأكثر. وما قيل بيتًا واحدًا يُسمّى اليتيم.","d":["البيت المشطور","البيت المُدوَّر (المُدمَج)","الرثاء"]},{"q":"«أعينيَّ جودا ولا تجمدا» — الغرض الشعري","a":"الرثاء","e":"لأن الخنساء تستنهض عينيها للبكاء على أخيها صخر. وعلامة الرثاء أن الممدوح ميّت وأن الأسلوب مشحون بالحسرة والنداء المتفجّع.","d":["الفخر","الهجاء","المدح"]},{"q":"«دَعِ المكارمَ لا ترحلْ لبُغيتها» — الغرض الشعري","a":"الهجاء","e":"لأن ظاهره نصيحة وباطنه تحقير وتهكم بالممدوح؛ إذ حصره في الطعام واللباس ونفى عنه السعي للمجد. وهذا من الهجاء التهكمي وهو أمضّ من الصريح.","d":["الفخر","الرثاء","المدح"]},{"q":"«وإني وإن كنتُ الأخيرَ زمانُه» — الغرض الشعري","a":"الفخر","e":"لأنه يُثبت لنفسه الإتيان بما عجز عنه المتقدمون. والمقابلة بين «الأخير» و«الأوائل» قرينة واضحة على قصد التفاخر بالسبق.","d":["الرثاء","الهجاء","المدح"]},{"q":"«إن الرسول لنورٌ يُستضاء به» — الغرض","a":"المدح","e":"لأنه أثبت للممدوح صفات الكمال: الهداية والنصرة والمنعة. والبيت من قصيدة البُردة لكعب بن زهير، والغرض الجامع لها المدح النبوي.","d":["الفخر","الرثاء","الهجاء"]},{"q":"«ونشرب إن وردنا الماء صفوًا» — الغرض","a":"الفخر","e":"لأن الشاعر يفاخر بقومه ويجعل لهم صفو الموارد ولغيرهم كدَرها. والمقابلة بين «صفوًا» و«كَدِرًا وطينا» تخدم غرض الفخر وتُبرزه.","d":["الهجاء","المدح","الرثاء"]},{"q":"ما الفرق بين الزِّحاف والعِلّة؟","a":"الزحاف يلحق الحشو وغير لازم، والعلة تلحق العروض والضرب ولازمة","e":"فالزحاف تغيير عارض في ثواني الأسباب يجوز وقوعه في بيت دون بيت. والعلة تغيير في آخر الشطر، فإذا لزمت في بيت لزمت في القصيدة كلها.","d":["العَروض آخر تفعيلة في الصدر، والضَّرب آخر تفعيلة في العجز","المطلقة ما كان رويُّها متحركًا، والمقيَّدة ما كان رويُّها ساكنًا","تعلّق معنى البيت بما بعده تعلّقًا لا يتمّ الكلام بدونه"]},{"q":"ما الفرق بين العَروض والضَّرب؟","a":"العَروض آخر تفعيلة في الصدر، والضَّرب آخر تفعيلة في العجز","e":"وما بينهما يُسمّى الحشو. ويتفقان في البيت المصرَّع، ويختلفان في سائر الأبيات غالبًا.","d":["تعلّق معنى البيت بما بعده تعلّقًا لا يتمّ الكلام بدونه","المطلقة ما كان رويُّها متحركًا، والمقيَّدة ما كان رويُّها ساكنًا","الزحاف يلحق الحشو وغير لازم، والعلة تلحق العروض والضرب ولازمة"]},{"q":"ما القافية المطلقة والمقيَّدة؟","a":"المطلقة ما كان رويُّها متحركًا، والمقيَّدة ما كان رويُّها ساكنًا","e":"وسُمّيت مطلقة لإطلاق حركة الرويّ وما يتبعها من حرف وصل. والمقيَّدة مقيدة بالسكون فلا وصل بعدها.","d":["العَروض آخر تفعيلة في الصدر، والضَّرب آخر تفعيلة في العجز","تعلّق معنى البيت بما بعده تعلّقًا لا يتمّ الكلام بدونه","الزحاف يلحق الحشو وغير لازم، والعلة تلحق العروض والضرب ولازمة"]}],"r":[{"t":"علم العروض ومصطلحاته","b":"\n<p><b>واضع علم العروض:</b> <b>الخليل بن أحمد الفراهيدي</b> — وهو أيضًا واضع أول معجم عربي («العين»)\nوأستاذ سيبويه. واستخرج من كلام العرب خمسة عشر بحرًا، وزاد عليها تلميذه الأخفش بحر <b>المتدارك</b>\nفصارت ستة عشر.</p>\n<p><b>مصطلحات أساسية:</b></p>\n<ul>\n<li><b>البيت:</b> وحدة القصيدة، ويتكون من شطرين: <b>الصدر</b> و<b>العجز</b>.</li>\n<li><b>العَروض:</b> آخر تفعيلة في الصدر. و<b>الضَّرب:</b> آخر تفعيلة في العجز. و<b>الحَشو:</b> ما بينهما.</li>\n<li><b>التفعيلة:</b> وحدة الوزن، وأصولها عشر: فعولن، مفاعيلن، مفاعلتن، فاعلن، فاعلاتن،\nمستفعلن، متفاعلن، مفعولات، فاع لاتن، مستفع لن.</li>\n<li><b>الزِّحاف:</b> تغيير يلحق ثواني الأسباب في الحشو، وهو غير لازم.\nو<b>العِلّة:</b> تغيير يلحق العَروض والضرب، وهي لازمة.</li>\n</ul>\n<p><b>أشكال البيت بحسب تمامه:</b></p>\n<ul>\n<li><b>البيت التامّ:</b> ما استوفى تفعيلاته.</li>\n<li><b>البيت المشطور:</b> ما <b>حُذف شطره بالكامل</b> فصار شطرًا واحدًا بدل شطرين.</li>\n<li><b>البيت المنهوك:</b> ما حُذف ثلثاه وبقي ثلثه.</li>\n<li><b>البيت المُدوَّر (المُدمَج):</b> ما <b>اشترك شطراه في كلمة واحدة</b>، فتبدأ الكلمة في آخر الصدر\nوتتم في أول العجز.</li>\n<li><b>البيت المُصرَّع:</b> ما اتفقت عَروضه مع ضربه في الوزن والروي، ويكون في المطلع غالبًا.</li>\n<li><b>البيت اليتيم:</b> ما قيل منفردًا. و<b>النُّتفة:</b> بيتان. و<b>القطعة:</b> من ثلاثة إلى ستة.\nو<b>القصيدة:</b> سبعة فأكثر.</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>واضع العلم</b> الخليل بن أحمد الفراهيدي، وحصر البحور في خمسة عشر، وزاد عليه تلميذه الأخفش بحر <b>المتدارك</b> (الخبب) فصارت ستة عشر.</li><li><b>الكتابة العروضية أصلها الصوت:</b> ما يُنطق يُكتب وإن لم يُرسم (المشدّد يُفكّ إلى ساكن فمتحرّك، والتنوين نون ساكنة)، وما لا يُنطق يُحذف وإن رُسم (ألف «هذا»، وواو «عمرو»، واللام الشمسية).</li><li><b>الزحاف والعلّة:</b> الزحاف تغيير في ثواني الأسباب غير لازم، والعلّة تغيير في الأوتاد والأسباب يلزم البيت كلّه. فالزحاف جائز غير لازم، والعلّة لازمة.</li><li><b>التفعيلات عشر:</b> فعولن، مفاعيلن، مفاعلتن، فاع لاتن / فاعلن، فاعلاتن، مستفعلن، متفاعلن، مفعولات، مستفع لن.</li><li><b>البحور الصافية</b> ما تكوّن من تكرار تفعيلة واحدة (الكامل، الوافر، الهزج، الرجز، الرمل، المتقارب، المتدارك)، والممزوجة ما تكوّن من تفعيلتين فأكثر.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: العين للخليل ومقدمته، والكافي في العروض والقوافي للتبريزي، وميزان الذهب للهاشمي.</p></div>"},{"t":"القافية والرويّ","b":"\n<p><b>القافية</b> عند الخليل: من آخر حرف في البيت إلى أول ساكن يسبقه مع المتحرك الذي قبل الساكن.\nو<b>الرويّ</b> هو الحرف الذي تُبنى عليه القصيدة وتُنسب إليه، فيقال: قصيدة لاميّة أو ميميّة.</p>\n<p><b>حروف القافية:</b> الرويّ، والوصل، والخروج، والردف، والتأسيس، والدخيل.</p>\n<p><b>حركات القافية:</b> المَجرى (حركة الرويّ)، والنَّفاذ، والحَذو، والإشباع، والرَّسّ، والتوجيه.</p>\n<p><b>أنواع القافية بحسب حركة الرويّ:</b> <b>مُطلَقة</b> إذا كان الرويّ متحركًا،\nو<b>مُقيَّدة</b> إذا كان ساكنًا.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>حدّ القافية عند الخليل:</b> من آخر حرف في البيت إلى أول ساكن يليه مع المتحرّك الذي قبل الساكن. وقيل: هي الكلمة الأخيرة، وقيل: هي الرويّ وحده. والأول هو المعتمد.</li><li><b>الرويّ</b> هو الحرف الذي تُبنى عليه القصيدة وتُنسب إليه (لامية، ميمية). و<b>الوصل</b> ما يليه من حرف لين أو هاء، و<b>الخروج</b> ما بعد هاء الوصل.</li><li><b>حروف القافية ستة:</b> الرويّ، والوصل، والخروج، والردف، والتأسيس، والدخيل. وحركاتها ستّ: المجرى، والنفاذ، والحذو، والإشباع، والرسّ، والتوجيه.</li><li><b>أنواع القافية بالنظر إلى المتحرّكات</b> بين ساكنيها: المترادف، والمتواتر، والمتدارك، والمتراكب، والمتكاوس.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الكافي في العروض والقوافي، والقوافي للأخفش، وميزان الذهب.</p></div>"},{"t":"عيوب القافية الستة","b":"\n<p>ستة عيوب تُنسب إلى الرويّ وحركته، يكثر السؤال عنها بالتعريف:</p>\n<table><tr><th>العيب</th><th>حدّه</th></tr>\n<tr><td><b>الإكْفاء</b></td><td>أن يُؤتى في أبيات القصيدة برويّ <b>متجانس في المخرج</b> مختلف في اللفظ،\nكالحاء والخاء، أو السين والصاد</td></tr>\n<tr><td><b>الإجازة</b></td><td>الجمع بين رويّين <b>مختلفين في المخرج</b> كليًّا، كالدال واللام، أو الباء والقاف</td></tr>\n<tr><td><b>الإقْواء</b></td><td>تحريك المَجرى (أي حركة الرويّ) بحركتين مختلفتين <b>غير متباعدتين</b>،\nكالكسرة والضمة</td></tr>\n<tr><td><b>الإصراف</b></td><td>الجمع بين حركتين <b>متباعدتين</b> في الرويّ، كالفتحة والضمة، أو الفتحة والكسرة</td></tr>\n<tr><td><b>الإيطاء</b></td><td>إعادة لفظة القافية بلفظها ومعناها، وإنما يجوز تكرارها باختلاف المعنى</td></tr>\n<tr><td><b>التضمين</b></td><td>تعلّق معنى البيت بالبيت الذي يليه تعلّقًا لا يتمّ الكلام بدونه، وهو قبيح؛\nويُقبل إذا تمّ فيه بعض المعنى</td></tr></table>\n<p><b>ضابط التفريق بين الإقواء والإصراف:</b> كلاهما اختلافٌ في حركة الرويّ،\nلكن الإقواء بين حركتين <b>متقاربتين</b> (الكسرة والضمة)، والإصراف بين حركتين <b>متباعدتين</b>\n(الفتحة مع الضمة أو مع الكسرة).</p>\n<p><b>وضابط التفريق بين الإكفاء والإجازة:</b> كلاهما اختلافٌ في حرف الرويّ،\nلكن الإكفاء يكون بين حرفين <b>متقاربي المخرج</b>، والإجازة بين حرفين <b>متباعدي المخرج</b>.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الإيطاء</b> إعادة كلمة الرويّ بلفظها ومعناها في أقلّ من سبعة أبيات؛ فإن اختلف المعنى فهو جناس لا إيطاء.</li><li><b>التضمين</b> أن يتعلّق معنى البيت بما بعده تعلّقًا لا يتمّ إلا به، فيكون البيت ناقصًا وحده.</li><li><b>الإقواء</b> اختلاف حركة الرويّ بين الضمّ والكسر، و<b>الإصراف</b> اختلافها بين الفتح وغيره، و<b>السناد</b> اختلاف ما يُراعى قبل الرويّ، و<b>الإكفاء</b> اختلاف حرف الرويّ بحرف قريب المخرج.</li><li><b>الإقواء وقع في الشعر الجاهلي كثيرًا</b> ولم يُعدّ عيبًا فاحشًا عندهم، وإنما استقبحه المولّدون لمّا دقّت أسماعهم.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: القوافي للأخفش، والكافي في العروض والقوافي، والعمدة لابن رشيق.</p></div>"},{"t":"الأغراض الشعرية","b":"\n<ul>\n<li><b>المدح:</b> تعداد محاسن الممدوح من كرم وشجاعة وعدل.</li>\n<li><b>الرثاء:</b> تعداد محاسن الميت مع إظهار الحزن والفجيعة.\nوعلامته الفارقة عن المدح أن المرثيّ ميّت وأن فيه نبرةَ حسرة.</li>\n<li><b>الهجاء:</b> تعداد مثالب المهجوّ، وقد يكون صريحًا أو تهكميًّا ساخرًا.</li>\n<li><b>الفخر:</b> تعداد مفاخر الشاعر أو قومه. وهو مدح وُجّه إلى الذات.</li>\n<li><b>الغزل:</b> ذكر المحبوبة ووصف جمالها، وهو عُذري عفيف وصريح حسّي.</li>\n<li><b>الوصف:</b> تصوير المرئيات والمشاهد، وهو أعمّ الأغراض وأدخلها في غيره.</li>\n<li><b>الحكمة:</b> خلاصة تجربة تُصاغ في بيت موجز سائر.</li>\n<li><b>الاعتذار:</b> غرض بَرَع فيه النابغة الذبياني.</li>\n<li><b>الزهد:</b> غرض نضج في العصر العباسي على يد أبي العتاهية.</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الأغراض الجاهلية الكبرى:</b> المدح، والهجاء، والرثاء، والفخر، والوصف، والغزل، والحكمة، والاعتذار. وزاد الإسلام: الزهد والدعوة، وزاد العباسيون: وصف مظاهر الحضارة والخمريات والطرديات.</li><li><b>الرثاء ثلاثة أنواع:</b> الندب (البكاء على الميت)، والتأبين (تعداد المناقب)، والعزاء (الحكمة في الموت). وأشهر من جمعها الخنساء وأبو تمام.</li><li><b>الاعتذاريات</b> فنّ ارتبط بالنابغة الذبياني في الجاهلية، وأبي فراس الحمداني ضمنًا في رومياته.</li><li><b>الحماسة والفخر</b> يفترقان: الفخر بالنفس والقبيلة، والحماسة في معارك وبطولات. وأشهر دواوين الحماسة ما جمعه أبو تمام.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: العمدة لابن رشيق، ونقد الشعر لقدامة، والموشّح للمرزباني، وتاريخ الأدب العربي.</p></div>"}]},{"c":"adab","n":"الأدب والنقد","q":[{"q":"صاحب «رسالة الغفران»","a":"أبو العلاء المعرّي","e":"وهي رسالة نثرية تخيّل فيها رحلةً إلى العالم الآخر يلقى فيها الشعراء واللغويين ويناقشهم. وتُعدّ من أبدع ما كُتب في الخيال الأدبي العربي.","d":["زهير بن أبي سلمى","أبو علي القالي البغدادي","أبو هلال العسكري"]},{"q":"صاحب «البيان والتبيين» و«البخلاء»","a":"الجاحظ","e":"وهو أبو عثمان عمرو بن بحر، إمام النثر العربي في العصر العباسي. وطريقته الاستطراد والجمع بين الجدّ والهزل، وله أيضًا «الحيوان».","d":["الأموي","أبولّو","تضاد"]},{"q":"كتاب «الأدب الكبير» و«الأدب الصغير» لمن؟","a":"ابن المقفّع","e":"وهو عبد الله بن المقفّع، رائد النثر الفني المترجم عن الفارسية. وله «كليلة ودمنة» التي نقلها إلى العربية فصارت من عيون الأدب.","d":["أبو هلال العسكري","لبيد بن ربيعة","حسان بن ثابت"]},{"q":"كتاب «عيون الأخبار» و«الشعر والشعراء»","a":"ابن قتيبة","e":"وهو أبو محمد عبد الله بن مسلم الدِّينَوَري. و«الشعر والشعراء» من أقدم كتب تراجم الشعراء ونقدهم، وله فيه مقدمة نقدية نفيسة.","d":["لبيد بن ربيعة","حسان بن ثابت","ابن شُهَيد الأندلسي"]},{"q":"كتاب «الأمالي» لمن؟","a":"أبو علي القالي البغدادي","e":"أملاه على طلابه بالأندلس، وهو مجموع من اللغة والأدب والأخبار والأشعار. وسُمّي أمالي لأنه كان يُملى على السامعين فيكتبونه.","d":["الحارث بن حِلِّزة","أبو هلال العسكري","طرفة بن العبد"]},{"q":"كتاب «الكامل في اللغة والأدب»","a":"المبرّد","e":"وهو أبو العباس محمد بن يزيد، إمام نحاة البصرة في عصره. والكتاب جامع بين النحو واللغة والأدب والأخبار.","d":["تضاد","الجاحظ","الأصمعي"]},{"q":"كتاب «العِقد الفريد» لمن؟","a":"ابن عبد ربه الأندلسي","e":"وهو موسوعة أدبية قسّمها مؤلفها على خمسة وعشرين كتابًا سمّى كل واحد باسم جوهرة. ويُعدّ من أشهر ما أُلّف بالأندلس في الأدب.","d":["زهير بن أبي سلمى","ابن قتيبة","عبد الله بن المعتزّ"]},{"q":"كتاب «التوابع والزوابع»","a":"ابن شُهَيد الأندلسي","e":"وهي رسالة تخيّل فيها رحلة إلى وادي الجنّ يلقى فيها شياطين الشعراء والكتّاب. وهي سابقة لرسالة الغفران في الفكرة.","d":["محمد بن عثيمين","ابن قتيبة","محمد بن سلّام الجُمَحي"]},{"q":"كتاب «الصناعتين: الكتابة والشعر»","a":"أبو هلال العسكري","e":"وهو كتاب في البلاغة والنقد يجمع بين صناعتي النظم والنثر. وقد عُني فيه بأبواب الفصاحة والبديع وعيوب الكلام.","d":["أبو علي القالي البغدادي","أبو العتاهية","أبو تمام والبحتري"]},{"q":"صاحب كتاب «البديع»","a":"عبد الله بن المعتزّ","e":"وهو الخليفة العباسي الشاعر، وأول من أفرد البديع بالتأليف وحصر أبوابه الرئيسة في خمسة. وبكتابه استقلّ علم البديع عن سائر علوم البلاغة.","d":["أبو العلاء المعرّي","أبو علي القالي البغدادي","عبيد بن الأبرص"]},{"q":"كتاب «أسرار البلاغة» لمن؟","a":"عبد القاهر الجرجاني","e":"وهو واضع نظرية النظم، وله أيضًا «دلائل الإعجاز». و«أسرار البلاغة» مخصص لعلم البيان: التشبيه والمجاز والاستعارة.","d":["مصطفى لطفي المنفلوطي","النابغة الذبياني","العصر الجاهلي"]},{"q":"صاحب «طبقات فحول الشعراء»","a":"محمد بن سلّام الجُمَحي","e":"وهو أول من رتّب الشعراء طبقاتٍ على أساس نقدي، وقسّمهم عشر طبقات في الجاهلية ومثلها في الإسلام. وله مقدمة نفيسة في نقد الرواية وانتحال الشعر.","d":["الحارث بن حِلِّزة","أبو علي القالي البغدادي","أبو العلاء المعرّي"]},{"q":"صاحب كتاب «نقد الشعر»","a":"قُدامة بن جعفر","e":"وهو أول من حاول وضع حدٍّ منطقي للشعر ومقاييس لجودته. وقسّم عيوب الشعر ومحاسنه تقسيمًا منطقيًّا متأثرًا بالفلسفة اليونانية.","d":["طرفة بن العبد","أبو علي القالي البغدادي","ابن شُهَيد الأندلسي"]},{"q":"صاحب كتاب «الأيام» وما نوعه؟","a":"طه حسين — وهو سيرة ذاتية","e":"رواه عن نفسه بضمير الغائب، وصوّر فيه طفولته في الريف ثم الأزهر ثم فرنسا. وهو من أشهر نصوص السيرة الذاتية في الأدب العربي الحديث.","d":["من المأدُبة، أي الطعام الذي يُدعى إليه الناس","«زينب» لمحمد حسين هيكل","الفرزدق (أو الكُمَيت بحسب الخيارات)"]},{"q":"مؤلف رواية «سارة»","a":"عباس محمود العقاد","e":"وهي روايته الوحيدة، ويغلب عليها التحليل النفسي والفكري أكثر من الحدث. وهي أقرب إلى الدراسة منها إلى السرد القصصي.","d":["سليمان البستاني","العصر العباسي","الإحياء والبعث"]},{"q":"صاحب كتاب «الغِربال»","a":"ميخائيل نعيمة","e":"وهو كتاب نقدي من أدب المهجر، دعا فيه إلى التجديد وتحرير الأدب من القوالب الجامدة. وسُمّي غربالًا لأنه يغربل الأدب فيُبقي الجيّد.","d":["العصر الحديث","خطباء العرب","نجيب محفوظ"]},{"q":"كتاب «العَبَرات»","a":"مصطفى لطفي المنفلوطي","e":"وهو مجموعة قصص ومقالات يغلب عليها الأسى والعاطفة الجيّاشة. وله أيضًا «النظرات»، وأسلوبه مشهور بالسجع الرقيق والنزعة الإصلاحية.","d":["عباس محمود العقاد","محمود سامي البارودي","بديع الزمان الهمَذاني"]},{"q":"أول رواية فنية حديثة في الأدب العربي ومؤلفها","a":"«زينب» لمحمد حسين هيكل","e":"نُشرت سنة ١٩١٤، وعُدّت أول رواية عربية مكتملة الفن من حيث الحبكة ورسم الشخصيات وتصوير البيئة المصرية. ونشرها مؤلفها أول الأمر باسم مستعار.","d":["ديوان «مجد الإسلام» لأحمد محرّم","من المأدُبة، أي الطعام الذي يُدعى إليه الناس","الفرزدق (أو الكُمَيت بحسب الخيارات)"]},{"q":"أول أديب عربي حاز جائزة نوبل في الأدب","a":"نجيب محفوظ","e":"نالها سنة ١٩٨٨ عن مجمل أعماله الروائية. وهو صاحب «الثلاثية» و«زقاق المدق» و«أولاد حارتنا»، ويُعدّ رائد الرواية العربية الواقعية.","d":["العصر العباسي","خطباء العرب","العصر الجاهلي"]},{"q":"أول من ألّف في فن المقامات","a":"بديع الزمان الهمَذاني","e":"ثم جاء الحريري فارتقى بالفن وبلغ به الذروة في «مقاماته». والمقامة حكاية قصيرة مسجوعة ذات بطل وراوٍ ثابتين.","d":["محمود سامي البارودي","عبد القاهر الجرجاني","العصر العباسي"]},{"q":"في أي عصر ظهر فن المقامات؟","a":"العصر العباسي","e":"في أواخره على يد بديع الزمان الهمذاني. وقد نشأ استجابةً لازدهار الصناعة اللفظية ورغبة الأدباء في استعراض ثروتهم اللغوية.","d":["الجاهلي والإسلامي","الإحياء والبعث","أحمد شوقي"]},{"q":"في أي عصر ظهرت المقالة؟","a":"العصر الحديث","e":"لارتباطها بنشأة الصحافة والمطبعة. وهي فن نثري قصير يعالج موضوعًا واحدًا بأسلوب شخصي، وتنقسم إلى ذاتية وموضوعية.","d":["ميخائيل نعيمة","العصر العباسي","النابغة الذبياني"]},{"q":"في أي عصر ظهرت الخمريات ناضجةً؟","a":"العصر العباسي","e":"على يد أبي نواس الذي جعلها فنًّا مستقلًّا له مقدماته وصوره. وقد كانت قبله مجرد مقدمة أو مقطوعة ضمن أغراض أخرى.","d":["النابغة الذبياني","خطباء العرب","العصر الجاهلي"]},{"q":"في أي عصر ظهرت النقائض؟","a":"العصر الأموي","e":"وأقطابها جرير والفرزدق والأخطل. وهي قصائد يعارض فيها الشاعر خصمه في الوزن والقافية ويردّ عليه بالهجاء والفخر.","d":["خطباء العرب","الأعشى ميمون","الإحياء والبعث"]},{"q":"في أي عصر شاع الوقوف على الأطلال؟","a":"العصر الجاهلي","e":"لارتباطه بحياة البداوة والترحال، فصار مقدمة تقليدية للقصيدة. واستمر بعد ذلك على سبيل المحاكاة والالتزام بعمود الشعر.","d":["أحمد شوقي","نجيب محفوظ","حافظ إبراهيم"]},{"q":"الشعر العُذري ظهر في العصر…","a":"الأموي","e":"في بوادي الحجاز ونجد، ومن أعلامه جميل بثينة وقيس بن الملوَّح وكُثيّر عزة. وسُمّي عذريًّا نسبةً إلى بني عُذرة الذين اشتهروا بالحب العفيف.","d":["المبرّد","المهجر","الأصمعي"]},{"q":"من أشهر شعراء صدر الإسلام","a":"حسان بن ثابت","e":"وهو شاعر الرسول صلى الله عليه وسلم الذي دافع عن الدعوة بشعره. وقد عاش جاهليةً وإسلامًا، فشعره جسر بين العصرين.","d":["ابن المقفّع","لبيد بن ربيعة","كعب بن زهير"]},{"q":"الشاعر الذي اشتُهر بمدح الرسول صلى الله عليه وسلم في العصر الأموي","a":"الفرزدق (أو الكُمَيت بحسب الخيارات)","e":"فللفرزدق قصيدته المشهورة في مدح زين العابدين، وللكُميت «الهاشميات» في مدح آل البيت. أما شاعر الرسول في حياته فحسان بن ثابت.","d":["عنترة بن شداد — على البحر الكامل","ديوان «مجد الإسلام» لأحمد محرّم","«زينب» لمحمد حسين هيكل"]},{"q":"الشاعر العباسي الذي اشتُهر بالزهد","a":"أبو العتاهية","e":"تحوّل من الغزل واللهو إلى الزهد فجعله فنًّا قائمًا بذاته. وتميّز شعره بسهولة اللفظ وكثرة الحكمة والتذكير بالموت.","d":["أبو علي القالي البغدادي","عروة بن الورد","كعب بن زهير"]},{"q":"من شعراء الصعاليك","a":"عروة بن الورد","e":"ويُلقَّب «عروة الصعاليك» لأنه كان يجمعهم ويُطعمهم. ومن الصعاليك أيضًا الشنفرى وتأبّط شرًّا والسُّليك بن السُّلَكة.","d":["حسان بن ثابت","قُدامة بن جعفر","عمرو بن كلثوم"]},{"q":"من شعراء العصر المملوكي","a":"ابن الوردي","e":"صاحب «اللامية» المشهورة في الحكمة والنصح. وغلب على شعر عصره الإكثار من المحسنات البديعية والتصنيع اللفظي.","d":["ابن المقفّع","امرؤ القيس","محمد بن عثيمين"]},{"q":"مؤسس مدرسة المهجر","a":"جبران خليل جبران","e":"أسّس «الرابطة القلمية» في نيويورك مع ميخائيل نعيمة وإيليا أبو ماضي وغيرهم. ودعت المدرسة إلى التحرر من القيود الشكلية والتعبير عن الذات.","d":["حافظ إبراهيم","كثرة الشعر وجودته","العصر الجاهلي"]},{"q":"مدرسة الإحياء والبعث رائدها…","a":"محمود سامي البارودي","e":"أعاد للشعر العربي جزالته ومتانته بمحاكاة الفحول القدامى. وتبعه شوقي وحافظ، واهتمت المدرسة بالقضايا الوطنية والسياسية.","d":["النابغة الذبياني","كثرة الشعر وجودته","العصر الحديث"]},{"q":"المدرسة التي اهتمت بالقضايا الوطنية","a":"الإحياء والبعث","e":"لأن شعراءها عاصروا الاحتلال ونهضة الوعي القومي، فجعلوا الشعر منبرًا للدفاع عن الوطن. وهذا ما يميّزها عن أبولّو والديوان ذواتَي النزعة الوجدانية.","d":["حافظ إبراهيم","العصر العباسي","جبران خليل جبران"]},{"q":"ينتمي الشاعر إبراهيم ناجي إلى مدرسة…","a":"أبولّو","e":"وهي مدرسة رومانسية وجدانية أسّسها أحمد زكي أبو شادي. وأشهر قصائد ناجي «الأطلال»، وفيها تتجلى النزعة الحزينة والموسيقى العذبة.","d":["المهجر","المتنبي","المبرّد"]},{"q":"ينتمي الشاعر إيليا أبو ماضي إلى مدرسة…","a":"المهجر","e":"وهو من أعلام الرابطة القلمية في أمريكا الشمالية. وأشهر قصائده «الطلاسم»، ويغلب على شعره التأمل الفلسفي والنزعة التفاؤلية.","d":["تضاد","الأصمعي","المبرّد"]},{"q":"مدرسة «عبيد الشعر» نشطت بين شعراء العصر…","a":"الجاهلي والإسلامي","e":"وهي مدرسة التنقيح والتهذيب التي يحبس أصحابها القصيدة حولًا كاملًا قبل إذاعتها. ولذلك سُمّيت قصائدهم «الحوليات»، ومن أعلامها زهير بن أبي سلمى.","d":["بديع الزمان الهمَذاني","العصر الجاهلي","محمود سامي البارودي"]},{"q":"يُعدّ زهير بن أبي سلمى من مدرسة…","a":"عبيد الشعر","e":"لأنه كان ينقّح قصيدته ويعيد النظر فيها حولًا كاملًا. وقد أثمر ذلك شعرًا محكم البناء كثير الحكمة، ولهذا فضّله عمر بن الخطاب رضي الله عنه.","d":["الأعشى ميمون","الإحياء والبعث","خطباء العرب"]},{"q":"الشاعر الذي يفضّله عمر بن الخطاب رضي الله عنه","a":"زهير بن أبي سلمى","e":"لأنه كان لا يمدح الرجل إلا بما فيه، ولا يتبع حُوشيّ الكلام. فاجتمع في شعره صدق الوصف وعفّة اللفظ وكثرة الحكمة.","d":["لبيد بن ربيعة","ابن عبد ربه الأندلسي","أبو العتاهية"]},{"q":"الشاعر الذي يفضّله أبو بكر الصديق رضي الله عنه","a":"النابغة الذبياني","e":"لجودة سبكه وحسن ديباجته ورصانة أسلوبه. وكان النابغة حَكَمًا يُحتكم إليه في سوق عكاظ فتُضرب له قبة من أدم.","d":["جبران خليل جبران","الإحياء والبعث","كثرة الشعر وجودته"]},{"q":"الشاعر الذي يفضّله عليّ بن أبي طالب رضي الله عنه","a":"امرؤ القيس","e":"لأنه قال: إنه أسبقهم إلى الابتكار ولم يقل على مثال. وقد وُصف بأنه فتح للشعراء أبواب المعاني وابتدع ما تبعوه فيه.","d":["زهير بن أبي سلمى","أبو تمام والبحتري","حسان بن ثابت"]},{"q":"الشاعر الملقَّب بـ«أمير الشعراء»","a":"أحمد شوقي","e":"بويع بالإمارة في حفل كبير سنة ١٩٢٧. وهو رائد المسرح الشعري العربي، وله «مصرع كليوباترا» و«مجنون ليلى».","d":["نجيب محفوظ","الأعشى ميمون","عباس محمود العقاد"]},{"q":"الشاعر الملقَّب بـ«شاعر النيل»","a":"حافظ إبراهيم","e":"لكثرة تغنّيه بمصر ونيلها وتصويره لهموم الشعب. وعُرف بأنه شاعر الاجتماعيات، في مقابل شوقي شاعر المناسبات الكبرى.","d":["النابغة الذبياني","الأعشى ميمون","العصر الجاهلي"]},{"q":"الشاعر الملقَّب بـ«ديك الجنّ»","a":"عبد السلام بن رغبان","e":"شاعر عباسي من حمص، قيل لُقّب بذلك لخضرة عينيه. واشتُهر بقصة مأساوية قتل فيها محبوبته ثم رثاها.","d":["ابن عبد ربه الأندلسي","عبيد بن الأبرص","زهير بن أبي سلمى"]},{"q":"من هما «الطائيّان»؟","a":"أبو تمام والبحتري","e":"وسُمّيا بذلك لانتسابهما معًا إلى قبيلة طيّئ. وقد مثّلا مذهبين متقابلين: أبو تمام مذهب الصنعة والتعقيد، والبحتري مذهب السهولة وعمود الشعر.","d":["أبو العلاء المعرّي","أبو هلال العسكري","عبد الله بن المعتزّ"]},{"q":"الشاعر الذي قتله شعره","a":"المتنبي","e":"فقد هجا ضبّة بن يزيد هجاءً مُقذعًا، فتعرّض له خاله فاتك الأسدي وقتله. ويُروى أنه همّ بالفرار فذُكّر ببيته في الفخر بالشجاعة فعاد فقُتل.","d":["المهجر","الأصمعي","تضاد"]},{"q":"الشاعر الذي قال: «الشعر نَكِدٌ بابه الشرّ»","a":"الأصمعي","e":"ومعنى العبارة أن الشعر يجود في أغراض الشر كالهجاء ويلين عن أغراض الخير. واستدل بأن من جوّد في الخير لان شعره كحسان حين دخل الإسلام.","d":["المتنبي","تضاد","أبولّو"]},{"q":"من مقاييس المفاضلة بين الشعراء عند ابن سلّام","a":"كثرة الشعر وجودته","e":"مع تعدد الأغراض وصحة الرواية والشهرة. ولم يجعل غموض المعنى مقياسًا، بل عدّه عيبًا؛ فالمعيار عنده الكمّ والكيف معًا.","d":["عباس محمود العقاد","النابغة الذبياني","العصر الحديث"]},{"q":"عرّف «الأدب» في العصر الجاهلي","a":"من المأدُبة، أي الطعام الذي يُدعى إليه الناس","e":"فـ«أدَب» بمعنى صنع مأدبة أو دعا إليها. ثم انتقل المعنى في الإسلام إلى التهذيب والتخلّق، ثم استقر في العصور المتأخرة على الفنون القولية.","d":["عنترة بن شداد — على البحر الكامل","ديوان «مجد الإسلام» لأحمد محرّم","«زينب» لمحمد حسين هيكل"]},{"q":"أكثر مجالات الأدب مناسبةً للنقد الأدبي","a":"النصوص الأدبية الصادقة","e":"لأن النقد يقيس صدق التجربة الشعورية وأصالة التعبير وجمال الصياغة. ولا مجال له في الكتابة العلمية التقريرية ولا في الأدب الموجَّه المصنوع.","d":["جبران خليل جبران","كثرة الشعر وجودته","بديع الزمان الهمَذاني"]},{"q":"من ترجم «الإلياذة» إلى العربية؟","a":"سليمان البستاني","e":"نقلها شعرًا موزونًا مقفّى وقدّم لها بمقدمة ضافية في الأدب المقارن. وتُعدّ ترجمته من أعظم الأعمال الترجمية في النهضة العربية.","d":["عباس محمود العقاد","الأعشى ميمون","حافظ إبراهيم"]},{"q":"ما «الإلياذة الإسلامية»؟","a":"ديوان «مجد الإسلام» لأحمد محرّم","e":"سُمّي كذلك لأنه حاكى فيه الملحمة اليونانية بنفَسٍ إسلامي، فصاغ السيرة النبوية شعرًا ملحميًّا. وهو من أبرز محاولات الملحمة في الشعر العربي الحديث.","d":["«زينب» لمحمد حسين هيكل","من المأدُبة، أي الطعام الذي يُدعى إليه الناس","طه حسين — وهو سيرة ذاتية"]},{"q":"مؤلف «مصرع كليوباترا»","a":"أحمد شوقي","e":"وهي مسرحية شعرية تاريخية. وشوقي رائد المسرح الشعري العربي، وله أيضًا «مجنون ليلى» و«قمبيز» و«علي بك الكبير».","d":["العصر العباسي","العصر الحديث","العصر الأموي"]},{"q":"معلقة «عفتِ الديارُ محلُّها فمُقامُها» لمن؟","a":"لبيد بن ربيعة","e":"وهو من المخضرمين الذين أدركوا الجاهلية والإسلام، ويُروى أنه ترك الشعر بعد إسلامه. ومعلقته من أرقّ المعلقات في وصف الديار والظعائن.","d":["ابن الوردي","أبو العتاهية","ابن المقفّع"]},{"q":"معلقة «ودِّعْ هُريرةَ إن الركبَ مرتحلُ» لمن؟","a":"الأعشى ميمون","e":"ويُلقَّب «صنّاجة العرب» لحسن موسيقى شعره. ومعلقته من المعلقات العشر في الروايات التي تتجاوز السبع.","d":["النابغة الذبياني","العصر الأموي","عبيد الشعر"]},{"q":"معلقة «يا دارَ ميّةَ بالعَلياءِ فالسَّنَدِ» لمن؟","a":"النابغة الذبياني","e":"وهو أحد حُكّام الشعر في سوق عكاظ. وقد اشتُهر باعتذارياته للنعمان بن المنذر وهي من أجود ما قيل في الاعتذار.","d":["العصر الأموي","عبد القاهر الجرجاني","كثرة الشعر وجودته"]},{"q":"معلقة «قفا نبكِ من ذكرى حبيبٍ ومنزلِ» لمن؟","a":"امرؤ القيس","e":"وهي أشهر المعلقات وأولها في أكثر الروايات. وقد وُصف بأنه سابق الشعراء إلى الوقوف على الأطلال والبكاء على الديار.","d":["أبو علي القالي البغدادي","طرفة بن العبد","أبو هلال العسكري"]},{"q":"معلقة «هل غادرَ الشعراءُ من مُتردَّمِ» لمن؟ وعلى أي بحر؟","a":"عنترة بن شداد — على البحر الكامل","e":"وتُلقَّب بالذهبية. ومطلعها تساؤل عن بقاء معنًى لم يسبق إليه الشعراء، وهو تصريح مبكر بهمّ الابتكار عند الشاعر.","d":["الفرزدق (أو الكُمَيت بحسب الخيارات)","طه حسين — وهو سيرة ذاتية","ديوان «مجد الإسلام» لأحمد محرّم"]},{"q":"معلقة «ألا هُبِّي بصحنِكِ فاصبَحِينا» لمن؟","a":"عمرو بن كلثوم","e":"وهي معلقة قائمة على الفخر بقبيلة تغلب حتى قيل إنها ألهت بني تغلب عن المكارم. وفيها من المبالغة في الفخر ما صار مثلًا.","d":["كعب بن زهير","الحارث بن حِلِّزة","لبيد بن ربيعة"]},{"q":"معلقة «لِخَولةَ أطلالٌ ببُرقةِ ثَهمَدِ» لمن؟","a":"طرفة بن العبد","e":"وهو أصغر أصحاب المعلقات سنًّا، قُتل شابًّا. ومعلقته تجمع بين وصف الناقة وحكمة بالغة في قِصَر العمر ومصارع الأيام.","d":["لبيد بن ربيعة","أبو هلال العسكري","عمرو بن كلثوم"]},{"q":"معلقة «أمِن أمِّ أوفى دِمنةٌ لم تكلَّمِ» لمن؟","a":"زهير بن أبي سلمى","e":"وهي معلقة الحكمة والسلام، نظمها في مدح الساعيين في إصلاح حرب داحس والغبراء. وخاتمتها من أشهر أبواب الحكمة في الشعر الجاهلي.","d":["عمرو بن كلثوم","امرؤ القيس","قُدامة بن جعفر"]},{"q":"معلقة «آذَنَتْنا ببَينِها أسماءُ» لمن؟","a":"الحارث بن حِلِّزة","e":"وهو من قبيلة بكر، نظمها مفاخرًا ومحاجًّا أمام عمرو بن هند في مقابل معلقة عمرو بن كلثوم التغلبي. فهي معلقة خصومة وحِجاج.","d":["أبو علي القالي البغدادي","ابن شُهَيد الأندلسي","أبو هلال العسكري"]},{"q":"معلقة «أقفَرَ من أهلِه مَلحوبُ» لمن؟","a":"عبيد بن الأبرص","e":"وهو شاعر جاهلي قديم من بني أسد. ومعلقته تُعدّ من المعلقات العشر، وتمتاز بقِصَر تفعيلاتها واختلاف بنائها عن سائر المعلقات.","d":["لبيد بن ربيعة","كعب بن زهير","أبو تمام والبحتري"]},{"q":"مطلع «بانت سعادُ» لمن؟","a":"كعب بن زهير","e":"وهي قصيدة «البُردة» التي أنشدها بين يدي النبي صلى الله عليه وسلم معتذرًا فعفا عنه وكساه بُردته. وهي من أشهر قصائد الاعتذار والمدح النبوي.","d":["زهير بن أبي سلمى","امرؤ القيس","الحارث بن حِلِّزة"]},{"q":"قُسّ بن ساعدة هو من أشهر…","a":"خطباء العرب","e":"وهو أسقف نجران، اشتُهر بخطبته في سوق عكاظ وبسجعه البليغ وحكمته. ويُضرب به المثل في الفصاحة فيقال: «أبلغ من قُسّ».","d":["العصر العباسي","العصر الأموي","نجيب محفوظ"]},{"q":"«الخلاء والعُمران» بينهما…","a":"تضاد","e":"فالخلاء هو المكان القفر الخالي، والعمران هو المأهول المبنيّ. والتضاد في اللفظين هو مبنى المحسّن البديعي المسمّى الطباق.","d":["الجاحظ","المهجر","الأموي"]},{"q":"من الشعراء السعوديين التقليديين","a":"محمد بن عثيمين","e":"وهو من شعراء الاتجاه الكلاسيكي المحافظ على عمود الشعر. أما غازي القصيبي وأحمد الصالح وسعد الحميدين فمن أصحاب الاتجاهات الحديثة.","d":["لبيد بن ربيعة","أبو تمام والبحتري","ابن المقفّع"]}],"r":[{"t":"المعلّقات العشر وشعراؤها","b":"\n<p>المعلقات قصائد جاهلية طوال بلغت الذروة في الجودة، وسُمّيت معلقات لأنها — في الرواية المشهورة —\nعُلّقت على أستار الكعبة، وقيل لأنها علِقت بالأذهان. وهي سبع في أشهر الروايات، وتُتمّ عشرًا\nبزيادة الأعشى والنابغة وعبيد بن الأبرص.</p>\n<table><tr><th>الشاعر</th><th>مفتاح المطلع</th></tr>\n<tr><td>امرؤ القيس</td><td>«قِفا نَبكِ من ذِكرى حبيبٍ ومنزلِ»</td></tr>\n<tr><td>طرفة بن العبد</td><td>«لِخَولةَ أطلالٌ ببُرقةِ ثَهمَدِ»</td></tr>\n<tr><td>زهير بن أبي سُلمى</td><td>«أمِن أمِّ أوفى دِمنةٌ لم تكلَّمِ»</td></tr>\n<tr><td>لبيد بن ربيعة</td><td>«عفتِ الديارُ مَحَلُّها فمُقامُها»</td></tr>\n<tr><td>عمرو بن كلثوم</td><td>«ألا هُبِّي بصَحنِكِ فاصبَحِينا»</td></tr>\n<tr><td>عنترة بن شداد</td><td>«هل غادرَ الشعراءُ من مُتردَّمِ»</td></tr>\n<tr><td>الحارث بن حِلِّزة</td><td>«آذَنَتْنا ببَينِها أسماءُ»</td></tr>\n<tr><td>الأعشى ميمون</td><td>«ودِّعْ هُريرةَ إنّ الرَّكبَ مُرتحِلُ»</td></tr>\n<tr><td>النابغة الذبياني</td><td>«يا دارَ ميّةَ بالعَلياءِ فالسَّنَدِ»</td></tr>\n<tr><td>عبيد بن الأبرص</td><td>«أقفَرَ من أهلِه مَلحوبُ»</td></tr></table>\n<p><b>ملاحظة:</b> معلقة عنترة تُلقَّب بـ«الذهبية» وهي على <b>البحر الكامل</b>.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>سبب التسمية:</b> قيل عُلّقت على أستار الكعبة، وقيل سُمّيت بذلك لعلوقها بالأذهان، وقيل لأنها كالعقود المعلّقة في النفاسة. والرواية الأولى ضعّفها كثير من المحقّقين.</li><li><b>عددها مختلف فيه:</b> سبع عند الأكثرين (امرؤ القيس، طرفة، زهير، لبيد، عمرو بن كلثوم، عنترة، الحارث بن حِلِّزة)، وتُزاد ثلاث فتصير عشرًا (الأعشى، النابغة، عبيد بن الأبرص).</li><li><b>أول من جمعها</b> حمّاد الراوية فيما اشتُهر، وتُسمّى أيضًا «المذهّبات» و«السموط» و«المطوّلات».</li><li><b>بناء القصيدة الجاهلية</b> ثلاثي: الوقوف على الأطلال والبكاء، ثم الرحلة ووصف الناقة، ثم الغرض المقصود. وهذا البناء هو ما تمرّد عليه أبو نواس بعد ذلك.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: طبقات فحول الشعراء لابن سلّام، والشعر والشعراء لابن قتيبة، وشرح القصائد السبع للأنباري.</p></div>"},{"t":"مدارس الشعر ومذاهبه","b":"\n<ul>\n<li><b>عبيد الشعر (الحَوليّات):</b> مدرسة نشأت في <b>العصر الجاهلي</b> واستمرت في صدر الإسلام،\nقوامها تنقيح القصيدة وتهذيبها وعرضها على النقاد قبل إذاعتها. وأشهر أعلامها\n<b>زهير بن أبي سلمى</b> و<b>الحُطيئة</b>.</li>\n<li><b>مدرسة الإحياء والبعث:</b> رائدها <b>محمود سامي البارودي</b>، ومن أعلامها شوقي وحافظ.\nعادت بالشعر إلى متانة الأسلوب القديم وجزالته، واهتمت بـ<b>القضايا الوطنية</b> والسياسية.</li>\n<li><b>مدرسة الديوان:</b> العقاد والمازني وعبد الرحمن شكري — دعت إلى الوحدة العضوية والذاتية.</li>\n<li><b>مدرسة أبولّو:</b> أحمد زكي أبو شادي وإبراهيم ناجي وعلي محمود طه — غلب عليها\nالرومانسية والنزعة الوجدانية.</li>\n<li><b>مدرسة المهجر:</b> أسّسها المهاجرون العرب في الأمريكتين، ومن أبرز أعلامها\n<b>جبران خليل جبران</b> و<b>ميخائيل نعيمة</b> و<b>إيليا أبو ماضي</b>.</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>مدرسة الإحياء (الكلاسيكية)</b> رائدها محمود سامي البارودي، وتبعه شوقي وحافظ، ومنهجها محاكاة عمود الشعر القديم في جزالة اللفظ ومتانة الأسلوب.</li><li><b>مدرسة الديوان</b> (العقاد، المازني، عبد الرحمن شكري) سُمّيت بكتاب «الديوان» الذي نقدا فيه شوقيًا، ودعت إلى الوحدة العضوية والتعبير عن النفس والشعر الوجداني.</li><li><b>مدرسة أبوللو</b> أسّسها أحمد زكي أبو شادي سنة ١٩٣٢م، وأوّل رئيس لجماعتها أحمد شوقي، ومن أعلامها إبراهيم ناجي وعلي محمود طه. وخصائصها: الحنين إلى الطبيعة، والتشخيص، والعناوين المبتكرة.</li><li><b>مدرسة المهجر</b> قسمان: الرابطة القلمية في الشمال (جبران، ميخائيل نعيمة، إيليا أبو ماضي) والعصبة الأندلسية في الجنوب (الشاعر القروي، إلياس فرحات). والشمالية أكثر تحرّرًا وتجديدًا.</li><li><b>الشعر الحر (شعر التفعيلة)</b> بدأ في العراق أواخر الأربعينيات، وتُنازَع الريادة بين نازك الملائكة وبدر شاكر السيّاب. ووحدته التفعيلة لا البيت.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: تاريخ الأدب العربي لشوقي ضيف، والاتجاهات الأدبية الحديثة، ودراسات في الشعر العربي المعاصر.</p></div>"},{"t":"العصور الأدبية وخصائصها وفنونها","b":"\n<table><tr><th>العصر</th><th>من فنونه وظواهره</th></tr>\n<tr><td>الجاهلي</td><td>المعلقات، الوقوف على الأطلال، الصعاليك، الحكمة، الفخر والحماسة</td></tr>\n<tr><td>صدر الإسلام</td><td>شعر الدعوة والدفاع عنها، وأبرز شعرائه <b>حسان بن ثابت</b> شاعر الرسول</td></tr>\n<tr><td>الأموي</td><td><b>النقائض</b> (جرير والفرزدق والأخطل)، <b>الشعر العذري</b>، الشعر السياسي</td></tr>\n<tr><td>العباسي</td><td><b>الخمريات</b>، <b>الزهد</b> (أبو العتاهية)، <b>المقامات</b>، ازدهار النثر الفني</td></tr>\n<tr><td>الأندلسي</td><td>الموشحات، الأزجال، رثاء المدن، شعر الطبيعة</td></tr>\n<tr><td>المملوكي</td><td>كثرة البديع والتصنيع، ومن شعرائه <b>ابن الوردي</b></td></tr>\n<tr><td>الحديث</td><td><b>المقالة</b>، الرواية، القصة القصيرة، المسرح، الشعر الحر</td></tr></table>\n<p><b>فنّ المقامات:</b> ظهر في <b>العصر العباسي</b>، وأول من ابتكره <b>بديع الزمان الهمَذاني</b>،\nثم بلغ الذروة على يد <b>الحريري</b>. وهي حكايات قصيرة مسجوعة تدور حول بطل متسوّل أديب وراوٍ ثابت.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>حدود العصور:</b> الجاهلي (نحو ١٥٠ سنة قبل الإسلام)، صدر الإسلام وبنو أمية (١هـ–١٣٢هـ)، العباسي (١٣٢هـ–٦٥٦هـ)، عصر الدول المتتابعة (٦٥٦هـ–١٢١٣هـ)، ثم الحديث.</li><li><b>الأموي:</b> ازدهر الشعر السياسي لتعدّد الأحزاب، والنقائض (جرير والفرزدق والأخطل)، والغزل بنوعيه: الصريح الحضري (عمر بن أبي ربيعة) والعذري البدوي (جميل بثينة، مجنون ليلى، كُثيّر عزّة). وبلغت الخطابة أوجها لكثرة الفتن.</li><li><b>العباسي:</b> نُقلت العاصمة إلى بغداد فتأثر العرب بالفرس؛ فظهرت الزندقة والشعوبية والمجون، وقابلها الزهد والنسك. وازدهرت الترجمة في عهد المأمون وقبله الرشيد، ونشأ علم الكلام، وعُدّ العصر الذهبي للنثر.</li><li><b>الأندلسي:</b> فُتحت الأندلس سنة ٩٢هـ، وابتكر أهلها <b>الموشحات</b> و<b>الزجل</b>، وبرعوا في وصف الطبيعة (الروضيات والزهريات) و<b>رثاء المدن والممالك</b>. ومن أشهر نثرهم «طوق الحمامة» لابن حزم.</li><li><b>مثال على رثاء المدن:</b> «لِكلِّ شيءٍ إذا ما تمَّ نقصانُ / فلا يُغَرَّ بطيبِ العيشِ إنسانُ» — وجه الاستشهاد: افتتاح الرثاء بحكمة عامة ثم الانتقال إلى البكاء على الممالك.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: تاريخ الأدب العربي لشوقي ضيف، والذخيرة لابن بسّام، ونفح الطيب للمقّري.</p></div>"},{"t":"ألقاب الشعراء والأدباء","b":"\n<table><tr><th>اللقب</th><th>صاحبه</th><th>سببه</th></tr>\n<tr><td>أمير الشعراء</td><td>أحمد شوقي</td><td>بويع بإمارة الشعر سنة ١٩٢٧</td></tr>\n<tr><td>شاعر النيل</td><td>حافظ إبراهيم</td><td>لتغنّيه بمصر ونيلها وشعبها</td></tr>\n<tr><td>شاعر القطرين</td><td>خليل مطران</td><td>لنشأته بين لبنان ومصر</td></tr>\n<tr><td>الطائيّان</td><td>أبو تمام والبحتري</td><td>لانتسابهما إلى قبيلة طيّئ</td></tr>\n<tr><td>ديك الجنّ</td><td>عبد السلام بن رغبان</td><td>قيل لخضرة عينيه</td></tr>\n<tr><td>المتنبي</td><td>أحمد بن الحسين</td><td>قيل لادّعائه النبوة في صباه، وقُتل بسبب شعره</td></tr>\n<tr><td>شاعر الرسول</td><td>حسان بن ثابت</td><td>لدفاعه عن الدعوة بشعره</td></tr></table>\n<p><b>تفضيلات الخلفاء المرويّة:</b> كان أبو بكر رضي الله عنه يُفضّل <b>النابغة الذبياني</b>،\nوعمر رضي الله عنه يُفضّل <b>زهير بن أبي سلمى</b> لعفّة شعره وحكمته،\nوعليّ رضي الله عنه يُفضّل <b>امرأ القيس</b> لسَبْقه وابتكاره.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الألقاب أنواع:</b> ما كان لحادثة («الملك الضلّيل» لامرئ القيس)، وما كان لصفة خَلقية («الأعشى» لضعف بصره، «الأعمى» لبشّار)، وما كان لمعنى فنّي («جنّان الأندلس» لابن خفاجة لكثرة وصفه الجنان).</li><li><b>«حكيم الشعراء»</b> زهير بن أبي سُلمى لكثرة حِكَمه، و«شاعر النبي» حسّان بن ثابت، و«أمير الشعراء» أحمد شوقي، و«شاعر النيل» حافظ إبراهيم، و«شاعر القطرين» خليل مطران.</li><li><b>«صريع الغواني»</b> مسلم بن الوليد، و«ذو الرمّة» غيلان بن عقبة، و«المتنبي» لادّعائه النبوة في صباه فيما قيل، و«البحتري» نسبة إلى بُحتر بطن من طيّئ.</li><li><b>تنبيه:</b> كثير من الألقاب رُوي فيها أكثر من سبب، فالأحوط في الاختبار اختيار السبب الأشهر لا الغريب.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الشعر والشعراء لابن قتيبة، والأغاني لأبي الفرج، ومعجم الشعراء للمرزباني.</p></div>"},{"t":"أمّهات كتب الأدب والنقد ومؤلفوها","b":"\n<table><tr><th>الكتاب</th><th>المؤلف</th></tr>\n<tr><td>البيان والتبيين — البخلاء — الحيوان</td><td>الجاحظ</td></tr>\n<tr><td>الشعر والشعراء — عيون الأخبار</td><td>ابن قتيبة</td></tr>\n<tr><td>طبقات فحول الشعراء</td><td>محمد بن سلّام الجُمَحي</td></tr>\n<tr><td>نقد الشعر</td><td>قُدامة بن جعفر</td></tr>\n<tr><td>الصناعتين: الكتابة والشعر</td><td>أبو هلال العسكري</td></tr>\n<tr><td>البديع</td><td>عبد الله بن المعتزّ</td></tr>\n<tr><td>أسرار البلاغة — دلائل الإعجاز</td><td>عبد القاهر الجرجاني</td></tr>\n<tr><td>الكامل في اللغة والأدب</td><td>المبرّد</td></tr>\n<tr><td>الأمالي</td><td>أبو علي القالي البغدادي</td></tr>\n<tr><td>العِقد الفريد</td><td>ابن عبد ربه الأندلسي</td></tr>\n<tr><td>رسالة الغفران — اللزوميات</td><td>أبو العلاء المعرّي</td></tr>\n<tr><td>رسالة التوابع والزوابع</td><td>ابن شُهَيد الأندلسي</td></tr>\n<tr><td>الأدب الكبير — الأدب الصغير — كليلة ودمنة (ترجمة)</td><td>ابن المقفّع</td></tr>\n<tr><td>الأيام (سيرة ذاتية)</td><td>طه حسين</td></tr>\n<tr><td>العَبَرات — النظرات</td><td>مصطفى لطفي المنفلوطي</td></tr>\n<tr><td>سارة (رواية)</td><td>عباس محمود العقاد</td></tr>\n<tr><td>الغِربال (نقد)</td><td>ميخائيل نعيمة</td></tr>\n<tr><td>زينب (أول رواية فنية حديثة)</td><td>محمد حسين هيكل</td></tr></table>\n<p><b>مقاييس المفاضلة عند ابن سلّام الجُمَحي:</b> اعتمد في «طبقات فحول الشعراء» على\n<b>كثرة الشعر وجودته</b> معًا، وعلى تعدد الأغراض، وعلى الشهرة والرواية الموثوقة — لا على غموض المعنى.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>النقد القديم تدرّج:</b> من الأحكام الجزئية الذوقية في أسواق العرب، إلى التأليف المنهجي في «طبقات فحول الشعراء» لابن سلّام، ثم «الشعر والشعراء»، ثم «نقد الشعر» لقدامة، ثم «الموازنة» للآمدي و«الوساطة» للجرجاني.</li><li><b>«الموازنة»</b> للآمدي بين الطائيَّين: أبي تمام والبحتري، ومال فيها إلى البحتري لعمود الشعر. و<b>«الوساطة»</b> للقاضي الجرجاني بين المتنبي وخصومه.</li><li><b>«دلائل الإعجاز»</b> للجرجاني في <b>المعاني</b> وأصل نظرية النظم، و<b>«أسرار البلاغة»</b> له في <b>البيان</b> (التشبيه والاستعارة والمجاز). والخلط بينهما من أكثر أخطاء الاختبارات.</li><li><b>«الأغاني»</b> لأبي الفرج الأصفهاني موسوعة أدبية تاريخية غنائية، و<b>«الكامل»</b> للمبرد، و<b>«البيان والتبيين»</b> للجاحظ، و<b>«العقد الفريد»</b> لابن عبد ربه الأندلسي.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: طبقات فحول الشعراء، والموازنة، والوساطة، ودلائل الإعجاز، وتاريخ النقد الأدبي.</p></div>"},{"t":"الأدب العربي الحديث — أوائل وفنون","b":"\n<ul>\n<li><b>أول رواية فنية حديثة</b> في الأدب العربي: «زينب» لـ<b>محمد حسين هيكل</b>.</li>\n<li><b>أول أديب عربي نال جائزة نوبل في الآداب:</b> <b>نجيب محفوظ</b> سنة ١٩٨٨.</li>\n<li><b>مترجم «الإلياذة»</b> إلى العربية شعرًا: <b>سليمان البستاني</b>.</li>\n<li><b>«الإلياذة الإسلامية»</b> وصفٌ أُطلق على ديوان «مجد الإسلام» لـ<b>أحمد مُحرَّم</b>،\nلأنه حاكى فيه الملحمة اليونانية بنَفَسٍ إسلامي.</li>\n<li><b>مصرع كليوباترا</b> مسرحية شعرية لـ<b>أحمد شوقي</b>، وهو رائد المسرح الشعري العربي.</li>\n<li><b>المقالة</b> فنٌّ نثري ظهر في <b>العصر الحديث</b> مرتبطًا بنشأة الصحافة.</li>\n</ul>\n<p><b>فنون النثر وتعريفاتها — فرقٌ يتكرر السؤال عنه:</b></p>\n<ul>\n<li><b>الخطبة:</b> كلام يُقال في مواجهة الجمهور لإقناعهم واستمالتهم.</li>\n<li><b>الوصية:</b> توجيه لفرد أو جماعة قولًا أو كتابةً، غالبًا عند فراق أو موت.</li>\n<li><b>الحكمة:</b> قول موجز يعبّر عن خلاصة تجربة إنسانية.</li>\n<li><b>المثل:</b> عبارة موجزة قيلت في موقف ما ثم شاعت فتُضرب في كل ما يشبهه.</li>\n</ul>\n<p><b>التعبير الوظيفي والإبداعي:</b> الوظيفي ما يُقضى به حاجة عملية — التقرير، الرسالة، الإعلان،\nاللافتة، البرقية، التلخيص، المحضر، طلب التوظف. والإبداعي ما يُعبَّر به عن الوجدان —\n<b>كتابة القصة</b> والخاطرة والشعر. ويُشترط في الكتابة الإبداعية حسن الصياغة وجودة الأسلوب\nوسُموّ المعنى <b>جميعًا</b>.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>أول رواية فنية ناضجة</b> في الأدب العربي «زينب» لمحمد حسين هيكل سنة ١٩١٤م، وتُعدّ «حديث عيسى بن هشام» للمويلحي حلقة وصل بين المقامة والرواية.</li><li><b>أول مسرحية عربية</b> «البخيل» لمارون النقاش في بيروت سنة ١٨٤٧م، ورائد المسرح النثري الفني توفيق الحكيم، ورائد المسرح الشعري أحمد شوقي.</li><li><b>فن المقال</b> نشأ مع الصحافة؛ ومن أعلامه المنفلوطي (المقال الأدبي الوجداني)، وطه حسين والعقاد (المقال الفكري النقدي).</li><li><b>الترجمة الذاتية (السيرة)</b> من أشهرها «الأيام» لطه حسين، و«حياتي» لأحمد أمين، و«سبعون» لميخائيل نعيمة.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: تاريخ الأدب العربي الحديث، وفنون النثر الحديث، ودراسات في الرواية العربية.</p></div>"},{"t":"مصطلحات نقدية","b":"\n<ul>\n<li><b>معنى «الأدب» في الجاهلية:</b> كان مرتبطًا بـ<b>المأدُبة</b>، أي الطعام الذي يُدعى إليه الناس؛\nفـ«أدَبَ» بمعنى صنع مأدبة أو دعا إليها. ثم تطور المعنى إلى التهذيب ثم إلى الفنون القولية.</li>\n<li><b>عمود الشعر:</b> مجموعة الخصائص التي جعلها النقاد معيارًا لجودة القصيدة العربية الموروثة،\nوقد فصّلها المرزوقي في مقدمة شرح الحماسة.</li>\n<li><b>الصعاليك:</b> شعراء جاهليون خلعتهم قبائلهم أو انخلعوا عنها، غلب على شعرهم الفقر والثورة\nعلى أعراف القبيلة. ومن أشهرهم <b>عروة بن الورد</b> والشنفرى وتأبط شرًّا.</li>\n<li><b>النقائض:</b> فنّ أموي قائم على المعارضة الشعرية في الوزن والقافية مع الردّ والهجاء،\nوأقطابه جرير والفرزدق والأخطل.</li>\n<li><b>الشعر العذري:</b> شعر غزل عفيف ظهر في <b>العصر الأموي</b> في بادية الحجاز ونجد،\nيقوم على الوفاء لمحبوبة واحدة.</li>\n<li><b>أنسب مجالات النقد الأدبي:</b> النصوص الأدبية <b>الصادقة</b>، لأن النقد يقيس صدق التجربة\nوأصالة التعبير، ولا مجال له في الكتابة العلمية التقريرية.</li>\n</ul>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الوحدة العضوية</b> أن تكون القصيدة كائنًا حيًّا؛ لكل جزء وظيفة لا يقوم غيره مقامه، ويترتّب على حذف بيت أو تقديمه اختلال المعنى. وهي من دعوات مدرسة الديوان.</li><li><b>عمود الشعر</b> ثمانية أسس لخّصها المرزوقي: شرف المعنى وصحّته، وجزالة اللفظ واستقامته، والإصابة في الوصف، والمقاربة في التشبيه، والتحام أجزاء النظم، ومناسبة المستعار منه للمستعار له، ومشاكلة اللفظ للمعنى، ومشاكلتهما للقافية.</li><li><b>السرقات الأدبية</b> مراتب: النسخ (أخذ اللفظ والمعنى)، والمسخ (أخذ المعنى مع تغيير اللفظ تغييرًا يُفسده)، والسلخ (أخذ بعض المعنى). ويقابلها «التوارد» وهو اتفاق من غير قصد.</li><li><b>التناص</b> مصطلح نقدي حديث يعني تداخل النصوص، وهو غير السرقة لأنه لا يتضمّن حكمًا أخلاقيًّا.</li><li><b>الصورة الشعرية</b> أعمّ من التشبيه والاستعارة؛ فهي كل تشكيل لغوي يُثير في الذهن صورة حسّية أو شعورية.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: منهاج البلغاء لحازم القرطاجني، وشرح ديوان الحماسة للمرزوقي، والنقد الأدبي الحديث.</p></div>"}]},{"c":"lugh","n":"الأصوات والمعاجم والدلالة","q":[{"q":"كم عدد حروف اللغة العربية؟","a":"ثمانية وعشرون","e":"هذا هو العدد المشهور لحروف الهجاء. وتصير تسعة وعشرين إذا عُدّت الهمزة حرفًا مستقلًّا عن الألف، وهو ما جرى عليه بعض من رتّب الترتيب الهجائي.","d":["لغة الضاد","عالٍ رفيع جليل","الصاد والزاي والسين"]},{"q":"حروف المدّ في اللغة العربية هي…","a":"الألف والواو والياء","e":"بشرط أن تكون ساكنة وأن تُجانس حركة ما قبلها: الألف بعد فتح، والواو بعد ضم، والياء بعد كسر. ومخرجها الجوف، ولذلك سُمّيت الحروف الجوفية أو الهوائية.","d":["متكبّر متعجرف","الصاد والزاي والسين","يأثم ويُذنب"]},{"q":"ما حروف الحلق؟","a":"ستة: الهمزة والهاء (أقصى الحلق)، العين والحاء (وسطه)، الغين والخاء (أدناه)","e":"وقد جُمعت في قولهم: «أخي هاك علمًا حازه غير خاسر». ومعرفتها مهمة لأن الإظهار الحلقي في أحكام النون الساكنة معلَّق عليها.","d":["دائم أبديّ لا ينقطع","القلقلة (ومخرجه وسط اللسان)","اغتابه ونال من عِرضه"]},{"q":"ما حروف القلقلة؟","a":"خمسة: ق ط ب ج د — مجموعة في «قُطْب جَدّ»","e":"والقلقلة اضطراب المخرج عند سكون الحرف حتى تُسمع له نبرة قوية. وسببها اجتماع صفتَي الشدة والجهر فيها، فلا يجري معها نَفَس ولا صوت.","d":["البحث في الشبكة (الإنترنت)","القلقلة (ومخرجه وسط اللسان)","عامية دارجة / عربية ركيكة"]},{"q":"مخرج حرف الحاء","a":"الحلق (وسطه)","e":"فهو مع العين من وسط الحلق. وليس من اللسان ولا من الشفتين ولا من الحنك، وهذا ما يُستبعَد به سائر الخيارات.","d":["فتَحَ وشقَّ","الألف والواو والياء","شفوية أسنانية"]},{"q":"مخرج حرف الفاء","a":"شفوية أسنانية","e":"لأنه يخرج من باطن الشفة السفلى مع أطراف الثنايا العليا. فهو الحرف الوحيد الذي يجمع بين الشفة والسنّ في العربية.","d":["مكان خالٍ مهجور","عالٍ رفيع جليل","الصاد والزاي والسين"]},{"q":"مخرج حرف القاف","a":"لَهَوي — من أقصى اللسان مع ما يحاذيه من الحنك","e":"وهو أعمق مخارج اللسان، يليه الكاف. وسُمّي لَهَويًّا لقربه من اللهاة.","d":["راضٍ بما قُسم له","جَلَّ (ج ل ل)","اغتابه ونال من عِرضه"]},{"q":"حرف الجيم من حروف…","a":"القلقلة (ومخرجه وسط اللسان)","e":"فهو مع الشين والياء غير المدية من وسط اللسان، ويُسمّى شجريًّا. وهو من حروف القلقلة الخمسة لاجتماع الشدة والجهر فيه.","d":["كتب التراث والفهارس المتخصصة","أن يضع الكلمات في سياقات مختلفة","جَلَّ (ج ل ل)"]},{"q":"حرف الراء من حروف…","a":"التكرير","e":"وهو انفراد الراء بارتعاد طرف اللسان عند النطق بها ارتعادًا خفيفًا. والمطلوب في التجويد إخفاء هذا التكرير لا إظهاره.","d":["مُتعَب","اسكتْ","تضاد"]},{"q":"ما الحرف الذي ينفرد بصفة الاستطالة؟","a":"الضاد","e":"لامتداد الصوت من أول مخرجه إلى آخره على حافة اللسان مع الأضراس. ولانفراد العربية بهذا الحرف سُمّيت «لغة الضاد».","d":["الأسد","التكرير","اسكتْ"]},{"q":"ما الحرف الذي ينفرد بصفة التفشّي؟","a":"الشين","e":"لانتشار الهواء في الفم عند النطق بها. وهي رخوة مهموسة مستفلة، وتفشّيها من أظهر صفاتها.","d":["اسكتْ","الأسد","حرف"]},{"q":"حروف الصفير","a":"الصاد والزاي والسين","e":"ويظهر الصفير بقوة في الصاد ثم يضعف في الزاي ثم يزداد ضعفًا في السين على المشهور. وهي ثلاثتها من طرف اللسان مع الثنايا السفلى.","d":["ذكيّ عاقل حاذق","مغشوش غير حقيقي","لغة الضاد"]},{"q":"ماذا يُطلق على اللغة العربية؟","a":"لغة الضاد","e":"لأن حرف الضاد يكاد ينفرد به العرب دون سائر الأمم، ولصفة الاستطالة التي لا توجد في غيره. وأما القول بأنها أصعب لغات العالم فوصف انطباعي لا اصطلاح.","d":["أطال وأكثر","متكبّر متعجرف","الصاد والزاي والسين"]},{"q":"للكشف عن معنى «الإجلال» نرجع إلى مادة…","a":"جَلَّ (ج ل ل)","e":"لأننا نحذف الزوائد: أل والهمزة والألف، ثم نفكّ التضعيف فنصل إلى الأصل الثلاثي. ولا يصح الرجوع إلى «يجلّ» لأنه صيغة مضارع لا أصل مادة.","d":["أن يضع الكلمات في سياقات مختلفة","اغتابه ونال من عِرضه","عامية دارجة / عربية ركيكة"]},{"q":"«ألقت السفينة مراسيها على الشاطئ» — عبّر عنها بكلمة واحدة","a":"رَسَتْ","e":"لأن «رسا» فعل خاص بثبات السفينة وإرسائها، فيؤدي معنى الجملة كاملًا. أما «توقفت» و«وصلت» فأعمّ ولا يفيدان خصوصية إلقاء المراسي.","d":["الشين","مُتعَب","اسكتْ"]},{"q":"ما معنى «صَهْ»؟","a":"اسكتْ","e":"وهي اسم فعل أمر مبني على السكون، فاعله ضمير مستتر وجوبًا تقديره «أنت». ونظائرها: مَهْ بمعنى انكفف، وآمين بمعنى استجب.","d":["مُتعَب","الضاد","تضاد"]},{"q":"على ماذا يُطلق «الضِّرغام»؟","a":"الأسد","e":"وهو من أسماء الأسد الكثيرة في العربية ومنها الليث والهِزَبر والغَضَنفَر والأسامة. وكثرة الأسماء للأسد من شواهد الترادف في العربية.","d":["اسكتْ","حرف","الأَرَق"]},{"q":"«أفاض الشيخ في الحديث» — معنى «أفاض»","a":"أطال وأكثر","e":"من الفَيض وهو امتلاء الإناء حتى يسيل، فاستُعير لكثرة الكلام وبسطه. ولا يفيد اللفظ ذمًّا في أصله بل مجرد التوسع والإسهاب.","d":["فتَحَ وشقَّ","الألف والواو والياء","الحلق (وسطه)"]},{"q":"«ولَغ في دمه» — معناها","a":"اغتابه ونال من عِرضه","e":"والأصل في «ولَغ» أن يشرب الكلب بطرف لسانه، فاستُعيرت للنيل من الأعراض على سبيل التقبيح. والسياق يدل عليها إذ ذُكرت بعد إظهار المودة في الحضور.","d":["القلقلة (ومخرجه وسط اللسان)","عامية دارجة / عربية ركيكة","كتب التراث والفهارس المتخصصة"]},{"q":"معنى «شَجَن»","a":"همّ وحزن","e":"والشجن أيضًا الغصن المشتبك، ومنه قولهم «الحديث ذو شجون» أي يتشعب ويتداخل. والمعنى الغالب في الاستعمال هو الحزن والهمّ.","d":["فتَحَ وشقَّ","ثمانية وعشرون","شفوية أسنانية"]},{"q":"مضاد «الوَسَن»","a":"الأَرَق","e":"لأن الوسن أول النوم والنعاس، وضدّه امتناع النوم وهو الأرق. ومنه قوله تعالى «لا تأخذه سِنةٌ ولا نوم»، والسِّنة من الوسن.","d":["الشين","رَسَتْ","اسكتْ"]},{"q":"معنى «يَحنث»","a":"يأثم ويُذنب","e":"والأصل فيه نقض اليمين، ومنه «الحِنث في اليمين». ثم توسع الاستعمال فأُطلق على الإثم عامةً.","d":["ذكيّ عاقل حاذق","متكبّر متعجرف","همّ وحزن"]},{"q":"مرادف «فتَقَ»","a":"فتَحَ وشقَّ","e":"وضدّه «رتَقَ» بمعنى سدّ وأغلق. ومنه قوله تعالى في وصف السماوات والأرض بأنهما كانتا رتقًا ففُتقتا.","d":["شفوية أسنانية","أطال وأكثر","لغة الضاد"]},{"q":"مضاد «بالَغ»","a":"قلَّل","e":"لأن المبالغة زيادة وإفراط، وضدّها التقليل والتقصير. وأما «أحسن» و«بادر» فليستا من بابه في التقابل.","d":["الشين","الأَرَق","حرف"]},{"q":"مرادف «مُرهَق»","a":"مُتعَب","e":"من الإرهاق وهو تحميل ما لا يُطاق. و«مُرهَف» معناه رقيق حادّ، و«متوتر» حال نفسية، فلا يصلح أحدهما مرادفًا.","d":["قلَّل","حرف","التكرير"]},{"q":"مرادف «أريب»","a":"ذكيّ عاقل حاذق","e":"من الأَرَب وهو الحاجة والدهاء، ومنه «الأريب» للماهر في تدبير أمره. ويقاربه: لوذعيّ، ألمعيّ، فطِن.","d":["عالٍ رفيع جليل","همّ وحزن","يأثم ويُذنب"]},{"q":"مرادف «صَلِف»","a":"متكبّر متعجرف","e":"من الصَّلَف وهو مجاوزة القدر في الادّعاء. ويقاربه: ذو كِبر، مغرور، متغطرس، متبجّح.","d":["شفوية أسنانية","مغشوش غير حقيقي","ثمانية وعشرون"]},{"q":"مرادف «قَفْر»","a":"مكان خالٍ مهجور","e":"من القَفار وهي الأرض التي لا ماء فيها ولا نبات ولا أنيس. ومنه «أقفر» بمعنى خلا من أهله.","d":["مغشوش غير حقيقي","ذكيّ عاقل حاذق","الحلق (وسطه)"]},{"q":"مرادف «سامٍ»","a":"عالٍ رفيع جليل","e":"من السُّمُوّ وهو الارتفاع. ويُستعمل حسيًّا ومعنويًّا، فيقال: مكان سامٍ وخُلُق سامٍ.","d":["متكبّر متعجرف","يأثم ويُذنب","الألف والواو والياء"]},{"q":"مرادف «زائف»","a":"مغشوش غير حقيقي","e":"والأصل في الزَّيف ردّ الدرهم لغشّه، ثم عُمّم على كل ما خالف الحقيقة. ومنه «زيّف الكلام» أي أظهر بطلانه.","d":["ذكيّ عاقل حاذق","همّ وحزن","عالٍ رفيع جليل"]},{"q":"مرادف «نمطيّ»","a":"رتيب على وتيرة واحدة","e":"من النَّمَط وهو الضرب والنوع والطريقة. ويُستعمل حديثًا بمعنى الجمود على صورة مكررة بلا تجديد.","d":["البحث في الشبكة (الإنترنت)","لَهَوي — من أقصى اللسان مع ما يحاذيه من الحنك","اغتابه ونال من عِرضه"]},{"q":"مرادف «سرمديّ»","a":"دائم أبديّ لا ينقطع","e":"والسَّرمد دوام الزمان واتصاله. ومنه قوله تعالى في جعل الليل سرمدًا أي دائمًا لا نهار بعده.","d":["راضٍ بما قُسم له","البحث في الشبكة (الإنترنت)","جَلَّ (ج ل ل)"]},{"q":"مرادف «قانع»","a":"راضٍ بما قُسم له","e":"من القناعة وهي الرضا بالكفاف. وتنبّه إلى أن «قَنِع» بالكسر معناها رضي، و«قَنَع» بالفتح معناها سأل وتذلل — وهما ضدّان.","d":["خمسة: ق ط ب ج د — مجموعة في «قُطْب جَدّ»","رتيب على وتيرة واحدة","كتب التراث والفهارس المتخصصة"]},{"q":"«الخلاء والعمران» بينهما…","a":"تضاد","e":"فالخلاء الأرض القفر الخالية، والعمران المكان المأهول المبنيّ. واجتماع المتضادين في الكلام هو مبنى الطباق في علم البديع.","d":["الأَرَق","التكرير","الضاد"]},{"q":"أقسام الكلمة في اللغة العربية ثلاثة: اسم، فعل، و…","a":"حرف","e":"وليست الصفة ولا الجملة قسمًا رابعًا؛ فالصفة اسم، والجملة تركيب من هذه الأقسام. وهذا الحصر الثلاثي متفق عليه عند النحاة.","d":["تضاد","مُتعَب","الضاد"]},{"q":"اللغة المستخدمة في وسائل الإعلام لوصف المسابقات والمباريات","a":"عامية دارجة / عربية ركيكة","e":"لأن البث الحيّ وسرعة الوصف يدفعان المعلّق إلى التبسيط، فتتسرب العامية وتضعف الصياغة. وهي ليست علمية دقيقة ولا أدبية راقية، والمعوّل على صيغة الخيارات.","d":["راضٍ بما قُسم له","القلقلة (ومخرجه وسط اللسان)","البحث في الشبكة (الإنترنت)"]},{"q":"أفضل الطرق لتثبيت المترادفات في ذهن الطفل","a":"أن يضع الكلمات في سياقات مختلفة","e":"لأن المعنى في العربية يتحدد بالسياق لا بالحفظ المجرد، فالاستعمال المتنوع يرسّخ الفروق الدقيقة. أما السؤال المباشر عن المرادف أو المضاد فاختبار للحفظ لا تثبيت للمعنى.","d":["راضٍ بما قُسم له","اغتابه ونال من عِرضه","دائم أبديّ لا ينقطع"]},{"q":"أفضل وسيلة لمعرفة أهم الكتب الحديثة بسرعة","a":"البحث في الشبكة (الإنترنت)","e":"لأن المطلوب في السؤال قيد السرعة والحداثة معًا، والمعاجم والفهارس الورقية لا تواكب الجديد. أما كتب التراث فمظنّة القديم لا الحديث.","d":["جَلَّ (ج ل ل)","عامية دارجة / عربية ركيكة","راضٍ بما قُسم له"]},{"q":"إذا أردت البحث عن المخطوطات والمعقوفات ترجع إلى…","a":"كتب التراث والفهارس المتخصصة","e":"لأن المخطوطات شأن تراثي توثيقي، ومظانّها فهارس المكتبات ودور الوثائق. ولا تُغني عنها الكتب المدرسية ولا المراجع العامة.","d":["راضٍ بما قُسم له","رتيب على وتيرة واحدة","جَلَّ (ج ل ل)"]}],"r":[{"t":"مخارج الحروف العربية","b":"\n<p>مخارج الحروف عند علماء التجويد <b>سبعة عشر مخرجًا</b> موزعة على خمسة مواضع عامة:\nالجوف، والحلق، واللسان، والشفتان، والخيشوم.</p>\n<table><tr><th>الموضع</th><th>الحروف</th></tr>\n<tr><td><b>الجوف</b></td><td>حروف المدّ الثلاثة: الألف والواو والياء الساكنات</td></tr>\n<tr><td><b>أقصى الحلق</b></td><td>الهمزة والهاء</td></tr>\n<tr><td><b>وسط الحلق</b></td><td>العين والحاء</td></tr>\n<tr><td><b>أدنى الحلق</b></td><td>الغين والخاء</td></tr>\n<tr><td><b>أقصى اللسان (لَهَوي)</b></td><td>القاف ثم الكاف</td></tr>\n<tr><td><b>وسط اللسان (شَجري)</b></td><td>الجيم والشين والياء غير المدّية</td></tr>\n<tr><td><b>حافة اللسان</b></td><td>الضاد (مع الأضراس)، واللام</td></tr>\n<tr><td><b>طرف اللسان</b></td><td>النون، والراء، والطاء والدال والتاء (نِطعية)، والصاد والزاي والسين (أسَلية)</td></tr>\n<tr><td><b>بين طرف اللسان وأطراف الثنايا (لِثَوي)</b></td><td>الظاء والذال والثاء</td></tr>\n<tr><td><b>الشفتان</b></td><td>الباء والميم والواو (شفوية)، والفاء (شفوية أسنانية)</td></tr>\n<tr><td><b>الخيشوم</b></td><td>الغُنّة</td></tr></table>\n<p><b>مفاتيح الأسئلة:</b> الحاء <b>حلقية</b> (وسط الحلق) · القاف <b>لَهَوية</b> (أقصى اللسان) ·\nالفاء <b>شفوية أسنانية</b> · الجيم <b>شجرية</b> (وسط اللسان) · حروف الحلق ستة:\nأقصاه (ء، هـ) ووسطه (ع، ح) وأدناه (غ، خ).</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>المخارج سبعة عشر</b> على المذهب المختار (مذهب الخليل وابن الجزري)، وقيل ستة عشر (مذهب سيبويه بإسقاط الجوف)، وقيل أربعة عشر.</li><li><b>المخارج العامة خمسة:</b> الجوف، والحلق، واللسان، والشفتان، والخيشوم. وأكثرها فروعًا اللسان بعشرة مخارج.</li><li><b>حروف الحلق ستة</b> في ثلاثة مخارج: أقصاه الهمزة والهاء، ووسطه العين والحاء، وأدناه الغين والخاء. وهي سبب «الإظهار الحلقي» في التجويد.</li><li><b>حروف الجوف</b> هي حروف المدّ الثلاثة (الألف، والواو الساكنة المضموم ما قبلها، والياء الساكنة المكسور ما قبلها)، ولا مخرج لها محقّق بل تنتهي بانتهاء الهواء.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: سرّ صناعة الإعراب لابن جني، والعين للخليل، والنشر في القراءات العشر لابن الجزري.</p></div>"},{"t":"صفات الحروف","b":"\n<table><tr><th>الصفة</th><th>معناها</th><th>حروفها</th></tr>\n<tr><td>الهمس</td><td>جريان النَّفَس لضعف الاعتماد على المخرج</td><td>مجموعة في: «فحثّه شخصٌ سكت»</td></tr>\n<tr><td>الجهر</td><td>انحباس النَّفَس لقوة الاعتماد</td><td>بقية الحروف</td></tr>\n<tr><td>الشدة</td><td>انحباس الصوت ثم انطلاقه بقوة</td><td>مجموعة في: «أجِدْ قَطٍ بكتْ»</td></tr>\n<tr><td>التوسط</td><td>بين الشدة والرخاوة</td><td>«لن عمر» (ل ن ع م ر)</td></tr>\n<tr><td>الرخاوة</td><td>جريان الصوت</td><td>بقية الحروف</td></tr>\n<tr><td>الاستعلاء</td><td>ارتفاع معظم اللسان إلى الحنك</td><td>«خُصَّ ضَغطٍ قِظ»</td></tr>\n<tr><td>الاستفال</td><td>انخفاض اللسان</td><td>بقية الحروف</td></tr>\n<tr><td>الإطباق</td><td>انطباق اللسان على الحنك الأعلى</td><td>الصاد والضاد والطاء والظاء</td></tr>\n<tr><td>القلقلة</td><td>اضطراب المخرج عند سكون الحرف حتى يُسمع له نبرة</td><td>«قطب جد» (ق ط ب ج د)</td></tr>\n<tr><td>الصفير</td><td>صوت زائد يشبه الصفير</td><td>الصاد ثم الزاي ثم السين</td></tr>\n<tr><td>التكرير</td><td>ارتعاد طرف اللسان</td><td>الراء وحدها</td></tr>\n<tr><td>التفشّي</td><td>انتشار الهواء في الفم</td><td>الشين وحدها</td></tr>\n<tr><td>الاستطالة</td><td>امتداد الصوت من أول المخرج إلى آخره</td><td>الضاد وحدها</td></tr>\n<tr><td>الانحراف</td><td>ميل الصوت عن مخرجه إلى غيره</td><td>اللام والراء</td></tr>\n<tr><td>اللين</td><td>خروج الصوت بسهولة وامتداد</td><td>الألف والواو والياء</td></tr></table>\n<p><b>عدد حروف الهجاء العربية ثمانية وعشرون</b> حرفًا، وتصير تسعة وعشرين بعدّ الهمزة مستقلةً عن الألف.\nو<b>حروف المدّ ثلاثة:</b> الألف والواو والياء الساكنات المجانِسة لحركة ما قبلها.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الصفات نوعان:</b> صفات لها ضدّ (الهمس والجهر، الشدّة والرخاوة والتوسّط، الاستعلاء والاستفال، الإطباق والانفتاح، الإذلاق والإصمات)، وصفات لا ضدّ لها (الصفير، القلقلة، اللين، الانحراف، التكرير، التفشّي، الاستطالة، الغنّة).</li><li><b>حروف الهمس عشرة</b> يجمعها: «فحثّه شخص سكت»، وما عداها مجهور.</li><li><b>حروف القلقلة خمسة</b> يجمعها: «قطب جد»، وهي شديدة مجهورة تحتاج إلى اضطراب عند سكونها.</li><li><b>حروف الاستعلاء سبعة</b> يجمعها: «خصّ ضغط قظ»، وأربعة منها مطبقة: «ص ض ط ظ».</li><li><b>فائدة لغوية:</b> دلّ ابن جني على أن تناسب الأصوات يُناسب المعاني، فما كان من الحروف شديدًا جاء في معاني القوة غالبًا، وهو باب «الاشتقاق الأكبر».</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: سرّ صناعة الإعراب، والخصائص لابن جني، والنشر لابن الجزري.</p></div>"},{"t":"المعاجم وطرق الكشف فيها","b":"\n<p><b>أنواع المعاجم بحسب الترتيب:</b></p>\n<ul>\n<li><b>معاجم المخارج الصوتية:</b> رتّبت المواد على مخارج الحروف من أقصى الحلق إلى الشفتين.\nرائدها «العين» للخليل بن أحمد.</li>\n<li><b>معاجم القافية (آخر الأصول):</b> يُنظر فيها إلى الحرف الأخير بابًا والأول فصلًا.\nومنها «الصحاح» للجوهري و«لسان العرب» لابن منظور و«القاموس المحيط» للفيروزآبادي.</li>\n<li><b>معاجم أوائل الأصول (الهجائي المعتاد):</b> يُنظر إلى الحرف الأول ثم ما يليه.\nومنها «أساس البلاغة» للزمخشري و«المعجم الوسيط».</li>\n</ul>\n<p><b>خطوات الكشف:</b> ردّ الكلمة إلى <b>مجردها الثلاثي</b> بحذف الزوائد،\nثم ردّ حرف العلة إلى أصله، ثم فكّ التضعيف.</p>\n<p><b>تطبيق:</b> للكشف عن «الإجلال» نحذف الزوائد (أل والهمزة والألف) فيبقى «ج ل ل»،\nثم نفكّ التضعيف فنرجع إلى مادة <b>«جَلَّ»</b>. فلا يصح البحث عنها في «يجلّ» لأنه مضارع\nولا في «أجلّ» لأنه مزيد.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>مدارس المعاجم أربع:</b> مدرسة التقليبات الصوتية (العين للخليل، والمحيط للصاحب بن عبّاد، والمحكم لابن سيده)، ومدرسة القافية (الصحاح للجوهري، ولسان العرب، والقاموس المحيط، وتاج العروس)، ومدرسة الأبجدية العادية (أساس البلاغة للزمخشري، والمصباح المنير)، ومدرسة الموضوعات (فقه اللغة للثعالبي، والمخصّص لابن سيده).</li><li><b>الكشف في معاجم القافية</b> يكون بالحرف الأخير بابًا، والأول فصلًا؛ فكلمة «كتب» تُكشف في باب الباء فصل الكاف.</li><li><b>تجريد الكلمة قبل الكشف:</b> تُردّ إلى مجرّدها، وتُردّ حروف العلة إلى أصولها بالمصدر أو المضارع، ويُفكّ المدغم. فـ«مُستشار» ← «شور»، و«اتّصال» ← «وصل»، و«مدّ» ← «مدد».</li><li><b>أساس البلاغة فريد</b> في عنايته بالاستعمال المجازي والحقيقي، فهو معجم بلاغي لا لغوي محض.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: مقدمة العين، والمزهر للسيوطي، والمعجم العربي نشأته وتطوّره.</p></div>"},{"t":"الترادف والتضاد والاشتراك اللفظي","b":"\n<ul>\n<li><b>الترادف:</b> تعدد الألفاظ واتحاد المعنى — أسد، ليث، ضِرغام، هِزَبر.</li>\n<li><b>التضاد:</b> دلالة اللفظ الواحد على معنيين متقابلين — «الجَون» للأبيض وللأسود.\nويُطلق التضاد أيضًا على تقابل لفظين في المعنى، كالخلاء والعُمران.</li>\n<li><b>الاشتراك اللفظي:</b> دلالة اللفظ الواحد على أكثر من معنى بلا تقابل — «العين» للباصرة\nوللجاسوس وللينبوع وللذهب.</li>\n</ul>\n<p><b>مفردات يتكرر السؤال عنها:</b></p>\n<table><tr><th>الكلمة</th><th>معناها</th></tr>\n<tr><td>صَهْ</td><td>اسم فعل أمر بمعنى: اسكتْ</td></tr>\n<tr><td>الضِّرغام</td><td>الأسد</td></tr>\n<tr><td>أفاض في الحديث</td><td>أطال وأكثر</td></tr>\n<tr><td>ولَغ في دمه</td><td>اغتابه ونال من عِرضه</td></tr>\n<tr><td>رست السفينة</td><td>ثبتت وألقت مراسيها</td></tr>\n<tr><td>شَجَن</td><td>همّ وحزن</td></tr>\n<tr><td>الوَسَن</td><td>النُّعاس وأول النوم — وضدّه الأرق</td></tr>\n<tr><td>يَحنث</td><td>يأثم ويُذنب (ومنه الحِنث في اليمين)</td></tr>\n<tr><td>فتَقَ</td><td>شقَّ وفتح — وضدّه رتَقَ</td></tr>\n<tr><td>بالَغ</td><td>أكثر وزاد — وضدّه قلّل</td></tr>\n<tr><td>أريب</td><td>ذكيّ عاقل حاذق</td></tr>\n<tr><td>صَلِف</td><td>متكبّر متعجرف ذو كِبر</td></tr>\n<tr><td>قَفْر</td><td>مكان خالٍ مهجور جَدب</td></tr>\n<tr><td>سامٍ</td><td>عالٍ رفيع جليل</td></tr>\n<tr><td>زائف</td><td>مغشوش غير حقيقي</td></tr>\n<tr><td>نمطيّ</td><td>رتيب على وتيرة واحدة</td></tr>\n<tr><td>سرمديّ</td><td>دائم أبديّ</td></tr>\n<tr><td>قانع</td><td>راضٍ بما قُسم له</td></tr>\n<tr><td>مُرهَق</td><td>متعَب</td></tr></table>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>الترادف</b> دلالة لفظين فأكثر على معنى واحد؛ وأنكره بعضهم (ابن فارس، أبو هلال) وقالوا: لكلّ لفظ ظلّ معنى يخصّه، فـ«القعود» غير «الجلوس» عندهم.</li><li><b>أسباب الترادف:</b> اختلاف اللهجات القبلية، ودخول الدخيل، ونسيان الوصف الأصلي حتى صار علمًا على الذات.</li><li><b>الأضداد</b> أن يدلّ اللفظ على معنى وضدّه («الجون» للأبيض والأسود، «القُرء» للحيض والطهر). وأسبابه: اختلاف اللهجات، والتفاؤل، والتطوّر الدلالي.</li><li><b>الاشتراك اللفظي</b> دلالة اللفظ الواحد على معنيين فأكثر بوضعين مختلفين («العين»). والفرق بينه وبين المجاز: المشترك موضوع للمعنيين حقيقةً، والمجاز موضوع لأحدهما.</li><li><b>التطوّر الدلالي أربعة أنواع:</b> تعميم الدلالة، وتخصيصها، وانتقالها، وانحطاطها أو رقيّها.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: الصاحبي في فقه اللغة لابن فارس، والمزهر للسيوطي، والأضداد لابن الأنباري، وعلم الدلالة.</p></div>"},{"t":"مستويات اللغة واستعمالاتها","b":"\n<p><b>مستويات الأداء اللغوي:</b> فصحى التراث، وفصحى العصر، واللغة الوسطى،\nوالعامية المثقفة، والعامية الدارجة.</p>\n<p><b>لغة الإعلام الرياضي:</b> الغالب عليها في وصف المباريات والمسابقات أنها ليست أدبية راقية\nولا علمية دقيقة، وإنما تميل إلى <b>التبسيط والركاكة وتسرّب العامية</b> لسرعة الأداء وضغط البثّ الحيّ.\nوهذا ما يُلتمس في خيارات هذا السؤال.</p>\n<p><b>لماذا سُمّيت العربية «لغة الضاد»؟</b> لأن <b>الضاد</b> حرف تكاد تنفرد به العربية بين اللغات،\nوله صفة <b>الاستطالة</b> التي لا توجد في غيره، فصار علامةً عليها.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>مستويات الأداء اللغوي:</b> الفصحى التراثية، والفصحى المعاصرة (لغة الصحافة والإعلام)، والعامية المثقّفة، والعامية الدارجة. ولكل مقام مستوى.</li><li><b>الازدواج اللغوي والثنائية:</b> الازدواج وجود مستويين لِلغة واحدة (فصحى وعامية)، والثنائية وجود لغتين مختلفتين في مجتمع واحد.</li><li><b>الخطأ الشائع</b> ليس كلّه خطأ؛ فمنه ما أجازته المجامع على التوسّع أو على لغة قليلة، ومنه ما بقي خطأ. والحكم يحتاج إلى مراجعة قرارات المجمع.</li><li><b>اللحن نوعان:</b> لحن جليّ (خطأ في الإعراب يُخلّ بالمعنى) ولحن خفيّ (خطأ في أداء الحروف وصفاتها)، والتقسيم أصله في التجويد ثم استُعمل في اللغة.</li></ol><p class=\"src\">مظانّ المسألة ومواضع بسطها: المزهر، وفقه اللغة للثعالبي، وقرارات مجمع اللغة العربية، وعلم اللغة الاجتماعي.</p></div>"}]},{"c":"turq","n":"طرق التدريس","q":[{"q":"ما الطريقة التي تنتقل من الجزئي إلى الكلي ومحورها المتعلم؟","a":"الطريقة الاستقرائية","e":"لأنها تبدأ بالأمثلة الجزئية ثم توازن بينها حتى يستنبط المتعلم القاعدة الكلية بنفسه. ولذلك كان محورها المتعلم لا المعلم، وهذا أهم ما يميزها عن القياسية.","d":["لماذا؟ وكيف؟","التعبير الوظيفي","السرعة وقلة الجهد"]},{"q":"ما عيوب الطريقة الاستقرائية؟","a":"البطء، وعدم ضمان وصول جميع الطلبة إلى الاستنتاج نفسه","e":"لأن الاستنباط يحتاج وقتًا طويلًا في العرض والموازنة. ولأن قدرات المتعلمين متفاوتة فقد يصل بعضهم إلى نتيجة ناقصة أو مغايرة.","d":["صعوبة الحصول على نص متكامل، وتكلّف النصوص المصنوعة","إلغاء دور المتعلم، ومخالفة التدرج من الأسهل إلى الأصعب","قياس قدرة التلاميذ على تحصيل المادة والحكم عليهم"]},{"q":"ما الطريقة التي تنتقل من الحكم على الكل إلى الحكم على الجزء؟","a":"الطريقة القياسية","e":"فهي تبدأ بعرض القاعدة الكلية ثم تنزل إلى الأمثلة الجزئية المنطبقة عليها. والمعلم فيها هو المحور لأنه يلقّن النتائج مباشرة.","d":["الحرة والمضبوطة (الموجَّهة)","السرعة وقلة الجهد","التعبير الوظيفي"]},{"q":"ما عيوب الطريقة القياسية؟","a":"إلغاء دور المتعلم، ومخالفة التدرج من الأسهل إلى الأصعب","e":"فهي تجعله أداة حفظ لا مشاركًا فاعلًا. وتبدأ بالقاعدة المجردة وهي الأصعب ثم تنزل إلى المثال المحسوس وهو الأسهل، فتعكس قانون التعلم الطبيعي.","d":["قياس قدرة التلاميذ على تحصيل المادة والحكم عليهم","صعوبة الحصول على نص متكامل، وتكلّف النصوص المصنوعة","البطء، وعدم ضمان وصول جميع الطلبة إلى الاستنتاج نفسه"]},{"q":"ما مزايا الطريقة القياسية؟","a":"السرعة وقلة الجهد","e":"فالمعلم يوصل فكرته في أقصر وقت ممكن، ولا تحتاج جهدًا كبيرًا منه ولا من المتعلم. ولذلك يفضّلها كثير من المدرسين في الفصول المزدحمة وضيق الوقت.","d":["طريقة الحوار والمناقشة","الحرة والمضبوطة (الموجَّهة)","المِران وتقليد النماذج"]},{"q":"ما الطريقة التي ترتكز على اختيار نصوص متصلة المعنى متكاملة الموضوع؟","a":"طريقة الأساليب المتصلة (النص المعدَّلة)","e":"فهي تستخرج الشواهد من نص واحد مترابط بدل أمثلة متفرقة. وبهذا تربط القاعدة بالتعبير الصحيح وتصل اللغة بالحياة اليومية.","d":["قول موجز يعبّر عن خلاصة تجربة","عبارة موجزة قيلت في موقف ما ثم شاعت","وضع الكلمات في سياقات مختلفة"]},{"q":"ما الفرق بين طريقة النص والطريقة الاستقرائية؟","a":"ترابط النص وتكامل معناه","e":"فكلتاهما تنتقل من الأمثلة إلى القاعدة، لكن نصوص طريقة النص متماسكة تؤدي معنًى كاملًا. أما أمثلة الاستقرائية فمتفرقة لا رابط بينها.","d":["كلام يُقال في مواجهة الجمهور","عبارة موجزة قيلت في موقف ما ثم شاعت","قول موجز يعبّر عن خلاصة تجربة"]},{"q":"ما عيوب طريقة الأساليب المتصلة؟","a":"صعوبة الحصول على نص متكامل، وتكلّف النصوص المصنوعة","e":"لأن جمع الشواهد المطلوبة في نص واحد مترابط أمر عسير. ولذلك يلجأ المؤلف إلى صناعة النص صناعةً، فيبدو متكلَّفًا بعيدًا عن السليقة.","d":["قياس قدرة التلاميذ على تحصيل المادة والحكم عليهم","البطء، وعدم ضمان وصول جميع الطلبة إلى الاستنتاج نفسه","إلغاء دور المتعلم، ومخالفة التدرج من الأسهل إلى الأصعب"]},{"q":"ما الطريقة التي تُعدّ أساس معظم طرق التدريس الحديثة؟","a":"طريقة الحوار والمناقشة","e":"لأنها تقوم على التفاعل والاتصال اللغوي داخل الصف. وتعلّم المتعلم احترام الرأي والرأي الآخر، وتنمّي مهارتي التحليل والمحاجّة.","d":["الطريقة الاستقرائية","المِران وتقليد النماذج","لماذا؟ وكيف؟"]},{"q":"ما نوعا المناقشة؟","a":"الحرة والمضبوطة (الموجَّهة)","e":"فالحرة يُترك فيها مجال القول مفتوحًا ويُتوصَّل من خلالها إلى أهداف جديدة مبتكرة. والموجَّهة يوجّه فيها المعلم النقاش نحو قضية محددة سلفًا.","d":["الطريقة الاستقرائية","لماذا؟ وكيف؟","التعبير الوظيفي"]},{"q":"ما غاية طريقة التسميع والحفظ؟","a":"قياس قدرة التلاميذ على تحصيل المادة والحكم عليهم","e":"وهي تصلح لتثبيت المحفوظات من القصائد والآيات والشواهد. ولا تصلح أساسًا لتدريس القواعد لأنها لا تنمّي الفهم ولا تورث مهارة التطبيق.","d":["البطء، وعدم ضمان وصول جميع الطلبة إلى الاستنتاج نفسه","صعوبة الحصول على نص متكامل، وتكلّف النصوص المصنوعة","إلغاء دور المتعلم، ومخالفة التدرج من الأسهل إلى الأصعب"]},{"q":"أسلوب استفهام تستخدمه لتنمية التفكير لدى المتعلم","a":"لماذا؟ وكيف؟","e":"لأنهما سؤالان مفتوحان يطالبان بالتعليل وبيان الكيفية، فينقلان المتعلم من مستوى التذكر إلى مستوى التحليل. أما «هل» وأسئلة «متى وأين» فتقيس الاستدعاء وحده.","d":["الطريقة القياسية","المِران وتقليد النماذج","الطريقة الاستقرائية"]},{"q":"أفضل طريقة لتثبيت المترادفات في ذهن الطفل","a":"وضع الكلمات في سياقات مختلفة","e":"لأن المعنى في العربية يتحدد بالسياق، فالاستعمال المتنوع يُظهر الفروق الدقيقة بين المترادفات. أما سؤاله عن الجمع أو المضاد فاختبار لمعلومة لا ترسيخ لمعنى.","d":["حسن الصياغة وجودة الأسلوب وسموّ المعنى جميعًا","ترابط النص وتكامل معناه","الاستماع ثم التحدث ثم القراءة ثم الكتابة"]},{"q":"لتحسين الخط لدى الطلاب يُفضَّل…","a":"المِران وتقليد النماذج","e":"لأن التدريب وحده بلا نموذج صحيح يثبّت الخطأ ويرسّخه، والنموذج وحده بلا تدريب لا يُكسب مهارة. فالجمع بينهما هو السبيل، والخط مهارة مكتسبة لا موهبة فطرية.","d":["الحرة والمضبوطة (الموجَّهة)","الطريقة القياسية","لماذا؟ وكيف؟"]},{"q":"كتابة القصة من موضوعات التعبير…","a":"الإبداعي","e":"لأنها تعبير عن الوجدان والخيال بلغة موحية، وغايتها التأثير الفني. أما التعبير الوظيفي فيؤدي حاجة عملية كالرسالة والتقرير والإعلان والبرقية.","d":["الخطبة","التكاملي","لماذا؟ وكيف؟"]},{"q":"كتابة الإعلان تندرج تحت…","a":"التعبير الوظيفي","e":"لأنه يؤدي وظيفة عملية محددة هي إبلاغ الناس بخبر أو سلعة. ومثله: اللافتة، والتقرير، والرسالة، والبرقية، والتلخيص، والتعليق، وطلب التوظّف.","d":["الطريقة القياسية","المِران وتقليد النماذج","الحرة والمضبوطة (الموجَّهة)"]},{"q":"في الكتابة الإبداعية ينبغي توافر…","a":"حسن الصياغة وجودة الأسلوب وسموّ المعنى جميعًا","e":"لأن الإبداع لا يقوم بأحد هذه الأركان منفردًا؛ فالمعنى السامي بصياغة رديئة لا يصل، والصياغة الجميلة بمعنى تافه لا تُغني. فالشروط مجتمعة لا مفترقة.","d":["كلام يُقال في مواجهة الجمهور","طريقة الأساليب المتصلة (النص المعدَّلة)","الاستماع ثم التحدث ثم القراءة ثم الكتابة"]},{"q":"ما المقصود بالخطبة؟","a":"كلام يُقال في مواجهة الجمهور","e":"غايته الإقناع والاستمالة، ويعتمد على قوة الحجة وحسن الإلقاء وحضور البديهة. ويُشترط فيها مراعاة حال السامعين والمقام.","d":["ترابط النص وتكامل معناه","توجيه لفرد أو جماعة قولًا أو كتابةً","الاستماع ثم التحدث ثم القراءة ثم الكتابة"]},{"q":"ما المقصود بالوصية؟","a":"توجيه لفرد أو جماعة قولًا أو كتابةً","e":"غالبًا عند فراق أو قرب موت، وتتضمن نصحًا وإرشادًا. وتمتاز بنبرة الشفقة وقصد النفع المجرد.","d":["وضع الكلمات في سياقات مختلفة","قول موجز يعبّر عن خلاصة تجربة","ترابط النص وتكامل معناه"]},{"q":"ما المقصود بالحكمة؟","a":"قول موجز يعبّر عن خلاصة تجربة","e":"تصدر عن ذي عقل وتجربة، ويُقصد بها التوجيه العام لا موقف بعينه. وبها يُعرف فضل التجربة الإنسانية المكثّفة في عبارة قصيرة.","d":["الاستماع ثم التحدث ثم القراءة ثم الكتابة","كلام يُقال في مواجهة الجمهور","توجيه لفرد أو جماعة قولًا أو كتابةً"]},{"q":"ما المقصود بالمثل؟","a":"عبارة موجزة قيلت في موقف ما ثم شاعت","e":"فيُضرب بها في كل موقف يشبه الأول. والفرق بينها وبين الحكمة أن للمثل مورِدًا ومضرِبًا، والحكمة لا مورد لها بل هي خلاصة تأمل.","d":["حسن الصياغة وجودة الأسلوب وسموّ المعنى جميعًا","الاستماع ثم التحدث ثم القراءة ثم الكتابة","ترابط النص وتكامل معناه"]},{"q":"«كلام يُقال لإقناع المستمعين في جمل قصيرة» — هذا تعريف…","a":"الخطبة","e":"لأن الخطابة فنّ مواجهة الجمهور بقصد الإقناع والاستمالة. وتميل إلى الجمل القصيرة المؤثرة لأنها شفوية تُلقى ويُراد لها أن تعلق بالأذهان.","d":["التكاملي","الإبداعي","المِران وتقليد النماذج"]},{"q":"اللغة العربية تُعتبر من أكثر اللغات تبعيةً للمنهج…","a":"التكاملي","e":"لأن فروعها — نحو وصرف وبلاغة وقراءة وتعبير وإملاء — متشابكة لا تُفهم منفردة. فالمنهج التكاملي يعالجها وحدةً واحدة تخدم مهارات اللغة الأربع.","d":["الخطبة","الإبداعي","السرعة وقلة الجهد"]},{"q":"ما مهارات اللغة الأربع وترتيب اكتسابها؟","a":"الاستماع ثم التحدث ثم القراءة ثم الكتابة","e":"فالاستماع والقراءة مهارتا استقبال، والتحدث والكتابة مهارتا إنتاج. والترتيب طبيعي يحاكي اكتساب الطفل للغته الأم، وعليه تُبنى المناهج الحديثة.","d":["عبارة موجزة قيلت في موقف ما ثم شاعت","حسن الصياغة وجودة الأسلوب وسموّ المعنى جميعًا","توجيه لفرد أو جماعة قولًا أو كتابةً"]}],"r":[{"t":"الطريقة الاستقرائية (الاستنباطية)","b":"\n<p>تسير من <b>الجزئي إلى الكلي</b>، ومن الأمثلة إلى القاعدة. يعرض المعلم أمثلة متنوعة،\nويوجّه التلاميذ إلى ملاحظتها وموازنتها، حتى يستنبطوا القاعدة بأنفسهم، ثم تُطبَّق.</p>\n<p><b>خطواتها:</b> التمهيد ← عرض الأمثلة ← الموازنة والربط ← استنباط القاعدة ← التطبيق.</p>\n<p><b>مزاياها:</b> تجعل <b>المتعلم</b> محور العملية التعليمية، وتعتمد على الملاحظة والمشاهدة،\nوترسّخ المعلومة لأن المتعلم توصّل إليها بنفسه، وترتّب الحقائق في ذهنه، وتجعل المادة مشوّقة محبّبة.</p>\n<p><b>عيوبها:</b> لا تضمن وصول جميع الطلبة إلى الاستنتاج نفسه، وهي <b>بطيئة</b> تستهلك وقتًا طويلًا\nفي إيصال المعلومة.</p>\n<div class=\"tnb\"><h4>تنبيهات ومسائل</h4><ol><li><b>مسارها من الجزئي إلى الكلّي</b>: أمثلة ← ملاحظة وموازنة ← استنباط القاعدة ← تطبيق. وهي تُنسب في أصولها التربوية إلى هربارت وخطواته الخمس.</li><li><b>مزيّتها الكبرى</b> أنها تجعل المتعلم مشاركًا في بناء المعرفة فتثبت القاعدة في ذهنه، ويُعابها طول الوقت وصعوبة تطبيقها في القواعد المتشعّبة.</li><li><b>شرط نجاحها</b> حُسن اختيار الأمثلة: أن تكون صحيحة فصيحة، مرتبطة بخبرة المتعلم، كافية للوصول إلى الحكم، خالية من الشواذّ.</li><li><b>تنبيه:</b> تُسمّى أيضًا «الطريقة الاستنباطية» و«طريقة القواعد بالأمثلة»، ويُخطئ من
